function renderRules(){let a=get('rules',[{name:'Работа',time:'09:00',zone:'America/New_York'}]);return a.map((r,i)=>`<div class="row">${text(r.name,r.time+' · '+r.zone)}<button class="mini" data-cmd="ruleedit:${i}">Изменить</button><button class="mini danger" data-cmd="ruledel:${i}" aria-label="Удалить">×</button></div>`).join('')+`<div class="form">${btn('+ Добавить правило','ruleadd')}</div>`}function findRow(id){for(const p of Object.values(pages))for(const g of p.groups)for(const r of g.rows)if(r.id===id)return r}function renderList(r){const a=get(r.id,r.def);return a.map((o,i)=>`<div class="row">${text(o)}<div class="inline"><button class="mini" data-cmd="move:${r.id}:${i}:-1" ${i===0?'disabled':''}>↑</button><button class="mini" data-cmd="move:${r.id}:${i}:1" ${i===a.length-1?'disabled':''}>↓</button><button class="mini" data-cmd="edit:${r.id}:${i}">✎</button><button class="mini danger" data-cmd="delete:${r.id}:${i}">×</button></div></div>`).join('')+`<div class="form">${btn('+ Добавить','add:'+r.id)}</div>`}function renderArchive(){const a=get('archived',[]);return a.length?a.map((o,i)=>`<div class="row">${text(o)}${btn('Восстановить','restore:'+i)}</div>`).join(''):'<div class="form desc">Нет архивированных категорий.</div>'}function renderIcons(){const arr=['⌂','★','●','■','◆','✚','☀','☾','♫','☕','✈','⚑','♡','⚙','⌚','✉','☁','♧','✓','◉','▣','▲','◎','◈'];const a=get('icons',arr.slice(0,8));return `<div class="form"><div class="seg">${arr.map(o=>`<button class="${a.includes(o)?'on':''}" data-cmd="icon:${o}" aria-pressed="${a.includes(o)}">${o}</button>`).join('')}</div><div class="actions">${btn('Сбросить','iconsreset')}</div><div class="desc">Условные иконки прототипа, не библиотека Fluent.</div></div>`}function renderNav(r){let a=get(r.id,r.def);let all=[...new Set([...a,'Учёт времени','Планы','Календарь','Заметки и списки','Люди','Paths','Виктор','Настройки','Ещё'])];return `<div class="form desc">Порядок меняется стрелками. Для обычных пунктов можно менять видимость; доступ к настройкам всегда сохраняется.</div>`+all.map((o,i)=>{const ix=a.indexOf(o),locked=o==='Настройки'||o==='Ещё';return `<div class="row">${text(o)}<input class="check" type="checkbox" data-nav="${r.id}" data-value="${esc(o)}" ${ix>=0?'checked':''} ${locked?'disabled':''} aria-label="Показывать ${esc(o)}"><button class="mini" data-cmd="move:${r.id}:${ix}:-1" ${ix<=0?'disabled':''}>↑</button><button class="mini" data-cmd="move:${r.id}:${ix}:1" ${ix<0||ix>=a.length-1?'disabled':''}>↓</button></div>`}).join('')}
function renderProvider(r){const id=r.id;const connected=get('connected_'+id,false);return `<div class="form"><div class="provider"><span class="avatar">${esc(r.label[0])}</span><div class="copy"><div class="label">${esc(r.label)}</div><div class="desc">${esc(r.extra)} · ${connected?'Подключено (демо)':'Не подключено (демо)'}</div></div></div><div class="actions">${id==='telegram'?btn('Выбрать JSON','importdemo','primary'):id==='device'?btn('Импортировать с устройства','importdemo','primary'):connected?btn('Отключить','disconnect:'+id,'danger')+btn('Обновить','sync'):btn('Подключить','connect:'+id,'primary')}</div></div>`}function renderCalendar(r){return renderRow({type:'checks',id:r.id,label:'Календари',options:['Основной','Рабочий','Личный'],def:['Основной']})+renderRow(S(r.id+'_cat','Категория импортированных событий',['Без назначения','Работа','Личное'],'Без назначения'))+`<div class="form actions">${btn('Синхронизировать сейчас','sync')}</div>`}function renderReview(r){let a=get(r.id,{});return ['Демо-контакт 1','Демо-контакт 2'].map((n,i)=>`<div class="form"><div class="label">${n}</div><div class="desc">${esc(a[i]||'Ожидает проверки')}</div><div class="actions">${['Добавить','Связать','Игнорировать','Блокировать','Вернуть на проверку'].map(o=>btn(o,`review:${r.id}:${i}:${o}`)).join('')}</div></div>`).join('')}
function sectionGroup(g){return `<section class="group"><h2>${esc(g.label)}</h2><div class="card">${g.rows.map(renderRow).join('')}</div></section>`}function homeContent(){return `<div id="homebody">${homeResults()}</div>`}function homeResults(){if(query.trim()){const q=query.toLowerCase().trim();let found=[];for(const [id,p] of Object.entries(pages)){if(['diagnostics','lab','voicediag'].includes(id)&&!get('demoAdmin',false))continue;if(p.title.toLowerCase().includes(q))found.push(link(id,p.title,rootOf(id)===id?'Раздел':pages[rootOf(id)]?.title||''));for(const g of p.groups)for(const r of g.rows)if(r.type!=='link'&&(`${r.label} ${r.desc||''} ${g.label} ${r.options||''}`).toLowerCase().includes(q))found.push(link(id,r.label,`${p.title} / ${g.label}`,r.id||''))}return `<div class="group"><h2>Результаты поиска · ${found.length}</h2><div class="card">${found.join('')||'<div class="form">Ничего не найдено</div>'}</div></div>`}return `<button class="profile" data-go="profile"><span class="avatar">${symbol('profile')}</span><div class="copy"><strong>${esc(get('name','Пользователь LIFE OS'))}</strong><div class="desc">Аккаунт и безопасность</div></div><span class="arrow">›</span></button>`+[['Организация',['planning','notes','categories']],['Автоматизация и данные',['notifications','integrations','activity']],['Приложение',['general','about']]].map(([name,ids])=>`<section class="group"><h2>${name}</h2><div class="card">${ids.map(id=>`<button class="row" data-go="${id}">${symbol(id)}${text(pages[id].title)}<span class="arrow">›</span></button>`).join('')}</div></section>`).join('')}
function render(){document.getElementById('side').innerHTML=`<div class="brand">LIFE OS</div><button class="nav ${current==='home'?'active':''}" data-go="home">${symbol('home')}Все настройки</button>`+roots.map(id=>`<button class="nav ${rootOf(current)===id?'active':''}" data-go="${id}">${symbol(id)}${esc(pages[id].title)}</button>`).join('')+``;document.getElementById('app').innerHTML=`<div class="top ${current==='home'&&searchOpen?'search-open':''}">${current!=='home'?`<button class="back" data-cmd="back" aria-label="Назад">${svg('back')}</button>`:''}<h1>${current==='home'?'Настройки':esc(pages[current].title)}</h1>${current==='home'?`<div class="header-search"><input type="search" id="search" placeholder="Найти настройку" value="${esc(query)}" aria-label="Поиск настроек" ${searchOpen?'':'disabled tabindex="-1"'}><button class="search-toggle" data-cmd="searchtoggle" aria-label="${searchOpen?'Закрыть поиск':'Найти настройку'}" aria-expanded="${searchOpen}">${searchOpen?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>':svg('search')}</button></div>`:''}<button class="theme-quick" data-cmd="themequick" aria-label="Переключить тему" title="Переключить тему">${document.documentElement.dataset.theme==='dark'?'☀':'☾'}</button></div>`+(current==='home'?homeContent():pages[current].groups.map(sectionGroup).join(''));}
function toggleSettingsSearch(){if(current!=='home')return;searchOpen=!searchOpen;const header=document.querySelector('.top'),field=document.getElementById('search'),toggle=header.querySelector('.search-toggle');header.classList.toggle('search-open',searchOpen);field.disabled=!searchOpen;field.tabIndex=searchOpen?0:-1;toggle.setAttribute('aria-expanded',String(searchOpen));toggle.setAttribute('aria-label',searchOpen?'Закрыть поиск':'Найти настройку');toggle.innerHTML=searchOpen?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>':svg('search');if(searchOpen){field.focus({preventScroll:true});}else{field.blur();query='';field.value='';document.getElementById('homebody').innerHTML=homeResults();toggle.focus({preventScroll:true});}window.scrollTo(0,0);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&searchOpen){e.preventDefault();toggleSettingsSearch();}});
function modal(title,body,save){let d=document.getElementById('dialog');d.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2>${body}<div class="actions"><button class="action" value="cancel">Отмена</button><button class="action primary" value="save">Сохранить</button></div></form>`;d.showModal();d.onclose=()=>{if(d.returnValue==='save')save(d);d.onclose=null}}function editRule(i){let a=get('rules',[{name:'Работа',time:'09:00',zone:'America/New_York'}]);let r=a[i]||{name:'',time:'09:00',zone:'Europe/Moscow'};modal('Правило времени',`<label>Категория<input type="text" id="mname" value="${esc(r.name)}" required></label><label>Время<input type="time" id="mtime" value="${esc(r.time)}" required></label><label>Часовой пояс<select id="mzone">${['Europe/Moscow','Europe/Warsaw','America/New_York','Europe/London','Asia/Dubai','UTC'].map(z=>`<option ${r.zone===z?'selected':''}>${z}</option>`).join('')}</select></label>`,d=>{let name=d.querySelector('#mname').value.trim();if(!name)return;let x={name,time:d.querySelector('#mtime').value,zone:d.querySelector('#mzone').value};let n=[...a];if(i<0)n.push(x);else n[i]=x;set('rules',n)})}
function command(c){const [cmd,id,i0,delta]=c.split(':'),i=Number(i0);if(cmd==='back')return back();if(cmd==='searchtoggle')return toggleSettingsSearch();if(cmd==='choice')return openSettingChoice(id);if(cmd==='themequick')return set('theme',document.documentElement.dataset.theme==='dark'?'Светлая':'Тёмная');if(cmd==='ruleadd')return editRule(-1);if(cmd==='ruleedit')return editRule(Number(id));if(cmd==='ruledel'){let a=[...get('rules',[{name:'Работа',time:'09:00',zone:'America/New_York'}])];a.splice(Number(id),1);return set('rules',a)}if(['add','edit','delete','move'].includes(cmd)){let r=findRow(id);if(!r)return;let a=[...get(id,r.def)];if(cmd==='move'){let j=i+Number(delta);if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];set(id,a)}return}if(cmd==='delete'){if(!confirm(id==='categoryitems'?'Архивировать категорию?':'Удалить элемент прототипа?'))return;if(id==='categoryitems')state.archived=[...get('archived',[]),a[i]];a.splice(i,1);return set(id,a)}return modal(cmd==='add'?'Добавить':'Редактировать',`<label>Название<input type="text" id="nameEdit" required value="${esc(cmd==='edit'?a[i]:'')}"></label>`,d=>{let v=d.querySelector('#nameEdit').value.trim();if(!v)return;if(cmd==='edit')a[i]=v;else a.push(v);set(id,a)})}if(cmd==='restore'){let a=[...get('archived',[])],n=a.splice(Number(id),1)[0];state.archived=a;return set('categoryitems',[...get('categoryitems',findRow('categoryitems').def),n])}if(cmd==='icon'){let a=get('icons',['⌂','★','●','■','◆','✚','☀','☾','♫'].slice(0,8));return set('icons',a.includes(id)?a.filter(x=>x!==id):[...a,id])}if(cmd==='iconsreset')return set('icons',['⌂','★','●','■','◆','✚','☀','☾']);if(cmd==='connect'||cmd==='disconnect')return set('connected_'+id,cmd==='connect');if(cmd==='review'){let a={...get(id,{})};a[i]=delta==='Вернуть на проверку'?'Ожидает проверки':delta;return set(id,a)}if(cmd==='reset'){if(confirm('Сбросить все демонстрационные настройки?')){state={theme:'Тёмная'};applyTheme();render();toast('Демонстрационные значения сброшены')}return}if(cmd==='resethotkey')return set('hotkey','Ctrl+Shift+Space');if(cmd==='cleartracking'){if(confirm('Отключить демонстрационное отслеживание?'))set('tracking',false);return}if(cmd==='password')return modal('Изменение пароля · демо','<p class="desc">Не вводите настоящий пароль. Для проверки используйте произвольные данные.</p><input type="password" placeholder="Демо-пароль" required>',()=>toast('Демо: пароль не отправлен'));if(cmd==='recovery')return modal('Восстановление пароля · демо','<input type="email" value="demo@example.com" required>',()=>toast('Демо: письмо не отправлено'));if(cmd==='logout')return toast('Демо: настоящий сеанс не изменён');if(cmd==='permission')return toast('Демо: разрешения устройства не запрашиваются');if(cmd==='home')return toast('Демо: геолокация не запрашивается');if(cmd==='sync'||cmd==='importdemo')return toast('Демо: внешние данные не импортируются');if(cmd==='voicecheck')return toast('Демо: микрофон и распознавание не запускаются');toast('Демонстрационное действие выполнено')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go)return go(b.dataset.go,b.dataset.focus);if(b.dataset.cmd)return command(b.dataset.cmd);if(b.dataset.set&&b.dataset.value!==undefined)return set(b.dataset.set,b.dataset.value)});document.addEventListener('input',e=>{if(e.target.dataset.bound){updateDayBounds(e.target);return;}if(e.target.id==='search'){query=e.target.value;document.getElementById('homebody').innerHTML=homeResults()}});document.addEventListener('change',e=>{const x=e.target;if(x.dataset.bound){updateDayBounds(x);return;}if(x.hasAttribute('data-placement'))return set('placement',x.checked?'После последнего плана':'Ближайшее свободное время');if(x.dataset.check){let a=get(x.dataset.check,JSON.parse(x.dataset.default||'[]'));return set(x.dataset.check,x.checked?[...new Set([...a,x.dataset.value])]:a.filter(y=>y!==x.dataset.value))}if(x.dataset.nav){let r=findRow(x.dataset.nav),a=get(r.id,r.def);return set(r.id,x.checked?[...a,x.dataset.value]:a.filter(y=>y!==x.dataset.value))}if(x.dataset.set)return set(x.dataset.set,x.type==='checkbox'?x.checked:x.value,!x.dataset.norefresh)});current=pages[location.hash.slice(1)]?location.hash.slice(1):'home';render();

// Use actual desktop nav height, including wrapping or font scaling.
const settingsNav=document.getElementById('side');const updateSettingsNavHeight=()=>document.documentElement.style.setProperty('--settings-nav-height',getComputedStyle(settingsNav).display==='none'?'0px':settingsNav.getBoundingClientRect().height+'px');if(typeof ResizeObserver!=='undefined')new ResizeObserver(updateSettingsNavHeight).observe(settingsNav);window.addEventListener('resize',updateSettingsNavHeight);updateSettingsNavHeight();

const updateSettingsScroll=()=>document.documentElement.classList.toggle('settings-scrolled',window.scrollY>2);window.addEventListener('scroll',updateSettingsScroll,{passive:true});updateSettingsScroll();
</script></body></html>
