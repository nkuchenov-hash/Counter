<!DOCTYPE html>
<html>
<head>
  <!-- Replaced at build time. Production: flutter build web --base-href="/Counter/" -->
  <base href="/Counter/">
  <!--
    GitHub Pages project site: https://nkuchenov-hash.github.io/Counter/
    Local: flutter run (default base "/") or flutter build web --base-href="/" for static serve at root.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Life OS — time tracking, planning, and lists.">

  <!-- PWA / browser chrome (matches lib/core/app_colors.dart light shell) -->
  <meta name="theme-color" content="#111111">

  <!-- iOS Home Screen / standalone PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life OS">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Life OS</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shell-only: prevent white bars / browser chrome gaps around Flutter canvas on iPhone PWA.
       Flutter owns in-app safe areas via MediaQuery; do not add padding here. -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FAFAF8;
    }
    body {
      /* iOS standalone: fill dynamic viewport without double safe-area padding. */
      min-height: 100%;
      min-height: -webkit-fill-available;
    }
    flt-glass-pane, flutter-view, #flutter_view {
      background-color: #FAFAF8;
    }
  </style>

  <!-- Google Sign-In Web Client ID. Add authorized redirect URI in Google Cloud Console: https://nkuchenov-hash.github.io/Counter/ -->
  <!-- Never block the Flutter bootstrap on an external Google endpoint.
       Google auth scripts may be unavailable or slow on some networks. -->
  <script src="https://apis.google.com/js/api.js" async></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <meta name="google-signin-client_id" content="647328834111-9v6vqhi9p1bl1fg6cbc1huvdcvmc89tr.apps.googleusercontent.com">

  <!-- Yandex OAuth: set YANDEX_CLIENT_ID to your Yandex OAuth app client ID. In Yandex OAuth app settings add Callback URI: https://nkuchenov-hash.github.io/Counter/ and allow this origin. -->
  <meta name="yandex-oauth-client-id" content="YANDEX_CLIENT_ID">
</head>
<body>
  <!-- P0 warm reload: the release build versions Flutter JS assets in deploy.yml
       and uses --pwa-strategy=none. Do not unregister workers or erase Cache
       Storage on every page load; that forces fresh downloads on every reload.
       Legacy Flutter worker cleanup, if needed, belongs to a one-time migration. -->
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- If the app entrypoint cannot load at all, display a recoverable
       status rather than an indefinitely blank page. Flutter owns the UI
       once its view exists; this never covers an already mounted app. -->
  <script>
    (function () {
      var statusShown = false;
      function showBootFailure() {
        if (statusShown ||
            document.querySelector('flutter-view, flt-glass-pane')) return;
        statusShown = true;
        var panel = document.createElement('div');
        panel.id = 'lifeos-boot-recovery';
        panel.style.cssText =
          'position:fixed;inset:0;display:flex;align-items:center;' +
          'justify-content:center;background:#FAFAF8;color:#111;' +
          'font:16px/1.5 Arial,sans-serif;padding:24px;z-index:9999;';
        panel.innerHTML =
          '<div style="max-width:400px;text-align:center">' +
          '<h1 style="font-size:24px;margin:0 0 12px">LIFE OS</h1>' +
          '<p>Приложение не удалось загрузить. Проверьте подключение к сайту.</p>' +
          '<button id="lifeos-retry" style="cursor:pointer;font:inherit;' +
          'background:#111;color:#fff;border:0;border-radius:8px;' +
          'padding:12px 20px">Повторить загрузку</button>' +
          '</div>';
        document.body.appendChild(panel);
        document.getElementById('lifeos-retry').onclick = function () {
          window.location.reload();
        };
      }
      window.lifeosBootstrapFailed = showBootFailure;
      function removeBootFailure() {
        var panel = document.getElementById('lifeos-boot-recovery');
        if (panel) panel.remove();
      }
      window.addEventListener('flutter-first-frame', removeBootFailure);
      // If the engine attaches after the timeout, never leave the failure
      // panel on top of an otherwise usable Flutter application.
      new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          removeBootFailure();
        }
      }).observe(document.body, {childList: true, subtree: true});
      window.setTimeout(showBootFailure, 12000);
    })();
  </script>
  <script src="flutter_bootstrap.js?v=2028e9acc010956f93844ecec9887d8ac9d9e49d" async
          onerror="window.lifeosBootstrapFailed && window.lifeosBootstrapFailed()"></script>
</body>
</html>
