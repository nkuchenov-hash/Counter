  <!-- Silence Firebase SDK logs to reduce console noise (INITIALIZATION_GUARD / performance). -->

    (function() {
      try {
        if (typeof firebase !== 'undefined') {
          if (typeof firebase.setLogLevel === 'function') firebase.setLogLevel('silent');
          else if (firebase.app && typeof firebase.app.setLogLevel === 'function') firebase.app.setLogLevel('silent');
        }
      } catch (e) {}
    })();
  </script>
