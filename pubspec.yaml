name: counter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number instead.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish-app-updates#versioning
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. To see which dependencies have newer versions available, run `flutter pub outdated`.
dependencies:
  pocketbase: ^0.23.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.0.0

  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.4
  web: ^1.0.0
  google_sign_in: ^6.2.2
  intl: ^0.20.2
  omni_datetime_picker: ^2.3.1
  http: ^1.2.0
  flutter_secure_storage: ^10.0.0
  flutter_login_yandex: ^0.0.5
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  app_links: ^6.3.0
  local_auth: ^2.3.0
  timezone: ^0.10.0
  csv: ^6.0.0
  connectivity_plus: ^6.1.0
  wear: ^1.1.0
  rrule: ^0.2.18
  flutter_local_notifications: ^20.1.0
  flutter_timezone: ^5.0.2
  flutter_quill: ^11.5.0
  health: ^13.3.1
  workmanager: ^0.9.0+3
  hotkey_manager: ^0.2.3
  record: ^6.0.0
  audioplayers: ^6.7.1
  image_picker: ^1.2.3
  clipboard: ^3.0.14
  file_saver: ^0.4.0
  tray_manager: ^0.2.3
  window_manager: ^0.4.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided in the `analysis_options.yaml` file.
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

dependency_overrides:
  # 1.0.0+beta.8 header guard collides with local_auth_windows (Windows build break).
  speech_to_text_windows: 1.0.1

# For information on the generic Dart part, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is included with your application.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # For resolution-aware image variants, see:
  # https://flutter.dev/to/resolution-aware-images

  # For package asset references, see:
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts, add a fonts section here. For example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For package-provided fonts, see:
  # https://flutter.dev/to/font-from-package
