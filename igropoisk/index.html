<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игропоиск</title><meta name="description" content="Каталог игр, рейтинги, статьи, обзоры и гайды"><link rel="stylesheet" href="./styles.css?v=3"></head><body><div class="shell"><div class="topline"></div><header><div class="logo"><b>И</b>гропоиск</div><nav class="site-nav"><button data-nav="home">Главная</button><button data-nav="catalog">Каталог</button></nav><div class="global-search"><input id="global-search" placeholder="Название, жанр или студия"><button id="global-search-btn">⌕</button></div></header><main id="app"><div class="empty">Загрузка Игропоиска…</div></main><footer>Игропоиск — каталог игр, рейтинги и материалы. Все оценки показаны по шкале 0–10.</footer></div><script src="./app.js?v=3" defer></script><script>document.addEventListener('DOMContentLoaded',()=>{const i=document.getElementById('global-search'),b=document.getElementById('global-search-btn');const run=()=>{location.hash='catalog';setTimeout(()=>{const q=document.getElementById('q');if(q){q.value=i.value;q.dispatchEvent(new Event('input'))}},50)};b.onclick=run;i.addEventListener('keydown',e=>{if(e.key==='Enter')run()})});</script></body></html>
