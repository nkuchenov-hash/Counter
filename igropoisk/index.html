<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игропоиск</title><style>:root{--y:#ffca05;--l:#d8d8d2;--m:#696964;--bg:#f1f1ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#111}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;background:#fff;min-height:100vh}.top{height:5px;background:var(--y)}header{height:70px;display:flex;align-items:center;gap:26px;padding:0 32px;border-bottom:1px solid var(--l);position:sticky;top:0;background:#fff;z-index:40}.logo{font-size:27px;font-weight:900;letter-spacing:-1.5px}.logo b{background:var(--y);padding:3px 7px}nav{display:flex;gap:18px}nav button{border:0;background:none;padding:25px 0;font-weight:700}nav button.on{border-bottom:3px solid #111}.search{margin-left:auto;display:flex;border:1px solid #aaa;width:min(420px,38vw)}.search input{border:0;height:40px;flex:1;padding:0 12px}.search button{border:0;background:#111;color:#fff;width:44px}.page{display:none}.page.on{display:block}.content{padding:32px}.hero{display:grid;grid-template-columns:1.45fr .55fr}.heroimg{min-height:480px;background-position:center;background-size:cover}.herotxt{background:#151515;color:#fff;padding:40px 34px;display:flex;flex-direction:column;justify-content:flex-end}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--y);font-weight:800}h1{font-size:52px;line-height:.98;letter-spacing:-2.3px;margin:12px 0 16px}.desc{line-height:1.6;color:#ccc}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:3px solid #111;padding-bottom:9px;margin-bottom:17px}.head h2{margin:0;font-size:27px}.head span{font-size:12px;color:var(--m)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.game{cursor:pointer}.poster{aspect-ratio:2/3;position:relative;background:#ddd;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;right:0;top:0;min-width:48px;height:48px;padding:0 7px;background:var(--y);display:grid;place-items:center;font-weight:900}.game h3{font-size:16px;margin:9px 0 5px}.game p{font-size:12px;color:var(--m);margin:0}.catalog{display:grid;grid-template-columns:250px 1fr;gap:28px;padding:32px}.filters{border-right:1px solid var(--l);padding-right:22px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field select{width:100%;height:40px;background:#fff;border:1px solid #aaa}.black{width:100%;border:0;background:#111;color:#fff;padding:12px;font-weight:800}.cataloggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.more{display:block;margin:28px auto;border:1px solid #111;background:#fff;padding:12px 24px;font-weight:800}.loading,.error{padding:60px;text-align:center}.detailhero{min-height:500px;padding:45px;display:flex;align-items:end;color:#fff;background-size:cover;background-position:center;position:relative}.detailhero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.95),rgba(0,0,0,.32))}.detailhero>div{position:relative;max-width:800px}.detailhero h1{font-size:62px}.scores{display:flex;gap:1px;margin-top:20px}.score{background:#fff;color:#111;padding:12px 15px;min-width:112px}.score small{display:block;color:#666;text-transform:uppercase;font-size:10px}.score b{font-size:27px}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--l);padding:0 32px;position:sticky;top:70px;background:#fff;z-index:25}.tabs button{border:0;background:none;padding:18px 15px;font-weight:700;white-space:nowrap}.tabs button.on{border-bottom:4px solid var(--y)}.pane{display:none}.pane.on{display:block}.detailbody{display:grid;grid-template-columns:1.55fr .7fr;gap:35px;padding:32px}.copy h2{font-size:27px;border-bottom:3px solid #111;padding-bottom:8px}.copy p,.copy li{line-height:1.7;color:#333}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddd}.info{background:#f1f1ed;border-top:4px solid var(--y);padding:20px;margin-bottom:18px}.info dl{display:grid;grid-template-columns:105px 1fr;gap:10px;font-size:13px}.info dt{color:var(--m)}.info dd{margin:0;font-weight:700}.article{padding:18px 0;border-bottom:1px solid var(--l)}.article b{font-size:19px}.article p{color:#444;line-height:1.5}.article a{font-size:12px;color:#555}.empty{padding:28px;background:#f5f5f2;color:#555}footer{border-top:1px solid var(--l);padding:24px 32px;color:var(--m);font-size:12px}@media(max-width:900px){nav{display:none}.grid{grid-template-columns:repeat(4,1fr)}.cataloggrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){header{padding:0 14px}.logo{font-size:20px}.search{width:auto;flex:1}.hero{grid-template-columns:1fr}.heroimg{min-height:340px}.herotxt{padding:27px 21px}h1{font-size:40px}.content,.catalog,.detailbody{padding:21px}.grid,.cataloggrid{grid-template-columns:repeat(2,1fr);gap:12px}.catalog,.detailbody{grid-template-columns:1fr}.filters{border-right:0;border-bottom:1px solid var(--l);padding:0 0 20px}.detailhero{min-height:450px;padding:27px 21px}.detailhero h1{font-size:44px}.gallery{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"></div><header><div class="logo"><b>И</b>гропоиск</div><nav><button class="on" data-page="home">Главная</button><button data-page="catalog">Игры</button></nav><div class="search"><input id="search" placeholder="Название, жанр, студия"><button>⌕</button></div></header><section class="page on" id="home"><div id="hero"></div><main class="content"><div class="head"><h2>Популярные игры</h2><span id="updated">Загрузка базы…</span></div><div class="grid" id="topgrid"></div></main></section><section class="page" id="catalog"><div class="catalog"><aside class="filters"><h2>Фильтры</h2><div class="field"><label>Жанр</label><select id="genre"><option value="all">Все жанры</option></select></div><div class="field"><label>Минимальная оценка</label><select id="rating"><option value="0">Любая</option><option value="7">От 7,0</option><option value="8">От 8,0</option><option value="9">От 9,0</option></select></div><button class="black" id="apply">Показать</button></aside><main><div class="head"><h2>Каталог игр</h2><span id="count">Загрузка…</span></div><div class="cataloggrid" id="cataloggrid"></div><button class="more" id="more">Показать ещё</button></main></div></section><section class="page" id="detail"><div id="detailroot"></div></section><footer>Каталог, изображения, описания и материалы обновляются автоматически серверным сборщиком GitHub Actions. Все рейтинги показаны по шкале 0–10.</footer></div><script>let games=[],filtered=[],shown=40;const fmt=n=>Number.isFinite(n)?String(n.toFixed(1)).replace('.',','):'—';const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const rating=g=>g.igropoiskRating??g.criticRating??g.steamUserRating;function card(g){return `<article class="game" data-id="${g.appid}"><div class="poster"><img loading="lazy" src="${g.capsuleImage||g.headerImage||''}"><div class="badge">${fmt(rating(g))}</div></div><h3>${esc(g.title)}</h3><p>${esc((g.genres||[]).slice(0,2).join(', '))}</p></article>`}function render(list,id){document.getElementById(id).innerHTML=list.map(card).join('')}function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.page===id));scrollTo(0,0)}function draw(){render(filtered.slice(0,shown),'cataloggrid');count.textContent=`${filtered.length} игр`;more.style.display=shown<filtered.length?'block':'none'}function articleList(g,type){const a=(g.articles||[]).filter(x=>type==='all'||x.title.toLowerCase().includes(type)).slice(0,30);return a.length?a.map(x=>`<article class="article"><b>${esc(x.title)}</b><p>${esc(x.summary||'Материал внешнего издания.')}</p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.source)} ↗</a></article>`).join(''):'<div class="empty">Сборщик пока не нашёл материалы этого типа. Раздел обновляется автоматически.</div>'}function openGame(g){const tabs=[['about','Всё об игре'],['articles','Статьи'],['reviews','Обзоры'],['userreviews','Рецензии'],['guides','Гайды'],['tips','Советы'],['news','Новости']];detailroot.innerHTML=`<div class="detailhero" style="background-image:url('${g.heroImage||g.headerImage||''}')"><div><span class="tag">${esc((g.genres||[]).join(' · '))}</span><h1>${esc(g.title)}</h1><p class="desc">${esc(g.description||'Описание обновляется.')}</p><div class="scores"><div class="score"><small>Игропоиск</small><b>${fmt(g.igropoiskRating)}</b></div><div class="score"><small>Критики</small><b>${fmt(g.criticRating)}</b></div><div class="score"><small>Игроки</small><b>${fmt(g.steamUserRating)}</b></div></div></div></div><div class="tabs">${tabs.map((t,i)=>`<button class="${i?'':'on'}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><section class="pane on" data-pane="about"><div class="detailbody"><main class="copy"><h2>Описание</h2><p>${esc(g.description||'Описание обновляется.')}</p><h2>Всё об игре</h2><p>${esc(g.about||g.description||'Расширенная информация собирается из источников.')}</p><h2>Особенности</h2><ul>${(g.categories||[]).slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Особенности уточняются сборщиком.</li>'}</ul><h2>Скриншоты</h2><div class="gallery">${(g.screenshots||[]).map(x=>`<img src="${esc(x)}">`).join('')||'<div class="empty">Скриншоты обновляются.</div>'}</div></main><aside><div class="info"><h3>Информация</h3><dl><dt>Дата выхода</dt><dd>${esc(g.releaseDate||'—')}</dd><dt>Жанры</dt><dd>${esc((g.genres||[]).join(', ')||'—')}</dd><dt>Платформы</dt><dd>${esc((g.platforms||[]).join(', ')||'—')}</dd><dt>Разработчик</dt><dd>${esc((g.developers||[]).join(', ')||g.developer||'—')}</dd><dt>Издатель</dt><dd>${esc((g.publishers||[]).join(', ')||g.publisher||'—')}</dd></dl></div></aside></div></section><section class="pane" data-pane="articles"><div class="detailbody"><main class="copy"><h2>Статьи</h2>${articleList(g,'all')}</main></div></section><section class="pane" data-pane="reviews"><div class="detailbody"><main class="copy"><h2>Обзоры</h2>${articleList(g,'review')}</main></div></section><section class="pane" data-pane="userreviews"><div class="detailbody"><main class="copy"><h2>Рецензии пользователей</h2><div class="empty">Пользовательский модуль будет подключён после авторизации и базы аккаунтов.</div></main></div></section><section class="pane" data-pane="guides"><div class="detailbody"><main class="copy"><h2>Гайды</h2>${articleList(g,'guide')}</main></div></section><section class="pane" data-pane="tips"><div class="detailbody"><main class="copy"><h2>Советы</h2>${articleList(g,'tip')}</main></div></section><section class="pane" data-pane="news"><div class="detailbody"><main class="copy"><h2>Новости</h2>${articleList(g,'news')}</main></div></section>`;page('detail')}async function load(){try{const r=await fetch(`data/catalog.json?v=${Date.now()}`);if(!r.ok)throw new Error('catalog');const d=await r.json();games=d.games||[];if(!games.length)throw new Error('empty');filtered=[...games];render(games.slice(0,10),'topgrid');updated.textContent=`${games.length} игр · обновлено ${new Date(d.updatedAt).toLocaleString('ru-RU')}`;const h=games[0];hero.innerHTML=`<div class="hero"><div class="heroimg" style="background-image:url('${h.heroImage||h.headerImage||''}')"></div><div class="herotxt"><span class="tag">Лидер каталога</span><h1>${esc(h.title)}</h1><p class="desc">${esc(h.description||'')}</p><div class="scores"><div class="score"><small>Игропоиск</small><b>${fmt(h.igropoiskRating)}</b></div><div class="score"><small>Критики</small><b>${fmt(h.criticRating)}</b></div><div class="score"><small>Игроки</small><b>${fmt(h.steamUserRating)}</b></div></div></div></div>`;const genres=[...new Set(games.flatMap(g=>g.genres||[]))].sort();genre.innerHTML='<option value="all">Все жанры</option>'+genres.map(x=>`<option>${esc(x)}</option>`).join('');draw()}catch(e){hero.innerHTML='<div class="error"><h1>База обновляется</h1><p>Первый серверный сбор данных ещё выполняется.</p></div>';topgrid.innerHTML='';updated.textContent='Ожидание первого обновления'}}document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p)page(p.dataset.page);const c=e.target.closest('[data-id]');if(c)openGame(games.find(g=>g.appid==c.dataset.id));const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===t));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.dataset.pane===t.dataset.tab))}});apply.onclick=()=>{const ge=genre.value,ra=+rating.value;filtered=games.filter(g=>(ge==='all'||(g.genres||[]).includes(ge))&&(rating(g)||0)>=ra);shown=40;draw()};more.onclick=()=>{shown+=40;draw()};search.oninput=e=>{const q=e.target.value.toLowerCase().trim();page('catalog');filtered=games.filter(g=>(g.title+' '+(g.genres||[]).join(' ')+' '+(g.developers||[]).join(' ')).toLowerCase().includes(q));shown=40;draw()};load();</script></body></html>
