<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игропоиск</title><meta name="description" content="Каталог игр, рейтинги, материалы и личная коллекция"><link rel="stylesheet" href="./styles.css"></head><body><div class="shell"><div class="topline"></div><header class="site-header"><div class="logo"><b>И</b>гропоиск</div><nav class="site-nav"><button data-nav="home">Главная</button><button data-nav="catalog">Игры</button><button data-nav="profile">Моя коллекция</button></nav><div class="global-search"><input id="global-search" placeholder="Название, жанр или студия"><button id="global-search-btn">⌕</button></div></header><main id="app"><div class="empty">Загрузка Игропоиска…</div></main><footer>Структура сайта стабильна. Каталог и материалы обновляются автоматическими сборщиками.</footer></div><script src="./app.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.addEventListener('click',()=>location.hash=x.dataset.nav));const input=document.getElementById('global-search');const run=()=>{location.hash='catalog';setTimeout(()=>{const q=document.getElementById('filter-query');if(q){q.value=input.value;document.getElementById('apply-filters')?.click()}},0)};document.getElementById('global-search-btn').onclick=run;input.addEventListener('keydown',e=>{if(e.key==='Enter')run()})});</script></body></html>
