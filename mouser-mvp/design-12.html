/* Technical typography: separate UI and machine-readable identifiers. */
:root{--ui:"IBM Plex Sans","Segoe UI Variable","Segoe UI",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
body{font-family:var(--ui);font-size:14px;line-height:1.45}

.small,.model-caption,.map .num,.hot,.views,#finish,kbd,#custom,.foot{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:11px;letter-spacing:.065em;font-weight:500}

.map .num{font-size:11px;letter-spacing:-.03em}.map .action{font-size:13px}
.hot{font-size:10px;font-weight:600;width:32px;height:32px}
.views button,#finish{font-size:11px;letter-spacing:.035em}

#custom{font-size:13px}
.canvas-wrap{margin-top:24px}
.model-caption{font-size:10px;letter-spacing:.025em}
.foot .small{font-size:10px}

.edit{margin-top:32px;padding:20px 20px 18px;border:1px solid var(--rule);background:var(--panel)}

.strip{padding:9px 0;min-height:43px}

.action-picker .picker-menu{left:0;right:0;width:100%;max-width:none}
.canvas-wrap{margin-top:8px}
.controls{padding-top:25px}

/* UI 11 — model selection belongs to the device header. */
.device-head{align-items:flex-start;position:relative;gap:12px}

function closePickers(except){$$(".plain-picker").forEach(root=>{if(root===except)return;root.querySelector(".picker-menu").hidden=true;root.querySelector(".picker-trigger").setAttribute("aria-expanded","false")})}
let keyboardMode=false;document.addEventListener("keydown",()=>{keyboardMode=true;document.documentElement.classList.add("keyboard-mode")},true);document.addEventListener("pointerdown",()=>{keyboardMode=false;document.documentElement.classList.remove("keyboard-mode")},true);
function openPicker(root,focusIndex){closePickers(root);const menu=root.querySelector(".picker-menu"),trigger=root.querySelector(".picker-trigger");menu.hidden=false;trigger.setAttribute("aria-expanded","true");const opts=[...menu.querySelectorAll("button")];if(opts.length&&keyboardMode)opts[focusIndex===-1?opts.length-1:Math.max(0,opts.findIndex(x=>x.getAttribute("aria-selected")==="true"))].focus()}
function renderPicker(id,items,selected,change,withIcons=false){const root=$("#"+id),trigger=root.querySelector(".picker-trigger"),menu=root.querySelector(".picker-menu");root.querySelector(".picker-value").textContent=items[selected];if(withIcons)root.querySelector(".picker-icon").innerHTML='<svg viewBox="0 0 44 52" aria-hidden="true">'+icons[selected]+'</svg>';menu.replaceChildren(...items.map((name,i)=>{const b=button("",()=>{closePickers();change(i);if(keyboardMode)trigger.focus();else trigger.blur()});b.className="picker-option";b.setAttribute("role","option");b.setAttribute("aria-selected",i===selected);if(withIcons){const icon=document.createElement("span");icon.className="picker-option-icon";icon.innerHTML='<svg viewBox="0 0 44 52" aria-hidden="true">'+icons[i]+'</svg>';b.append(icon)}const label=document.createElement("span");label.textContent=name;b.append(label);const mark=document.createElement("span");mark.className="picker-check";mark.textContent=i===selected?"✓":"";b.append(mark);return b}));}
$$(".plain-picker").forEach(root=>{const trigger=root.querySelector(".picker-trigger"),menu=root.querySelector(".picker-menu");trigger.onclick=()=>{if(menu.hidden)openPicker(root);else closePickers()};trigger.onkeydown=e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();openPicker(root,e.key==="ArrowUp"?-1:0)}};menu.onkeydown=e=>{const opts=[...menu.querySelectorAll("button")],idx=opts.indexOf(document.activeElement);if(["ArrowDown","ArrowUp","Home","End"].includes(e.key)){e.preventDefault();let next=e.key==="Home"?0:e.key==="End"?opts.length-1:(idx+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length;opts[next].focus()}if(e.key==="Escape"){e.preventDefault();closePickers();trigger.focus()}if(e.key==="Tab")closePickers()};});

const viewer=$("#mouse"),originals=new WeakMap();
let currentAsset="",loadedFamily=-1,requestId=0,gamingUrl=null;
window.mouserQA={ready:false,family:-1,error:null};
const ASSET_ROOT="models-v2/";
function status(text){$("#quality").textContent=text}
function hotspots(){
 if(!viewer)return;
 viewer.querySelectorAll(".hot").forEach(b=>b.remove());
 if(loadedFamily!==family)return;
 const f=families[family];
 for(const [id,pos] of Object.entries(f.pins)){
   const i=+id;if(!f.ids.includes(i))continue;
   let b=button(inputCodes[i],()=>{k=i;refresh()});
   b.className="hot";b.slot="hotspot-"+i;b.dataset.position=pos.map(v=>v+"m").join(" ");b.title=names[i];b.setAttribute("aria-label",names[i]);b.setAttribute("aria-pressed",i===k);
   viewer.append(b);
 }
}
function restyle(){
 if(!viewer.model)return;
 for(const m of viewer.model.materials){
   const n=(m.name||"").toLowerCase();if(family===3&&n==="pad_cloth")continue;const q=m.pbrMetallicRoughness;
   if(!originals.has(m))originals.set(m,{c:[...q.baseColorFactor],metal:q.metallicFactor,rough:q.roughnessFactor,emissive:[...(m.emissiveFactor||[0,0,0])]});
   const o=originals.get(m),detail=/wheel|rubber|base|feet|button|steel|charcoal|tracking ball|blue product|mouse_light/.test(n);
   // Preserve the baked atlas detail in the two textured assets. Tint only.
   const atlas=family===1||family===3;
   if(atlas){
     q.setBaseColorFactor(finish?[.45,.46,.44,1]:[1,1,1,1]);
     q.setRoughnessFactor(o.rough);
     if(/light/.test(n))m.setEmissiveFactor([0,0,0]);
     continue;
   }
   const c=finish?(detail?[.11,.12,.11,1]:[.30,.32,.30,1]):(detail?[.24,.25,.23,1]:[.84,.82,.76,1]);
   q.setBaseColorFactor(c);q.setMetallicFactor(detail?.1:.12);q.setRoughnessFactor(detail?.58:.35);m.setEmissiveFactor([0,0,0]);
 }
}
function viewModel(){
 const f=families[family],front=f.front,theta=view===0?(front===180?front+35:front-35):view===1?front:front===180?270:-90,phi=view===0?55:view===1?8:82;
 viewer.cameraOrbit=theta+"deg "+phi+"deg auto";viewer.fieldOfView="30deg";
}
async function isolateGaming(){
 if(gamingUrl)return gamingUrl;
 const res=await fetch(ASSET_ROOT+"gaming.glb");if(!res.ok)throw Error("Gaming GLB "+res.status);
 const buffer=await res.arrayBuffer(),dv=new DataView(buffer);
 if(dv.getUint32(0,true)!==0x46546c67)throw Error("Invalid GLB");
 const len=dv.getUint32(12,true),meta=JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,20,len)));
 const node=meta.nodes.findIndex(n=>n.name==="mouse");
 if(node<0)throw Error("Gaming mouse node missing");
 meta.scenes=[{nodes:[node]}];meta.scene=0;meta.nodes[node].translation=[0,meta.nodes[node].translation[1],0];
 const json=new TextEncoder().encode(JSON.stringify(meta)),pad=(4-json.length%4)%4,tail=new Uint8Array(buffer,20+len),out=new Uint8Array(20+json.length+pad+tail.length),v=new DataView(out.buffer);
 v.setUint32(0,0x46546c67,true);v.setUint32(4,2,true);v.setUint32(8,out.length,true);v.setUint32(12,json.length+pad,true);v.setUint32(16,0x4e4f534a,true);out.set(json,20);out.fill(32,20+json.length,20+json.length+pad);out.set(tail,20+json.length+pad);
 gamingUrl=URL.createObjectURL(new Blob([out],{type:"model/gltf-binary"}));return gamingUrl;
}
async function draw(){
 const f=families[family];let wanted=family;
 if(currentAsset===f.asset){if(loadedFamily===family){restyle();viewModel();hotspots()}return}
 const id=++requestId;currentAsset=f.asset;loadedFamily=-1;window.mouserQA={ready:false,family:wanted,error:null};hotspots();status("GLB / LOAD");$("#fallback").hidden=true;
 try{
   await customElements.whenDefined("model-viewer");
   let src=f.asset==="gaming"?await isolateGaming():ASSET_ROOT+f.asset+".glb";
   if(id!==requestId)return;
   viewer.alt=f.title+" mouse";
   viewer.src=src;viewModel();
 }catch(e){if(id===requestId){status("GLB / ERROR");$("#fallback").hidden=false;window.mouserQA.error=String(e)}}
}
viewer.addEventListener("load",()=>{
 try{loadedFamily=family;restyle();viewModel();viewer.jumpCameraToGoal();hotspots();status("GLB / READY");window.mouserQA={ready:true,family,error:null,asset:families[family].asset,pins:viewer.querySelectorAll(".hot").length}}
 catch(e){status("GLB / ERROR");window.mouserQA.error=String(e);$("#fallback").hidden=false;console.error(e)}
});
viewer.addEventListener("error",e=>{status("GLB / ERROR");$("#fallback").hidden=false;window.mouserQA.error=String(e.detail?.type||"model error")});
refresh();draw();
