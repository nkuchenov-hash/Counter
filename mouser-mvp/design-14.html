te(-50%,-50%);width:29px;height:29px;padding:0;border:1px solid #fff9;border-radius:50%;background:#272722dc;color:white;font-size:11px;box-shadow:0 0 0 4px #ffffff42;display:grid;place-items:center}.hot[aria-pressed=true]{background:#a7482a;box-shadow:0 0 0 5px #a7482a38}.viewbar{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);padding-top:12px;gap:12px;flex-wrap:wrap}.views{display:flex;gap:7px}.views button{border:1px solid transparent}.views button[aria-selected=true]{border:1px solid var(--rule);background:var(--panel)}.controls{padding:28px 0}.map{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1.1fr) 12px;align-items:center;gap:8px;text-align:left;border-top:1px solid var(--rule);padding:12px 4px}.map .num{font-size:11px;color:var(--sub)}.map .action{text-align:right;font-size:12px;color:var(--sub)}.map[aria-pressed=true]{background:var(--panel);box-shadow:inset 2px 0 var(--accent);padding-left:9px}.map[aria-pressed=true] .action{color:var(--accent)}.edit{border-top:1px solid var(--rule);padding-top:18px;margin-top:3px}.edit h3{margin:8px 0;font-size:21px;letter-spacing:-.035em}.edit select,.edit input{width:100%}.keys{display:flex;gap:6px;min-height:38px;align-items:center;margin-top:8px}kbd{border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:4px 8px;font:12px inherit}.foot{border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:16px;padding-top:13px}.other{padding:32px 0;max-width:760px;min-height:65vh}.setting{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--rule);padding:15px 0}.setting button{border:1px solid var(--rule)}[hidden]{display:none!important}.warning{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);padding:30px;text-align:center}.model-caption{display:flex;justify-content:space-between;gap:12px;color:var(--sub);font-size:11px;margin:6px 0 13px}.a /* Technical typography: separate UI and machine-readable identifiers. */
:root{--ui:"IBM Plex Sans","Segoe UI Variable","Segoe UI",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
body{font-family:var(--ui);font-size:14px;line-height:1.45}
.brand{font-family:var(--ui);font-size:34px;font-weight:700;letter-spacing:-.075em}
h1,h2,.edit h3{font-family:var(--ui);font-weight:600;letter-spacing:-.045em}
h1{font-size:clamp(43px,5.6vw,82px);line-height:.96;margin:16px 0 0}
h2{font-size:31px;letter-spacing:-.035em;margin:10px 0 20px}
.small,.model-caption,.map .num,.hot,.views,#finish,kbd,#custom,.foot{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:11px;letter-spacing:.065em;font-weight:500}
.map{grid-template-columns:37px minmax(0,1fr) minmax(0,1.1fr) 12px;gap:10px;padding-block:12px}
.map .num{font-size:11px;letter-spacing:-.03em}.map .action{font-size:13px}
.hot{font-size:10px;font-weight:600;width:32px;height:32px}
.views button,#finish{font-size:11px;letter-spacing:.035em}
kbd{font:500 12px/1.35 var(--mono);text-transform:uppercase}
#custom{font-size:13px}
.canvas-wrap{margin-top:24px}
.model-caption{font-size:10px;letter-spacing:.025em}
.foot .small{font-size:10px}
nav button{font-weight:500}
.device-head{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap}.device-head h1{font-size:clamp(35px,4.2vw,64px);line-height:1.04;margin:8px 0 0;letter-spacing:-.055em}.family-picker{display:grid;gap:5px;min-width:145px}.family-picker select{font-size:13px;width:100%;border-radius:0}.canvas-wrap{margin:8px 0 0;aspect-ratio:1.40}.studio{padding-top:25px}.model-caption{margin-top:0}.hot{border-radius:3px;width:auto;min-width:28px;height:24px;padding:0 5px;box-shadow:none;background:#24251fd9;font-size:10px}.hot[aria-pressed=true]{box-shadow:0 0 0 2px #f5f2e7,0 0 0 3px #a7482a}.map{padding-block:10px}.controls h2{margin-bottom:14px}.map .num{font-size:10px}.control-scroll{max-height:450px;overflow:auto;scrollbar-width:thin}.foot{margin-top:5px}@media(max-width:850px){.device-head h1{font-size:42px}.control-scroll{max-height:none}}


/* Design 07: accessible round input markers and visible device family rail. */
.hot{width:34px;height:34px;min-width:34px;padding:0;border-radius:50%;font-size:10px;font-weight:600;box-shadow:0 0 0 3px #f4f1e655;line-height:1}
.hot[aria-pressed=true]{background:#a7482a;box-shadow:0 0 0 3px #f5f2e7,0 0 0 4px #a7482a}
.family-picker{margin-top:15px;display:block;min-width:0}
#families{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-block:1px solid var(--rule)}
.family-tab{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:9px 2px;color:var(--sub);font:500 10px/1.2 var(--mono);border-right:1px solid var(--rule);border-bottom:2px solid transparent;text-transform:uppercase}
.family-tab:last-child{border-right:0}
.family-tab[aria-pressed=true]{border-bottom-color:var(--accent);color:var(--ink);background:var(--panel)}
.family-tab svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.device-head h1{font-size:clamp(35px,4.2vw,64px)}
.canvas-wrap{margin:4px 0 0;aspect-ratio:1.4}
@media(max-width:500px){#families{grid-template-columns:repeat(3,minmax(0,1fr))}.family-tab:nth-child(-n+3){border-bottom:1px solid var(--rule)}.family-tab[aria-pressed=true]{box-shadow:inset 0 -2px var(--accent)}}

/* UI 08: optically balanced model framing and separate mapping editor. */
.edit{margin-top:32px;padding:20px 20px 18px;border:1px solid var(--rule);background:var(--panel)}
.edit-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.edit h3{margin:15px 0 11px;font-size:23px}
.edit select,.edit input{background:var(--paper)}
.edit .keys:empty{display:none}
.edit #reset{display:block;margin-top:12px;padding:7px 0;text-align:left;color:var(--sub);font-size:12px}
.edit #reset:hover{color:var(--accent)}
.canvas-wrap{aspect-ratio:1.55}
@media(max-width:850px){.edit{margin-top:26px;padding:17px}}

/* UI 09: unboxed, open editorial composition. */
#families{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;border:0}
.family-picker{margin-top:19px}
.family-tab{flex:1;min-width:0;background:transparent!important;border:0;border-bottom:1px solid transparent;padding:8px 0 11px;gap:5px;color:var(--sub)}
.family-tab:last-child{border-right:0}
.family-tab[aria-pressed=true]{border-bottom-color:var(--ink);box-shadow:none;background:transparent;color:var(--ink)}
.family-tab svg{width:37px;height:40px;stroke-width:1.35}
.family-tab span{font-size:10px;letter-spacing:.025em}
.edit{margin-top:44px;padding:20px 0 0;background:transparent;border:0;border-top:1px solid var(--rule)}
.edit-top{padding:0;border:0;justify-content:space-between}
.edit h3{margin:12px 0;font-size:23px}
.edit select,.edit input{background:transparent}
.edit #reset{margin-top:15px}
.map[aria-pressed=true]{background:transparent;box-shadow:none;color:var(--accent);padding-left:4px}
.map[aria-pressed=true] .num{color:var(--accent)}
.model-link{font:500 11px var(--mono);color:var(--sub);text-decoration:none}
.model-link:hover{color:var(--accent);text-decoration:underline}
@media(max-width:500px){#families{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.family-tab:nth-child(-n+3){border-bottom:1px solid transparent}.family-tab[aria-pressed=true]{border-bottom-color:var(--ink);box-shadow:none}}

/* UI 10 — single-current-value controls, no boxed selects. */
.strip{padding:9px 0;min-height:43px}
.model-control{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 13px;margin:0 0 25px;border-bottom:1px solid var(--rule)}
.plain-picker{position:relative;min-width:0}
.picker-trigger{display:flex;align-items:center;justify-content:flex-end;gap:9px;width:100%;padding:5px 0;border:0;background:transparent;line-height:1.45;font-weight:500;white-space:nowrap}
.picker-trigger>svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--sub)}
.picker-trigger[aria-expanded=true]>svg{transform:rotate(180deg)}
.picker-trigger:hover{color:var(--accent)}
.picker-icon,.picker-option-icon{width:24px;height:27px;display:grid;place-items:center;flex:none}
.picker-icon svg,.picker-option-icon svg{width:22px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.picker-menu,#families.picker-menu{position:absolute;top:calc(100% + 6px);right:0;display:block;width:max-content;min-width:210px;max-width:min(330px,90vw);z-index:20;background:var(--paper);border:1px solid var(--rule);box-shadow:0 9px 23px #17171114;padding:5px 10px;max-height:320px;overflow:auto}
.picker-option{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 3px;color:var(--ink);border:0;background:transparent;white-space:normal;font-size:13px}
.picker-option+.picker-option{border-top:1px solid var(--rule)}
.picker-option:hover,.picker-option:focus-visible{color:var(--accent);background:var(--panel)}
.picker-option[aria-selected=true]{font-weight:600}
.picker-check{margin-left:auto;min-width:15px;color:var(--accent)}
.action-picker .picker-trigger{justify-content:space-between;text-align:left;padding:9px 0;border-bottom:1px solid var(--rule);white-space:normal}
.action-picker .picker-menu{left:0;right:0;width:100%;max-width:none}
.canvas-wrap{margin-top:8px}
.controls{padding-top:25px}
@media(max-width:850px){.model-control{margin-bottom:20px}.picker-menu,#families.picker-menu{max-width:90vw}}

/* UI 11 — model selection belongs to the device header. */
.device-head{align-items:flex-start;position:relative;gap:12px}
.device-head>div:first-child{min-width:0;flex:1}
.device-head .model-control{flex:none;padding:0;margin:0;border:0;align-self:flex-start;display:block}
.device-head #familyPicker .picker-trigger{padding:0 0 3px;gap:7px;min-height:26px}
.device-head #familyPicker .picker-value{font-size:13px;font-weight:500}
.device-head #familyPicker .picker-icon{width:20px;height:24px}
.device-head #familyPicker .picker-icon svg{width:18px;height:22px}
.device-head .picker-menu{z-index:30}
html:not(.keyboard-mode) .picker-trigger:focus-visible,html:not(.keyboard-mode) .picker-option:focus-visible{outline:none}
@media(max-width:500px){.device-head{flex-wrap:wrap}.device-head>div:first-child{flex-basis:100%}.device-head .model-control{margin-left:auto}}

/* UI 12: real sourced GLB meshes in the main mapping surface. */
.canvas-wrap{aspect-ratio:1.55;overflow:visible;margin-top:8px}
#mouse{width:100%;height:100%;display:block;background:transparent;--poster-color:transparent;--progress-bar-color:var(--accent);--progress-bar-height:2px}
#mouse .hot{position:relative;transform:none;width:34px;height:34px;min-width:34px;border-radius:50%;border:1px solid #fff9;background:#25251fe8;color:#fff;box-shadow:0 0 0 3px #f4f1e655;display:grid;place-items:center}
#mouse .hot[aria-pressed=true]{background:#a7482a;box-shadow:0 0 0 3px #f5f2e7,0 0 0 4px #a7482a}
#mouse .hot[data-visible=false]{opacity:.25}
#mouse .hot:hover{opacity:1}
#mouse .hot:focus-visible{outline:2px solid var(--accent)}

/* UI 13: isolated product photography; no live 3D dependency. */
.canvas-wrap{aspect-ratio:1.55;position:relative;overflow:visible;margin-top:8px}
#renderFrame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0}
#mouse{width:100%;height:100%;display:block;background:transparent}
#hotspots{position:absolute;inset:0;pointer-events:none}
#hotspots .hot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border-radius:50%;width:32px;height:32px;min-width:32px;padding:0;display:grid;place-items:center;line-height:1;font-size:10px;border:1px solid #fff9;background:#25251fe8;color:white;box-shadow:0 0 0 3px #f4f1e655;z-index:2}
#hotspots .hot[aria-pressed=true]{background:#a7482a;box-shadow:0 0 0 2px var(--paper),0 0 0 3px #a7482a;z-index:3}
#hotspots .hot:hover{z-index:4}
.finishes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.swatch{width:15px;height:15px;padding:0;border:1px solid #7775;border-radius:50%;background:var(--swatch);position:relative}
.swatch[aria-pressed=true]{outline:1px solid var(--ink);outline-offset:3px}
.swatch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.finish-name{font:500 10px var(--mono);letter-spacing:.03em;min-width:72px;text-align:right}
@media(max-width:500px){#hotspots .hot{width:27px;height:27px;min-width:27px;font-size:9px}.finishes{gap:7px}.finish-name{min-width:0}}
</style></head>
