name: Refresh LIFE OS Victor branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-life-os-branding.yml'
      - 'branding/life_os_app_icon_master.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate platform icons, favicons, and extension package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import json, zipfile, re

          root = Path('.')
          master_path = root / 'branding/life_os_app_icon_master.png'
          master = Image.open(master_path).convert('RGB')

          def render(size: int, path: str, sharpen: bool = True):
              out = master.resize((size, size), Image.Resampling.LANCZOS)
              if sharpen and size <= 256:
                  out = out.filter(ImageFilter.UnsharpMask(radius=0.45, percent=105, threshold=2))
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              out.save(p, 'PNG', optimize=True)

          # Web / PWA / browser favicon.
          render(64, 'web/favicon.png')
          for size in (180, 192, 512):
              render(size, f'web/icons/Icon-{size}.png')
          render(192, 'web/icons/Icon-maskable-192.png')
          render(512, 'web/icons/Icon-maskable-512.png')

          # Android launcher icon (also used by the current Wear target).
          for folder, size in {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }.items():
              render(size, f'android/app/src/main/res/{folder}/ic_launcher.png')

          # iOS / iPadOS app icon set.
          ios = {
              'Icon-App-20x20@1x.png': 20,
              'Icon-App-20x20@2x.png': 40,
              'Icon-App-20x20@3x.png': 60,
              'Icon-App-29x29@1x.png': 29,
              'Icon-App-29x29@2x.png': 58,
              'Icon-App-29x29@3x.png': 87,
              'Icon-App-40x40@1x.png': 40,
              'Icon-App-40x40@2x.png': 80,
              'Icon-App-40x40@3x.png': 120,
              'Icon-App-60x60@2x.png': 120,
              'Icon-App-60x60@3x.png': 180,
              'Icon-App-76x76@1x.png': 76,
              'Icon-App-76x76@2x.png': 152,
              'Icon-App-83.5x83.5@2x.png': 167,
              'Icon-App-1024x1024@1x.png': 1024,
          }
          for name, size in ios.items():
              render(size, f'ios/Runner/Assets.xcassets/AppIcon.appiconset/{name}', sharpen=size <= 256)

          # macOS icon set.
          for size in (16, 32, 64, 128, 256, 512, 1024):
              render(size, f'macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_{size}.png', sharpen=size <= 256)

          # Windows executable / installer icon.
          ico_path = root / 'windows/runner/resources/app_icon.ico'
          ico_path.parent.mkdir(parents=True, exist_ok=True)
          ico_base = master.resize((256, 256), Image.Resampling.LANCZOS)
          ico_base.save(
              ico_path,
              format='ICO',
              sizes=[(16,16), (24,24), (32,32), (48,48), (64,64), (128,128), (256,256)],
          )

          # Browser extension icons.
          for size in (16, 32, 48, 128):
              render(size, f'browser_extension/icons/icon{size}.png')
          manifest_path = root / 'browser_extension/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.1.1'
          manifest['icons'] = {str(s): f'icons/icon{s}.png' for s in (16, 32, 48, 128)}
          manifest.setdefault('action', {})['default_icon'] = {
              '16': 'icons/icon16.png',
              '32': 'icons/icon32.png',
              '48': 'icons/icon48.png',
              '128': 'icons/icon128.png',
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Public LIFE OS marketing favicon.
          render(64, 'marketing/favicon.png')
          marketing = root / 'marketing/index.html'
          html = marketing.read_text(encoding='utf-8')
          if 'rel="icon"' not in html:
              html = html.replace('<head>', '<head><link rel="icon" type="image/png" href="favicon.png">', 1)
          html = html.replace('life-os-browser-extension-v0.1.0.zip', 'life-os-browser-extension-v0.1.1.zip')
          marketing.write_text(html, encoding='utf-8')

          # Rebuild downloadable extension ZIP with the new icon set.
          zip_path = root / 'marketing/downloads/life-os-browser-extension-v0.1.1.zip'
          zip_path.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted((root / 'browser_extension').rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(root / 'browser_extension').as_posix())

          # Keep changelog grounded in the shipped branding change.
          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text(encoding='utf-8')
          entry = (
              '## [2026-09-11] - Victor app icon rollout [shipped]\n\n'
              '* **Branding:** [shipped] Applied the approved Victor raven + clock-dial + checklist icon across Android/Wear, Web/PWA, iOS/iPadOS, macOS, Windows, browser extension, and LIFE OS website favicons; rebuilt the public extension ZIP.\n'
              '* **Android:** [shipped] New ARM64 release APK is produced from the refreshed launcher icon.\n\n'
          )
          if 'Victor app icon rollout' not in text:
              if text.startswith('#'):
                  lines = text.splitlines(keepends=True)
                  insert_at = 0
                  while insert_at < len(lines) and (lines[insert_at].startswith('#') or lines[insert_at].strip() == '' or lines[insert_at].startswith('>')):
                      insert_at += 1
                  text = ''.join(lines[:insert_at]) + '\n' + entry + ''.join(lines[insert_at:])
              else:
                  text = entry + text
              changelog.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated branding assets
        id: brand
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             branding/life_os_app_icon_master.png             web/favicon.png web/icons             android/app/src/main/res/mipmap-*/ic_launcher.png             ios/Runner/Assets.xcassets/AppIcon.appiconset             macos/Runner/Assets.xcassets/AppIcon.appiconset             windows/runner/resources/app_icon.ico             browser_extension/manifest.json browser_extension/icons             marketing/favicon.png marketing/index.html             marketing/downloads/life-os-browser-extension-v0.1.1.zip             CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No branding changes to commit"
          else
            git commit -m "Branding: apply Victor icon across LIFE OS"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze runtime app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Prepare public APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LIFE-OS-Android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-os-android-arm64-victor-icon
          path: LIFE-OS-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish LIFE OS Android release
        uses: ncipollo/release-action@v1
        with:
          tag: life-os-1.0.0-build1-20260911-victor-icon-${{ github.run_number }}
          name: LIFE OS 1.0.0+1 — Victor app icon
          body: Approved Victor raven app icon rolled out across LIFE OS branding. This release contains the refreshed Android ARM64 launcher icon; web/PWA, desktop, Apple, extension, and favicon assets are updated in the same source revision.
          artifacts: LIFE-OS-Android-arm64.apk
          commit: ${{ steps.brand.outputs.sha }}
          immutableCreate: true
          makeLatest: true
          prerelease: false
