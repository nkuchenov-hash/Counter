name: Regenerate structure docs after Victor branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-structure-docs-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-shot workflows before documenting the final tree
        run: |
          git rm -f .github/workflows/refresh-structure-docs-once.yml
          git rm -f .github/workflows/refresh-life-os-branding.yml

      - name: Regenerate owner-readable structure guide
        run: python scripts/manual/generate_app_structure_detailed.py

      - name: Verify documentation parity
        run: python scripts/audit/documentation_parity.py

      - name: Commit final structure docs and one-shot cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Docs: sync structure after Victor branding"
          git push origin HEAD:main
