# Re-run after rebasing onto the category icon updates.
name: Refresh Onest branch structure inventory

on:
  push:
    branches:
      - fix/onest-ui-shell-profile-20261105
    paths:
      - .github/workflows/refresh-onest-structure.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate tracked file structure
        run: python scripts/manual/generate_app_structure_detailed.py
      - name: Commit generated structure
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/APP_STRUCTURE_DETAILED.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: record bundled Onest font in canonical structure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
