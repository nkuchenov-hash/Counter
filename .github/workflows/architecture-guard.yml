name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    env:
      PREVIEW_DIR: notes-v3-preview-live-20260731-2313
    steps:
      - name: Checkout current Notes branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run exactly three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Build isolated production web
        run: flutter build web --release --no-tree-shake-icons --base-href=/Counter/${PREVIEW_DIR}/

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check whitespace
        run: git diff --check origin/main...HEAD

      - name: Disable service worker and stamp source
        run: |
          git rev-parse HEAD > build/web/source-sha.txt
          rm -f build/web/flutter_service_worker.js
          python - <<'PY'
          from pathlib import Path
          p = Path('build/web/flutter_bootstrap.js')
          s = p.read_text(encoding='utf-8')
          marker = '_flutter.loader.load({'
          if marker in s:
              start = s.rfind(marker)
              end = s.find(');', start)
              if end < 0:
                  raise SystemExit('bootstrap load call end not found')
              s = s[:start] + '_flutter.loader.load();' + s[end + 2:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publish isolated preview
        run: |
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          rm -rf /tmp/pages/${PREVIEW_DIR}
          mkdir -p /tmp/pages/${PREVIEW_DIR}
          cp -a build/web/. /tmp/pages/${PREVIEW_DIR}/
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${PREVIEW_DIR}
          git commit -m "Publish isolated Notes gray-screen fix $(cat ${PREVIEW_DIR}/source-sha.txt)"
          git push origin HEAD:gh-pages

      - name: Verify public preview
        run: |
          expected="$(cat build/web/source-sha.txt)"
          url="https://nkuchenov-hash.github.io/Counter/${PREVIEW_DIR}"
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --max-time 20 "${url}/source-sha.txt?attempt=${attempt}" 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' "${url}/?attempt=${attempt}")"
              test "$code" = "200"
              echo "Public preview verified at ${url}/ with ${expected}"
              exit 0
            fi
            sleep 10
          done
          echo "Public preview did not expose expected SHA ${expected}" >&2
          exit 1
