name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/stats-simple-visual-overview
          fetch-depth: 0

      - name: One-shot Stats documentation repair
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/stats-simple-visual-overview'
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/architecture-guard.yml

          python - <<'PY'
          from pathlib import Path

          app = Path('docs/APP_STRUCTURE.md')
          text = app.read_text(encoding='utf-8')
          old = "| `stats/` | `stats_view.dart`, `day_stats_dashboard.dart`, `stats_detail_tree.dart`, `plan_vs_fact_tab.dart` | Productivity stats (embedded in Timeline): switchable day dashboards, preserved detailed tree, plan vs fact |"
          new = "| `stats/` | `stats_view.dart`, `stats_detail_tree.dart`, `stats_visual_overview.dart` | Productivity stats (embedded in Timeline): original expandable waking-day time tree plus top-level category donut and hourly day chart |"
          if old not in text:
              raise SystemExit('Expected Stats row not found in APP_STRUCTURE.md')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          inventory = Path('docs/website/PRODUCT_INVENTORY.md')
          text = inventory.read_text(encoding='utf-8')
          start = text.index('## 6. Stats & Plan vs Fact')
          end = text.index('\n---\n\n## 7. Categories', start)
          replacement = '''## 6. Stats

          | Field | Detail |
          | :--- | :--- |
          | **User-facing capability** | Two focused views inside Timeline Stats: the original expandable project/category time tree, plus a visual overview with a donut of tracked time by top-level category and an hourly waking-day chart using only top-level category blocks. |
          | **Proof** | `lib/features/stats/stats_view.dart` — `StatsView`; `lib/features/stats/stats_detail_tree.dart` — `StatsDetailTree`; `lib/features/stats/stats_visual_overview.dart` — `StatsVisualOverview`; `lib/data/category_service.dart` — stats aggregation/duration helpers |
          | **User value** | See where tracked time went at a glance, then drill into the exact category/task/session structure when needed |
          | **Status** | **public-ready** |
          | **Risks / caveats** | Visual mode intentionally aggregates to top-level categories; subcategories and task/session detail remain in the tree. Both views use profile timezone and wake-to-bed boundaries. |
          | **Website angle** | “See where your time went — from the whole day down to the exact session.” |
          '''
          inventory.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## 2026-08-22 — Focused Stats visual overview [product]

          - Removed the experimental Overview, Day, and Plan-Fact Stats dashboard surfaces; kept the original expandable waking-day project/category time tree as the default view.
          - Added one focused visual Stats view: a donut of tracked time by top-level category plus an hourly waking-day chart using only top-level category colors/labels.
          - Preserved existing waking-day boundaries, timezone behavior, aggregation, day swipe navigation, and Timeline record semantics; no PocketBase/schema changes.

          '''
          if not text.startswith('## 2026-08-22 — Focused Stats visual overview'):
              changelog.write_text(entry + text, encoding='utf-8')
          PY

          python scripts/manual/generate_app_structure_detailed.py
          python scripts/audit/documentation_parity.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Stats visual documentation"
          git push origin HEAD:agent/stats-simple-visual-overview

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check governing documentation parity
        run: python scripts/audit/documentation_parity.py

      - name: Check repository hygiene and structure growth
        env:
          STRUCTURE_GROWTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/audit/repository_hygiene.py

      - name: Check PocketBase schema parity
        run: python scripts/audit/pocketbase_schema_contract.py

      - name: Check deployment ordering contract
        run: python scripts/audit/deployment_contract.py

      - name: Check all PocketBase JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' files < <(find pb_hooks pb_migrations -type f -name '*.js' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo 'No PocketBase JavaScript files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi
