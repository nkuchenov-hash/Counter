name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply pending Notes workspace repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if grep -q "this.embedded = false" lib/features/notes/widgets/notes_editor_screen.dart; then
            echo "Notes workspace repair already applied"
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/notes-v3-ux-repair.yml').read_text(encoding='utf-8')
          start_token = "          python3 <<'PY'\n"
          end_token = "\n          PY\n"
          start = source.index(start_token) + len(start_token)
          end = source.index(end_token, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          function_pattern = re.compile(
              r"def replace_once\(path, old, new\):\n.*?(?=\nwrite_b64\()",
              re.S,
          )
          flexible_function = '''def replace_once(path, old, new):
    p = Path(path)
    text = p.read_text(encoding='utf-8')
    if old in text:
        p.write_text(text.replace(old, new, 1), encoding='utf-8')
        return
    parts = re.split(r'(\\s+)', old)
    pattern = ''.join(r'\\s+' if part.isspace() else re.escape(part) for part in parts if part)
    match = re.search(pattern, text, re.S)
    if match is None:
        raise SystemExit(f'flexible pattern not found in {path}: {old[:100]!r}')
    p.write_text(text[:match.start()] + new + text[match.end():], encoding='utf-8')
'''
          script, count = function_pattern.subn(flexible_function, script, count=1)
          if count != 1:
              raise SystemExit('replace_once function override failed')
          exec(compile(script, 'notes_v3_workspace_repair.py', 'exec'))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Notes workspace layout and editor performance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi
