name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check governing documentation parity
        run: python scripts/audit/documentation_parity.py

      - name: Check repository hygiene and structure growth
        env:
          STRUCTURE_GROWTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/audit/repository_hygiene.py

      - name: Check PocketBase schema parity
        run: python scripts/audit/pocketbase_schema_contract.py

      - name: Verify live plans postponement schema
        if: github.event_name == 'push'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
          POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
          POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          user="${SSH_USER:-root}"
          host="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$host" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$user@$host" \
            "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$app_dir" && -f "$app_dir/pb_data/data.db" ]]
          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          con = sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True)
          cols = {row[1] for row in con.execute('PRAGMA table_info(plans)')}
          required = {'initial_date_key', 'is_postponed'}
          missing = sorted(required - cols)
          print('plans_postponement_fields=' + ','.join(sorted(required & cols)))
          if missing:
              raise SystemExit('missing_live_plan_fields=' + ','.join(missing))
          print('plans_postponement_schema_verified=true')
          con.close()
          PY
          REMOTE

      - name: Check deployment ordering contract
        run: python scripts/audit/deployment_contract.py

      - name: Check all PocketBase JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' files < <(find pb_hooks pb_migrations -type f -name '*.js' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo 'No PocketBase JavaScript files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi
