name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main, feature/people-settings]
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register People files in concise structure map
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/people-settings'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/APP_STRUCTURE.md')
          text = path.read_text(encoding='utf-8')
          marker = '### 3.2.P People — Settings-owned personal relationship domain'
          if marker not in text:
              block = '''\n\n### 3.2.P People — Settings-owned personal relationship domain\n\nPeople is an on-demand Settings feature. External address books stay in a hidden source index and never become visible People merely because a contact exists in a provider.\n\n| Path | Role |\n| :--- | :--- |\n| `lib/data/people/people_models.dart` | Pure People/Circle/source-index domain types and relationship/import-state enums |\n| `lib/data/people/people_service.dart` | On-demand PocketBase CRUD, source-index counts, and bounded birthday-reminder reconciliation; no startup contact scan |\n| `lib/features/settings/people/people_settings_page.dart` | Settings → Account → People UI with People, Circles, and Sources sections |\n| `lib/features/settings/people/people_strings.dart` | Feature-local EN/RU copy for the People settings surface |\n\n**People source law:** provider records use `unknown / candidate / linked / ignored / blocked`; only an explicit link or approved import rule creates a visible Person. Circles are many-to-many and are not task Categories.\n'''
              anchor = '\n## 4.'
              if anchor in text:
                  text = text.replace(anchor, block + anchor, 1)
              else:
                  text += block
              path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate detailed structure manifest on People branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/people-settings'
        run: python scripts/manual/generate_app_structure_detailed.py

      - name: Commit generated People structure docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/people-settings'
        shell: bash
        run: |
          if git diff --quiet -- docs/APP_STRUCTURE.md docs/APP_STRUCTURE_DETAILED.md; then
            echo 'Structure docs already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/APP_STRUCTURE.md docs/APP_STRUCTURE_DETAILED.md
            git commit -m 'Document People module structure'
            git push origin HEAD:feature/people-settings
          fi

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check governing documentation parity
        run: python scripts/audit/documentation_parity.py

      - name: Check repository hygiene and structure growth
        env:
          STRUCTURE_GROWTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/audit/repository_hygiene.py

      - name: Check PocketBase schema parity
        run: python scripts/audit/pocketbase_schema_contract.py

      - name: Check deployment ordering contract
        run: python scripts/audit/deployment_contract.py

      - name: Check all PocketBase JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' files < <(find pb_hooks pb_migrations -type f -name '*.js' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo 'No PocketBase JavaScript files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi
