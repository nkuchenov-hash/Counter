name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: agent/paths-first-class-audit-cleanup
          fetch-depth: 0

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Repair temporary finalizer marker
        shell: bash
        run: |
          sed -i 's|^    end_marker = .*|    end_marker = "\\ndef adapt_file_field_ru("|' scripts/manual/_finalize_paths_docs.py

      - name: Apply final documentation updates
        run: python3 scripts/manual/_finalize_paths_docs.py

      - name: Repair generated RU quality fallbacks
        run: python3 scripts/manual/_fix_structure_ru_quality.py

      - name: Refine generic wording and category RU sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "Shared category pickers, form fields, create-from-picker, local hidden-category preferences.":
                  "Общие picker-экраны категорий, поля формы, создание новой категории из picker и локальные настройки скрытых категорий.",
              "Category pickers Notes/Planning/Timeline/Wear и create-from-picker":
                  "Picker категорий в Notes, Planning, Timeline и Wear, включая создание новой категории из picker.",
              "Shared tree rendering и search filtering.":
                  "Общий рендер дерева категорий и фильтрация по поиску.",
          }

          for source in Path("scripts/manual").glob("*.py"):
              text = source.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if source.name == "structure_en_ru_adapt.py":
                  updated = updated.replace(
                      'f"{kind.capitalize()} `{name}` относится к области `{parent}`."',
                      'f"{kind.capitalize()} `{name}` хранится в каталоге `{parent}` и обслуживает его ответственность."',
                  )
              if updated != text:
                  source.write_text(updated, encoding="utf-8")
          PY

      - name: Regenerate detailed structure guide
        run: python3 scripts/manual/generate_app_structure_detailed.py

      - name: Validate generated structure and whitespace
        shell: pwsh
        run: |
          ./scripts/audit/architecture_guard.ps1 -Strict
          git diff --check

      - name: Restore canonical CI, remove temporary finalizers, and commit
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/architecture-guard.yml
          rm -f scripts/manual/_finalize_paths_docs.py
          rm -f scripts/manual/_fix_structure_ru_quality.py
          rm -f .github/workflows/paths-doc-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Paths docs and bilingual structure guide'
          git push origin HEAD:agent/paths-first-class-audit-cleanup
