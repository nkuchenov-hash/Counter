name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: agent/paths-first-class-audit-cleanup
          fetch-depth: 0

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Fix generic RU folder fallback and finalize docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Fix the generator at the source: unknown folders must never fall
          # back to copied English in RU blocks.
          p = Path('scripts/manual/structure_en_ru_adapt.py')
          text = p.read_text(encoding='utf-8')
          old = '''def adapt_folder_field_ru(key: str, field: str, en_val: str) -> str:\n    k = key.replace("\\\\", "/").strip("/")\n    curated = EXACT_FOLDER_RU.get(k, {})\n    ru_key = f"{field}_ru"\n    if curated.get(ru_key) and not has_banned_filler(curated[ru_key]):\n        return sanitize_ru_prose(curated[ru_key])\n    if field == "delete":\n        return delete_en_to_ru(en_val)\n    if field == "related":\n        return en_val\n    class_ru = folder_class_field(k, field, en_val)\n    if class_ru and ru_field_ok(class_ru, min_cyrillic=6):\n        return class_ru\n    adapted = sanitize_ru_prose(_phrase_translate(en_val))\n    if ru_field_ok(adapted, min_cyrillic=6):\n        return adapted\n    return ""\n'''
          new = '''def _generic_folder_field_ru(key: str, field: str) -> str:\n    """Last-resort meaningful RU prose for newly tracked folder classes.\n\n    This is intentionally Russian-first. Renderer must never copy an English\n    folder field into the RU section just because a new directory has not yet\n    received a curated entry.\n    """\n    k = key.replace("\\\\", "/").strip("/")\n    leaf = k.rsplit("/", 1)[-1] if k else "root"\n\n    if k == "test" or k.startswith("test/") or k == "integration_test" or k.startswith("integration_test/"):\n        values = {\n            "what": f"Каталог `{k}/` объединяет автоматические проверки области `{leaf}`.",\n            "why": f"Отдельная группа проверок позволяет контролировать `{leaf}` независимо от других сценариев приложения.",\n            "inside": "Содержит тестовые сценарии, fixture-данные и вспомогательные материалы, которые видны в дочерних файлах.",\n            "affects": "Не входит в пользовательскую сборку; влияет на обнаружение регрессий до публикации приложения.",\n            "when": f"Открывать при изменении поведения `{leaf}` или при падении связанной автоматической проверки.",\n            "related": f"`{k}/`, соответствующие production-модули и общий набор `test/`.",\n        }\n        return values.get(field, "")\n\n    if k == "docs" or k.startswith("docs/"):\n        values = {\n            "what": f"Раздел документации `{k}/` хранит материалы по теме `{leaf}`.",\n            "why": f"Выделенная тема помогает отделить сведения о `{leaf}` от других архитектурных, продуктовых и эксплуатационных документов.",\n            "inside": "Содержит отслеживаемые спецификации, отчёты или справочные материалы, перечисленные ниже по файлам.",\n            "affects": "Влияет на решения при разработке и сопровождении; содержимое само по себе не исполняется в приложении.",\n            "when": f"Открывать при проверке требований, истории решений или текущего состояния темы `{leaf}`.",\n            "related": f"`{k}/` и governing-документы, которые ссылаются на этот раздел.",\n        }\n        return values.get(field, "")\n\n    if k == "scripts" or k.startswith("scripts/") or k.endswith("/scripts") or "/scripts/" in k:\n        values = {\n            "what": f"Каталог `{k}/` объединяет автоматизацию и обслуживающие команды для области `{leaf}`.",\n            "why": "Повторяемые операции вынесены в код, чтобы сборка, аудит и обслуживание не зависели от ручного набора команд.",\n            "inside": "Содержит скрипты и их вспомогательные файлы; точное действие каждого скрипта описано в его собственной записи.",\n            "affects": "Влияет на разработку, проверку или публикацию, но не является пользовательским экраном приложения.",\n            "when": f"Открывать при запуске или исправлении автоматизации, связанной с `{leaf}`.",\n            "related": f"`{k}/`, CI/workflow-файлы и документация соответствующей операции.",\n        }\n        return values.get(field, "")\n\n    if k == "lib" or k.startswith("lib/"):\n        values = {\n            "what": f"Раздел исходного кода `{k}/` объединяет ответственность `{leaf}` внутри текущей архитектуры.",\n            "why": f"Выделение `{leaf}` удерживает эту ответственность отдельно от соседних слоёв и упрощает поиск владельца поведения.",\n            "inside": "Содержит отслеживаемые исходники и подкаталоги этой ответственности; конкретные роли описаны ниже по файлам.",\n            "affects": f"Изменения здесь могут менять работу области `{leaf}` в собранном приложении.",\n            "when": f"Открывать при реализации, диагностике или рефакторинге ответственности `{leaf}`.",\n            "related": f"`{k}/`, `docs/APP_STRUCTURE.md` и соседние модули того же слоя.",\n        }\n        return values.get(field, "")\n\n    platform_roots = ("android", "ios", "web", "windows", "linux", "macos", "installer")\n    top = k.split("/", 1)[0] if k else "repo"\n    if top in platform_roots:\n        values = {\n            "what": f"Раздел `{k}/` содержит файлы цели `{top}`, относящиеся к `{leaf}`.",\n            "why": f"Эти файлы нужны инструментам цели `{top}` для сборки, упаковки или запуска соответствующей части приложения.",\n            "inside": "Содержит конфигурацию, ресурсы или исходники платформенного слоя; назначение уточняется в дочерних записях.",\n            "affects": f"Влияет только на сборку или поведение приложения на цели `{top}` и не заменяет продуктовую логику Dart.",\n            "when": f"Открывать, когда ошибка сборки или запуска цели `{top}` указывает на `{leaf}`.",\n            "related": f"`{top}/`, Flutter tooling и соответствующие platform build-файлы.",\n        }\n        return values.get(field, "")\n\n    values = {\n        "what": f"Каталог `{k}/` хранит отслеживаемые материалы области `{leaf}`.",\n        "why": f"Он выделяет ответственность `{leaf}` из соседних частей проекта и фиксирует её отдельным путём в git.",\n        "inside": "Содержит конфигурацию, данные, ресурсы или инструменты; точные роли определяются дочерними файлами.",\n        "affects": "Влияет на сборку, данные, обслуживание или отдельную подсистему согласно дочерним файлам этого каталога.",\n        "when": f"Открывать при работе с областью `{leaf}` или когда на этот путь указывает сборка, аудит либо документация.",\n        "related": f"`{k}/` и дочерние tracked-файлы этого раздела.",\n    }\n    return values.get(field, "")\n\n\ndef adapt_folder_field_ru(key: str, field: str, en_val: str) -> str:\n    k = key.replace("\\\\", "/").strip("/")\n    curated = EXACT_FOLDER_RU.get(k, {})\n    ru_key = f"{field}_ru"\n    if curated.get(ru_key) and not has_banned_filler(curated[ru_key]):\n        return sanitize_ru_prose(curated[ru_key])\n    if field == "delete":\n        return delete_en_to_ru(en_val)\n    if field == "related":\n        return en_val\n    class_ru = folder_class_field(k, field, en_val)\n    if class_ru and ru_field_ok(class_ru, min_cyrillic=6):\n        return class_ru\n    adapted = sanitize_ru_prose(_phrase_translate(en_val))\n    if ru_field_ok(adapted, min_cyrillic=6):\n        return adapted\n    fallback = sanitize_ru_prose(_generic_folder_field_ru(k, field))\n    if fallback and ru_field_ok(fallback, min_cyrillic=6):\n        return fallback\n    return ""\n'''
          if old not in text:\n              raise SystemExit('adapt_folder_field_ru anchor not found')\n          p.write_text(text.replace(old, new, 1), encoding='utf-8')\n\n          # 2) Final project navigation/roadmap/changelog/report updates.\n          p = Path('AGENT_NAVIGATION.md')\n          text = p.read_text(encoding='utf-8')\n          if 'docs/reports/PATHS_FIRST_CLASS_AND_REPO_AUDIT_2026-08-17.md' not in text:\n              text = text.replace(\n                  '| `docs/reports/FINAL_STRUCTURE_AUDIT_2026-07-06.md` | Final structure audit verdict + watchlist (repo-only). |',\n                  '| `docs/reports/FINAL_STRUCTURE_AUDIT_2026-07-06.md` | Final structure audit verdict + watchlist (repo-only). |\\n| `docs/reports/PATHS_FIRST_CLASS_AND_REPO_AUDIT_2026-08-17.md` | Current Paths ownership migration + repository/doc-drift audit. |',\n                  1,\n              )\n          text = text.replace(\n              '`lib/data/` (Brain + part files + `data/voice/` + `data/categories/`), `lib/data/local_sync/` (offline outboxes), `lib/features/` (UI modules + `settings/voice/` + `settings/categories/`),',\n              '`lib/data/` (Brain + part files + `data/voice/` + `data/categories/` + `data/paths/` + `data/health/`), `lib/data/local_sync/` (offline outboxes), `lib/features/` (UI modules + `paths/` + `settings/voice/` + `settings/categories/` + `settings/health/` + `settings/notifications/`),',\n              1,\n          )\n          if '| **Paths screen** |' not in text:\n              text = text.replace(\n                  '| **Plans screen** | `lib/features/planning/planning_view.dart` (barrel), `planning_page.dart`, `planning_page_shell.dart` | `PlanningSwipeWrapper` → `PlanningPage`; shell index 1 |',\n                  '| **Plans screen** | `lib/features/planning/planning_view.dart` (barrel), `planning_page.dart`, `planning_page_shell.dart` | `PlanningSwipeWrapper` → `PlanningPage`; shell index 1 |\\n| **Paths screen** | `lib/features/paths/paths_page.dart` | `PathsPage`; shell index 6 on every form factor; desktop side nav and mobile/tablet More select the same destination |\\n| **Paths domain** | `lib/data/paths/path_repository.dart` | `PathRepository`, `ProjectPathSnapshot`, `auditPathStructure`; transition adapter over existing active Path roots |',\n                  1,\n              )\n          p.write_text(text, encoding='utf-8')\n\n          p = Path('docs/ROADMAP.md')\n          text = p.read_text(encoding='utf-8').replace('Updated 2026-06-09.', 'Updated 2026-08-17.', 1)\n          if '### P1P — Paths first-class architecture (#93)' not in text:\n              anchor = '**Docs:** `docs/ARCHITECTURE.md` § PERFORMANCE_KILL_SWITCH_LAW · `docs/UX_CONTRACT.md` § Performance & Responsiveness Contract · `AGENT_NAVIGATION.md` · `lib/core/perf_flags.dart` · `lib/core/p0u_feature_flags.dart`\\n\\n'\n              section = '''### P1P — Paths first-class architecture (#93) — in progress\\n\\n**Goal:** make Paths a real domain and app destination that can later support safe AI-assisted Draft → Review → Publish → Planner workflows without granting AI direct application/database authority.\\n\\n**Foundation completed 2026-08-17:**\\n- ✅ `lib/data/paths/path_repository.dart` is the Path domain/transition boundary over current active roots; feature UI no longer parses storage markers.\\n- ✅ `lib/features/paths/paths_page.dart` is the first-class responsive destination; opening it is read-only with respect to migration/bootstrap/governance/Planner generation.\\n- ✅ Main shell index 6 owns Paths on desktop/mobile/tablet; desktop no longer needs a nested second shell for the active destination.\\n- ✅ Duplicate active roots are detected without read-time deletion.\\n- ✅ Generic Path structure validation is pure and covered by three focused tests.\\n- ✅ Existing Health Connect/sleep/unfilled-time production modules discovered by strict audit were added to the canonical structure manifest.\\n- ✅ Completed one-off category-default-time self-patching workflow removed.\\n- ✅ `APP_STRUCTURE_DETAILED` generation now has a Russian-first fallback for newly tracked folder classes instead of copying EN prose into RU sections.\\n\\n**Remaining phases:**\\n1. extract legacy Path migration/repair and Planner bridge/governance out of shell;\\n2. durable `draft` / `reviewed` / `active` / `archived` revisions plus Project Memory fields;\\n3. move hard-coded project-specific policy from Dart into stored project/Path context;\\n4. provider-neutral `/api/ai/...` Path proposal layer with whitelisted tools, validation, approval for sensitive actions, audit and undo;\\n5. idempotent live migration and parity proof; only then delete old V1/V2/V3/project-specific shell code.\\n\\nReport: `docs/reports/PATHS_FIRST_CLASS_AND_REPO_AUDIT_2026-08-17.md`.\\n\\n'''\n              if anchor not in text:\n                  raise SystemExit('ROADMAP anchor not found')\n              text = text.replace(anchor, anchor + section, 1)\n          p.write_text(text, encoding='utf-8')\n\n          p = Path('CHANGELOG.md')\n          text = p.read_text(encoding='utf-8')\n          if not text.startswith('## 2026-08-17 — Paths first-class foundation and repository audit'):\n              entry = '''## 2026-08-17 — Paths first-class foundation and repository audit [engineering]\\n\\n- Added `lib/data/paths/path_repository.dart` + `lib/features/paths/paths_page.dart`; Paths is now main-shell destination 6 and page-open no longer requires migration/bootstrap/governance/Planner side effects.\\n- Preserved current Path rows through a transition repository, report duplicate active roots without deleting on read, and added three focused structure-audit tests.\\n- Strict repository audit exposed 13 already-shipped Health Connect/sleep/unfilled-time Dart files missing from `APP_STRUCTURE.md`; the canonical manifest was repaired instead of weakening the guard.\\n- Fixed generated structure-doc bilingual fallback so newly tracked folders receive meaningful Russian text instead of copied English.\\n- Removed completed `.github/workflows/temp-fix-category-default-time.yml`; synchronized Architecture, UX, structure, agent routing, Roadmap and detailed structure documentation.\\n- Verification: strict architecture guard + `git diff --check`, analyzer, 3 Paths tests, release web build and Android arm64 release build all pass on the production Flutter 3.41.6 toolchain.\\n\\n'''\n              p.write_text(entry + text, encoding='utf-8')\n\n          # Add curated descriptions for the newly introduced/recent ownership roots.\n          p = Path('scripts/manual/structure_guide_data.py')\n          text = p.read_text(encoding='utf-8')\n          insert_anchor = '    "lib/data/profile": {'\n          blocks = ''\n          if '"lib/data/paths": {' not in text:\n              blocks += '''    "lib/data/paths": {\\n        "what": "First-class Path domain boundary — structured project paths, transition storage interpretation, and generic validation.",\\n        "why": "Paths must be usable by UI, Planner, and future AI proposals without feature/shell code parsing storage markers.",\\n        "inside": "`path_repository.dart`: Path snapshots, status vocabulary, compatibility load/save, duplicate-root reporting, structure audit.",\\n        "affects": "Paths screen and future explicit Path → Planner / AI proposal services.",\\n        "when": "Path loading, stage/action structure, active-root conflicts, or Path storage migration.",\\n        "delete": "No — first-class Paths depends on this domain boundary.",\\n        "related": "`lib/features/paths/`, `docs/ARCHITECTURE.md` §6.1, issue #93.",\\n    },\\n'''\n          if '"lib/data/health": {' not in text:\n              blocks += '''    "lib/data/health": {\\n        "what": "Sleep/health Brain services — pure sleep policy plus device/cloud sleep synchronization orchestration.",\\n        "why": "Imported health sleep must be normalized and conflict-checked before becoming Life OS timeline data.",\\n        "inside": "Health sleep policy, device sync service, cloud sleep sync service.",\\n        "affects": "Sleep history, Morning Start Day, health integration status and background sync.",\\n        "when": "Recent sleep is missing, duplicated, overlaps manual records, or a health sync reports stale/error state.",\\n        "delete": "No — shipped health/sleep integration depends on it.",\\n        "related": "`lib/services/health_connect/`, Timeline sleep policy, health settings.",\\n    },\\n'''\n          if blocks:\n              if insert_anchor not in text:\n                  raise SystemExit('structure guide data profile anchor missing')\n              text = text.replace(insert_anchor, blocks + insert_anchor, 1)\n\n          feature_anchor = '    "lib/features/planning": {'\n          blocks = ''\n          if '"lib/features/paths": {' not in text:\n              blocks += '''    "lib/features/paths": {\\n        "what": "First-class Paths UI — project list/detail, goal, stages, actions, progress, and structure warnings.",\\n        "why": "Paths is a real app destination rather than product UI embedded inside shell/More code.",\\n        "inside": "`paths_page.dart`.",\\n        "affects": "Desktop side-nav Paths and phone/tablet More → Paths.",\\n        "when": "Path navigation, responsive layout, Path goal/stage/action editing.",\\n        "delete": "No — the Paths destination disappears.",\\n        "related": "`lib/data/paths/path_repository.dart`, `lib/app/shell/app_shell.dart`.",\\n    },\\n'''\n          if '"lib/features/settings/health": {' not in text:\n              blocks += '''    "lib/features/settings/health": {\\n        "what": "Health integration settings UI.",\\n        "why": "Users need connection/sync state and explicit controls for supported health sleep sources.",\\n        "inside": "`health_connect_settings_section.dart`.",\\n        "affects": "Profile/settings health integration controls.",\\n        "when": "Health Connect setup, sync status, or permissions UI is wrong.",\\n        "delete": "No — shipped health settings depend on it.",\\n        "related": "`lib/data/health/`, `lib/services/health_connect/`.",\\n    },\\n'''\n          if '"lib/features/settings/notifications": {' not in text:\n              blocks += '''    "lib/features/settings/notifications": {\\n        "what": "Notification-specific settings UI.",\\n        "why": "Users control reminder behavior separately from Timeline rendering and OS notification delivery.",\\n        "inside": "`unfilled_time_notifications_section.dart`.",\\n        "affects": "Unfilled Timeline-gap reminder preferences.",\\n        "when": "Gap reminder enable/disable or notification preference UI is wrong.",\\n        "delete": "No — shipped notification settings depend on it.",\\n        "related": "`lib/data/records/unfilled_time_gap_service.dart`, `lib/services/unfilled_time_notification_service.dart`.",\\n    },\\n'''\n          if '"lib/services/health_connect": {' not in text:\n              blocks += '''    "lib/services/health_connect": {\\n        "what": "Platform bridge for Health Connect sleep reads and permissions.",\\n        "why": "Brain health sync needs one capability-gated interface across Android and unsupported platforms.",\\n        "inside": "Sleep models, conditional facade, Android/IO implementation, unsupported-platform stub.",\\n        "affects": "Android Health Connect sleep import only; other platforms safely stub the capability.",\\n        "when": "Health Connect permission/read behavior or platform gating breaks.",\\n        "delete": "No — Android health integration depends on it.",\\n        "related": "`lib/data/health/health_sleep_sync_service.dart`.",\\n    },\\n'''\n          if blocks:\n              if feature_anchor not in text:\n                  raise SystemExit('structure guide data planning anchor missing')\n              text = text.replace(feature_anchor, blocks + feature_anchor, 1)\n          p.write_text(text, encoding='utf-8')\n\n          p = Path('docs/reports/PATHS_FIRST_CLASS_AND_REPO_AUDIT_2026-08-17.md')\n          text = p.read_text(encoding='utf-8')\n          start = '## Verification required before merge\\n\\n'\n          if start in text:\n              prefix, _ = text.split(start, 1)\n              suffix = '''## Repository-wide structural drift found by this pass\\n\\nStrict `architecture_guard.ps1 -Strict` initially found 13 production Dart files that already existed on `main` but were absent from `APP_STRUCTURE.md`: Health Connect sleep services/models, health sleep sync/policy, cloud sleep sync, unfilled-time gap service/policy/banner, notification bridge/settings, and health settings. These were documented in the canonical manifest; the guard was not weakened.\\n\\nRegenerating `APP_STRUCTURE_DETAILED.md` then exposed a second documentation defect: newly tracked folder classes could fall through the RU adapter and silently reuse English prose in the Russian block. The generator now supplies a Russian-first semantic fallback for `lib`, tests, docs, scripts, platform trees and other tracked directories while keeping the quality gate enabled.\\n\\nThe guard continues to report its pre-existing watchlist warnings for large/mixed shell files and raw legacy Material controls. Those are not automatic delete/split targets; `shell_more_menu.dart` remains especially relevant to issue #93 because old Path migration/UI code still lives there.\\n\\n## Verification recorded 2026-08-17\\n\\n- `architecture_guard.ps1 -Strict` — passed after manifest parity repair.\\n- `git diff --check` — passed.\\n- `flutter analyze --no-fatal-infos --no-fatal-warnings` — passed.\\n- `flutter test test/paths/path_structure_audit_test.dart` — 3/3 passed.\\n- Release web build — passed with the production Flutter **3.41.6** toolchain.\\n- Android arm64 release APK build — passed with the same production toolchain.\\n- A first verifier attempt used floating Flutter `stable` (3.47.0) and failed inside `flutter_quill 11.5.0` because that dependency is incompatible with the newer `TextInputClient` API. Production deploy pins Flutter 3.41.6, so verification was corrected to the production toolchain rather than changing application code for a false gate.\\n\\n## Merge boundary\\n\\nThis pass is safe to review/merge as the **foundation** of #93, but #93 itself remains open. Old Path migration/bootstrap/governance code is deliberately retained until an idempotent migration/repair service, durable revisions/Project Memory, and Planner bridge parity exist.\\n'''\n              p.write_text(prefix + suffix, encoding='utf-8')\n          PY

      - name: Regenerate detailed structure guide
        run: python3 scripts/manual/generate_app_structure_detailed.py

      - name: Validate generated structure and whitespace
        shell: pwsh
        run: |
          ./scripts/audit/architecture_guard.ps1 -Strict
          git diff --check

      - name: Restore canonical CI and commit finalization
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/architecture-guard.yml
          rm -f .github/workflows/paths-doc-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Paths docs and bilingual structure guide'
          git push origin HEAD:agent/paths-first-class-audit-cleanup
