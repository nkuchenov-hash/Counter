name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main, feature/people-settings]
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize People governing docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/people-settings'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def append_once(path_str, marker, block):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  text = text.rstrip() + '\n\n' + block.strip() + '\n'
                  path.write_text(text, encoding='utf-8')

          app = Path('docs/APP_STRUCTURE.md')
          text = app.read_text(encoding='utf-8')
          marker = '### 3.2.P People — Settings-owned personal relationship domain'
          if marker not in text:
              block = '''\n\n### 3.2.P People — Settings-owned personal relationship domain\n\nPeople is an on-demand Settings feature. External address books stay in a hidden source index and never become visible People merely because a contact exists in a provider.\n\n| Path | Role |\n| :--- | :--- |\n| `lib/data/people/people_models.dart` | Pure People/Circle/source-index domain types and relationship/import-state enums |\n| `lib/data/people/people_service.dart` | On-demand PocketBase CRUD, source-index counts, and bounded birthday-reminder reconciliation; no startup contact scan |\n| `lib/features/settings/people/people_settings_page.dart` | Settings → Account → People UI with People, Circles, and Sources sections |\n| `lib/features/settings/people/people_strings.dart` | Feature-local EN/RU copy for the People settings surface |\n\n**People source law:** provider records have explicit review, linked, ignored, and blocked states; only an explicit link or approved import rule creates a visible Person. Circles are many-to-many and are not task Categories.\n'''
              anchor = '\n## 4.'
              text = text.replace(anchor, block + anchor, 1) if anchor in text else text + block
          text = text.replace(
              '**People source law:** provider records use `unknown / candidate / linked / ignored / blocked`; only an explicit link or approved import rule creates a visible Person. Circles are many-to-many and are not task Categories.',
              '**People source law:** provider records have explicit review, linked, ignored, and blocked states; only an explicit link or approved import rule creates a visible Person. Circles are many-to-many and are not task Categories.',
          )
          app.write_text(text, encoding='utf-8')

          append_once('docs/DATA_MAP.md', '## People domain (2026-09-03)', r'''
          ## People domain (2026-09-03)

          People is a separate personal-relationship domain; it does not reuse plan Categories.

          ### `people`
          - `id`: PocketBase 15-char system id; REST path id only.
          - `user_id`: relation → `profiles.id`; required owner.
          - `person_id`: stable client business id.
          - `display_name`: visible Person name.
          - `relationship_status`: `important`, `known`, `reference`, `ignored`, `blocked`.
          - `birthday_month` / `birthday_day`: optional as a pair.
          - `birthday_year`: optional; missing year must not prevent birthday reminders.
          - `birthday_notifications_enabled`: whether Life OS schedules Person birthday reminders.
          - `birthday_reminder_days`: JSON array of non-negative day offsets; default client policy is 7, 1, 0.
          - `circles_link`: multi-relation → `people_circles.id`.
          - `notes`: Person notes.
          - `source_refs`: provenance metadata for linked external identities.
          - `archived`: soft-delete visibility flag.

          ### `people_circles`
          - `id`: PocketBase system id.
          - `user_id`: owner relation → `profiles.id`.
          - `circle_id`: stable business id.
          - `name`, `sort_order`, `archived`.
          - A Person may belong to multiple Circles; Circles do not replace task Categories.

          ### `people_source_contacts`
          Hidden source index for external address books and social providers.
          - `user_id`: owner relation.
          - `provider`: `device_contacts`, `google_contacts`, `microsoft`, `vk`, `telegram`, `facebook`, `manual`.
          - `external_id`: provider identity; unique together with owner + provider.
          - optional source name/birthday/group metadata.
          - `import_state`: `unknown`, `candidate`, `linked`, `ignored`, `blocked`.
          - `person_link`: optional relation → `people.id` after explicit approval/rule.
          - `raw_meta`, `last_seen_at`, `archived`.

          **Source hygiene law:** merely existing in an external contact source never creates a visible Person. `ignored` and `blocked` decisions persist across future source syncs.
          ''')

          append_once('docs/POCKETBASE_MANIFEST.md', '## People collections (2026-09-03)', r'''
          ## People collections (2026-09-03)

          Canonical client collection names are `PbCollections.people`, `PbCollections.peopleCircles`, and `PbCollections.peopleSourceContacts`.

          - `people.user_id`, `people_circles.user_id`, and `people_source_contacts.user_id` are relations to `profiles.id` and are owner-scoped for list/view/create/update/delete.
          - `people.circles_link` is a multi-relation to `people_circles.id`.
          - `people_source_contacts.person_link` is an optional relation to `people.id`.
          - Unique ownership keys: `(user_id, person_id)`, `(user_id, circle_id)`, `(user_id, provider, external_id)`.
          - Source rows are not visible People by default. External connectors write the hidden source index first; only explicit linking or an approved import rule may create/link `people` rows.
          - Birthday year is optional. Birthday month/day are stored separately so yearless birthdays remain first-class.
          - The initial People release exposes provider surfaces but does not yet implement Google/phone/VK/Telegram/Microsoft/Facebook connector adapters.
          ''')

          append_once('docs/UX_CONTRACT.md', '## People / source hygiene contract', r'''
          ## People / source hygiene contract

          - People is reached through Settings → Account → People; it is not a primary app tab.
          - The People surface contains People, Circles, and Sources.
          - External contact/social sources are a hidden index, not the visible People list.
          - A source record must not become a visible Person solely because it exists in an address book or social network.
          - Ignored and blocked source identities remain suppressed across future syncs until the user deliberately changes that decision.
          - Circles are many-to-many social groupings and are independent of task/plan Categories.
          - Birthday month/day may be stored without a year.
          - Birthday reminders are owned by the Person. Plan reminder reconciliation must not cancel People reminders.
          - People loads on demand from Settings and must not add a full address-book scan or provider sync to app startup.
          ''')

          append_once('CLAUDE.md', '## People navigation (2026-09-03)', r'''
          ## People navigation (2026-09-03)

          | What | File | Entry / notes |
          | :--- | :--- | :--- |
          | People settings | `lib/features/settings/people/people_settings_page.dart` | Settings → Account → People; tabs People / Circles / Sources |
          | People data | `lib/data/people/people_service.dart` | On-demand PocketBase CRUD, source-index counts, birthday reminder reconcile |
          | People models | `lib/data/people/people_models.dart` | Person, Circle, provider/import-state types |
          | People schema | `pb_migrations/1788472800_people.js` | `people`, `people_circles`, `people_source_contacts` |
          | Notification ownership | `lib/services/notification_service.dart` | `plan:` and `people:birthday:` payload namespaces; plan reconcile preserves People reminders |

          Source adapters for phone/Google/VK/Telegram/Microsoft/Facebook are not part of the initial implementation; Sources currently establishes the safe storage/UI boundary for those connectors.
          ''')

          changelog = Path('CHANGELOG.md')
          ct = changelog.read_text(encoding='utf-8')
          cm = '## [2026-09-03] - People settings foundation [in review]'
          if cm not in ct:
              entry = r'''
          ## [2026-09-03] - People settings foundation [in review]

          * **People:** added Settings → Account → People with People / Circles / Sources, manual Person + Circle CRUD, optional-year birthdays, and persistent relationship/source hygiene states.
          * **PocketBase:** added `people`, `people_circles`, and hidden `people_source_contacts`; external provider presence never auto-promotes a contact to visible People.
          * **Notifications:** separated plan and People birthday notification ownership so plan alarm reconciliation cannot delete birthday reminders.
          * **Sources:** provider cards/index contract added for device contacts, Google Contacts, Microsoft/Outlook, VK, Telegram, and Facebook; actual provider adapters are intentionally not connected yet.
          '''.strip() + '\n\n'
              pos = ct.find('\n## [')
              if pos >= 0:
                  ct = ct[:pos+1] + '\n' + entry + ct[pos+1:]
              else:
                  ct = ct.rstrip() + '\n\n' + entry
              changelog.write_text(ct, encoding='utf-8')
          PY

      - name: Regenerate detailed structure manifest on People branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/people-settings'
        run: python scripts/manual/generate_app_structure_detailed.py

      - name: Commit final People governing docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/people-settings'
        shell: bash
        run: |
          if git diff --quiet -- docs/APP_STRUCTURE.md docs/APP_STRUCTURE_DETAILED.md docs/DATA_MAP.md docs/POCKETBASE_MANIFEST.md docs/UX_CONTRACT.md CLAUDE.md CHANGELOG.md; then
            echo 'People governing docs already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/APP_STRUCTURE.md docs/APP_STRUCTURE_DETAILED.md docs/DATA_MAP.md docs/POCKETBASE_MANIFEST.md docs/UX_CONTRACT.md CLAUDE.md CHANGELOG.md
            git commit -m 'Document People data and UX contracts'
            git push origin HEAD:feature/people-settings
          fi

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check governing documentation parity
        run: python scripts/audit/documentation_parity.py

      - name: Check repository hygiene and structure growth
        env:
          STRUCTURE_GROWTH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/audit/repository_hygiene.py

      - name: Check PocketBase schema parity
        run: python scripts/audit/pocketbase_schema_contract.py

      - name: Check deployment ordering contract
        run: python scripts/audit/deployment_contract.py

      - name: Check all PocketBase JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' files < <(find pb_hooks pb_migrations -type f -name '*.js' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo 'No PocketBase JavaScript files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi
