name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi

  notes-desktop-verify:
    name: notes-desktop-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Notes branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Notes formatting
        run: dart format --output=none --set-exit-if-changed lib/features/notes/widgets/notes_library_body.dart lib/features/notes/widgets/notes_editor_screen.dart lib/features/notes/widgets/note_editor_block_widgets.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Build production web preview
        run: flutter build web --release --no-tree-shake-icons --base-href /Counter/notes-v3-preview/

      - name: Publish preview to gh-pages
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          PREVIEW_DIR="/tmp/notes-v3-preview"
          PAGES_DIR="/tmp/counter-gh-pages"
          rm -rf "$PREVIEW_DIR" "$PAGES_DIR"
          mkdir -p "$PREVIEW_DIR"
          cp -R build/web/. "$PREVIEW_DIR/"
          printf '%s' "$SOURCE_SHA" > "$PREVIEW_DIR/source-sha.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add "$PAGES_DIR" origin/gh-pages
          cd "$PAGES_DIR"
          git checkout -B gh-pages origin/gh-pages
          rm -rf notes-v3-preview
          mkdir -p notes-v3-preview
          cp -R "$PREVIEW_DIR"/. notes-v3-preview/
          touch .nojekyll
          git add .nojekyll notes-v3-preview
          if ! git diff --cached --quiet; then
            git commit -m "Publish Notes desktop workspace preview ${SOURCE_SHA}"
            git push origin HEAD:gh-pages
          fi

      - name: Verify public preview SHA
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          URL="https://nkuchenov-hash.github.io/Counter/notes-v3-preview/source-sha.txt"
          for attempt in $(seq 1 36); do
            ACTUAL="$(curl -fsSL -H 'Cache-Control: no-cache' "${URL}?cb=$(date +%s%N)" || true)"
            if [ "$ACTUAL" = "$SOURCE_SHA" ]; then
              echo "Public preview verified at ${SOURCE_SHA}"
              exit 0
            fi
            echo "Waiting for Pages CDN (${attempt}/36): '${ACTUAL}'"
            sleep 10
          done
          echo "Public preview did not expose ${SOURCE_SHA}"
          exit 1
