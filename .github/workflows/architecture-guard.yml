name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi

  notes-audio-phase:
    name: notes-audio-phase
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/notes-v3-design-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Correct focused-test patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/manual/apply_notes_audio_phase.py')
          source = path.read_text(encoding='utf-8')
          marker = '# Extend the existing editor/model test, preserving exactly three tests total.'
          tail = """# Extend the existing editor/model test, preserving exactly three tests total.
          replace_once(
              \"test/notes_canonical_components_test.dart\",
              \"      final deleted = editor.deleteBlock(bodyId);\",
              dedent(
                  r'''      const audio = NoteAudioData(
                  dataUrl: 'data:audio/wav;base64,UklGRg==',
                  durationMs: 1250,
                  transcript: 'Recorded thought',
                  transcriptStatus: NoteAudioTranscriptStatus.ready,
                );
                editor.insertAfter(
                  editor.visibleBlocks.last.id,
                  NoteBlockType.audio,
                  audio: audio,
                );
                final audioBlock = editor.visibleBlocks.singleWhere(
                  (block) => block.type == NoteBlockType.audio,
                );
                expect(audioBlock.audio?.durationMs, 1250);

                final deleted = editor.deleteBlock(bodyId);
          '''
              ),
          )
          replace_once(
              \"test/notes_canonical_components_test.dart\",
              \"      expect(\\n        saved.blocks\\n            .singleWhere((block) => block.id == legacy.id)\",
              \"      expect(\\n        saved.blocks\\n            .singleWhere((block) => block.type == NoteBlockType.audio)\\n            .audio\\n            ?.transcript,\\n        'Recorded thought',\\n      );\\n      expect(\\n        saved.blocks\\n            .singleWhere((block) => block.id == legacy.id)\",
          )

          print('Notes audio phase patched successfully.')
          """
          path.write_text(source[:source.index(marker)] + tail, encoding='utf-8')
          PY

      - name: Apply Notes audio phase
        run: python scripts/manual/apply_notes_audio_phase.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/data/models.dart \
            lib/data/models/note_audio_types.dart \
            lib/data/models/note_document.dart \
            lib/data/plans/notes_brain_helpers.dart \
            lib/features/notes/notes_audio_controller.dart \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/notes_editor_document_controller.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_component_media_blocks.dart \
            lib/features/notes/widgets/notes_editor_tools.dart \
            lib/l10n/langs/en.dart \
            lib/l10n/langs/ru.dart \
            test/notes_canonical_components_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Exclude temporary runner from implementation commit
        run: git checkout -- scripts/manual/apply_notes_audio_phase.py

      - name: Verify architecture and whitespace
        shell: pwsh
        run: |
          ./scripts/audit/architecture_guard.ps1 -Strict
          git diff --check

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Notes audio recording and transcript"
          git push origin HEAD:feature/notes-v3-design-system
