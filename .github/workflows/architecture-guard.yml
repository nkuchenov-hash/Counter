name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format Notes repair
        run: |
          dart format \
            lib/features/notes/widgets/notes_library_body.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_editor_screen.dart

      - name: Commit formatter output if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/notes/widgets/notes_library_body.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_editor_screen.dart
          git commit -m "Format Notes workspace repair"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "Formatter commit pushed; next PR run will execute verification."
          exit 0

      - name: Analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Exactly three focused Notes tests
        run: |
          TEST_COUNT=$(grep -E "^[[:space:]]*test(Widgets)?\(" test/notes_canonical_components_test.dart | wc -l)
          test "$TEST_COUNT" -eq 3
          flutter test test/notes_canonical_components_test.dart

      - name: Production web build
        run: flutter build web --release --base-href="/Counter/notes-v3-preview/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Universal Android release build
        run: flutter build apk --release --no-tree-shake-icons

      - name: Package Notes repair artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Counter-Notes-v3-workspace-repair.apk
          (cd build/web && zip -qr ../../Counter-Notes-v3-workspace-web.zip .)
          sha256sum Counter-Notes-v3-workspace-repair.apk > Counter-Notes-v3-workspace-repair.sha256

      - name: Upload Notes repair artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notes-v3-workspace-repair
          path: |
            Counter-Notes-v3-workspace-repair.apk
            Counter-Notes-v3-workspace-repair.sha256
            Counter-Notes-v3-workspace-web.zip
          if-no-files-found: error
