name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi

  notes-v3-verify:
    name: notes-v3-verify
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/notes-v3-design-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up production Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Notes formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/data/models.dart \
            lib/data/models/note_audio_types.dart \
            lib/data/models/note_document.dart \
            lib/data/plans/notes_brain_helpers.dart \
            lib/features/dev/component_lab_view.dart \
            lib/features/dev/component_lab_notes_demo.dart \
            lib/features/notes/notes_audio_controller.dart \
            lib/features/notes/notes_image_tools.dart \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/notes_editor_document_controller.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_component_media_blocks.dart \
            lib/features/notes/widgets/notes_editor_tools.dart \
            lib/l10n/langs/en.dart \
            lib/l10n/langs/ru.dart \
            test/notes_canonical_components_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Build production web release
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
