name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Notes format check
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/notes/widgets/notes_library_body.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_editor_screen.dart

      - name: Analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Exactly three focused Notes tests
        run: |
          TEST_COUNT=$(grep -E "^[[:space:]]*test(Widgets)?\(" test/notes_canonical_components_test.dart | wc -l)
          test "$TEST_COUNT" -eq 3
          flutter test test/notes_canonical_components_test.dart

      - name: Production web build
        run: |
          flutter build web --release --base-href="/Counter/notes-v3-preview/" --no-tree-shake-icons --no-wasm-dry-run
          git rev-parse HEAD > build/web/notes-source-sha.txt

      - name: Deploy Notes preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          target-folder: notes-v3-preview
          clean: false

      - name: Verify public preview SHA
        shell: bash
        run: |
          EXPECTED=$(git rev-parse HEAD)
          URL="https://nkuchenov-hash.github.io/Counter/notes-v3-preview/notes-source-sha.txt"
          for attempt in $(seq 1 30); do
            ACTUAL=$(curl -fsSL --no-cache "$URL?attempt=$attempt" 2>/dev/null || true)
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "Verified public preview SHA: $ACTUAL"
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not publish expected SHA $EXPECTED"
          exit 1
