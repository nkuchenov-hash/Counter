name: Architecture Guard

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: architecture-guard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strict-structure:
    name: strict-structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check for whitespace errors
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git fetch --no-tags --prune origin main
            git diff --check "origin/main...HEAD"
          fi

  notes-image-phase:
    name: notes-image-phase
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/notes-v3-design-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Check whether implementation is needed
        id: needed
        run: |
          if [ -f lib/features/notes/notes_image_tools.dart ]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.needed.outputs.value == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Use compatible image clipboard package
        if: steps.needed.outputs.value == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/manual/apply_notes_image_phase.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              "import 'package:super_clipboard/super_clipboard.dart';",
              "import 'package:clipboard/clipboard.dart';",
          )
          source = source.replace(
              "  super_clipboard: ^0.9.1",
              "  clipboard: ^3.0.14",
          )
          old_copy = """Future<void> copyNotesImage(String dataUrl) async {
            final clipboard = SystemClipboard.instance;
            if (clipboard == null) throw StateError('clipboard_unavailable');
            final bytes = await notesImagePngBytes(dataUrl);
            final item = DataWriterItem(suggestedName: 'life-os-note.png');
            item.add(Formats.png(bytes));
            await clipboard.write([item]);
          }
          """
          new_copy = """Future<void> copyNotesImage(String dataUrl) async {
            final bytes = await notesImagePngBytes(dataUrl);
            await FlutterClipboard.copyImage(bytes);
          }
          """
          if old_copy not in source:
              raise SystemExit('clipboard function anchor missing')
          source = source.replace(old_copy, new_copy, 1)
          start = source.index('# Android rich-image clipboard provider.')
          end = source.index('# iOS picker permissions.')
          source = source[:start] + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply Notes image phase
        if: steps.needed.outputs.value == 'true'
        run: python scripts/manual/apply_notes_image_phase.py

      - name: Resolve dependencies
        if: steps.needed.outputs.value == 'true'
        run: flutter pub get

      - name: Format changed Dart files
        if: steps.needed.outputs.value == 'true'
        run: |
          dart format \
            lib/features/notes/notes_image_tools.dart \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/widgets/notes_editor_tools.dart \
            lib/l10n/langs/en.dart \
            lib/l10n/langs/ru.dart \
            test/notes_canonical_components_test.dart

      - name: Analyze
        if: steps.needed.outputs.value == 'true'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused Notes tests
        if: steps.needed.outputs.value == 'true'
        run: flutter test test/notes_canonical_components_test.dart

      - name: Build web release
        if: steps.needed.outputs.value == 'true'
        run: flutter build web --release

      - name: Build Android arm64 debug APK
        if: steps.needed.outputs.value == 'true'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify architecture and whitespace
        if: steps.needed.outputs.value == 'true'
        shell: pwsh
        run: |
          ./scripts/audit/architecture_guard.ps1 -Strict
          git diff --check

      - name: Commit verified implementation
        if: steps.needed.outputs.value == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pubspec.yaml pubspec.lock \
            ios/Runner/Info.plist \
            docs/APP_STRUCTURE.md \
            lib/features/notes/notes_image_tools.dart \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/widgets/notes_editor_tools.dart \
            lib/l10n/langs/en.dart \
            lib/l10n/langs/ru.dart \
            test/notes_canonical_components_test.dart
          git commit -m "Add Notes image sources and editing options"
          git push origin HEAD:feature/notes-v3-design-system
