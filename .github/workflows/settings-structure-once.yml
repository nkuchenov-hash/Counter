name: Regenerate Settings Structure Once
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/settings-structure-once.yml'
      - 'lib/features/profile/menu/life_os_settings_tabs_page.dart'

permissions:
  contents: write

jobs:
  docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout change branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Regenerate authoritative structure guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "life-os-docs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/settings-structure-once.yml
          python scripts/manual/generate_app_structure_detailed.py
          git add docs/APP_STRUCTURE_DETAILED.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(structure): regenerate detailed map for native settings"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
