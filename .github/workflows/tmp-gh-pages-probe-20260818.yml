# trigger: 2026-08-18T10:12Z
name: One-time gh-pages probe

on:
  push:
    paths:
      - '.github/workflows/tmp-gh-pages-probe-20260818.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write probe to gh-pages
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git worktree add --detach /tmp/ghp origin/gh-pages
          cd /tmp/ghp
          printf '%s\n' "$SOURCE_SHA" > actions-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions-probe.txt
          git commit -m "Record gh-pages probe" || true
          git push origin HEAD:gh-pages
