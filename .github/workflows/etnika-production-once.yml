name: One-shot ETNIKA PocketBase correction

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/etnika-production-once.yml'

permissions:
  contents: write

concurrency:
  group: etnika-production-once
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm ETNIKA hook is inert
        shell: bash
        run: |
          set -euo pipefail
          node --check pb_hooks/zz_google_fit_final_normalize_once.pb.js
          ! grep -qE 'onBootstrap|cronAdd|onRecord' pb_hooks/zz_google_fit_final_normalize_once.pb.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Repair ETNIKA directly in stopped production database
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" > /tmp/etnika-result.txt <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$service_name" && -n "$app_dir" && -f "$app_dir/pb_data/data.db" ]]

          # Never leave the service stopped even if the data repair fails.
          restart_pb() { $SUDO systemctl start "$service_name" >/dev/null 2>&1 || true; }
          trap restart_pb EXIT
          $SUDO systemctl stop "$service_name"
          backup_dir="$app_dir/pb_data/etnika-backup-$(date -u +%Y%m%dT%H%M%SZ)"
          $SUDO mkdir -p "$backup_dir"
          $SUDO cp -a "$app_dir"/pb_data/data.db* "$backup_dir/" 2>/dev/null || true

          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import copy, datetime, json, secrets, sqlite3, string, sys

          db = sys.argv[1]
          con = sqlite3.connect(db)
          con.row_factory = sqlite3.Row
          con.execute('PRAGMA foreign_keys=ON')

          ROOT = 'этника'
          CHILD = 'Обновление основной страницы сайта'
          CHILD_KEY = 'etnika_homepage_update_20260825'
          PATH_ID = 'etnika-homepage-redesign-hourly-20260824'
          REVISION_ID = PATH_ID + '-v1'
          GOAL = 'Переработать существующую главную страницу ЭТНИКА в Tilda без полного пересоздания сайта: сохранить текущую основу и рабочие интеграции, обновить типографику и композицию, последовательно переделать каждый white-блок, адаптировать desktop/mobile, провести QA и опубликовать обновлённую production-страницу.'

          def action(stage_id, index, text, result, minutes, track):
              return {'id': f'{stage_id}-a{index}', 'text': text, 'result': result, 'minutes': minutes, 'track': track, 'isDone': False}

          def stage(stage_id, text, done, items):
              return {
                  'type': 'stage', 'id': stage_id, 'text': text,
                  'definitionOfDone': done, 'isDone': False,
                  'actions': [action(stage_id, i + 1, *item) for i, item in enumerate(items)],
              }

          stages = [
              stage('h01','Аудит текущей страницы: карта desktop и mobile','Есть полный список всех текущих white-блоков, их роли и mobile-поведения.',[
                  ('Перечислить все desktop-блоки сверху вниз','Полная desktop-карта',20,'analysis'),
                  ('Сопоставить mobile-версию каждого блока','Полная mobile-карта',20,'analysis'),
                  ('Для каждого блока записать функцию, сообщение и CTA','У каждого блока понятна роль',20,'analysis')]),
              stage('h02','Scope, зависимости и безопасный rollback','Зафиксировано, что сохраняем, какие интеграции нельзя сломать и как откатить изменения.',[
                  ('Разметить блоки keep / rework / move / merge / remove','Нет блока без решения',20,'governance'),
                  ('Зафиксировать forms, links, anchors, analytics, SEO и custom code','Есть список технических зависимостей',20,'analysis'),
                  ('Зафиксировать scope и rollback baseline текущей Tilda-страницы','Полный rebuild исключён, откат определён',20,'governance')]),
              stage('h03','Типографика: аудит и выбор шрифтов','Выбран Tilda-совместимый font stack на основе проблем текущей страницы.',[
                  ('Провести аудит текущих шрифтов, размеров, весов и line-height','Список типографических проблем',30,'design'),
                  ('Выбрать и проверить финальный font stack','Рабочая система шрифтов утверждена',30,'design')]),
              stage('h04','Типографика: шкалы, интервалы и интерактивные элементы','Готовы desktop/mobile type scale, line-height, text width, spacing rhythm и правила CTA.',[
                  ('Задать desktop и mobile type scale','H1/H2/H3/body/caption определены',20,'design'),
                  ('Задать line-height, max text width и вертикальный rhythm','Правила читаемости определены',20,'design'),
                  ('Задать типографику кнопок, ссылок и подписей и проверить на реальном блоке','Система откалибрована',20,'design')]),
              stage('h05','Сообщение страницы и минимальная перестройка структуры','Есть first-screen message, основной CTA и окончательный порядок существующих блоков.',[
                  ('Сформулировать, что посетитель должен понять за первые 5–10 секунд','Hero-message определён',20,'content'),
                  ('Определить основной CTA и найти дубли/провалы текущего сценария','Главное действие и проблемы ясны',20,'analysis'),
                  ('Зафиксировать минимальные move/merge/split и финальный порядок блоков','Есть новая карта страницы',20,'design')]),
              stage('h06','Redesign-spec: header и hero','Header и первый экран полностью описаны до реализации на desktop и mobile.',[
                  ('Спроектировать header/navigation на базе текущего блока','Header-spec готов',30,'design'),
                  ('Спроектировать hero: композиция, текст, CTA и visual hierarchy','Hero-spec готов',30,'design')]),
              stage('h07','Redesign-spec: первая половина основных white-блоков','Первая половина смысловых блоков имеет отдельное решение по композиции и типографике.',[
                  ('Разобрать и переработать первую группу блоков по audit map','Первая группа имеет redesign-spec',30,'design'),
                  ('Проверить переходы, CTA и визуальный rhythm первой группы','Первая группа собрана в связный сценарий',30,'design')]),
              stage('h08','Redesign-spec: вторая половина и trust/proof блоки','Оставшиеся смысловые и доказательные блоки имеют отдельные redesign-решения.',[
                  ('Разобрать и переработать вторую группу блоков по audit map','Вторая группа имеет redesign-spec',30,'design'),
                  ('Довести benefits/cases/trust/proof до единой системы','Доказательная часть страницы согласована',30,'design')]),
              stage('h09','Redesign-spec: CTA, формы, контакты и footer','Все конверсионные и завершающие блоки спроектированы без потери текущих отправок и ссылок.',[
                  ('Спроектировать CTA/contact/footer в новой системе','Конец страницы согласован',20,'design'),
                  ('Переработать формы визуально без изменения рабочих направлений отправки','Form-spec готов',20,'design'),
                  ('Сверить spec со всей audit map и закрыть пропущенные блоки','Слепых зон нет',20,'quality')]),
              stage('h10','Tilda desktop: header, hero и новая типографика','Первый экран desktop реализован в существующей Tilda-странице и использует новую систему.',[
                  ('Переработать header/navigation в рабочей копии Tilda','Header реализован',30,'implementation'),
                  ('Переработать hero и применить новую типографику','Hero реализован',30,'implementation')]),
              stage('h11','Tilda desktop: первая половина white-блоков','Первая половина страницы реализована по согласованным specs.',[
                  ('Переделать первую часть white-блоков','Первая часть реализована',30,'implementation'),
                  ('Довести контейнеры, сетку и вертикальный rhythm первой части','Композиция первой части цельная',30,'implementation')]),
              stage('h12','Tilda desktop: вторая половина white-блоков','Вторая половина страницы реализована по согласованным specs.',[
                  ('Переделать вторую часть white-блоков','Вторая часть реализована',30,'implementation'),
                  ('Довести trust/proof/CTA/footer блоки','Конец страницы реализован',30,'implementation')]),
              stage('h13','Desktop consistency и сохранение интеграций','Desktop выглядит как одна система, а все интерактивные элементы продолжают работать.',[
                  ('Убрать остатки старых шрифтов, случайных размеров и интервалов','Desktop consistency закрыт',20,'quality'),
                  ('Проверить buttons, links, anchors и формы','Интерактивные элементы работают',20,'quality'),
                  ('Проверить analytics/custom code/SEO-зависимости после перестройки','Технические зависимости сохранены',20,'quality')]),
              stage('h14','Mobile: header, hero и первая половина страницы','Первый экран и первая половина имеют намеренную mobile-композицию, а не уменьшенный desktop.',[
                  ('Адаптировать header и hero','Mobile first screen готов',20,'implementation'),
                  ('Адаптировать первую половину изменённых блоков','Первая половина mobile готова',20,'implementation'),
                  ('Проверить mobile type scale, spacing и tap targets первой части','Первая часть удобна на телефоне',20,'quality')]),
              stage('h15','Mobile: вторая половина, формы и breakpoints','Вся mobile-страница устойчива на разных ширинах и без overflow/keyboard проблем.',[
                  ('Адаптировать вторую половину и footer','Вторая половина mobile готова',20,'implementation'),
                  ('Проверить forms/CTA/keyboard/overflow','Мобильные формы и CTA работают',20,'quality'),
                  ('Проверить несколько ширин и breakpoint-переходы','Layout устойчив',20,'quality')]),
              stage('h16','Контент, media, performance и accessibility polish','Тексты и изображения финализированы, тяжёлые assets устранены, базовая доступность проверена.',[
                  ('Сделать финальный copy pass и убрать дубли/лишний текст','Copy финализирован',20,'content'),
                  ('Оптимизировать изображения/media и проверить loading','Нет неоправданно тяжёлых assets',20,'performance'),
                  ('Проверить contrast, alt/labels, keyboard/focus и читаемость','Базовая accessibility закрыта',20,'quality')]),
              stage('h17','Финальный QA, публикация и live-проверка','Production-страница опубликована, P0/P1 дефекты закрыты, формы/ссылки/analytics/SEO проверены после публикации.',[
                  ('Провести desktop/tablet/mobile QA и закрыть P0/P1','Release candidate готов',20,'quality'),
                  ('Опубликовать обновлённую страницу в Tilda','Новая версия live',20,'release'),
                  ('Сделать live smoke test: forms/links/analytics/SEO/основные ширины','Production проверен',20,'release')]),
          ]
          assert len(stages) == 17
          assert sum(len(s['actions']) for s in stages) == 44

          def active(v):
              if isinstance(v, str): return v.strip().lower() in ('1','true','yes')
              return bool(v)

          def new_id(table):
              alphabet = string.ascii_lowercase + string.digits
              while True:
                  value = ''.join(secrets.choice(alphabet) for _ in range(15))
                  if con.execute(f'SELECT 1 FROM "{table}" WHERE id=? LIMIT 1',(value,)).fetchone() is None:
                      return value

          def stamp(row):
              now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S.%f')[:-3] + 'Z'
              if 'created' in row: row['created'] = now
              if 'updated' in row: row['updated'] = now

          def insert_clone(table, row):
              cols = list(row.keys())
              sql = 'INSERT INTO "' + table + '" (' + ','.join('"'+c+'"' for c in cols) + ') VALUES (' + ','.join('?' for _ in cols) + ')'
              con.execute(sql, [row[c] for c in cols])

          categories = [dict(r) for r in con.execute('SELECT * FROM categories')]
          roots = [r for r in categories if str(r.get('name') or '').strip().casefold() == ROOT and not active(r.get('is_archived'))]
          if len(roots) != 1:
              raise RuntimeError(f'expected exactly one active ETNIKA category, got {len(roots)}')
          root = roots[0]
          owner = str(root.get('user_id') or '').strip()
          if not owner: raise RuntimeError('ETNIKA owner is empty')

          root_paths = [dict(r) for r in con.execute('SELECT * FROM paths WHERE user_id=? AND category_link=?',(owner,root['id']))]
          template_path = root_paths[0] if root_paths else None
          if template_path is None:
              r = con.execute('SELECT * FROM paths WHERE user_id=? ORDER BY created LIMIT 1',(owner,)).fetchone()
              template_path = dict(r) if r else None
          if template_path is None:
              raise RuntimeError('no owned Path row available as schema-safe template')
          template_revision = con.execute('SELECT * FROM path_revisions WHERE id=?',(template_path.get('active_revision_link'),)).fetchone()
          if template_revision is None:
              template_revision = con.execute('SELECT * FROM path_revisions WHERE user_id=? ORDER BY created LIMIT 1',(owner,)).fetchone()
          if template_revision is None:
              raise RuntimeError('no owned Path revision available as schema-safe template')
          template_revision = dict(template_revision)

          # Transaction 1: deletion is final and independent of replacement creation.
          con.execute('BEGIN IMMEDIATE')
          con.execute('DELETE FROM paths WHERE user_id=? AND category_link=?',(owner,root['id']))
          for day in range(25,32):
              con.execute('DELETE FROM plans WHERE user_id=? AND plan_id=?',(owner,f'etnika-homepage-redesign-2026-08-{day:02d}'))
          con.commit()

          # Transaction 2: create/reconcile child category and reviewed Path.
          con.execute('BEGIN IMMEDIATE')
          categories = [dict(r) for r in con.execute('SELECT * FROM categories WHERE user_id=?',(owner,))]
          candidates = [r for r in categories if str(r.get('name') or '').strip().casefold() == CHILD.casefold() or str(r.get('category_id') or '').strip() == CHILD_KEY]
          unique = {r['id']: r for r in candidates}
          if len(unique) > 1:
              raise RuntimeError('multiple ETNIKA homepage child categories')
          if unique:
              child = next(iter(unique.values()))
              updates = {'name': CHILD, 'parent_id': root['id'], 'is_archived': 0}
              if 'category_id' in child: updates['category_id'] = CHILD_KEY
              if 'normalized_id' in child: updates['normalized_id'] = CHILD_KEY
              if 'updated' in child: updates['updated'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S.%f')[:-3] + 'Z'
              set_sql = ','.join('"'+k+'"=?' for k in updates)
              con.execute('UPDATE categories SET '+set_sql+' WHERE id=?', list(updates.values())+[child['id']])
              child.update(updates)
          else:
              child = copy.deepcopy(root)
              child['id'] = new_id('categories')
              child['name'] = CHILD
              if 'category_id' in child: child['category_id'] = CHILD_KEY
              if 'normalized_id' in child: child['normalized_id'] = CHILD_KEY
              if 'parent_id' in child: child['parent_id'] = root['id']
              if 'is_archived' in child: child['is_archived'] = 0
              if 'order' in child:
                  sibling_orders = [int(r.get('order') or 0) for r in categories if str(r.get('parent_id') or '') == str(root['id'])]
                  child['order'] = (max(sibling_orders) + 1) if sibling_orders else 0
              stamp(child)
              insert_clone('categories', child)

          # This child Path is unapproved draft state, so enforce exactly one reviewed candidate.
          con.execute('DELETE FROM paths WHERE user_id=? AND (category_link=? OR path_id=?)',(owner,child['id'],PATH_ID))
          con.execute('DELETE FROM path_revisions WHERE user_id=? AND path_id=?',(owner,PATH_ID))

          revision = copy.deepcopy(template_revision)
          revision['id'] = new_id('path_revisions')
          revision['user_id'] = owner
          revision['path_id'] = PATH_ID
          revision['revision_id'] = REVISION_ID
          revision['version'] = 1
          revision['lifecycle'] = 'published'
          revision['goal'] = GOAL
          revision['content'] = json.dumps({'stages': stages}, ensure_ascii=False, separators=(',',':'))
          revision['source'] = 'system'
          revision['parent_revision_id'] = ''
          stamp(revision)
          insert_clone('path_revisions', revision)

          path = copy.deepcopy(template_path)
          path['id'] = new_id('paths')
          path['user_id'] = owner
          path['path_id'] = PATH_ID
          path['category_link'] = child['id']
          path['active_revision_link'] = revision['id']
          path['archived'] = 0
          stamp(path)
          insert_clone('paths', path)
          con.commit()
          con.close()
          PY

          $SUDO systemctl start "$service_name"
          trap - EXIT
          for attempt in {1..30}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/health || true)"
            if [[ "$code" == "200" ]]; then break; fi
            sleep 2
          done
          [[ "${code:-}" == "200" ]]

          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import json, sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro',uri=True); con.row_factory=sqlite3.Row
          cats=con.execute('SELECT id,user_id,name,parent_id,is_archived FROM categories').fetchall()
          roots={r['id']:r for r in cats if (r['name'] or '').strip().casefold()=='этника' and not bool(r['is_archived'])}
          root_paths=[]
          for r in roots.values(): root_paths += con.execute('SELECT id,path_id FROM paths WHERE user_id=? AND category_link=?',(r['user_id'],r['id'])).fetchall()
          children=[r for r in cats if r['parent_id'] in roots and (r['name'] or '').strip().casefold()=='обновление основной страницы сайта' and not bool(r['is_archived'])]
          child_paths=[]; stages_count=0; actions_count=0
          if len(children)==1:
              c=children[0]
              child_paths=con.execute('SELECT id,path_id,active_revision_link FROM paths WHERE user_id=? AND category_link=? AND archived=0',(c['user_id'],c['id'])).fetchall()
              if len(child_paths)==1:
                  rev=con.execute('SELECT content FROM path_revisions WHERE id=?',(child_paths[0]['active_revision_link'],)).fetchone()
                  if rev:
                      data=json.loads(rev['content']) if isinstance(rev['content'],str) else (rev['content'] or {})
                      stages=data.get('stages') or []; stages_count=len(stages); actions_count=sum(len((s or {}).get('actions') or []) for s in stages if isinstance(s,dict))
          plan_count=0
          if len(roots)==1:
              r=next(iter(roots.values())); ids=[f'etnika-homepage-redesign-2026-08-{d:02d}' for d in range(25,32)]; q=','.join('?' for _ in ids)
              plan_count=con.execute(f'SELECT count(*) FROM plans WHERE user_id=? AND plan_id IN ({q})',(r['user_id'],*ids)).fetchone()[0]
          verified=(len(roots)==1 and len(root_paths)==0 and len(children)==1 and len(child_paths)==1 and stages_count==17 and actions_count==44 and plan_count==0)
          print('etnika_hook_status=retired_inert')
          print('etnika_active_roots='+str(len(roots)))
          print('etnika_root_path_rows='+str(len(root_paths)))
          print('etnika_homepage_child_matches='+str(len(children)))
          print('etnika_child_path_rows='+str(len(child_paths)))
          print('etnika_path_stages='+str(stages_count))
          print('etnika_path_actions='+str(actions_count))
          print('etnika_week_plans='+str(plan_count))
          print('etnika_plans_gate_clean='+str(plan_count==0).lower())
          print('etnika_homepage_verified='+str(verified).lower())
          if not verified: raise SystemExit(1)
          con.close()
          PY
          REMOTE
          cat /tmp/etnika-result.txt

      - name: Publish verified production state on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_tmp_sleep_cloud_result.txt')
          old=p.read_text(encoding='utf-8').splitlines() if p.exists() else []
          keep=[x for x in old if not x.startswith('etnika_')]
          fresh=Path('/tmp/etnika-result.txt').read_text(encoding='utf-8').splitlines()
          p.write_text('\n'.join(keep+fresh)+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp_sleep_cloud_result.txt
          git commit -m 'Record verified ETNIKA production state'
