name: Temporary Time View one-pixel overlap check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/features/planning/time_view/planning_time_view_coordinator.dart'
      - 'lib/features/planning/time_view/time_view_drop_preview.dart'
      - 'lib/features/planning/time_view/time_view_overlap_resolver.dart'
      - 'test/time_view_one_pixel_overlap_test.dart'
      - '.github/workflows/_temporary_time_view_one_pixel_overlap_check.yml'

permissions:
  contents: read

jobs:
  focused-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused overlap tests
        run: flutter test test/time_view_one_pixel_overlap_test.dart
