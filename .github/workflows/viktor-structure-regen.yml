name: Regenerate Viktor structure map
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: viktor-structure-regenerate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-detailed-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate canonical detailed map
        run: python scripts/manual/generate_app_structure_detailed.py
      - name: Check generated map without changing the PR
        id: map
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git diff --unified=0 -- docs/APP_STRUCTURE_DETAILED.md | grep -E '^[+-][^+-]' | grep -Ev '^[+-]\*\*Generated (at git SHA|from input HEAD) ' || true)"
          if [[ -z "$changes" ]]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Structure map is current."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff --binary -- docs/APP_STRUCTURE_DETAILED.md > "$RUNNER_TEMP/structure-map.patch"
            echo "::warning::Structure map changed. Commit the regenerated document with the source changes, not via a workflow bot push."
          fi
      - name: Upload updated map and patch for author
        if: steps.map.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-structure-map
          path: |
            docs/APP_STRUCTURE_DETAILED.md
            ${{ runner.temp }}/structure-map.patch
      - name: Require current committed tracked-file manifest
        run: |
          git restore -- docs/APP_STRUCTURE_DETAILED.md
          python scripts/audit/documentation_parity.py
