name: Notes V3 Android Recovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: notes-v3-android-recovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify-apk:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/notes-v3-design-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Notes branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build universal Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK signature and manifest
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          MIN_SDK=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest min-sdk "$APK")
          test "$MIN_SDK" = "26"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" apk summary "$APK"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Counter-Notes-v3-universal-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
