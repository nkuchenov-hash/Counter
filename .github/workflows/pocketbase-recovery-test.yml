name: PocketBase Disaster Recovery — Fresh Schema
on:
  pull_request:
    branches: [main]
    paths:
      - 'pb_migrations/**'
      - 'scripts/audit/pocketbase_recovery_check.sh'
      - 'scripts/audit/pocketbase_recovery_api_test.py'
      - 'scripts/recovery/backup_stage.sh'
      - 'scripts/recovery/install_stage_backups.sh'
      - 'scripts/recovery/setup_https_health_only.sh'
      - 'scripts/recovery/Caddyfile.health-only'
      - 'scripts/recovery/sync_offsite_stage.sh'
      - 'scripts/recovery/install_offsite_stage.sh'
      - 'scripts/recovery/configure_yandex_offsite.sh'
      - 'scripts/recovery/verify_offsite_restore.sh'
      - 'scripts/recovery/browser_cache_export.js'
      - 'scripts/recovery/browser_cache_export.test.cjs'
      - '.github/workflows/pocketbase-recovery-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-db:
    name: Fresh PocketBase 0.40.6 + every migration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser rescue export and ensure no auth leakage
        run: node scripts/recovery/browser_cache_export.test.cjs
      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3 unzip curl
      - name: Boot and validate isolated PocketBase
        run: bash scripts/audit/pocketbase_recovery_check.sh
      - name: Probe API auth and cross-user ownership
        shell: bash
        run: |
          set -euo pipefail
          PB="$RUNNER_TEMP/lifeos-pb-recovery-check/bin/pocketbase"
          DATADIR="$RUNNER_TEMP/lifeos-pb-recovery-check/data"
          "$PB" serve --http=127.0.0.1:18099 --dir="$DATADIR" --migrationsDir="$GITHUB_WORKSPACE/pb_migrations" --hooksDir="$GITHUB_WORKSPACE/pb_hooks" > "$RUNNER_TEMP/lifeos-pb-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:18099/api/health >/dev/null; then break; fi
            sleep 1
          done
          if ! kill -0 "$pid" 2>/dev/null; then
            tail -n 50 "$RUNNER_TEMP/lifeos-pb-server.log"
            exit 1
          fi
          python3 scripts/audit/pocketbase_recovery_api_test.py
      - name: Validate daily backup archive on disposable database
        shell: bash
        run: |
          set -euo pipefail
          STAGING=/opt/lifeos/recovery-stage
          sudo mkdir -p "$STAGING/pb_data"
          sudo cp "$RUNNER_TEMP/lifeos-pb-recovery-check/data/data.db" "$STAGING/pb_data/data.db"
          sudo cp -a pb_hooks pb_migrations "$STAGING/"
          sudo bash scripts/recovery/backup_stage.sh
          FILE="$(sudo find /var/backups/lifeos-stage -maxdepth 1 -name 'stage-*.tar.gz' -type f -print -quit)"
          [ -n "$FILE" ]
          sudo sha256sum --check "$FILE.sha256"
          sudo tar -xOzf "$FILE" './pb_data/data.db' > "$RUNNER_TEMP/restored-staging.db"
          test "$(sqlite3 "$RUNNER_TEMP/restored-staging.db" 'PRAGMA integrity_check;')" = ok
          echo 'PASS: staged backup can be read back; DB integrity maintained.'
      - name: Validate HTTPS health-only Caddy configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/recovery/setup_https_health_only.sh
          sudo apt-get install -y caddy
          caddy validate --config scripts/recovery/Caddyfile.health-only --adapter caddyfile
          grep -Fq 'reverse_proxy 127.0.0.1:8099' scripts/recovery/Caddyfile.health-only
          grep -Fq 'respond "LIFE OS recovery staging: user data API is not public" 503' scripts/recovery/Caddyfile.health-only
          echo 'PASS: HTTPS health-only Caddy config validates; other URLs deny requests.'
      - name: Verify encrypted offsite sync with disposable restic repository
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/recovery/sync_offsite_stage.sh
          bash -n scripts/recovery/install_offsite_stage.sh
          bash -n scripts/recovery/configure_yandex_offsite.sh
          bash -n scripts/recovery/verify_offsite_restore.sh
          grep -Fq 'read -r -s secret_key' scripts/recovery/configure_yandex_offsite.sh
          grep -Fq 'storage.yandexcloud.net/lifeos-backups-2026-nk47/lifeos-stage' scripts/recovery/configure_yandex_offsite.sh
          sudo apt-get install -y restic
          sudo install -d -m 0700 /etc/lifeos
          sudo sh -c 'printf "test-restic-password-for-disposable-ci-only\n" > /etc/lifeos/offsite-repository-password'
          sudo chmod 0600 /etc/lifeos/offsite-repository-password
          sudo chown root:root /etc/lifeos/offsite-repository-password
          REPO="$RUNNER_TEMP/restic-ci-offsite"
          sudo restic -r "$REPO" -p /etc/lifeos/offsite-repository-password init
          sudo tee /etc/lifeos/offsite-backup.env >/dev/null <<EOF
          RESTIC_REPOSITORY='$REPO'
          RESTIC_PASSWORD_FILE='/etc/lifeos/offsite-repository-password'
          LIFEOS_ALLOW_LOCAL_RESTIC_TEST='1'
          EOF
          sudo chmod 0600 /etc/lifeos/offsite-backup.env
          sudo chown root:root /etc/lifeos/offsite-backup.env
          sudo bash scripts/recovery/sync_offsite_stage.sh
          sudo env RESTIC_REPOSITORY="$REPO" RESTIC_PASSWORD_FILE=/etc/lifeos/offsite-repository-password restic snapshots --latest 1
          sudo bash scripts/recovery/verify_offsite_restore.sh
          echo 'PASS: archives uploaded to independently located test repository and restic check succeeded.'
