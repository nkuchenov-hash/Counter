name: LIFE OS one-time latency audit
on:
  push:
    branches: ['audit/lifeos-latency-20261127']
    paths: ['.github/workflows/one-time-latency-audit.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b0eb935d5a93d2f52e463cf4665748c2732c0e9a
          fetch-depth: 1
          persist-credentials: false
      - name: Inventory latency and failure-handling call sites
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, subprocess, collections
          from pathlib import Path
          patterns = {
              "network_call": r"\b(?:http\.(?:get|post|put|delete|patch)|fetch\(|\$http\.send\(|\.send\(|\.getFullList\(|\.getList\(|\.getOne\(|\.subscribe\(|\.create\(|\.update\(|\.delete\()",
              "timeout": r"\.timeout\(|\btimeout\s*[:=]|AbortSignal\.timeout|setTimeout\(|wait_for\(",
              "polling": r"Timer\.periodic\(|setInterval\(|cronAdd\(|while\s*\(",
              "blocking": r"\$os\.cmd\(|\.output\(\)|Process\.runSync\(|readAs(?:String|Bytes)Sync\(|writeAs(?:String|Bytes)Sync\(|sleep\(",
              "delay": r"Future(?:<[^>]+>)?\.delayed\(|setTimeout\(|asyncio\.sleep\(",
              "serial_wait": r"\bawait\b",
              "retry": r"\bretry\b|backoff|Retry-After|retryCount|attempts",
              "uncaught_future": r"unawaited\(|\.then\(",
              "silent_catch": r"catch\s*\([^)]*\)\s*\{\s*\}|except[^:]*:\s*pass\b",
              "full_list": r"getFullList\(|findRecordsByFilter\(|ListView\.builder\(|shrinkWrap:\s*true",
              "heavy": r"jsonDecode\(|jsonEncode\(|\.sort\(|\.where\(|compute\(|Isolate\.",
              "timeout_native": r"withTimeout\(|Thread\.sleep\(|WaitForSingleObject\(|WaitForMultipleObjects\(|dispatch_sync\(|synchronous\b",
              "network_native": r"HttpURLConnection|URLSession|OkHttp|WinHttp|InternetOpen|HttpClient|WebSocket",
          }
          regex={k: re.compile(v,re.I) for k,v in patterns.items()}
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          source_roots=('lib/','pb_hooks/','pb_migrations/','browser_extension/','web/','android/','windows/','ios/','macos/','linux/','installer/')
          extensions={'.dart','.js','.py','.kt','.java','.swift','.cpp','.cc','.h','.c','.cs','.ps1','.html'}
          result={}; counts=collections.Counter(); scopes=collections.Counter()
          for f in files:
              if not f.startswith(source_roots) or Path(f).suffix.lower() not in extensions: continue
              if '/generated/' in f or '/node_modules/' in f: continue
              try: content=Path(f).read_text(encoding='utf-8')
              except (OSError,UnicodeError): continue
              lines=content.splitlines(); hits={}
              for kind,rx in regex.items():
                  matched=[{"line":i,"text":line.strip()[:360]} for i,line in enumerate(lines,1) if rx.search(line) and not line.lstrip().startswith(('//','#','*'))]
                  if matched:
                      hits[kind]=matched
                      counts[kind]+=len(matched)
              result[f]={"lines":len(lines),"hits":hits}
              scopes[f.split('/')[0]]+=1
          report={"sha":subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),"files":len(result),"scopes":dict(scopes),"counts":dict(counts),"results":result}
          Path('audit-inventory.json').write_text(json.dumps(report,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='results'},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: latency-audit-inventory
          path: audit-inventory.json
          retention-days: 7

  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Measure public health endpoint from this runner
        run: |
          for i in 1 2 3; do
            curl -sS --connect-timeout 4 --max-time 8 -o /dev/null -w 'http=%{http_code} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' https://137-22-146-109.sslip.io/api/health || true
          done
      - name: Inspect process resources and sleep freshness without writing production
        env:
          LIFEOS_SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          LIFEOS_SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
          LIFEOS_SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          host=137.22.146.109
          port="${LIFEOS_SSH_PORT:-22}"
          user="${LIFEOS_SSH_USER:-root}"
          test -n "$LIFEOS_SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          key="$RUNNER_TEMP/lifeos_audit_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$LIFEOS_SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -T 8 -p "$port" -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes "$user@$host" 'if [ "$(id -u)" = 0 ]; then exec python3 -; else exec sudo -n python3 -; fi' <<'PY'
          import datetime, json, os, sqlite3, subprocess, time
          from pathlib import Path
          unit="lifeos-recovery-live.service"
          if subprocess.run(["systemctl","is-active","--quiet",unit]).returncode:
              raise SystemExit("active service not found")
          pid=subprocess.check_output(["systemctl","show",unit,"-p","MainPID","--value"],text=True).strip()
          files=set()
          for fd in Path("/proc",pid,"fd").iterdir():
              try:
                  p=Path(os.readlink(fd))
                  if p.name=="data.db" and p.is_file(): files.add(p.resolve())
              except OSError: pass
          if len(files)!=1: raise SystemExit("live database not identified")
          p=files.pop()
          print("active_db_verified=true")
          for line in Path("/proc",pid,"status").read_text().splitlines():
              if line.startswith(("VmRSS:","Threads:")): print(line)
          print("logical_cpus="+str(os.cpu_count()))
          print("load_1_5_15="+str(os.getloadavg()))
          for line in Path("/proc/meminfo").read_text().splitlines():
              if line.startswith(("MemTotal:","MemAvailable:","SwapTotal:","SwapFree:")): print(line)
          print("database_mib="+str(round(p.stat().st_size/1048576,2)))
          db=sqlite3.connect(f"file:{p}?mode=ro",uri=True,timeout=2)
          db.row_factory=sqlite3.Row
          row=db.execute("SELECT user_id,status,last_error,last_session_count,last_imported_count,last_sync_local_day FROM sleep_sync_connections WHERE provider='xiaomi' AND enabled=1 LIMIT 1").fetchone()
          if row:
              print("xiaomi_status="+str(row["status"]))
              err=row["last_error"] or ""
              print("xiaomi_error="+("missing_expected_sleep" if "xiaomi_sleep_not_available_today" in err else "auth" if "auth" in err.lower() else "network" if "timeout" in err.lower() or "unavailable" in err.lower() else "other" if err else "none"))
              print("xiaomi_sessions="+str(row["last_session_count"]))
              print("xiaomi_imported="+str(row["last_imported_count"]))
              uid=row["user_id"]
              pr=db.execute("SELECT timezone_offset FROM profiles WHERE id=?",(uid,)).fetchone()
              offset=float(pr[0] or 0) if pr else 0
              now=datetime.datetime.now(datetime.timezone.utc)
              day=(now+datetime.timedelta(hours=offset)).date()
              start=datetime.datetime.combine(day,datetime.time(),tzinfo=datetime.timezone.utc)-datetime.timedelta(hours=offset)
              end=start+datetime.timedelta(days=1)
              iso=lambda t:t.isoformat(timespec="milliseconds").replace("+00:00","Z")
              q="SELECT count(*) FROM records WHERE user_id=? AND (sleep_source='xiaomi' OR external_source='xiaomi') AND "
              iso_count=db.execute(q+"end_time>=? AND end_time<?",(uid,iso(start),iso(end))).fetchone()[0]
              norm_count=db.execute(q+"end_time>=? AND end_time<?",(uid,iso(start).replace("T"," "),iso(end).replace("T"," "))).fetchone()[0]
              julian_count=db.execute(q+"julianday(end_time)>=julianday(?) AND julianday(end_time)<julianday(?)",(uid,iso(start),iso(end))).fetchone()[0]
              print("profile_day="+day.isoformat())
              print("current_day_raw_iso_count="+str(iso_count))
              print("current_day_normalized_count="+str(norm_count))
              print("current_day_calendar_count="+str(julian_count))
              latest=db.execute("SELECT date(max(end_time)) FROM records WHERE user_id=? AND (sleep_source='xiaomi' OR external_source='xiaomi')",(uid,)).fetchone()[0]
              print("latest_sleep_utc_day="+str(latest))
              for date,n in db.execute("SELECT date(end_time),count(*) FROM records WHERE user_id=? AND (sleep_source='xiaomi' OR external_source='xiaomi') AND date(end_time)>='2026-11-25' GROUP BY date(end_time)",(uid,)):
                  print("sleep_day="+str(date)+" count="+str(n))
          PY
