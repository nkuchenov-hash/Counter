name: LIFE OS one-time integration reliability verification
on:
  push:
    branches: ['audit/lifeos-latency-20261127']
    paths: ['.github/workflows/one-time-latency-audit.yml']
permissions:
  contents: read
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f63fd14f70df25576f419721aae6cca9c5aa2728
          fetch-depth: 0
          persist-credentials: false
      - name: Verify provider timeout and partial read behavior
        run: |
          node --check pb_hooks/calendar_integrations.pb.js
          node --check pb_hooks/people_integrations.pb.js
          node --test test/integration_sync_budget_test.cjs
          python3 - <<'PY'
          import scripts.audit.critical_release_guard as guard
          print("critical_tree_sha256="+guard.fingerprint(guard.snapshot("HEAD")))
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Install dependencies
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
          flutter pub get
      - name: Verify existing integration contracts
        run: |
          flutter test test/calendar_integrations_contract_test.dart test/pocketbase_production_origin_test.dart test/live_sync_contract_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/data/calendar_integrations/calendar_integration_service.dart lib/data/people/people_integration_service.dart
