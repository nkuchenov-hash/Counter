name: Validate realtime app-open fix

on:
  push:
    branches:
      - 'fix/realtime-on-app-open-20260805'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
      - name: Dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/data/db_core.dart test/realtime_app_open_contract_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Three focused tests
        run: flutter test test/realtime_app_open_contract_test.dart
      - name: Release web build
        run: flutter build web --release --base-href='/Counter/' --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
      - name: Release Android arm64 APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: counter-realtime-app-open-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

# Validation rerun after canonical dart formatting.
