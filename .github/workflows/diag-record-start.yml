name: Diagnose record start

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-record-start.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts
      - name: Inspect deployed record hooks
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo '--- service ---'
          systemctl cat pocketbase.service | sed -n '1,120p'
          echo '--- /root/pb files ---'
          find /root/pb -maxdepth 2 -type f \( -name '*.js' -o -name '*.pb.js' \) -printf '%p\n' | sort
          echo '--- /root/pb/pb.js ---'
          if [ -f /root/pb/pb.js ]; then
            nl -ba /root/pb/pb.js | sed -n '1,220p'
          else
            echo 'NO /root/pb/pb.js'
          fi
          echo '--- interval hook deployed ---'
          if [ -f /root/pb/pb_hooks/records.interval_sanitize.pb.js ]; then
            nl -ba /root/pb/pb_hooks/records.interval_sanitize.pb.js | sed -n '1,220p'
          else
            echo 'NO interval hook in /root/pb/pb_hooks'
          fi
          REMOTE
