name: One-shot fix plan gap insertion runtime

on:
  push:
    branches:
      - fix/plan-gap-insertion-runtime-v3

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plan-gap-insertion-runtime-v3
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fix persisted mode and earliest-gap search
        run: python .github/scripts/_patch_plan_gap_runtime.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run placement regression tests
        run: flutter test test/auto_plan_nearest_free_slot_test.dart

      - name: Analyze changed scheduling source
        run: flutter analyze lib/data/plans/plan_time_cascade_helpers.dart

      - name: Remove one-shot helpers
        run: |
          git rm .github/workflows/_one_shot_fix_plan_gap_runtime.yml
          git rm .github/scripts/_patch_plan_gap_runtime.py

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix runtime plan insertion to fill timeline gaps"
          git push origin HEAD:fix/plan-gap-insertion-runtime-v3
