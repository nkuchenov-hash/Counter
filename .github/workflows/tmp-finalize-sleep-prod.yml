name: Finalize sleep production state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-finalize-sleep-prod.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
      LEGACY_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
      LEGACY_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
      SLEEP_SYNC_TOKEN_KEY: ${{ secrets.SLEEP_SYNC_TOKEN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate clean source
        shell: bash
        run: |
          node --check pb_hooks/google_fit_sleep_runtime.js
          node --check pb_hooks/google_fit_sleep_recovery.js
          git diff --check

      - name: Provision and deploy Google Fit sleep runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$LEGACY_CLIENT_ID" && -n "$LEGACY_CLIENT_SECRET" ]]
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          umask 077
          {
            printf 'SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID=%s\n' "$LEGACY_CLIENT_ID"
            printf 'SLEEP_SYNC_GOOGLE_FIT_CLIENT_SECRET=%s\n' "$LEGACY_CLIENT_SECRET"
            if [[ -n "$SLEEP_SYNC_TOKEN_KEY" ]]; then printf 'SLEEP_SYNC_TOKEN_KEY=%s\n' "$SLEEP_SYNC_TOKEN_KEY"; fi
          } > /tmp/lifeos-google-fit.env
          tar -czf /tmp/lifeos-sleep-clean.tar.gz pb_hooks pb_migrations
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" /tmp/lifeos-google-fit.env /tmp/lifeos-sleep-clean.tar.gz \
            "$SSH_USER@$SSH_HOST:/tmp/"

          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" > /tmp/sleep-prod-state.txt <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ {print $1; exit}')"; fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | head -n 1 || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$service_name" && -n "$app_dir" && -d "$app_dir" ]]

          $SUDO install -m 600 /tmp/lifeos-google-fit.env "$app_dir/.lifeos-google-fit.env"
          rm -f /tmp/lifeos-google-fit.env
          override_dir="/etc/systemd/system/${service_name}.d"
          $SUDO mkdir -p "$override_dir"
          printf '[Service]\nEnvironmentFile=%s\n' "$app_dir/.lifeos-google-fit.env" | $SUDO tee "$override_dir/lifeos-google-fit.conf" >/dev/null
          $SUDO rm -f "$override_dir/lifeos-google-health.conf" "$app_dir/.lifeos-google-health.env"

          $SUDO mkdir -p "$app_dir/pb_hooks" "$app_dir/pb_migrations"
          $SUDO tar -xzf /tmp/lifeos-sleep-clean.tar.gz -C "$app_dir" pb_hooks pb_migrations
          rm -f /tmp/lifeos-sleep-clean.tar.gz
          $SUDO rm -f "$app_dir/pb_hooks/google_health_sleep_runtime.js" "$app_dir/pb_migrations/1787133600_clear_legacy_google_health_sleep_error.js"

          $SUDO systemctl stop "$service_name"
          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(sys.argv[1])
          cur=con.cursor()
          cur.execute("""
            UPDATE sleep_sync_connections
               SET enabled=1,
                   status='connected',
                   last_error='',
                   last_full_sync_at='',
                   segment_backfill_complete=0,
                   last_sync_at=''
             WHERE provider='google_fit'
               AND length(coalesce(refresh_token_enc,''))>0
          """)
          con.commit()
          con.close()
          PY
          $SUDO systemctl daemon-reload
          $SUDO systemctl start "$service_name"

          for attempt in {1..20}; do
            health="$(curl -sS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/health || true)"
            route="$(curl -sS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/sleep-sync/status || true)"
            if [[ "$health" == "200" && ( "$route" == "401" || "$route" == "403" ) ]]; then break; fi
            sleep 2
          done
          sleep 70

          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True)
          con.row_factory=sqlite3.Row
          row=con.execute("""
            SELECT enabled,status,last_error,last_sync_at,
                   length(coalesce(refresh_token_enc,'')) AS refresh_len
              FROM sleep_sync_connections
             WHERE provider='google_fit'
             ORDER BY updated DESC LIMIT 1
          """).fetchone()
          c48=con.execute("""
            SELECT count(*) FROM records
             WHERE (title='Sleep' OR title='Сон')
               AND end_time >= datetime('now','-2 days')
          """).fetchone()[0]
          c7=con.execute("""
            SELECT count(*) FROM records
             WHERE (title='Sleep' OR title='Сон')
               AND end_time >= datetime('now','-7 days')
          """).fetchone()[0]
          def errclass(v):
            s=(v or '').lower()
            if not s: return 'none'
            if 'invalid_grant' in s: return 'invalid_grant'
            if '403' in s or 'permission' in s or 'scope' in s: return 'permission'
            if '401' in s: return 'auth'
            return 'other'
          if row:
            print(f'enabled={bool(row["enabled"])}')
            print(f'status={row["status"]}')
            print(f'refresh_token={row["refresh_len"]>0}')
            print(f'error={errclass(row["last_error"])}')
            print(f'last_sync={bool(row["last_sync_at"])}')
          else:
            print('connection=missing')
          print(f'sleep_records_48h={c48}')
          print(f'sleep_records_7d={c7}')
          con.close()
          PY
          REMOTE

      - name: Publish sanitized result and remove workflow
        shell: bash
        run: |
          cp /tmp/sleep-prod-state.txt _tmp_sleep_prod_state.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-finalize-sleep-prod.yml
          git add _tmp_sleep_prod_state.txt
          git commit -m 'Record sanitized sleep production verification'
          git pull --rebase origin main
          git push origin HEAD:main
