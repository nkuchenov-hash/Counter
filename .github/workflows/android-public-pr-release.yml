name: Verify and publish LIFE OS ARM64 APK (PR run)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-public-pr-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: life-os-public-arm64-release-pr
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Report Android public release run for diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "LIFE OS APK publishing run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (source ${GITHUB_SHA})."

      - name: Pin the actual main source revision
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Generate local build environment stub
        shell: bash
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify timezone preference regression
        run: flutter test test/timezone_quick_preferences_test.dart

      - name: Analyze application
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Assemble release APK (ARM64)
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons \
            --dart-define=GIT_COMMIT="${SOURCE_SHA:0:7}" \
            --dart-define=BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Prepare public download and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/LIFE-OS-Android-arm64.apk
          (cd dist && sha256sum LIFE-OS-Android-arm64.apk > SHA256SUMS.txt)
          test -s dist/LIFE-OS-Android-arm64.apk
          file dist/LIFE-OS-Android-arm64.apk
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-OS-Android-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish public stable APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=life-os-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SOURCE_SHA" --title "LIFE OS Android (latest)" --notes "ARM64 Android installer."
          fi
          gh release upload "$TAG" dist/LIFE-OS-Android-arm64.apk dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --title "LIFE OS Android (latest)" \
            --notes "Public ARM64 Android build. Commit: $SOURCE_SHA. Download LIFE-OS-Android-arm64.apk."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name == "LIFE-OS-Android-arm64.apk") | [.name,.size,.browser_download_url] | @tsv'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[] | select(.name == "LIFE-OS-Android-arm64.apk")] | length')" = 1

      - name: Report public APK publishing outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JOB_STATUS: ${{ job.status }}
        continue-on-error: true
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "LIFE OS APK publishing outcome: ${RELEASE_JOB_STATUS}. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Public asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/life-os-latest/LIFE-OS-Android-arm64.apk"
