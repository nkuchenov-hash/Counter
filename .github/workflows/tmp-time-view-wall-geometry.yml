name: Temporary Time View wall geometry repair

on:
  push:
    branches:
      - fix/time-view-wall-geometry-20260910

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/time-view-wall-geometry-20260910
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply surgical patch
        run: python3 tools/tmp_fix_time_view_wall_geometry.py

      - name: Format touched Dart files
        run: |
          dart format \
            lib/features/planning/plan_time_view_layout.dart \
            lib/core/widgets/plan_time_task_card/plan_time_task_card.dart \
            lib/core/widgets/plan_time_task_card/plan_card_metrics.dart \
            test/plan_time_view_wall_alignment_regression_test.dart

      - name: Enforce surgical diff boundary
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only -- lib test | sort)
          printf '%s\n' "${changed[@]}"
          allowed=$(cat <<'EOF'
          lib/core/widgets/plan_time_task_card/plan_card_metrics.dart
          lib/core/widgets/plan_time_task_card/plan_time_task_card.dart
          lib/features/planning/plan_time_view_layout.dart
          EOF
          )
          actual=$(printf '%s\n' "${changed[@]}")
          if [ "$actual" != "$allowed" ]; then
            echo 'Unexpected tracked production/test files changed.' >&2
            exit 1
          fi
          test -f test/plan_time_view_wall_alignment_regression_test.dart
          unexpected_untracked=$(git ls-files --others --exclude-standard | grep -v '^test/plan_time_view_wall_alignment_regression_test.dart$' || true)
          if [ -n "$unexpected_untracked" ]; then
            echo "Unexpected untracked files: $unexpected_untracked" >&2
            exit 1
          fi

      - name: Focused wall-time regression
        run: flutter test test/plan_time_view_wall_alignment_regression_test.dart

      - name: Existing bulk-drag regressions that match non-overlap semantics
        run: |
          flutter test test/plan_time_bulk_drag_test.dart --plain-name "group move preserves relative offsets"
          flutter test test/plan_time_bulk_drag_test.dart --plain-name "insert group after target preserves offsets"
          flutter test test/plan_time_bulk_drag_test.dart --plain-name "insert after target shifts lower touching flexible chain"
          flutter test test/plan_time_bulk_drag_test.dart --plain-name "insert blocked by fixed unselected target neighbor"

      - name: Existing movement and resize regressions
        run: |
          flutter test \
            test/plan_time_drag_gesture_contract_test.dart \
            test/plan_time_sequential_cascade_test.dart \
            test/plan_time_target_drop_test.dart \
            test/time_view_bulk_drag_regression_test.dart \
            test/time_view_bulk_resize_rules_test.dart \
            test/time_view_interaction_block_test.dart \
            test/time_view_one_pixel_overlap_test.dart \
            test/time_view_recurring_interaction_controller_test.dart \
            test/time_view_resize_handle_test.dart \
            test/time_view_snap_minutes_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Build Android ARM64 release
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Commit validated repair only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/planning/plan_time_view_layout.dart \
            lib/core/widgets/plan_time_task_card/plan_time_task_card.dart \
            lib/core/widgets/plan_time_task_card/plan_card_metrics.dart \
            test/plan_time_view_wall_alignment_regression_test.dart
          git diff --cached --check
          git commit -m "Restore exact Time View wall-time geometry"
          git push origin HEAD:fix/time-view-wall-geometry-20260910
