name: Verify Mouser preview
on:
  push:
    branches: [gh-pages]
    paths:
      - mouser-mvp/**
      - .github/workflows/mouser-preview-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mouser-mvp
          fetch-depth: 1
      - name: Verify published file and six WebGL families
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, time, urllib.request, subprocess, shutil
          expected = pathlib.Path('mouser-mvp/index.html').read_bytes()
          version = re.search(rb'MOUSER / UI (\d+)', expected).group(1).decode()
          sha = hashlib.sha256(expected).hexdigest()
          url = 'https://nkuchenov-hash.github.io/Counter/mouser-mvp/design-' + version + '.html'
          for i in range(20):
              try:
                  request = urllib.request.Request(url + '?check=' + str(time.time_ns()), headers={'Cache-Control':'no-cache','User-Agent':'Mouser-Preview-Verify/1.0'})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      data = response.read()
                      actual = hashlib.sha256(data).hexdigest()
                      print('HTTP', response.status, 'SHA256', actual, flush=True)
                      if response.status == 200 and actual == sha:
                          print('Verified exact public Design ' + version + ': ' + url, flush=True)
                          break
              except Exception as e:
                  print(str(e), flush=True)
              time.sleep(8)
          else:
              raise SystemExit('Published content does not match expected SHA256 ' + sha)
          chrome = next((shutil.which(x) for x in ('google-chrome','chromium','chromium-browser') if shutil.which(x)),None)
          if not chrome:
              raise SystemExit('Browser unavailable')
          html = data.decode('utf-8')
          # Avoid external fonts for the offline rendering test.
          html = re.sub(r'<link[^>]+(?:fonts.googleapis.com|fonts.gstatic.com)[^>]*>', '', html)
          test = r'''<script>
          try {
            if(!valid) throw Error("WebGL shader unavailable");
            const stage=document.querySelector("#stage");
            stage.style.width="320px";stage.style.height="230px";
            const result=[];
            if(!document.querySelector(".device-head #familyPicker")||document.querySelector(".controls #familyPicker"))throw Error("Model selector placement");
            if(document.querySelectorAll(".picker-menu:not([hidden])").length)throw Error("Menus visible by default");
            document.querySelector("#familyPicker .picker-trigger").click();
            if(document.querySelector("#families").hidden||document.querySelectorAll("#families .picker-option").length!==6)throw Error("Family menu");
            document.querySelectorAll("#families .picker-option")[2].click();
            if(family!==2||!document.querySelector("#families").hidden)throw Error("Family select");
            document.querySelector("#profilePicker .picker-trigger").click();
            document.querySelectorAll("#profileOptions .picker-option")[1].click();
            if(p!==1||!document.querySelector("#profileOptions").hidden)throw Error("Profile select");
            document.querySelector("#actionPicker .picker-trigger").click();
            document.querySelectorAll("#actionOptions .picker-option")[5].click();
            if(profiles[p].map[k]!==5||!document.querySelector("#actionOptions").hidden)throw Error("Action select");
            for(let i=0;i<families.length;i++){
              selectFamily(i);gl.finish();
              const w=canvas.width,h=canvas.height,buf=new Uint8Array(w*h*4);
              gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,buf);
              let hash=2166136261,contrast=0,markers=document.querySelectorAll(".hot");
              for(let j=0;j<buf.length;j+=4){
                hash=Math.imul(hash^buf[j],16777619);
                hash=Math.imul(hash^buf[j+1],16777619);
                hash=Math.imul(hash^buf[j+2],16777619);
                if(buf[j]<200&&buf[j+1]<200&&buf[j+2]<200)contrast++;
              }
              if(!markers.length||contrast<w*h*.04||getComputedStyle(markers[0]).borderRadius!=="50%")throw Error("Invalid family "+i+" "+contrast);
              result.push({family:families[i].title,hash:hash>>>0,contrast,markers:markers.length});
            }
            if(new Set(result.map(x=>x.hash)).size!==6)throw Error("Models are not distinct");
            document.body.innerHTML='<pre id="qa">PASS '+JSON.stringify(result)+'</pre>';
          } catch(e) { document.body.innerHTML='<pre id="qa">FAIL '+String(e)+'</pre>'; }
          </script>'''
          path=pathlib.Path('/tmp/mouser-verify.html')
          path.write_text(html.replace('</body>',test+'</body>'))
          p=subprocess.run([chrome,'--headless','--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--force-device-scale-factor=1','--window-size=1280,900','--dump-dom',path.as_uri()],capture_output=True,text=True,timeout=140)
          match=re.search(r'<pre id="qa">(.*?)</pre>',p.stdout,re.S)
          print(match.group(1) if match else p.stderr[-3000:],flush=True)
          if not match or not match.group(1).startswith('PASS '):
              raise SystemExit('Browser verification failed')
          PY
      - name: Verify actual GLB collection
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, struct
          root='https://nkuchenov-hash.github.io/Counter/mouser-mvp/'
          with urllib.request.urlopen(root+'model-study.html?verify=10', timeout=20) as r:
              html=r.read()
              assert r.status==200
          assert html==pathlib.Path('mouser-mvp/model-study.html').read_bytes(), 'Gallery differs from source'
          for name in ('wireless','gaming','vertical','trackball'):
              url=root+'models/'+name+'-mouse.glb'
              req=urllib.request.Request(url,headers={'Origin':'https://nkuchenov-hash.github.io','User-Agent':'Mouser-Preview-Verify/1.0'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  b=r.read()
                  assert b[:4]==b'glTF' and struct.unpack_from('<I',b,4)[0]==2 and struct.unpack_from('<I',b,8)[0]==len(b), name
                  cors=r.headers.get('Access-Control-Allow-Origin')
                  assert b==pathlib.Path('mouser-mvp/models/'+name+'-mouse.glb').read_bytes(), name
                  print('GLB /',name,len(b),'bytes / matches vendored file',flush=True)
          print('PASS: public gallery and four external GLB files')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser load and material check
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --remote-debugging-port=9222 --user-data-dir=/tmp/mouser-model-browser about:blank >/tmp/mouser-chrome.log 2>&1 &
          BROWSER_PID=$!
          trap 'kill "$BROWSER_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const delay = ms => new Promise(r=>setTimeout(r,ms));
          let page;
          for(let i=0;i<30;i++){
            try{const response=await fetch('http://127.0.0.1:9222/json/list');page=(await response.json()).find(x=>x.type==='page');if(page)break}catch{}
            await delay(500);
          }
          assert(page,'Chrome DevTools unavailable');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((ok,fail)=>{ws.addEventListener('open',ok,{once:true});ws.addEventListener('error',fail,{once:true})});
          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',e=>{let m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){let cb=pending.get(m.id);pending.delete(m.id);cb(m)}});
          function cmd(method,params={}){return new Promise((resolve,reject)=>{let id=++seq;pending.set(id,m=>m.error?reject(new Error(JSON.stringify(m.error))):resolve(m.result));ws.send(JSON.stringify({id,method,params}));setTimeout(()=>{if(pending.delete(id))reject(new Error('CDP timeout '+method))},15000).unref()})}
          await cmd('Page.enable');
          await cmd('Page.navigate',{url:'https://nkuchenov-hash.github.io/Counter/mouser-mvp/model-study.html?browsercheck=10'});
          let state;
          try{
            for(let i=0;i<45;i++){
              await delay(1500);
              const r=await cmd('Runtime.evaluate',{expression:'Array.from(document.querySelectorAll(".status")).map(x=>x.textContent)',returnByValue:true});
              state=r.result.value;console.log('Model states',state);
              if(state?.length===4&&state.every(x=>x==='GLB / READY'))break;
              if(state?.some(x=>x.includes('ERROR')))break;
            }
            assert.deepEqual(state,Array(4).fill('GLB / READY'));
            console.log('PASS: four GLB models loaded and unified materials applied in browser');
          } finally {ws.close()}
          JS
