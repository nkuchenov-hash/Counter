name: Verify Mouser preview
on:
  push:
    branches: [gh-pages]
    paths:
      - mouser-mvp/**
      - .github/workflows/mouser-preview-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mouser-mvp
          fetch-depth: 1
      - name: Verify published HTML and 18 approved image assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, time, urllib.request, subprocess, shutil
          expected = pathlib.Path('mouser-mvp/index.html').read_bytes()
          version = re.search(rb'MOUSER / UI (\d+)', expected).group(1).decode()
          sha = hashlib.sha256(expected).hexdigest()
          url = 'https://nkuchenov-hash.github.io/Counter/mouser-mvp/design-' + version + '.html'
          for i in range(20):
              try:
                  request = urllib.request.Request(url + '?check=' + str(time.time_ns()), headers={'Cache-Control':'no-cache','User-Agent':'Mouser-Preview-Verify/1.0'})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      data = response.read()
                      actual = hashlib.sha256(data).hexdigest()
                      print('HTTP', response.status, 'SHA256', actual, flush=True)
                      if response.status == 200 and actual == sha:
                          print('Verified exact public Design ' + version + ': ' + url, flush=True)
                          break
              except Exception as e:
                  print(str(e), flush=True)
              time.sleep(8)
          else:
              raise SystemExit('Published content does not match expected SHA256 ' + sha)
          import json
          root='https://nkuchenov-hash.github.io/Counter/mouser-mvp/renders-v16/'
          for name,views in json.loads(pathlib.Path('mouser-mvp/renders-v16/metadata.json').read_text()).items():
              for view,meta in views.items():
                  with urllib.request.urlopen(root+meta['file'],timeout=25) as r:
                      body=r.read()
                      assert r.status==200
                  assert body[:4]==b'RIFF' and body[8:12]==b'WEBP' and hashlib.sha256(body).hexdigest()==meta['sha256'],meta['file']
                  print('Verified published render',name,view,len(body),flush=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser load and material check
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --remote-debugging-port=9222 --user-data-dir=/tmp/mouser-model-browser about:blank >/tmp/mouser-chrome.log 2>&1 &
          BROWSER_PID=$!
          trap 'kill "$BROWSER_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const delay = ms => new Promise(r=>setTimeout(r,ms));
          let page;
          for(let i=0;i<30;i++){
            try{const response=await fetch('http://127.0.0.1:9222/json/list');page=(await response.json()).find(x=>x.type==='page');if(page)break}catch{}
            await delay(500);
          }
          assert(page,'Chrome DevTools unavailable');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((ok,fail)=>{ws.addEventListener('open',ok,{once:true});ws.addEventListener('error',fail,{once:true})});
          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',e=>{let m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){let cb=pending.get(m.id);pending.delete(m.id);cb(m)}});
          function cmd(method,params={}){return new Promise((resolve,reject)=>{let id=++seq;pending.set(id,m=>m.error?reject(new Error(JSON.stringify(m.error))):resolve(m.result));ws.send(JSON.stringify({id,method,params}));setTimeout(()=>{if(pending.delete(id))reject(new Error('CDP timeout '+method))},15000).unref()})}
          await cmd('Runtime.enable');
          ws.addEventListener('message',e=>{const m=JSON.parse(e.data);if(m.method==='Runtime.exceptionThrown')console.log('BROWSER ERROR',JSON.stringify(m.params.exceptionDetails));});
          await cmd('Page.enable');
          await cmd('Emulation.setDeviceMetricsOverride',{width:1440,height:1000,deviceScaleFactor:1,mobile:false});
          await cmd('Page.navigate',{url:'https://nkuchenov-hash.github.io/Counter/mouser-mvp/design-21.html?browsercheck=21'});
          async function ev(expression){const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value}
          async function ready(i,v){for(let j=0;j<60;j++){await delay(250);let q=await ev('window.mouserQA');if(q?.error)throw Error(JSON.stringify(q));if(q?.ready&&q.family===i&&q.view===v)return q;}throw Error('Image timed out '+i+' '+v)}
          try{
            await ready(0,0);
            await ev('document.querySelector("[data-page=settings]").click()');
            assert.equal(await ev('getComputedStyle(document.querySelector("#enabled")).borderTopWidth'),'0px');
            await ev('document.querySelector("#enabled").click()');
            assert.equal(await ev('document.querySelector("#enabled").getAttribute("aria-checked")'),'false');
            await ev('document.querySelector("#languagePicker .picker-trigger").click();document.querySelectorAll("#languageOptions .picker-option")[1].click()');
            assert.equal(await ev('document.documentElement.lang'),'en');
            assert.equal(await ev('document.querySelector("#settings h1").textContent'),'Settings');
            assert.equal(await ev('document.querySelector("[data-page=device]").textContent'),'Button mappings');
            await ev('document.querySelector("#languagePicker .picker-trigger").click();document.querySelectorAll("#languageOptions .picker-option")[0].click()');
            assert.equal(await ev('document.documentElement.lang'),'ru');
            assert.equal(await ev('document.querySelector("#deviceLabel").textContent'),'01 / УСТРОЙСТВО');
            assert.equal(await ev('document.querySelectorAll(".views button")[1].textContent'),'СВЕРХУ');
            await ev('document.querySelector("[data-page=profiles]").click()');
            assert.equal(await ev('document.querySelector("#globalProfile .profile-name").textContent'),'Все приложения');
            assert.equal(await ev('profiles[1].map[3]'),14);
            assert.equal(await ev('p=1;mapping(3).a'),2);
            await ev('p=0;refresh();document.querySelector("#newProfile").value="test-app.exe";document.querySelector("#appForm").requestSubmit()');
            assert.equal(await ev('profiles[p].exe'),'test-app.exe');
            assert.equal(await ev('profiles[p].map[3]'),14);
            await ev('p=0;refresh()');
            await ev('document.querySelector("#minimize").click()');
            assert.equal(await ev('document.querySelector("#appShell").hidden'),true);
            await ev('document.querySelector("#restoreWindow").click()');
            assert.equal(await ev('document.querySelector("#appShell").hidden'),false);
            await ev('document.querySelector("#closeWindow").click();document.querySelector("#restoreWindow").click();document.querySelector("[data-page=device]").click()');
            await ready(0,0);
            for(let i=0;i<6;i++){
              await ev('selectFamily('+i+')');
              for(let v=0;v<3;v++){
                await ev('document.querySelector(".views button[data-view=\\"'+v+'\\"]").click()');
                let q=await ready(i,v);
                assert.ok(q.pins>=1);
                assert.ok(q.w>100&&q.h>100);
                assert.ok(await ev('loaded.naturalWidth===canvas.width*2&&loaded.naturalHeight===canvas.height'));
                assert.deepEqual(await ev('Array.from(ctx.getImageData(0,0,1,1).data)'),[250,247,242,255]);
                assert.ok(await ev('frame.clientWidth<=stage.clientWidth*.83+1&&frame.clientHeight<=stage.clientHeight*.86+1'));
                assert.ok(await ev('frame.clientWidth<=canvas.width&&frame.clientHeight<=canvas.height'));
                assert.equal(await ev('getComputedStyle(document.querySelector("#hotspots .hot")).borderRadius'),'50%');
                await ev('document.querySelector("#hotspots .hot").click()');
                assert.equal(await ev('document.querySelector("#number").textContent'),await ev('document.querySelector("#hotspots .hot").textContent'));
                console.log('PASS render',q);
              }
            }
            await ev('selectFamily(0)');await ready(0,0);
            await delay(400);
            assert.ok(await ev('Math.abs(document.querySelector("#actionPicker .picker-trigger").getBoundingClientRect().bottom-1-document.querySelector(".viewbar").getBoundingClientRect().top)<=2'));
            assert.equal(await ev('getComputedStyle(document.querySelector(".control-scroll")).scrollbarWidth'),'thin');
            assert.ok(await ev('getComputedStyle(document.querySelector(".control-scroll")).scrollbarColor.includes("167, 108, 81")'));
            assert.ok(await ev('document.querySelector(".edit").getBoundingClientRect().top<document.querySelector(".viewbar").getBoundingClientRect().top-50'));
            for(const width of [1200,1000,1440]){
              await cmd('Emulation.setDeviceMetricsOverride',{width,height:1000,deviceScaleFactor:1,mobile:false});
              await delay(350);
              assert.ok(await ev('Math.abs(document.querySelector("#actionPicker .picker-trigger").getBoundingClientRect().bottom-1-document.querySelector(".viewbar").getBoundingClientRect().top)<=2'));
            }
            const before=await ev('canvas.toDataURL()');
            await ev('document.querySelectorAll(".swatch")[1].click()');await ready(0,0);
            assert.notEqual(await ev('canvas.toDataURL()'),before);
            for(let i=0;i<6;i++){await ev('document.querySelectorAll(".swatch")['+i+'].click()');assert.equal(await ev('window.mouserQA.finish'),i)}
            await ev('document.querySelector("#profilePicker .picker-trigger").click();document.querySelectorAll("#profileOptions .picker-option")[1].click()');
            assert.equal(await ev('p'),1);
            await ev('document.querySelector("#actionPicker .picker-trigger").click();document.querySelectorAll("#actionOptions .picker-option")[5].click()');
            assert.equal(await ev('profiles[p].map[k]'),5);
            console.log('PASS 18 approved image views, marker selection, 6 colorways, profile and action selectors');
          } finally {ws.close()}
          JS
