name: Verify Mouser preview
on:
  push:
    branches: [gh-pages]
    paths:
      - mouser-mvp/**
      - .github/workflows/mouser-preview-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mouser-mvp
          fetch-depth: 1
      - name: Verify published HTML and six external GLB assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re, time, urllib.request, subprocess, shutil
          expected = pathlib.Path('mouser-mvp/index.html').read_bytes()
          version = re.search(rb'MOUSER / UI (\d+)', expected).group(1).decode()
          sha = hashlib.sha256(expected).hexdigest()
          url = 'https://nkuchenov-hash.github.io/Counter/mouser-mvp/design-' + version + '.html'
          for i in range(20):
              try:
                  request = urllib.request.Request(url + '?check=' + str(time.time_ns()), headers={'Cache-Control':'no-cache','User-Agent':'Mouser-Preview-Verify/1.0'})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      data = response.read()
                      actual = hashlib.sha256(data).hexdigest()
                      print('HTTP', response.status, 'SHA256', actual, flush=True)
                      if response.status == 200 and actual == sha:
                          print('Verified exact public Design ' + version + ': ' + url, flush=True)
                          break
              except Exception as e:
                  print(str(e), flush=True)
              time.sleep(8)
          else:
              raise SystemExit('Published content does not match expected SHA256 ' + sha)
          import json,struct
          root='https://nkuchenov-hash.github.io/Counter/mouser-mvp/models-v2/'
          for name,meta in json.loads(pathlib.Path('mouser-mvp/models-v2/metadata.json').read_text()).items():
              with urllib.request.urlopen(root+name+'.glb',timeout=25) as r:
                  body=r.read()
                  assert r.status==200
              assert body[:4]==b'glTF' and hashlib.sha256(body).hexdigest()==meta['sha256'],name
              print('Verified published GLB',name,len(body),flush=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser load and material check
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --remote-debugging-port=9222 --user-data-dir=/tmp/mouser-model-browser about:blank >/tmp/mouser-chrome.log 2>&1 &
          BROWSER_PID=$!
          trap 'kill "$BROWSER_PID" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const delay = ms => new Promise(r=>setTimeout(r,ms));
          let page;
          for(let i=0;i<30;i++){
            try{const response=await fetch('http://127.0.0.1:9222/json/list');page=(await response.json()).find(x=>x.type==='page');if(page)break}catch{}
            await delay(500);
          }
          assert(page,'Chrome DevTools unavailable');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((ok,fail)=>{ws.addEventListener('open',ok,{once:true});ws.addEventListener('error',fail,{once:true})});
          let seq=0;
          const pending=new Map();
          ws.addEventListener('message',e=>{let m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){let cb=pending.get(m.id);pending.delete(m.id);cb(m)}});
          function cmd(method,params={}){return new Promise((resolve,reject)=>{let id=++seq;pending.set(id,m=>m.error?reject(new Error(JSON.stringify(m.error))):resolve(m.result));ws.send(JSON.stringify({id,method,params}));setTimeout(()=>{if(pending.delete(id))reject(new Error('CDP timeout '+method))},15000).unref()})}
          await cmd('Page.enable');
          await cmd('Page.navigate',{url:'https://nkuchenov-hash.github.io/Counter/mouser-mvp/design-12.html?browsercheck=12'});
          async function ev(expression){const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value}
          async function ready(i){for(let j=0;j<60;j++){await delay(500);let q=await ev('window.mouserQA');if(q?.error)throw Error(JSON.stringify(q));if(q?.ready&&q.family===i)return q;}throw Error('Model timed out '+i)}
          try{
            const assets=['symmetric','ergonomic','compact','gaming','vertical','trackball'];
            await ready(0);
            assert.equal(await ev('document.querySelectorAll(".picker-menu:not([hidden])").length'),0);
            for(let i=0;i<6;i++){
              if(i!==0)await ev('selectFamily('+i+')');
              let q=await ready(i);
              assert.equal(q.asset,assets[i]);
              assert.ok(q.pins>=2);
              assert.equal(await ev('document.querySelector("#mouse").loaded'),true);
              assert.equal(await ev('getComputedStyle(document.querySelector("#mouse .hot")).borderRadius'),'50%');
              await ev('document.querySelector("#mouse .hot").click()');
              assert.equal(await ev('document.querySelector("#number").textContent'),await ev('document.querySelector("#mouse .hot").textContent'));
              console.log('PASS model',q);
            }
            await ev('selectFamily(1)');await ready(1);
            await ev('document.querySelector("#familyPicker .picker-trigger").click()');
            assert.equal(await ev('document.querySelectorAll("#families .picker-option").length'),6);
            await ev('document.querySelectorAll("#families .picker-option")[0].click()');await ready(0);
            await ev('document.querySelector("#profilePicker .picker-trigger").click();document.querySelectorAll("#profileOptions .picker-option")[1].click()');
            assert.equal(await ev('p'),1);
            await ev('document.querySelector("#actionPicker .picker-trigger").click();document.querySelectorAll("#actionOptions .picker-option")[5].click()');
            assert.equal(await ev('profiles[p].map[k]'),5);
            await ev('document.querySelector("#finish").click();document.querySelector("[data-view=\\"1\\"]").click()');
            console.log('PASS six externally sourced models, marker selections, model/profile/action menus, finish and view');
          } finally {ws.close()}
          JS
