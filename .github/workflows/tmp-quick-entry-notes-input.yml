name: Temporary canonical Notes-style quick entry fix

on:
  push:
    branches:
      - fix/quick-entry-use-notes-input-20260904

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quick-entry-use-notes-input-20260904
      - name: Apply patch
        run: python scripts/tmp_quick_entry_notes_input.py
      - name: Remove temporary files
        run: |
          git rm scripts/tmp_quick_entry_notes_input.py
          git rm .github/workflows/tmp-quick-entry-notes-input.yml
      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Create env.dart
        run: |
          mkdir -p lib/config
          cat > lib/config/env.dart <<'EOF'
          const String kPocketBaseUrl = '';
          const String kPocketBaseAdminEmail = '';
          const String kPocketBaseAdminPassword = '';
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Restore lockfile
        run: git checkout -- pubspec.lock
      - name: Format changed Dart
        run: dart format lib/core/widgets/compact_nav_controls.dart lib/features/notes/notes_glm_surface.dart
      - name: Analyze affected Dart
        run: flutter analyze --no-fatal-infos lib/core/widgets/compact_nav_controls.dart lib/features/notes/notes_glm_surface.dart lib/features/planning/planning_page.dart lib/features/timeline/timeline_header_controls.dart
      - name: Remove env stub
        run: git checkout -- lib/config/env.dart || rm -f lib/config/env.dart
      - name: Check repository hygiene
        env:
          STRUCTURE_GROWTH_BASE: main
        run: python scripts/audit/repository_hygiene.py
      - name: Check documentation parity
        run: python scripts/audit/documentation_parity.py
      - name: Check whitespace
        run: git diff --check
      - name: Build release web
        run: |
          mkdir -p lib/config
          cat > lib/config/env.dart <<'EOF'
          const String kPocketBaseUrl = '';
          const String kPocketBaseAdminEmail = '';
          const String kPocketBaseAdminPassword = '';
          EOF
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
          git checkout -- lib/config/env.dart || rm -f lib/config/env.dart
      - name: Commit final fix
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          git add -A
          git commit -m "Use Notes input for Planning and Timeline quick entry"
          git push origin HEAD:fix/quick-entry-use-notes-input-20260904
