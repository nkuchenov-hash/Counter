name: Temporary sleep production state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sleep-prod-state.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect sanitized sleep state
        shell: bash
        run: |
          set -euo pipefail
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" > /tmp/sleep-state.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ {print $1; exit}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | head -n 1 || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          db="$app_dir/pb_data/data.db"
          python3 - "$db" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True)
          con.row_factory=sqlite3.Row
          rows=con.execute("""
            SELECT enabled,status,last_error,last_sync_at,last_session_count,last_imported_count,
                   length(coalesce(refresh_token_enc,'')) AS refresh_len,
                   length(coalesce(access_token_enc,'')) AS access_len,
                   updated
            FROM sleep_sync_connections
            WHERE provider='google_fit'
            ORDER BY updated DESC LIMIT 5
          """).fetchall()
          def classify(err):
            s=(err or '').lower()
            if not s: return 'none'
            if 'invalid_grant' in s: return 'invalid_grant'
            if 'insufficient' in s or 'permission' in s or 'scope' in s: return 'scope_or_permission'
            if '403' in s: return 'http_403'
            if '401' in s: return 'http_401'
            if 'google health' in s: return 'legacy_google_health'
            return 'other'
          print('sleep_connections=', len(rows))
          for i,r in enumerate(rows):
            print(f'conn{i}: enabled={r["enabled"]} status={r["status"]} refresh={r["refresh_len"]>0} access={r["access_len"]>0} error={classify(r["last_error"])} sessions={r["last_session_count"]} imported={r["last_imported_count"]} last_sync={bool(r["last_sync_at"])}')
          PY
          REMOTE

      - name: Publish sanitized snapshot to diagnostic branch
        shell: bash
        run: |
          cp /tmp/sleep-state.txt _tmp_sleep_prod_state.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp_sleep_prod_state.txt
          git commit -m 'Temporary sanitized sleep production state'
          git push --force origin HEAD:refs/heads/diag-sleep-state
