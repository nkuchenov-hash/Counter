name: Temporary regenerate structure parity

on:
  push:
    branches:
      - docs/restore-structure-parity-20260910

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'Regenerate detailed structure parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/restore-structure-parity-20260910
          fetch-depth: 0
      - name: Regenerate canonical detailed structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-regenerate-structure-parity.yml
          python scripts/manual/generate_app_structure_detailed.py
          python scripts/audit/documentation_parity.py
          git add docs/APP_STRUCTURE_DETAILED.md .github/workflows/tmp-regenerate-structure-parity.yml
          git diff --cached --check
          git commit -m "Regenerate detailed structure parity"
          git push origin HEAD:docs/restore-structure-parity-20260910
