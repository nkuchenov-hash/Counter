name: Temp Waking Day Morning

on:
  push:
    branches:
      - feat/waking-day-morning-start-20260810

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply production patches
        run: |
          if grep -q "rangeStartWall: wakingWindow.wakeWall" lib/features/stats/stats_view.dart; then
            echo "Main patch already applied"
          else
            python3 tool/patch_waking_day_morning.py
          fi
          python3 tool/patch_stats_waking_range_aggregate.py
          python3 tool/patch_stats_exact_seconds.py

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          echo "abstract final class Env { static const String placeholder = ''; }" > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format production files
        run: |
          dart format \
            lib/data/categories/category_stats.dart \
            lib/features/shared/sleep_record_policy.dart \
            lib/features/timeline/timeline_morning_start.dart \
            lib/features/timeline/timeline_view.dart \
            lib/features/stats/stats_view.dart \
            lib/features/stats/day_stats_dashboard.dart \
            lib/features/stats/plan_vs_fact_tab.dart

      - name: Persist production changes
        run: |
          if ! git diff --quiet -- \
            lib/data/categories/category_stats.dart \
            lib/features/shared/sleep_record_policy.dart \
            lib/features/timeline/timeline_morning_start.dart \
            lib/features/timeline/timeline_view.dart \
            lib/features/stats/stats_view.dart \
            lib/features/stats/day_stats_dashboard.dart \
            lib/features/stats/plan_vs_fact_tab.dart \
            docs/APP_STRUCTURE.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              lib/data/categories/category_stats.dart \
              lib/features/shared/sleep_record_policy.dart \
              lib/features/timeline/timeline_morning_start.dart \
              lib/features/timeline/timeline_view.dart \
              lib/features/stats/stats_view.dart \
              lib/features/stats/day_stats_dashboard.dart \
              lib/features/stats/plan_vs_fact_tab.dart \
              docs/APP_STRUCTURE.md
            git commit -m "Make Stats a waking day and add morning Start Day flow"
            git push
          fi

      - name: Strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Analyze affected Flutter files
        run: flutter analyze lib/data/categories/category_stats.dart lib/features/shared/sleep_record_policy.dart lib/features/timeline/timeline_morning_start.dart lib/features/timeline/timeline_view.dart lib/features/stats/stats_view.dart lib/features/stats/day_stats_dashboard.dart lib/features/stats/plan_vs_fact_tab.dart

      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
