name: TEMP patch Google Health all-sources

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-google-health-all-sources-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch Google Health source family
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pb_hooks/google_health_sleep_runtime.js')
          s=p.read_text(encoding='utf-8')
          old='''            pageSize: 100,\n            dataSourceFamily: "users/me/dataSourceFamilies/google-sources",'''
          new='''            // Sleep reconcile is capped at 25 points/page. Use all-sources so\n            // Health Connect and any third-party cloud source are eligible.\n            pageSize: 25,\n            dataSourceFamily: "users/me/dataSourceFamilies/all-sources",'''
          if old not in s:
              raise SystemExit('Google Health query marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check pb_hooks/google_health_sleep_runtime.js
          git diff --check
          git rm .github/workflows/tmp-google-health-all-sources-fix.yml
          git add pb_hooks/google_health_sleep_runtime.js
          git commit -m 'Use all Google Health sources for sleep'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}