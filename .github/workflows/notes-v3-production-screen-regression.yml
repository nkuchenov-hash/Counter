name: Notes V3 Production Screen Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/notes-v3-design-system'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Add production-screen assertions to existing third test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/notes_canonical_components_test.dart')
          text = path.read_text(encoding='utf-8')
          import_line = "import 'package:counter/features/notes/widgets/notes_editor_screen.dart';\n"
          anchor_import = "import 'package:counter/features/notes/widgets/notes_editor_tools.dart';\n"
          if import_line not in text:
              if anchor_import not in text:
                  raise SystemExit('Notes editor tools import anchor missing')
              text = text.replace(anchor_import, anchor_import + import_line, 1)

          marker = "      selectedTable = null;\n      tester.view.physicalSize = const Size(1200, 900);"
          if "notes-production-visible-content" not in text:
              production_assertions = r'''      await tester.pumpWidget(
                _host(
                  NotesEditorScreen(
                    titleController: headingController,
                    onTitleChanged: (_) {},
                    onDone: () {},
                    pinned: false,
                    onTogglePinned: () {},
                    onDelete: () {},
                    categoryLabel: 'Work',
                    tags: const [NotesEditorMetadataTag(label: 'planning')],
                    content: const Align(
                      alignment: Alignment.topLeft,
                      child: Text(
                        'Visible note content',
                        key: ValueKey('notes-production-visible-content'),
                      ),
                    ),
                    toolbar: NotesEditorToolbar(
                      actions: [
                        for (final tool in NotesToolbarTool.values)
                          NotesToolbarAction(
                            tool: tool,
                            icon: _iconFor(tool),
                            tooltip: tool.name,
                            onPressed: () {},
                          ),
                      ],
                    ),
                  ),
                ),
              );
              await tester.pumpAndSettle();
              final visibleContent = find.byKey(
                const ValueKey('notes-production-visible-content'),
              );
              final productionToolbar = find.byType(NotesEditorToolbar);
              expect(visibleContent, findsOneWidget);
              expect(
                tester.getSize(productionToolbar),
                const Size(
                  NotesFigmaTokens.toolbarWidth,
                  NotesFigmaTokens.toolbarHeight,
                ),
              );
              expect(
                tester.getTopLeft(visibleContent).dy,
                lessThan(tester.getTopLeft(productionToolbar).dy),
              );
              expect(tester.takeException(), isNull);

          '''
              if marker not in text:
                  raise SystemExit('mobile-to-desktop test marker missing')
              text = text.replace(marker, production_assertions + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve, format, and run existing three-test file
        run: |
          flutter pub get
          dart format test/notes_canonical_components_test.dart
          flutter test test/notes_canonical_components_test.dart

      - name: Commit verified regression coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/notes_canonical_components_test.dart
          if git diff --cached --quiet; then
            echo "Production screen regression coverage already present."
          else
            git commit -m "Guard Notes production screen content visibility"
            git push origin HEAD:feature/notes-v3-design-system
          fi
