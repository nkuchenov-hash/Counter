name: Repair one-shot interval fix push step

on:
  push:
    paths:
      - '.github/workflows/repair-record-rollover-workflow.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair push step
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fix-record-interval-rollover.yml')
          text = p.read_text(encoding='utf-8')
          old = "          git commit -m 'Fix record interval rollover corruption'\n          git pull --rebase origin main\n"
          new = "          git commit -m 'Fix record interval rollover corruption'\n          git reset --hard HEAD\n          git clean -fd\n          git pull --rebase origin main\n"
          if old not in text:
              raise SystemExit('target commit block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'nkuchenov-hash'
          git config user.email 'nkuchenov@gmail.com'
          git add .github/workflows/fix-record-interval-rollover.yml
          git commit -m 'Fix interval one-shot push cleanup'
          git push origin HEAD:main
