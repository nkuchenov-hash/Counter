name: Temporary recurrence docs finalize

on:
  push:
    branches:
      - fix/recurrence-dialog-alignment

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize changelog and detailed manifest
        shell: bash
        run: |
          cat > /tmp/recurrence_changelog_entry <<'EOF'
          ## 2026-09-23 — Recurring-plan immutable history [fix]

          - Replaced recurring edit/delete scope with two user choices: one occurrence or this and all following occurrences; removed user-facing whole-series mutation.
          - Implemented future scope as an RRULE series split so earlier recurrence history stays unchanged while future materialized exceptions move with the new future series.
          - Fixed recurring occurrence editing to inherit the parent recurrence rule and aligned the recurrence scope dialog to one left edge.
          - Added canonical `docs/FUNCTIONS.md` and `docs/USER_GUIDE.md` recurrence documentation.

          EOF
          if ! grep -q "Recurring-plan immutable history" CHANGELOG.md; then
            cat /tmp/recurrence_changelog_entry CHANGELOG.md > /tmp/CHANGELOG.md
            mv /tmp/CHANGELOG.md CHANGELOG.md
          fi
          rm .github/workflows/regen-recurrence-docs-once.yml
          git add -A
          python scripts/manual/generate_app_structure_detailed.py
          git add -A

      - name: Commit final recurrence docs
        shell: bash
        run: |
          git config user.name "life-os-recurrence-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Finalize recurring-plan documentation"
          git push origin HEAD:fix/recurrence-dialog-alignment
