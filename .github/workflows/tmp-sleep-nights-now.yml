name: TEMP inspect current sleep nights

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-sleep-nights-now.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect production sleep state
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
          POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          user="${SSH_USER:-root}"; host="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          ssh-keyscan -p "$SSH_PORT" -H "$host" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$SSH_PORT" "$user@$host" "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"; fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True); con.row_factory=sqlite3.Row
          rows=con.execute("SELECT id,title,start_time,end_time,sleep_source,external_source,external_kind,created,updated FROM records WHERE title='Sleep' OR title='Сон' ORDER BY end_time DESC LIMIT 20").fetchall()
          print('sleep_rows='+str(len(rows)))
          for r in rows:
              print('sleep|'+str(r['start_time'])+'|'+str(r['end_time'])+'|'+str(r['sleep_source'] or '')+'|'+str(r['external_source'] or '')+'|'+str(r['created'] or ''))
          latest=rows[0]['end_time'] if rows else ''
          print('latest_sleep_end='+str(latest))
          for provider in ('google_health','google_fit','xiaomi'):
              r=con.execute("SELECT status,last_error,last_sync_at,last_session_count,last_imported_count,length(coalesce(refresh_token_enc,'')) token_len FROM sleep_sync_connections WHERE provider=? LIMIT 1",(provider,)).fetchone()
              if not r:
                  print(provider+'|connection=false')
                  continue
              err=(r['last_error'] or '').replace('\n',' ')[:300]
              print(provider+'|connection=true|status='+str(r['status'] or '')+'|token='+str((r['token_len'] or 0)>0).lower()+'|last_sync='+str(r['last_sync_at'] or '')+'|sessions='+str(r['last_session_count'] or 0)+'|imported='+str(r['last_imported_count'] or 0)+'|error='+err)
          con.close()
          PY
          curl -sS -o /dev/null -w 'health=%{http_code}\n' https://217-114-0-201.sslip.io/api/health
          REMOTE
