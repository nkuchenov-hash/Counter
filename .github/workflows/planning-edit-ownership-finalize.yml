name: Planning edit ownership finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'refactor/planning-edit-host-ownership-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/planning-edit-host-ownership-20260818
          fetch-depth: 0
      - name: Apply docs parity
        shell: bash
        run: |
          python scripts/manual/_finalize_planning_edit_ownership.py
          git rm scripts/manual/_finalize_planning_edit_ownership.py
          git diff --check
      - name: Architecture
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Prepare
        shell: bash
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
          flutter pub get
      - name: Analyze compile errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Two focused edit contracts
        run: |
          flutter test test/edit_sheet_autosave_test.dart
          flutter test test/plan_create_collision_and_edit_time_guard_test.dart
      - name: Hygiene
        shell: bash
        run: |
          rm -f lib/core/env/env.dart
          git diff --check
      - name: Commit verified docs parity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document Planning edit result ownership'
          git push origin HEAD:refactor/planning-edit-host-ownership-20260818
