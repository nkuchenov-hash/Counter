name: Temporary literal Paths HTML spacing

on:
  push:
    branches:
      - fix/paths-literal-html-port-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paths-literal-html-port-20260904
      - name: Port approved HTML page spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/features/paths/paths_page.dart')
          s = p.read_text()
          replacements = [
              ("padding: const EdgeInsets.fromLTRB(20, 18, 20, 40),\n      itemCount:",
               "padding: const EdgeInsets.fromLTRB(24, 28, 24, 56),\n      spacing: 12,\n      itemCount:"),
              ("const SizedBox(height: 12),\n          ],\n          Row(children:",
               "const SizedBox(height: 6),\n          ],\n          Row(children:"),
              ("const SizedBox(height: 14),\n        ],\n      ),\n      footer:",
               "const SizedBox(height: 22),\n        ],\n      ),\n      footer:"),
              ("padding: const EdgeInsets.only(top: 12),\n        child: Align(",
               "padding: const EdgeInsets.only(top: 14),\n        child: Align("),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:50]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          rm .github/workflows/tmp-port-paths-html-spacing.yml
          git add -A
          git commit -m "Match approved Paths HTML page spacing"
          git push origin HEAD:fix/paths-literal-html-port-20260904
