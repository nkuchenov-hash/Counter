name: Temporary auto-plan placement implementation

on:
  push:
    branches:
      - feat/auto-plan-nearest-free-slot
    paths:
      - '.github/workflows/_temporary_auto_plan_placement.yml'

permissions:
  contents: write

jobs:
  implement-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/auto-plan-nearest-free-slot

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          cascade = 'lib/data/plans/plan_time_cascade_helpers.dart'
          replace_once(
              cascade,
              "const int kPlanScheduleSnapMinutes = 10;\n",
              "const int kPlanScheduleSnapMinutes = 5;\n\n"
              "enum PlanAutoPlacementMode { nearestFreeSlot, afterLastPlan }\n\n"
              "const String _keyPlanAutoPlacementMode = 'plan_auto_placement_mode';\n"
              "PlanAutoPlacementMode _planAutoPlacementMode =\n"
              "    PlanAutoPlacementMode.nearestFreeSlot;\n",
          )

          replace_once(
              cascade,
              "extension PlanTimeCascadeExtension on DatabaseService {\n",
              "extension PlanTimeCascadeExtension on DatabaseService {\n"
              "  PlanAutoPlacementMode get planAutoPlacementMode =>\n"
              "      _planAutoPlacementMode;\n\n"
              "  Future<void> loadPlanAutoPlacementMode() async {\n"
              "    final prefs = await SharedPreferences.getInstance();\n"
              "    final raw = prefs.getString(_keyPlanAutoPlacementMode);\n"
              "    _planAutoPlacementMode = PlanAutoPlacementMode.values.firstWhere(\n"
              "      (mode) => mode.name == raw,\n"
              "      orElse: () => PlanAutoPlacementMode.nearestFreeSlot,\n"
              "    );\n"
              "  }\n\n"
              "  Future<void> setPlanAutoPlacementMode(\n"
              "    PlanAutoPlacementMode mode,\n"
              "  ) async {\n"
              "    _planAutoPlacementMode = mode;\n"
              "    final prefs = await SharedPreferences.getInstance();\n"
              "    await prefs.setString(_keyPlanAutoPlacementMode, mode.name);\n"
              "  }\n\n",
          )

          snap_old = """  DateTime _snapPlanWallDateTime(DateTime wall) {
    final snap = kPlanScheduleSnapMinutes;
    final totalMin = wall.hour * 60 + wall.minute;
    final snapped = ((totalMin / snap).round() * snap).clamp(0, 24 * 60 - 1);
    return DateTime(
      wall.year,
      wall.month,
      wall.day,
      snapped ~/ 60,
      snapped % 60,
    );
  }
"""
          snap_new = snap_old + """
  DateTime _ceilPlanWallDateTime(DateTime wall) {
    final dayStart = DateTime(wall.year, wall.month, wall.day);
    final elapsed = wall.difference(dayStart);
    var wholeMinutes = elapsed.inMinutes;
    if (elapsed > Duration(minutes: wholeMinutes)) wholeMinutes++;
    final snap = kPlanScheduleSnapMinutes;
    final snapped = ((wholeMinutes + snap - 1) ~/ snap) * snap;
    return dayStart.add(Duration(minutes: snapped));
  }

  bool _samePlanWallDay(DateTime a, DateTime b) =>
      a.year == b.year && a.month == b.month && a.day == b.day;

  DateTime _firstAvailablePlanWallStart({
    required DateTime earliestStartWall,
    required int durationMin,
    required List<PlanningTask> existingDayPlans,
  }) {
    final intervals = <({DateTime start, DateTime end})>[];
    for (final plan in existingDayPlans) {
      final start = plan.startTime;
      final end = _resolvedPlanWallEnd(plan);
      if (start == null || end == null || !end.isAfter(start)) continue;
      intervals.add((start: start, end: end));
    }
    intervals.sort((a, b) => a.start.compareTo(b.start));

    var candidate = _ceilPlanWallDateTime(earliestStartWall);
    for (final interval in intervals) {
      if (!interval.end.isAfter(candidate)) continue;
      final candidateEnd = candidate.add(Duration(minutes: durationMin));
      if (!interval.start.isBefore(candidateEnd)) return candidate;
      if (interval.start.isBefore(candidateEnd) && interval.end.isAfter(candidate)) {
        candidate = _ceilPlanWallDateTime(interval.end);
      }
    }
    return candidate;
  }
"""
          replace_once(cascade, snap_old, snap_new)

          replace_once(
              cascade,
              "    int? explicitDurationMinutes,\n  }) {\n",
              "    int? explicitDurationMinutes,\n    DateTime? currentWall,\n  }) {\n",
          )

          old_start = """    String? categoryDefaultTimezoneIana;
    var usedCategoryDefault = false;
    late final DateTime startWall;
    if (explicitStartWall != null) {
      startWall = explicitStartWall;
    } else {
      DateTime? latestEnd;
      for (final p in existingDayPlans) {
        if (p.startTime == null) continue;
        final end = _resolvedPlanWallEnd(p);
        if (end == null) continue;
        if (latestEnd == null || end.isAfter(latestEnd)) latestEnd = end;
      }
      if (latestEnd != null) {
        startWall = _snapPlanWallDateTime(latestEnd);
      } else {
        final catSchedule = effectiveDefaultPlanScheduleForCategory(categoryId);
        if (catSchedule?.hhmm != null) {
          final h = int.tryParse(catSchedule!.hhmm!.substring(0, 2));
          final m = int.tryParse(catSchedule.hhmm!.substring(3, 5));
          if (h != null && m != null) {
            usedCategoryDefault = true;
            categoryDefaultTimezoneIana = catSchedule.timezoneIana;
            startWall = _snapPlanWallDateTime(
              DateTime(wallDay.year, wallDay.month, wallDay.day, h, m),
            );
          } else {
            startWall = _snapPlanWallDateTime(
              PlanTimeVisibleWindow.windowStartWall(
                wallDay,
                timelineDayStartHour,
              ),
            );
          }
        } else {
          startWall = _snapPlanWallDateTime(
            PlanTimeVisibleWindow.windowStartWall(
              wallDay,
              timelineDayStartHour,
            ),
          );
        }
      }
    }
"""
          new_start = """    String? categoryDefaultTimezoneIana;
    var usedCategoryDefault = false;
    late final DateTime startWall;
    if (explicitStartWall != null) {
      startWall = explicitStartWall;
    } else if (_planAutoPlacementMode ==
        PlanAutoPlacementMode.nearestFreeSlot) {
      final windowStart = PlanTimeVisibleWindow.windowStartWall(
        wallDay,
        timelineDayStartHour,
      );
      final profileNow = currentWall ?? applyUserOffset(getPlanetaryNow());
      final earliestStart = _samePlanWallDay(profileNow, wallDay) &&
              profileNow.isAfter(windowStart)
          ? profileNow
          : windowStart;
      startWall = _firstAvailablePlanWallStart(
        earliestStartWall: earliestStart,
        durationMin: durationMin,
        existingDayPlans: existingDayPlans,
      );
    } else {
      DateTime? latestEnd;
      for (final p in existingDayPlans) {
        if (p.startTime == null) continue;
        final end = _resolvedPlanWallEnd(p);
        if (end == null) continue;
        if (latestEnd == null || end.isAfter(latestEnd)) latestEnd = end;
      }
      if (latestEnd != null) {
        startWall = _snapPlanWallDateTime(latestEnd);
      } else {
        final catSchedule = effectiveDefaultPlanScheduleForCategory(categoryId);
        if (catSchedule?.hhmm != null) {
          final h = int.tryParse(catSchedule!.hhmm!.substring(0, 2));
          final m = int.tryParse(catSchedule.hhmm!.substring(3, 5));
          if (h != null && m != null) {
            usedCategoryDefault = true;
            categoryDefaultTimezoneIana = catSchedule.timezoneIana;
            startWall = _snapPlanWallDateTime(
              DateTime(wallDay.year, wallDay.month, wallDay.day, h, m),
            );
          } else {
            startWall = _snapPlanWallDateTime(
              PlanTimeVisibleWindow.windowStartWall(
                wallDay,
                timelineDayStartHour,
              ),
            );
          }
        } else {
          startWall = _snapPlanWallDateTime(
            PlanTimeVisibleWindow.windowStartWall(
              wallDay,
              timelineDayStartHour,
            ),
          );
        }
      }
    }
"""
          replace_once(cascade, old_start, new_start)

          settings = 'lib/features/planning/time_view/time_view_settings_sheet.dart'
          replace_once(
              settings,
              "  Future<void> loadPlanningTimelineBounds() async {\n    final range = await PlanningSheetTimelinePrefs.loadVisibleDayRange();\n",
              "  Future<void> loadPlanningTimelineBounds() async {\n    final range = await PlanningSheetTimelinePrefs.loadVisibleDayRange();\n    await DatabaseService.instance.loadPlanAutoPlacementMode();\n",
          )
          replace_once(
              settings,
              "                  const PlanRecordLinkSuggestionSettingsBlock(),\n                  const Divider(height: 24),\n                  TimeViewFixedTagsSettingsBlock(\n",
              "                  const PlanRecordLinkSuggestionSettingsBlock(),\n                  const Divider(height: 24),\n                  PlanAutoPlacementSettingsBlock(\n                    initialMode:\n                        DatabaseService.instance.planAutoPlacementMode,\n                    onChanged:\n                        DatabaseService.instance.setPlanAutoPlacementMode,\n                  ),\n                  const Divider(height: 24),\n                  TimeViewFixedTagsSettingsBlock(\n",
          )
          p = Path(settings)
          text = p.read_text(encoding='utf-8')
          marker = "\n}\n"
          pos = text.rfind(marker)
          if pos < 0:
              raise SystemExit('settings extension closing marker not found')
          widget_code = r'''

class PlanAutoPlacementSettingsBlock extends StatefulWidget {
  const PlanAutoPlacementSettingsBlock({
    super.key,
    required this.initialMode,
    required this.onChanged,
  });

  final PlanAutoPlacementMode initialMode;
  final Future<void> Function(PlanAutoPlacementMode mode) onChanged;

  @override
  State<PlanAutoPlacementSettingsBlock> createState() =>
      _PlanAutoPlacementSettingsBlockState();
}

class _PlanAutoPlacementSettingsBlockState
    extends State<PlanAutoPlacementSettingsBlock> {
  late PlanAutoPlacementMode _mode = widget.initialMode;

  Future<void> _select(PlanAutoPlacementMode mode) async {
    if (_mode == mode) return;
    setState(() => _mode = mode);
    await widget.onChanged(mode);
  }

  @override
  Widget build(BuildContext context) {
    final loc = currentLocale.value;
    final helperKey = _mode == PlanAutoPlacementMode.nearestFreeSlot
        ? 'plan_auto_placement_nearest_helper'
        : 'plan_auto_placement_after_last_helper';
    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        Text(
          t(loc, 'plan_auto_placement_title'),
          style: Theme.of(context).textTheme.titleMedium,
        ),
        const SizedBox(height: 4),
        Text(
          t(loc, 'plan_auto_placement_subtitle'),
          style: Theme.of(context).textTheme.bodySmall?.copyWith(
                color: Theme.of(context).colorScheme.onSurfaceVariant,
              ),
        ),
        const SizedBox(height: 10),
        Wrap(
          spacing: 8,
          runSpacing: 8,
          children: [
            ChoiceChip(
              label: Text(t(loc, 'plan_auto_placement_nearest')),
              selected: _mode == PlanAutoPlacementMode.nearestFreeSlot,
              onSelected: (_) => unawaited(
                _select(PlanAutoPlacementMode.nearestFreeSlot),
              ),
            ),
            ChoiceChip(
              label: Text(t(loc, 'plan_auto_placement_after_last')),
              selected: _mode == PlanAutoPlacementMode.afterLastPlan,
              onSelected: (_) => unawaited(
                _select(PlanAutoPlacementMode.afterLastPlan),
              ),
            ),
          ],
        ),
        const SizedBox(height: 8),
        Text(
          t(loc, helperKey),
          style: Theme.of(context).textTheme.bodySmall?.copyWith(
                color: Theme.of(context).colorScheme.onSurfaceVariant,
              ),
        ),
      ],
    );
  }
}
'''
