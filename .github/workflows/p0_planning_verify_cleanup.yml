name: Verify and clean P0 planning fix

on:
  push:
    branches:
      - fix/p0-planning-time-performance

permissions:
  contents: write

jobs:
  verify-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-planning-time-performance
          fetch-depth: 0

      - name: Apply final hot-path guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/shared/planning_task_edit_sheet.dart')
          text = path.read_text(encoding='utf-8')

          old = """        if (latest != null) {
            unawaited(_syncPlanDraftToNetwork(latest));
          }
"""
          new = """        if (latest != null) {
            _applyPlanDraftLocally(latest);
            unawaited(_syncPlanDraftToNetwork(latest));
          }
"""
          if old not in text:
              raise SystemExit('dispose flush anchor not found')
          text = text.replace(old, new, 1)

          old = """    DatabaseService.instance.notifyPlanningRefresh();
"""
          new = """    DatabaseService.instance.notifyPlanningRefresh(
      scheduleNetworkRefresh: false,
    );
"""
          if old not in text:
              raise SystemExit('optimistic refresh anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format focused Dart files
        run: |
          dart format \
            lib/features/shared/planning_task_edit_sheet.dart \
            lib/data/plans/plan_stream_helpers.dart \
            lib/data/plans/plan_time_cascade_helpers.dart \
            lib/app/shell/shared/shell_edit_hosts.dart \
            test/plan_create_collision_and_edit_time_guard_test.dart

      - name: Run three focused regressions
        run: flutter test test/plan_create_collision_and_edit_time_guard_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Remove generated and temporary changes
        run: |
          git checkout origin/main -- pubspec.lock macos/Flutter/GeneratedPluginRegistrant.swift
          rm -f .p0_planning_fix_trigger .p0_planning_verify_trigger
          rm -f .github/workflows/p0_planning_verify_cleanup.yml

      - name: Diff check
        run: git diff --check

      - name: Commit verified source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(planning): finalize P0 time and web performance guard"
          git push origin HEAD:fix/p0-planning-time-performance
