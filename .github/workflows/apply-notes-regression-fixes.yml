name: Apply Notes regression fixes

on:
  push:
    branches:
      - fix/notes-uncheck-structured-copy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notes-uncheck-structured-copy
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Apply surgical Notes fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1. Latest local truth must win: optimistic overlays before base cache.
          p = Path('lib/data/plans/plan_outbox_helpers.dart')
          s = p.read_text()
          old = '''    for (final t in _allPlansUserCache) {
      if (keys.contains(t.planRowIdForBackend) ||
          keys.contains((t.planRowId ?? '').trim()) ||
          keys.contains((t.pocketRecordId ?? '').trim())) {
        return t;
      }
    }
    for (final m in _planningOptimisticByDateKey.values) {
      for (final t in m.values) {
        if (keys.contains(t.planRowIdForBackend) ||
            keys.contains((t.planRowId ?? '').trim()) ||
            keys.contains((t.pocketRecordId ?? '').trim())) {
          return t;
        }
      }
    }
'''
          new = '''    // Optimistic overlays are the latest local truth. They must win over
    // the base cache so repeated local-first edits (for example Notes done →
    // undone) toggle from the state currently visible to the user.
    for (final m in _planningOptimisticByDateKey.values) {
      for (final t in m.values) {
        if (keys.contains(t.planRowIdForBackend) ||
            keys.contains((t.planRowId ?? '').trim()) ||
            keys.contains((t.pocketRecordId ?? '').trim())) {
          return t;
        }
      }
    }
    for (final t in _allPlansUserCache) {
      if (keys.contains(t.planRowIdForBackend) ||
          keys.contains((t.planRowId ?? '').trim()) ||
          keys.contains((t.pocketRecordId ?? '').trim())) {
        return t;
      }
    }
'''
          if old not in s:
              raise SystemExit('plan cache lookup target not found')
          p.write_text(s.replace(old, new, 1))

          # 2. Multi-block SelectionArea copy must use the captured structured
          # selection even if one editable block still retains focus.
          p = Path('lib/features/notes/note_editor_page.dart')
          s = p.read_text()
          old = '''  bool _copyCurrentStructuredSelection() {
    if (_editingBlockId != null || _blockSelectionMode) return false;
    final blocks = _NotesStructuredClipboard.blocks;
'''
          new = '''  bool _copyCurrentStructuredSelection() {
    if (_blockSelectionMode) return false;
    final blocks = _NotesStructuredClipboard.blocks;
'''
          if old not in s:
              raise SystemExit('structured copy guard target not found')
          s = s.replace(old, new, 1)

          old = '''    final plain = selected?.plainText ?? '';
    if (plain.isEmpty) return;
    final blocks = _inferStructuredSelectionBlocks(plain);
'''
          new = '''    final plain = selected?.plainText ?? '';
    if (plain.isEmpty) {
      _NotesStructuredClipboard.plainText = null;
      _NotesStructuredClipboard.blocks = const <NoteBlock>[];
      return;
    }
    final blocks = _inferStructuredSelectionBlocks(plain);
'''
          if old not in s:
              raise SystemExit('structured selection clear target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify Notes regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/note_document_v2_test.dart test/notes_glm_editor_parity_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          outbox = Path('lib/data/plans/plan_outbox_helpers.dart').read_text()
          start = outbox.index('PlanningTask? _findCachedPlanningTaskForEdit(')
          end = outbox.index('\n  void _applyOptimisticPlanningTaskPatch', start)
          body = outbox[start:end]
          assert body.index('for (final m in _planningOptimisticByDateKey.values)') < body.index('for (final t in _allPlansUserCache)')

          editor = Path('lib/features/notes/note_editor_page.dart').read_text()
          assert 'if (_editingBlockId != null || _blockSelectionMode) return false;' not in editor
          assert 'bool _copyCurrentStructuredSelection() {\n    if (_blockSelectionMode) return false;' in editor
          assert "lines.add('$numberedOrdinal. $value');" in editor
          assert "lines.add('- $value');" in editor
          assert "return lines.join('\\n');" in editor
          assert "if (plain.isEmpty) {\n      _NotesStructuredClipboard.plainText = null;" in editor
          PY

      - name: Commit verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/data/plans/plan_outbox_helpers.dart lib/features/notes/note_editor_page.dart; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/plans/plan_outbox_helpers.dart lib/features/notes/note_editor_page.dart
          git commit -m 'fix(notes): allow uncheck and preserve copied structure'
          git push origin HEAD:fix/notes-uncheck-structured-copy
