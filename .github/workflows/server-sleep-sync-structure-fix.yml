name: Document server sleep sync structure

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  document-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Document new Brain service
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/APP_STRUCTURE.md')
          text = path.read_text(encoding='utf-8')
          anchor = '| `data/health/health_sleep_sync_service.dart` | Health sleep import coordinator using existing record/category Brain APIs. |'
          addition = '| `data/health/cloud_sleep_sync_service.dart` | Authenticated client for server-owned cloud sleep status, OAuth connection, schedule settings, manual sync, and disconnect routes. |'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('APP_STRUCTURE health anchor not found')
              text = text.replace(anchor, anchor + '\n' + addition, 1)
              path.write_text(text, encoding='utf-8')

      - name: Run strict Architecture Guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check whitespace
        run: git diff --check

      - name: Commit documentation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/server-sleep-sync-structure-fix.yml
          git add docs/APP_STRUCTURE.md
          git commit -m "Document server sleep sync structure"
          git push origin HEAD:${{ github.head_ref }}
