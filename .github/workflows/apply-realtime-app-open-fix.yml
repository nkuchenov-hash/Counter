name: Apply realtime app-open fix

on:
  push:
    branches:
      - 'fix/realtime-on-app-open-20260805'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/realtime-on-app-open-20260805'
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/tmp/apply_realtime_app_open_fix.py
      - name: Commit patch and remove temporary files
        run: |
          rm .github/workflows/apply-realtime-app-open-fix.yml
          rm .github/tmp/apply_realtime_app_open_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix realtime activation on app open'
          git push origin HEAD:fix/realtime-on-app-open-20260805
