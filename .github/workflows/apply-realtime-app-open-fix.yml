name: Apply realtime app-open fix

on:
  push:
    branches:
      - fix/realtime-on-app-open-20260805

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/realtime-on-app-open-20260805
          fetch-depth: 0

      - name: Apply surgical sync patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/data/db_core.dart')
          s = p.read_text()

          anchor = "part of 'database_service.dart';\n\n"
          insert = "part of 'database_service.dart';\n\nFuture<void>? _foregroundDataRefreshFuture;\nTimer? _appOpenSyncRetryTimer;\n\n"
          assert anchor in s and '_foregroundDataRefreshFuture' not in s
          s = s.replace(anchor, insert, 1)

          lifecycle_old = """  void _registerAppLifecycleObserverOnce() {
    if (DatabaseService._appLifecycleObserverRegistered) return;
    DatabaseService._appLifecycleObserver.onResumed = () {
      unawaited(refreshForegroundData());
    };
    WidgetsBinding.instance.addObserver(DatabaseService._appLifecycleObserver);
    DatabaseService._appLifecycleObserverRegistered = true;
  }
"""
          lifecycle_new = """  void _scheduleAppOpenSyncRetry() {
    _appOpenSyncRetryTimer?.cancel();
    final until = _pbNextAllowedNetworkAt;
    final remaining = until?.difference(DateTime.now()) ?? Duration.zero;
    final delay = remaining.isNegative ? Duration.zero : remaining;
    _appOpenSyncRetryTimer = Timer(
      delay + const Duration(milliseconds: 250),
      () {
        _appOpenSyncRetryTimer = null;
        if (!_isInitialized || !(currentProfileId?.isNotEmpty ?? false)) {
          return;
        }
        unawaited(refreshForegroundData());
      },
    );
  }

  void _registerAppLifecycleObserverOnce() {
    if (DatabaseService._appLifecycleObserverRegistered) return;
    DatabaseService._appLifecycleObserver.onResumed = () {
      if (_pbHttpBackoffActive) {
        _scheduleAppOpenSyncRetry();
      } else {
        unawaited(refreshForegroundData());
      }
    };
    WidgetsBinding.instance.addObserver(DatabaseService._appLifecycleObserver);
    DatabaseService._appLifecycleObserverRegistered = true;
  }
"""
          assert lifecycle_old in s
          s = s.replace(lifecycle_old, lifecycle_new, 1)

          signout_old = """  void clearLocalStateOnSignOut() {
    _unregisterAppLifecycleObserver();
"""
          signout_new = """  void clearLocalStateOnSignOut() {
    _unregisterAppLifecycleObserver();
    _appOpenSyncRetryTimer?.cancel();
    _appOpenSyncRetryTimer = null;
    _foregroundDataRefreshFuture = null;
"""
          assert signout_old in s
          s = s.replace(signout_old, signout_new, 1)

          backoff_old = """      _isInitialized = true;
      _registerAppLifecycleObserverOnce();
      StartupLog.scheduleAfterFirstFrame(
        'deferredBootWork',
        _runDeferredBootWorkAfterFirstShell,
      );
      return;
"""
          backoff_new = """      _isInitialized = true;
      _registerAppLifecycleObserverOnce();
      _scheduleAppOpenSyncRetry();
      StartupLog.scheduleAfterFirstFrame(
        'deferredBootWork',
        _runDeferredBootWorkAfterFirstShell,
      );
      return;
"""
          assert s.count(backoff_old) == 1
          s = s.replace(backoff_old, backoff_new, 1)

          normal_old = """    _isInitialized = true;
    _registerAppLifecycleObserverOnce();
    StartupLog.scheduleAfterFirstFrame(
      'deferredBootWork',
      _runDeferredBootWorkAfterFirstShell,
    );
"""
          normal_new = """    _isInitialized = true;
    _registerAppLifecycleObserverOnce();
    // App-open freshness must not depend on a frame callback or user gesture.
    // Realtime is armed first; the following pull is a single catch-up only.
    unawaited(refreshForegroundData());
    StartupLog.scheduleAfterFirstFrame(
      'deferredBootWork',
      _runDeferredBootWorkAfterFirstShell,
    );
"""
          assert s.count(normal_old) == 1
          s = s.replace(normal_old, normal_new, 1)

          subscribe_block = """    // Subscribe first so cross-device changes arriving during catch-up are not missed.
    if (!_pbHttpBackoffActive) {
      try {
        await Future.wait<void>([
          _startRecordsRealtimeSubscription(),
          _startPlansRealtimeSubscription(),
          _startCatalogRealtimeSubscriptions(),
        ]);
      } catch (_) {}
    }
"""
          assert subscribe_block in s
          s = s.replace(subscribe_block, '', 1)

          fetch_block = """    if (!_pbHttpBackoffActive) {
      try {
        await _fetchRecordsIntoCache(forceNetwork: true);
        await _reconcileDuplicatePrimaryRunningRecords();
      } catch (_) {}
      try {
        await _loadPlanningTasksForToday();
      } catch (_) {}
      unawaited(_loadRulesFromNoco().catchError((Object _, StackTrace _) {}));
      persistPlansWarmSnapshotsToDisk();
      persistTimelineWarmSnapshotsToDisk();
    }
"""
          assert fetch_block in s
          s = s.replace(fetch_block, '', 1)

          full_plans_block = """    unawaited(() async {
      try {
        await _ensureAllPlansUserCacheFresh(force: true);
        notifyPlanningRefresh(scheduleNetworkRefresh: false, pumpNetworkNow: true);
      } catch (_) {}
    }());
"""
          assert full_plans_block in s
          s = s.replace(full_plans_block, '', 1)

          deferred_sync_old = """    final syncSw = Stopwatch()..start();
    try {
      await offlineSync.bootstrapFromOutboxes(
        pbBackoffActive: _pbHttpBackoffActive,
      );
      await flushPendingLocalMutations();
    } catch (_) {}
    syncSw.stop();
"""
          deferred_sync_new = """    final syncSw = Stopwatch()..start();
    try {
      await refreshForegroundData();
    } catch (_) {}
    syncSw.stop();
"""
          assert deferred_sync_old in s
          s = s.replace(deferred_sync_old, deferred_sync_new, 1)

          refresh_start = """  /// Foreground/resume refresh: records + today's plans + stream pumps (no user input required).
  Future<void> refreshForegroundData() async {
    if (!(currentProfileId?.isNotEmpty ?? false)) return;
    if (!_isInitialized) return;
    await offlineSync.bootstrapFromOutboxes(
      pbBackoffActive: _pbHttpBackoffActive,
    );
    // Re-arm push channels before flush/catch-up. The following fetch is a one-shot
    // reconciliation for events missed while the app was suspended, never polling.
    if (!_pbHttpBackoffActive) {
      try {
        await Future.wait<void>([
          _startRecordsRealtimeSubscription(),
          _startPlansRealtimeSubscription(),
          _startCatalogRealtimeSubscriptions(),
        ]);
      } catch (_) {}
    }
    await flushPendingLocalMutations();
    if (_pbHttpBackoffActive) return;
    try {
      _lastSuccessfulRecordsNetworkFetchAt = null;
      await _fetchRecordsIntoCache(forceNetwork: true);
      await _reconcileDuplicatePrimaryRunningRecords();
      await _ensureAllPlansUserCacheFresh(force: true);
      await _loadPlanningTasksForToday();
      notifyPlanningRefresh(scheduleNetworkRefresh: false, pumpNetworkNow: true);
    } catch (_) {}
  }
"""
          refresh_new = """  /// Foreground/app-open refresh: arm push first, then one catch-up pull.
  /// Never polls and never requires a user gesture.
  Future<void> refreshForegroundData() {
    final active = _foregroundDataRefreshFuture;
    if (active != null) return active;
    late final Future<void> run;
    run = _refreshForegroundDataBody().whenComplete(() {
      if (identical(_foregroundDataRefreshFuture, run)) {
        _foregroundDataRefreshFuture = null;
      }
    });
    _foregroundDataRefreshFuture = run;
    return run;
  }

  Future<void> _refreshForegroundDataBody() async {
    if (!(currentProfileId?.isNotEmpty ?? false)) return;
    if (!_isInitialized) return;
    if (_pbHttpBackoffActive) {
      _scheduleAppOpenSyncRetry();
      return;
    }
    _appOpenSyncRetryTimer?.cancel();
    _appOpenSyncRetryTimer = null;

    // Push-first: subscribe before any outbox work or catch-up request so a
    // concurrent remote write cannot fall into a startup gap.
    try {
      await Future.wait<void>([
        _startRecordsRealtimeSubscription(),
        _startPlansRealtimeSubscription(),
        _startCatalogRealtimeSubscriptions(),
      ]);
    } catch (_) {}

    // Local pending work must not prevent incoming remote data from appearing.
    try {
      await offlineSync.bootstrapFromOutboxes(
        pbBackoffActive: _pbHttpBackoffActive,
      );
      await flushPendingLocalMutations();
    } catch (_) {}
    if (_pbHttpBackoffActive) {
      _scheduleAppOpenSyncRetry();
      return;
    }

    // Exactly one pull on open/resume to recover events missed while suspended.
    try {
      _lastSuccessfulRecordsNetworkFetchAt = null;
      await _fetchRecordsIntoCache(forceNetwork: true);
      await _reconcileDuplicatePrimaryRunningRecords();
      await _ensureAllPlansUserCacheFresh(force: true);
      await _loadPlanningTasksForToday();
      unawaited(_loadRulesFromNoco().catchError((Object _, StackTrace _) {}));
      notifyPlanningRefresh(scheduleNetworkRefresh: false, pumpNetworkNow: true);
      persistPlansWarmSnapshotsToDisk();
      persistTimelineWarmSnapshotsToDisk();
    } catch (_) {
      if (_pbHttpBackoffActive) {
        _scheduleAppOpenSyncRetry();
      }
    }
  }
"""
          assert refresh_start in s
          s = s.replace(refresh_start, refresh_new, 1)
          p.write_text(s)

          test = Path('test/realtime_app_open_contract_test.dart')
          test.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  final source = File('lib/data/db_core.dart').readAsStringSync();

  test('cold start arms live sync without waiting for a user gesture', () {
    final ready = source.indexOf('unawaited(refreshForegroundData());');
    final deferred = source.indexOf("StartupLog.scheduleAfterFirstFrame(\\n      'deferredBootWork'");
    expect(ready, greaterThanOrEqualTo(0));
    expect(deferred, greaterThan(ready));
  });

  test('temporary startup backoff schedules one automatic retry', () {
    expect(source, contains('_scheduleAppOpenSyncRetry();'));
    expect(source, contains('delay + const Duration(milliseconds: 250)'));
  });

  test('app-open sync is push-first and contains no periodic polling', () {
    final body = source.substring(source.indexOf('Future<void> _refreshForegroundDataBody()'));
    final subscribe = body.indexOf('await Future.wait<void>');
    final outbox = body.indexOf('await offlineSync.bootstrapFromOutboxes');
    expect(subscribe, greaterThanOrEqualTo(0));
    expect(outbox, greaterThan(subscribe));
    expect(source, isNot(contains('Timer.periodic')));
  });
}
""")

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          entry = """## 2026-08-05 — Realtime activates on app open\n\n- Cold start now arms PocketBase records/plans/catalog subscriptions immediately after profile hydration instead of depending on the post-frame maintenance queue.\n- A transient startup PocketBase backoff now schedules one automatic retry after the cooldown; no user action and no periodic polling are required.\n- App-open/resume sync uses one deduplicated push-first path followed by a single catch-up fetch for events missed while suspended.\n\n"""
          if entry not in c:
            changelog.write_text(entry + c)
          PY

          rm .github/workflows/apply-realtime-app-open-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/data/db_core.dart test/realtime_app_open_contract_test.dart CHANGELOG.md .github/workflows/apply-realtime-app-open-fix.yml
          git commit -m "Fix realtime activation on app open"
          git push origin HEAD:fix/realtime-on-app-open-20260805
