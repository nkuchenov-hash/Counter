name: Fix mobile web sleep OAuth once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-mobile-web-sleep-oauth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sleep OAuth and Google Health request
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/data/health/cloud_sleep_sync_service.dart')
          s = p.read_text()
          old = """      final launched = await launchUrl(\n        uri,\n        mode: kIsWeb\n            ? LaunchMode.platformDefault\n            : LaunchMode.externalApplication,\n      );"""
          new = """      final launched = await launchUrl(\n        uri,\n        mode: kIsWeb\n            ? LaunchMode.platformDefault\n            : LaunchMode.externalApplication,\n        // The authorization URL is obtained asynchronously. Mobile browsers\n        // may block a delayed new-tab launch as a popup; same-tab navigation\n        // remains allowed and returns to LIFE OS through the OAuth callback.\n        webOnlyWindowName: kIsWeb ? '_self' : null,\n      );"""
          if old not in s:
              raise SystemExit('cloud OAuth launch block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('pb_hooks/google_health_sleep_runtime.js')
          s = p.read_text()
          s = s.replace(
              'var __healthScope = "https://www.googleapis.com/auth/googlehealth.sleep.readonly";',
              'var __healthScope = "https://www.googleapis.com/auth/googlehealth.sleep.readonly";'
          )
          old = 'var name = String(row.name || "").trim();'
          new = 'var name = String(row.dataPointName || row.name || "").trim();'
          if old not in s:
              raise SystemExit('Google Health data point id line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify surgical changes
        run: |
          node --check pb_hooks/google_health_sleep_runtime.js
          git diff --check
          grep -F "webOnlyWindowName: kIsWeb ? '_self' : null" lib/data/health/cloud_sleep_sync_service.dart
          grep -F "row.dataPointName || row.name" pb_hooks/google_health_sleep_runtime.js

      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/tmp-fix-mobile-web-sleep-oauth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/health/cloud_sleep_sync_service.dart pb_hooks/google_health_sleep_runtime.js .github/workflows/tmp-fix-mobile-web-sleep-oauth.yml
          git commit -m "Fix mobile web sleep authorization"
          git push origin HEAD:main
