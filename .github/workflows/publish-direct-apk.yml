name: Publish public LIFE OS APK on PocketBase host

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-direct-apk.yml'

permissions:
  contents: read

jobs:
  mirror-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      LIFEOS_SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      LIFEOS_SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      LIFEOS_SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Fetch exact canonical APK and verify published digest
        shell: bash
        run: |
          set -euo pipefail
          gh release download life-os-android-1779-7f7dd17ce284abe1e67f3654e21250a9ed62006f \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "LIFE-OS-Android-arm64.apk" \
            --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo "0b2ff2c360a26dec9d184ead614def4584396a3166145206a3a60c01eb89803d  LIFE-OS-Android-arm64.apk" | sha256sum --check

      - name: Mirror release to existing PocketBase static public directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LIFEOS_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::Production SSH secret absent; direct APK hosting unavailable."
            exit 1
          fi
          host="137.22.146.109"
          user="${LIFEOS_SSH_USER:-root}"
          port="${LIFEOS_SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$LIFEOS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lifeos_host_key"
          chmod 600 "$RUNNER_TEMP/lifeos_host_key"
          ssh-keyscan -T 8 -p "$port" -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh_opts=(-i "$RUNNER_TEMP/lifeos_host_key" -p "$port" -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes)
          scp -i "$RUNNER_TEMP/lifeos_host_key" -P "$port" \
            -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/LIFE-OS-Android-arm64.apk" "$user@$host:/tmp/lifeos-publish-apk-${GITHUB_RUN_ID}.apk"
          ssh "${ssh_opts[@]}" "$user@$host" "bash -s -- /tmp/lifeos-publish-apk-${GITHUB_RUN_ID}.apk" <<'REMOTE'
          set -euo pipefail
          upload="$1"
          root_cmd=()
          if [[ "$(id -u)" != 0 ]]; then root_cmd=(sudo -n); fi
          service="$("${root_cmd[@]}" systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          working_dir=""
          if [[ -n "$service" ]]; then
            working_dir="$("${root_cmd[@]}" systemctl show "$service" -p WorkingDirectory --value || true)"
          fi
          if [[ -z "$working_dir" || "$working_dir" == "/" ]]; then
            pid="$(pgrep -f '[p]ocketbase.*serve' | head -n1 || true)"
            if [[ -n "$pid" ]]; then working_dir="$("${root_cmd[@]}" readlink -f "/proc/$pid/cwd" || true)"; fi
          fi
          if [[ -z "$working_dir" || "$working_dir" == "/" || ! -d "$working_dir" || ! -d "$working_dir/pb_data" ]]; then
            for candidate in /opt/pocketbase /opt/lifeos/pocketbase /srv/pocketbase /home/pocketbase /root/pocketbase /var/lib/pocketbase; do
              if [[ -d "$candidate/pb_data" ]]; then working_dir="$candidate"; break; fi
            done
          fi
          if [[ -z "$working_dir" || "$working_dir" == "/" || ! -d "$working_dir/pb_data" ]]; then
            echo "::error::PocketBase public directory could not be identified; refusing to publish to an unverified path."
            echo "Diagnose: process=$(pgrep -af '[p]ocketbase' | cut -c1-90 | head -n2 || true)"
            echo "Diagnose: docker=$(command -v docker >/dev/null && docker ps --format '{{.Names}} {{.Image}}' | grep -i pocketbase | head -n2 || true)"
            exit 1
          fi
          # PocketBase resolves pb_public relative to the executable, NOT
          # necessarily to its process working directory.
          pid="$(pgrep -f '[p]ocketbase.*serve' | head -n1 || true)"
          binary_dir=""
          if [[ -n "$pid" ]]; then
            executable="$("${root_cmd[@]}" readlink -f "/proc/$pid/exe" || true)"
            if [[ -f "$executable" ]]; then binary_dir="$(dirname "$executable")"; fi
          fi
          if [[ -z "$binary_dir" && -f "$working_dir/pocketbase" ]]; then
            binary_dir="$working_dir"
          fi
          if [[ -z "$binary_dir" ]]; then
            echo "::error::PocketBase executable path unavailable; cannot determine static public directory."
            exit 1
          fi
          echo "Found PocketBase executable; placing APK beside the running binary."
          "${root_cmd[@]}" mkdir -p "$binary_dir/pb_public/downloads"
          "${root_cmd[@]}" install -m 644 "$upload" "$binary_dir/pb_public/downloads/LIFE-OS-Android-arm64.apk"
          "${root_cmd[@]}" rm -f "$upload"
          echo "APK placed in PocketBase static asset path."
          echo "Routing diagnostics:"
          for command_name in caddy nginx; do
            if command -v "$command_name" >/dev/null 2>&1; then echo "Reverse proxy: $command_name"; fi
          done
          ps -eo comm,args | grep -E '([p]ocketbase.*serve|[c]addy.*run|[n]ginx: master)' | cut -c1-180 | head -n6 || true
          for port in 8099 8102 80; do
            code="$(curl --silent --max-time 8 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/downloads/LIFE-OS-Android-arm64.apk" || true)"
            echo "Local static route $port HTTP $code"
          done
          echo "Caddyfile route structure:"
          if [[ -r /etc/caddy/Caddyfile ]]; then
            grep -nE '(^[^#[:space:]].*\{|handle|route|reverse_proxy|file_server|root |import |redir |respond )' /etc/caddy/Caddyfile | sed -E 's/(basicauth|basic_auth).*/[sensitive rule redacted]/g' | head -n45
          fi
          REMOTE

      - name: Confirm independently accessible HTTPS download and exact bytes
        shell: bash
        run: |
          set -euo pipefail
          url="https://137-22-146-109.sslip.io/downloads/LIFE-OS-Android-arm64.apk"
          curl -fSL --connect-timeout 8 --max-time 90 --retry 2 "$url" --output "$RUNNER_TEMP/direct.apk"
          echo "Public response bytes: $(wc -c < "$RUNNER_TEMP/direct.apk")"
          file "$RUNNER_TEMP/direct.apk"
          head -c 140 "$RUNNER_TEMP/direct.apk" | strings | head -n3 || true
          echo "0b2ff2c360a26dec9d184ead614def4584396a3166145206a3a60c01eb89803d  $RUNNER_TEMP/direct.apk" | sha256sum --check
          echo "Public direct HTTPS download verified: $url"
