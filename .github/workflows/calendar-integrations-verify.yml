name: Calendar Integrations Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/data/calendar_integrations/**'
      - 'lib/features/profile/calendar_integrations/**'
      - 'lib/features/profile/settings/account_settings_section.dart'
      - 'lib/data/pb_config.dart'
      - 'lib/l10n/dictionary.dart'
      - 'pb_hooks/calendar_integrations.pb.js'
      - 'pb_migrations/1785960000_calendar_integrations.js'
      - 'test/calendar_integrations_contract_test.dart'
      - '.github/workflows/calendar-integrations-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/calendar-integrations-v1

      - name: Remove arbitrary category fallback once
        run: |
          python - <<'PY'
          from pathlib import Path
          hook = Path('pb_hooks/calendar_integrations.pb.js')
          text = hook.read_text(encoding='utf-8')
          old = '    return categories.length ? categories[0].id : "";'
          if old in text:
              text = text.replace(old, '    return "";', 1)
              hook.write_text(text, encoding='utf-8')
          test = Path('test/calendar_integrations_contract_test.dart')
          t = test.read_text(encoding='utf-8')
          anchor = "    expect(hook, contains('\"ts\": \"technical\"'));\n"
          assertion = "    expect(resolver, contains('return \\\"\\\";'));\n"
          if assertion not in t:
              if anchor not in t:
                  raise SystemExit('test anchor missing')
              t = t.replace(anchor, anchor + assertion, 1)
              test.write_text(t, encoding='utf-8')
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add pb_hooks/calendar_integrations.pb.js test/calendar_integrations_contract_test.dart
            git commit -m "Require explicit fallback for unmatched calendar events"
            git push origin HEAD:feature/calendar-integrations-v1
          fi

      - name: Validate PocketBase JavaScript syntax
        run: |
          node --check pb_hooks/calendar_integrations.pb.js
          node --check pb_migrations/1785960000_calendar_integrations.js

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused tests
        run: flutter test test/calendar_integrations_contract_test.dart

      - name: Build web release
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Build Android arm64 release
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons
