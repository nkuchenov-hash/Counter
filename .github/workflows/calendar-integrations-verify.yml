name: Calendar Integrations Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/data/calendar_integrations/**'
      - 'lib/features/profile/calendar_integrations/**'
      - 'lib/features/profile/settings/account_settings_section.dart'
      - 'lib/data/pb_config.dart'
      - 'lib/l10n/dictionary.dart'
      - 'pb_hooks/calendar_integrations.pb.js'
      - 'pb_migrations/1785960000_calendar_integrations.js'
      - 'test/calendar_integrations_contract_test.dart'
      - '.github/workflows/calendar-integrations-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/calendar-integrations-v1

      - name: Apply category-depth ranking once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pb_hooks/calendar_integrations.pb.js')
          text = path.read_text(encoding='utf-8')
          if 'var effectiveScore = score + (score >= 2500 ? depth * 5000 : 0);' not in text:
              depth_line = '        var depth = __calendarCategoryDepth(categories[j], byId, memo);\n'
              if depth_line not in text:
                  raise SystemExit('depth line missing')
              text = text.replace(
                  depth_line,
                  depth_line +
                  '        // A confident child-category match must outrank a matching parent path.\n' +
                  '        // Apply the depth bonus only to phrase/multi-token-grade matches.\n' +
                  '        var effectiveScore = score + (score >= 2500 ? depth * 5000 : 0);\n',
                  1,
              )
              old_if = '        if (!best || score > bestScore || (score === bestScore && depth > bestDepth)) {'
              new_if = '        if (!best || effectiveScore > bestScore || (effectiveScore === bestScore && depth > bestDepth)) {'
              if old_if not in text:
                  raise SystemExit('ranking condition missing')
              text = text.replace(old_if, new_if, 1)
              score_line = '            bestScore = score;'
              if score_line not in text:
                  raise SystemExit('best score assignment missing')
              text = text.replace(score_line, '            bestScore = effectiveScore;', 1)
              path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add pb_hooks/calendar_integrations.pb.js
            git commit -m "Prioritize deep calendar category matches"
            git push origin HEAD:feature/calendar-integrations-v1
          fi

      - name: Validate PocketBase JavaScript syntax
        run: |
          node --check pb_hooks/calendar_integrations.pb.js
          node --check pb_migrations/1785960000_calendar_integrations.js

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused tests
        run: flutter test test/calendar_integrations_contract_test.dart

      - name: Build web release
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Build Android arm64 release
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons
