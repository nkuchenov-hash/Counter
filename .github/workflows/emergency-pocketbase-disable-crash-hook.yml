name: Emergency disable crashing PocketBase hook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-pocketbase-disable-crash-hook.yml'

permissions:
  contents: write

concurrency:
  group: pocketbase-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Overwrite crashing hook and restart PocketBase
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          remote_file="/tmp/zz_google_fit_final_normalize_once.pb.js"
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" \
            pb_hooks/zz_google_fit_final_normalize_once.pb.js \
            "${SSH_USER:-root}@${SSH_HOST:-217.114.0.201}:$remote_file"
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "${SSH_USER:-root}@${SSH_HOST:-217.114.0.201}" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' REMOTE_FILE='$remote_file' bash -s" \
            > "$RUNNER_TEMP/pb_disable_hook_result.txt" 2>&1 <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then
            app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"
          fi
          [[ -n "$service_name" && -n "$app_dir" && -d "$app_dir" ]]
          $SUDO install -m 0644 "$REMOTE_FILE" "$app_dir/pb_hooks/zz_google_fit_final_normalize_once.pb.js"
          rm -f "$REMOTE_FILE"
          echo "hook_overwritten=true"
          $SUDO systemctl daemon-reload
          $SUDO systemctl restart "$service_name"
          sleep 5
          active="$($SUDO systemctl is-active "$service_name" 2>/dev/null || true)"
          echo "active=$active"
          if [[ "$active" != "active" ]]; then
            echo "journal_begin"
            $SUDO journalctl -u "$service_name" -n 50 --no-pager -o cat 2>&1
            echo "journal_end"
            exit 1
          fi
          REMOTE
          cat "$RUNNER_TEMP/pb_disable_hook_result.txt"

      - name: Verify production health
        id: health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            code="$(curl -ksS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/health || true)"
            echo "health attempt $attempt: $code"
            if [[ "$code" == "200" ]]; then
              echo "PocketBase production health OK"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish recovery result
        if: always()
        shell: bash
        env:
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          {
            echo "sha=$GITHUB_SHA"
            echo "recover=${RECOVER_OUTCOME:-skipped}"
            echo "health=${HEALTH_OUTCOME:-skipped}"
            if [[ -f "$RUNNER_TEMP/pb_disable_hook_result.txt" ]]; then
              echo "remote_diag_begin"
              sed -E 's/[A-Za-z0-9_=-]{48,}/[redacted]/g' "$RUNNER_TEMP/pb_disable_hook_result.txt" | tail -n 70
              echo "remote_diag_end"
            fi
          } > _tmp_pocketbase_disable_hook_result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp_pocketbase_disable_hook_result.txt
          git commit -m 'Record PocketBase crash-hook recovery result'
          git pull --rebase origin main
          git push origin HEAD:main
