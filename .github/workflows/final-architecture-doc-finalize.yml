name: Final architecture documentation parity finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/final-architecture-doc-parity-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-architecture-doc-parity-20260818
          fetch-depth: 1
      - name: Harden one section replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/manual/_finalize_architecture_doc_parity.py')
          text = p.read_text(encoding='utf-8')
          old = 'nav = replace_once(nav, old_perf, new_perf, label="agent navigation performance section")'
          new = '''nav = replace_regex(
              nav,
              r"## P0 / performance layer \\(active architecture debt\\).*?(?=\\n---\\n)",
              new_perf,
              label="agent navigation performance section",
              flags=re.S,
          )'''
          if old not in text:
              raise SystemExit('performance replacement call not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply final parity patch
        shell: bash
        run: |
          python scripts/manual/_finalize_architecture_doc_parity.py
          python scripts/manual/_finalize_architecture_doc_parity_extra.py
          git diff --check
      - name: Generate detailed structure guide
        shell: bash
        run: |
          python scripts/manual/generate_app_structure_detailed.py
          cp docs/APP_STRUCTURE_DETAILED.md /tmp/app_structure_detailed_first.md
          python scripts/manual/generate_app_structure_detailed.py
          cmp /tmp/app_structure_detailed_first.md docs/APP_STRUCTURE_DETAILED.md
      - name: Governing documentation parity
        run: python scripts/audit/documentation_parity.py
      - name: Strict architecture guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Prepare Flutter analyzer
        shell: bash
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
          flutter pub get
      - name: Analyze compile errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Final hygiene
        shell: bash
        run: |
          rm -f lib/core/env/env.dart
          git rm -f scripts/manual/_finalize_architecture_doc_parity.py
          git rm -f scripts/manual/_finalize_architecture_doc_parity_extra.py
          git rm -f .github/workflows/final-architecture-doc-audit.yml
          git rm -f .github/workflows/final-architecture-doc-finalize.yml
          git diff --check
          python scripts/audit/documentation_parity.py
          pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict
      - name: Commit verified parity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize architecture and documentation parity'
          git push origin HEAD:agent/final-architecture-doc-parity-20260818
