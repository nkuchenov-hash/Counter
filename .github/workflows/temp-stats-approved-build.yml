name: Temp Stats Approved Build

on:
  push:
    branches:
      - feat/stats-approved-visual-20260810

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_tab.dart

      - name: Analyze Stats files
        run: flutter analyze lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_tab.dart

      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
