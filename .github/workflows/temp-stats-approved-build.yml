name: Temp Stats Approved Build

on:
  push:
    branches:
      - feat/stats-approved-visual-20260810

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Apply final Stats lint fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/stats/day_stats_dashboard.dart')
          s = p.read_text()
          s = s.replace(
              "return '${hours} h ${minutes.toString().padLeft(2, '0')} m';",
              "return '$hours h ${minutes.toString().padLeft(2, '0')} m';",
          )
          p.write_text(s)
          PY

      - name: Format Stats files
        run: dart format lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_tab.dart

      - name: Persist Stats cleanup
        run: |
          if ! git diff --quiet -- lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_tab.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_tab.dart
            git commit -m "Clean up Stats redesign"
            git push
          fi

      - name: Analyze Stats files
        run: flutter analyze lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_tab.dart

      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
