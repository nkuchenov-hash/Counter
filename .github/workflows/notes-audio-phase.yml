name: Notes Audio Phase

on:
  push:
    branches:
      - feature/notes-v3-design-system

permissions:
  contents: write

concurrency:
  group: notes-audio-phase
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Notes audio phase
        run: python scripts/manual/apply_notes_audio_phase.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/data/models.dart \
            lib/data/models/note_audio_types.dart \
            lib/data/models/note_document.dart \
            lib/data/plans/notes_brain_helpers.dart \
            lib/features/notes/notes_audio_controller.dart \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/notes_editor_document_controller.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_component_media_blocks.dart \
            lib/features/notes/widgets/notes_editor_tools.dart \
            lib/l10n/langs/en.dart \
            lib/l10n/langs/ru.dart \
            test/notes_canonical_components_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Remove temporary automation
        run: |
          rm scripts/manual/apply_notes_audio_phase.py
          rm .github/workflows/notes-audio-phase.yml

      - name: Architecture and whitespace checks
        shell: pwsh
        run: |
          ./scripts/audit/architecture_guard.ps1 -Strict
          git diff --check

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Notes audio recording and transcript"
          git push origin HEAD:feature/notes-v3-design-system
