name: One-time sleep wake-day Timeline fix

on:
  push:
    paths:
      - '.github/workflows/tmp-sleep-wake-day-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Timeline sleep day attribution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/data/records/record_timeline_vm.dart')
          text = path.read_text(encoding='utf-8')

          marker = "  static const int _kTimelineIndexMaxSyncRecords = 480;\n"
          helper = r'''

  bool _timelineRowIsSleep(Map<String, dynamic> row) {
    final kind = (row['external_kind'] ?? '').toString().trim().toLowerCase();
    final source = (row['sleep_source'] ?? '').toString().trim();
    final title = (row['title'] ?? '').toString().trim().toLowerCase();
    return kind == 'sleep' ||
        source.isNotEmpty ||
        title == 'sleep' ||
        title == 'сон';
  }

  String _timelineRecordDayKey(
    Map<String, dynamic> row,
    DateTime startUtc,
  ) {
    if (_timelineRowIsSleep(row)) {
      final endUtc = CategoryServiceExtension._parseDateTimeUtc(row['end_time']);
      if (endUtc != null && endUtc.isAfter(startUtc)) {
        // A night belongs to the day the user woke up, while its real start/end
        // timestamps remain untouched for duration, overlap and detail views.
        return _timelineDeviceLocalDayKeyFromUtc(endUtc);
      }
    }
    return _timelineDeviceLocalDayKeyFromUtc(startUtc);
  }
'''
          if '_timelineRecordDayKey(' not in text:
              if marker not in text:
                  raise SystemExit('Timeline index marker not found')
              text = text.replace(marker, marker + helper, 1)

          old = 'final recordDayStr = _timelineDeviceLocalDayKeyFromUtc(stUtc);'
          new = 'final recordDayStr = _timelineRecordDayKey(row, stUtc);'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 Timeline day-index sites, found {count}')
          text = text.replace(old, new)

          if text.count(new) != 2:
              raise SystemExit('Timeline sleep day replacement verification failed')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and publish fix
        run: |
          rm .github/workflows/tmp-sleep-wake-day-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/records/record_timeline_vm.dart .github/workflows/tmp-sleep-wake-day-fix.yml
          git diff --cached --check
          git commit -m "Show sleep on wake day"
          git push origin HEAD:main
