name: Notes v2 real-font capture

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-editor-tools-v2
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Install capture fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation2
          fc-list | head -20
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          find "$FLUTTER_ROOT/bin/cache/artifacts" -name 'MaterialIcons-Regular.otf' -print

      - name: Create env.dart
        run: cp lib/core/env/env.dart.example lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format capture test
        run: dart format test/notes_v2_tools_visual_test.dart

      - name: Regenerate capture with real fonts
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test --update-goldens test/notes_v2_tools_visual_test.dart 2>&1 | tee notes_v2_capture.log

      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-v2-capture-diagnostics
          path: |
            notes_v2_capture.log
            test/fixtures/notes_v2_tools_capture.png
          if-no-files-found: warn
          retention-days: 1

      - name: Stop on capture failure
        if: ${{ steps.capture.outcome == 'failure' }}
        run: exit 1

      - name: Verify capture
        run: flutter test test/notes_v2_tools_visual_test.dart

      - name: Remove temporary capture workflow
        run: rm .github/workflows/notes-v2-artifact.yml

      - name: Commit corrected capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate Notes tools capture with real fonts [notes-v2-capture]"
          git push origin HEAD:feature/notes-editor-tools-v2
