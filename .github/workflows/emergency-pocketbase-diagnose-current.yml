name: Emergency PocketBase current diagnosis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-pocketbase-diagnose-current.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose current service
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "${SSH_USER:-root}@${SSH_HOST:-217.114.0.201}" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" \
            > _tmp_pocketbase_current_diagnosis.txt 2>&1 <<'REMOTE'
          set +e
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then
            app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"
          fi
          echo "service=${service_name:-missing}"
          echo "active=$(systemctl is-active "$service_name" 2>/dev/null || true)"
          echo "app_dir=${app_dir:-missing}"
          echo "unit_execstart=$(systemctl show "$service_name" -p ExecStart --value 2>/dev/null | sed -E 's/[A-Za-z0-9_=-]{48,}/[redacted]/g')"
          echo "root_js_files_begin"
          if [[ -d "$app_dir" ]]; then find "$app_dir" -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort; fi
          echo "root_js_files_end"
          echo "run_calls_begin"
          if [[ -d "$app_dir" ]]; then grep -RnsE '(^|[^A-Za-z0-9_])run[[:space:]]*\(' "$app_dir" --include='*.js' 2>/dev/null | head -n 80 | sed -E 's/[A-Za-z0-9_=-]{48,}/[redacted]/g'; fi
          echo "run_calls_end"
          echo "journal_begin"
          $SUDO journalctl -u "$service_name" -n 100 --no-pager -o cat 2>&1 | tail -n 100
          echo "journal_end"
          REMOTE
          sed -i -E 's/[A-Za-z0-9_=-]{48,}/[redacted]/g' _tmp_pocketbase_current_diagnosis.txt
      - name: Publish diagnosis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp_pocketbase_current_diagnosis.txt
          git commit -m 'Record current PocketBase startup diagnosis'
          git pull --rebase origin main
          git push origin HEAD:main
