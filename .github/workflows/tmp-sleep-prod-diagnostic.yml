name: Temporary sleep production diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sleep-prod-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$SSH_USER" >> "$GITHUB_ENV"
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read sanitized sleep sync state
        run: |
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" > /tmp/sleep-prod-latest.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ {print $1; exit}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | head -n 1 || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then
            app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"
          fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then
            app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
          fi
          db="$app_dir/pb_data/data.db"
          test -f "$db"
          python3 - "$db" <<'PY'
          import sqlite3, sys
          from datetime import datetime, timedelta, timezone
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True)
          con.row_factory=sqlite3.Row
          print('=== latest sleep sync connection ===')
          rows=con.execute('''
            SELECT enabled,status,last_error,last_sync_at,last_session_count,last_imported_count,
                   length(coalesce(refresh_token_enc,'')) AS refresh_len, updated
            FROM sleep_sync_connections
            ORDER BY updated DESC LIMIT 1
          ''').fetchall()
          for r in rows: print(dict(r))
          now=datetime.now(timezone.utc)
          for hours in (24,48,168,720):
            cutoff=(now-timedelta(hours=hours)).isoformat().replace('+00:00','Z')
            n=con.execute('''SELECT count(*) FROM records
              WHERE (title='Sleep' OR title='Сон' OR external_kind='sleep') AND end_time>=?''',(cutoff,)).fetchone()[0]
            print(f'sleep_records_last_{hours}h={n}')
          PY
          echo '=== recent server sleep errors ==='
          if [[ -n "$service_name" ]]; then
            journalctl -u "$service_name" --since '24 hours ago' --no-pager 2>/dev/null | grep -Ei 'google (health|fit) sleep|sleep sync failed|authorization|insufficient' | tail -n 50 || true
          fi
          REMOTE
          cat /tmp/sleep-prod-latest.txt

      - name: Publish sanitized diagnostic to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sleep-diagnostic-output
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p diagnostics
          cp /tmp/sleep-prod-latest.txt diagnostics/sleep-prod-latest.txt
          git add diagnostics/sleep-prod-latest.txt
          git commit -m "Update sanitized sleep production diagnostic"
          git push --force origin HEAD:sleep-diagnostic-output
