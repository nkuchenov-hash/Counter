name: Temporary finalize Paths Variant 2

on:
  push:
    branches:
      - fix/paths-variant2-structure-20260904

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paths-variant2-structure-20260904
          fetch-depth: 0
      - name: Restore unrelated lockfile and remove temporary workflow
        run: |
          git fetch origin main
          git checkout origin/main -- pubspec.lock
          git rm .github/workflows/tmp-finalize-paths-variant2.yml
      - name: Validate architecture and documentation parity
        run: |
          pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict
          python scripts/audit/documentation_parity.py
          python scripts/audit/repository_hygiene.py
      - name: Commit cleanup
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes needed"
          else
            git commit -m "Finalize Paths Variant 2 cleanup"
            git push origin HEAD:fix/paths-variant2-structure-20260904
          fi
