name: Day stats structure manifest sync

on:
  push:
    branches:
      - feature/day-stats-dashboard
    paths:
      - '.github/workflows/day-stats-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/day-stats-dashboard

      - name: Register stats files in APP_STRUCTURE
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/APP_STRUCTURE.md')
          text = path.read_text(encoding='utf-8')
          old = "| `stats/` | `stats_view.dart`, `plan_vs_fact_tab.dart` | Productivity stats (embedded in Timeline) |"
          new = "| `stats/` | `stats_view.dart`, `day_stats_dashboard.dart`, `stats_detail_tree.dart`, `plan_vs_fact_tab.dart` | Productivity stats (embedded in Timeline): switchable day dashboards, preserved detailed tree, plan vs fact |"
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Stats manifest row not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit manifest update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/APP_STRUCTURE.md
          git commit -m "Document day stats dashboard files"
          git push origin HEAD:feature/day-stats-dashboard
