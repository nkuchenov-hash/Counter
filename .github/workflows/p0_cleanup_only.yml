name: One-shot P0 planning cleanup

on:
  push:
    branches:
      - fix/p0-planning-time-performance

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-planning-time-performance
          fetch-depth: 0

      - name: Apply final editor guards and clean branch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/shared/planning_task_edit_sheet.dart')
          text = path.read_text(encoding='utf-8')

          old = """        if (latest != null) {
            unawaited(_syncPlanDraftToNetwork(latest));
          }
"""
          new = """        if (latest != null) {
            _applyPlanDraftLocally(latest);
            unawaited(_syncPlanDraftToNetwork(latest));
          }
"""
          if old in text:
              text = text.replace(old, new, 1)

          old = """    DatabaseService.instance.notifyPlanningRefresh();
"""
          new = """    DatabaseService.instance.notifyPlanningRefresh(
      scheduleNetworkRefresh: false,
    );
"""
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git checkout origin/main -- pubspec.lock macos/Flutter/GeneratedPluginRegistrant.swift
          rm -f .p0_cleanup_trigger
          rm -f .github/workflows/p0_cleanup_only.yml
          git diff --check

      - name: Commit clean source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(planning): clean final P0 source branch"
          git push origin HEAD:fix/p0-planning-time-performance
