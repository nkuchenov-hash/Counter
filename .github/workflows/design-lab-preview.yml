name: Flutter Design Lab preview

on:
  pull_request:
    paths:
      - 'lib/app/design_lab/**'
      - 'test/editor_design_lab_test.dart'
      - '.github/workflows/design-lab-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Create non-secret environment placeholder
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
      - run: flutter pub get
      - run: flutter test test/editor_design_lab_test.dart
      - name: Build isolated Flutter Web lab
        run: |
          cp lib/app/design_lab/index.html web/index.html
          flutter build web --release --target=lib/app/design_lab/main.dart --base-href=/ --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none --no-web-resources-cdn
      - name: Browser smoke test
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lab-browser" --no-save playwright
          "$RUNNER_TEMP/lab-browser/node_modules/.bin/playwright" install chromium
          python3 -m http.server 8765 --directory build/web > /tmp/lab-server.log 2>&1 &
          node <<'JS'
          const { chromium } = require(process.env.RUNNER_TEMP + '/lab-browser/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{width:1280,height:1100} });
            const errors = [];
            const external = [];
            const externalResponses = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('response', r => { if (!r.url().startsWith('http://127.0.0.1:8765/') && !r.url().startsWith('data:') && !r.url().startsWith('blob:')) externalResponses.push(r.url()); });
            page.on('request', r => { if (!r.url().startsWith('http://127.0.0.1:8765/') && !r.url().startsWith('data:') && !r.url().startsWith('blob:')) external.push(r.url()); });
            await page.route('**/*', route => {
              const u = route.request().url();
              return u.startsWith('http://127.0.0.1:8765/') || u.startsWith('data:') || u.startsWith('blob:') ? route.continue() : route.abort();
            });
            await page.goto('http://127.0.0.1:8765/');
            if (await page.title() !== 'LIFE OS / Design Lab') throw Error('Wrong browser shell');
            const csp = await page.locator('meta[http-equiv="Content-Security-Policy"]').getAttribute('content');
            if (!csp.includes("connect-src 'self'")) throw Error('Missing local-only network policy');
            await page.locator('flutter-view').waitFor({timeout:60000});
            await page.waitForTimeout(3000);
            await page.screenshot({path:'design-lab-preview.png'});
            await browser.close();
            // Flutter auto-registers installed web plugins, including Google Sign-In.
            // Its static script attempt is blocked by CSP and by route.abort above.
            // No external response is allowed, and all other attempts fail the test.
            const unexpected = external.filter(u => u !== 'https://accounts.google.com/gsi/client');
            console.log(JSON.stringify({blockedAttempts:external,externalResponses,errors}));
            if (errors.length || unexpected.length || externalResponses.length) throw Error(JSON.stringify({errors,unexpected,externalResponses}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Package standalone lab
        uses: actions/upload-artifact@v4
        with:
          name: flutter-editor-design-lab
          path: |
            build/web/
            design-lab-preview.png
          if-no-files-found: error
