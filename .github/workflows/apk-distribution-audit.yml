name: Audit published Android installer

on:
  push:
    branches: ['ci/apk-distribution-audit']
    paths: ['.github/workflows/apk-distribution-audit.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/apk-distribution-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        tag:
          - life-os-android-2608-08d7ee8396e69c2b683d6cd0008051846bc82523
          - life-os-android-2612-4dfd1b6131d92cf3a9f9e34a7c43aefdfad454fa
          - life-os-android-2614-1936eb739a767123cab7fadbf568fc9f65cd3287
          - life-os-android-2616-b9218d0b93df22354025444f5bfc7768b4406a21
    steps:
      - name: Download exact public release and inspect installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        shell: bash
        run: |
          set -euo pipefail
          name=LIFE-OS-Android-arm64.apk
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          url="$(jq -er --arg name "$name" '.assets[] | select(.name==$name) | .browser_download_url' release.json)"
          expected="$(jq -er --arg name "$name" '.assets[] | select(.name==$name) | .digest' release.json)"
          size="$(jq -er --arg name "$name" '.assets[] | select(.name==$name) | .size' release.json)"
          curl --fail --location --retry 2 --max-time 90 "$url" -o "$name"
          test "$(stat -c %s "$name")" = "$size"
          echo "${expected#sha256:}  $name" | sha256sum --check
          unzip -tq "$name"
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          align="$(find "$sdk/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$aapt" dump badging "$name" | tee badging.txt
          grep -q "^package: name='com.example.counter'" badging.txt
          grep -q "^native-code:.*'arm64-v8a'" badging.txt
          "$signer" verify --verbose --print-certs "$name" | tee signature.txt
          grep -qi 'DEE60EF3E1863491DB0CB2738C1D61C0BC3EBE896ADB09EB8D1C2436367D2A3D' signature.txt
          "$align" -c 4 "$name"
          unzip -Z1 "$name" | grep -E '^lib/arm64-v8a/.*\.so$'
          echo "Public file passed integrity, package, ABI, certificate and ZIP alignment checks. Physical installation has not been tested."

  android-install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Fetch previous and new signed APKs for installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in 'previous life-os-android-2608-08d7ee8396e69c2b683d6cd0008051846bc82523' 'latest life-os-android-2616-b9218d0b93df22354025444f5bfc7768b4406a21'; do
            read -r name tag <<< "$pair"
            mkdir -p "$name"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern LIFE-OS-Android-arm64.apk --dir "$name"
            expected="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name=="LIFE-OS-Android-arm64.apk") | .digest')"
            echo "${expected#sha256:}  $name/LIFE-OS-Android-arm64.apk" | sha256sum --check
          done
      - name: Enable hardware acceleration for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Android 16 clean install and in-place update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.dalvik.vm.native.bridge
            adb shell getprop ro.build.version.sdk
            adb logcat -c
            adb install previous/LIFE-OS-Android-arm64.apk && adb install -r latest/LIFE-OS-Android-arm64.apk || { adb logcat -d -s PackageManager PackageInstaller PackageInstallerSession; exit 1; }
            adb shell pm path com.example.counter
            adb shell dumpsys package com.example.counter | grep -E 'versionCode=|versionName=|primaryCpuAbi='
