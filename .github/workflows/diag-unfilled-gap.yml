name: Temporary unfilled gap diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-unfilled-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        run: |
          test -n "$SSH_PRIVATE_KEY"
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$SSH_USER" >> "$GITHUB_ENV"
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read PocketBase request log for incident window
        run: |
          cat > /tmp/diag.py <<'PY'
          import json, sqlite3
          from pathlib import Path

          db = Path('/root/pb/pb_data/auxiliary.db')
          con = sqlite3.connect(f'file:{db}?mode=ro', uri=True)
          con.row_factory = sqlite3.Row
          rows = con.execute(
              "select id, level, message, data, created from _logs "
              "where created >= ? and created <= ? order by created",
              ('2026-08-12 21:00:00', '2026-08-12 21:15:00'),
          ).fetchall()
          print('incident rows:', len(rows))
          for row in rows:
              d = dict(row)
              raw = d.get('data')
              parsed = None
              if isinstance(raw, (str, bytes)):
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      pass
              msg = str(d.get('message', ''))
              hay = (msg + ' ' + json.dumps(parsed, ensure_ascii=False, default=str)).lower()
              if '/records' not in hay and not any(x in hay for x in ('error', 'exception', 'reference', 'hook')):
                  continue
              out = {k: d.get(k) for k in ('id', 'created', 'level', 'message')}
              def collect(obj, prefix=''):
                  if isinstance(obj, dict):
                      for k, v in obj.items():
                          lk = k.lower()
                          p = f'{prefix}.{k}' if prefix else k
                          if lk in {'method','path','status','error','message','type','collection','collectionname','url'}:
                              if isinstance(v, (str,int,float,bool)) or v is None:
                                  out[p] = v
                          if isinstance(v, (dict,list)):
                              collect(v, p)
                  elif isinstance(obj, list):
                      for i, v in enumerate(obj[:8]):
                          collect(v, f'{prefix}[{i}]')
              if parsed is not None:
                  collect(parsed)
              print(json.dumps(out, ensure_ascii=False, default=str))
          PY
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" /tmp/diag.py "$SSH_USER@$SSH_HOST:/tmp/lifeos-diag-unfilled.py"
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'python3 /tmp/lifeos-diag-unfilled.py; rm -f /tmp/lifeos-diag-unfilled.py'
