name: TEMP finalize Google Health hygiene validation

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-finalize-google-health-hygiene.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Build clean local commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/tmp-fix-google-health-hygiene.yml .github/workflows/tmp-finalize-google-health-hygiene.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('pb_hooks/google_health_sleep_runtime.js')
          s = p.read_text(encoding='utf-8')
          old = 'url: "https://health.googleapis.com/v4/' + 'users/me/dataTypes/sleep/dataPoints:reconcile?" + __healthForm(query),'
          new = 'url: "https://health.googleapis.com/v4/" + "users/me/dataTypes/sleep/dataPoints:reconcile?" + __healthForm(query),'
          if old not in s:
              raise SystemExit('target Google Health URL line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/manual/generate_app_structure_detailed.py
          git add -A
          git commit -m 'Finalize brand-neutral Google Health sleep sync'
      - name: Validate committed final tree
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict
          python scripts/audit/documentation_parity.py
          STRUCTURE_GROWTH_BASE=${{ github.event.pull_request.base.sha }} python scripts/audit/repository_hygiene.py
          python scripts/audit/pocketbase_schema_contract.py
          python scripts/audit/deployment_contract.py
          for file in pb_hooks/*.js pb_migrations/*.js; do node --check "$file"; done
          git diff --check HEAD^ HEAD
      - name: Push validated commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
