name: Format scheduled sleep sources

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/data/health/health_sleep_sync_service.dart \
            lib/features/settings/health/health_connect_settings_section.dart \
            lib/services/health_connect/health_connect_sleep_service_io.dart \
            lib/services/health_connect/health_connect_sleep_service_stub.dart

      - name: Remove temporary formatter workflow
        run: rm -f .github/workflows/format-scheduled-sleep-sources.yml

      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format scheduled sleep sync sources"
          git push origin HEAD:${{ github.head_ref }}
