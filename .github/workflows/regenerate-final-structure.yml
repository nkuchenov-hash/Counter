name: Regenerate final tracked-tree structure map

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'cleanup/stt-release-artifact-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/stt-release-artifact-20260819
          fetch-depth: 0

      - name: Regenerate from final tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/regenerate-final-structure.yml
          python scripts/manual/generate_app_structure_detailed.py
          pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict
          STRUCTURE_GROWTH_BASE="$(git merge-base HEAD origin/main)" python scripts/audit/repository_hygiene.py
          python scripts/audit/documentation_parity.py
          python scripts/audit/pocketbase_schema_contract.py
          python scripts/audit/deployment_contract.py
          git diff --check
          git add -A
          git commit -m 'Docs: regenerate final exact tracked-tree structure map'
          git push origin HEAD:cleanup/stt-release-artifact-20260819
