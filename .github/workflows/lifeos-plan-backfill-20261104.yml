name: Verify restored PocketBase SSH for LIFE OS plan backfill
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-plan-backfill-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-restored-server:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      SSH_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Read-only connection and database presence check
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "NO_SSH_KEY"; exit 1; }
          user="${SSH_USER:-root}"
          host='137.22.146.109'
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lifeos-plan-check
          chmod 600 ~/.ssh/lifeos-plan-check
          ssh-keyscan -T 8 -p "$SSH_PORT" -H "$host" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=12 -i ~/.ssh/lifeos-plan-check -p "$SSH_PORT" "$user@$host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "ssh_auth_success=true"
          echo "remote_user=$(whoami)"
          echo "pb_processes:"
          (pgrep -af '[p]ocketbase.*serve' || true) | head -8
          echo "candidate_db_files:"
          for base in /root /opt /srv /var/lib /home; do
            if test -d "$base"; then
              find "$base" -maxdepth 7 -type f -path '*/pb_data/data.db' -print 2>/dev/null || true
            fi
          done
          echo "host_probe_complete=true"
          REMOTE
