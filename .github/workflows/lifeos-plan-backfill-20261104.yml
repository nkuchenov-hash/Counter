name: One-time insert of five November 4 LIFE OS plans
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-plan-backfill-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  write-five-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      SSH_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Insert and verify five plans on recovered active database
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "NO_SSH_KEY"; exit 1; }
          user="${SSH_USER:-root}"
          host='137.22.146.109'
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lifeos-plan-check
          chmod 600 ~/.ssh/lifeos-plan-check
          ssh-keyscan -T 8 -p "$SSH_PORT" -H "$host" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=12 -i ~/.ssh/lifeos-plan-check -p "$SSH_PORT" "$user@$host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(grep -Ec 'reverse_proxy[[:space:]]+127.0.0.1:8102' /etc/caddy/Caddyfile)" -ge 1
          curl -fsS --max-time 8 -o /dev/null http://127.0.0.1:8102/api/health
          python3 - <<'PY'
          import sqlite3, uuid, secrets, string, datetime
          db_file='/opt/lifeos/recovery-candidate/pb_data/data.db'
          wall_day='2026-11-04'
          tasks=[
              ("Mission IT — Restore CRM access for Erin and Larry",
               "Restore Erin and Larry CRM access; check invitations and respond to Erin. Estimated work: 30 min."),
              ("Mission IT / GSG — Complete IHEM package",
               "Finalize GSG-branded IHEM cover letter, participant list and required NDAs for eMod. Estimated work: 60 min."),
              ("SAITECH — EPA resubmission review",
               "Rerun EPA file, review latest C&P report and rejection issues; follow up for John's price outlier list. Estimated work: 45 min."),
              ("SAITECH — DEL modification file",
               "Prepare corrected DEL mod file for Sharmina's requested products and five additional SKUs. Estimated work: 30 min."),
              ("Mary Ann — SIN 334512 EPA review",
               "Review CST rates, proposed EPA method and supporting pricing documents for SIN 334512. Estimated work: 45 min."),
          ]
          con=sqlite3.connect(db_file, timeout=25, isolation_level=None)
          con.execute('PRAGMA busy_timeout = 25000')
          try:
              con.execute('BEGIN IMMEDIATE')
              owners=con.execute('SELECT id FROM profiles').fetchall()
              if len(owners)!=1:
                  raise RuntimeError('Expected exactly one restored profile, got '+str(len(owners)))
              owner=owners[0][0]
              existing_count=con.execute('SELECT COUNT(*) FROM plans WHERE user_id=?',(owner,)).fetchone()[0]
              if existing_count<500:
                  raise RuntimeError('Unexpected active profile plan count; refusing write')
              cat=con.execute("""
                  SELECT id, name FROM categories
                  WHERE user_id=? AND lower(trim(name))='price reporter'
                    AND coalesce(is_archived,0)=0 LIMIT 1
              """,(owner,)).fetchone()
              if cat is None:
                  cat=con.execute("""
                      SELECT c.id,c.name
                      FROM plans p JOIN categories c ON c.id=p.category_id
                      WHERE p.user_id=? AND c.user_id=?
                        AND coalesce(c.is_archived,0)=0
                        AND (lower(p.title) LIKE '%mission it%'
                             OR lower(p.title) LIKE '%carroll woods%')
                      ORDER BY p.updated DESC LIMIT 1
                  """,(owner,owner)).fetchone()
              if cat is None: raise RuntimeError('No safe Price Reporter category could be resolved')
              catid, catname=cat
              print('category_resolved=true')
              current_order=con.execute('SELECT COALESCE(MAX("order"),0) FROM plans WHERE user_id=?',(owner,)).fetchone()[0]
              next_order=int(float(current_order or 0))
              created=0
              already=0
              now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S.%fZ')
              for title,notes in tasks:
                  found=con.execute("""
                      SELECT COUNT(*) FROM plans
                      WHERE user_id=? AND initial_date_key=?
                        AND lower(trim(title))=lower(trim(?))
                  """,(owner,wall_day,title)).fetchone()[0]
                  if found:
                      already+=1
                      continue
                  next_order+=1
                  row={
                      'id': ''.join(secrets.choice(string.ascii_lowercase+string.digits) for _ in range(15)),
                      'plan_id': str(uuid.uuid4()),
                      'user_id': owner, 'category_id': catid,
                      'title': title, 'is_done': 0, 'checklist': '[]',
                      'order': next_order,
                      'notes_plain': notes,
                      'initial_date_key': wall_day,
                      'is_postponed': 0,
                      'created': now, 'updated': now,
                  }
                  columns=list(row)
                  statement='INSERT INTO plans ('+','.join('"'+k+'"' for k in columns)+') VALUES ('+','.join('?' for _ in columns)+')'
                  con.execute(statement,[row[k] for k in columns])
                  created+=1
              for title,_ in tasks:
                  matching=con.execute("""
                      SELECT COUNT(*) FROM plans WHERE user_id=?
                      AND initial_date_key=?
                      AND lower(trim(title))=lower(trim(?))
                  """,(owner,wall_day,title)).fetchone()[0]
                  if matching<1:
                      raise RuntimeError('Post-insert verification failed, rolling back')
              con.execute('COMMIT')
              print('created_count='+str(created))
              print('already_present_count='+str(already))
              print('verified_titles='+str(len(tasks)))
              print('live_plan_count='+str(con.execute('SELECT COUNT(*) FROM plans').fetchone()[0]))
          except:
              if con.in_transaction: con.execute('ROLLBACK')
              raise
          finally:
              con.close()
          PY
          REMOTE
