name: Verify restored PocketBase SSH for LIFE OS plan backfill
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-plan-backfill-20261104.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-restored-server:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      SSH_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Read-only connection and database presence check
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" ]] || { echo "NO_SSH_KEY"; exit 1; }
          user="${SSH_USER:-root}"
          host='137.22.146.109'
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lifeos-plan-check
          chmod 600 ~/.ssh/lifeos-plan-check
          ssh-keyscan -T 8 -p "$SSH_PORT" -H "$host" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=12 -i ~/.ssh/lifeos-plan-check -p "$SSH_PORT" "$user@$host" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "restored-host-analysis:"
          python3 - <<'PY'
          import sqlite3, os
          for base in ('/opt/lifeos/recovery-stage','/opt/lifeos/recovery-candidate'):
              f=base+'/pb_data/data.db'
              if not os.path.isfile(f): continue
              con=sqlite3.connect('file:'+f+'?mode=ro',uri=True)
              print('instance='+base.rsplit('/',1)[-1])
              for table in ('profiles','plans','categories','records'):
                  print(table+'_count='+str(con.execute('SELECT COUNT(*) FROM "'+table+'"').fetchone()[0]))
              print('plans_columns='+','.join(x[1] for x in con.execute('PRAGMA table_info(plans)')))
              print('categories_columns='+','.join(x[1] for x in con.execute('PRAGMA table_info(categories)')))
              print('anchors='+str(con.execute("SELECT COUNT(*) FROM plans WHERE lower(title) LIKE '%mission it%' OR lower(title) LIKE '%carroll%' OR lower(title) LIKE '%3qc%'").fetchone()[0]))
              con.close()
          PY
          for f in /etc/caddy/Caddyfile /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do
            if test -f "$f"; then
              echo "proxy_config=$f"
              grep -nE '137-22-146-109|127.0.0.1:8(099|102)|proxy_pass|reverse_proxy' "$f" || true
            fi
          done
          REMOTE
