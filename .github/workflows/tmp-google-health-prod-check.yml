name: Temporary Google Health production check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-google-health-prod-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read sanitized production state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" > google-health-prod-check.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ {print $1; exit}')"
          fi
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then
            app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"
          fi
          if [[ -z "$app_dir" || ! -d "$app_dir" ]]; then
            pid="$(pgrep -f '[p]ocketbase.*serve' | head -n1 || true)"
            [[ -n "$pid" ]] && app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"
          fi
          if [[ -z "$app_dir" || ! -d "$app_dir" ]]; then
            echo 'service_found=0'; exit 0
          fi
          echo 'service_found=1'
          [[ -f "$app_dir/pb_hooks/google_health_sleep_runtime.js" ]] && echo 'health_runtime_present=1' || echo 'health_runtime_present=0'
          grep -Fq 'google_health_sleep_runtime.js' "$app_dir/pb_hooks/sleep_sync.pb.js" 2>/dev/null && echo 'routes_use_health=1' || echo 'routes_use_health=0'
          grep -Fq 'googlehealth.sleep.readonly' "$app_dir/pb_hooks/google_health_sleep_runtime.js" 2>/dev/null && echo 'health_scope_present=1' || echo 'health_scope_present=0'
          code="$(curl -sS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/sleep-sync/status || true)"
          echo "protected_route_http=$code"

          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import os,sqlite3,sys,datetime as dt
          p=sys.argv[1]
          print('db_exists='+('1' if os.path.exists(p) else '0'))
          if not os.path.exists(p): raise SystemExit
          c=sqlite3.connect(f'file:{p}?mode=ro',uri=True); c.row_factory=sqlite3.Row
          tabs={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          if 'sleep_sync_connections' not in tabs: print('connection_table=0'); raise SystemExit
          print('connection_table=1')
          rows=list(c.execute("select enabled,refresh_token_enc,last_error,last_sync_at from sleep_sync_connections where provider='google_fit'"))
          active=[r for r in rows if str(r['enabled']).lower() in ('1','true') and str(r['refresh_token_enc'] or '').strip()]
          print('active_connections='+str(len(active)))
          auth=disabled=other=none=0
          for r in active:
              e=str(r['last_error'] or '').strip().lower()
              if not e: none+=1
              elif 'authorization is required' in e or 'insufficient' in e or 'invalid_grant' in e: auth+=1
              elif 'not enabled' in e or 'service_disabled' in e or 'accessnotconfigured' in e: disabled+=1
              else: other+=1
          print('error_none='+str(none))
          print('error_auth_required='+str(auth))
          print('error_api_disabled='+str(disabled))
          print('error_other='+str(other))
          PY
          REMOTE
          cat google-health-prod-check.txt

      - name: Publish sanitized result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/health-prod-result && mkdir /tmp/health-prod-result
          cp google-health-prod-check.txt /tmp/health-prod-result/
          cd /tmp/health-prod-result
          git init -q
          git checkout -q -b diag/google-health-prod-result
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m 'Record Google Health production check'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin HEAD:refs/heads/diag/google-health-prod-result
