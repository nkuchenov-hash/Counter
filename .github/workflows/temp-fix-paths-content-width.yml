name: Temporary Paths content width fix

on:
  push:
    paths:
      - '.github/workflows/temp-fix-paths-content-width.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Match Paths content width to Lists
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/settings/categories/category_list_view.dart')
          text = path.read_text()

          anchor = '''/// Shows every existing category/project and whether it already has a Path.\nclass CategoryPathsPage extends StatefulWidget {'''
          helper = '''/// Keeps Project Paths on the same responsive content rail as Lists.\n/// Lists uses a 1440px max frame with 24px desktop / 20px compact gutters.\nclass _PathContentFrame extends StatelessWidget {\n  const _PathContentFrame({required this.child});\n\n  static const double _maxWidth = 1440;\n  final Widget child;\n\n  @override\n  Widget build(BuildContext context) {\n    final size = MediaQuery.sizeOf(context);\n    final wide = size.width >= 900;\n    final width = size.width > _maxWidth ? _maxWidth : size.width;\n    return Align(\n      alignment: Alignment.topCenter,\n      child: SizedBox(\n        width: width,\n        height: double.infinity,\n        child: Padding(\n          padding: EdgeInsets.symmetric(horizontal: wide ? 24 : 20),\n          child: child,\n        ),\n      ),\n    );\n  }\n}\n\n/// Shows every existing category/project and whether it already has a Path.\nclass CategoryPathsPage extends StatefulWidget {'''
          if anchor not in text:
              raise SystemExit('Paths class anchor not found; refusing broad edit')
          text = text.replace(anchor, helper, 1)

          old_index = '''    return Scaffold(\n      appBar: AppBar(title: Text(copy.title)),\n      body: _loading\n          ? const AppLoading()\n          : RefreshIndicator(\n              onRefresh: _load,\n              child: ListView(\n                padding: const EdgeInsets.fromLTRB(12, 12, 12, 24),\n                children: [\n                  Padding(\n                    padding: const EdgeInsets.fromLTRB(4, 0, 4, 12),\n                    child: Text(\n                      copy.subtitle,\n                      style: Theme.of(context).textTheme.bodyMedium?.copyWith(\n                        color: Theme.of(context).colorScheme.onSurfaceVariant,\n                      ),\n                    ),\n                  ),\n                  for (final pair in pairs)\n                    _buildProjectTile(context, pair.id, pair.path, copy),\n                ],\n              ),\n            ),\n    );'''
          new_index = '''    return Scaffold(\n      appBar: AppBar(title: Text(copy.title)),\n      body: _PathContentFrame(\n        child: _loading\n            ? const AppLoading()\n            : RefreshIndicator(\n                onRefresh: _load,\n                child: ListView(\n                  padding: const EdgeInsets.fromLTRB(0, 12, 0, 24),\n                  children: [\n                    Padding(\n                      padding: const EdgeInsets.fromLTRB(4, 0, 4, 12),\n                      child: Text(\n                        copy.subtitle,\n                        style: Theme.of(context).textTheme.bodyMedium?.copyWith(\n                          color: Theme.of(context).colorScheme.onSurfaceVariant,\n                        ),\n                      ),\n                    ),\n                    for (final pair in pairs)\n                      _buildProjectTile(context, pair.id, pair.path, copy),\n                  ],\n                ),\n              ),\n      ),\n    );'''
          if old_index not in text:
              raise SystemExit('Paths index body not found; refusing broad edit')
          text = text.replace(old_index, new_index, 1)

          old_detail = '''    return Scaffold(\n      appBar: AppBar(title: Text('${copy.path}: ${widget.categoryPathLabel}')),\n      body: _loading && root == null\n          ? const AppLoading()\n          : root == null\n          ? _empty(copy)\n          : _pathBody(root, copy),\n    );'''
          new_detail = '''    return Scaffold(\n      appBar: AppBar(title: Text('${copy.path}: ${widget.categoryPathLabel}')),\n      body: _PathContentFrame(\n        child: _loading && root == null\n            ? const AppLoading()\n            : root == null\n            ? _empty(copy)\n            : _pathBody(root, copy),\n      ),\n    );'''
          if old_detail not in text:
              raise SystemExit('Path detail body not found; refusing broad edit')
          text = text.replace(old_detail, new_detail, 1)

          old_padding = 'padding: const EdgeInsets.fromLTRB(16, 12, 16, 32),'
          new_padding = 'padding: const EdgeInsets.fromLTRB(0, 12, 0, 32),'
          if old_padding not in text:
              raise SystemExit('Path detail ListView padding not found; refusing broad edit')
          text = text.replace(old_padding, new_padding, 1)

          path.write_text(text)

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          entry = '''\n## [2026-08-17] - Project Paths content width parity [shipped]\n\n* **`lib/features/settings/categories/category_list_view.dart`:** Project Paths list and detail bodies now use the same centered 1440px content rail and responsive 24px desktop / 20px compact gutters as Lists; removed their extra local horizontal ListView padding so card edges align.\n'''
          if entry.strip() not in c:
              idx = c.find('\n## [')
              if idx < 0:
                  raise SystemExit('CHANGELOG dated-entry marker not found')
              c = c[:idx] + entry + c[idx:]
              changelog.write_text(c)
          PY

          dart format lib/features/settings/categories/category_list_view.dart
          git diff --check
          git diff -- lib/features/settings/categories/category_list_view.dart CHANGELOG.md

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-fix-paths-content-width.yml
          git add lib/features/settings/categories/category_list_view.dart CHANGELOG.md
          git commit -m 'Fix Project Paths content width parity'
          git push origin HEAD:main
