name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preserve Igropoisk from gh-pages
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/gh-pages
          mkdir -p /tmp/preserved
          if [ -d /tmp/gh-pages/igropoisk ]; then
            cp -R /tmp/gh-pages/igropoisk /tmp/preserved/igropoisk
          fi
          if [ -f /tmp/gh-pages/.github/workflows/igropoisk-update.yml ]; then
            mkdir -p /tmp/preserved/.github/workflows
            cp /tmp/gh-pages/.github/workflows/igropoisk-update.yml /tmp/preserved/.github/workflows/igropoisk-update.yml
          fi

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: 'Set up Flutter 3.41.6 (Dart 3.11 satisfies pubspec sdk ^3.11.0)'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Flutter doctor (CI environment diagnostics)
        run: flutter doctor -v

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none \
            --dart-define=GIT_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Restore Igropoisk into deployment
        run: |
          if [ -d /tmp/preserved/igropoisk ]; then
            cp -R /tmp/preserved/igropoisk build/web/igropoisk
          fi
          if [ -f /tmp/preserved/.github/workflows/igropoisk-update.yml ]; then
            mkdir -p build/web/.github/workflows
            cp /tmp/preserved/.github/workflows/igropoisk-update.yml build/web/.github/workflows/igropoisk-update.yml
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
