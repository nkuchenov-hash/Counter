name: Deploy LIFE OS Flutter Web to GitHub Pages

# LIFE OS deploy is independent from Igropoisk data collection.
# Igropoisk has its own gh-pages updater; this workflow preserves its last
# published directory while replacing only the LIFE OS web build.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-os-web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: 'Set up Flutter 3.41.6 (Dart 3.11 satisfies pubspec sdk ^3.11.0)'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Test critical web regressions
        run: |
          flutter test --platform chrome test/notes_mobile_keyboard_regression_test.dart
          flutter test test/category_catalog_resilience_contract_test.dart

      - name: Build Flutter web
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none \
            --dart-define=GIT_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Preserve published Igropoisk
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf /tmp/counter-gh-pages
          git worktree add --detach /tmp/counter-gh-pages refs/remotes/origin/gh-pages
          if [ -d /tmp/counter-gh-pages/igropoisk ]; then
            rm -rf build/web/igropoisk
            cp -R /tmp/counter-gh-pages/igropoisk build/web/igropoisk
          fi
          git worktree remove --force /tmp/counter-gh-pages

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
