name: Deploy LIFE OS Flutter Web to GitHub Pages

# Server-schema-before-client law: every main push first completes the PocketBase
# workflow. UI-only pushes make that workflow a validated no-op at deploy phase,
# then this workflow publishes the exact validated SHA. Keep this path runnable
# for UI hotfixes such as sleep authorization retry behavior.
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows:
      - Deploy PocketBase hooks and migrations
    types: [completed]

permissions:
  contents: write

concurrency:
  group: life-os-web-deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  one-shot-plan-time-repair:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Apply guarded Plans Time repair
        run: |
          python scripts/manual/fix_plan_time_regressions_20260824.py
          python scripts/manual/fix_plan_default_timezone_fastpath_20260824.py

      - name: Validate contracts and source
        run: |
          set -euo pipefail
          python scripts/audit/documentation_parity.py
          python scripts/audit/pocketbase_schema_contract.py
          python scripts/audit/deployment_contract.py
          node --check pb_migrations/1787580300_add_category_default_plan_timezone.js
          git diff --check
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Commit verified repair to main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md lib/features/planning/time_view/time_view_search_delegate.dart lib/data/plans/plan_projection_types.dart lib/data/categories/category_default_time.dart lib/features/planning/planning_page.dart lib/features/planning/time_view/time_view_card_layer.dart lib/l10n/langs/en.dart lib/l10n/langs/ru.dart pb_migrations/1787580300_add_category_default_plan_timezone.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Plans Time timezone, bulk drag and reprojection load'
          git pull --rebase origin main
          git push origin HEAD:main

  build-and-deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build LIFE OS web
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none \
            --dart-define=GIT_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Version Flutter web entrypoint
        shell: bash
        run: |
          set -euo pipefail
          FULL_SHA=$(git rev-parse HEAD)
          python3 - "$FULL_SHA" <<'PY'
          from pathlib import Path
          import sys

          sha = sys.argv[1]
          bootstrap = Path('build/web/flutter_bootstrap.js')
          index = Path('build/web/index.html')

          bootstrap_text = bootstrap.read_text(encoding='utf-8')
          needle = '"mainJsPath":"main.dart.js"'
          if needle not in bootstrap_text:
              raise SystemExit('Flutter bootstrap mainJsPath marker not found')
          bootstrap.write_text(
              bootstrap_text.replace(
                  needle,
                  f'"mainJsPath":"main.dart.js?v={sha}"',
                  1,
              ),
              encoding='utf-8',
          )

          index_text = index.read_text(encoding='utf-8')
          bootstrap_tag = 'src="flutter_bootstrap.js"'
          if bootstrap_tag not in index_text:
              raise SystemExit('Flutter bootstrap script marker not found')
          index.write_text(
              index_text.replace(
                  bootstrap_tag,
                  f'src="flutter_bootstrap.js?v={sha}"',
                  1,
              ),
              encoding='utf-8',
          )

          Path('build/web/lifeos-build.txt').write_text(sha + '\n', encoding='utf-8')
          PY
          grep -Fq "main.dart.js?v=$FULL_SHA" build/web/flutter_bootstrap.js
          grep -Fq "flutter_bootstrap.js?v=$FULL_SHA" build/web/index.html
          test "$(tr -d '\r\n' < build/web/lifeos-build.txt)" = "$FULL_SHA"

      - name: Preserve published Igropoisk
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf /tmp/counter-gh-pages
          git worktree add --detach /tmp/counter-gh-pages refs/remotes/origin/gh-pages
          if [ -d /tmp/counter-gh-pages/igropoisk ]; then
            rm -rf build/web/igropoisk
            cp -R /tmp/counter-gh-pages/igropoisk build/web/igropoisk
          fi
          git worktree remove --force /tmp/counter-gh-pages

      - name: Preserve workflow_run trigger on default branch
        run: |
          mkdir -p build/web/.github/workflows
          cp .github/workflows/deploy.yml build/web/.github/workflows/deploy.yml

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
