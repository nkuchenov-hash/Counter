name: Deploy Flutter Web and Igropoisk to GitHub Pages

# Counter and Igropoisk share one Pages artifact; each validation gate must use its canonical output path.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One-time remove hidden category feature remnants
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              return text.replace(old, new, 1)

          p = 'lib/app/shell/app_shell.dart'
          s = read(p)
          s = replace_once(s, "import 'package:counter/shared/categories/visibility/category_visibility_prefs.dart';\n", '', 'app_shell import')
          s = replace_once(s, "    unawaited(CategoryVisibilityPrefs.ensureLoaded());\n    CategoryVisibilityPrefs.hiddenIds.addListener(\n      categoryVisibilityShellListener,\n    );\n", '', 'app_shell init visibility listener')
          s = replace_once(s, "    CategoryVisibilityPrefs.hiddenIds.removeListener(\n      categoryVisibilityShellListener,\n    );\n", '', 'app_shell dispose visibility listener')
          write(p, s)

          p = 'lib/app/shell/shared/shell_core.dart'
          s = read(p)
          s = replace_once(s, """  void categoryVisibilityShellListener() {
            if (!mounted) return;
            final id = selectedCategoryId;
            if (id != null && CategoryVisibilityPrefs.isHiddenOrAncestor(id)) {
              int? firstVisible;
              for (final p in DatabaseService.instance.allCategoryIdPathPairs) {
                if (!CategoryVisibilityPrefs.isHiddenOrAncestor(p.id)) {
                  firstVisible = p.id;
                  break;
                }
              }
              setState(() => selectedCategoryId = firstVisible);
            }
          }

""", '', 'shell_core visibility method')
          write(p, s)

          p = 'lib/features/lists/lists_view.dart'
          s = read(p)
          s = replace_once(s, "import 'package:counter/shared/categories/visibility/category_visibility_prefs.dart';\n", '', 'lists_view import')
          s = replace_once(s, """  void _listsVisibilityListener() {
            if (!mounted) return;
            final id = _filterCategoryId;
            if (id != null && CategoryVisibilityPrefs.isHiddenOrAncestor(id)) {
              setState(() => _filterCategoryId = null);
              unawaited(_persistFilterCategoryId(null));
              unawaited(_reload());
            }
          }

""", '', 'lists visibility listener')
          s = replace_once(s, '    CategoryVisibilityPrefs.hiddenIds.addListener(_listsVisibilityListener);\n', '', 'lists init listener')
          s = replace_once(s, '    await CategoryVisibilityPrefs.ensureLoaded();\n', '', 'lists visibility load')
          s = replace_once(s, '    CategoryVisibilityPrefs.hiddenIds.removeListener(_listsVisibilityListener);\n', '', 'lists dispose listener')
          s = replace_once(s, """    final d = db.defaultCategoryId;
            if (d != null && !CategoryVisibilityPrefs.isHiddenOrAncestor(d)) {
              return d;
            }
            final pairs = CategoryVisibilityPrefs.filterPairs(
              db.allCategoryIdPathPairs,
              (p) => p.id,
            );
""", """    final d = db.defaultCategoryId;
            if (d != null && db.categoryExists(d)) {
              return d;
            }
            final pairs = db.allCategoryIdPathPairs;
""", 'lists default category')
          s = replace_once(s, """    if (fid != null &&
                db.categoryExists(fid) &&
                !CategoryVisibilityPrefs.isHiddenOrAncestor(fid)) {
              return fid;
            }
""", """    if (fid != null && db.categoryExists(fid)) {
              return fid;
            }
""", 'lists effective category')
          s = replace_once(s, """    final visible = raw
                .where((id) => !CategoryVisibilityPrefs.isHiddenOrAncestor(id))
                .toList();
            final active = _filterCategoryId;
            if (active != null && visible.contains(active)) {
              return [active, ...visible.where((x) => x != active)];
            }
            return visible;
""", """    final available = _sanitizeIntCategoryIds(raw);
            final active = _filterCategoryId;
            if (active != null && available.contains(active)) {
              return [active, ...available.where((x) => x != active)];
            }
            return available;
""", 'lists chip visibility filter')
          s = re.sub(r'^\s*if \(CategoryVisibilityPrefs\.isHiddenOrAncestor\([^\n]+\)\) continue;\n', '', s, flags=re.MULTILINE)
          s = replace_once(s, """        return ValueListenableBuilder<List<int>>(
                  valueListenable: CategoryVisibilityPrefs.hiddenIds,
                  builder: (context, _, _) {
""", """        return Builder(
                  builder: (context) {
""", 'lists build visibility listenable')
          write(p, s)

          p = 'lib/features/lists/lists_filters.dart'
          s = read(p)
          s = replace_once(s, "import 'package:counter/shared/categories/visibility/category_visibility_prefs.dart';\n", '', 'lists_filters import')
          s = re.sub(r'^\s*if \(CategoryVisibilityPrefs\.isHiddenOrAncestor\([^\n]+\)\) continue;\n', '', s, flags=re.MULTILINE)
          s = replace_once(s, """  if (CategoryVisibilityPrefs.isHiddenOrAncestor(r.id)) {
            return const SizedBox.shrink();
          }
          final rawKids = r.children ?? const <CategoryRule>[];
          final kids = rawKids
              .where((c) => !CategoryVisibilityPrefs.isHiddenOrAncestor(c.id))
              .toList();
""", """  final kids = r.children ?? const <CategoryRule>[];
""", 'manual category tree visibility filter')
          write(p, s)

          for p in ['lib/l10n/langs/en.dart', 'lib/l10n/langs/ru.dart']:
              s = read(p)
              s, n = re.subn(r"^\s*'category_visibility_toggle':.*\n", '', s, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit(f'{p}: expected one category_visibility_toggle key, found {n}')
              write(p, s)

          p = 'AGENTS.md'
          s = read(p)
          s = replace_once(s, "- `lib/shared/categories/` owns reusable category presentation, tree, picker, and local visibility prefs (`presentation/`, `tree/`, `picker/`, `visibility/`). It may import `data/models.dart` for `CategoryRule` only. It must not import `features/`, `database_service.dart`, or `app/shell/`. Brain wires `CategoryTreeSource` / `CategoryPickerActions` / `PlanCategoryLookup` from `main.dart`.\n", "- `lib/shared/categories/` owns reusable category presentation, tree, and picker (`presentation/`, `tree/`, `picker/`). It may import `data/models.dart` for `CategoryRule` only. It must not import `features/`, `database_service.dart`, or `app/shell/`. Brain wires `CategoryTreeSource` / `CategoryPickerActions` / `PlanCategoryLookup` from `main.dart`.\n", 'AGENTS categories ownership')
          write(p, s)

          forbidden = ['CategoryVisibilityPrefs', 'hidden_category_ids_json', 'category_visibility_toggle', 'shared/categories/visibility']
          production = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in Path('lib').rglob('*.dart'))
          leftovers = [needle for needle in forbidden if needle in production]
          if leftovers:
              raise SystemExit(f'Forbidden hidden-category remnants remain in lib/: {leftovers}')
          PY

          # Restore this workflow to the pre-cleanup version before committing.
          git checkout HEAD^ -- .github/workflows/deploy.yml
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove hidden categories from all runtime paths"
          git push origin HEAD:main

      - name: Setup Node for Igropoisk
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Igropoisk collector
        working-directory: igropoisk
        run: npm install --no-audit --no-fund

      - name: Build Igropoisk catalog
        run: node igropoisk/scripts/update-curated.mjs

      - name: Validate Igropoisk catalog
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('./igropoisk/data/catalog.json','utf8'));
          if (!Array.isArray(d.games) || d.games.length < 50 || d.games.length > 220) {
            throw new Error(`Invalid Igropoisk catalog size: ${d.games?.length || 0}`);
          }
          const invalid = d.games.filter(g => !g.appid || !g.title || !g.description || !g.releaseDate || !g.capsuleImage || !g.heroImage || !Array.isArray(g.screenshots) || g.screenshots.length < 2);
          if (invalid.length) throw new Error(`Incomplete games: ${invalid.slice(0,10).map(g=>g.title).join(', ')}`);
          console.log(`Igropoisk: ${d.games.length} games validated`);
          NODE

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: 'Set up Flutter 3.41.6 (Dart 3.11 satisfies pubspec sdk ^3.11.0)'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Test Notes mobile keyboard regression in Chrome
        run: flutter test --platform chrome test/notes_mobile_keyboard_regression_test.dart

      - name: Build Flutter web
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none \
            --dart-define=GIT_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Add Igropoisk to Pages build
        run: |
          rm -rf build/web/igropoisk
          cp -R igropoisk build/web/igropoisk
          rm -rf build/web/igropoisk/node_modules
          if [ -f .github/workflows/igropoisk-update.yml ]; then
            mkdir -p build/web/.github/workflows
            cp .github/workflows/igropoisk-update.yml build/web/.github/workflows/igropoisk-update.yml
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
