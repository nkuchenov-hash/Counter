name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 'Set up Flutter (pinned; pubspec.lock requires flutter >=3.38.4)'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Flutter doctor (CI environment diagnostics)
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
