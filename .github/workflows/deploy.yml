name: Deploy LIFE OS Flutter Web to GitHub Pages

# Server-schema-before-client law: every main push first completes the PocketBase
# workflow. UI-only pushes make that workflow a validated no-op at deploy phase,
# then this workflow publishes the exact validated SHA. Stale workflow_run events
# must never cancel or replace a newer main build.
on:
  workflow_run:
    workflows:
      - Deploy PocketBase hooks and migrations
    types: [completed]

permissions:
  contents: write

concurrency:
  group: life-os-web-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject stale validated revision
        id: freshness
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk '{print $1}')"
          [[ -n "$MAIN_SHA" ]]
          if [[ "$TRIGGER_SHA" == "$MAIN_SHA" ]]; then
            echo 'fresh=true' >> "$GITHUB_OUTPUT"
            echo "Publishing current main $TRIGGER_SHA"
          else
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
            echo "Skipping stale trigger $TRIGGER_SHA; current main is $MAIN_SHA"
          fi

      - name: Checkout validated main revision
        if: steps.freshness.outputs.fresh == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        if: steps.freshness.outputs.fresh == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install Flutter dependencies
        if: steps.freshness.outputs.fresh == 'true'
        run: flutter pub get

      - name: Build LIFE OS web
        if: steps.freshness.outputs.fresh == 'true'
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none \
            --dart-define=GIT_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Version Flutter web entrypoint
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FULL_SHA=$(git rev-parse HEAD)
          python3 - "$FULL_SHA" <<'PY'
          from pathlib import Path
          import sys

          sha = sys.argv[1]
          bootstrap = Path('build/web/flutter_bootstrap.js')
          index = Path('build/web/index.html')

          bootstrap_text = bootstrap.read_text(encoding='utf-8')
          needle = '"mainJsPath":"main.dart.js"'
          if needle not in bootstrap_text:
              raise SystemExit('Flutter bootstrap mainJsPath marker not found')
          bootstrap.write_text(
              bootstrap_text.replace(
                  needle,
                  f'"mainJsPath":"main.dart.js?v={sha}"',
                  1,
              ),
              encoding='utf-8',
          )

          index_text = index.read_text(encoding='utf-8')
          bootstrap_tag = 'src="flutter_bootstrap.js"'
          if bootstrap_tag not in index_text:
              raise SystemExit('Flutter bootstrap script marker not found')
          index.write_text(
              index_text.replace(
                  bootstrap_tag,
                  f'src="flutter_bootstrap.js?v={sha}"',
                  1,
              ),
              encoding='utf-8',
          )

          Path('build/web/lifeos-build.txt').write_text(sha + '\n', encoding='utf-8')
          PY
          grep -Fq "main.dart.js?v=$FULL_SHA" build/web/flutter_bootstrap.js
          grep -Fq "flutter_bootstrap.js?v=$FULL_SHA" build/web/index.html
          test "$(tr -d '\r\n' < build/web/lifeos-build.txt)" = "$FULL_SHA"

      - name: Publish LIFE OS marketing site inside Pages artifact
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f marketing/index.html
          test -f browser_extension/manifest.json
          rm -rf build/web/lifeos
          mkdir -p build/web/lifeos
          cp -R marketing/. build/web/lifeos/
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          import json
          import re
          import shutil

          source = Path('browser_extension')
          manifest = json.loads((source / 'manifest.json').read_text(encoding='utf-8'))
          version = str(manifest['version']).strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Invalid browser extension version: {version!r}')

          downloads = Path('build/web/lifeos/downloads')
          downloads.mkdir(parents=True, exist_ok=True)
          package = downloads / f'life-os-browser-extension-v{version}.zip'
          with ZipFile(package, 'w', compression=ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(source).as_posix())
              archive.writestr(
                  'INSTALL.txt',
                  'LIFE OS Browser Extension v' + version + '\n\n'
                  '1. Extract this ZIP to a permanent folder.\n'
                  '2. Open chrome://extensions/, edge://extensions/, or browser://extensions/.\n'
                  '3. Enable Developer mode.\n'
                  '4. Choose Load unpacked.\n'
                  '5. Select the extracted folder containing manifest.json.\n\n'
                  'Shortcut: Alt+Shift+L\n',
              )

          shutil.copyfile(package, downloads / 'life-os-browser-extension-latest.zip')

          index = Path('build/web/lifeos/index.html')
          text = index.read_text(encoding='utf-8')
          text, count = re.subn(
              r'life-os-browser-extension-v\d+\.\d+\.\d+\.zip',
              package.name,
              text,
          )
          if count == 0:
              raise SystemExit('Browser extension download link marker not found')
          index.write_text(text, encoding='utf-8')
          print(f'Packaged {package}')
          PY
          EXT_VERSION="$(python3 -c "import json; print(json.load(open('browser_extension/manifest.json', encoding='utf-8'))['version'])")"
          test -f build/web/lifeos/index.html
          test -f "build/web/lifeos/downloads/life-os-browser-extension-v${EXT_VERSION}.zip"
          test -f build/web/lifeos/downloads/life-os-browser-extension-latest.zip
          grep -Fq "life-os-browser-extension-v${EXT_VERSION}.zip" build/web/lifeos/index.html

      - name: Preserve published content and default-branch workflows
        if: steps.freshness.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          rm -rf /tmp/counter-gh-pages
          git worktree add --detach /tmp/counter-gh-pages refs/remotes/origin/gh-pages

          if [ -d /tmp/counter-gh-pages/igropoisk ]; then
            rm -rf build/web/igropoisk
            cp -R /tmp/counter-gh-pages/igropoisk build/web/igropoisk
          fi

          if [ -d /tmp/counter-gh-pages/.github/workflows ]; then
            mkdir -p build/web/.github
            cp -R /tmp/counter-gh-pages/.github/workflows build/web/.github/workflows
          fi

          # Never resurrect temporary Plans Time recovery workflows during publish.
          rm -f \
            build/web/.github/workflows/one-shot-plan-time-fix-bootstrap.yml \
            build/web/.github/workflows/one-shot-plan-time-fix-fast.yml \
            build/web/.github/workflows/one-shot-plan-time-fix.yml \
            build/web/.github/workflows/trigger-plans-time-finalizer.yml

          # These two files are the canonical production deployment chain and must
          # survive every gh-pages replacement because gh-pages is the repo default branch.
          mkdir -p build/web/.github/workflows
          cp .github/workflows/deploy.yml build/web/.github/workflows/deploy.yml
          cp .github/workflows/deploy-pocketbase.yml build/web/.github/workflows/deploy-pocketbase.yml

          git worktree remove --force /tmp/counter-gh-pages

      - name: Deploy to gh-pages
        if: steps.freshness.outputs.fresh == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
