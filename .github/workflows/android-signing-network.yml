name: Diagnose LIFE OS release-signing SSH access
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-signing-network.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Check configured SSH endpoint and alternate common SSH ports
        shell: bash
        run: |
          set -euo pipefail
          host="${SSH_HOST:-217.114.0.201}"
          ports=("$SSH_PORT" 2222 2022 2200 22022 22222 443)
          printf 'Running safe SSH banner checks on configured release-signing host.\n'
          pids=()
          for port in "${ports[@]}"; do
            (
              if ssh-keyscan -T 4 -p "$port" "$host" > "/tmp/lifeos-ssh-probe-$port" 2>/dev/null &&
                test -s "/tmp/lifeos-ssh-probe-$port"; then
                echo "SSH AVAILABLE on port $port"
              else
                echo "No SSH banner on port $port"
              fi
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          printf 'Probe finished without using private keys.\n'
