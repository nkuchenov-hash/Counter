name: Temporary Planning Time precision repair

on:
  push:
    branches:
      - fix/planning-time-precision-controls-20260910

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Planning Time precision and controls'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-time-precision-controls-20260910
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Apply and validate requested Planning Time repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp_planning_time_precision_fix.py

          # Flutter 3.41 WidgetTester has no moveMouseTo shortcut; use a real mouse TestGesture.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/time_view_interaction_block_test.dart')
          s = p.read_text(encoding='utf-8')
          material_import = "import 'package:flutter/material.dart';"
          if "package:flutter/gestures.dart" not in s:
              s = s.replace(
                  material_import,
                  "import 'package:flutter/gestures.dart';\n" + material_import,
                  1,
              )
          old = """      await tester.moveMouseTo(tester.getCenter(play));
      await tester.pump();"""
          new = """      final mouse = await tester.createGesture(kind: PointerDeviceKind.mouse);
      await mouse.addPointer(location: Offset.zero);
      await mouse.moveTo(tester.getCenter(play));
      await tester.pump();"""
          if old not in s:
              raise SystemExit('mouse hover test patch target not found')
          s = s.replace(old, new, 1)
          old = """      expect(playCount, 1);
      expect(moveStarts, 0);"""
          new = """      expect(playCount, 1);
      expect(moveStarts, 0);
      await mouse.removePointer();"""
          if old not in s:
              raise SystemExit('mouse cleanup test patch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          dart format \
            lib/core/widgets/plan_time_task_card/plan_card_density.dart \
            lib/core/widgets/plan_time_task_card/plan_card_geometry.dart \
            lib/core/widgets/plan_time_task_card/plan_card_progress.dart \
            lib/core/widgets/plan_time_task_card/plan_time_task_card.dart \
            lib/features/planning/time_view/time_view_card_layer.dart \
            test/plan_time_view_wall_alignment_regression_test.dart \
            test/time_view_interaction_block_test.dart

          git rm .github/workflows/tmp-planning-time-precision-fix.yml tools/tmp_planning_time_precision_fix.py

          python3 - <<'PY'
          import subprocess
          allowed = {
              'CHANGELOG.md',
              'docs/UX_CONTRACT.md',
              'lib/core/widgets/plan_time_task_card/plan_card_density.dart',
              'lib/core/widgets/plan_time_task_card/plan_card_geometry.dart',
              'lib/core/widgets/plan_time_task_card/plan_card_progress.dart',
              'lib/core/widgets/plan_time_task_card/plan_time_task_card.dart',
              'lib/features/planning/time_view/time_view_card_layer.dart',
              'test/plan_time_view_wall_alignment_regression_test.dart',
              'test/time_view_interaction_block_test.dart',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected out-of-scope changes: {unexpected}')
          if 'lib/features/planning/plan_time_view_layout.dart' in changed:
              raise SystemExit('Time View layout algorithm changed unexpectedly')
          print('SCOPE_GUARD_OK:', ', '.join(sorted(changed)))
          PY

          mkdir -p lib/core/env
          if [ ! -f lib/core/env/env.dart ]; then
            printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
          fi
          flutter pub get
          flutter test \
            test/plan_time_view_wall_alignment_regression_test.dart \
            test/time_view_interaction_block_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run
          python scripts/audit/documentation_parity.py
          python scripts/audit/pocketbase_schema_contract.py
          python scripts/audit/deployment_contract.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Planning Time precision and controls"
          git push origin HEAD:fix/planning-time-precision-controls-20260910
