name: Trigger Plans Time finalizer

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == '[SYSTEM] Run Plans Time P0 finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch finalizer on default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run one-shot-plan-time-fix-fast.yml --repo "${{ github.repository }}" --ref gh-pages
