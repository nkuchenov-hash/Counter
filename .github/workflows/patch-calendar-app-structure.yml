name: Patch Calendar Structure Map

on:
  push:
    branches:
      - feature/calendar-integrations-v1
    paths:
      - '.github/workflows/patch-calendar-app-structure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/calendar-integrations-v1
      - name: Add exact structure entries
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/APP_STRUCTURE.md')
          text = path.read_text(encoding='utf-8')
          data_anchor = '| `auth_bridge.dart` | Session check, OAuth routing |'
          data_row = '| `calendar_integrations/calendar_integration_service.dart` | Provider-neutral authenticated client for Microsoft/Google calendar connection status, settings, sync, and disconnect |'
          ui_anchor = '| `profile/settings/account_settings_section.dart` | Signed-in identity + logout row |'
          ui_row = '| `profile/calendar_integrations/calendar_integrations_section.dart` | In-app Microsoft/Google calendar connection, calendar selection, sync, and per-calendar fallback-category settings |'
          if data_row not in text:
              if data_anchor not in text:
                  raise SystemExit('data anchor missing')
              text = text.replace(data_anchor, data_anchor + '\n' + data_row, 1)
          if ui_row not in text:
              if ui_anchor not in text:
                  raise SystemExit('UI anchor missing')
              text = text.replace(ui_anchor, ui_anchor + '\n' + ui_row, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit structure map
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/APP_STRUCTURE.md
          git commit -m "Document calendar integration files"
          git push origin HEAD:feature/calendar-integrations-v1
