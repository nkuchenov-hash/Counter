name: Temporary desktop gutter hygiene fix

on:
  push:
    branches:
      - fix/unify-desktop-content-gutters-20260904

permissions:
  contents: write

jobs:
  compact-planning-file:
    if: github.event.head_commit.message == 'Run desktop gutter hygiene fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-desktop-content-gutters-20260904
          fetch-depth: 0

      - name: Remove obsolete orphaned Planning comments
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/features/planning/planning_page.dart')
          s = p.read_text()
          comments = [
              '  /// Hour-grid day timeline scroll (edge auto-scroll while dragging a plan).\n\n',
              '  /// Duration-true timeline scale for the active Time-mode canvas build.\n\n',
              '  /// Local preview height while dragging (intrinsic card height).\n\n',
              '  /// Active vertical timeline drag (Time mode); local preview only until drop.\n\n',
              '  /// Midpoint insert-before/after target while dragging over another card.\n\n',
              '  /// Finger delta (never overwritten by preview snap); used for hit-test on release.\n\n',
              '  /// Canvas-local Y of finger within dragged card at pointer-down (inset + local dy).\n\n',
              '  /// Monotonic id per vertical drag gesture (stamped on target-card intents).\n\n',
              '  /// Top/bottom edge resize (Time mode); local preview until release.\n\n',
              '  /// Pixels per second while the drag pointer sits in the top/bottom 10% bands.\n\n',
          ]
          removed = 0
          for item in comments:
              if item in s:
                  s = s.replace(item, '', 1)
                  removed += 1
          if removed != len(comments):
              raise SystemExit(f'Expected {len(comments)} orphan comments, removed {removed}')
          p.write_text(s)
          lines = s.count('\n') + 1
          print(f'planning_page.dart lines after cleanup: {lines}')
          if lines > 1893:
              raise SystemExit(f'Planning page still grew: {lines} > 1893')
          PY

      - name: Remove temporary workflow
        run: git rm -f .github/workflows/tmp-unify-desktop-gutters-v8.yml

      - name: Validate repository hygiene
        env:
          STRUCTURE_GROWTH_BASE: origin/main
        run: python scripts/audit/repository_hygiene.py

      - name: Validate whitespace
        run: git diff --check

      - name: Commit hygiene fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Planning within repository size guard'
          git push origin HEAD:fix/unify-desktop-content-gutters-20260904
