name: One-time sleep connection state fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-sleep-connection-state.yml'

permissions:
  contents: write

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stop legacy Google Health errors from invalidating Google Fit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('pb_hooks/google_fit_sleep_runtime.js')
          text = path.read_text()
          old = '''    return raw.indexOf("account_not_linked") >= 0 ||\n        raw.indexOf("google health authorization is required") >= 0 ||\n        raw.indexOf("google health sleep request") >= 0 ||\n        raw.indexOf("invalid_grant") >= 0;'''
          new = '''    // Google Health is no longer part of this adapter. Historical Google\n    // Health read errors must never invalidate an existing Google Fit token.\n    return raw.indexOf("account_not_linked") >= 0 ||\n        raw.indexOf("invalid_grant") >= 0;'''
          if old not in text:
              raise SystemExit('expected reconnect block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check pb_hooks/google_fit_sleep_runtime.js
          git diff --check

      - name: Deploy corrected runtime directly to PocketBase
        shell: bash
        run: |
          set -euo pipefail
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" pb_hooks/google_fit_sleep_runtime.js \
            "$SSH_USER@$SSH_HOST:/tmp/google_fit_sleep_runtime.js"
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ {print $1; exit}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | head -n 1 || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          if [[ -z "$service_name" || -z "$app_dir" || ! -d "$app_dir" ]]; then
            echo 'Could not discover PocketBase service/app directory' >&2
            exit 1
          fi
          $SUDO install -m 644 /tmp/google_fit_sleep_runtime.js "$app_dir/pb_hooks/google_fit_sleep_runtime.js"
          rm -f /tmp/google_fit_sleep_runtime.js
          $SUDO systemctl restart "$service_name"
          for attempt in {1..20}; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/sleep-sync/status || true)"
            if [[ "$code" == "401" || "$code" == "403" ]]; then
              echo 'Corrected sleep runtime is live.'
              exit 0
            fi
            sleep 2
          done
          echo 'Sleep runtime did not become healthy after restart' >&2
          exit 1
          REMOTE

      - name: Commit permanent fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pb_hooks/google_fit_sleep_runtime.js
          git rm .github/workflows/tmp-fix-sleep-connection-state.yml
          git commit -m 'Do not let legacy Google Health errors disable Google Fit sleep sync'
          git push origin HEAD:main
