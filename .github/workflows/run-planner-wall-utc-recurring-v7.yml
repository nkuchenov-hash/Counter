name: Run planner wall UTC recurrence fix

on:
  push:
    branches: [fix/planner-wall-utc-recurring-v7]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-wall-utc-recurring-v7
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python .github/scripts/patch_planner_wall_utc_recurring_v7.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format touched Dart files
        run: dart format lib/data/models/planning.dart lib/data/plans/plan_time_cascade_helpers.dart lib/data/plans/plan_recurrence_helpers.dart lib/features/planning/time_view/planning_time_view.dart lib/features/planning/time_view/time_view_card_layer.dart test/plan_wall_utc_mutation_test.dart
      - name: Run focused planner regression tests
        run: |
          flutter test test/plan_wall_utc_mutation_test.dart
          flutter test test/auto_plan_nearest_free_slot_test.dart
          flutter test test/time_view_recurring_interaction_controller_test.dart
      - name: Analyze touched planner sources
        run: flutter analyze --no-fatal-warnings lib/data/models/planning.dart lib/data/plans/plan_time_cascade_helpers.dart lib/data/plans/plan_recurrence_helpers.dart lib/features/planning/time_view/planning_time_view.dart lib/features/planning/time_view/time_view_card_layer.dart
      - name: Commit verified fix
        run: |
          rm -f .github/workflows/run-planner-wall-utc-recurring-v7.yml
          rm -f .github/scripts/patch_planner_wall_utc_recurring_v7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix planner stale UTC and recurring drag persistence"
          git push origin HEAD:fix/planner-wall-utc-recurring-v7
