name: Temp Stats PlanFact Zoom

on:
  push:
    branches:
      - feat/stats-planfact-zoom-20260810

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply zoom patch
        run: python3 tool/patch_stats_zoom.py

      - name: Apply Plan Fact cleanup
        run: python3 tool/fix_stats_planfact_lints.py

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          echo "abstract final class Env { static const String placeholder = ''; }" > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format Stats files
        run: dart format lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_v2_tab.dart

      - name: Persist changes
        run: |
          if ! git diff --quiet -- lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_v2_tab.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_v2_tab.dart
            git commit -m "Polish Stats Plan Fact and zoom"
            git push
          fi

      - name: Analyze Stats files
        run: flutter analyze lib/features/stats/day_stats_dashboard.dart lib/features/stats/stats_view.dart lib/features/stats/plan_vs_fact_v2_tab.dart

      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
