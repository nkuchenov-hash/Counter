name: Temporary system plan idempotency v7

on:
  push:
    branches:
      - fix/system-plan-idempotency-v7
    paths:
      - '.github/scripts/temp_system_plan_idempotency_v7.py'
      - '.github/workflows/temp-system-plan-idempotency-v7.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-plan-idempotency-v7
          fetch-depth: 0

      - name: Apply idempotency patch
        run: python3 .github/scripts/temp_system_plan_idempotency_v7.py

      - name: Diff sanity
        run: git diff --check

      - name: Architecture guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - run: flutter pub get
      - run: flutter test test/daily_routine_contract_test.dart
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/shell/app_shell.dart lib/app/shell/shared/shell_daily_routine.dart lib/app/shell/shared/shell_path_governance.dart test/daily_routine_contract_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Make generated planner tasks idempotent'
            git pull --rebase origin fix/system-plan-idempotency-v7
            git push origin HEAD:fix/system-plan-idempotency-v7
          fi
