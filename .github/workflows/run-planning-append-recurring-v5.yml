name: Run planner append and recurring drop fix

on:
  push:
    branches:
      - fix/planning-append-recurring-drop-v5

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-append-recurring-drop-v5
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python .github/scripts/patch_planning_append_recurring_v5.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib/data/plans/plan_time_cascade_helpers.dart lib/features/planning/time_view/time_view_card_layer.dart test/auto_plan_nearest_free_slot_test.dart test/time_view_recurring_interaction_controller_test.dart
      - name: Test
        run: |
          flutter test test/auto_plan_nearest_free_slot_test.dart
          flutter test test/time_view_recurring_interaction_controller_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/data/plans/plan_time_cascade_helpers.dart lib/features/planning/time_view/time_view_card_layer.dart test/auto_plan_nearest_free_slot_test.dart test/time_view_recurring_interaction_controller_test.dart
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix append-only plan creation and recurring target drops"
          git push origin HEAD:fix/planning-append-recurring-drop-v5
