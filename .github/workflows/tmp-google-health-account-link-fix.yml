name: TEMP patch Google Health account link

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-google-health-account-link-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch account setup flow and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path

          runtime = Path('pb_hooks/google_health_sleep_runtime.js')
          s = runtime.read_text(encoding='utf-8')
          marker = '''function __healthNeedsReconnect(errorText) {\n    var raw = String(errorText || "").toLowerCase();\n    return raw.indexOf("invalid_grant") >= 0 ||\n        raw.indexOf("insufficient authentication scopes") >= 0 ||\n        raw.indexOf("insufficient permission") >= 0 ||\n        raw.indexOf("disallowed oauth scope") >= 0 ||\n        raw.indexOf("disallowed_oauth_scopes") >= 0 ||\n        raw.indexOf("authorization_required") >= 0;\n}\n'''
          replacement = marker + '''\nfunction __healthNeedsAccountSetup(errorText) {\n    var raw = String(errorText || "").toLowerCase();\n    return raw.indexOf("account_not_linked") >= 0 ||\n        raw.indexOf("account is not linked to google health") >= 0;\n}\n'''
          if marker not in s: raise SystemExit('reconnect helper marker not found')
          s = s.replace(marker, replacement, 1)
          old = '''    var reconnect = __healthNeedsReconnect(error);\n    var configured = hasRefresh && !reconnect;'''
          new = '''    var reconnect = __healthNeedsReconnect(error);\n    var accountSetup = __healthNeedsAccountSetup(error);\n    var configured = hasRefresh && !reconnect;'''
          if old not in s: raise SystemExit('status setup marker not found')
          s = s.replace(old, new, 1)
          old = '''        last_error: reconnect ? "Google Health authorization is required" : (error || null)'''
          new = '''        last_error: accountSetup ? "google_health_account_not_linked" : (reconnect ? "Google Health authorization is required" : (error || null))'''
          if old not in s: raise SystemExit('status error marker not found')
          s = s.replace(old, new, 1)
          s = s.replace('dataSourceFamily: "users/me/dataSourceFamilies/all-sources",', 'dataSourceFamily: "users/me/dataSourceFamilies/google-sources",', 1)
          old = '''    } catch (err) {\n        connection.set("status", "error");\n        connection.set("last_error", String(err));\n        e.app.save(connection);\n        return e.html(500, "<h1>Google Health connection failed</h1><p>Return to LIFE OS and try again.</p>");\n    }'''
          new = '''    } catch (err) {\n        connection.set("status", "error");\n        connection.set("last_error", String(err));\n        e.app.save(connection);\n        if (__healthNeedsAccountSetup(String(err))) {\n            var setupUrl = "https://fitbit.google.com/auth/signup";\n            var returnUrl = __healthReturnUrl();\n            return e.html(200,\n                "<!doctype html><meta charset='utf-8'><title>LIFE OS — Google Health setup</title>" +\n                "<main style='font-family:system-ui,sans-serif;max-width:680px;margin:64px auto;padding:24px'>" +\n                "<h1>Google Health setup required</h1>" +\n                "<p>Your Google authorization succeeded. Google requires a one-time Google Health profile setup before LIFE OS can read Health Connect sleep.</p>" +\n                "<p><a href='" + setupUrl + "' target='_blank' rel='noopener'>Open Google Health setup</a></p>" +\n                "<p>Complete setup in the new tab, then return to LIFE OS. The server will retry synchronization automatically.</p>" +\n                "<p><a href='" + returnUrl + "'>Back to LIFE OS</a></p></main>"\n            );\n        }\n        return e.html(500, "<h1>Google Health connection failed</h1><p>Return to LIFE OS and try again.</p>");\n    }'''
          if old not in s: raise SystemExit('callback catch marker not found')
          s = s.replace(old, new, 1)
          runtime.write_text(s, encoding='utf-8')

          service = Path('lib/data/health/cloud_sleep_sync_service.dart')
          s = service.read_text(encoding='utf-8')
          anchor = '''  bool _loading = false;\n  DateTime? _lastRecordsRefreshSyncUtc;\n'''
          repl = '''  static const String _googleHealthAccountSetupError =\n      'google_health_account_not_linked';\n\n  bool _loading = false;\n  DateTime? _lastRecordsRefreshSyncUtc;\n'''
          if anchor not in s: raise SystemExit('service field marker not found')
          s = s.replace(anchor, repl, 1)
          anchor = '''  Future<bool> setEnabled(bool enabled) async {\n    return _updateSettings(<String, dynamic>{'enabled': enabled});\n  }\n'''
          repl = '''  bool get requiresGoogleHealthAccountSetup {\n    final raw = state.value.error?.toLowerCase() ?? '';\n    return raw.contains(_googleHealthAccountSetupError) ||\n        raw.contains('account_not_linked') ||\n        raw.contains('account is not linked to google health');\n  }\n\n  Future<bool> openGoogleHealthAccountSetup() async {\n    final uri = Uri.parse('https://fitbit.google.com/auth/signup');\n    try {\n      final launched = await launchUrl(\n        uri,\n        mode: kIsWeb ? LaunchMode.platformDefault : LaunchMode.externalApplication,\n        webOnlyWindowName: kIsWeb ? '_blank' : null,\n      );\n      if (!launched) return false;\n      unawaited(_pollGoogleHealthAccountSetup());\n      return true;\n    } catch (error) {\n      state.value = state.value.copyWith(\n        phase: CloudSleepSyncPhase.error,\n        error: '$error',\n      );\n      return false;\n    }\n  }\n\n  Future<void> _pollGoogleHealthAccountSetup() async {\n    for (var attempt = 0; attempt < 30; attempt++) {\n      await Future<void>.delayed(const Duration(seconds: 10));\n      if (!state.value.configured) return;\n      final ok = await syncNow();\n      if (ok) return;\n    }\n  }\n\n  Future<bool> setEnabled(bool enabled) async {\n    return _updateSettings(<String, dynamic>{'enabled': enabled});\n  }\n'''
          if anchor not in s: raise SystemExit('service method marker not found')
          s = s.replace(anchor, repl, 1)
          service.write_text(s, encoding='utf-8')

          ui = Path('lib/features/settings/health/health_connect_settings_section.dart')
          s = ui.read_text(encoding='utf-8')
          anchor = '''  Widget _webStatus(String locale, ThemeData theme) {\n    return ValueListenableBuilder<CloudSleepSyncState>(\n'''
          repl = '''  bool _requiresGoogleHealthSetup(CloudSleepSyncState state) {\n    final raw = state.error?.toLowerCase() ?? '';\n    return raw.contains('google_health_account_not_linked') ||\n        raw.contains('account_not_linked') ||\n        raw.contains('account is not linked to google health');\n  }\n\n  Widget _webStatus(String locale, ThemeData theme) {\n    return ValueListenableBuilder<CloudSleepSyncState>(\n'''
          if anchor not in s: raise SystemExit('ui helper marker not found')
          s = s.replace(anchor, repl, 1)
          old = '''        final configured = state.configured;\n        final syncing = state.phase == CloudSleepSyncPhase.syncing;\n        final connecting = state.phase == CloudSleepSyncPhase.connecting;\n        final status = configured\n            ? (syncing'''
          new = '''        final configured = state.configured;\n        final syncing = state.phase == CloudSleepSyncPhase.syncing;\n        final connecting = state.phase == CloudSleepSyncPhase.connecting;\n        final setupRequired = _requiresGoogleHealthSetup(state);\n        final status = setupRequired\n            ? _copy(\n                locale,\n                'Google requires a one-time Google Health profile setup before LIFE OS can read Health Connect sleep. Open setup once; LIFE OS will retry automatically.',\n                'Google требует один раз настроить профиль Google Health, прежде чем LIFE OS сможет читать сон из Health Connect. Откройте настройку один раз — LIFE OS будет повторять синхронизацию автоматически.',\n              )\n            : configured\n            ? (syncing'''
          if old not in s: raise SystemExit('ui status marker not found')
          s = s.replace(old, new, 1)
          old = '''            OutlinedButton.icon(\n              onPressed: syncing\n                  ? null\n                  : () => unawaited(_connectOrSyncWebCloud()),\n              icon: Icon(configured ? Icons.sync : Icons.cloud_outlined),\n              label: Text(\n                configured\n                    ? _copy(locale, 'Synchronize now', 'Синхронизировать сейчас')'''
          new = '''            OutlinedButton.icon(\n              onPressed: syncing\n                  ? null\n                  : () => unawaited(\n                      setupRequired\n                          ? CloudSleepSyncService.instance.openGoogleHealthAccountSetup()\n                          : _connectOrSyncWebCloud(),\n                    ),\n              icon: Icon(\n                setupRequired\n                    ? Icons.open_in_new\n                    : (configured ? Icons.sync : Icons.cloud_outlined),\n              ),\n              label: Text(\n                setupRequired\n                    ? _copy(\n                        locale,\n                        'Set up Google Health',\n                        'Настроить Google Health',\n                      )\n                    : configured\n                    ? _copy(locale, 'Synchronize now', 'Синхронизировать сейчас')'''
          if old not in s: raise SystemExit('ui button marker not found')
          s = s.replace(old, new, 1)
          ui.write_text(s, encoding='utf-8')
          PY
          dart format lib/data/health/cloud_sleep_sync_service.dart lib/features/settings/health/health_connect_settings_section.dart
          node --check pb_hooks/google_health_sleep_runtime.js
          git rm .github/workflows/tmp-google-health-account-link-fix.yml
          git add pb_hooks/google_health_sleep_runtime.js lib/data/health/cloud_sleep_sync_service.dart lib/features/settings/health/health_connect_settings_section.dart
          git commit -m 'Handle Google Health account setup before sleep sync'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
