name: One-time sleep metrics wiring

on:
  push:
    paths:
      - '.github/workflows/tmp-sleep-metrics-wire.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire metric payload into sleep record metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/data/health/health_sleep_sync_service.dart')
          text = path.read_text(encoding='utf-8')
          old = """      stages: session.stages.map((stage) => stage.toJson()).toList(growable: false),\n      recoveredFromSegments: session.recoveredFromStages,\n"""
          new = """      stages: session.stages.map((stage) => stage.toJson()).toList(growable: false),\n      metrics: session.metrics.map((metric) => metric.toJson()).toList(growable: false),\n      recoveredFromSegments: session.recoveredFromStages,\n"""
          if old not in text:
              raise SystemExit('sleep metadata call marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and publish
        run: |
          rm .github/workflows/tmp-sleep-metrics-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/health/health_sleep_sync_service.dart .github/workflows/tmp-sleep-metrics-wire.yml
          git diff --cached --check
          git commit -m "Wire sleep vital samples to PocketBase"
          git pull --rebase origin main
          git push origin HEAD:main
