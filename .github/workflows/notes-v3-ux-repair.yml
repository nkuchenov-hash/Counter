name: Notes V3 UX Repair Verify

on:
  push:
    branches:
      - feature/notes-v3-design-system
    paths:
      - .github/notes-v3-ux-verify.trigger

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format repaired files
        run: |
          dart format \
            lib/features/notes/widgets/notes_library_body.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_editor_screen.dart

      - name: Analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Exactly three focused Notes tests
        run: |
          TEST_COUNT=$(grep -E "^[[:space:]]*test(Widgets)?\(" test/notes_canonical_components_test.dart | wc -l)
          test "$TEST_COUNT" -eq 3
          flutter test test/notes_canonical_components_test.dart

      - name: Production web build
        run: flutter build web --release --base-href="/Counter/notes-v3-preview/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Universal Android release build
        run: flutter build apk --release --no-tree-shake-icons

      - name: Commit formatter output if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/notes/widgets/notes_library_body.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_editor_screen.dart
          git commit -m "Format Notes workspace repair"
          git push origin HEAD:feature/notes-v3-design-system

      - name: Package artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Counter-Notes-v3-workspace-repair.apk
          (cd build/web && zip -qr ../../Counter-Notes-v3-workspace-web.zip .)
          sha256sum Counter-Notes-v3-workspace-repair.apk > Counter-Notes-v3-workspace-repair.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: notes-v3-workspace-repair
          path: |
            Counter-Notes-v3-workspace-repair.apk
            Counter-Notes-v3-workspace-repair.sha256
            Counter-Notes-v3-workspace-web.zip
          if-no-files-found: error
