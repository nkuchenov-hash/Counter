name: Notes V3 UX Repair

on:
  push:
    branches:
      - feature/notes-v3-design-system

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[notes-ux-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply adaptive workspace and performance repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          ROOT = Path('.')

          def write_b64(path, payload):
              Path(path).write_bytes(base64.b64decode(payload))

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          write_b64(
              'lib/features/notes/widgets/notes_editor_screen.dart',
              '',
          )
          write_b64(
              'lib/features/notes/widgets/notes_library_production_shell.dart',
              '',
          )

          # NoteEditorPage: allow an embedded desktop detail pane.
          replace_once(
              'lib/features/notes/note_editor_page.dart',
              '''  const NoteEditorPage({
              super.key,
              required this.task,
              this.onClosed,
              this.parityPreview = false,
            });

            final PlanningTask task;
            final VoidCallback? onClosed;
            final bool parityPreview;
          ''',
              '''  const NoteEditorPage({
              super.key,
              required this.task,
              this.onClosed,
              this.onCloseRequested,
              this.parityPreview = false,
              this.embedded = false,
            });

            final PlanningTask task;
            final VoidCallback? onClosed;
            final VoidCallback? onCloseRequested;
            final bool parityPreview;
            final bool embedded;
          ''',
          )
          replace_once(
              'lib/features/notes/note_editor_page.dart',
              '''  void _close() {
              if (_dirty && !widget.parityPreview) {
                _gate.flush(_syncToBrain, force: true);
              }
              Navigator.of(context).pop();
            }
          ''',
              '''  void _close() {
              if (_dirty && !widget.parityPreview) {
                _gate.flush(_syncToBrain, force: true);
              }
              if (widget.embedded) {
                widget.onCloseRequested?.call();
                return;
              }
              Navigator.of(context).pop();
            }
          ''',
          )
          replace_once(
              'lib/features/notes/note_editor_page.dart',
              '''    await DatabaseService.instance.deleteNote(_task.planRowIdForBackend);
              if (mounted) Navigator.of(context).pop();
          ''',
              '''    await DatabaseService.instance.deleteNote(_task.planRowIdForBackend);
              if (!mounted) return;
              if (widget.embedded) {
                widget.onCloseRequested?.call();
              } else {
                Navigator.of(context).pop();
              }
          ''',
          )
          replace_once(
              'lib/features/notes/note_editor_page.dart',
              '''    return NotesEditorScreen(
              titleController: _titleController,
          ''',
              '''    return NotesEditorScreen(
              embedded: widget.embedded,
              titleController: _titleController,
          ''',
          )

          # Lists production route: desktop/web select a detail pane; mobile pushes route.
          replace_once(
              'lib/features/lists/lists_view.dart',
              '''  NotesLibraryView _notesView = NotesLibraryView.grid;
            bool _notesCheckboxesOn = false;
          ''',
              '''  NotesLibraryView _notesView = NotesLibraryView.grid;
            bool _notesCheckboxesOn = false;
            PlanningTask? _selectedNote;
          ''',
          )
          replace_once(
              'lib/features/lists/lists_view.dart',
              '''  void _openNoteEditor(PlanningTask task) {
              unawaited(
                showNoteEditorPage(
                  context: context,
                  task: task,
                  onClosed: _applyBacklogFromBrainSnapshot,
                ),
              );
            }
          ''',
              '''  void _openNoteEditor(PlanningTask task) {
              if (MediaQuery.sizeOf(context).width >= 900) {
                setState(() => _selectedNote = task);
                return;
              }
              unawaited(
                showNoteEditorPage(
                  context: context,
                  task: task,
                  onClosed: _applyBacklogFromBrainSnapshot,
                ),
              );
            }
          ''',
          )
          replace_once(
              'lib/features/lists/lists_view.dart',
              '''              body: NotesLibraryProductionShell(
                          topBar: _listsSelectMode
          ''',
              '''              body: NotesLibraryProductionShell(
                          detail: _selectedNote == null
                              ? null
                              : NoteEditorPage(
                                  key: ValueKey<String>(
                                    'notes-workspace-${_selectedNote!.planRowIdForBackend}',
                                  ),
                                  task: _selectedNote!,
                                  embedded: true,
                                  onCloseRequested: () {
                                    if (!mounted) return;
                                    setState(() => _selectedNote = null);
                                    _applyBacklogFromBrainSnapshot();
                                  },
                                ),
                          topBar: _listsSelectMode
          ''',
          )

          # Media: no giant grey pseudo-content and no drag listener on text fields.
          replace_once(
              'lib/features/notes/widgets/note_editor_block_widgets.dart',
              '''    } else if (_isVisibleProductionBlock(block.type)) {
              interactive = ReorderableDelayedDragStartListener(
          ''',
              '''    } else if (!editable && _isVisibleProductionBlock(block.type)) {
              interactive = ReorderableDelayedDragStartListener(
          ''',
          )
          replace_once(
              'lib/features/notes/widgets/note_editor_block_widgets.dart',
              '''    return Image.memory(
              bytes,
              fit: BoxFit.contain,
              gaplessPlayback: true,
              errorBuilder: (_, __, ___) => _mediaPlaceholder(context),
            );
          ''',
              '''    return RepaintBoundary(
              child: ConstrainedBox(
                constraints: const BoxConstraints(maxHeight: 420),
                child: Image.memory(
                  bytes,
                  fit: BoxFit.contain,
                  gaplessPlayback: true,
                  filterQuality: FilterQuality.medium,
                  errorBuilder: (_, __, ___) => _mediaPlaceholder(context),
                ),
              ),
            );
          ''',
          )
          replace_once(
              'lib/features/notes/widgets/note_editor_block_widgets.dart',
              '''    return AspectRatio(
              aspectRatio: 16 / 9,
              child: ColoredBox(
                color: scheme.surfaceContainerHighest,
                child: Center(
                  child: Icon(
                    block.type == NoteBlockType.drawing
                        ? Icons.draw_rounded
                        : Icons.image_rounded,
                    size: 38,
                    color: scheme.onSurfaceVariant,
                  ),
                ),
              ),
            );
          ''',
              '''    return SizedBox(
              height: 88,
              child: DecoratedBox(
                decoration: BoxDecoration(
                  color: scheme.surfaceContainerLow,
                  border: Border.all(color: scheme.outlineVariant),
                ),
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 16),
                  child: Row(
                    children: [
                      Icon(
                        block.type == NoteBlockType.drawing
                            ? Icons.draw_rounded
                            : Icons.broken_image_outlined,
                        size: 24,
                        color: scheme.onSurfaceVariant,
                      ),
                      const SizedBox(width: 12),
                      Expanded(
                        child: Text(
                          t(currentLocale.value, 'notes_v3_editor_load_failed'),
                          maxLines: 2,
                          overflow: TextOverflow.ellipsis,
                          style: Theme.of(context).textTheme.bodyMedium?.copyWith(
                            color: scheme.onSurfaceVariant,
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              ),
            );
          ''',
          )

          # Always-visible toolbar uses an opaque tokenized Material surface, not blur.
          p = Path('lib/features/notes/widgets/notes_component_tools.dart')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'class NotesEditorToolbar extends StatelessWidget \{.*?\n\}\n\n/// Figma `Menus/Floating Options Sheet`',
              re.S,
          )
          replacement = 'class NotesEditorToolbar extends StatelessWidget {\n  const NotesEditorToolbar({super.key, required this.actions});\n\n  final List<NotesToolbarAction> actions;\n\n  @override\n  Widget build(BuildContext context) {\n    final viewportWidth = MediaQuery.sizeOf(context).width;\n    final width = math.min(\n      NotesFigmaTokens.toolbarWidth,\n      math.max(0.0, viewportWidth - 40),\n    );\n    return RepaintBoundary(\n      child: SizedBox(\n        width: width,\n        height: NotesFigmaTokens.toolbarHeight,\n        child: Material(\n          color: NotesFigmaTokens.glassFill(context),\n          elevation: 4,\n          shadowColor: Colors.black.withValues(alpha: 0.12),\n          borderRadius: BorderRadius.circular(\n            NotesFigmaTokens.toolbarRadius,\n          ),\n          child: DecoratedBox(\n            decoration: BoxDecoration(\n              borderRadius: BorderRadius.circular(\n                NotesFigmaTokens.toolbarRadius,\n              ),\n              border: Border.all(\n                color: NotesFigmaTokens.glassStroke(context),\n              ),\n            ),\n            child: LayoutBuilder(\n              builder: (context, constraints) {\n                final compact = constraints.maxWidth < 320;\n                final row = Row(\n                  mainAxisSize:\n                      compact ? MainAxisSize.min : MainAxisSize.max,\n                  mainAxisAlignment: compact\n                      ? MainAxisAlignment.start\n                      : MainAxisAlignment.spaceBetween,\n                  children: [\n                    for (final action in actions)\n                      NotesToolbarButton(\n                        tool: action.tool,\n                        icon: action.icon,\n                        tooltip: action.tooltip,\n                        onPressed: action.onPressed,\n                        selected: action.selected,\n                        enabled: action.enabled,\n                      ),\n                  ],\n                );\n                final padded = Padding(\n                  padding: const EdgeInsets.symmetric(\n                    horizontal: NotesFigmaTokens.toolbarHorizontalPadding,\n                    vertical: NotesFigmaTokens.toolbarVerticalPadding,\n                  ),\n                  child: row,\n                );\n                return compact\n                    ? SingleChildScrollView(\n                        scrollDirection: Axis.horizontal,\n                        child: padded,\n                      )\n                    : padded;\n              },\n            ),\n          ),\n        ),\n      ),\n    );\n  }\n}\n\n' + '/// Figma `Menus/Floating Options Sheet`'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('NotesEditorToolbar replacement failed')
          p.write_text(text, encoding='utf-8')

          # Keep exactly three focused tests; extend the existing responsive test.
          replace_once(
              'test/notes_canonical_components_test.dart',
              '''      expect(tester.takeException(), isNull);

                  selectedTable = null;
                  tester.view.physicalSize = const Size(1200, 900);
          ''',
              '''      expect(tester.takeException(), isNull);

          tester.view.physicalSize = const Size(1200, 900);
          await tester.pumpWidget(
            _host(
              NotesEditorScreen(
                embedded: true,
                titleController: headingController,
                onTitleChanged: (_) {},
                onDone: () {},
                pinned: false,
                onTogglePinned: () {},
                onDelete: () {},
                content: const Align(
                  alignment: Alignment.topLeft,
                  child: Text(
                    'Embedded note content',
                    key: ValueKey('notes-embedded-visible-content'),
                  ),
                ),
                toolbar: NotesEditorToolbar(
                  actions: [
                    for (final tool in NotesToolbarTool.values)
                      NotesToolbarAction(
                        tool: tool,
                        icon: _iconFor(tool),
                        tooltip: tool.name,
                        onPressed: () {},
                      ),
                  ],
                ),
              ),
            ),
          );
          await tester.pumpAndSettle();
          expect(
            find.byKey(const ValueKey('notes-embedded-visible-content')),
            findsOneWidget,
          );
          // Only the host Scaffold remains: embedded desktop Notes does not create
          // a nested full-screen route/surface.
          expect(find.byType(Scaffold), findsOneWidget);
          expect(tester.takeException(), isNull);

                  selectedTable = null;
                  tester.view.physicalSize = const Size(1200, 900);
          ''',
          )

          # Document the adaptive product rule in the existing spec.
          spec = Path('docs/specs/NOTES_EDITOR_V3_SPEC_2026-07-30.md')
          spec_text = spec.read_text(encoding='utf-8')
          marker = '## Responsive behavior'
          if marker in spec_text and 'Desktop/web workspace routing' not in spec_text:
              spec_text = spec_text.replace(
                  marker,
                  marker + '''\n\n### Desktop/web workspace routing\n\n- At wide breakpoints the editor opens inside the existing Notes workspace detail pane.\n- Keep app navigation, the Notes library, filters, and surrounding shell visible.\n- Only narrow/mobile layouts push a dedicated full-screen editor route.\n- The editor surface must not create a nested Scaffold when embedded.\n''',
                  1,
              )
              spec.write_text(spec_text, encoding='utf-8')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Format changed Dart
        run: |
          dart format \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/widgets/notes_editor_screen.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_component_tools.dart \
            lib/features/notes/widgets/notes_library_production_shell.dart \
            lib/features/lists/lists_view.dart \
            test/notes_canonical_components_test.dart

      - name: Analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Exactly three focused Notes tests
        run: |
          TEST_COUNT=$(grep -E "^[[:space:]]*test(Widgets)?\(" test/notes_canonical_components_test.dart | wc -l)
          test "$TEST_COUNT" -eq 3
          flutter test test/notes_canonical_components_test.dart

      - name: Production web build
        run: flutter build web --release --base-href="/Counter/notes-v3-preview/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Strict architecture guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/widgets/notes_editor_screen.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_component_tools.dart \
            lib/features/notes/widgets/notes_library_production_shell.dart \
            lib/features/lists/lists_view.dart \
            test/notes_canonical_components_test.dart \
            docs/specs/NOTES_EDITOR_V3_SPEC_2026-07-30.md
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "Fix Notes workspace layout and editor performance [notes-ux-repair]"
          git push origin HEAD:feature/notes-v3-design-system
