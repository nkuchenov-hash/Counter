name: Notes v2 web runtime capture

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: notes-v2-web-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-editor-tools-v2
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Prepare web capture build
        run: |
          cp lib/core/env/env.dart.example lib/core/env/env.dart
          flutter pub get
          dart format scripts/manual/capture_notes_v2_tools_web_main.dart test/notes/fixtures/notes_v2_tools_fixture.dart
          flutter build web --release \
            -t scripts/manual/capture_notes_v2_tools_web_main.dart \
            --base-href="/" \
            --no-tree-shake-icons \
            --no-wasm-dry-run \
            --pwa-strategy=none

      - name: Start local web server
        run: |
          python3 -m http.server 8000 --directory build/web > notes_v2_web_server.log 2>&1 &
          echo $! > notes_v2_web_server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat notes_v2_web_server.log
          exit 1

      - name: Capture production Notes tools in Chrome
        run: |
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=6000 \
            --window-size=1156,1200 \
            --screenshot=test/fixtures/notes_v2_tools_capture.png \
            http://127.0.0.1:8000/

      - name: Verify PNG
        run: |
          test -f test/fixtures/notes_v2_tools_capture.png
          test "$(stat -c%s test/fixtures/notes_v2_tools_capture.png)" -gt 50000
          file test/fixtures/notes_v2_tools_capture.png

      - name: Upload real web capture
        uses: actions/upload-artifact@v4
        with:
          name: notes-v2-web-runtime-capture
          path: test/fixtures/notes_v2_tools_capture.png
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary capture tooling
        run: |
          rm scripts/manual/capture_notes_v2_tools_web_main.dart
          rm .github/workflows/notes-v2-web-capture.yml
          rm -f scripts/manual/capture_notes_v2_tools_main.dart
          rm -f .github/workflows/notes-v2-windows-capture.yml

      - name: Commit real-runtime capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Capture Notes v2 tools in real web runtime [notes-v2-web-capture]"
          git push origin HEAD:feature/notes-editor-tools-v2
