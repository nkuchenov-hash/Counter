name: Temporary regenerate detailed structure

on:
  push:
    branches:
      - fix/paths-variant2-structure-20260904

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paths-variant2-structure-20260904
          fetch-depth: 0
      - name: Regenerate detailed structure
        run: python scripts/manual/generate_app_structure_detailed.py
      - name: Commit regenerated manifest
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          rm .github/workflows/tmp-regenerate-app-structure-detailed.yml
          git add -A
          git commit -m "Regenerate detailed app structure"
          git push origin HEAD:fix/paths-variant2-structure-20260904
