name: Temporary daily routine contract test

on:
  push:
    branches:
      - fix/planner-dedup-daily-routine
    paths:
      - 'test/daily_routine_contract_test.dart'
      - '.github/workflows/temp-daily-routine-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-dedup-daily-routine
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
      - run: flutter pub get
      - run: flutter test test/daily_routine_contract_test.dart
