name: Trigger shell boundary cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  trigger:
    if: github.head_ref == 'agent/shell-boundary-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/shell-boundary-cleanup
          fetch-depth: 0
      - name: Push one normal branch event and remove trigger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/shell-boundary-cleanup-trigger.yml
          git commit -m 'Trigger shell boundary cleanup run'
          git push origin HEAD:agent/shell-boundary-cleanup
