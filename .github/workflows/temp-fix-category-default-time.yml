name: Temporary project plan approval gate patch

on:
  push:
    paths:
      - '.github/workflows/temp-fix-category-default-time.yml'
      - '.github/scripts/temp_project_plan_approval_gate.py'
      - '.github/scripts/temp_project_plan_approval_audit.py'
      - '.github/scripts/temp_project_plan_approval_followup.py'
      - '.github/scripts/temp_project_plan_cleanup.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-plan-approval-gate
          fetch-depth: 0

      - name: Apply project plan approval gate
        run: |
          python .github/scripts/temp_project_plan_approval_gate.py
          python .github/scripts/temp_project_plan_approval_audit.py
          python .github/scripts/temp_project_plan_approval_followup.py
          python .github/scripts/temp_project_plan_cleanup.py

      - name: Architecture guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test test/category_catalog_resilience_contract_test.dart
      - run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Commit product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/shell/shared/shell_path_governance.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Require project plan approval before scheduling'
            git pull --rebase origin feat/project-plan-approval-gate
            git push origin HEAD:feat/project-plan-approval-gate
          fi