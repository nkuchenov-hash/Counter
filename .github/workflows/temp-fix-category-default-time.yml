name: Temporary category default time fix

on:
  push:
    paths:
      - '.github/workflows/temp-fix-category-default-time.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch category default schedule precedence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/data/plans/plan_time_cascade_helpers.dart')
          text = path.read_text()
          old = '''    String? categoryDefaultTimezoneIana;
    var usedCategoryDefault = false;
    late final DateTime startWall;
    if (explicitStartWall != null) {
      startWall = explicitStartWall;
    } else if (_planAutoPlacementMode ==
        PlanAutoPlacementMode.nearestFreeSlot) {
      final windowStart = PlanTimeVisibleWindow.windowStartWall(
        wallDay,
        timelineDayStartHour,
      );
      final profileNow =
          currentWall ?? applyUserOffset(DatabaseService.getPlanetaryNow());
      final earliestStart =
          _samePlanWallDay(profileNow, wallDay) &&
              profileNow.isAfter(windowStart)
          ? profileNow
          : windowStart;
      startWall = _firstAvailablePlanWallStart(
        earliestStartWall: earliestStart,
        durationMin: durationMin,
        existingDayPlans: existingDayPlans,
      );
    } else {
      DateTime? latestEnd;
      for (final p in existingDayPlans) {
        if (p.startTime == null) continue;
        final end = _resolvedPlanWallEnd(p);
        if (end == null) continue;
        if (latestEnd == null || end.isAfter(latestEnd)) latestEnd = end;
      }
      if (latestEnd != null) {
        startWall = _snapPlanWallDateTime(latestEnd);
      } else {
        final catSchedule = effectiveDefaultPlanScheduleForCategory(categoryId);
        if (catSchedule?.hhmm != null) {
          final h = int.tryParse(catSchedule!.hhmm!.substring(0, 2));
          final m = int.tryParse(catSchedule.hhmm!.substring(3, 5));
          if (h != null && m != null) {
            usedCategoryDefault = true;
            categoryDefaultTimezoneIana = catSchedule.timezoneIana;
            startWall = _snapPlanWallDateTime(
              DateTime(wallDay.year, wallDay.month, wallDay.day, h, m),
            );
          } else {
            startWall = _snapPlanWallDateTime(
              PlanTimeVisibleWindow.windowStartWall(
                wallDay,
                timelineDayStartHour,
              ),
            );
          }
        } else {
          startWall = _snapPlanWallDateTime(
            PlanTimeVisibleWindow.windowStartWall(
              wallDay,
              timelineDayStartHour,
            ),
          );
        }
      }
    }
'''
          new = '''    String? categoryDefaultTimezoneIana;
    var usedCategoryDefault = false;
    late final DateTime startWall;
    if (explicitStartWall != null) {
      startWall = explicitStartWall;
    } else {
      final catSchedule = effectiveDefaultPlanScheduleForCategory(categoryId);
      final hhmm = catSchedule?.hhmm;
      final h = hhmm != null && hhmm.length >= 5
          ? int.tryParse(hhmm.substring(0, 2))
          : null;
      final m = hhmm != null && hhmm.length >= 5
          ? int.tryParse(hhmm.substring(3, 5))
          : null;

      if (h != null && m != null) {
        // An explicit category default is the user's scheduling instruction.
        // Auto-placement only applies when the category has no default time.
        usedCategoryDefault = true;
        categoryDefaultTimezoneIana = catSchedule!.timezoneIana;
        startWall = _snapPlanWallDateTime(
          DateTime(wallDay.year, wallDay.month, wallDay.day, h, m),
        );
      } else if (_planAutoPlacementMode ==
          PlanAutoPlacementMode.nearestFreeSlot) {
        final windowStart = PlanTimeVisibleWindow.windowStartWall(
          wallDay,
          timelineDayStartHour,
        );
        final profileNow =
            currentWall ?? applyUserOffset(DatabaseService.getPlanetaryNow());
        final earliestStart =
            _samePlanWallDay(profileNow, wallDay) &&
                profileNow.isAfter(windowStart)
            ? profileNow
            : windowStart;
        startWall = _firstAvailablePlanWallStart(
          earliestStartWall: earliestStart,
          durationMin: durationMin,
          existingDayPlans: existingDayPlans,
        );
      } else {
        DateTime? latestEnd;
        for (final p in existingDayPlans) {
          if (p.startTime == null) continue;
          final end = _resolvedPlanWallEnd(p);
          if (end == null) continue;
          if (latestEnd == null || end.isAfter(latestEnd)) latestEnd = end;
        }
        startWall = latestEnd != null
            ? _snapPlanWallDateTime(latestEnd)
            : _snapPlanWallDateTime(
                PlanTimeVisibleWindow.windowStartWall(
                  wallDay,
                  timelineDayStartHour,
                ),
              );
      }
    }
'''
          if old not in text:
              raise SystemExit('target block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1))

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          entry = '''\n## [2026-08-13] - Category default plan time precedence [shipped]\n\n* **`lib/data/plans/plan_time_cascade_helpers.dart`:** New plans with no explicit user-entered time now honor the nearest inherited category `default_plan_time` before generic auto-placement; the configured category timezone continues through the existing wall→UTC conversion.\n'''
          marker = '# 📖 DEV_JOURNAL (Changelog)'
          if entry.strip() not in c:
              # Insert before the first dated entry, preserving the journal header/instructions.
              idx = c.find('\n## [')
              if idx < 0:
                  raise SystemExit('CHANGELOG dated-entry marker not found')
              c = c[:idx] + entry + c[idx:]
              changelog.write_text(c)
          PY
          git diff --check
          git diff -- lib/data/plans/plan_time_cascade_helpers.dart CHANGELOG.md
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/data/plans/plan_time_cascade_helpers.dart CHANGELOG.md
          git commit -m 'Fix category default plan time precedence'
          git push origin HEAD:main