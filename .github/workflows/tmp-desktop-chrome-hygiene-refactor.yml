name: Temporary desktop chrome hygiene refactor

on:
  push:
    branches:
      - fix/desktop-section-chrome-unification-20260904

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-section-chrome-unification-20260904
          fetch-depth: 0
      - name: Apply refactor
        run: python scripts/tmp_desktop_chrome_hygiene_refactor.py
      - name: Remove temporary files
        run: |
          git rm scripts/tmp_desktop_chrome_hygiene_refactor.py
          git rm .github/workflows/tmp-desktop-chrome-hygiene-refactor.yml
      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Restore lockfile
        run: git checkout -- pubspec.lock
      - name: Format refactored Dart
        run: |
          dart format \
            lib/features/planning/widgets/planning_filter_controls.dart \
            lib/features/planning/planning_page.dart \
            lib/features/paths/widgets/path_edit_sheet.dart \
            lib/features/paths/paths_page.dart
      - name: Analyze affected Dart
        run: |
          flutter analyze --no-fatal-infos \
            lib/core/widgets/compact_nav_controls.dart \
            lib/features/planning/widgets/planning_filter_controls.dart \
            lib/features/planning/planning_page.dart \
            lib/features/paths/widgets/path_edit_sheet.dart \
            lib/features/paths/paths_page.dart
      - name: Remove env stub
        run: rm -f lib/core/env/env.dart
      - name: Check structure growth against main
        run: |
          STRUCTURE_GROWTH_BASE="$(git rev-parse origin/main)" python scripts/audit/repository_hygiene.py
      - name: Check documentation parity
        run: python scripts/audit/documentation_parity.py
      - name: Check whitespace
        run: git diff --check
      - name: Build release web
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
          rm -f lib/core/env/env.dart
      - name: Commit refactor
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          git add -A
          git commit -m "Keep desktop chrome changes within structure limits"
          git push origin HEAD:fix/desktop-section-chrome-unification-20260904
