# Historical workflow name retained to avoid breaking the existing file map.
# Production provisioning is owned exclusively by deploy-pocketbase.yml, which
# detects LIFEOS2, provisions the Xiaomi venv, and verifies the actual service.
# A second SSH workflow used the retired 217.114.0.201 host and was unsafe/stale.
name: Validate Xiaomi sleep bridge

on:
  pull_request:
    paths:
      - 'pb_hooks/xiaomi_sleep_bridge.py'
      - '.github/workflows/install-xiaomi-sleep-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'pb_hooks/xiaomi_sleep_bridge.py'
      - '.github/workflows/install-xiaomi-sleep-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Xiaomi bridge and pinned SDK without credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pb_hooks/xiaomi_sleep_bridge.py
          python -m pip install -q 'mi-fitness==0.2.0'
          python - <<'PY'
          import pb_hooks.xiaomi_sleep_bridge as bridge
          from mi_fitness import XiaomiAuth, MiHealthClient
          assert bridge and XiaomiAuth and MiHealthClient
          print('xiaomi_bridge=valid')
          PY
