name: Provision Xiaomi sleep runtime

on:
  pull_request:
    paths:
      - 'pb_hooks/xiaomi_sleep_bridge.py'
      - '.github/workflows/install-xiaomi-sleep-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'pb_hooks/xiaomi_sleep_bridge.py'
      - '.github/workflows/install-xiaomi-sleep-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Xiaomi bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pb_hooks/xiaomi_sleep_bridge.py
          python -m pip install -q 'mi-fitness==0.2.0'
          python - <<'PY'
          import pb_hooks.xiaomi_sleep_bridge as bridge
          from mi_fitness import XiaomiAuth, MiHealthClient
          assert bridge and XiaomiAuth and MiHealthClient
          print('xiaomi_bridge=valid')
          PY

  provision:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pocketbase-production
      cancel-in-progress: false
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Install pinned Xiaomi Health SDK
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          if ! python3 -m venv /tmp/lifeos-xiaomi-venv-check >/dev/null 2>&1; then
            $SUDO apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq python3.12-venv
          fi
          rm -rf /tmp/lifeos-xiaomi-venv-check
          if [[ ! -x /opt/lifeos-xiaomi-sleep/bin/python ]]; then
            $SUDO rm -rf /opt/lifeos-xiaomi-sleep
            $SUDO python3 -m venv /opt/lifeos-xiaomi-sleep
          fi
          $SUDO /opt/lifeos-xiaomi-sleep/bin/pip install -q --upgrade 'mi-fitness==0.2.0'
          /opt/lifeos-xiaomi-sleep/bin/python - <<'PY'
          from mi_fitness import XiaomiAuth, MiHealthClient
          assert XiaomiAuth and MiHealthClient
          print('xiaomi_sleep_runtime=ready')
          PY
          REMOTE

      - name: Verify production sleep pipeline read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          app_dir=/root/pb
          db="$app_dir/pb_data/data.db"
          bridge="$app_dir/pb_hooks/xiaomi_sleep_bridge.py"
          py=/opt/lifeos-xiaomi-sleep/bin/python
          [[ -f "$db" && -f "$bridge" && -x "$py" ]]
          meta="$(python3 - "$db" <<'PY'
          import sqlite3,sys
          con=sqlite3.connect(sys.argv[1]); con.row_factory=sqlite3.Row
          rows=con.execute("SELECT user_id,enabled,status,last_error,last_sync_at,last_session_count,last_imported_count FROM sleep_sync_connections WHERE provider='xiaomi'").fetchall()
          print('XIAOMI_CONNECTION_COUNT='+str(len(rows)))
          if len(rows)==1:
              r=rows[0]
              err=(r['last_error'] or '').lower()
              eclass='none' if not err else ('auth' if ('token' in err or 'authorization' in err or '401' in err) else 'other')
              print('XIAOMI_ENABLED='+str(bool(r['enabled'])).lower())
              print('XIAOMI_STATUS='+str(r['status'] or ''))
              print('XIAOMI_ERROR_CLASS='+eclass)
              print('XIAOMI_SYNCED='+str(bool(r['last_sync_at'])).lower())
              print('XIAOMI_LAST_SESSIONS='+str(r['last_session_count'] or 0))
              print('XIAOMI_LAST_IMPORTED='+str(r['last_imported_count'] or 0))
              print('XIAOMI_USER='+str(r['user_id']))
              gh=con.execute("SELECT enabled,status,last_error,last_sync_at,last_session_count,last_imported_count,refresh_token_enc FROM sleep_sync_connections WHERE user_id=? AND provider='google_health' LIMIT 1",(r['user_id'],)).fetchone()
              print('GOOGLE_HEALTH_CONNECTION='+str(bool(gh)).lower())
              if gh:
                  ge=(gh['last_error'] or '').lower()
                  gclass='none' if not ge else ('auth' if ('token' in ge or 'authorization' in ge or '401' in ge or 'invalid_grant' in ge) else ('account' if 'account_not_linked' in ge else 'other'))
                  print('GOOGLE_HEALTH_HAS_REFRESH='+str(bool(gh['refresh_token_enc'])).lower())
                  print('GOOGLE_HEALTH_ENABLED='+str(bool(gh['enabled'])).lower())
                  print('GOOGLE_HEALTH_STATUS='+str(gh['status'] or ''))
                  print('GOOGLE_HEALTH_ERROR_CLASS='+gclass)
                  print('GOOGLE_HEALTH_SYNCED='+str(bool(gh['last_sync_at'])).lower())
                  print('GOOGLE_HEALTH_LAST_SESSIONS='+str(gh['last_session_count'] or 0))
                  print('GOOGLE_HEALTH_LAST_IMPORTED='+str(gh['last_imported_count'] or 0))
          con.close()
          PY
          )"
          printf '%s\n' "$meta" | grep -v '^XIAOMI_USER='
          uid="$(printf '%s\n' "$meta" | sed -n 's/^XIAOMI_USER=//p')"
          [[ -n "$uid" ]]
          token="$app_dir/pb_data/xiaomi_sleep/$uid.token.json"
          [[ -f "$token" ]]
          echo 'XIAOMI_TOKEN_EXISTS=true'
          result="$($py "$bridge" sync --token-path "$token" --days 14)"
          "$py" -c 'import json,sys,datetime; d=json.loads(sys.argv[1]); s=d.get("sessions") or []; latest=str(s[-1].get("end","")) if s else "none"; recent=False
          if s:
              try:
                  end=datetime.datetime.fromisoformat(latest.replace("Z","+00:00")); recent=(datetime.datetime.now(datetime.timezone.utc)-end).total_seconds() <= 36*3600
              except Exception: pass
          print("XIAOMI_BRIDGE_OK="+str(bool(d.get("ok"))).lower()); print("XIAOMI_BRIDGE_SESSIONS="+str(len(s))); print("XIAOMI_BRIDGE_LATEST_END="+latest); print("XIAOMI_BRIDGE_RECENT_36H="+str(recent).lower()); print("XIAOMI_BRIDGE_REGION="+str(d.get("region","unknown"))); print("XIAOMI_BRIDGE_ERROR_CLASS="+str(d.get("error_class", "none")))' "$result"
          python3 - "$db" "$uid" <<'PY'
          import sqlite3,sys
          con=sqlite3.connect(sys.argv[1]); uid=sys.argv[2]
          def one(sql,args=()): return con.execute(sql,args).fetchone()[0]
          x_count=one("SELECT count(*) FROM records WHERE user_id=? AND (sleep_source='xiaomi' OR external_source='xiaomi')",(uid,))
          x_recent=one("SELECT count(*) FROM records WHERE user_id=? AND (sleep_source='xiaomi' OR external_source='xiaomi') AND julianday(end_time) >= julianday('now','-36 hours')",(uid,))
          x_latest=one("SELECT max(end_time) FROM records WHERE user_id=? AND (sleep_source='xiaomi' OR external_source='xiaomi')",(uid,))
          gh_recent=one("SELECT count(*) FROM records WHERE user_id=? AND (sleep_source='google_health' OR external_source='google_health') AND julianday(end_time) >= julianday('now','-36 hours')",(uid,))
          gh_latest=one("SELECT max(end_time) FROM records WHERE user_id=? AND (sleep_source='google_health' OR external_source='google_health')",(uid,))
          all_recent=one("SELECT count(*) FROM records WHERE user_id=? AND (title='Sleep' OR title='Сон') AND julianday(end_time) >= julianday('now','-36 hours')",(uid,))
          all_latest=one("SELECT max(end_time) FROM records WHERE user_id=? AND (title='Sleep' OR title='Сон')",(uid,))
          print('XIAOMI_RECORD_COUNT='+str(x_count))
          print('XIAOMI_RECORD_RECENT_36H='+str(x_recent>0).lower())
          print('XIAOMI_RECORD_LATEST_END='+str(x_latest or 'none'))
          print('GOOGLE_HEALTH_RECORD_RECENT_36H='+str(gh_recent>0).lower())
          print('GOOGLE_HEALTH_RECORD_LATEST_END='+str(gh_latest or 'none'))
          print('SLEEP_RECORD_RECENT_36H='+str(all_recent>0).lower())
          print('SLEEP_RECORD_LATEST_END='+str(all_latest or 'none'))
          con.close()
          PY
          REMOTE
