name: One-shot recurring scope save-only fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Patch recurring edit scope timing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sheet = Path('lib/features/shared/planning_task_edit_sheet.dart')
          text = sheet.read_text(encoding='utf-8')
          old = (
              "  void _onPlanFieldChanged({bool immediate = false}) {\n"
              "    // New drafts are committed once by the shell on explicit Save. Building a\n"
              "    // Quill/checklist draft on every keypress is wasted work on web.\n"
              "    if (!_isPersistedPlan) return;\n\n"
              "    void applyAndSync(PlanningTask draft) {\n"
              "      if (_recurrenceScopeGate.requiresChoice(_baselineIsRecurring)) {\n"
              "        unawaited(_syncPlanDraftToNetwork(draft));\n"
              "        return;\n"
              "      }\n"
              "      _applyPlanDraftLocally(draft);\n"
              "      unawaited(_syncPlanDraftToNetwork(draft));\n"
              "    }\n"
          )
          new = (
              "  void _onPlanFieldChanged({bool immediate = false}) {\n"
              "    // New drafts are committed once by the shell on explicit Save. Building a\n"
              "    // Quill/checklist draft on every keypress is wasted work on web.\n"
              "    if (!_isPersistedPlan) return;\n\n"
              "    // A recurring edit has no persistence scope until the user explicitly\n"
              "    // presses Save. Keep title/notes/checklist/category/tag/time changes as\n"
              "    // an in-sheet draft so autosave can never open the recurrence dialog.\n"
              "    if (_baselineIsRecurring) {\n"
              "      _planAutosaveGate.markDirty();\n"
              "      return;\n"
              "    }\n\n"
              "    void applyAndSync(PlanningTask draft) {\n"
              "      _applyPlanDraftLocally(draft);\n"
              "      unawaited(_syncPlanDraftToNetwork(draft));\n"
              "    }\n"
          )
          if old not in text:
              raise SystemExit('Expected _onPlanFieldChanged block not found')
          sheet.write_text(text.replace(old, new, 1), encoding='utf-8')

          ux = Path('docs/UX_CONTRACT.md')
          ux_text = ux.read_text(encoding='utf-8')
          old_ux = '- **Scope dialog (EN/RU):** Editing or deleting a recurring/virtual/materialized occurrence has exactly two choices:'
          new_ux = '- **Scope dialog (EN/RU):** Editing a recurring/virtual/materialized occurrence stays as an in-sheet draft while fields change; the two-choice scope dialog opens only after explicit **Save**, never from autosave while typing/changing fields. Deleting opens the same scope dialog only after the explicit delete action. Choices:'
          if old_ux not in ux_text:
              raise SystemExit('Expected UX recurrence scope line not found')
          ux.write_text(ux_text.replace(old_ux, new_ux, 1), encoding='utf-8')

          test_lines = [
              "import 'dart:io';",
              "",
              "import 'package:flutter_test/flutter_test.dart';",
              "",
              "void main() {",
              "  test('recurring edit scope is requested only from explicit Save', () {",
              "    final source = File(",
              "      'lib/features/shared/planning_task_edit_sheet.dart',",
              "    ).readAsStringSync();",
              "",
              "    final fieldStart = source.indexOf(",
              "      'void _onPlanFieldChanged({bool immediate = false})',",
              "    );",
              "    final fieldEnd = source.indexOf(",
              "      'bool _planDraftsSemanticallyEqual',",
              "      fieldStart,",
              "    );",
              "    expect(fieldStart, greaterThanOrEqualTo(0));",
              "    expect(fieldEnd, greaterThan(fieldStart));",
              "    final fieldBlock = source.substring(fieldStart, fieldEnd);",
              "",
              "    expect(fieldBlock, contains('if (_baselineIsRecurring)'));",
              "    expect(fieldBlock, contains('_planAutosaveGate.markDirty();'));",
              "    expect(fieldBlock, isNot(contains('_recurrenceScopeGate.resolve(')));",
              "",
              "    final saveStart = source.indexOf('Future<void> _commitSaveAsync() async');",
              "    final saveEnd = source.indexOf('PlanningTask? _buildDraftTask()', saveStart);",
              "    expect(saveStart, greaterThanOrEqualTo(0));",
              "    expect(saveEnd, greaterThan(saveStart));",
              "    final saveBlock = source.substring(saveStart, saveEnd);",
              "",
              "    expect(",
              "      saveBlock,",
              "      contains('final scope = await _recurrenceScopeGate.resolve('),",
              "    );",
              "  });",
              "}",
          ]
          Path('test/recurring_edit_scope_save_only_contract_test.dart').write_text(
              '\n'.join(test_lines) + '\n', encoding='utf-8'
          )

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text(encoding='utf-8')
          entry_lines = [
              '## 2026-09-29 — Recurring edit scope only on Save [fix]',
              '',
              '- Recurring plan edits now stay as local in-sheet drafts while typing/changing fields; autosave no longer opens the occurrence-scope dialog.',
              '- The occurrence/future-series choice is requested only after explicit Save, with a regression contract test covering the trigger boundary.',
              '',
          ]
          if not c.startswith(entry_lines[0]):
              changelog.write_text('\n'.join(entry_lines) + '\n' + c, encoding='utf-8')

          Path('.github/workflows/_one_shot_recurring_scope_save_fix.yml').unlink()
          PY

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify recurrence edit behavior
        run: |
          flutter test test/recurring_edit_scope_save_only_contract_test.dart test/edit_sheet_autosave_test.dart test/plan_recurrence_scope_test.dart
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix recurring edit scope prompt timing"
          git push origin HEAD:main
