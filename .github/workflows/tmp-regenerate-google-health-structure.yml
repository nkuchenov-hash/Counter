name: TEMP regenerate Google Health structure docs

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-regenerate-google-health-structure.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Regenerate detailed structure without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-regenerate-google-health-structure.yml
          python scripts/manual/generate_app_structure_detailed.py
          python scripts/audit/documentation_parity.py
          git diff --check
      - name: Commit regenerated structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Regenerate structure docs for Google Health sleep'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
