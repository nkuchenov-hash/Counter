name: Notes UX batch runner

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/notes-ux-batch-runner.yml'
  pull_request:
    branches: [gh-pages]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: notes-ux-batch-runner
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'hotfix/run-notes-production-build'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout patch definition
        uses: actions/checkout@v4
        with:
          ref: hotfix/run-notes-production-build
          path: automation
          fetch-depth: 1

      - name: Snapshot Pages companion content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Apply quick-add geometry directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/notes/widgets/notes_library_production_shell.dart')
          text = path.read_text()
          text = text.replace(
              '    final compactMobile = MediaQuery.sizeOf(context).shortestSide < 600;\n',
              '',
              1,
          )
          text = text.replace('            height: 40,', '            height: 48,', 1)
          text = text.replace(
              '              style: TextStyle(fontSize: 14, color: scheme.onSurface),',
              '              style: TextStyle(fontSize: 15, color: scheme.onSurface),',
              1,
          )
          text = text.replace('                  fontSize: 14,', '                  fontSize: 15,', 1)
          start_marker = '''        SizedBox(
          width: compactMobile ? 40 : null,
          height: 40,
'''
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('quick-add start marker not found')
          end_marker = '''        ),
      ],
    );'''
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('quick-add end marker not found')
          end += len('        ),')
          new_button = '''        SizedBox.square(
          dimension: 48,
          child: Tooltip(
            message: t(locale, 'add'),
            child: Material(
              color: scheme.primary,
              shape: const CircleBorder(),
              child: InkWell(
                onTap: onSubmit,
                customBorder: const CircleBorder(),
                child: Center(
                  child: Icon(
                    Icons.add_rounded,
                    size: 24,
                    color: scheme.onPrimary,
                  ),
                ),
              ),
            ),
          ),
        ),'''
          text = text[:start] + new_button + text[end:]
          path.write_text(text)
          PY

      - name: Extract and apply remaining focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('automation/.github/workflows/bootstrap-notes-hotfix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = []
          skipping_quick_add = False
          for raw in src[start:end]:
              line = raw[10:] if raw.startswith('          ') else raw
              if '# 3) Quick add:' in line:
                  skipping_quick_add = True
                  continue
              if skipping_quick_add and '# 4) Keep Notes checkbox-mode' in line:
                  skipping_quick_add = False
              if skipping_quick_add:
                  continue
              body.append(line)
          Path('/tmp/apply_notes_batch.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/apply_notes_batch.py
          git diff --check

      - name: Commit source locally
        run: |
          git config user.name 'nkuchenov-hash'
          git config user.email 'nkuchenov-hash@users.noreply.github.com'
          git add lib/features/notes lib/features/lists/lists_view.dart lib/features/lists/lists_filters.dart lib/shared/categories
          git commit -m 'Fix Notes category picker cards clipboard and editor UX'
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Verify and build web
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none \
            --dart-define=GIT_COMMIT="$(git rev-parse --short HEAD)" \
            --dart-define=BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$(git rev-parse HEAD)" > build/web/.lifeos-source-sha

      - name: Push verified source to main
        run: git push origin HEAD:main

      - name: Preserve companion content
        run: |
          if [ -d pages/igropoisk ]; then
            rm -rf build/web/igropoisk
            cp -R pages/igropoisk build/web/igropoisk
          fi
          mkdir -p build/web/.github/workflows
          cp pages/.github/workflows/deploy.yml build/web/.github/workflows/deploy.yml

      - name: Deploy verified web
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          commit-message: 'Deploy Notes UX batch from ${{ env.SOURCE_SHA }}'
