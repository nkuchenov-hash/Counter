name: Provision Viktor vault on recovered PocketBase VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-viktor-vault.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketbase-production
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Connect to the canonical recovered VPS
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SSH_PRIVATE_KEY:-}" ]] || { echo "::error::Production SSH key missing"; exit 1; }
          host=137.22.146.109
          user="${SSH_USER:-root}"
          port="${SSH_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lifeos-vault-ssh"
          chmod 600 "$RUNNER_TEMP/lifeos-vault-ssh"
          ssh-keyscan -T 8 -p "$port" -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$RUNNER_TEMP/lifeos-vault-ssh" -p "$port" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "$user@$host" 'bash -se' <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          # Caddy's public /api/* route targets 8102, not staging PocketBase at 8099.
          # Identify the exact process before changing any systemd configuration.
          readarray -t target < <($SUDO python3 - <<'PY'
          import os,re
          matches=[]
          for name in os.listdir('/proc'):
              if not name.isdigit(): continue
              try:
                  raw=open('/proc/'+name+'/cmdline','rb').read()
                  args=[part.decode('utf8','replace') for part in raw.split(b'\0') if part]
                  if not args or os.path.basename(args[0]) != 'pocketbase': continue
                  if '--http=127.0.0.1:8102' not in args: continue
                  dbargs=[v.removeprefix('--dir=') for v in args if v.startswith('--dir=')]
                  if len(dbargs)!=1: continue
                  cg=open('/proc/'+name+'/cgroup').read()
                  units=re.findall(r'(?:^|/)([^/]+\.service)(?:/|$)',cg)
                  if not units: continue
                  matches.append((name,dbargs[0],units[-1]))
              except (OSError,UnicodeError): pass
          if len(matches)!=1: raise SystemExit('Expected exactly one public 8102 PocketBase process with a systemd unit')
          pid,dbdir,service=matches[0]
          if not dbdir.startswith('/opt/lifeos/') or '..' in dbdir:
              raise SystemExit('Public PocketBase DB directory outside approved recovery deployment')
          print(pid);print(dbdir);print(service)
          PY
          )
          [[ "${#target[@]}" -eq 3 ]] || { echo "::error::Public PocketBase unit could not be identified; no changes made"; exit 1; }
          original_pid="${target[0]}"
          data_dir="${target[1]}"
          service="${target[2]}"
          [[ "$($SUDO systemctl is-active "$service")" == active ]] || { echo "::error::Public PocketBase unit not active"; exit 1; }
          [[ -f "$data_dir/data.db" ]] || { echo "::error::Public PocketBase database missing; no changes made"; exit 1; }
          echo "Public PocketBase identified by port 8102 and service unit; staging 8099 untouched."
          vault_dir=/etc/lifeos
          vault_file="$vault_dir/viktor-vault.env"
          $SUDO install -d -m 700 "$vault_dir"
          if $SUDO test -f "$vault_file"; then
            $SUDO grep -Eq '^VIKTOR_VAULT_KEY=[0-9a-f]{32}$' "$vault_file" ||
              { echo "::error::Existing vault key invalid; refusing to overwrite"; exit 1; }
            echo "Existing persistent vault key preserved."
          else
            # Never generate a replacement for credentials encrypted under an unknown key.
            existing="$($SUDO python3 - "$data_dir/data.db" <<'PY'
          import sqlite3,sys
          con=sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True)
          try:
              table=con.execute("SELECT count(*) FROM sqlite_master WHERE type='table' AND name='viktor_connections'").fetchone()[0]
              count=con.execute("SELECT count(*) FROM viktor_connections").fetchone()[0] if table else 0
              print(count)
          finally:
              con.close()
          PY
            )"
            [[ "$existing" == 0 ]] || { echo "::error::Encrypted Viktor connections exist; missing master key cannot be replaced safely"; exit 1; }
            pid="$original_pid"
            if [[ -n "$pid" ]] && $SUDO python3 - "$pid" <<'PY'
          import sys
          data=open('/proc/'+sys.argv[1]+'/environ','rb').read().split(b'\0')
          raise SystemExit(0 if any(x.startswith(b'VIKTOR_VAULT_KEY=') for x in data) else 1)
          PY
            then
              echo "::error::Process already has a Vault key but persistent key file is missing; refusing rotation"
              exit 1
            fi
            printf 'VIKTOR_VAULT_KEY=%s\n' "$(openssl rand -hex 16)" | $SUDO tee "$vault_file" >/dev/null
            $SUDO chmod 600 "$vault_file"
            echo "New persistent master key generated on server, never exported."
          fi
          # Dedicated drop-in; never replace another service's environment config.
          dropin_dir="/etc/systemd/system/${service}.d"
          dropin_file="$dropin_dir/95-viktor-vault.conf"
          $SUDO install -d -m 755 "$dropin_dir"
          if $SUDO test -e "$dropin_file"; then
            $SUDO grep -Fqx 'EnvironmentFile=/etc/lifeos/viktor-vault.env' "$dropin_file" ||
              { echo "::error::Existing Viktor systemd drop-in differs; refusing overwrite"; exit 1; }
          else
            printf '[Service]\nEnvironmentFile=/etc/lifeos/viktor-vault.env\n' | $SUDO tee "$dropin_file" >/dev/null
          fi
          $SUDO systemctl daemon-reload
          $SUDO systemctl restart "$service"
          $SUDO systemctl is-active --quiet "$service" ||
            { echo "::error::PocketBase did not restart successfully"; exit 1; }
          sleep 2
          pid="$($SUDO python3 - <<'PY'
          import os
          matches=[]
          for name in os.listdir('/proc'):
              if not name.isdigit(): continue
              try:
                  args=[v.decode('utf8','replace') for v in open('/proc/'+name+'/cmdline','rb').read().split(b'\0') if v]
                  if args and os.path.basename(args[0])=='pocketbase' and '--http=127.0.0.1:8102' in args:
                      matches.append(name)
              except OSError: pass
          if len(matches)==1: print(matches[0])
          PY
          )"
          [[ -n "$pid" ]] || { echo "::error::Public PocketBase process missing after restart"; exit 1; }
          $SUDO python3 - "$pid" <<'PY'
          import sys
          env=open('/proc/'+sys.argv[1]+'/environ','rb').read().split(b'\0')
          keys=[line.split(b'=',1)[1] for line in env if line.startswith(b'VIKTOR_VAULT_KEY=')]
          assert len(keys)==1 and len(keys[0])==32, 'Vault key not loaded into PocketBase process'
          print('VIKTOR_VAULT_KEY loaded into PocketBase: verified (secret redacted)')
          PY
          echo "Vault provisioning complete on canonical recovered VPS."
          REMOTE

      - name: Check production API remains healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS --connect-timeout 8 --max-time 12 -o /dev/null -w '%{http_code}' 'https://137-22-146-109.sslip.io/api/health' || true)"
            if [[ "$code" == 200 ]]; then echo 'PocketBase production health: HTTP 200'; exit 0; fi
            sleep 5
          done
          echo "::error::PocketBase health check did not return HTTP 200"
          exit 1
