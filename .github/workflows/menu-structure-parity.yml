name: Keep detailed app structure in sync

on:
  push:
    branches: [main]
    paths:
      - 'lib/features/profile/menu/**'
      - 'lib/features/lists/notes_library_preferences.dart'
      - 'lib/core/widgets/app_menu_icons.dart'
      - 'docs/APP_STRUCTURE.md'
      - 'scripts/audit/documentation_parity.py'
      - '.github/workflows/menu-structure-parity.yml'
  workflow_dispatch:

concurrency:
  group: app-structure-parity-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate detailed file guide from tracked repository
        run: python scripts/manual/generate_app_structure_detailed.py
      - name: Commit canonical structure changes
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/APP_STRUCTURE_DETAILED.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/APP_STRUCTURE_DETAILED.md
            git commit -m "docs: regenerate canonical APP_STRUCTURE_DETAILED"
            git push origin HEAD:main
          else
            echo "Detailed structure already in parity."
          fi
