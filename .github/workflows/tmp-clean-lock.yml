name: Temporary lockfile cleanup

on:
  push:
    branches:
      - fix/planning-time-precision-controls-20260910

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.event.head_commit.message != 'Remove unrelated lockfile drift' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-time-precision-controls-20260910
          fetch-depth: 0
      - name: Restore main lockfile and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- pubspec.lock
          git rm .github/workflows/tmp-clean-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unrelated lockfile drift"
          git push origin HEAD:fix/planning-time-precision-controls-20260910
