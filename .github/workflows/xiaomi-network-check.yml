name: Xiaomi independent network check
on:
  push:
    branches: ['diagnostic/xiaomi-network-20261125']
    paths: ['.github/workflows/xiaomi-network-check.yml']
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test existing Xiaomi session against alternative official Russian hostname
        env:
          LIFEOS_SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          LIFEOS_SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
          LIFEOS_SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          host=137.22.146.109
          port="${LIFEOS_SSH_PORT:-22}"
          user="${LIFEOS_SSH_USER:-root}"
          install -d -m 700 "$HOME/.ssh"
          key="$RUNNER_TEMP/lifeos_network_probe"
          trap 'rm -f "$key"' EXIT
          test -n "$LIFEOS_SSH_PRIVATE_KEY"
          printf '%s\n' "$LIFEOS_SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -T 8 -p "$port" -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes "$user@$host" '/opt/lifeos-xiaomi-sleep/bin/python -' <<'PY'
          import asyncio, json, os, shutil, sqlite3, subprocess, sys, tempfile
          from datetime import datetime, timezone
          from pathlib import Path
          from loguru import logger
          logger.remove()
          def main():
              unit = "lifeos-recovery-live.service"
              if subprocess.run(["systemctl","is-active","--quiet",unit]).returncode:
                  print("alternative_probe=active_service_not_identified")
                  return
              pid = subprocess.check_output(["systemctl","show",unit,"-p","MainPID","--value"],text=True).strip()
              files=set()
              for fd in Path("/proc",pid,"fd").iterdir():
                  try:
                      p=Path(os.readlink(fd))
                      if p.name=="data.db" and p.is_file(): files.add(p.resolve())
                  except OSError: pass
              if len(files)!=1:
                  print("alternative_probe=database_not_identified")
                  return
              dbfile=files.pop()
              root=dbfile.parent.parent
              sys.path.insert(0,str(root/"pb_hooks"))
              import xiaomi_sleep_bridge as b
              db=sqlite3.connect(f"file:{dbfile}?mode=ro",uri=True)
              rows=db.execute("SELECT user_id FROM sleep_sync_connections WHERE provider='xiaomi' AND enabled=1").fetchall()
              if len(rows)!=1:
                  print("alternative_probe=connection_not_unique")
                  return
              token=root/"pb_data"/"xiaomi_sleep"/(rows[0][0]+".token.json")
              if not token.is_file():
                  print("alternative_probe=missing_token")
                  return
              now=int(datetime.now(timezone.utc).timestamp())
              with tempfile.TemporaryDirectory(prefix="lifeos-xiaomi-probe-") as temp:
                  copy=Path(temp)/"token.json"
                  shutil.copyfile(token,copy)
                  os.chmod(copy,0o600)
                  uid=int(json.loads(copy.read_text())["user_id"])
                  async def query():
                      result,stats=await b._probe_region(copy,uid,"https://ru.hlth.xiaomiwear.com",now-15*86400,now+3600,30)
                      end=b._latest_end_epoch(result)
                      latest=datetime.fromtimestamp(end,timezone.utc).date().isoformat() if end else "none"
                      recent=sum(1 for item in result.values() if item.get("end","")[:10] > "2026-11-21")
                      print("alternative_probe=completed",flush=True)
                      print(f"alternative_sessions={len(result)}",flush=True)
                      print(f"alternative_recent_sessions={recent}",flush=True)
                      print(f"alternative_latest_day={latest}",flush=True)
                      print(f"alternative_success_requests={stats['success']}",flush=True)
                      print(f"alternative_error_types={sorted(set(stats['errors']))}",flush=True)
                  asyncio.run(query())
          try:
              main()
          except Exception as exc:
              print("alternative_probe_error="+type(exc).__name__)
          PY
