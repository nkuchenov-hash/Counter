name: Xiaomi independent network check
on:
  push:
    branches: ['diagnostic/xiaomi-network-20261125']
    paths: ['.github/workflows/xiaomi-network-check.yml']
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public DNS and TLS endpoints without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import socket, ssl, concurrent.futures, time
          hosts = ['ru.hlth.io.mi.com','ru.hlth.xiaomiwear.com','ru.watch.iot.mi.com','de.hlth.io.mi.com','hlth.io.mi.com','sg.hlth.io.mi.com']
          def probe(host):
              try:
                  addresses = socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
                  print(host, 'DNS', sorted({r[4][0] for r in addresses}), flush=True)
              except OSError as e:
                  print(host, 'DNS', type(e).__name__, flush=True)
                  return
              for family, kind, proto, _, addr in dict.fromkeys(addresses):
                  try:
                      with socket.socket(family,kind,proto) as sock:
                          sock.settimeout(8)
                          start=time.monotonic()
                          sock.connect(addr)
                          tcp=int((time.monotonic()-start)*1000)
                          with ssl.create_default_context().wrap_socket(sock,server_hostname=host):
                              print(host, addr[0], 'TCP', tcp, 'TLS OK',flush=True)
                  except OSError as e:
                      print(host, addr[0], type(e).__name__, flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              list(ex.map(probe,hosts))
          PY
