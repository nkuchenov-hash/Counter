name: Xiaomi independent network check
on:
  push:
    branches: ['diagnostic/xiaomi-network-20261125']
    paths: ['.github/workflows/xiaomi-network-check.yml']
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read final live sleep status without changing server configuration
        env:
          LIFEOS_SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          LIFEOS_SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
          LIFEOS_SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          host=137.22.146.109
          port="${LIFEOS_SSH_PORT:-22}"
          user="${LIFEOS_SSH_USER:-root}"
          install -d -m 700 "$HOME/.ssh"
          key="$RUNNER_TEMP/lifeos_network_probe"
          trap 'rm -f "$key"' EXIT
          test -n "$LIFEOS_SSH_PRIVATE_KEY"
          printf '%s\n' "$LIFEOS_SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -T 8 -p "$port" -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes "$user@$host" 'if [ "$(id -u)" = 0 ]; then exec bash -s; else exec sudo -n bash -s; fi' <<'REMOTE'
          set -euo pipefail
          pid="$(systemctl show lifeos-recovery-live.service -p MainPID --value)"
          python3 - "$pid" <<'PY'
          import os, sqlite3, sys
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          files=set()
          for fd in Path("/proc",sys.argv[1],"fd").iterdir():
              try:
                  p=Path(os.readlink(fd))
                  if p.name=="data.db" and p.is_file(): files.add(p.resolve())
              except OSError: pass
          if len(files)!=1: raise SystemExit("active_database_not_identified")
          db=sqlite3.connect(f"file:{files.pop()}?mode=ro",uri=True)
          db.row_factory=sqlite3.Row
          r=db.execute("SELECT user_id,status,last_error,last_sync_at,last_sync_local_day,last_session_count,last_imported_count,enabled FROM sleep_sync_connections WHERE provider='xiaomi' AND enabled=1").fetchone()
          if not r: raise SystemExit("missing_connection")
          p=db.execute("SELECT timezone_offset FROM profiles WHERE id=?",(r["user_id"],)).fetchone()
          offset=float(p["timezone_offset"] or 0) if p else 0
          now=datetime.now(timezone.utc)+timedelta(hours=offset)
          error=r["last_error"] or ""
          print("status="+str(r["status"]))
          print("error_class="+("missing_expected_sleep" if "xiaomi_sleep_not_available_today" in error else "none" if not error else "other"))
          print("profile_day="+now.date().isoformat())
          print("last_sync_local_day="+str(r["last_sync_local_day"]))
          print("auto_sync_enabled="+str(bool(r["enabled"])).lower())
          print("last_session_count="+str(r["last_session_count"]))
          print("last_imported_count="+str(r["last_imported_count"]))
          print("latest_sleep_day="+str(db.execute("SELECT date(max(end_time)) FROM records WHERE user_id=? AND (sleep_source='xiaomi' OR external_source='xiaomi')",(r["user_id"],)).fetchone()[0]))
          PY
          REMOTE
