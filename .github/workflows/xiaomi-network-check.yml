name: Xiaomi independent network check
on:
  push:
    branches: ['diagnostic/xiaomi-network-20261125']
    paths: ['.github/workflows/xiaomi-network-check.yml']
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public DNS and TLS endpoints without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import socket, ssl, concurrent.futures, time
          hosts = ['ru.hlth.io.mi.com','ru.hlth.xiaomiwear.com','ru.watch.iot.mi.com','de.hlth.io.mi.com','hlth.io.mi.com','sg.hlth.io.mi.com']
          def probe(host):
              try:
                  addresses = socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
                  print(host, 'DNS', sorted({r[4][0] for r in addresses}), flush=True)
              except OSError as e:
                  print(host, 'DNS', type(e).__name__, flush=True)
                  return
              for family, kind, proto, _, addr in dict.fromkeys(addresses):
                  try:
                      with socket.socket(family,kind,proto) as sock:
                          sock.settimeout(8)
                          start=time.monotonic()
                          sock.connect(addr)
                          tcp=int((time.monotonic()-start)*1000)
                          with ssl.create_default_context().wrap_socket(sock,server_hostname=host):
                              print(host, addr[0], 'TCP', tcp, 'TLS OK',flush=True)
                  except OSError as e:
                      print(host, addr[0], type(e).__name__, flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              list(ex.map(probe,hosts))
          PY

      - name: Compare identical public addresses from LIFE OS server
        env:
          LIFEOS_SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          LIFEOS_SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
          LIFEOS_SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          host=137.22.146.109
          port="${LIFEOS_SSH_PORT:-22}"
          user="${LIFEOS_SSH_USER:-root}"
          install -d -m 700 "$HOME/.ssh"
          key="$RUNNER_TEMP/lifeos_network_probe"
          trap 'rm -f "$key"' EXIT
          test -n "$LIFEOS_SSH_PRIVATE_KEY"
          printf '%s\n' "$LIFEOS_SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -T 8 -p "$port" -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$key" -p "$port" -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes "$user@$host" 'python3 -' <<'PY'
          import socket, ssl, concurrent.futures, time
          hosts = {
              'ru.hlth.io.mi.com': ['107.155.52.38','107.155.53.125','107.155.53.34','169.197.117.177'],
              'ru.hlth.xiaomiwear.com': ['107.155.53.109','107.155.53.111'],
              'ru.watch.iot.mi.com': ['107.155.52.38','107.155.53.125','107.155.53.34','169.197.117.177'],
              'de.hlth.io.mi.com': [],
          }
          context = ssl.create_default_context()
          jobs = set()
          for host, comparison in hosts.items():
              try:
                  addresses = sorted({r[4][0] for r in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
                  print('VPS DNS',host,addresses,flush=True)
                  for addr in addresses + comparison:
                      jobs.add((host,addr))
              except OSError as e:
                  print('VPS DNS',host,type(e).__name__,flush=True)
                  for addr in comparison:
                      jobs.add((host,addr))
          def probe(job):
              host, ip = job
              phase='tcp'
              try:
                  start=time.monotonic()
                  with socket.create_connection((ip,443),timeout=8) as sock:
                      tcp=int((time.monotonic()-start)*1000)
                      phase='tls'
                      with context.wrap_socket(sock,server_hostname=host) as secure:
                          tls=int((time.monotonic()-start)*1000)
                          phase='http'
                          secure.sendall(('GET /app/v1/data/get_fitness_data_by_time HTTP/1.1\r\nHost: '+host+'\r\nConnection: close\r\n\r\n').encode('ascii'))
                          line=secure.recv(128).split(b'\r\n',1)[0].decode('ascii','replace')
                          if not line.startswith('HTTP/'): line='no_http_status'
                          print('VPS',host,ip,'tcp_ms',tcp,'tls_ms',tls,line,flush=True)
              except OSError as e:
                  print('VPS',host,ip,phase,type(e).__name__,flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              list(pool.map(probe,sorted(jobs)))
          PY
