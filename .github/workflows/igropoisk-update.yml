name: Update Igropoisk content

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [gh-pages]
    paths:
      - "igropoisk/scripts/**"
      - "igropoisk/package.json"
      - ".github/workflows/igropoisk-update.yml"

permissions:
  contents: write

concurrency:
  group: igropoisk-content-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: igropoisk/package-lock.json

      - name: Install collector dependencies
        working-directory: igropoisk
        run: npm install --no-audit --no-fund

      - name: Collect games, screenshots, ratings and articles
        run: npm --prefix igropoisk run update

      - name: Validate generated database quality
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = './igropoisk/data/catalog.json';
          if (!fs.existsSync(p)) throw new Error('catalog.json was not generated');
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!Array.isArray(d.games) || d.games.length === 0) throw new Error('catalog is empty');
          const invalid = d.games.filter(g => !g.title || !(g.appid || g.igdbId || g.rawgId) || !(g.headerImage || g.capsuleImage || g.poster));
          if (invalid.length > Math.max(10, d.games.length * 0.1)) throw new Error(`too many incomplete games: ${invalid.length}`);
          console.log(`Validated ${d.games.length} quality-filtered games`);
          NODE

      - name: Commit refreshed data
        run: |
          git config user.name "igropoisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add igropoisk/data igropoisk/package-lock.json
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Update Igropoisk content"
          git push origin gh-pages
