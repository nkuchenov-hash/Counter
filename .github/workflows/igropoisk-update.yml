name: Update Igropoisk catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'igropoisk/.collector-trigger'
      - 'igropoisk/scripts/**'
      - 'igropoisk/package.json'
      - '.github/workflows/igropoisk-update.yml'

permissions:
  contents: write

concurrency:
  group: igropoisk-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout published site branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install collector dependencies
        working-directory: igropoisk
        run: npm install --no-audit --no-fund

      - name: Collect games and materials
        run: npm --prefix igropoisk run update

      - name: Validate catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('./igropoisk/data/catalog.json','utf8'));
          if(!Array.isArray(d.games)||d.games.length<80||d.games.length>220)throw new Error(`Invalid catalog size: ${d.games?.length||0}`);
          const invalid=d.games.filter(g=>!g.appid||!g.title||!g.description||!g.releaseDate||!g.capsuleImage||!g.heroImage||!Array.isArray(g.screenshots)||g.screenshots.length<2);
          if(invalid.length)throw new Error(`Incomplete games: ${invalid.slice(0,10).map(g=>g.title).join(', ')}`);
          console.log(`Validated ${d.games.length} games`);
          NODE

      - name: Commit refreshed data
        run: |
          git config user.name "igropoisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add igropoisk/data igropoisk/package-lock.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update Igropoisk catalog"
          git push origin HEAD:gh-pages
