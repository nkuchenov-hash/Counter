name: Update Igropoisk catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [gh-pages]
    paths:
      - "igropoisk/scripts/**"
      - "igropoisk/package.json"
      - ".github/workflows/igropoisk-update.yml"

permissions:
  contents: write

concurrency:
  group: igropoisk-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install collector dependencies
        working-directory: igropoisk
        run: npm install --no-audit --no-fund

      - name: Collect and normalize catalog
        run: npm --prefix igropoisk run update

      - name: Validate generated catalog
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('./igropoisk/data/catalog.json', 'utf8'));
          const articles = JSON.parse(fs.readFileSync('./igropoisk/data/articles.json', 'utf8'));
          if (!Array.isArray(catalog.games) || catalog.games.length < 80) {
            throw new Error(`Catalog is too small: ${catalog.games?.length || 0}`);
          }
          if (catalog.games.length > 220) throw new Error(`Catalog is unexpectedly large: ${catalog.games.length}`);
          const invalid = catalog.games.filter(g =>
            !g.appid || !g.title || !g.description || !g.releaseDate ||
            !Array.isArray(g.genres) || !g.genres.length ||
            !Array.isArray(g.screenshots) || g.screenshots.length < 2 ||
            !g.capsuleImage || !g.heroImage || !Array.isArray(g.sourceEvidence) || g.sourceEvidence.length < 2
          );
          if (invalid.length) throw new Error(`Incomplete games: ${invalid.slice(0, 10).map(g => g.title).join(', ')}`);
          if (!Array.isArray(articles.articles)) throw new Error('articles.json is invalid');
          console.log(`Validated ${catalog.games.length} games and ${articles.articles.length} materials`);
          NODE

      - name: Commit refreshed data
        run: |
          git config user.name "igropoisk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add igropoisk/data igropoisk/package-lock.json
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "Update Igropoisk catalog"
          git push origin HEAD:gh-pages
