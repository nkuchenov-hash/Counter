name: Temporary desktop section chrome unification

on:
  push:
    branches:
      - fix/desktop-section-chrome-unification-20260904

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-section-chrome-unification-20260904
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/tmp_desktop_section_chrome_unification.py
      - name: Remove temporary files
        run: |
          git rm scripts/tmp_desktop_section_chrome_unification.py
          git rm .github/workflows/tmp-desktop-section-chrome-unification.yml
      - name: Verify obsolete category edit mode is gone
        run: |
          ! grep -R "_categoryEditMode\|CategoryDragData\|editMode:" lib/features/settings/categories
      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Restore generated/untracked environment state
        run: |
          git checkout -- pubspec.lock
          rm -f lib/core/env/env.dart
      - name: Format changed Dart
        run: |
          dart format \
            lib/core/widgets/compact_nav_controls.dart \
            lib/app/shell/shared/shell_chrome.dart \
            lib/features/planning/widgets/planning_filter_controls.dart \
            lib/features/planning/planning_page.dart \
            lib/features/timeline/timeline_header_controls.dart \
            lib/features/paths/paths_page.dart \
            lib/features/settings/categories/category_list_view.dart \
            lib/features/settings/categories/category_row_widget.dart
      - name: Recreate env.dart for analyze and build
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
      - name: Analyze changed Dart
        run: |
          flutter analyze --no-fatal-infos \
            lib/core/widgets/compact_nav_controls.dart \
            lib/app/shell/shared/shell_chrome.dart \
            lib/features/planning/widgets/planning_filter_controls.dart \
            lib/features/planning/planning_page.dart \
            lib/features/timeline/timeline_header_controls.dart \
            lib/features/paths/paths_page.dart \
            lib/features/settings/categories/category_list_view.dart \
            lib/features/settings/categories/category_row_widget.dart
      - name: Remove env stub before repository checks
        run: rm -f lib/core/env/env.dart
      - name: Verify documentation parity
        run: python scripts/audit/documentation_parity.py
      - name: Check whitespace
        run: git diff --check
      - name: Recreate env.dart and build release web
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
          rm -f lib/core/env/env.dart
      - name: Commit final change
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          git add -A
          git commit -m "Unify desktop section chrome and quick entry rows"
          git push origin HEAD:fix/desktop-section-chrome-unification-20260904
