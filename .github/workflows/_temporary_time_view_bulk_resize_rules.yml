name: Temporary Time View bulk and resize rules

on:
  push:
    branches:
      - fix/time-view-bulk-relative-time-and-resize-cascade
    paths:
      - '.github/workflows/_temporary_time_view_bulk_resize_rules.yml'
      - 'tools/apply_time_view_bulk_resize_rules.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_temporary_time_view_bulk_resize_rules.yml'
      - 'tools/apply_time_view_bulk_resize_rules.py'
      - 'lib/data/plan_time_sequential_cascade.dart'
      - 'lib/features/planning/time_view/time_view_resize_controller.dart'
      - 'lib/features/planning/time_view/time_view_card_layer.dart'
      - 'test/time_view_bulk_resize_rules_test.dart'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/time-view-bulk-relative-time-and-resize-cascade

      - name: Restore production files from main
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            lib/data/plan_time_sequential_cascade.dart \
            lib/features/planning/time_view/time_view_resize_controller.dart \
            lib/features/planning/time_view/time_view_card_layer.dart

      - name: Apply scheduling rules
        run: python3 tools/apply_time_view_bulk_resize_rules.py

      - name: Tighten resize chain and test fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cascade_path = Path('lib/data/plan_time_sequential_cascade.dart')
          cascade = cascade_path.read_text(encoding='utf-8')
          old = """    final hadExplicitEnd = task.endDateTime != null;
    final shiftedStart = originalStart.isBefore(cursorEnd)
        ? cursorEnd
        : originalStart;
    final effectiveEnd = shiftedStart.add(Duration(minutes: duration));

    if (shiftedStart != originalStart) {
      changedById[task.planRowIdForBackend] = task.copyWith(
        startTime: shiftedStart,
        endDateTime: hadExplicitEnd ? effectiveEnd : null,
        clearEnd: !hadExplicitEnd,
      );
    }
    cursorEnd = effectiveEnd;
"""
          new = """    if (!originalStart.isBefore(cursorEnd)) break;
    final hadExplicitEnd = task.endDateTime != null;
    final shiftedStart = cursorEnd;
    final effectiveEnd = shiftedStart.add(Duration(minutes: duration));
    changedById[task.planRowIdForBackend] = task.copyWith(
      startTime: shiftedStart,
      endDateTime: hadExplicitEnd ? effectiveEnd : null,
      clearEnd: !hadExplicitEnd,
    );
    cursorEnd = effectiveEnd;
"""
          if new not in cascade:
              if cascade.count(old) != 1:
                  raise SystemExit('resize chain anchor mismatch')
              cascade = cascade.replace(old, new, 1)
          cascade_path.write_text(cascade, encoding='utf-8', newline='\n')

          test_path = Path('test/time_view_bulk_resize_rules_test.dart')
          test = test_path.read_text(encoding='utf-8')
          old_id = "    planRowId: id,\n"
          new_id = "    planRowId: id,\n    pocketRecordId: id,\n"
          if new_id not in test:
              if test.count(old_id) != 1:
                  raise SystemExit('test fixture planRowId anchor mismatch')
              test = test.replace(old_id, new_id, 1)

          old_tail = """      _task('d', 13, 0, 13, 30, order: 3),
    ];
"""
          new_tail = """      _task('d', 13, 0, 13, 30, order: 3),
      _task('e', 13, 15, 13, 45, order: 4),
    ];
"""
          if new_tail not in test:
              if test.count(old_tail) != 1:
                  raise SystemExit('resize gap fixture anchor mismatch')
              test = test.replace(old_tail, new_tail, 1)

          old_assert = """    expect(_byId(result, 'd').startTime,
        DateTime(2026, 7, 24, 13));
"""
          new_assert = """    expect(_byId(result, 'd').startTime,
        DateTime(2026, 7, 24, 13));
    expect(_byId(result, 'e').startTime,
        DateTime(2026, 7, 24, 13, 15));
"""
          if new_assert not in test:
              if test.count(old_assert) != 1:
                  raise SystemExit('resize gap assertion anchor mismatch')
              test = test.replace(old_assert, new_assert, 1)
          test_path.write_text(test, encoding='utf-8', newline='\n')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format focused test only
        run: dart format test/time_view_bulk_resize_rules_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused tests
        id: focused_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test test/time_view_bulk_resize_rules_test.dart 2>&1 | tee /tmp/time_view_test_output.txt

      - name: Persist failure details
        if: steps.focused_tests.outcome == 'failure'
        shell: bash
        run: |
          cp /tmp/time_view_test_output.txt tools/_time_view_test_failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/_time_view_test_failure.txt
          git commit -m 'ci: capture Time View focused test failure'
          git push origin HEAD:fix/time-view-bulk-relative-time-and-resize-cascade
          exit 1

      - name: Check whitespace
        if: steps.focused_tests.outcome == 'success'
        run: git diff --check

      - name: Commit verified fix
        if: steps.focused_tests.outcome == 'success'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/data/plan_time_sequential_cascade.dart \
            lib/features/planning/time_view/time_view_resize_controller.dart \
            lib/features/planning/time_view/time_view_card_layer.dart \
            test/time_view_bulk_resize_rules_test.dart
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'fix: preserve bulk times and cascade resize overlaps'
          git push origin HEAD:fix/time-view-bulk-relative-time-and-resize-cascade
