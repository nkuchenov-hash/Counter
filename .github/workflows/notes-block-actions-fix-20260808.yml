name: Apply Notes block actions fix

on:
  push:
    branches:
      - fix/notes-block-actions-20260808

permissions:
  contents: write

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Notes block actions and drawing preview
        run: |
          echo '' | base64 -d > /tmp/patch_notes.py
          python /tmp/patch_notes.py

      - name: Repair stale Notes test fixture
        run: |
          echo '' | base64 -d > /tmp/patch_notes_test.py
          python /tmp/patch_notes_test.py

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed files
        run: dart format lib/features/notes/note_editor_page.dart test/notes_canonical_components_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify focused Notes contracts
        run: |
          grep -q "notes-block-delete-" lib/features/notes/note_editor_page.dart
          grep -q "_desktopDrawingPreview" lib/features/notes/note_editor_page.dart
          grep -q "base64Decode(encoded)" lib/features/notes/note_editor_page.dart
          grep -q "Image.memory(" lib/features/notes/note_editor_page.dart
          grep -q "editing: false" test/notes_canonical_components_test.dart

      - name: Build web release
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run

      - name: Commit verified fix to main
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov@gmail.com"
          git add lib/features/notes/note_editor_page.dart test/notes_canonical_components_test.dart
          git diff --cached --check
          git commit -m "Show Notes block delete action and drawing preview"
          git push origin HEAD:main
