name: Apply Notes block actions fix

on:
  push:
    branches:
      - fix/notes-block-actions-20260808

permissions:
  contents: write

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Notes block actions and drawing preview
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/features/notes/note_editor_page.dart')
          text = path.read_text(encoding='utf-8')

          old_import = "import 'dart:async';\n"
          new_import = "import 'dart:async';\nimport 'dart:convert';\n"
          if "import 'dart:convert';" not in text:
              if old_import not in text:
                  raise SystemExit('dart:async import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old = '''  Widget _buildBlock(BuildContext context, int index) {
    final block = _editor.visibleBlocks[index];
    final editable = NotesEditorDocumentController.isEditableText(block.type);
    final focusNode = editable ? _focusNodeFor(block) : null;
    return NotesEditorBlockItem(
      block: block,
      index: index,
      numberedOrdinal: _numberedOrdinal(index),
      active: _editor.activeBlockId == block.id,
