name: Temporary planner runtime baseline repair

on:
  push:
    branches:
      - fix/planner-runtime-baseline
    paths:
      - '.github/scripts/temp_planner_runtime_baseline.py'
      - '.github/workflows/temp-planner-runtime-baseline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-runtime-baseline
          fetch-depth: 0

      - name: Apply runtime repair
        run: python3 .github/scripts/temp_planner_runtime_baseline.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Architecture guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - run: flutter pub get
      - run: flutter test test/daily_routine_contract_test.dart
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Commit product repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/shell/app_shell.dart lib/app/shell/shared/shell_daily_routine.dart lib/app/shell/shared/shell_path_governance.dart test/daily_routine_contract_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Run planner baseline repair at startup'
            git pull --rebase origin fix/planner-runtime-baseline
            git push origin HEAD:fix/planner-runtime-baseline
          fi
