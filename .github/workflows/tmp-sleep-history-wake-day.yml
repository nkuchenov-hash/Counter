name: One-time continuous sleep wake-day projection

on:
  push:
    paths:
      - '.github/workflows/tmp-sleep-history-wake-day.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align continuous history sleep date
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/timeline/timeline_continuous_history.dart')
          text = path.read_text(encoding='utf-8')
          import_marker = "import 'package:counter/features/timeline/timeline_record_card.dart';\n"
          sleep_import = "import 'package:counter/features/timeline/timeline_sleep_details.dart';\n"
          if sleep_import not in text:
              text = text.replace(import_marker, import_marker + sleep_import, 1)
          text = text.replace(
              '/// owns a pinned date header, so the date is always visible and naturally\n/// changes as the next day reaches the top. Sleep is intentionally not filtered\n/// here: Timeline is the complete life record, while Stats may use a waking-day\n/// projection.\n',
              '/// owns a pinned date header, so the date is always visible and naturally\n/// changes as the next day reaches the top. Overnight sleep is projected onto\n/// its wake day, matching the canonical daily Timeline presentation.\n',
              1,
          )
          old = '''  List<Map<String, dynamic>> _recordsFor(DateTime date) {\n    return DatabaseService.instance.peekTimelineRecordsForDate(date);\n  }\n'''
          new = '''  List<Map<String, dynamic>> _recordsFor(DateTime date) {\n    final db = DatabaseService.instance;\n    final startDayRecords = db.peekTimelineRecordsForDate(date);\n    final priorStartDayRecords = <Map<String, dynamic>>[];\n    for (var daysBack = 1; daysBack <= 2; daysBack++) {\n      priorStartDayRecords.addAll(\n        db.peekTimelineRecordsForDate(date.subtract(Duration(days: daysBack))),\n      );\n    }\n    return timelineProjectRecordsToWakeDay(\n      targetDateKey: _dateKey(date),\n      startDayRecords: startDayRecords,\n      priorStartDayRecords: priorStartDayRecords,\n    );\n  }\n'''
          if old not in text:
              raise SystemExit('continuous records marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and publish
        run: |
          rm .github/workflows/tmp-sleep-history-wake-day.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/timeline/timeline_continuous_history.dart .github/workflows/tmp-sleep-history-wake-day.yml
          git diff --cached --check
          git commit -m "Align sleep date in continuous Timeline"
          git pull --rebase origin main
          git push origin HEAD:main
