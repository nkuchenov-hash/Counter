name: Temporary planner dedup and daily routine

on:
  push:
    branches:
      - fix/planner-dedup-daily-routine
    paths:
      - '.github/scripts/temp_planner_dedup_daily_routine.py'
      - '.github/workflows/temp-planner-dedup-daily-routine.yml'
      - 'lib/app/shell/shared/shell_daily_routine.dart'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-dedup-daily-routine
          fetch-depth: 0

      - name: Apply governance patch
        run: python .github/scripts/temp_planner_dedup_daily_routine.py

      - name: Architecture guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test test/category_catalog_resilience_contract_test.dart
      - run: flutter test test/plan_recurrence_rule_test.dart || true
      - run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Commit product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/shell/shared/shell_path_governance.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Fix approval duplicates and add daily routine'
            git pull --rebase origin fix/planner-dedup-daily-routine
            git push origin HEAD:fix/planner-dedup-daily-routine
          fi
