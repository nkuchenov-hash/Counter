name: Finalize Time View fix

on:
  push:
    branches:
      - agent/fix-time-view-insertion-bulk-drag

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-time-view-insertion-bulk-drag
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply final compatibility-safe patch
        shell: bash
        run: |
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def from_main(path):
              return subprocess.check_output(
                  ['git', 'show', f'origin/main:{path}'], text=True
              )

          # Keep current persistence semantics (including recurrence materialization
          # and write-ahead/outbox behavior), but do not immediately schedule a
          # network refresh while all moved rows are still being persisted.
          planning_path = 'lib/features/planning/time_view/planning_time_view.dart'
          planning = from_main(planning_path)
          pattern = re.compile(
              r'(  void persistTimeViewCascadePatches\(\{.*?\n)'
              r'(    DatabaseService\.instance\.notifyPlanningRefresh\(\);)'
              r'(\n    if \(host\.mounted\) host\.notifySetState\(\(\) \{\}\);\n  \}\n\n)'
              r'(  void persistTimelineDragWithCascade\(\{)',
              re.S,
          )
          planning, count = pattern.subn(
              r'\1    DatabaseService.instance.notifyPlanningRefresh(\n'
              r'      scheduleNetworkRefresh: false,\n'
              r'    );\3\4',
              planning,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'planning persistence patch count={count}, expected 1')
          Path(planning_path).write_text(planning)

          # Start from main so only intended zero-gap geometry changes remain,
          # avoiding formatter-only churn from the earlier verification run.
          layout_path = 'lib/features/planning/plan_time_view_layout.dart'
          layout = from_main(layout_path)
          old = '      return prevBottom + kPlanTimeCardGapPx;'
          if layout.count(old) != 1:
              raise SystemExit(f'adjacent gap match count={layout.count(old)}, expected 1')
          layout = layout.replace(old, '      return prevBottom;', 1)
          gap_pattern = re.compile(
              r'  static double _minPpmForPackedToWallClearance\(\{\n'
              r'    required List<_PlanTimeViewCardSlot> sorted,\n'
              r'  \}\) \{.*?\n'
              r'  \}\n\n'
              r'  static double _resolveGlobalRubberPxPerMinute',
              re.S,
          )
          layout, count = gap_pattern.subn(
              '  static double _minPpmForPackedToWallClearance({\n'
              '    required List<_PlanTimeViewCardSlot> sorted,\n'
              '  }) => 0.0;\n\n'
              '  static double _resolveGlobalRubberPxPerMinute',
              layout,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'packed clearance patch count={count}, expected 1')
          layout = layout.replace(
              'visualGap=${kPlanTimeCardGapPx.toStringAsFixed(0)}',
              'visualGap=0',
              1,
          )
          Path(layout_path).write_text(layout)
          PY

      - name: Verify
        shell: bash
        run: |
          flutter pub get
          flutter test test/auto_plan_nearest_free_slot_test.dart
          flutter test test/auto_plan_no_squeeze_test.dart
          flutter test test/time_view_target_drop_zero_gap_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check

      - name: Commit final source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/planning/time_view/planning_time_view.dart \
            lib/features/planning/plan_time_view_layout.dart
          git commit -m "Finalize Time View persistence and layout"
          git push origin HEAD:agent/fix-time-view-insertion-bulk-drag
