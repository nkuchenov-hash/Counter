name: Temporary fix desktop brand and page headings

on:
  push:
    branches:
      - fix/desktop-shell-brand-page-headings-20260904

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-shell-brand-page-headings-20260904
          fetch-depth: 0
      - name: Apply fix
        run: python scripts/tmp_fix_desktop_brand_page_heading.py
      - name: Remove temporary files
        run: |
          git rm scripts/tmp_fix_desktop_brand_page_heading.py
          git rm .github/workflows/tmp-fix-desktop-brand-page-heading.yml
      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Restore lockfile
        run: git checkout -- pubspec.lock
      - name: Format changed Dart
        run: dart format lib/app/shell/shared/shell_chrome.dart lib/app/shell/desktop/shell_side_navigation.dart
      - name: Analyze shell changes
        run: flutter analyze --no-fatal-infos lib/app/shell/shared/shell_chrome.dart lib/app/shell/desktop/shell_side_navigation.dart
      - name: Verify documentation parity
        run: python scripts/audit/documentation_parity.py
      - name: Check whitespace
        run: git diff --check
      - name: Build release web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
      - name: Commit final fix
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          git add -A
          git commit -m "Restore LIFE OS brand and desktop page headings"
          git push origin HEAD:fix/desktop-shell-brand-page-headings-20260904
