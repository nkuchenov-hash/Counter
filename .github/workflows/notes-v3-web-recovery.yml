name: Notes V3 Web Recovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: notes-v3-web-recovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/notes-v3-design-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Notes branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build browser preview
        run: flutter build web --release --base-href="/Counter/notes-v3-preview/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0

      - name: Install preview
        run: |
          rm -rf published/notes-v3-preview
          mkdir -p published/notes-v3-preview
          cp -R build/web/. published/notes-v3-preview/
          printf '%s\n' "${GITHUB_SHA}" > published/notes-v3-preview/PREVIEW_SOURCE_SHA.txt
          touch published/.nojekyll

      - name: Publish preview subdirectory
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin gh-pages
          git add .nojekyll notes-v3-preview
          if git diff --cached --quiet; then
            echo "Preview already matches this build."
          else
            git commit -m "Deploy verified Notes V3 browser preview from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi

      - name: Verify published preview over HTTPS
        run: |
          URL="https://nkuchenov-hash.github.io/Counter/notes-v3-preview/"
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/preview.html -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && grep -q '/Counter/notes-v3-preview/' /tmp/preview.html; then
              echo "Verified $URL"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code"
            sleep 10
          done
          exit 1
