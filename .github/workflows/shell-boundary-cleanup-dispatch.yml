name: Dispatch shell boundary cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.head_ref == 'agent/shell-boundary-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch cleanup workflow explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run shell-boundary-cleanup.yml --repo nkuchenov-hash/Counter --ref agent/shell-boundary-cleanup
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/shell-boundary-cleanup
          fetch-depth: 0
      - name: Remove dispatcher from branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/shell-boundary-cleanup-dispatch.yml
          git commit -m 'Remove shell cleanup dispatcher'
          git push origin HEAD:agent/shell-boundary-cleanup
