name: Notes V3 Figma Repair

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notes-v3-figma-repair
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/notes-v3-design-system'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Notes branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Apply production Notes routing and layout repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('lib/features/notes/note_editor_page.dart')
          text = page_path.read_text(encoding='utf-8')
          text = text.replace(
              "import 'package:counter/core/widgets/notes/notes_context_row.dart';\n",
              "import 'package:counter/core/widgets/app_button.dart';\n",
          )
          text = text.replace(
              "import 'package:counter/features/notes/notes_glm_surface.dart';\n",
              "import 'package:counter/features/notes/widgets/notes_editor_screen.dart';\n",
          )

          methods_marker = "  @override\n  Widget build(BuildContext context) {"
          if 'Future<void> _deleteCurrentNote()' not in text:
              methods = r'''  void _togglePinned() {
            final brain = DatabaseService.instance;
            brain.toggleNotePin(_task.planRowIdForBackend);
            final cached = brain.getCachedPlanningTaskForEdit(
              _task.planRowIdForBackend,
            );
            if (cached != null && mounted) setState(() => _task = cached);
          }

          Future<void> _deleteCurrentNote() async {
            final loc = currentLocale.value;
            final confirmed = await showDialog<bool>(
              context: context,
              builder: (dialogContext) => AlertDialog(
                title: Text(t(loc, 'delete')),
                actions: [
                  AppButton.ghost(
                    label: t(loc, 'cancel'),
                    size: AppButtonSize.s,
                    onPressed: () => Navigator.of(dialogContext).pop(false),
                  ),
                  AppButton.destructive(
                    label: t(loc, 'delete'),
                    size: AppButtonSize.s,
                    onPressed: () => Navigator.of(dialogContext).pop(true),
                  ),
                ],
              ),
            );
            if (confirmed != true || !mounted) return;
            _gate.flush(() {});
            _dirty = false;
            await DatabaseService.instance.deleteNote(
              _task.planRowIdForBackend,
            );
            if (mounted) Navigator.of(context).pop();
          }

          '''
              if methods_marker not in text:
                  raise SystemExit('note editor build marker missing')
              text = text.replace(methods_marker, methods + methods_marker, 1)

          build_start = text.index(methods_marker)
          build_end_marker = "\n}\n\nbool _sameRuns"
          build_end = text.index(build_end_marker, build_start)
          new_build = r'''  @override
          Widget build(BuildContext context) {
            final loc = currentLocale.value;
            final activeType = _editor.activeBlock?.type;
            final category = DatabaseService.instance.getCategoryRuleById(
              _task.categoryId,
            );

            return NotesEditorScreen(
              titleController: _titleController,
              titleHint: t(loc, 'notes_v3_editor_title_hint'),
              onTitleChanged: _scheduleSave,
              onDone: _close,
              pinned: DatabaseService.instance.isNotePinned(_task),
              onTogglePinned: _togglePinned,
              onDelete: _deleteCurrentNote,
              categoryLabel: category?.name,
              categoryColor: category?.colorOrDefault,
              tags: [
                for (final tag in _task.tags)
                  NotesEditorMetadataTag(label: tag.name),
              ],
              toolbar: NotesEditorToolbarHost(
                activeBlock: _editor.activeBlock,
                selectionFormats: _selectionFormats(),
                onHeading: _showHeadingMenu,
                onBody: () => _convertActive(NotesBlockConversion.body),
                onFormatting: _showFormattingMenu,
                onQuote: () => _convertActive(NotesBlockConversion.quote),
                onList: () => _convertActive(
                  activeType == NoteBlockType.bulletedList
                      ? NotesBlockConversion.numberedList
                      : NotesBlockConversion.bulletedList,
                ),
                onChecklist: () =>
                    _convertActive(NotesBlockConversion.checklist),
                onTable: () => _showTablePicker(),
                onDrawing: widget.parityPreview
                    ? null
                    : () {
                        final block = _editor.activeBlock;
                        _openDrawing(
                          editBlockId: block?.type == NoteBlockType.drawing
                              ? block!.id
                              : null,
                        );
                      },
                onAudio: widget.parityPreview ? null : _recordAudio,
                onImage: widget.parityPreview
                    ? null
                    : () {
                        final block = _editor.activeBlock;
                        _pickImage(
                          replaceBlockId: block?.type == NoteBlockType.image
                              ? block!.id
                              : null,
                        );
                      },
                onMore: _showActiveBlockOptions,
              ),
              content: ReorderableListView.builder(
                key: const ValueKey('notes-editor-content'),
                padding: EdgeInsets.zero,
                buildDefaultDragHandles: false,
                proxyDecorator: (child, _, __) => child,
                itemCount: _editor.visibleBlocks.length,
                onReorder: (oldIndex, newIndex) => _applyMutation(
                  _editor.reorderVisible(oldIndex, newIndex),
                ),
                itemBuilder: _buildBlock,
              ),
            );
          }'''
          text = text[:build_start] + new_build + text[build_end:]
          page_path.write_text(text, encoding='utf-8')

          tools_path = Path('lib/features/notes/widgets/notes_editor_tools.dart')
          tools = tools_path.read_text(encoding='utf-8')
          tools = tools.replace(
              "import 'package:counter/core/widgets/app_icon_button.dart';\n",
              '',
          )
          old_start = "    if (onMore == null) return toolbar;"
          if old_start in tools:
              start = tools.index(old_start)
              end_marker = "\n  }\n}\n\nFuture<void> showNotesHeadingStylesMenu"
              end = tools.index(end_marker, start)
              replacement = r'''    final showOptions = onMore;
            if (showOptions == null || activeBlock == null) return toolbar;
            return GestureDetector(
              behavior: HitTestBehavior.opaque,
              onLongPress: showOptions,
              onSecondaryTap: showOptions,
              child: toolbar,
            );'''
              tools = tools[:start] + replacement + tools[end:]
          elif 'onSecondaryTap: showOptions' not in tools:
              raise SystemExit('toolbar host replacement marker missing')
          tools_path.write_text(tools, encoding='utf-8')

          test_path = Path('test/notes_canonical_components_test.dart')
          test = test_path.read_text(encoding='utf-8')
          anchor = "      await tester.tap(find.byKey(const ValueKey('notes-toolbar-table')));"
          if "NotesFigmaTokens.toolbarHeight" not in test:
              test = test.replace(
                  "import 'package:counter/features/notes/notes_image_tools.dart';\n",
                  "import 'package:counter/features/notes/notes_figma_tokens.dart';\nimport 'package:counter/features/notes/notes_image_tools.dart';\n",
              )
              assertion = r'''      expect(
                tester.getSize(find.byType(NotesEditorToolbar)),
                const Size(
                  NotesFigmaTokens.toolbarWidth,
                  NotesFigmaTokens.toolbarHeight,
                ),
              );
          '''
              if anchor not in test:
                  raise SystemExit('responsive test anchor missing')
              test = test.replace(anchor, assertion + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Format repaired Notes files
        run: dart format lib/features/notes/note_editor_page.dart lib/features/notes/widgets/notes_editor_screen.dart lib/features/notes/widgets/notes_editor_tools.dart test/notes_canonical_components_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run exactly three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Build production web
        run: flutter build web --release --base-href="/Counter/notes-v3-preview/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/notes/note_editor_page.dart lib/features/notes/widgets/notes_editor_screen.dart lib/features/notes/widgets/notes_editor_tools.dart test/notes_canonical_components_test.dart
          if git diff --cached --quiet; then
            echo "Repair already applied."
          else
            git commit -m "Repair production Notes Figma layout and routing"
            git push origin HEAD:feature/notes-v3-design-system
          fi
