name: One-shot fix planning gap and late timeline v4

on:
  push:
    branches:
      - fix/planning-gap-and-late-timeline-v4

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-gap-and-late-timeline-v4
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Patch planning placement and late-hours window
        run: python .github/scripts/_patch_planning_gap_late_v4.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: dart format lib/shared/time/plan_time_visible_window.dart lib/features/planning/planning_day_start_prefs.dart lib/features/planning/time_view/planning_time_view_coordinator.dart lib/data/plans/plan_time_cascade_helpers.dart test/plan_time_visible_window_test.dart test/auto_plan_nearest_free_slot_test.dart test/planning_timeline_bounds_prefs_test.dart

      - name: Run focused regression tests
        run: flutter test test/auto_plan_nearest_free_slot_test.dart test/plan_time_visible_window_test.dart test/planning_timeline_bounds_prefs_test.dart

      - name: Analyze changed scheduling and timeline sources
        run: flutter analyze lib/data/plans/plan_time_cascade_helpers.dart lib/shared/time/plan_time_visible_window.dart lib/features/planning/planning_day_start_prefs.dart lib/features/planning/time_view/planning_time_view_coordinator.dart

      - name: Remove one-shot helpers
        run: |
          git rm .github/workflows/one-shot-fix-planning-gap-late-timeline-v4.yml
          git rm .github/scripts/_patch_planning_gap_late_v4.py

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix plan gap placement and restore late timeline hours"
          git push origin HEAD:fix/planning-gap-and-late-timeline-v4
