name: Read-only Viktor vault schema audit
on:
  push:
    branches: [diag/viktor-vault-schema-20261021]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - name: Inspect PocketBase schema without reading secrets or records
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_vault_audit
          chmod 600 ~/.ssh/lifeos_vault_audit
          ssh-keyscan -T 8 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/lifeos_vault_audit -o BatchMode=yes -o ConnectTimeout=12 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then
            app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"
          fi
          echo "viktor_hook_present=$(test -f "$app_dir/pb_hooks/viktor.connection.pb.js" && echo yes || echo no)"
          echo "viktor_helper_present=$(test -f "$app_dir/pb_hooks/viktor_vault_helpers.js" && echo yes || echo no)"
          echo "viktor_migration_file_present=$(test -f "$app_dir/pb_migrations/1792533600_viktor_connections.js" && echo yes || echo no)"
          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys, os
          path=sys.argv[1]
          if not os.path.exists(path):
              print('database_exists=no');sys.exit(0)
          db=sqlite3.connect('file:'+path+'?mode=ro', uri=True)
          print('database_exists=yes')
          for name in ['viktor_connections','profiles','_collections','_migrations','_params']:
              exists=db.execute("SELECT count(*) FROM sqlite_master WHERE type='table' AND name=?",(name,)).fetchone()[0]>0
              print('table_'+name+'_exists='+str(exists).lower())
              if exists and name=='viktor_connections':
                  print('vault_column_names='+','.join(r[1] for r in db.execute('PRAGMA table_info(viktor_connections)')))
                  print('vault_record_count='+str(db.execute('SELECT count(*) FROM viktor_connections').fetchone()[0]))
              if exists and name=='_migrations':
                  cols=[r[1] for r in db.execute('PRAGMA table_info(_migrations)')]
                  print('migration_columns='+','.join(cols))
                  if 'file' in cols:
                      present=db.execute("SELECT count(*) FROM _migrations WHERE file LIKE '%viktor_connections%'").fetchone()[0]
                      print('viktor_migration_marked_applied='+str(bool(present)).lower())
              if exists and name=='_collections':
                  cols=[r[1] for r in db.execute('PRAGMA table_info(_collections)')]
                  print('collection_has_viktor='+str(bool(db.execute("SELECT count(*) FROM _collections WHERE name='viktor_connections'").fetchone()[0])).lower() if 'name' in cols else 'unknown')
          print('sqlite_quick_check='+str(db.execute('PRAGMA quick_check').fetchone()[0]))
          PY
          echo "pocketbase_service_active=$(systemctl is-active "$service_name" || true)"
          REMOTE
