          names=["Особняк Милютина","Санта Глория","Чад — костюмы","Особняк Глуховского","Марсала","Крыша 18","Tara Brooch"]
          by_owner={}
          for row in rows:
              by_owner.setdefault(row["user_id"],[]).append(row)
          itineraries=[]
