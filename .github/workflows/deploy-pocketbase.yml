                      jobs.append(inspect(base,copy))
                  results = await asyncio.gather(*jobs,return_exceptions=True)
                  for result in results:
                      if isinstance(result,BaseException):
                          print("xiaomi_probe_worker_error="+type(result).__name__)
          asyncio.run(main())
          XIAOMI_PROBE

          hook_line="$(journalctl -u "$service_name" --since '15 minutes ago' --no-pager 2>/dev/null | grep '\[ETNIKA_HOMEPAGE_PATH_ONCE\]' | tail -1 || true)"
