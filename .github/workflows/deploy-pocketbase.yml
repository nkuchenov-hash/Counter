name: Diagnose Google Fit cloud production

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-pocketbase.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate sleep hooks
        run: |
          node --check pb_hooks/google_fit_sleep_runtime.js
          node --check pb_hooks/google_fit_sleep_recovery.js
          node --check pb_hooks/sleep_sync.pb.js

      - name: Deploy current cloud reader and inspect production
        shell: bash
        run: |
          set -euo pipefail
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          [[ -n "$SSH_PRIVATE_KEY" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          tar -czf /tmp/lifeos-sleep-cloud.tar.gz pb_hooks pb_migrations
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" /tmp/lifeos-sleep-cloud.tar.gz "$SSH_USER@$SSH_HOST:/tmp/lifeos-sleep-cloud.tar.gz"
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$service_name" && -n "$app_dir" && -d "$app_dir" ]]

          fit_env="$app_dir/.lifeos-google-fit.env"
          if [[ ! -f "$fit_env" ]] || ! grep -q '^SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID=' "$fit_env" || ! grep -q '^SLEEP_SYNC_GOOGLE_FIT_CLIENT_SECRET=' "$fit_env"; then
            source_env="$(find "$app_dir" -maxdepth 1 -type f -name '.lifeos-google-*.env' ! -name '.lifeos-google-fit.env' -print -quit)"
            [[ -n "$source_env" ]]
            python3 - "$source_env" /tmp/lifeos-google-fit.env <<'PY'
          import re, sys
          text=open(sys.argv[1], encoding='utf-8').read()
          cid=re.search(r'^SLEEP_SYNC_GOOGLE_[A-Z_]*CLIENT_ID=(.*)$', text, re.M)
          sec=re.search(r'^SLEEP_SYNC_GOOGLE_[A-Z_]*CLIENT_SECRET=(.*)$', text, re.M)
          key=re.search(r'^SLEEP_SYNC_TOKEN_KEY=(.*)$', text, re.M)
          if not cid or not sec: raise SystemExit('existing Google sleep OAuth credentials not found')
          with open(sys.argv[2],'w',encoding='utf-8') as out:
              out.write('SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID='+cid.group(1)+'\n')
              out.write('SLEEP_SYNC_GOOGLE_FIT_CLIENT_SECRET='+sec.group(1)+'\n')
              if key: out.write('SLEEP_SYNC_TOKEN_KEY='+key.group(1)+'\n')
          PY
            $SUDO install -m 600 /tmp/lifeos-google-fit.env "$fit_env"
            rm -f /tmp/lifeos-google-fit.env
          fi

          override_dir="/etc/systemd/system/${service_name}.d"
          $SUDO mkdir -p "$override_dir"
          printf '[Service]\nEnvironmentFile=%s\n' "$fit_env" | $SUDO tee "$override_dir/lifeos-google-fit.conf" >/dev/null
          for f in "$override_dir"/lifeos-google-*.conf; do
            [[ -e "$f" ]] || continue
            [[ "$f" == "$override_dir/lifeos-google-fit.conf" ]] || $SUDO rm -f "$f"
          done

          $SUDO mkdir -p "$app_dir/pb_hooks" "$app_dir/pb_migrations"
          $SUDO tar -xzf /tmp/lifeos-sleep-cloud.tar.gz -C "$app_dir" pb_hooks pb_migrations
          rm -f /tmp/lifeos-sleep-cloud.tar.gz
          $SUDO systemctl stop "$service_name"
          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(sys.argv[1])
          cur=con.cursor()
          cur.execute("UPDATE sleep_sync_connections SET enabled=1,status='connected',last_error='',last_sync_at='' WHERE provider='google_fit' AND length(coalesce(refresh_token_enc,''))>0")
          print('connections_forced='+str(cur.rowcount))
          con.commit(); con.close()
          PY
          $SUDO systemctl daemon-reload
          $SUDO systemctl start "$service_name"
          REMOTE

      - name: Wait for server cron
        run: sleep 95

      - name: Print sanitized cloud result
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"; fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True); con.row_factory=sqlite3.Row
          r=con.execute("SELECT enabled,status,last_error,last_sync_at,last_session_count,last_imported_count,length(coalesce(refresh_token_enc,'')) token_len FROM sleep_sync_connections WHERE provider='google_fit' ORDER BY updated DESC LIMIT 1").fetchone()
          def ec(v):
              s=(v or '').lower()
              if not s:return 'none'
              if 'invalid_grant' in s:return 'invalid_grant'
              if '403' in s or 'scope' in s or 'permission' in s:return 'permission'
              if '401' in s:return 'auth'
              return 'other'
          print('connection='+str(bool(r)).lower())
          if r:
              print('enabled='+str(bool(r['enabled'])).lower())
              print('token='+str(r['token_len']>0).lower())
              print('status='+str(r['status']))
              print('error='+ec(r['last_error']))
              print('synced='+str(bool(r['last_sync_at'])).lower())
              print('sessions='+str(r['last_session_count'] or 0))
              print('imported='+str(r['last_imported_count'] or 0))
          for hours in (36,72):
              n=con.execute("SELECT count(*) FROM records WHERE (title='Sleep' OR title='Сон') AND julianday(end_time) >= julianday('now', ?)",(f'-{hours} hours',)).fetchone()[0]
              print(f'sleep_last_{hours}h={n}')
          con.close()
          PY
          line="$(journalctl -u "$service_name" --since '4 minutes ago' --no-pager 2>/dev/null | grep 'google fit sleep sync complete' | tail -n1 || true)"
          python3 - "$line" <<'PY'
          import re,sys
          s=sys.argv[1]
          for key in ('sessions','segment_points','segment_episodes'):
              m=re.search(r'"'+key+r'"\s*:\s*(\d+)',s)
              print('log_'+key+'='+(m.group(1) if m else 'unknown'))
          PY
          REMOTE
