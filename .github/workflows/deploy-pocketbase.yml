              if not v: return None
              if v.endswith("Z"):v=v[:-1]+"+00:00"
              dt=datetime.fromisoformat(v)
              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc)
          passed=False;checks={}
          if len(itineraries)==1:
