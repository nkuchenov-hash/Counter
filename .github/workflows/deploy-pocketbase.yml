name: Deploy PocketBase hooks and migrations

on:
  pull_request:
    paths:
      - 'pb_hooks/**'
      - 'pb_migrations/**'
      - '.github/workflows/deploy-pocketbase.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      server_changed: ${{ steps.changes.outputs.server_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate main architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/documentation_parity.py
          python scripts/audit/pocketbase_schema_contract.py
          python scripts/audit/deployment_contract.py

      - name: Validate PocketBase JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find pb_hooks pb_migrations -type f -name '*.js' -print0 | sort -z)
          (( ${#files[@]} > 0 ))
          for file in "${files[@]}"; do node --check "$file"; done
          node test/viktor_pocketbase_hook_test.cjs
          node test/viktor_audio_transcribe_hook_test.cjs
          node test/viktor_yandex_voice_hook_test.cjs
          node test/viktor_connection_vault_test.cjs
          node test/viktor_turns_migration_test.cjs
          node test/viktor_thread_context_migration_test.cjs
          node test/viktor_atomic_schedule_hook_test.cjs

      - name: Detect PocketBase bundle changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed=false
          elif [[ "${{ github.event_name }}" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- pb_hooks pb_migrations .github/workflows/deploy-pocketbase.yml; then changed=false; fi
          fi
          echo "SERVER_CHANGED=$changed" >> "$GITHUB_ENV"
          echo "server_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "PocketBase bundle changed: $changed"

  deploy:
    if: github.event_name != 'pull_request' && needs.validate.outputs.server_changed == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pocketbase-production
      cancel-in-progress: false
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-137.22.146.109}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-137.22.146.109}" >> ~/.ssh/known_hosts

      - name: Upload and install PocketBase bundle
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/lifeos-pocketbase-${GITHUB_SHA}.tar.gz"
          tar -czf "$ARCHIVE" pb_hooks pb_migrations
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" "$ARCHIVE" "$SSH_USER@$SSH_HOST:$ARCHIVE"
          echo "PocketBase bundle transferred to configured host."
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' ARCHIVE='$ARCHIVE' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "SSH connected; detecting PocketBase service and working directory."
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          # LIFEOS2's active unit was installed as lifeos-recovery-live.service.
          # Detect it only if systemd confirms that the unit is loaded.
          if [[ -z "$service_name" ]] &&
              [[ "$(systemctl show lifeos-recovery-live.service -p LoadState --value 2>/dev/null || true)" == "loaded" ]]; then
            service_name="lifeos-recovery-live.service"
          fi
          if [[ -z "$service_name" ]]; then
            echo "PocketBase systemd service not found; configure POCKETBASE_SERVICE." >&2
            exit 1
          fi
          service_exec="$(systemctl show "$service_name" -p ExecStart --value 2>/dev/null || true)"
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && "$service_name" == "lifeos-recovery-live.service" ]]; then
            # This recovery unit stores its live database under recovery-candidate
            # even when its PocketBase executable lives at /opt/lifeos/pocketbase.
            candidate="/opt/lifeos/recovery-candidate"
            if [[ "$service_exec" == *"$candidate/pb_data"* &&
                  -f "$candidate/pb_data/data.db" ]]; then
              app_dir="$candidate"
            else
              echo "LIFEOS2 active data path did not match the known recovery-candidate layout; aborting." >&2
              exit 1
            fi
          fi
          if [[ -z "$app_dir" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" || ! -f "$app_dir/pb_data/data.db" ]]; then
            echo "Live PocketBase data.db not found under verified working directory; aborting." >&2
            exit 1
          fi
          pb_binary="$app_dir/pocketbase"
          if [[ ! -x "$pb_binary" && "$service_name" == "lifeos-recovery-live.service" &&
                "$service_exec" == *"/opt/lifeos/pocketbase"* &&
                -x /opt/lifeos/pocketbase ]]; then
            pb_binary="/opt/lifeos/pocketbase"
          fi
          if [[ ! -x "$pb_binary" || "$service_exec" != *"$pb_binary"* ]]; then
            echo "PocketBase executable does not match active service; aborting." >&2
            exit 1
          fi
          echo "Existing PocketBase service, live data path and binary verified; beginning isolated preflight."

          # P0: migrations MUST succeed on a disposable, consistent SQLite
          # snapshot before writing any production hooks/migrations or restarting.
          # A syntax-only JS test could not catch the 2026-10-23 index failure.
          preflight_dir="$(mktemp -d /tmp/lifeos-pb-preflight.XXXXXX)"
          trap '$SUDO rm -rf "$preflight_dir"' EXIT
          mkdir -p "$preflight_dir/pb_data" "$preflight_dir/pb_migrations" "$preflight_dir/empty_hooks"
          tar -xzf "$ARCHIVE" -C "$preflight_dir" pb_migrations
          $SUDO python3 - "$app_dir/pb_data/data.db" "$preflight_dir/pb_data/data.db" <<'PY'
          import os, shutil, sqlite3, sys
          source, destination = sys.argv[1:]
          assert os.path.isfile(source), "Production SQLite data.db missing"
          size = os.path.getsize(source)
          free = shutil.disk_usage(os.path.dirname(destination)).free
          if free < 2 * size + 256 * 1024 * 1024:
              raise SystemExit("Insufficient free space for isolated migration preflight; production unchanged")
          source_db = sqlite3.connect("file:" + source + "?mode=ro", uri=True)
          try:
              snapshot_db = sqlite3.connect(destination)
              try:
                  source_db.backup(snapshot_db, pages=1000, sleep=0.05)
              finally:
                  snapshot_db.close()
          finally:
              source_db.close()
          os.chmod(destination, 0o600)
          print("Consistent SQLite snapshot created for migration preflight")
          PY
          echo "Running isolated PocketBase migration preflight (production untouched)..."
          $SUDO timeout 120s "$pb_binary" migrate up \
            --dir="$preflight_dir/pb_data" \
            --migrationsDir="$preflight_dir/pb_migrations" \
            --hooksDir="$preflight_dir/empty_hooks"
          echo "PocketBase migration preflight passed; proceeding with deployment."
          $SUDO rm -rf "$preflight_dir"
          trap - EXIT

          # The Xiaomi bridge runs in its own Python venv, outside pb_hooks.
          # A recovered/replaced PocketBase host must provision it BEFORE the
          # service is restarted, otherwise Connect Xiaomi fails on every tap.
          # Preserve an existing working venv; do not modify any token files.
          xiaomi_python="/opt/lifeos-xiaomi-sleep/bin/python"
          if ! $SUDO test -x "$xiaomi_python" ||
             ! $SUDO "$xiaomi_python" -c 'from mi_fitness import MiHealthClient, XiaomiAuth' >/dev/null 2>&1; then
            python3 -c 'import sys; assert sys.version_info >= (3, 11), "Xiaomi bridge requires Python >=3.11"'
            if ! $SUDO python3 -m venv /opt/lifeos-xiaomi-sleep; then
              # LIFEOS2 recovery image lacks python3.12-venv/ensurepip.
              # Install only the matching venv package, then retry. Abort
              # before touching production hooks if provisioning still fails.
              command -v apt-get >/dev/null 2>&1 ||
                { echo "python3-venv unavailable and apt-get missing; production unchanged." >&2; exit 1; }
              py_version="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
              $SUDO apt-get update -qq
              $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "python${py_version}-venv"
              $SUDO python3 -m venv /opt/lifeos-xiaomi-sleep
            fi
            $SUDO "$xiaomi_python" -m pip install --disable-pip-version-check --no-input 'mi-fitness==0.2.0'
          fi
          $SUDO "$xiaomi_python" -c 'from mi_fitness import MiHealthClient, XiaomiAuth'
          echo "Xiaomi Python bridge dependency verified; login worker can start."

          # LIFEOS2 recovered services may load Google Fit settings from a
          # systemd EnvironmentFile outside the active PocketBase data folder.
          # Never replace an existing unit override with a nonexistent file.
          fit_env="$app_dir/.lifeos-google-fit.env"
          if [[ ! -f "$fit_env" && -f /opt/lifeos/.lifeos-google-fit.env ]]; then
            fit_env="/opt/lifeos/.lifeos-google-fit.env"
          fi
          fit_available=false
          if [[ -f "$fit_env" ]]; then
            grep -q '^SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID=' "$fit_env" ||
              { echo "Google Fit file is incomplete; preserving the existing unit and aborting." >&2; exit 1; }
            grep -q '^SLEEP_SYNC_GOOGLE_FIT_CLIENT_SECRET=' "$fit_env" ||
              { echo "Google Fit secret is absent; preserving the existing unit and aborting." >&2; exit 1; }
            fit_available=true
          else
            echo "No Google Fit credentials file found in known locations; preserving existing systemd Google Fit configuration."
          fi

          # Generate the server-held AES key ONCE. Never rotate on deploy.
          # Keep it outside git and SQLite, with root-only file permissions.
          vault_dir="/etc/lifeos"
          vault_env="$vault_dir/viktor-vault.env"
          $SUDO install -d -m 700 "$vault_dir"
          if ! $SUDO test -f "$vault_env"; then
            printf 'VIKTOR_VAULT_KEY=%s\n' "$(openssl rand -hex 16)" | $SUDO tee "$vault_env" >/dev/null
            $SUDO chmod 600 "$vault_env"
          fi
          $SUDO grep -Eq '^VIKTOR_VAULT_KEY=[0-9a-f]{32}$' "$vault_env"

          override_dir="/etc/systemd/system/${service_name}.d"
          $SUDO mkdir -p "$override_dir"
          # Keep the previously configured Google Fit unit settings if this
          # recovered host does not have the expected env file.
          if [[ "$fit_available" == true ]]; then
            printf '[Service]\nEnvironmentFile=%s\n' "$fit_env" |
              $SUDO tee "$override_dir/lifeos-google-fit.conf" >/dev/null
          fi
          # Add the Viktor vault without removing any preexisting unit
          # EnvironmentFile settings (Google Fit, OAuth, etc.).
          printf '[Service]\nEnvironmentFile=%s\n' "$vault_env" |
            $SUDO tee "$override_dir/lifeos-viktor-vault.conf" >/dev/null
          echo "Required Viktor vault configured; existing Google Fit environment preserved."

          $SUDO mkdir -p "$app_dir/pb_hooks" "$app_dir/pb_migrations"
          $SUDO tar -xzf "$ARCHIVE" -C "$app_dir" pb_hooks pb_migrations
          rm -f "$ARCHIVE"
          $SUDO systemctl daemon-reload
          $SUDO systemctl restart "$service_name"

          # PocketBase can take several minutes to bind its HTTPS port after
          # a migration/restart. Do not falsely mark a good deployment failed.
          for attempt in {1..120}; do
            health="$(curl -sS -o /dev/null -w '%{http_code}' https://137-22-146-109.sslip.io/api/health || true)"
            route="$(curl -sS -o /dev/null -w '%{http_code}' https://137-22-146-109.sslip.io/api/sleep-sync/status || true)"
            viktor="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' https://137-22-146-109.sslip.io/api/viktor/propose || true)"
            viktor_audio="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' https://137-22-146-109.sslip.io/api/viktor/transcribe || true)"
            viktor_yandex_start="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' https://137-22-146-109.sslip.io/api/viktor/transcribe-yandex || true)"
            viktor_yandex_poll="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' https://137-22-146-109.sslip.io/api/viktor/transcribe-yandex/status || true)"
            viktor_vault_get="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              https://137-22-146-109.sslip.io/api/viktor/connection || true)"
            viktor_vault_save="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -X POST \
              -H 'Content-Type: application/json' \
              --data '{}' https://137-22-146-109.sslip.io/api/viktor/connection || true)"
            if [[ "$health" == "200" &&
                  ( "$route" == "401" || "$route" == "403" ) &&
                  "$viktor" == "401" && "$viktor_audio" == "401" &&
                  "$viktor_yandex_start" == "401" && "$viktor_yandex_poll" == "401" &&
                  "$viktor_vault_get" == "401" && "$viktor_vault_save" == "401" ]]; then exit 0; fi
            sleep 2
          done
          echo "PocketBase failed startup check after 4 minutes (health=$health, viktor_vault_get=$viktor_vault_get, viktor_vault_save=$viktor_vault_save)" >&2
          exit 1
          REMOTE

      - name: Verify Xiaomi sleep and ETNIKA Path in production
        shell: bash
        run: |
          set -euo pipefail
          sleep 95
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" > /tmp/sleep-cloud-result.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi

          hook_line="$(journalctl -u "$service_name" --since '15 minutes ago' --no-pager 2>/dev/null | grep '\[ETNIKA_HOMEPAGE_PATH_ONCE\]' | tail -1 || true)"
          hook_status="no_log"
          case "$hook_line" in
            *"] ok"*) hook_status="ok" ;;
            *"expected exactly one active ETNIKA category"*) hook_status="root_count_error" ;;
            *"multiple ETNIKA homepage child categories"*) hook_status="duplicate_child" ;;
            *"ETNIKA owner is empty"*) hook_status="owner_error" ;;
            *"unique"*|*"UNIQUE"*) hook_status="unique_error" ;;
            *"validation"*|*"Validation"*) hook_status="validation_error" ;;
            *"relation"*|*"Relation"*) hook_status="relation_error" ;;
            *"] error:"*) hook_status="other_error" ;;
          esac
          printf 'etnika_hook_status=%s\n' "$hook_status"

          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import json, sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True); con.row_factory=sqlite3.Row
          r=con.execute("SELECT user_id,enabled,status,last_error,last_sync_at,last_session_count,last_imported_count FROM sleep_sync_connections WHERE provider='xiaomi' LIMIT 1").fetchone()
          def error_class(v):
              s=(v or '').lower()
              if not s:return 'none'
              if 'token' in s or 'authorization' in s or '401' in s:return 'auth'
              if '403' in s or 'permission' in s:return 'permission'
              return 'other'
          print('xiaomi_connection='+str(bool(r)).lower())
          if r:
              print('xiaomi_enabled='+str(bool(r['enabled'])).lower())
              print('xiaomi_status='+str(r['status']))
              print('xiaomi_error='+error_class(r['last_error']))
              print('xiaomi_synced='+str(bool(r['last_sync_at'])).lower())
              print('xiaomi_sessions='+str(r['last_session_count'] or 0))
              print('xiaomi_imported='+str(r['last_imported_count'] or 0))
              legacy=con.execute("SELECT count(*) FROM sleep_sync_connections WHERE user_id=? AND provider IN ('google_fit','google_health') AND enabled=1",(r['user_id'],)).fetchone()[0]
              print('legacy_sleep_providers_enabled='+str(legacy))
          n=con.execute("SELECT count(*) FROM records WHERE sleep_source='xiaomi' OR external_source='xiaomi'").fetchone()[0]
          recent=con.execute("SELECT count(*) FROM records WHERE (sleep_source='xiaomi' OR external_source='xiaomi') AND julianday(end_time) >= julianday('now','-36 hours')").fetchone()[0]
          latest=con.execute("SELECT date(max(end_time)) FROM records WHERE sleep_source='xiaomi' OR external_source='xiaomi'").fetchone()[0]
          aug27=con.execute("SELECT count(*) FROM records WHERE (sleep_source='xiaomi' OR external_source='xiaomi') AND date(end_time)='2026-08-27'").fetchone()[0]
          print('xiaomi_record_count='+str(n))
          print('xiaomi_sleep_last_36h='+str(recent))
          print('xiaomi_latest_sleep_day='+str(latest or 'none'))
          print('xiaomi_has_2026_08_27='+str(aug27>0).lower())

          cats=con.execute("SELECT id,user_id,name,parent_id,is_archived FROM categories").fetchall()
          roots={row['id']:row for row in cats if (row['name'] or '').strip().casefold()=='этника' and not bool(row['is_archived'])}
          print('etnika_active_roots='+str(len(roots)))
          root_paths=[]
          for root in roots.values():
              root_paths.extend(con.execute("SELECT id,path_id FROM paths WHERE user_id=? AND category_link=?",(root['user_id'],root['id'])).fetchall())
          print('etnika_root_path_rows='+str(len(root_paths)))

          all_children=[row for row in cats if row['parent_id'] in roots and (row['name'] or '').strip().casefold()=='обновление основной страницы сайта']
          children=[row for row in all_children if not bool(row['is_archived'])]
          print('etnika_homepage_child_total='+str(len(all_children)))
          print('etnika_homepage_child_matches='+str(len(children)))

          child_paths=[]; stages_count=0; actions_count=0; owner_id=None
          if len(children)==1:
              child=children[0]; owner_id=child['user_id']
              child_paths=con.execute("SELECT id,path_id,active_revision_link FROM paths WHERE user_id=? AND category_link=? AND archived=0",(owner_id,child['id'])).fetchall()
              if len(child_paths)==1:
                  rev=con.execute("SELECT content FROM path_revisions WHERE id=? AND user_id=? AND path_id=?",(child_paths[0]['active_revision_link'],owner_id,child_paths[0]['path_id'])).fetchone()
                  if rev:
                      try: data=json.loads(rev['content']) if isinstance(rev['content'],str) else (rev['content'] or {})
                      except Exception: data={}
                      stages=data.get('stages') or []
                      stages_count=len(stages)
                      actions_count=sum(len((s or {}).get('actions') or []) for s in stages if isinstance(s,dict))
          print('etnika_child_path_rows='+str(len(child_paths)))
          print('etnika_path_stages='+str(stages_count))
          print('etnika_path_actions='+str(actions_count))

          plan_count=0
          if len(roots)==1:
              root=next(iter(roots.values()))
              exact=[f'etnika-homepage-redesign-2026-08-{d:02d}' for d in range(25,32)]
              q=','.join('?' for _ in exact)
              plan_count=con.execute(f"SELECT count(*) FROM plans WHERE user_id=? AND plan_id IN ({q})",(root['user_id'],*exact)).fetchone()[0]
          print('etnika_week_plans='+str(plan_count))
          print('etnika_plans_gate_clean='+str(plan_count==0).lower())

          verified=(len(roots)==1 and len(root_paths)==0 and len(children)==1 and len(child_paths)==1 and stages_count==17 and actions_count==44 and plan_count==0)
          print('etnika_homepage_verified='+str(verified).lower())
          con.close()
          PY
          REMOTE

      # Keep production audit evidence in the successful workflow run,
      # NOT as a new main commit after the validated SHA. Rewriting main
      # here invalidated the exact-sha server-before-web release gate.
      - name: Publish sanitized verification
        uses: actions/upload-artifact@v4
        with:
          name: sleep-cloud-verification
          path: /tmp/sleep-cloud-result.txt
          if-no-files-found: error
          retention-days: 14