  route_proof_20261121:
    # Independent evidence: only a read-only query of the live plans table counts.
    # Save sanitized PASS/FAIL to a separate branch, not to public user data.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    concurrency:
      group: lifeos-route-proof
      cancel-in-progress: false
    env:
