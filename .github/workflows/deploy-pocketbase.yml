name: Diagnose Google Fit cloud production

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-pocketbase.yml'
      - 'pb_hooks/sleep_sync.pb.js'
      - 'pb_hooks/sleep_cloud_probe.js'
      - 'pb_hooks/google_fit_sleep_recovery.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate probe files
        run: |
          node --check pb_hooks/sleep_sync.pb.js
          node --check pb_hooks/sleep_cloud_probe.js
          node --check pb_hooks/google_fit_sleep_recovery.js

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H 217.114.0.201 >> ~/.ssh/known_hosts

      - name: Install temporary embedded probe
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/sleep-probe.tar.gz pb_hooks/sleep_sync.pb.js pb_hooks/sleep_cloud_probe.js pb_hooks/google_fit_sleep_recovery.js
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" /tmp/sleep-probe.tar.gz root@217.114.0.201:/tmp/sleep-probe.tar.gz
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" root@217.114.0.201 \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"; fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$service_name" && -n "$app_dir" && -d "$app_dir/pb_hooks" ]]
          cp "$app_dir/pb_hooks/sleep_sync.pb.js" /tmp/lifeos-sleep-sync.orig
          cp "$app_dir/pb_hooks/google_fit_sleep_recovery.js" /tmp/lifeos-sleep-recovery.orig
          tar -xzf /tmp/sleep-probe.tar.gz -C "$app_dir"
          rm -f /tmp/sleep-probe.tar.gz "$app_dir/pb_hooks/sleep_cloud_probe.pb.js"
          systemctl restart "$service_name"
          REMOTE

      - name: Read Google Fit cloud source freshness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            code="$(curl -sS -o /tmp/probe.json -w '%{http_code}' https://217-114-0-201.sslip.io/api/__lifeos_sleep_cloud_probe_5f7c9a2e || true)"
            if [[ "$code" == "200" ]]; then
              cat /tmp/probe.json
              exit 0
            fi
            sleep 2
          done
          echo "Probe endpoint did not return 200." >&2
          cat /tmp/probe.json 2>/dev/null || true
          exit 1

      - name: Restore production hooks
        if: always()
        shell: bash
        run: |
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" root@217.114.0.201 \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" <<'REMOTE'
          set -u
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"; fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          if [[ -f /tmp/lifeos-sleep-sync.orig ]]; then cp /tmp/lifeos-sleep-sync.orig "$app_dir/pb_hooks/sleep_sync.pb.js"; fi
          if [[ -f /tmp/lifeos-sleep-recovery.orig ]]; then cp /tmp/lifeos-sleep-recovery.orig "$app_dir/pb_hooks/google_fit_sleep_recovery.js"; fi
          rm -f /tmp/lifeos-sleep-sync.orig /tmp/lifeos-sleep-recovery.orig "$app_dir/pb_hooks/sleep_cloud_probe.js" "$app_dir/pb_hooks/sleep_cloud_probe.pb.js"
          [[ -n "$service_name" ]] && systemctl restart "$service_name" || true
          REMOTE
