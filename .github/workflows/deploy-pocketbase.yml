          # SDK logs, account identifiers, tokens or exception messages.
          /opt/lifeos-xiaomi-sleep/bin/python - "$app_dir" <<'XIAOMI_PROBE' 2>/dev/null || echo "xiaomi_probe=failed"
          import asyncio, json, os, shutil, socket, ssl, sqlite3, sys, tempfile, time
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from loguru import logger
          logger.remove()
          root = Path(sys.argv[1])
          sys.path.insert(0, str(root / "pb_hooks"))
          import xiaomi_sleep_bridge as b
          db = sqlite3.connect(f"file:{root / 'pb_data/data.db'}?mode=ro", uri=True)
          row = db.execute("SELECT user_id,last_error FROM sleep_sync_connections WHERE provider='xiaomi' AND enabled=1 LIMIT 1").fetchone()
          if not row:
              print("xiaomi_probe=no_enabled_connection")
              raise SystemExit(0)
          error = row[1] or ""
          known = ("xiaomi_sleep_not_available_today", "XiaomiCloudAuthError", "XiaomiCloudTimeout", "XiaomiCloudUnavailable", "TokenExpiredError")
          print("xiaomi_importer_error=" + next((v for v in known if v in error), "none" if not error else "other"))
          token = root / "pb_data/xiaomi_sleep" / (row[0] + ".token.json")
          if not token.is_file():
              print("xiaomi_probe=missing_token")
              raise SystemExit(0)
          async def inspect(base, copy):
              from mi_fitness import MiHealthClient
              uid = int(json.loads(copy.read_text())["user_id"])
              now = int(datetime.now(timezone.utc).timestamp())
              old = now - 15 * 86400
              recent = now - 36 * 3600
              end = now + 3600
              region = base.split("//", 1)[-1].split(".", 1)[0]
              requests = [
                  ("relative_aggregate","GET", b.XIAOMI_AGGREGATED_PATH, {"relative_uid":uid,"key":"sleep","tag":"daily_report","start_time":old,"end_time":end,"limit":30}),
                  ("legacy_self_raw","POST",b.XIAOMI_SELF_FITNESS_PATH,{"key":"sleep","start_time":old,"end_time":end,"limit":30}),
                  ("legacy_self_aggregate","POST",b.XIAOMI_SELF_AGGREGATED_PATH,{"key":"sleep","tag":"daily_report","start_time":old,"end_time":end,"limit":30}),
                  ("relative_raw","GET", b.XIAOMI_FITNESS_PATH, {"relative_uid":uid,"key":"sleep","start_time":old,"end_time":end,"limit":30}),
                  ("relative_latest","GET", b.XIAOMI_LATEST_PATH, {"relative_uid":uid}),
                  ("self_raw","POST",b.XIAOMI_SELF_FITNESS_PATH,{"data":json.dumps({"key":"sleep","startTime":recent*1000,"endTime":end*1000,"reverse":True,"next_key":None})}),
                  ("self_raw_get","GET",b.XIAOMI_SELF_FITNESS_PATH,{"data":json.dumps({"key":"sleep","startTime":recent*1000,"endTime":end*1000,"reverse":True,"next_key":None})}),
                  ("self_aggregate_get","GET",b.XIAOMI_SELF_AGGREGATED_PATH,{"data":json.dumps({"key":"sleep","tag":"daily_report","startTime":old*1000,"endTime":end*1000,"reverse":True,"cursor":None})}),
                  ("self_aggregate","POST",b.XIAOMI_SELF_AGGREGATED_PATH,{"data":json.dumps({"key":"sleep","tag":"daily_report","startTime":old*1000,"endTime":end*1000,"reverse":True,"cursor":None})}),
                  ("self_daily_fitness","POST",b.XIAOMI_SELF_AGGREGATED_PATH,{"data":json.dumps({"key":"sleep","tag":"daily_fitness","startTime":old*1000,"endTime":end*1000,"reverse":True,"cursor":None})}),
              ]
              async with MiHealthClient.from_token(copy, base_url=base) as client:
                  for label, method, endpoint, params in requests:
                      try:
                          response = await asyncio.wait_for(client._request(method,endpoint,params=params), timeout=12)
                          rows = b._rows_from_response(response)
                          if label == "relative_latest":
                              rows = [r for r in rows if isinstance(r,dict) and r.get("key")=="sleep"]
                          sessions = b._sessions_from_rows(rows)
                          latest = b._latest_end_epoch(sessions)
                          day = datetime.fromtimestamp(latest,timezone.utc).date().isoformat() if latest else "none"
                          print(f"xiaomi_probe {region} {label} rows={len(rows)} sessions={len(sessions)} latest_day={day}", flush=True)
                          if rows and not sessions:
                              # Report only field names from this fixed schema
                              # vocabulary and counts, never raw data or IDs.
                              fields = {"bedtime","bed_time","bedTime","wake_up_time","device_wake_up_time","wakeUpTime","deviceWakeUpTime","start","end","start_time","end_time","startTime","endTime","time","duration","sleep_duration","sleep_stage","stage","type","status","segment_details","segmentDetails","items","sleep","sleep_data","sleepData","data","value","key","data_type","sleep_deep_duration","sleep_light_duration","sleep_rem_duration","sleep_awake_duration"}
                              kinds, shapes, values, depths = Counter(), Counter(), Counter(), Counter()
                              def visit(node, level=0):
                                  if level > 4:
                                      return
                                  node = b._decode_value(node)
                                  if isinstance(node, dict):
                                      shapes.update([",".join(sorted(set(node) & fields)) or "other_fields"])
                                      depths.update([level])
                                      for k in ("value","items","segment_details","segmentDetails","sleep","sleep_data","sleepData","data"):
                                          if k in node:
                                              visit(node[k],level+1)
                                  elif isinstance(node,list):
                                      for child in node[:20]:
                                          visit(child,level+1)
                              for record in rows:
                                  if not isinstance(record,dict):
                                      kinds.update(["non_object"])
                                      continue
                                  kind = str(record.get("key") or record.get("data_type") or "").lower()
                                  kinds.update(["sleep" if kind=="sleep" else "missing" if not kind else "other"])
                                  values.update([type(b._decode_value(record.get("value"))).__name__])
                                  visit(record)
                              print(f"xiaomi_shape {region} {label} kinds={dict(kinds)} values={dict(values)} fields={shapes.most_common(12)}",flush=True)
                              result = response.get("result")
                              if isinstance(result,dict):
                                  print(f"xiaomi_paging {region} {label} has_more={bool(result.get('has_more'))} has_cursor={bool(result.get('next_key'))}",flush=True)
                      except Exception as e:
                          http = getattr(e,"status_code",0)
                          code = getattr(e,"code",0)
                          http = http if isinstance(http,int) else 0
                          code = code if isinstance(code,int) else 0
                          print(f"xiaomi_probe {region} {label} error={type(e).__name__} http={http} code={code}", flush=True)
          def network_probe(base):
              host = base.split("//", 1)[-1].split("/", 1)[0]
              region = host.split(".", 1)[0]
              start = time.monotonic()
              try:
                  socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
              except OSError as e:
                  print(f"xiaomi_network {region} dns_error={type(e).__name__}",flush=True)
                  return
              try:
                  with socket.create_connection((host,443),timeout=8) as sock:
                      tcp_ms = int((time.monotonic()-start)*1000)
                      with ssl.create_default_context().wrap_socket(sock,server_hostname=host):
                          print(f"xiaomi_network {region} tcp_ms={tcp_ms} tls_ms={int((time.monotonic()-start)*1000)}",flush=True)
              except OSError as e:
                  print(f"xiaomi_network {region} connection_error={type(e).__name__}",flush=True)
          async def main():
              bases = list(dict.fromkeys([b.XIAOMI_HEALTH_BASE_URL,*b.XIAOMI_HEALTH_REGION_URLS]))
