              with tempfile.TemporaryDirectory(prefix="lifeos-xiaomi-probe-") as tmp:
                  jobs = []
                  for i, base in enumerate(dict.fromkeys([b.XIAOMI_HEALTH_BASE_URL,*b.XIAOMI_HEALTH_REGION_URLS])):
                      copy = Path(tmp) / str(i)
                      shutil.copyfile(token,copy)
