name: Deploy PocketBase hooks and migrations

on:
  pull_request:
    paths:
      - 'pb_hooks/**'
      - 'pb_migrations/**'
      - '.github/workflows/deploy-pocketbase.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      server_changed: ${{ steps.changes.outputs.server_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate main architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit/documentation_parity.py
          python scripts/audit/pocketbase_schema_contract.py
          python scripts/audit/deployment_contract.py

      - name: Validate PocketBase JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find pb_hooks pb_migrations -type f -name '*.js' -print0 | sort -z)
          (( ${#files[@]} > 0 ))
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Detect PocketBase bundle changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed=false
          elif [[ "${{ github.event_name }}" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- pb_hooks pb_migrations; then changed=false; fi
          fi
          echo "SERVER_CHANGED=$changed" >> "$GITHUB_ENV"
          echo "server_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "PocketBase bundle changed: $changed"

  deploy:
    if: github.event_name != 'pull_request' && needs.validate.outputs.server_changed == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pocketbase-production
      cancel-in-progress: false
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Upload and install PocketBase bundle
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/lifeos-pocketbase-${GITHUB_SHA}.tar.gz"
          tar -czf "$ARCHIVE" pb_hooks pb_migrations
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" "$ARCHIVE" "$SSH_USER@$SSH_HOST:$ARCHIVE"
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' ARCHIVE='$ARCHIVE' bash -s" <<'REMOTE'
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$service_name" && -n "$app_dir" && -d "$app_dir" ]]

          fit_env="$app_dir/.lifeos-google-fit.env"
          [[ -f "$fit_env" ]]
          grep -q '^SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID=' "$fit_env"
          grep -q '^SLEEP_SYNC_GOOGLE_FIT_CLIENT_SECRET=' "$fit_env"

          override_dir="/etc/systemd/system/${service_name}.d"
          $SUDO mkdir -p "$override_dir"
          printf '[Service]\nEnvironmentFile=%s\n' "$fit_env" | $SUDO tee "$override_dir/lifeos-google-fit.conf" >/dev/null

          $SUDO mkdir -p "$app_dir/pb_hooks" "$app_dir/pb_migrations"
          $SUDO tar -xzf "$ARCHIVE" -C "$app_dir" pb_hooks pb_migrations
          rm -f "$ARCHIVE"
          $SUDO systemctl daemon-reload
          $SUDO systemctl restart "$service_name"

          for attempt in {1..20}; do
            health="$(curl -sS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/health || true)"
            route="$(curl -sS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/sleep-sync/status || true)"
            if [[ "$health" == "200" && ( "$route" == "401" || "$route" == "403" ) ]]; then exit 0; fi
            sleep 2
          done
          exit 1
          REMOTE

      - name: Verify recent cloud sleep and ETNIKA Path in production
        shell: bash
        run: |
          set -euo pipefail
          sleep 95
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" > /tmp/sleep-cloud-result.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi

          hook_line="$(journalctl -u "$service_name" --since '15 minutes ago' --no-pager 2>/dev/null | grep '\[ETNIKA_HOMEPAGE_PATH_ONCE\]' | tail -1 || true)"
          hook_status="no_log"
          case "$hook_line" in
            *"] ok"*) hook_status="ok" ;;
            *"expected exactly one active ETNIKA category"*) hook_status="root_count_error" ;;
            *"multiple ETNIKA homepage child categories"*) hook_status="duplicate_child" ;;
            *"ETNIKA owner is empty"*) hook_status="owner_error" ;;
            *"unique"*|*"UNIQUE"*) hook_status="unique_error" ;;
            *"validation"*|*"Validation"*) hook_status="validation_error" ;;
            *"relation"*|*"Relation"*) hook_status="relation_error" ;;
            *"] error:"*) hook_status="other_error" ;;
          esac
          printf 'etnika_hook_status=%s\n' "$hook_status"

          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import json, sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True); con.row_factory=sqlite3.Row
          r=con.execute("SELECT enabled,status,last_error,last_sync_at,last_session_count,last_imported_count,length(coalesce(refresh_token_enc,'')) token_len FROM sleep_sync_connections WHERE provider='google_fit' LIMIT 1").fetchone()
          def error_class(v):
              s=(v or '').lower()
              if not s:return 'none'
              if 'google_health_scope_required' in s:return 'authorization_required'
              if 'invalid_grant' in s:return 'invalid_grant'
              if '403' in s or 'scope' in s or 'permission' in s:return 'permission'
              if '401' in s:return 'auth'
              return 'other'
          print('connection='+str(bool(r)).lower())
          if r:
              print('enabled='+str(bool(r['enabled'])).lower())
              print('token='+str(r['token_len']>0).lower())
              print('status='+str(r['status']))
              print('error='+error_class(r['last_error']))
              print('synced='+str(bool(r['last_sync_at'])).lower())
              print('sessions='+str(r['last_session_count'] or 0))
              print('imported='+str(r['last_imported_count'] or 0))
          n=con.execute("SELECT count(*) FROM records WHERE (title='Sleep' OR title='Сон') AND julianday(end_time) >= julianday('now','-36 hours')").fetchone()[0]
          latest=con.execute("SELECT date(max(end_time)) FROM records WHERE title='Sleep' OR title='Сон'").fetchone()[0]
          print('sleep_last_36h='+str(n))
          print('latest_sleep_day='+str(latest or 'none'))

          cats=con.execute("SELECT id,user_id,name,parent_id,is_archived FROM categories").fetchall()
          roots={row['id']:row for row in cats if (row['name'] or '').strip().casefold()=='этника' and not bool(row['is_archived'])}
          print('etnika_active_roots='+str(len(roots)))
          root_paths=[]
          for root in roots.values():
              root_paths.extend(con.execute("SELECT id,path_id FROM paths WHERE user_id=? AND category_link=?",(root['user_id'],root['id'])).fetchall())
          print('etnika_root_path_rows='+str(len(root_paths)))

          all_children=[row for row in cats if row['parent_id'] in roots and (row['name'] or '').strip().casefold()=='обновление основной страницы сайта']
          children=[row for row in all_children if not bool(row['is_archived'])]
          print('etnika_homepage_child_total='+str(len(all_children)))
          print('etnika_homepage_child_matches='+str(len(children)))

          child_paths=[]; stages_count=0; actions_count=0; owner_id=None
          if len(children)==1:
              child=children[0]; owner_id=child['user_id']
              child_paths=con.execute("SELECT id,path_id,active_revision_link FROM paths WHERE user_id=? AND category_link=? AND archived=0",(owner_id,child['id'])).fetchall()
              if len(child_paths)==1:
                  rev=con.execute("SELECT content FROM path_revisions WHERE id=? AND user_id=? AND path_id=?",(child_paths[0]['active_revision_link'],owner_id,child_paths[0]['path_id'])).fetchone()
                  if rev:
                      try: data=json.loads(rev['content']) if isinstance(rev['content'],str) else (rev['content'] or {})
                      except Exception: data={}
                      stages=data.get('stages') or []
                      stages_count=len(stages)
                      actions_count=sum(len((s or {}).get('actions') or []) for s in stages if isinstance(s,dict))
          print('etnika_child_path_rows='+str(len(child_paths)))
          print('etnika_path_stages='+str(stages_count))
          print('etnika_path_actions='+str(actions_count))

          plan_count=0
          if len(roots)==1:
              root=next(iter(roots.values()))
              exact=[f'etnika-homepage-redesign-2026-08-{d:02d}' for d in range(25,32)]
              q=','.join('?' for _ in exact)
              plan_count=con.execute(f"SELECT count(*) FROM plans WHERE user_id=? AND plan_id IN ({q})",(root['user_id'],*exact)).fetchone()[0]
          print('etnika_week_plans='+str(plan_count))
          print('etnika_plans_gate_clean='+str(plan_count==0).lower())

          verified=(len(roots)==1 and len(root_paths)==0 and len(children)==1 and len(child_paths)==1 and stages_count==17 and actions_count==44 and plan_count==0)
          print('etnika_homepage_verified='+str(verified).lower())
          con.close()
          PY
          REMOTE

      - name: Publish sanitized verification
        shell: bash
        run: |
          cp /tmp/sleep-cloud-result.txt _tmp_sleep_cloud_result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp_sleep_cloud_result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record sanitized sleep cloud verification'
          git pull --rebase origin main
          git push origin HEAD:main
