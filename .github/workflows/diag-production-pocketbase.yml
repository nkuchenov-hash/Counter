name: Apply verified auth session hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diag-production-pocketbase.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact source replacements
        run: |
          echo '' | base64 -d > /tmp/auth_hotfix.py
          python3 /tmp/auth_hotfix.py
          git diff --check
          git diff -- lib/data/auth_bridge.dart lib/data/db_core.dart
      - name: Commit source hotfix
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add lib/data/auth_bridge.dart lib/data/db_core.dart
          git commit -m 'Validate PocketBase auth before loading owned data'
          git push origin HEAD:main
