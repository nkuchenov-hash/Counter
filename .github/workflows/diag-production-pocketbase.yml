name: Diagnose production PocketBase ownership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-production-pocketbase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Inspect active PocketBase database without modifying it
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          db=/root/pb/pb_data/data.db
          echo 'SERVICE_STATE:'
          systemctl is-active pocketbase.service || true
          systemctl show pocketbase.service -p WorkingDirectory --value || true
          stat -c 'DB=%n bytes=%s modified=%y' "$db"
          DB_PATH="$db" python3 - <<'PY'
          import os, sqlite3
          db = os.environ['DB_PATH']
          con = sqlite3.connect(f'file:{db}?mode=ro', uri=True)
          cur = con.cursor()
          def exists(name):
              return cur.execute("select 1 from sqlite_master where type='table' and name=?", (name,)).fetchone() is not None
          print('ROW_COUNTS:')
          for table in ('profiles','plans','categories','tags','records'):
              print(f'{table}=' + (str(cur.execute(f"select count(*) from {table}").fetchone()[0]) if exists(table) else 'MISSING'))
          print('PROFILE_OWNERSHIP:')
          if exists('profiles'):
              cols = {r[1] for r in cur.execute('pragma table_info(profiles)')}
              legacy = "substr(coalesce(user_id,''),1,8)" if 'user_id' in cols else "'-'"
              admin = "coalesce(is_admin,0)" if 'is_admin' in cols else "'-'"
              for r in cur.execute(f"select substr(id,1,8), {legacy}, {admin} from profiles order by created"):
                  print(f'profile={r[0]}.. legacy={r[1]}.. admin={r[2]}')
          print('OWNED_ROW_COUNTS:')
          for table in ('plans','categories','tags','records'):
              if not exists(table):
                  continue
              cols = {r[1] for r in cur.execute(f'pragma table_info({table})')}
              if 'user_id' not in cols:
                  print(f'[{table}] user_id=MISSING')
                  continue
              print(f'[{table}]')
              for owner, count in cur.execute(f"select substr(coalesce(user_id,''),1,8), count(*) from {table} group by user_id order by count(*) desc"):
                  print(f'owner={owner}.. rows={count}')
          print('COLLECTION_RULES:')
          if exists('_collections'):
              cols = {r[1] for r in cur.execute('pragma table_info(_collections)')}
              wanted = ['profiles','plans','categories','tags','records']
              rule_cols = [c for c in ('listRule','viewRule','createRule','updateRule','deleteRule') if c in cols]
              print('rule_cols=' + ','.join(rule_cols))
              if rule_cols:
                  sql = 'select name,' + ','.join(rule_cols) + ' from _collections where name in (' + ','.join('?' for _ in wanted) + ') order by name'
                  for row in cur.execute(sql, wanted):
                      print(row)
          con.close()
          PY
          curl -sS -o /dev/null -w 'health=%{http_code}\n' https://217-114-0-201.sslip.io/api/health || true
          REMOTE
