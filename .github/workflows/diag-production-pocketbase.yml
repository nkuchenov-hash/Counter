name: Diagnose production PocketBase ownership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-production-pocketbase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Read recent request status metadata
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          AUX_PATH=/root/pb/pb_data/auxiliary.db python3 - <<'PY'
          import os, sqlite3, json
          con = sqlite3.connect(f"file:{os.environ['AUX_PATH']}?mode=ro", uri=True)
          cur = con.cursor()
          rows = cur.execute("select created, level, message, data from _logs order by created desc limit 250").fetchall()
          targets = ('/api/collections/profiles/records/', '/api/collections/plans/records', '/api/collections/categories/records', '/api/collections/tags/records', '/api/collections/records/records')
          shown = 0
          for created, level, message, raw in rows:
              if not any(t in (message or '') for t in targets):
                  continue
              try:
                  data = json.loads(raw) if isinstance(raw, str) and raw.strip() else (raw or {})
              except Exception:
                  data = {'raw': str(raw)[:500]}
              safe = {}
              if isinstance(data, dict):
                  for key in ('status','statusCode','method','url','path','requestUri','elapsed','duration','responseSize','response_size','userId','authId','type','error'):
                      if key in data:
                          safe[key] = data[key]
                  # PocketBase commonly stores request metadata in nested request/response objects.
                  for parent in ('request','response'):
                      val = data.get(parent)
                      if isinstance(val, dict):
                          safe[parent] = {k: val[k] for k in ('method','url','path','status','statusCode','size') if k in val}
              print('REQ', created, 'level=', level, 'message=', (message or '')[:320])
              print('META', json.dumps(safe, separators=(',',':'), ensure_ascii=True)[:1200])
              shown += 1
              if shown >= 45:
                  break
          con.close()
          PY
          REMOTE
