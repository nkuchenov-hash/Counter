name: Health whitespace fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/health-connect-sleep
          fetch-depth: 0

      - name: Strip trailing whitespace from changed text files
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          names = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True,
          ).splitlines()
          for name in names:
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  raw = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              lines = raw.splitlines()
              cleaned = '\n'.join(line.rstrip(' \t') for line in lines) + '\n'
              if cleaned != raw:
                  path.write_text(cleaned, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No whitespace changes"
          else
            git commit -m "Fix Health integration whitespace"
            git push origin HEAD:feature/health-connect-sleep
          fi

      - name: Verify diff whitespace
        run: git diff --check origin/main...HEAD
