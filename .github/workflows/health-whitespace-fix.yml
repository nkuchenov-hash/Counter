name: Health whitespace diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/health-connect-sleep
          fetch-depth: 0

      - name: Capture merge-commit whitespace report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin refs/pull/27/merge:refs/remotes/origin/pr-merge
          git diff --check "$BASE_SHA...refs/remotes/origin/pr-merge" > .health_whitespace_report.txt || true
          if [ ! -s .health_whitespace_report.txt ]; then
            printf '%s\n' 'NO_WHITESPACE_ERRORS' > .health_whitespace_report.txt
          fi

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .health_whitespace_report.txt
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "Record Health merge whitespace report"
            git push origin HEAD:feature/health-connect-sleep
          fi
