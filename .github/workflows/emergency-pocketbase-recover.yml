name: Emergency PocketBase recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-pocketbase-recover.yml'

permissions:
  contents: write

concurrency:
  group: pocketbase-production
  cancel-in-progress: false

jobs:
  recover:
    if: contains(github.event.head_commit.message, 'Emergency PocketBase recovery')
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        id: ssh
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Restore safe bootcheck and capture PocketBase status
        id: restart
        if: steps.ssh.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          remote_file="/tmp/lifeos-pb-bootcheck-${GITHUB_SHA}.pb.js"
          scp -i ~/.ssh/lifeos_pocketbase -P "$SSH_PORT" \
            pb_hooks/01_sleep_sync_runtime_bootcheck.pb.js \
            "$SSH_USER@$SSH_HOST:$remote_file"

          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' REMOTE_FILE='$remote_file' bash -s" \
            > "$RUNNER_TEMP/pb_remote_diag.txt" 2>&1 <<'REMOTE'
          set +e
          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo -n"; fi
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then
            app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"
          fi
          echo "service=${service_name:-missing}"
          echo "app_dir_present=$([[ -n "$app_dir" && -d "$app_dir" ]] && echo true || echo false)"
          if [[ -z "$service_name" || -z "$app_dir" || ! -d "$app_dir" ]]; then
            echo "recovery_error=service_or_app_dir_not_found"
            exit 0
          fi
          $SUDO mkdir -p "$app_dir/pb_hooks"
          $SUDO install -m 0644 "$REMOTE_FILE" "$app_dir/pb_hooks/01_sleep_sync_runtime_bootcheck.pb.js"
          install_rc=$?
          rm -f "$REMOTE_FILE"
          $SUDO systemctl daemon-reload
          $SUDO systemctl restart "$service_name"
          restart_rc=$?
          sleep 3
          active="$($SUDO systemctl is-active "$service_name" 2>/dev/null || true)"
          echo "install_rc=$install_rc"
          echo "restart_rc=$restart_rc"
          echo "active=${active:-unknown}"
          echo "status_begin"
          $SUDO systemctl status "$service_name" --no-pager -l 2>&1 | tail -n 35
          echo "status_end"
          exit 0
          REMOTE
          cat "$RUNNER_TEMP/pb_remote_diag.txt"

      - name: Verify production health
        id: health
        if: steps.restart.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code="$(curl -ksS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/health || true)"
            echo "health attempt $attempt: $code"
            if [[ "$code" == "200" ]]; then
              echo "PocketBase production health OK"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish sanitized recovery result
        if: always()
        shell: bash
        env:
          SSH_OUTCOME: ${{ steps.ssh.outcome }}
          RESTART_OUTCOME: ${{ steps.restart.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          set -euo pipefail
          {
            echo "sha=$GITHUB_SHA"
            echo "ssh=${SSH_OUTCOME:-skipped}"
            echo "restart_step=${RESTART_OUTCOME:-skipped}"
            echo "health=${HEALTH_OUTCOME:-skipped}"
            if [[ -f "$RUNNER_TEMP/pb_remote_diag.txt" ]]; then
              echo "remote_diag_begin"
              sed -E 's/[A-Za-z0-9_=-]{48,}/[redacted]/g' "$RUNNER_TEMP/pb_remote_diag.txt" | tail -n 45
              echo "remote_diag_end"
            fi
          } > _tmp_pocketbase_recovery_result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp_pocketbase_recovery_result.txt
          git commit -m 'Record emergency PocketBase recovery result'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail if health is not restored
        if: always()
        shell: bash
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          [[ "$HEALTH_OUTCOME" == "success" ]]
