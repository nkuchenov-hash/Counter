name: Notes v3 width and media repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: notes-v3-width-media-repair
  cancel-in-progress: true

jobs:
  repair-verify-publish:
    runs-on: ubuntu-latest
    env:
      BRANCH: feature/notes-v3-design-system
      PREVIEW_DIR: notes-v3-preview-live-20260731-1643
    steps:
      - name: Checkout Notes branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Apply responsive width and media repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'lib/features/notes/notes_glm_surface.dart',
              'const double kGlmLibraryMaxWidth = 1024;',
              'const double kGlmLibraryMaxWidth = 1440;',
          )
          replace_once(
              'lib/features/notes/notes_glm_surface.dart',
              'horizontal: wide ? 32 : 20,',
              'horizontal: wide ? 24 : 20,',
          )
          replace_once(
              'lib/features/notes/widgets/notes_library_body.dart',
              '''final listWidth = (constraints.maxWidth * 0.30)\n            .clamp(340.0, 430.0)\n            .toDouble();''',
              '''final listWidth = (constraints.maxWidth * 0.26)\n            .clamp(280.0, 360.0)\n            .toDouble();''',
          )
          replace_once(
              'lib/features/notes/widgets/notes_editor_screen.dart',
              'final horizontalPadding = embedded ? 40.0 : 0.0;',
              '''final horizontalPadding = embedded\n            ? (constraints.maxWidth >= NotesFigmaTokens.editorSurfaceMaxWidth\n                  ? 40.0\n                  : 24.0)\n            : 0.0;''',
          )
          replace_once(
              'lib/features/notes/widgets/notes_editor_screen.dart',
              '''child: SizedBox(\n            width: contentWidth,''',
              '''child: SizedBox(\n            key: const ValueKey('notes-editor-content-rail'),\n            width: contentWidth,''',
          )

          media_path = Path('lib/features/notes/widgets/note_editor_block_widgets.dart')
          media = media_path.read_text(encoding='utf-8')
          import_line = "import 'package:counter/features/notes/widgets/notes_editor_screen.dart';\n"
          if import_line not in media:
              anchor = "import 'package:counter/features/notes/widgets/notes_canonical_components.dart';\n"
              if anchor not in media:
                  raise SystemExit('Media import anchor missing')
              media = media.replace(anchor, anchor + import_line, 1)

          old_media = '''  Widget _mediaContent(BuildContext context) {\n    final raw = block.type == NoteBlockType.drawing\n        ? block.drawingData\n        : block.imageData;\n    final bytes = _decodeImagePayload(raw);\n    if (bytes == null) return _mediaPlaceholder(context);\n\n    // Inline media is a preview, not the document itself. A large or legacy\n    // payload must never take over the entire editor viewport. Full-size work\n    // remains available through the block media actions.\n    final previewHeight = MediaQuery.sizeOf(context).width >= 768\n        ? 220.0\n        : 260.0;\n    return RepaintBoundary(\n      child: SizedBox(\n        width: double.infinity,\n        height: previewHeight,\n        child: Image.memory(\n          bytes,\n          width: double.infinity,\n          height: previewHeight,\n          alignment: Alignment.topCenter,\n          fit: BoxFit.contain,\n          gaplessPlayback: true,\n          filterQuality: FilterQuality.medium,\n          errorBuilder: (_, __, ___) => _mediaPlaceholder(context),\n        ),\n      ),\n    );\n  }\n\n  Widget _mediaPlaceholder(BuildContext context) {\n    final scheme = Theme.of(context).colorScheme;\n    return SizedBox(\n      height: 88,\n      child: DecoratedBox(\n        decoration: BoxDecoration(\n          color: scheme.surfaceContainerLow,\n          border: Border.all(color: scheme.outlineVariant),\n        ),\n        child: Padding(\n          padding: const EdgeInsets.symmetric(horizontal: 16),\n          child: Row(\n            children: [\n              Icon(\n                block.type == NoteBlockType.drawing\n                    ? Icons.draw_rounded\n                    : Icons.broken_image_outlined,\n                size: 24,\n                color: scheme.onSurfaceVariant,\n              ),\n              const SizedBox(width: 12),\n              Expanded(\n                child: Text(\n                  t(currentLocale.value, 'notes_v3_editor_load_failed'),\n                  maxLines: 2,\n                  overflow: TextOverflow.ellipsis,\n                  style: Theme.of(context).textTheme.bodyMedium?.copyWith(\n                    color: scheme.onSurfaceVariant,\n                  ),\n                ),\n              ),\n            ],\n          ),\n        ),\n      ),\n    );\n  }\n'''
          new_media = '''  Widget _mediaContent(BuildContext context) {\n    final raw = block.type == NoteBlockType.drawing\n        ? block.drawingData\n        : block.imageData;\n    final bytes = _decodeImagePayload(raw);\n    final embedded = NotesEmbeddedEditorScope.maybeOf(context) != null;\n    if (bytes == null) {\n      return _mediaPlaceholder(context, compact: embedded);\n    }\n\n    if (embedded) {\n      final scheme = Theme.of(context).colorScheme;\n      final loc = currentLocale.value;\n      final kindLabel = block.type == NoteBlockType.drawing\n          ? t(loc, 'notes_v3_draw_badge')\n          : t(loc, 'notes_v3_image_badge');\n      return RepaintBoundary(\n        child: SizedBox(\n          height: 112,\n          child: Row(\n            children: [\n              SizedBox(\n                width: 168,\n                height: 112,\n                child: ColoredBox(\n                  color: scheme.surfaceContainerLowest,\n                  child: Image.memory(\n                    bytes,\n                    alignment: Alignment.center,\n                    fit: BoxFit.contain,\n                    gaplessPlayback: true,\n                    filterQuality: FilterQuality.medium,\n                    errorBuilder: (_, __, ___) =>\n                        _mediaPlaceholder(context, compact: true),\n                  ),\n                ),\n              ),\n              const SizedBox(width: 16),\n              Expanded(\n                child: Column(\n                  mainAxisAlignment: MainAxisAlignment.center,\n                  crossAxisAlignment: CrossAxisAlignment.start,\n                  children: [\n                    Text(\n                      kindLabel,\n                      maxLines: 1,\n                      overflow: TextOverflow.ellipsis,\n                      style: Theme.of(context).textTheme.titleSmall?.copyWith(\n                        fontWeight: FontWeight.w600,\n                      ),\n                    ),\n                    const SizedBox(height: 4),\n                    Text(\n                      _formatNotesAssetBytes(bytes.length),\n                      style: Theme.of(context).textTheme.bodySmall?.copyWith(\n                        color: scheme.onSurfaceVariant,\n                      ),\n                    ),\n                    const SizedBox(height: 8),\n                    Row(\n                      children: [\n                        Icon(\n                          Icons.more_horiz_rounded,\n                          size: 16,\n                          color: scheme.onSurfaceVariant,\n                        ),\n                        const SizedBox(width: 6),\n                        Flexible(\n                          child: Text(\n                            t(loc, 'notes_v3_editor_more_tooltip'),\n                            maxLines: 1,\n                            overflow: TextOverflow.ellipsis,\n                            style: Theme.of(context).textTheme.labelMedium\n                                ?.copyWith(color: scheme.onSurfaceVariant),\n                          ),\n                        ),\n                      ],\n                    ),\n                  ],\n                ),\n              ),\n            ],\n          ),\n        ),\n      );\n    }\n\n    final previewHeight = MediaQuery.sizeOf(context).width >= 768\n        ? 200.0\n        : 240.0;\n    return RepaintBoundary(\n      child: SizedBox(\n        width: double.infinity,\n        height: previewHeight,\n        child: Image.memory(\n          bytes,\n          width: double.infinity,\n          height: previewHeight,\n          alignment: Alignment.topCenter,\n          fit: BoxFit.contain,\n          gaplessPlayback: true,\n          filterQuality: FilterQuality.medium,\n          errorBuilder: (_, __, ___) => _mediaPlaceholder(context),\n        ),\n      ),\n    );\n  }\n\n  Widget _mediaPlaceholder(BuildContext context, {bool compact = false}) {\n    final scheme = Theme.of(context).colorScheme;\n    return SizedBox(\n      height: compact ? 72 : 88,\n      child: DecoratedBox(\n        decoration: BoxDecoration(\n          color: scheme.surfaceContainerLow,\n          border: Border.all(color: scheme.outlineVariant),\n        ),\n        child: Padding(\n          padding: const EdgeInsets.symmetric(horizontal: 16),\n          child: Row(\n            children: [\n              Icon(\n                block.type == NoteBlockType.drawing\n                    ? Icons.draw_rounded\n                    : Icons.broken_image_outlined,\n                size: 24,\n                color: scheme.onSurfaceVariant,\n              ),\n              const SizedBox(width: 12),\n              Expanded(\n                child: Text(\n                  t(currentLocale.value, 'notes_v3_editor_load_failed'),\n                  maxLines: 2,\n                  overflow: TextOverflow.ellipsis,\n                  style: Theme.of(context).textTheme.bodyMedium?.copyWith(\n                    color: scheme.onSurfaceVariant,\n                  ),\n                ),\n              ),\n            ],\n          ),\n        ),\n      ),\n    );\n  }\n'''
          if new_media not in media:
              if old_media not in media:
                  raise SystemExit('Old media implementation not found')
              media = media.replace(old_media, new_media, 1)
          helper = '''\nString _formatNotesAssetBytes(int bytes) {\n  if (bytes < 1024) return '$bytes B';\n  final kb = bytes / 1024;\n  if (kb < 1024) return '${kb.toStringAsFixed(kb >= 100 ? 0 : 1)} KB';\n  final mb = kb / 1024;\n  return '${mb.toStringAsFixed(mb >= 10 ? 1 : 2)} MB';\n}\n\n'''
          helper_anchor = 'NotesTextBlockStyle _textStyleFor(NoteBlock block) {'
          if helper not in media:
              if helper_anchor not in media:
                  raise SystemExit('Media helper anchor missing')
              media = media.replace(helper_anchor, helper + helper_anchor, 1)
          media_path.write_text(media, encoding='utf-8')

          test_path = Path('test/notes_canonical_components_test.dart')
          test = test_path.read_text(encoding='utf-8')
          block_import = "import 'package:counter/features/notes/widgets/note_editor_block_widgets.dart';\n"
          if block_import not in test:
              anchor = "import 'package:counter/features/notes/widgets/notes_canonical_components.dart';\n"
              test = test.replace(anchor, anchor + block_import, 1)
          services_import = "import 'package:flutter/services.dart';\n"
          if services_import not in test:
              test = test.replace(
                  "import 'package:flutter/material.dart';\n",
                  "import 'package:flutter/material.dart';\n" + services_import,
                  1,
              )

          test_anchor = '''      selectedTable = null;\n      tester.view.physicalSize = const Size(1200, 900);'''
          test_insert = '''      tester.view.physicalSize = const Size(1400, 900);\n      await tester.pumpWidget(\n        _host(\n          NotesEmbeddedEditorScope(\n            onClose: () {},\n            child: NotesEditorScreen(\n              titleController: headingController,\n              onTitleChanged: (_) {},\n              onDone: () {},\n              pinned: false,\n              onTogglePinned: () {},\n              onDelete: () {},\n              categoryLabel: 'Work',\n              content: const SizedBox.shrink(),\n              toolbar: NotesEditorToolbar(\n                actions: [\n                  for (final tool in NotesToolbarTool.values)\n                    NotesToolbarAction(\n                      tool: tool,\n                      icon: _iconFor(tool),\n                      tooltip: tool.name,\n                      onPressed: () {},\n                    ),\n                ],\n              ),\n            ),\n          ),\n        ),\n      );\n      await tester.pump();\n      expect(\n        tester.getSize(\n          find.byKey(const ValueKey('notes-editor-content-rail')),\n        ).width,\n        NotesFigmaTokens.editorContentMaxWidth,\n      );\n\n      await tester.pumpWidget(\n        _host(\n          NotesEmbeddedEditorScope(\n            onClose: () {},\n            child: Align(\n              alignment: Alignment.topCenter,\n              child: SizedBox(\n                width: 880,\n                child: NotesEditorBlockItem(\n                  block: const NoteBlock(\n                    id: 'broken-media',\n                    type: NoteBlockType.image,\n                    imageData: 'not-base64',\n                  ),\n                  index: 0,\n                  numberedOrdinal: 1,\n                  active: false,\n                  onTap: () {},\n                  onKeyEvent: (_) => KeyEventResult.ignored,\n                ),\n              ),\n            ),\n          ),\n        ),\n      );\n      await tester.pump();\n      expect(\n        tester.getSize(find.byKey(const ValueKey('notes-media-frame'))).height,\n        72,\n      );\n      expect(tester.takeException(), isNull);\n\n      selectedTable = null;\n      tester.view.physicalSize = const Size(1200, 900);'''
          if test_insert not in test:
              if test_anchor not in test:
                  raise SystemExit('Test insertion anchor missing')
              test = test.replace(test_anchor, test_insert, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart
        run: dart format lib/features/notes/notes_glm_surface.dart lib/features/notes/widgets/notes_library_body.dart lib/features/notes/widgets/notes_editor_screen.dart lib/features/notes/widgets/note_editor_block_widgets.dart test/notes_canonical_components_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run exactly three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Build production web
        run: flutter build web --release --no-tree-shake-icons --base-href /Counter/${PREVIEW_DIR}/

      - name: Commit repaired production code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/notes/notes_glm_surface.dart \
                  lib/features/notes/widgets/notes_library_body.dart \
                  lib/features/notes/widgets/notes_editor_screen.dart \
                  lib/features/notes/widgets/note_editor_block_widgets.dart \
                  test/notes_canonical_components_test.dart
          if git diff --cached --quiet; then
            echo "Production repair already committed"
          else
            git commit -m "Fix Notes workspace width and media blocks"
            git push origin HEAD:${BRANCH}
          fi

      - name: Disable service worker for isolated preview
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          bootstrap = Path('build/web/flutter_bootstrap.js')
          source = bootstrap.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{.*?\}\s*\}\);',
              '_flutter.loader.load();',
              source,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one service-worker registration block, found {count}')
          bootstrap.write_text(updated, encoding='utf-8')
          worker = Path('build/web/flutter_service_worker.js')
          if worker.exists(): worker.unlink()
          PY

      - name: Publish fixed preview
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          rm -rf "/tmp/gh-pages/${PREVIEW_DIR}"
          mkdir -p "/tmp/gh-pages/${PREVIEW_DIR}"
          cp -R build/web/. "/tmp/gh-pages/${PREVIEW_DIR}/"
          printf '%s\n' "$SOURCE_SHA" > "/tmp/gh-pages/${PREVIEW_DIR}/source-sha.txt"
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll "${PREVIEW_DIR}"
          git commit -m "Publish Notes width/media preview ${SOURCE_SHA}"
          git push origin HEAD:gh-pages

      - name: Verify public preview
        run: |
          EXPECTED=$(git rev-parse HEAD)
          BASE="https://nkuchenov-hash.github.io/Counter/${PREVIEW_DIR}"
          for attempt in $(seq 1 60); do
            ACTUAL=$(curl -fsSL -H 'Cache-Control: no-cache' "${BASE}/source-sha.txt?attempt=${attempt}&ts=$(date +%s)" || true)
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              STATUS=$(curl -sS -o /tmp/public-index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "${BASE}/?ts=$(date +%s)")
              test "$STATUS" = '200'
              echo "Verified Notes width/media preview: SHA=${ACTUAL}, HTTP=${STATUS}"
              exit 0
            fi
            sleep 5
          done
          exit 1
