name: Notes v3 desktop preview fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: notes-v3-desktop-preview-fix
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    env:
      PREVIEW_DIR: notes-v3-preview-live-20260731-1621
    steps:
      - name: Checkout Notes branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run exactly three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Build production web
        run: flutter build web --release --no-tree-shake-icons --base-href /Counter/${PREVIEW_DIR}/

      - name: Disable service worker for isolated preview
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          bootstrap = Path('build/web/flutter_bootstrap.js')
          source = bootstrap.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{.*?\}\s*\}\);',
              '_flutter.loader.load();',
              source,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one service-worker registration block, found {count}')
          if not updated.rstrip().endswith('_flutter.loader.load();'):
              raise SystemExit('Bootstrap does not end with the no-service-worker loader call')
          bootstrap.write_text(updated, encoding='utf-8')

          index = Path('build/web/index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(
              r'\s*<!-- Bust stale Flutter service-worker caches.*?</script>',
              '',
              html,
              count=1,
              flags=re.S,
          )
          index.write_text(html, encoding='utf-8')

          worker = Path('build/web/flutter_service_worker.js')
          if worker.exists():
              worker.unlink()
          PY

      - name: Publish unique fixed preview
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          rm -rf "/tmp/gh-pages/${PREVIEW_DIR}"
          mkdir -p "/tmp/gh-pages/${PREVIEW_DIR}"
          cp -R build/web/. "/tmp/gh-pages/${PREVIEW_DIR}/"
          printf '%s\n' "$SOURCE_SHA" > "/tmp/gh-pages/${PREVIEW_DIR}/source-sha.txt"
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll "${PREVIEW_DIR}"
          git commit -m "Publish fixed Notes desktop preview ${SOURCE_SHA}"
          git push origin HEAD:gh-pages

      - name: Verify public fixed preview
        run: |
          EXPECTED=$(git rev-parse HEAD)
          BASE="https://nkuchenov-hash.github.io/Counter/${PREVIEW_DIR}"
          for attempt in $(seq 1 60); do
            ACTUAL=$(curl -fsSL -H 'Cache-Control: no-cache' "${BASE}/source-sha.txt?attempt=${attempt}&ts=$(date +%s)" || true)
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              curl -fsSL -H 'Cache-Control: no-cache' "${BASE}/flutter_bootstrap.js?ts=$(date +%s)" -o /tmp/public-bootstrap.js
              python -c "from pathlib import Path; s=Path('/tmp/public-bootstrap.js').read_text(encoding='utf-8').rstrip(); assert s.endswith('_flutter.loader.load();')"
              STATUS=$(curl -sS -o /tmp/public-index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "${BASE}/?ts=$(date +%s)")
              test "$STATUS" = '200'
              echo "Verified fixed Notes preview: SHA=${ACTUAL}, HTTP=${STATUS}"
              exit 0
            fi
            sleep 5
          done
          echo "Public fixed preview did not expose expected SHA ${EXPECTED}" >&2
          exit 1
