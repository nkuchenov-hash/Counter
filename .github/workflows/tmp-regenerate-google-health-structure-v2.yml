name: TEMP fix Google Health structure index state

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-regenerate-google-health-structure-v2.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Regenerate from final tracked index
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-regenerate-google-health-structure-v2.yml
          python scripts/manual/generate_app_structure_detailed.py
          python scripts/audit/documentation_parity.py
          python scripts/audit/pocketbase_schema_contract.py
          python scripts/audit/deployment_contract.py
          git diff --check
      - name: Commit final structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix generated structure parity for Google Health sleep'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
