name: Temporary diagnose plan bulk update 400s

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_diagnose_plan_bulk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Read-only sanitized plan diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$app_dir" && -f "$app_dir/pb_data/data.db" ]]

          python3 - "$app_dir/pb_data" <<'PY'
          import hashlib, json, os, re, sqlite3, sys

          data_dir = sys.argv[1]
          db_path = os.path.join(data_dir, 'data.db')
          con = sqlite3.connect(f'file:{db_path}?mode=ro', uri=True)
          con.row_factory = sqlite3.Row

          target_hashes = {
              '373d1adc6f0d4f38', '46e536533c894162', '57d48dec7ef019d2',
              '251f26c6be5029c0', 'c1625a164fe9432c', 'dc6a6772e9f84816',
              '4acc726c98edab71',
          }
          def h(v):
              return hashlib.sha256(str(v or '').encode()).hexdigest()[:16]
          def present(v):
              if v is None: return False
              if isinstance(v, str): return bool(v.strip())
              if isinstance(v, (bytes, bytearray)): return bool(v)
              return True
          def dateish(v):
              if not present(v): return True
              s = str(v).strip()
              return bool(re.match(r'^\d{4}-\d{2}-\d{2}(?:[ T].*)?$', s))
          def table_cols(name):
              return [r['name'] for r in con.execute(f'PRAGMA table_info("{name}")').fetchall()]

          plan_cols = table_cols('plans')
          print('plans_table=true')
          print('plans_columns=' + ','.join(sorted(plan_cols)))
          wanted = [c for c in ['id','plan_id','user_id','category_id','title','start_time','end_time','initial_date_key','is_postponed','rrule','notes_plain'] if c in plan_cols]
          rows = con.execute('SELECT ' + ','.join('"'+c+'"' for c in wanted) + ' FROM plans').fetchall()
          matched=[]
          for row in rows:
              if h(row['id']) not in target_hashes:
                  continue
              facts={
                  'rid': h(row['id']),
                  'plan_id_present': present(row['plan_id']) if 'plan_id' in wanted else None,
                  'plan_id_uuid': bool(re.match(r'^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$', str(row['plan_id'] or ''), re.I)) if 'plan_id' in wanted else None,
                  'user_present': present(row['user_id']) if 'user_id' in wanted else None,
                  'category_present': present(row['category_id']) if 'category_id' in wanted else None,
                  'title_present': present(row['title']) if 'title' in wanted else None,
                  'start_present': present(row['start_time']) if 'start_time' in wanted else None,
                  'start_parseable_shape': dateish(row['start_time']) if 'start_time' in wanted else None,
                  'end_present': present(row['end_time']) if 'end_time' in wanted else None,
                  'end_parseable_shape': dateish(row['end_time']) if 'end_time' in wanted else None,
                  'initial_key_present': present(row['initial_date_key']) if 'initial_date_key' in wanted else None,
                  'initial_key_shape': bool(re.match(r'^\d{4}-\d{2}-\d{2}$', str(row['initial_date_key'] or ''))) if 'initial_date_key' in wanted and present(row['initial_date_key']) else True,
                  'is_postponed_sql_type': type(row['is_postponed']).__name__ if 'is_postponed' in wanted else None,
                  'rrule_present': present(row['rrule']) if 'rrule' in wanted else None,
                  'legacy_routine_marker': ('LIFEOS_DAILY_ROUTINE_V1|' in str(row['notes_plain'] or '')) if 'notes_plain' in wanted else False,
                  'legacy_routine_plan_id': str(row['plan_id'] or '').startswith('lifeos-routine-v1-') if 'plan_id' in wanted else False,
              }
              matched.append(facts)
          print('target_rows_found=' + str(len(matched)))
          for facts in sorted(matched, key=lambda x:x['rid']):
              print('target=' + json.dumps(facts, sort_keys=True, separators=(',',':')))

          # Inspect the live PocketBase collection definition, but print only technical
          # field metadata for fields used by bulk updates / required identity fields.
          ccols = table_cols('_collections')
          print('collections_columns=' + ','.join(sorted(ccols)))
          crow = con.execute('SELECT * FROM _collections WHERE name=? LIMIT 1', ('plans',)).fetchone()
          if crow:
              blob = None
              for key in ('fields','schema'):
                  if key in ccols and crow[key]:
                      blob = crow[key]
                      break
              try:
                  fields = json.loads(blob) if isinstance(blob, str) else (blob or [])
              except Exception:
                  fields = []
              if isinstance(fields, dict):
                  fields = fields.get('fields') or fields.get('schema') or []
              technical={'plan_id','user_id','category_id','title','start_time','end_time','initial_date_key','is_postponed','rrule'}
              for f in fields if isinstance(fields, list) else []:
                  if not isinstance(f, dict) or f.get('name') not in technical: continue
                  safe={k:f.get(k) for k in ('name','type','required','min','max','pattern','maxSelect') if k in f}
                  print('schema_field=' + json.dumps(safe, sort_keys=True, separators=(',',':')))
              for rule_name in ('updateRule','createRule'):
                  if rule_name in ccols:
                      # Don't print rule text; only whether a rule exists.
                      print(rule_name + '_present=' + str(present(crow[rule_name])).lower())

          # Request logs usually don't include response bodies, but confirm whether these
          # failures are recorded as 400 and whether another method/status is mixed in.
          log_db_candidates=[db_path, os.path.join(data_dir,'auxiliary.db')]
          seen_logs=False
          for lp in log_db_candidates:
              if not os.path.exists(lp): continue
              lc=sqlite3.connect(f'file:{lp}?mode=ro', uri=True); lc.row_factory=sqlite3.Row
              tables={r[0] for r in lc.execute("SELECT name FROM sqlite_master WHERE type='table'").fetchall()}
              if '_logs' not in tables:
                  lc.close(); continue
              seen_logs=True
              logs=lc.execute('SELECT created,message,data FROM _logs ORDER BY created DESC LIMIT 500').fetchall()
              matches=[]
              for lr in logs:
                  try: d=json.loads(lr['data']) if isinstance(lr['data'],str) else dict(lr['data'] or {})
                  except Exception: d={}
                  url=str(d.get('url') or '')
                  m=re.search(r'/api/collections/plans/records/([^/?]+)', url)
                  if not m or h(m.group(1)) not in target_hashes: continue
                  matches.append({
                      'rid':h(m.group(1)),
                      'status':d.get('status'),
                      'method':d.get('method'),
                      'type':d.get('type'),
                  })
              print('target_request_logs=' + str(len(matches)))
              for item in matches[:30]:
                  print('request=' + json.dumps(item, sort_keys=True, separators=(',',':')))
              lc.close(); break
          print('logs_table_found=' + str(seen_logs).lower())
          con.close()
          PY
          REMOTE
