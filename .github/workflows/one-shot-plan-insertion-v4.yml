name: One-shot repair plan insertion and late timeline

on:
  push:
    branches:
      - fix/plan-insertion-timeline-v4

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plan-insertion-timeline-v4
          fetch-depth: 0

      - name: Patch plan insertion and timeline bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'needle not found in {path}: {old[:120]!r}')
              s2 = s.replace(old, new, 1)
              p.write_text(s2, encoding='utf-8')

          # 1) A normal day must include the 23:00 hour, not stop at the 22:00 row.
          replace_once(
              'lib/shared/time/plan_time_visible_window.dart',
              '  static const int defaultEndExtended = 23;\n',
              '  static const int defaultEndExtended = 24;\n',
          )
          replace_once(
              'lib/shared/time/plan_time_visible_window.dart',
              "  static bool needsNextDayTasks(int endExtended) =>\n      clampEndExtended(endExtended, defaultStartExtended) > 24;\n",
              "  /// Expand the rendered end boundary enough to keep a scheduled plan visible.\n"
              "  /// The persisted/user-selected range remains the baseline; this only grows it\n"
              "  /// for actual content and never beyond the supported D+1 03:00 boundary.\n"
              "  static int endExtendedIncludingWallEnd(\n"
              "    DateTime day,\n"
              "    int configuredEndExtended,\n"
              "    DateTime wallEnd,\n"
              "  ) {\n"
              "    final base = clampEndExtended(\n"
              "      configuredEndExtended,\n"
              "      defaultStartExtended,\n"
              "    );\n"
              "    final minutes = wallEnd.difference(dayMidnight(day)).inMinutes;\n"
              "    if (minutes <= 0) return base;\n"
              "    final requiredEnd = ((minutes + 59) ~/ 60).clamp(\n"
              "      extendedMin + 1,\n"
              "      extendedMax,\n"
              "    );\n"
              "    return requiredEnd > base ? requiredEnd : base;\n"
              "  }\n\n"
              "  static bool needsNextDayTasks(int endExtended) =>\n      clampEndExtended(endExtended, defaultStartExtended) > 24;\n",
          )

          # 2) Upgrade the old stock 23:00 end preference once so existing installs
          #    do not remain visually capped at the 22:00 row forever.
          replace_once(
              'lib/features/planning/planning_day_start_prefs.dart',
              "  static const String _legacyKeyEnd = 'planning_day_end_hour';\n",
              "  static const String _legacyKeyEnd = 'planning_day_end_hour';\n"
              "  static const String _keyEnd24Migration =\n"
              "      'visibleDayEndHour24V1Migrated';\n",
          )
          replace_once(
              'lib/features/planning/planning_day_start_prefs.dart',
              "    if (p.containsKey(_keyStartExtended) && p.containsKey(_keyEndExtended)) {\n      return normalizeExtendedRange(\n        p.getInt(_keyStartExtended) ?? defaultStartExtended,\n        p.getInt(_keyEndExtended) ?? defaultEndExtended,\n      );\n    }\n",
              "    if (p.containsKey(_keyStartExtended) && p.containsKey(_keyEndExtended)) {\n"
              "      var range = normalizeExtendedRange(\n"
              "        p.getInt(_keyStartExtended) ?? defaultStartExtended,\n"
              "        p.getInt(_keyEndExtended) ?? defaultEndExtended,\n"
              "      );\n"
              "      final end24Migrated = p.getBool(_keyEnd24Migration) ?? false;\n"
              "      if (!end24Migrated) {\n"
              "        if (range.end == 23) {\n"
              "          range = normalizeExtendedRange(range.start, 24);\n"
              "          await p.setInt(_keyEndExtended, range.end);\n"
              "        }\n"
              "        await p.setBool(_keyEnd24Migration, true);\n"
              "      }\n"
              "      return range;\n"
              "    }\n",
          )
          replace_once(
              'lib/features/planning/planning_day_start_prefs.dart',
              "  static bool needsNextDayTasks(int endExtended) =>\n      PlanTimeVisibleWindow.needsNextDayTasks(endExtended);\n",
              "  static int endExtendedIncludingWallEnd(\n"
              "    DateTime day,\n"
              "    int configuredEndExtended,\n"
              "    DateTime wallEnd,\n"
              "  ) => PlanTimeVisibleWindow.endExtendedIncludingWallEnd(\n"
              "    day,\n"
              "    configuredEndExtended,\n"
              "    wallEnd,\n"
              "  );\n\n"
              "  static bool needsNextDayTasks(int endExtended) =>\n      PlanTimeVisibleWindow.needsNextDayTasks(endExtended);\n",
          )

          # 3) Avoid a transient/default 22:00 visual cap before prefs finish loading.
          replace_once(
              'lib/features/planning/time_view/planning_time_view_coordinator.dart',
              '  int timelineHourEnd = 23;\n',
              '  int timelineHourEnd = 24;\n',
          )

          # 4) Never clip a real late plan merely because the configured range is shorter.
          replace_once(
              'lib/features/planning/time_view/time_view_hour_grid.dart',
              '    final rangeStart = timelineHourStart;\n    final rangeEnd = timelineHourEnd;\n',
              '    final rangeStart = timelineHourStart;\n    var rangeEnd = timelineHourEnd;\n',
          )
          replace_once(
              'lib/features/planning/time_view/time_view_hour_grid.dart',
              "    final orderedProjected = projectedTasksForTimeMode(\n      planningTasksForTimeViewWindow(planWallDay),\n      planWallDay,\n      rangeStart,\n    );\n    final schedulablePre = <PlanningTask>[];\n",
              "    final orderedProjected = projectedTasksForTimeMode(\n"
              "      planningTasksForTimeViewWindow(planWallDay),\n"
              "      planWallDay,\n"
              "      rangeStart,\n"
              "    );\n"
              "    for (final item in orderedProjected) {\n"
              "      final proj = item.projection;\n"
              "      if (proj == null) continue;\n"
              "      final wallEnd =\n"
              "          proj.profileWallEnd ??\n"
              "          proj.profileWallStart.add(\n"
              "            Duration(minutes: proj.durationMinutes),\n"
              "          );\n"
              "      rangeEnd = PlanningSheetTimelinePrefs.endExtendedIncludingWallEnd(\n"
              "        planWallDay,\n"
              "        rangeEnd,\n"
              "        wallEnd,\n"
              "      );\n"
              "    }\n"
              "    final schedulablePre = <PlanningTask>[];\n",
          )

          # 5) Automatic category-default plans form a sequential block around the
          #    category/default-source anchor. Do not search the entire day and dump
          #    the new card at the end just because another category occupies that block.
          replace_once(
              'lib/data/plans/plan_time_cascade_helpers.dart',
              "      if (h != null && m != null) {\n        usedCategoryDefault = true;\n        categoryDefaultTimezoneIana = catSchedule!.timezoneIana;\n        startWall = _snapPlanWallDateTime(\n          DateTime(wallDay.year, wallDay.month, wallDay.day, h, m),\n        );\n      } else {\n",
              "      if (h != null && m != null) {\n"
              "        usedCategoryDefault = true;\n"
              "        categoryDefaultTimezoneIana = catSchedule!.timezoneIana;\n"
              "        final defaultSourceCategoryId = catSchedule.sourceCategoryId;\n"
              "        final sameDefaultGroupPlans = <PlanningTask>[\n"
              "          for (final plan in existingDayPlans)\n"
              "            if (defaultSourceCategoryId != null\n"
              "                ? effectiveDefaultPlanScheduleForCategory(\n"
              "                        plan.categoryId,\n"
              "                      )?.sourceCategoryId ==\n"
              "                      defaultSourceCategoryId\n"
              "                : plan.categoryId == categoryId)\n"
              "              plan,\n"
              "        ];\n"
              "        final categoryAnchor = _snapPlanWallDateTime(\n"
              "          DateTime(wallDay.year, wallDay.month, wallDay.day, h, m),\n"
              "        );\n"
              "        startWall = _firstAvailablePlanWallStart(\n"
              "          earliestStartWall: categoryAnchor,\n"
              "          durationMin: durationMin,\n"
              "          existingDayPlans: sameDefaultGroupPlans,\n"
              "        );\n"
              "      } else {\n",
          )
          replace_once(
              'lib/data/plans/plan_time_cascade_helpers.dart',
              "    var resolvedStart = _avoidPlanWallScheduleCollisions(\n      startWall: startWall,\n      durationMin: durationMin,\n      existingDayPlans: existingDayPlans,\n    );\n",
              "    var resolvedStart = usedCategoryDefault\n"
              "        ? startWall\n"
              "        : _avoidPlanWallScheduleCollisions(\n"
              "            startWall: startWall,\n"
              "            durationMin: durationMin,\n"
              "            existingDayPlans: existingDayPlans,\n"
              "          );\n",
          )
          old_probe = """    final dayKey =
        '${wallDay.year}-${_two(wallDay.month)}-${_two(wallDay.day)}';
    const probePlanId = '__auto_schedule_probe__';
    final probe = PlanningTask(
      id: 0,
      title: '',
      categoryId: categoryId,
      isDone: false,
      dateKey: dayKey,
      order: 999999,
      startTime: resolvedStart,
      endDateTime: endWall,
      tags: tags,
      planRowId: probePlanId,
    );
    final cascadedProbe = normalizeSequentialPlanTimesForDay([
      ...existingDayPlans,
      probe,
    ]).firstWhere((t) => t.planRowId == probePlanId);
    resolvedStart = cascadedProbe.startTime ?? resolvedStart;
    endWall = cascadedProbe.endDateTime ?? endWall;
"""
          new_probe = """    if (!usedCategoryDefault) {
      final dayKey =
          '${wallDay.year}-${_two(wallDay.month)}-${_two(wallDay.day)}';
      const probePlanId = '__auto_schedule_probe__';
      final probe = PlanningTask(
        id: 0,
        title: '',
        categoryId: categoryId,
        isDone: false,
        dateKey: dayKey,
        order: 999999,
        startTime: resolvedStart,
        endDateTime: endWall,
        tags: tags,
        planRowId: probePlanId,
      );
      final cascadedProbe = normalizeSequentialPlanTimesForDay([
        ...existingDayPlans,
        probe,
      ]).firstWhere((t) => t.planRowId == probePlanId);
      resolvedStart = cascadedProbe.startTime ?? resolvedStart;
      endWall = cascadedProbe.endDateTime ?? endWall;
    }
"""
          replace_once('lib/data/plans/plan_time_cascade_helpers.dart', old_probe, new_probe)
          replace_once(
              'lib/data/plans/plan_time_cascade_helpers.dart',
              "      final startUtc = wallUtcForCategoryDefaultWall(\n        wallDay: wallDay,\n",
              "      final startUtc = wallUtcForCategoryDefaultWall(\n"
              "        wallDay: DateTime(\n"
              "          resolvedStart.year,\n"
              "          resolvedStart.month,\n"
              "          resolvedStart.day,\n"
              "        ),\n",
          )

          # 6) The create POST must use the post-cascade optimistic schedule, not
          #    the pre-cascade task that can later snap back after server refresh.
          replace_once(
              'lib/data/plan_service.dart',
              "  }) async {\n    final optimisticId = 'optimistic-$clientPlanId';\n",
              "  }) async {\n"
              "    final optimisticId = 'optimistic-$clientPlanId';\n"
              "    var taskForCreate = task;\n",
          )
          replace_once(
              'lib/data/plan_service.dart',
              "            applySequentialTimeViewCascadeIfNeeded(wallDay: DateTime(y, m, d));\n          }\n",
              "            final wallDay = DateTime(y, m, d);\n"
              "            applySequentialTimeViewCascadeIfNeeded(wallDay: wallDay);\n"
              "            for (final candidate in planningDayTasksSnapshot(wallDay)) {\n"
              "              if ((candidate.planRowId?.trim() ?? '') == clientPlanId) {\n"
              "                taskForCreate = candidate;\n"
              "                break;\n"
              "              }\n"
              "            }\n"
              "          }\n",
          )
          replace_once(
              'lib/data/plan_service.dart',
              "      body = await _buildPocketPlanCreateBody(\n        task,\n",
              "      body = await _buildPocketPlanCreateBody(\n        taskForCreate,\n",
          )

          # 7) UI collision input must never include optimistic scheduled rows from another day.
          page = Path('lib/features/planning/planning_page.dart')
          s = page.read_text(encoding='utf-8')
          old = """      ..._optimisticTasks.where(
        (t) => t.dateKey == taskDateKey || t.startTime != null,
      ),
"""
          new = """      ..._optimisticTasks.where((t) {
        if (t.dateKey == taskDateKey) return true;
        final start = t.startTime;
        if (start == null) return false;
        return _dateKeyFromDate(start) == taskDateKey;
      }),
"""
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 optimistic day filters, found {count}')
          page.write_text(s.replace(old, new), encoding='utf-8')

          # Regression tests for visible range and source-level insertion contracts.
          visible_test = Path('test/plan_time_visible_window_test.dart')
          s = visible_test.read_text(encoding='utf-8')
          s = s.replace(
              "    test('default 7→23 remains valid', () {\n      final range = PlanTimeVisibleWindow.normalizeExtendedRange(7, 23);\n      expect(range.start, 7);\n      expect(range.end, 23);\n      expect(PlanTimeVisibleWindow.visibleDurationHours(7, 23), 16);\n    });\n",
              "    test('default day includes the 23:00 hour', () {\n"
              "      expect(PlanTimeVisibleWindow.defaultStartExtended, 7);\n"
              "      expect(PlanTimeVisibleWindow.defaultEndExtended, 24);\n"
              "      expect(\n"
              "        PlanTimeVisibleWindow.visibleExtendedHoursOrdered(7, 24).last,\n"
              "        23,\n"
              "      );\n"
              "      expect(PlanTimeVisibleWindow.visibleDurationHours(7, 24), 17);\n"
              "    });\n",
          )
          insert = """

    test('late scheduled content expands the rendered end boundary', () {
      final day = DateTime(2026, 6, 23);
      expect(
        PlanTimeVisibleWindow.endExtendedIncludingWallEnd(
          day,
          24,
          DateTime(2026, 6, 24, 1, 20),
        ),
        26,
      );
      expect(
        PlanTimeVisibleWindow.endExtendedIncludingWallEnd(
          day,
          24,
          DateTime(2026, 6, 24, 4),
        ),
        27,
      );
    });
"""
          marker = "    test('formatExtendedHourClock maps -3 to 21:00', () {"
          if marker not in s:
              raise SystemExit('visible-window test marker missing')
          s = s.replace(marker, insert + "\n" + marker, 1)
          visible_test.write_text(s, encoding='utf-8')

          auto_test = Path('test/auto_plan_nearest_free_slot_test.dart')
          s = auto_test.read_text(encoding='utf-8')
          marker = "  test('after-last placement is resolved before category default lookup', () {"
          extra = """  test('category-default automatic placement is allowed to cascade the day', () {
    final source = File(
      'lib/data/plans/plan_time_cascade_helpers.dart',
    ).readAsStringSync();
    expect(source, contains('final sameDefaultGroupPlans = <PlanningTask>['));
    expect(source, contains('var resolvedStart = usedCategoryDefault'));
    expect(source, contains('if (!usedCategoryDefault) {'));
  });

  test('create POST reads the post-cascade optimistic schedule', () {
    final source = File('lib/data/plan_service.dart').readAsStringSync();
    expect(source, contains('var taskForCreate = task;'));
    expect(source, contains('taskForCreate = candidate;'));
    expect(source, contains('_buildPocketPlanCreateBody(\n        taskForCreate,'));
  });

"""
          if marker not in s:
              raise SystemExit('auto test marker missing')
          s = s.replace(marker, extra + marker, 1)
          auto_test.write_text(s, encoding='utf-8')
          PY

          dart format \
            lib/shared/time/plan_time_visible_window.dart \
            lib/features/planning/planning_day_start_prefs.dart \
            lib/features/planning/time_view/planning_time_view_coordinator.dart \
            lib/features/planning/time_view/time_view_hour_grid.dart \
            lib/data/plans/plan_time_cascade_helpers.dart \
            lib/data/plan_service.dart \
            lib/features/planning/planning_page.dart \
            test/plan_time_visible_window_test.dart \
            test/auto_plan_nearest_free_slot_test.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run focused regression tests
        run: flutter test test/auto_plan_nearest_free_slot_test.dart test/plan_time_visible_window_test.dart test/plan_time_sequential_cascade_test.dart

      - name: Analyze changed scheduling sources
        run: flutter analyze lib/shared/time/plan_time_visible_window.dart lib/features/planning/planning_day_start_prefs.dart lib/features/planning/time_view/planning_time_view_coordinator.dart lib/features/planning/time_view/time_view_hour_grid.dart lib/data/plans/plan_time_cascade_helpers.dart lib/data/plan_service.dart lib/features/planning/planning_page.dart

      - name: Run architecture guard
        run: python3 scripts/architecture_guard.py

      - name: Remove one-shot helper and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-plan-insertion-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix category plan insertion and late timeline visibility'
          git push origin HEAD:fix/plan-insertion-timeline-v4
