name: TEMP Google Health account-link production verify

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-google-health-account-link-prod.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed account-link flow
        shell: bash
        run: |
          set -euo pipefail
          user="${SSH_USER:-root}"; host="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key; chmod 600 ~/.ssh/key
          ssh-keyscan -p "$SSH_PORT" -H "$host" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$SSH_PORT" "$user@$host" "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"; fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          runtime="$app_dir/pb_hooks/google_health_sleep_runtime.js"
          grep -q '__healthNeedsAccountSetup' "$runtime" && echo account_setup_detection=true || echo account_setup_detection=false
          grep -q 'dataSourceFamilies/google-sources' "$runtime" && echo google_sources=true || echo google_sources=false
          grep -q 'fitbit.google.com/auth/signup' "$runtime" && echo setup_redirect=true || echo setup_redirect=false
          curl -sS -o /dev/null -w 'health=%{http_code}\n' https://217-114-0-201.sslip.io/api/health
          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True); con.row_factory=sqlite3.Row
          r=con.execute("SELECT status,last_error,last_session_count,last_imported_count,length(coalesce(refresh_token_enc,'')) token_len FROM sleep_sync_connections WHERE provider='google_health' LIMIT 1").fetchone()
          print('connection='+str(bool(r)).lower())
          if r:
              err=(r['last_error'] or '').lower()
              print('status='+str(r['status'] or 'none'))
              print('token='+str((r['token_len'] or 0)>0).lower())
              print('account_not_linked='+str('account_not_linked' in err or 'account is not linked to google health' in err).lower())
              print('sessions='+str(r['last_session_count'] or 0))
              print('imported='+str(r['last_imported_count'] or 0))
          latest=con.execute("SELECT date(max(end_time)) FROM records WHERE title='Sleep' OR title='Сон'").fetchone()[0]
          print('latest_sleep_day='+str(latest or 'none'))
          print('google_health_records='+str(con.execute("SELECT count(*) FROM records WHERE sleep_source='google_health'").fetchone()[0]))
          con.close()
          PY
          REMOTE
          echo "web_build=$(curl -fsSL https://nkuchenov-hash.github.io/Counter/lifeos-build.txt | tr -d '\r\n' || true)"
