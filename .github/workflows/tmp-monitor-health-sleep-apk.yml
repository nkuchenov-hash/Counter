name: One-time monitor Health sleep APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-monitor-health-sleep-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for latest Android release run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-apk-build.yml/runs?per_page=10")
            python3 - <<'PY' "$JSON" > /tmp/run.txt
import json,sys
runs=json.loads(sys.argv[1]).get('workflow_runs') or []
for r in runs:
    if r.get('head_sha') == 'd27b5e56e81486f3a89625c20bd235722a181714':
        print(r.get('id',''))
        print(r.get('status',''))
        print(r.get('conclusion') or '')
        break
PY
            RUN_ID=$(sed -n '1p' /tmp/run.txt)
            STATUS=$(sed -n '2p' /tmp/run.txt)
            CONCLUSION=$(sed -n '3p' /tmp/run.txt)
            if [[ -n "$RUN_ID" && "$STATUS" == "completed" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "${RUN_ID:-}" ]]; then
            echo 'run_not_found' >&2
            exit 1
          fi
          ARTS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")
          python3 - <<'PY' "$RUN_ID" "$STATUS" "$CONCLUSION" "$ARTS" > android-health-sleep-build.txt
import json,sys
run_id,status,conclusion=sys.argv[1:4]
arts=json.loads(sys.argv[4]).get('artifacts') or []
print('run_id='+run_id)
print('status='+status)
print('conclusion='+conclusion)
print('artifact_count='+str(len(arts)))
for a in arts:
    print('artifact_id='+str(a.get('id','')))
    print('artifact_name='+str(a.get('name','')))
PY
          cat android-health-sleep-build.txt
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/result && mkdir /tmp/result
          cp android-health-sleep-build.txt /tmp/result/
          cd /tmp/result
          git init -q
          git checkout -q -b diag/health-sleep-apk-result
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m 'Record Health sleep APK result'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin HEAD:refs/heads/diag/health-sleep-apk-result
