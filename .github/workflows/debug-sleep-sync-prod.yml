name: Debug production sleep sync

on:
  push:
    branches:
      - debug/sleep-sync-prod-log-20260813

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$SSH_USER" >> "$GITHUB_ENV"
          echo "SSH_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Read stored PocketBase sleep-sync failure
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "SERVICE='${POCKETBASE_SERVICE:-pocketbase.service}' bash -s" <<'REMOTE'
          set -euo pipefail
          service="${SERVICE:-pocketbase.service}"
          app_dir="$(systemctl show "$service" -p WorkingDirectory --value)"
          db="$app_dir/pb_data/data.db"
          test -f "$db"
          DB_PATH="$db" python3 - <<'PY'
          import os, sqlite3, re
          db = os.environ['DB_PATH']
          con = sqlite3.connect(f'file:{db}?mode=ro', uri=True)
          con.row_factory = sqlite3.Row
          rows = con.execute('''
            SELECT status, last_error, last_sync_at, last_session_count,
                   last_imported_count, last_sleep_count, enabled, last_full_sync_at
            FROM sleep_sync_connections
            ORDER BY updated DESC
            LIMIT 5
          ''').fetchall()
          for i, row in enumerate(rows, 1):
              err = str(row['last_error'] or '')
              err = re.sub(r'(?i)(Bearer\s+|access_token[=: ]+|refresh_token[=: ]+|client_secret[=: ]+)[^ ,}\"]+', r'\1[REDACTED]', err)
              print(f'connection {i}: status={row["status"]} enabled={row["enabled"]} last_sync={row["last_sync_at"]} sessions={row["last_session_count"]} imported={row["last_imported_count"]} sleep={row["last_sleep_count"]} full_sync={row["last_full_sync_at"]}')
              print('last_error=' + err)
          PY
          REMOTE
