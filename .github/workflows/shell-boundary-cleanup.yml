name: Shell boundary cleanup

on:
  push:
    branches:
      - agent/shell-boundary-cleanup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shell-boundary-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/shell-boundary-cleanup
          fetch-depth: 0

      - name: Apply ownership cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')

          # 1) Shell shared helpers: delete the obsolete embedded Paths V2 implementation.
          shell_shared = root / 'lib/app/shell/shared/shell_shared.dart'
          shell_shared.write_text("""import 'package:counter/data/database_service.dart';
          import 'package:counter/data/models.dart';

          // --- Shell-local time helpers (Planetary: UTC + profile offset). ---
          DateTime shellDateOnly(DateTime dt) => DateTime(dt.year, dt.month, dt.day);

          bool shellSameCalendarDay(DateTime a, DateTime b) =>
              a.year == b.year && a.month == b.month && a.day == b.day;

          String shellTwoDigits(int n) => n.toString().padLeft(2, '0');

          DateTime shellLocalToday() =>
              DatabaseService.instance.getTimelineDeviceLocalToday();

          /// Planning task opened from quick-add / draft: not yet on server (no PATCH id).
          bool shellIsNewPlanningDraft(PlanningTask t) {
            if (t.id != 0) return false;
            final p = t.planRowId?.trim() ?? '';
            return p.isEmpty;
          }

          /// Hides a plan on the current day in optimistic merge until DELETE completes.
          const String shellOptimisticPurgeDateKey = '2099-12-31';
          const String shellPrefsRecordLinkSuggestionsEnabled =
              'plans_record_link_suggestions_enabled';
          const String shellPrefsRecordLinkSuggestionMode =
              'plans_record_link_suggestion_mode';
          const String shellPrefsRecordLinkSuggestionDismissed =
              'plans_record_link_suggestion_dismissed_record_ids';
          const String shellRecordLinkSuggestionModeAsk = 'ask';
          const String shellRecordLinkSuggestionModeAuto = 'auto';
          """.replace('          ', ''), encoding='utf-8')

          # 2) More menu: retain menu/navigation only, remove the retired Paths V1/V2/V3 page stack.
          more = root / 'lib/app/shell/shared/shell_more_menu.dart'
          text = more.read_text(encoding='utf-8')
          marker = 'mixin ShellMoreMenu on ShellCoreLogic {'
          assert marker in text, 'ShellMoreMenu marker not found'
          text = "part of '../app_shell.dart';\n\n" + text[text.index(marker):]
          start = text.index('  void openProjectPaths() {')
          end = text.index('  void openMoreMenu(', start)
          text = text[:start] + """  void openProjectPaths() {
            if (shellPageIndex == 6) return;
            setState(() => setShellPageIndex(6));
          }

          """.replace('          ', '') + text[end:]
          more.write_text(text, encoding='utf-8')

          # 3) Move data mutations/services to their domain owners without changing their behavior.
          daily_old = root / 'lib/app/shell/shared/shell_daily_routine.dart'
          daily_new = root / 'lib/data/plans/daily_routine_service.dart'
          daily_new.parent.mkdir(parents=True, exist_ok=True)
          assert daily_old.exists() and not daily_new.exists(), 'daily routine move precondition failed'
          shutil.move(daily_old, daily_new)

          governance_old = root / 'lib/app/shell/shared/shell_path_governance.dart'
          governance_new = root / 'lib/data/paths/legacy/path_governance_service.dart'
          governance_new.parent.mkdir(parents=True, exist_ok=True)
          assert governance_old.exists() and not governance_new.exists(), 'governance move precondition failed'
          shutil.move(governance_old, governance_new)
          governance = governance_new.read_text(encoding='utf-8')
          old_import = "import 'shell_daily_routine.dart';"
          assert old_import in governance, 'daily routine import not found in governance'
          governance = governance.replace(
              old_import,
              "import 'package:counter/data/plans/daily_routine_service.dart';",
          )
          governance_new.write_text(governance, encoding='utf-8')

          # 4) Shell imports the explicit data service for deferred startup baseline only.
          app_shell = root / 'lib/app/shell/app_shell.dart'
          app = app_shell.read_text(encoding='utf-8')
          old_import = "import 'package:counter/app/shell/shared/shell_path_governance.dart';"
          assert old_import in app, 'old governance import not found'
          app = app.replace(
              old_import,
              "import 'package:counter/data/paths/legacy/path_governance_service.dart';",
          )
          obsolete_override = """  /// Paths is a real shell destination. This override replaces the legacy
          /// nested-route implementation inherited from ShellMoreMenu. Opening Paths
          /// is therefore navigation only; the page itself performs read-only load.
          @override
          void openProjectPaths() {
            if (shellPageIndex == 6) return;
            setState(() => setShellPageIndex(6));
          }

          """.replace('          ', '')
          assert obsolete_override in app, 'redundant Paths override not found'
          app = app.replace(obsolete_override, '')
          app_shell.write_text(app, encoding='utf-8')

          # 5) Existing focused contract test follows the services to their real owners.
          routine_test = root / 'test/daily_routine_contract_test.dart'
          test = routine_test.read_text(encoding='utf-8')
          assert 'lib/app/shell/shared/shell_daily_routine.dart' in test
          assert 'lib/app/shell/shared/shell_path_governance.dart' in test
          test = test.replace(
              'lib/app/shell/shared/shell_daily_routine.dart',
              'lib/data/plans/daily_routine_service.dart',
          ).replace(
              'lib/app/shell/shared/shell_path_governance.dart',
              'lib/data/paths/legacy/path_governance_service.dart',
          )
          routine_test.write_text(test, encoding='utf-8')

          # 6) Canonical structure map: shell navigation only; compatibility logic owned by Brain.
          structure = root / 'docs/APP_STRUCTURE.md'
          doc = structure.read_text(encoding='utf-8')
          doc = doc.replace('## 0. Current status (2026-08-17)', '## 0. Current status (2026-08-18)')
          old_paths_status = "| **Paths ownership** | 2026-08-17: first-class UI under `lib/features/paths/`; Path domain transition adapter under `lib/data/paths/`; shell owns navigation only; opening Paths performs no migration or Planner generation |"
          new_paths_status = "| **Paths ownership** | 2026-08-18: first-class UI under `lib/features/paths/`; Path repository + marker-era compatibility/governance under `lib/data/paths/`; shell owns navigation only; opening Paths performs no migration or Planner generation |"
          assert old_paths_status in doc, 'Paths status row not found'
          doc = doc.replace(old_paths_status, new_paths_status)
          old_more = "| `app/shell/shared/shell_more_menu.dart` | More bottom sheet plus retained transition Path code; new Paths UI is owned by `features/paths/` *(part)* |"
          assert old_more in doc, 'shell_more_menu row not found'
          doc = doc.replace(old_more, "| `app/shell/shared/shell_more_menu.dart` | More bottom sheet and shell navigation actions only; Paths opens shell destination 6 *(part)* |")
          for stale in [
              "| `app/shell/shared/shell_path_governance.dart` | Transition Path audit and Path-action → Planner orchestration; first-class Paths does not invoke it on page open |\n",
              "| `app/shell/shared/shell_daily_routine.dart` | One-time bootstrap for baseline personal daily recurring Planner series; preserves existing/user-edited recurrence |\n",
          ]:
              assert stale in doc, f'stale shell row missing: {stale}'
              doc = doc.replace(stale, '')
          plan_anchor = "| `plans/diagnostics/plan_duplicate_log.dart` | Planning-domain duplicate / stream lifecycle markers inside Brain (not shared diagnostics, not feature UI) |"
          assert plan_anchor in doc, 'plan diagnostics anchor missing'
          doc = doc.replace(
              plan_anchor,
              "| `plans/daily_routine_service.dart` | Baseline personal recurring Planner series bootstrap and legacy dedupe; Brain-owned mutation service, not shell UI |\n" + plan_anchor,
          )
          path_anchor = "| `paths/path_repository.dart` | First-class Path domain boundary: transition storage interpretation, explicit Path/stage/action snapshots, duplicate-root reporting, generic structure audit, writes delegated to existing Brain plan APIs |"
          assert path_anchor in doc, 'Path repository anchor missing'
          doc = doc.replace(
              path_anchor,
              path_anchor + "\n| `paths/legacy/path_governance_service.dart` | Marker-era Path audit and Path-action → Planner compatibility orchestration; isolated from shell and not invoked by opening Paths |",
          )
          structure.write_text(doc, encoding='utf-8')

          # 7) Architecture law explicitly records the compatibility boundary.
          architecture = root / 'docs/ARCHITECTURE.md'
          arch = architecture.read_text(encoding='utf-8')
          old_row = "| `lib/data/paths/` | **Path domain** | `PathRepository` owns first-class Path interpretation and generic validation. Current storage is an adapter over existing plan-backed Path rows; feature UI must not parse marker rows directly. |"
          new_row = "| `lib/data/paths/` | **Path domain** | `PathRepository` owns first-class Path interpretation and generic validation. Current storage is an adapter over existing plan-backed Path rows; marker-era Path → Planner compatibility is isolated under `paths/legacy/`; feature UI and shell must not parse marker rows directly. |"
          assert old_row in arch, 'Architecture Path domain row missing'
          arch = arch.replace(old_row, new_row)
          anchor = "- The current `PathRepository` is a compatibility adapter over existing plan-backed Path roots; this does **not** redefine `plans` as the permanent Path schema.\n"
          assert anchor in arch, 'Architecture Paths→Planner anchor missing'
          arch = arch.replace(
              anchor,
              anchor + "- Marker-era audit and Path-action → Planner orchestration is transitional Brain logic under `lib/data/paths/legacy/`; it is never a shell/page-open responsibility and must disappear when durable Path revisions + the explicit Planner bridge replace it.\n",
          )
          architecture.write_text(arch, encoding='utf-8')

          # 8) Changelog records ownership-only intent and preserved behavior.
          changelog = root / 'CHANGELOG.md'
          ch = changelog.read_text(encoding='utf-8')
          entry = """## 2026-08-18 — Shell / Paths ownership cleanup [engineering]

          - Removed the retired embedded Paths V2/V3 UI/bootstrap stack from `shell_shared.dart` and `shell_more_menu.dart`; shell now only navigates to the first-class `PathsPage` destination.
          - Moved marker-era Path → Planner compatibility/governance to `lib/data/paths/legacy/` and daily-routine Planner bootstrap to `lib/data/plans/` without changing their scheduling/dedupe behavior or running them on Paths open.
          - Updated canonical architecture/structure docs and the existing focused contract test to the new owners.

          """.replace('          ', '')
          if not ch.startswith('## 2026-08-18 — Shell / Paths ownership cleanup [engineering]'):
              ch = entry + ch
          changelog.write_text(ch, encoding='utf-8')
          PY

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Prepare generated docs and format
        shell: bash
        run: |
          dart format \
            lib/app/shell/app_shell.dart \
            lib/app/shell/shared/shell_shared.dart \
            lib/app/shell/shared/shell_more_menu.dart \
            lib/data/paths/legacy/path_governance_service.dart \
            lib/data/plans/daily_routine_service.dart \
            test/daily_routine_contract_test.dart
          python scripts/manual/generate_app_structure_detailed.py

      - name: Assert shell boundary
        shell: bash
        run: |
          if git grep -n -E 'LIFEOS_PATH::V[12]|ExecutableCategoryPathsPage|ProjectPathsV3Page|_retireLegacyProjectPathsV1|bootstrapExecutablePortfolioPaths' -- lib/app/shell; then
            echo 'Legacy Path implementation still exists in shell.' >&2
            exit 1
          fi
          test ! -e lib/app/shell/shared/shell_path_governance.dart
          test ! -e lib/app/shell/shared/shell_daily_routine.dart
          test -e lib/data/paths/legacy/path_governance_service.dart
          test -e lib/data/plans/daily_routine_service.dart

      - name: Remove temporary workflow from final tree
        run: rm .github/workflows/shell-boundary-cleanup.yml

      - name: Run strict architecture guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Prepare Flutter environment
        shell: bash
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run focused contracts only
        shell: bash
        run: |
          flutter test test/paths/path_structure_audit_test.dart
          flutter test test/daily_routine_contract_test.dart
          flutter test test/shell_form_factor_test.dart

      - name: Final whitespace and working tree checks
        shell: bash
        run: |
          rm -f lib/core/env/env.dart
          git diff --check
          if git status --porcelain | grep 'lib/core/env/env.dart'; then
            echo 'env.dart leaked into final tree' >&2
            exit 1
          fi

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 1
          fi
          git commit -m 'Align shell ownership with Paths architecture'
          git push origin HEAD:agent/shell-boundary-cleanup
