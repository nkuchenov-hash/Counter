name: Validate native editor design PR

on:
  pull_request:
    paths:
      - 'lib/features/shared/**'
      - 'lib/features/notes/**'
      - 'test/editor_v45_chrome_test.dart'
      - '.github/workflows/editor-native-validation.yml'

permissions:
  contents: read

jobs:
  editor-native-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
      - run: python3 test/xiaomi_route_release_audit_test.py
      - run: node --check pb_hooks/xiaomi_sleep_runtime.js
      - run: flutter pub get
      - run: flutter test test/protected_session_release_audit_test.dart
      - name: Test editor behavior and capture real production widgets
        run: flutter test test/editor_v45_chrome_test.dart test/planning_edit_sheet_layout_test.dart --dart-define=LIFEOS_CAPTURE_V45=true --update-goldens
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v45-editor-visual-qa
          path: build/editor-v45-captures/*.png
          if-no-files-found: warn
      - name: Expose QA images for review
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for file in build/editor-v45-captures/*.png; do
            echo "V45_IMAGE_BEGIN $(basename "$file")"
            base64 -w 120 "$file"
            echo V45_IMAGE_END
          done
      - run: flutter test test/app_control_consistency_test.dart
      - run: flutter test test/record_notes_ime_stability_test.dart test/notes_mobile_keyboard_regression_test.dart test/timeline_record_edit_save_test.dart test/notes_clipboard_selection_contract_test.dart
      - run: flutter test test/planning_edit_sheet_layout_test.dart test/notes_canonical_components_test.dart
      - run: flutter build web --release --base-href=/Counter/ --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none --no-web-resources-cdn
