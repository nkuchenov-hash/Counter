name: Google Fit sleep production check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sleep-fit-prod-check.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect production
        shell: bash
        run: |
          set -euo pipefail
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" > /tmp/fit-state.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ {print $1; exit}')"; fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | head -n 1 || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$app_dir" && -d "$app_dir" ]]
          fit_env=false
          if [[ -f "$app_dir/.lifeos-google-fit.env" ]] && grep -q '^SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID=' "$app_dir/.lifeos-google-fit.env" && grep -q '^SLEEP_SYNC_GOOGLE_FIT_CLIENT_SECRET=' "$app_dir/.lifeos-google-fit.env"; then fit_env=true; fi
          runtime_fit=false
          if grep -q 'SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID' "$app_dir/pb_hooks/google_fit_sleep_runtime.js" && grep -q 'fitness.sleep.read' "$app_dir/pb_hooks/google_fit_sleep_runtime.js"; then runtime_fit=true; fi
          printf 'fit_env=%s\n' "$fit_env"
          printf 'runtime_fit=%s\n' "$runtime_fit"
          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True)
          con.row_factory=sqlite3.Row
          row=con.execute("""
            SELECT enabled,status,last_error,last_sync_at,last_session_count,last_imported_count,
                   length(coalesce(refresh_token_enc,'')) refresh_len
              FROM sleep_sync_connections
             WHERE provider='google_fit'
             ORDER BY updated DESC LIMIT 1
          """).fetchone()
          def cls(s):
              s=(s or '').lower()
              if not s:return 'none'
              if 'invalid_grant' in s:return 'invalid_grant'
              if 'account_not_linked' in s:return 'account_not_linked'
              if '403' in s or 'permission' in s or 'scope' in s:return 'permission'
              if '401' in s:return 'auth'
              return 'other'
          if row:
              print('connection=true')
              print('enabled='+str(bool(row['enabled'])).lower())
              print('status='+str(row['status']))
              print('refresh_token='+str(row['refresh_len']>0).lower())
              print('error='+cls(row['last_error']))
              print('last_sync='+str(bool(row['last_sync_at'])).lower())
              print('sessions='+str(row['last_session_count'] or 0))
              print('imported='+str(row['last_imported_count'] or 0))
          else:
              print('connection=false')
          for days in (2,7,30):
              n=con.execute("""SELECT count(*) FROM records WHERE (title='Sleep' OR title='Сон') AND end_time >= datetime('now', ?)""", (f'-{days} days',)).fetchone()[0]
              print(f'sleep_records_{days}d={n}')
          con.close()
          PY
          REMOTE

      - name: Publish sanitized result
        shell: bash
        run: |
          cp /tmp/fit-state.txt _tmp_sleep_fit_prod_state.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-sleep-fit-prod-check.yml
          git add _tmp_sleep_fit_prod_state.txt
          git commit -m 'Record sanitized Google Fit sleep production state'
          git pull --rebase origin main
          git push origin HEAD:main
