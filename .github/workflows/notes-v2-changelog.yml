name: Notes v2 changelog

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-editor-tools-v2
          fetch-depth: 0

      - name: Prepend Notes v2 changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## [2026-07-24] - Notes: contextual rich editor tools v2 [engineering]'
          if heading not in text:
              marker = '## [2026-07-23] - Structure: final repository completeness audit [engineering]'
              entry = '''## [2026-07-24] - Notes: contextual rich editor tools v2 [engineering]\n\n* **`lib/features/notes/` + `lib/data/models/note_*`:** Added backward-compatible `lifeos_notes_blocks_v2`, inline text marks, contextual `Aa`/Insert/selection tools, slash commands, lists, quote, callout, divider, code, collapsible, link-card and editable table blocks; legacy Notes migration, autosave, PocketBase schema, optimistic/offline paths, and existing library/editor shell remain compatible.\n* **Verification:** strict architecture guard, analyzer, two focused Notes tests, production web release build, and real Chrome runtime capture passed; final capture is `test/fixtures/notes_v2_tools_capture.png`.\n\n'''
              if marker not in text:
                  raise SystemExit('Expected changelog insertion marker not found')
              text = text.replace(marker, entry + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/notes-v2-changelog.yml

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Document Notes v2 editor tools [notes-v2-changelog]"
          git push origin HEAD:feature/notes-editor-tools-v2
