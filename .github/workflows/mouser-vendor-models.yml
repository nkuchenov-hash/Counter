name: Vendor Mouser licensed model assets
on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/mouser-vendor-models.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Fetch and verify four CC BY GLB files
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, struct, hashlib, json
          root=pathlib.Path('mouser-mvp/models')
          root.mkdir(parents=True,exist_ok=True)
          names=['wireless','gaming','vertical','trackball']
          credits=[]
          for name in names:
              filename=name+'-mouse.glb'
              url='https://vinish-models.pages.dev/keyboards-and-mice/'+filename
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mouser-Model-Vendor/1.0'}),timeout=30) as r:
                  data=r.read()
              assert data[:4]==b'glTF' and struct.unpack_from('<I',data,4)[0]==2 and struct.unpack_from('<I',data,8)[0]==len(data), name
              size,typ=struct.unpack_from('<II',data,12)
              assert typ==0x4E4F534A
              metadata=json.loads(data[20:20+size])
              (root/filename).write_bytes(data)
              digest=hashlib.sha256(data).hexdigest()
              credits.append(dict(file=filename,source=url,sha256=digest,asset=metadata.get('asset',{})))
              print(filename,len(data),digest,metadata.get('asset',{}),flush=True)
          (root/'credits.json').write_text(json.dumps(credits,indent=2,ensure_ascii=False)+'\n')
          (root/'LICENSE.md').write_text('# Model attribution\n\nWireless Mouse, Gaming Mouse, Vertical Mouse and Trackball Mouse by Vinish.Dev.\n\nSource: https://vinish.dev/free-3d-models/keyboards-and-mice\n\nLicense: Creative Commons Attribution 4.0 International, https://creativecommons.org/licenses/by/4.0/.\n\nGLB files are unmodified. The comparison viewer applies temporary palette and roughness adjustments. Original materials remain available.\n')
          PY
      - name: Commit only Mouser assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mouser-mvp/models/
          if git diff --cached --quiet; then echo "Assets already present"; exit 0; fi
          git commit -m "Vendor four licensed Mouser GLB models"
          git push origin HEAD:gh-pages
