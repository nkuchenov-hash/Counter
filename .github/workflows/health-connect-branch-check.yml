name: Health Connect branch check

on:
  push:
    branches:
      - feature/health-connect-sleep
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: ${{ !contains(github.event.head_commit.message, '[health-ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/health-connect-sleep

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/services/health_connect \
            lib/services/unfilled_time_notification_service.dart \
            lib/data/health \
            lib/data/records/unfilled_time_gap_policy.dart \
            lib/data/records/unfilled_time_gap_service.dart \
            lib/features/settings/health \
            lib/features/settings/notifications \
            lib/features/timeline/unfilled_time_gap_banner.dart \
            lib/features/profile/settings/notification_settings_section.dart \
            lib/app/shell/shared/shell_offline_banner.dart \
            lib/l10n/dictionary.dart \
            test/data/health_sleep_policy_test.dart \
            test/data/unfilled_time_gap_policy_test.dart

      - name: Document new structure and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          structure = Path('docs/APP_STRUCTURE.md')
          text = structure.read_text(encoding='utf-8')
          marker = '### Health Connect sleep and Timeline gap integrity (2026-07-27)'
          if marker not in text:
              section = r'''

          ### Health Connect sleep and Timeline gap integrity (2026-07-27)

          | File | Role |
          | :--- | :--- |
          | `services/health_connect/health_connect_sleep_models.dart` | Pure Health Connect sleep-session transport model. |
          | `services/health_connect/health_connect_sleep_service.dart` | Conditional Android/stub export for Health Connect sleep reads. |
          | `services/health_connect/health_connect_sleep_service_io.dart` | Android Health Connect permission and `SLEEP_SESSION` reader. |
          | `services/health_connect/health_connect_sleep_service_stub.dart` | Safe unsupported-platform implementation. |
          | `services/unfilled_time_notification_service.dart` | Android local notification bridge for Timeline gaps. |
          | `data/health/health_sleep_policy.dart` | Pure dedupe and authoritative sleep-overlap policy. |
          | `data/health/health_sleep_sync_service.dart` | Health sleep import coordinator using existing record/category Brain APIs. |
          | `data/records/unfilled_time_gap_policy.dart` | Pure interval merge and unfilled-time detection. |
          | `data/records/unfilled_time_gap_service.dart` | Gap lifecycle, settings, fill action, and notification eligibility. |
          | `features/settings/health/health_connect_settings_section.dart` | Health Connect permission, enable, status, and manual sync UI. |
          | `features/settings/notifications/unfilled_time_notifications_section.dart` | Generic gap notification controls. |
          | `features/timeline/unfilled_time_gap_banner.dart` | Persistent in-app gap prompt and fill sheet. |
          '''
              structure.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          log = changelog.read_text(encoding='utf-8')
          heading = '## [2026-07-27] - Health Connect sleep sync [implemented]'
          if heading not in log:
              entry = '''## [2026-07-27] - Health Connect sleep sync [implemented]\n\n* **Android Health Connect:** Added read-only `SLEEP_SESSION` permission flow and Mi Fitness-compatible sleep import.\n* **Timeline Brain:** Imported sleep is authoritative: prior activity stops at sleep start, conflicting rows inside sleep are removed, and repeat sync updates instead of duplicating. Existing record/category optimistic and offline paths remain the only PocketBase write route.\n* **Unfilled time:** Added generic Timeline gap detection, persistent fill prompt, and optional notification settings independent of sleep.\n* **PocketBase schema:** No migration required; external Health Connect identity is stored as an internal marker in the existing record note field.\n* **Verification:** Strict architecture guard, analyzer, and three focused policy tests run in the branch check.\n\n'''
              pos = log.find('## [')
              if pos >= 0:
                  log = log[:pos] + entry + log[pos:]
              else:
                  log = log.rstrip() + '\n\n' + entry
              changelog.write_text(log, encoding='utf-8')
          PY

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused policy tests
        run: |
          flutter test test/data/health_sleep_policy_test.dart test/data/unfilled_time_gap_policy_test.dart

      - name: Commit generated lock, formatting, and docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib test docs/APP_STRUCTURE.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[health-ci] Finalize Health Connect integration"
            git push origin HEAD:feature/health-connect-sleep
          fi
