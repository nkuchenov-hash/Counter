name: Xiaomi token and sleep sync check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaomi-token-sync-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Verify Xiaomi token and self-account sleep
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$app_dir" && -d "$app_dir" ]]
          py=/opt/lifeos-xiaomi-sleep/bin/python
          token="$app_dir/pb_data/xiaomi_sleep/chat-probe.token.json"
          [[ -f "$token" ]]
          echo 'XIAOMI_TOKEN_EXISTS=true'

          fork=/tmp/lifeos-mi-health-mcp
          rm -rf "$fork"
          git clone -q --depth 1 https://github.com/ilyanehay/mi-health-mcp.git "$fork"
          pkg="$(find "$fork/vendor/mi-fitness-python" -type d -name mi_fitness -print -quit)"
          [[ -n "$pkg" ]]
          src="$(dirname "$pkg")"
          code=$'import asyncio,json,sys\nfrom datetime import date\nfrom mi_fitness import MiHealthClient\nasync def main():\n    token=sys.argv[1]\n    td=json.load(open(token,encoding="utf-8"))\n    uid=int(str(td.get("user_id") or "0"))\n    async with MiHealthClient.from_token(token) as c:\n        rows=await c.get_sleep(uid,date.today(),days=7)\n    out=[]\n    for r in rows or []:\n        for s in getattr(r,"segment_details",None) or []:\n            out.append((getattr(s,"bedtime",0),getattr(s,"wake_up_time",0)))\n    print("FORK_SYNC_OK=true")\n    print("FORK_SLEEP_DAYS="+str(len(rows or [])))\n    print("FORK_SLEEP_SEGMENTS="+str(len(out)))\n    if out:\n        from datetime import datetime,timezone\n        latest=max(float(x[1] or 0) for x in out)\n        if latest>1000000000000: latest/=1000\n        print("FORK_LATEST_SLEEP_DAY="+datetime.fromtimestamp(latest,tz=timezone.utc).date().isoformat())\nasyncio.run(main())'
          set +e
          output="$(PYTHONPATH="$src" "$py" -c "$code" "$token" 2>/tmp/lifeos-xiaomi-fork.err)"
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            printf '%s\n' "$output"
            echo 'FORK_ERROR=none'
          else
            echo 'FORK_SYNC_OK=false'
            echo "FORK_RC=$rc"
            err_class="$(tail -n 1 /tmp/lifeos-xiaomi-fork.err | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*):.*/\1/' | tr -cd 'A-Za-z0-9_')"
            echo "FORK_ERROR_CLASS=${err_class:-unknown}"
          fi
          REMOTE
