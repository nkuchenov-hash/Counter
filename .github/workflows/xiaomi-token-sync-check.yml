name: Xiaomi token and sleep sync check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaomi-token-sync-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Inspect sanitized Xiaomi self sleep response
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          py=/opt/lifeos-xiaomi-sleep/bin/python
          token=/root/pb/pb_data/xiaomi_sleep/chat-probe.token.json
          [[ -f "$token" ]]
          code=$'import asyncio,sys,time,json\nfrom mi_fitness import MiHealthClient\nasync def main():\n    end=int(time.time()); start=end-8*86400\n    async with MiHealthClient.from_token(sys.argv[1]) as c:\n        r=await c._request("POST","/app/v1/data/get_fitness_data_by_time",params={"start_time":start,"end_time":end,"key":"sleep"})\n    result=r.get("result") or {}; rows=result.get("data_list") or []\n    print("SELF_API_OK=true")\n    print("SELF_DATA_LIST_COUNT="+str(len(rows)))\n    print("SELF_HAS_MORE="+str(bool(result.get("has_more"))).lower())\n    if rows:\n        first=rows[0]\n        print("SELF_ITEM_KEYS="+",".join(sorted(first.keys())))\n        for k,v in first.items():\n            print("SELF_ITEM_TYPE_"+str(k).upper()+"="+type(v).__name__)\n            if isinstance(v,dict): print("SELF_ITEM_DICT_"+str(k).upper()+"_KEYS="+",".join(sorted(v.keys())))\n            elif isinstance(v,str):\n                try:\n                    x=json.loads(v)\n                    if isinstance(x,dict): print("SELF_ITEM_JSON_"+str(k).upper()+"_KEYS="+",".join(sorted(x.keys())))\n                    elif isinstance(x,list): print("SELF_ITEM_JSON_"+str(k).upper()+"_LIST_LEN="+str(len(x)))\n                except Exception: pass\nasyncio.run(main())'
          "$py" -c "$code" "$token"
          REMOTE
