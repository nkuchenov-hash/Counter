name: Xiaomi token and sleep sync check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaomi-token-sync-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Verify target sleep date through Xiaomi RU cloud
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          py=/opt/lifeos-xiaomi-sleep/bin/python
          token=/root/pb/pb_data/xiaomi_sleep/chat-probe.token.json
          [[ -f "$token" ]]
          code=$'import asyncio,sys,time,json\nfrom datetime import datetime,timezone\nfrom mi_fitness import MiHealthClient\ndef sec(v):\n    try:\n        x=float(v or 0)\n    except Exception:\n        return 0\n    if x>1e12: x/=1000\n    return x\nasync def main():\n    end=int(time.time()); start=end-8*86400\n    async with MiHealthClient.from_token(sys.argv[1], base_url="https://ru.hlth.io.mi.com") as c:\n        r=await c._request("POST","/app/v1/data/get_fitness_data_by_time",params={"start_time":start,"end_time":end,"key":"sleep"})\n    rows=(r.get("result") or {}).get("data_list") or []\n    target="2026-08-27"\n    target_found=False\n    parseable=0\n    for row in rows:\n        try: v=json.loads(row.get("value") or "{}")\n        except Exception: v={}\n        wake=sec(v.get("wake_up_time") or v.get("device_wake_up_time") or row.get("time"))\n        if wake>0:\n            parseable+=1\n            d=datetime.fromtimestamp(wake,tz=timezone.utc).date().isoformat()\n            if d==target: target_found=True\n    print("RU_SELF_API_OK=true")\n    print("RU_SLEEP_RECORDS="+str(len(rows)))\n    print("RU_SLEEP_PARSEABLE="+str(parseable))\n    print("RU_HAS_AUG27="+str(target_found).lower())\nasyncio.run(main())'
          "$py" -c "$code" "$token"
          REMOTE
