name: Xiaomi token and sleep sync check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaomi-token-sync-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Inspect installed mi-fitness sleep implementation
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          py=/opt/lifeos-xiaomi-sleep/bin/python
          "$py" -c 'import inspect; from mi_fitness import MiHealthClient; print("CLIENT_FILE="+str(inspect.getsourcefile(MiHealthClient))); print("GET_SLEEP_SIGNATURE="+str(inspect.signature(MiHealthClient.get_sleep))); print("---GET_SLEEP_SOURCE---"); print(inspect.getsource(MiHealthClient.get_sleep)); print("---METHODS---"); [print(n, inspect.signature(getattr(MiHealthClient,n))) for n in dir(MiHealthClient) if callable(getattr(MiHealthClient,n)) and any(x in n.lower() for x in ("sleep","famil","relative","member"))]'
          file="$($py -c 'import inspect; from mi_fitness import MiHealthClient; print(inspect.getsourcefile(MiHealthClient))')"
          echo '---PACKAGE_MATCHES---'
          grep -R -n -E 'FamilyMemberNotFound|get_sleep|sleep.*member|relative' "$(dirname "$file")" | head -120 || true
          REMOTE
