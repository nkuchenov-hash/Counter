name: Xiaomi token and sleep sync check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaomi-token-sync-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Probe Xiaomi self-account sleep API
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          py=/opt/lifeos-xiaomi-sleep/bin/python
          token=/root/pb/pb_data/xiaomi_sleep/chat-probe.token.json
          [[ -f "$token" ]]
          echo 'XIAOMI_TOKEN_EXISTS=true'
          code=$'import asyncio,sys,time,json\nfrom mi_fitness import MiHealthClient\nasync def main():\n    token=sys.argv[1]\n    end=int(time.time())\n    start=end-8*86400\n    try:\n        async with MiHealthClient.from_token(token) as c:\n            r=await c._request("POST","/app/v1/data/get_fitness_data_by_time",params={"start_time":start,"end_time":end,"key":"sleep"})\n        print("SELF_API_OK=true")\n        print("SELF_TOP_KEYS="+",".join(sorted(r.keys())))\n        for k,v in r.items():\n            if isinstance(v,list): print("SELF_LIST_"+k.upper()+"="+str(len(v)))\n            elif isinstance(v,dict): print("SELF_DICT_"+k.upper()+"_KEYS="+",".join(sorted(v.keys())))\n    except Exception as e:\n        print("SELF_API_OK=false")\n        print("SELF_ERROR_CLASS="+type(e).__name__)\n        print("SELF_ERROR="+str(e).split("\\n",1)[0][:240])\nasyncio.run(main())'
          "$py" -c "$code" "$token"
          REMOTE
