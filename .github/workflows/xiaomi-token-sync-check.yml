name: Xiaomi token and sleep sync check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaomi-token-sync-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Bind probe token when profile is unambiguous
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          py=/opt/lifeos-xiaomi-sleep/bin/python
          db=/root/pb/pb_data/data.db
          probe=/root/pb/pb_data/xiaomi_sleep/chat-probe.token.json
          [[ -f "$db" ]]
          [[ -f "$probe" ]]
          code=$'import os,sqlite3,shutil,sys\ndb,probe=sys.argv[1],sys.argv[2]\nc=sqlite3.connect(db)\ncur=c.cursor()\ndef rows(q,p=()):\n    try: return cur.execute(q,p).fetchall()\n    except Exception: return []\nprofiles=[str(r[0]) for r in rows("select id from profiles")]\nconnections=rows("select user_id,provider,enabled from sleep_sync_connections")\nx=[str(r[0]) for r in connections if str(r[1])=="xiaomi"]\ng=[str(r[0]) for r in connections if str(r[1]) in ("google_health","google_fit")]\nprint("PROFILE_COUNT="+str(len(profiles)))\nprint("XIAOMI_CONNECTION_COUNT="+str(len(x)))\nprint("GOOGLE_CONNECTION_COUNT="+str(len(g)))\ncandidate=None\nif len(set(x))==1: candidate=list(set(x))[0]\nelif len(set(g))==1: candidate=list(set(g))[0]\nelif len(profiles)==1: candidate=profiles[0]\nif not candidate:\n    print("BIND_CANDIDATE=ambiguous")\n    raise SystemExit(2)\nprint("BIND_CANDIDATE=unique")\nout=os.path.join(os.path.dirname(probe),candidate+".token.json")\nshutil.copyfile(probe,out)\nos.chmod(out,0o600)\nprint("TOKEN_BOUND=true")\nprint("XIAOMI_CONNECTION_EXISTS="+str(candidate in x).lower())\n'
          "$py" -c "$code" "$db" "$probe"
          REMOTE
