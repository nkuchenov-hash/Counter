name: Xiaomi token and sleep sync check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaomi-token-sync-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Verify Xiaomi sleep local date and freshness
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          py=/opt/lifeos-xiaomi-sleep/bin/python
          token=/root/pb/pb_data/xiaomi_sleep/chat-probe.token.json
          [[ -f "$token" ]]
          code=$'import asyncio,sys,time,json\nfrom datetime import datetime,timezone\nfrom mi_fitness import MiHealthClient\ndef sec(v):\n    try: x=float(v or 0)\n    except Exception: return 0\n    while x>1e12: x/=1000\n    return x\ndef offset(row,v):\n    raw=row.get("zone_offset", v.get("timezone",0))\n    try: x=float(raw or 0)\n    except Exception: x=0\n    if abs(x)<=24: x*=3600\n    return x if abs(x)<=86400 else 0\ndef day(ts,off=0):\n    return datetime.fromtimestamp(ts+off,tz=timezone.utc).date().isoformat() if ts>0 else ""\nasync def main():\n    end=int(time.time()); start=end-10*86400\n    async with MiHealthClient.from_token(sys.argv[1], base_url="https://ru.hlth.io.mi.com") as c:\n        r=await c._request("POST","/app/v1/data/get_fitness_data_by_time",params={"start_time":start,"end_time":end,"key":"sleep"})\n    rows=(r.get("result") or {}).get("data_list") or []\n    target="2026-08-27"; labels=set(); local_wake=set(); local_bed=set(); row_days=set()\n    for row in rows:\n        try: v=json.loads(row.get("value") or "{}")\n        except Exception: v={}\n        off=offset(row,v)\n        wake=sec(v.get("wake_up_time") or v.get("device_wake_up_time")); bed=sec(v.get("bedtime") or v.get("device_bedtime")); rt=sec(row.get("time"))\n        if wake: local_wake.add(day(wake,off))\n        if bed: local_bed.add(day(bed,off))\n        if rt: row_days.add(day(rt,off))\n    all_days=local_wake|local_bed|row_days\n    print("RU_SLEEP_RECORDS="+str(len(rows)))\n    print("RU_HAS_AUG27_LOCAL="+str(target in all_days).lower())\n    print("RU_LATEST_LOCAL_DAY="+(max(all_days) if all_days else "none"))\nasyncio.run(main())'
          "$py" -c "$code" "$token"
          REMOTE
