name: Xiaomi token and sleep sync check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaomi-token-sync-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Verify Xiaomi token and API sync
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$app_dir" && -d "$app_dir" ]]
          py=/opt/lifeos-xiaomi-sleep/bin/python
          bridge="$app_dir/pb_hooks/xiaomi_sleep_bridge.py"
          token="$app_dir/pb_data/xiaomi_sleep/chat-probe.token.json"
          state="$app_dir/pb_data/xiaomi_sleep/chat-probe.state.json"
          if [[ ! -f "$token" ]]; then
            echo 'XIAOMI_TOKEN_EXISTS=false'
            if [[ -f "$state" ]]; then "$py" -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); print("LOGIN_STATE="+str(d.get("status","unknown")))' "$state"; fi
            exit 2
          fi
          echo 'XIAOMI_TOKEN_EXISTS=true'
          result="$($py "$bridge" sync --token-path "$token" --days 7)"
          "$py" -c 'import json,sys; d=json.loads(sys.argv[1]); rows=d.get("sessions") or []; print("XIAOMI_SYNC_OK="+str(bool(d.get("ok"))).lower()); print("XIAOMI_SESSION_COUNT="+str(len(rows))); print("XIAOMI_HAS_RECENT="+str(bool(rows)).lower()); print("XIAOMI_ERROR="+str(d.get("error") or "none"))' "$result"
          REMOTE
