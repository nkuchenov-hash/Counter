name: Inspect shell cleanup status

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read

jobs:
  inspect:
    if: github.head_ref == 'agent/shell-boundary-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Show cleanup workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo nkuchenov-hash/Counter --workflow shell-boundary-cleanup.yml --branch agent/shell-boundary-cleanup --limit 10 --json databaseId,status,conclusion,event,headSha,createdAt,updatedAt,url
