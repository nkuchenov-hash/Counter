name: Temporary recurrence future-split patch

on:
  push:
    branches:
      - fix/recurrence-dialog-alignment

permissions:
  contents: write

jobs:
  patch-recurrence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recurrence model update
        run: python scripts/manual/recurrence_patch_once.py

      - name: Remove one-shot patch files and regenerate detailed manifest
        run: |
          rm .github/workflows/recurrence-split-patch.yml
          rm scripts/manual/recurrence_patch_once.py
          git add -A .github/workflows/recurrence-split-patch.yml scripts/manual/recurrence_patch_once.py
          python scripts/manual/generate_app_structure_detailed.py

      - name: Commit generated recurrence update
        run: |
          git config user.name "life-os-recurrence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make recurring history immutable"
          git push origin HEAD:fix/recurrence-dialog-alignment
