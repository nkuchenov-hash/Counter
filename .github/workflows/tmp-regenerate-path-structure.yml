name: Temporary regenerate Paths structure parity

on:
  push:
    branches:
      - feat/paths-editors-options-20260904

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paths-editors-options-20260904
      - name: Remove temporary workflow before generating structure
        run: rm .github/workflows/tmp-regenerate-path-structure.yml
      - name: Regenerate detailed structure guide from final tree
        run: python3 scripts/manual/generate_app_structure_detailed.py
      - name: Verify documentation parity before commit
        run: python3 scripts/audit/documentation_parity.py
      - name: Commit final structure parity and workflow removal
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          git add -A
          git commit -m "Fix Paths editor structure parity"
          git push origin HEAD:feat/paths-editors-options-20260904
