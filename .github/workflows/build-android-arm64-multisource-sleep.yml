name: Android arm64 multi-source sleep build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          cat > lib/core/env/env.dart <<'EOF'
          abstract final class Env {
            static const String placeholder = '';
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64 release APK
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build apk --release --split-per-abi --target-platform android-arm64 --no-tree-shake-icons \
            --dart-define=GIT_COMMIT="29596f0" \
            --dart-define=BUILD_TIME="$BUILD_TIME"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LifeOS-MultiSource-Sleep-29596f0-arm64.apk
          ls -lh LifeOS-MultiSource-Sleep-29596f0-arm64.apk

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-MultiSource-Sleep-29596f0-arm64
          path: LifeOS-MultiSource-Sleep-29596f0-arm64.apk
          if-no-files-found: error
          retention-days: 30
