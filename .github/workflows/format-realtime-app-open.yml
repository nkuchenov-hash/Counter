name: Format realtime app-open fix

on:
  push:
    branches:
      - 'fix/realtime-on-app-open-20260805'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/realtime-on-app-open-20260805'
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - run: dart format lib/data/db_core.dart test/realtime_app_open_contract_test.dart
      - name: Commit and remove temporary formatter
        run: |
          rm .github/workflows/format-realtime-app-open.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format realtime app-open fix'
          git push origin HEAD:fix/realtime-on-app-open-20260805
