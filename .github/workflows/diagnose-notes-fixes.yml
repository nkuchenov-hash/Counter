name: Diagnose Notes fixes

on:
  push:
    branches:
      - fix/notes-uncheck-structured-copy

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Notes toggle and copy paths
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== toggleNoteDone definitions/calls ==='
          grep -R -n -C 12 "toggleNoteDone" lib test || true
          echo '=== note done/pinned/timestamp helpers ==='
          grep -R -n -C 8 "ensureNoteTimestampsHydrated\|isNotePinned\|note.*Done" lib/data lib/features/notes test || true
          echo '=== structured clipboard/context menu ==='
          grep -n -C 30 "_buildSelectionContextMenu\|_writeStructuredClipboard\|CopySelectionTextIntent\|ContextMenuButtonType.copy\|LogicalKeyboardKey.keyC\|SingleActivator.*keyC" lib/features/notes/note_editor_page.dart || true
          echo '=== existing note clipboard tests ==='
          grep -R -n -C 12 "structuredClipboardExportTextForTest\|noteToMarkdownForTest\|clipboard.*structure\|structured.*clipboard" test || true
          echo '=== note-related test filenames ==='
          find test -type f | grep -Ei 'note|lists' | sort || true
