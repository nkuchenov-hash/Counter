name: Temporary desktop gutter unification v4

on:
  push:
    branches:
      - fix/unify-desktop-content-gutters-20260904

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message == 'Run desktop gutter unification v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-desktop-content-gutters-20260904
          fetch-depth: 0

      - name: Apply patch
        run: python tmp_apply_desktop_gutters.py

      - name: Remove temporary repository files
        run: rm -f tmp_apply_desktop_gutters.py .github/workflows/tmp-unify-desktop-gutters.yml .github/workflows/tmp-unify-desktop-gutters-v2.yml .github/workflows/tmp-unify-desktop-gutters-v3.yml .github/workflows/tmp-unify-desktop-gutters-v4.yml

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Create env.dart
        run: |
          mkdir -p lib/config
          cat > lib/config/env.dart <<'DART'
          class Env {
            static const String pocketBaseUrl = '';
            static const String googleFitClientId = '';
            static const String googleFitClientSecret = '';
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Restore lockfile
        run: git checkout -- pubspec.lock

      - name: Format changed Dart
        run: dart format lib/core/shell_adaptive.dart lib/core/widgets/compact_nav_controls.dart lib/features/timeline/timeline_header_controls.dart lib/features/timeline/timeline_day_page.dart lib/features/stats/stats_view.dart lib/features/stats/stats_detail_tree.dart lib/features/stats/stats_visual_overview.dart lib/features/planning/widgets/planning_filter_controls.dart lib/features/planning/planning_page.dart lib/features/planning/widgets/planning_category_grouped_list.dart lib/features/planning/widgets/planning_tag_grouped_list.dart lib/features/calendar/calendar_chrome_header.dart lib/features/calendar/calendar_view.dart lib/features/calendar/calendar_day_panel.dart lib/features/paths/paths_page.dart lib/features/settings/categories/category_row_widget.dart lib/features/notes/notes_glm_surface.dart lib/app/shell/app_shell.dart lib/app/shell/shared/shell_chrome.dart lib/core/widgets/app_settings_layout.dart

      - name: Analyze touched UI
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/app/shell/app_shell.dart lib/core/widgets/compact_nav_controls.dart lib/features/timeline/timeline_header_controls.dart lib/features/timeline/timeline_day_page.dart lib/features/stats/stats_view.dart lib/features/stats/stats_detail_tree.dart lib/features/stats/stats_visual_overview.dart lib/features/planning/planning_page.dart lib/features/planning/widgets/planning_filter_controls.dart lib/features/planning/widgets/planning_category_grouped_list.dart lib/features/planning/widgets/planning_tag_grouped_list.dart lib/features/calendar/calendar_view.dart lib/features/calendar/calendar_chrome_header.dart lib/features/calendar/calendar_day_panel.dart lib/features/paths/paths_page.dart lib/features/settings/categories/category_row_widget.dart lib/features/notes/notes_glm_surface.dart lib/core/widgets/app_settings_layout.dart

      - name: Remove env stub and directory
        run: rm -rf lib/config

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check governing documentation parity
        run: python scripts/audit/documentation_parity.py

      - name: Check repository hygiene and structure growth
        env:
          STRUCTURE_GROWTH_BASE: ${{ github.event.before }}
        run: python scripts/audit/repository_hygiene.py

      - name: Check PocketBase schema parity
        run: python scripts/audit/pocketbase_schema_contract.py

      - name: Check deployment ordering contract
        run: python scripts/audit/deployment_contract.py

      - name: Check PocketBase JavaScript syntax
        shell: bash
        run: |
          mapfile -d '' files < <(find pb_hooks pb_migrations -type f -name '*.js' -print0 | sort -z)
          for file in "${files[@]}"; do node --check "$file"; done

      - name: Check whitespace
        run: git diff --check

      - name: Build release web
        run: |
          mkdir -p lib/config
          cat > lib/config/env.dart <<'DART'
          class Env {
            static const String pocketBaseUrl = '';
            static const String googleFitClientId = '';
            static const String googleFitClientSecret = '';
          }
          DART
          flutter build web --release
          rm -rf lib/config

      - name: Commit final fix
        run: |
          git config user.name 'nkuchenov-hash'
          git config user.email 'nkuchenov-hash@users.noreply.github.com'
          git add -A
          git commit -m 'Unify desktop section gutters and top inset'
          git push origin HEAD:fix/unify-desktop-content-gutters-20260904
