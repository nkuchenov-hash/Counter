name: Apply Notes v2 production integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-editor-tools-v2
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Apply integration patch
        run: python scripts/manual/apply_notes_v2_integration.py

      - name: Format changed Dart
        run: |
          dart format \
            lib/data/models.dart \
            lib/data/models/note_rich_types.dart \
            lib/data/models/note_document.dart \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_editor_tools.dart \
            lib/features/notes/widgets/notes_special_block_widgets.dart \
            test/note_document_v2_test.dart

      - name: Strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "error •|error -|[0-9]+ issues? found" analyze.log > notes_v2_analyzer_errors.txt || tail -120 analyze.log > notes_v2_analyzer_errors.txt
            exit "$status"
          fi
          tail -20 analyze.log

      - name: Commit analyzer diagnostics on failure
        if: ${{ steps.analyze.outcome == 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes_v2_analyzer_errors.txt
          git commit -m "Capture Notes v2 analyzer errors [notes-v2-errors]"
          git push origin HEAD:feature/notes-editor-tools-v2
          exit 1

      - name: Focused Notes tests
        run: |
          flutter test test/note_document_test.dart
          flutter test test/note_document_v2_test.dart

      - name: Web build
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Remove one-shot patch tooling
        run: |
          rm scripts/manual/apply_notes_v2_integration.py
          rm .github/workflows/notes-v2-apply.yml
          rm -f notes_v2_analyzer_errors.txt

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Notes v2 editor tools [notes-v2-applied]"
          git push origin HEAD:feature/notes-editor-tools-v2
