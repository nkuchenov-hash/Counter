name: Temp Stats Real Scale

on:
  push:
    branches:
      - fix/stats-day-real-scale-20260810

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove artificial minimum activity height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/stats/day_stats_dashboard.dart')
          s = p.read_text()
          old = """                            final rawHeight = math.max(\n                              2.0,\n                              (endMinutes - startMinutes) / 60 * hourHeight,\n                            );\n                            final blockHeight = math.min(\n                              math.max(mobile ? 20.0 : 18.0, rawHeight),\n                              math.max(2.0, gridHeight - top),\n                            );\n"""
          new = """                            final rawHeight =\n                                (endMinutes - startMinutes) / 60 * hourHeight;\n                            final blockHeight = math.min(\n                              rawHeight,\n                              math.max(0.0, gridHeight - top),\n                            );\n"""
          if old not in s:
              raise SystemExit('Expected timeline block-height code not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          echo "abstract final class Env { static const String placeholder = ''; }" > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format and validate
        run: |
          dart format lib/features/stats/day_stats_dashboard.dart
          flutter analyze lib/features/stats/day_stats_dashboard.dart
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Persist only production code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-stats-real-scale.yml
          git add lib/features/stats/day_stats_dashboard.dart
          git commit -m "Keep Stats timeline blocks at real duration scale"
          git push
