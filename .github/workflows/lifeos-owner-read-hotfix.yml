name: LIFE OS owner read hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lifeos-owner-read-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch legacy-compatible owner reads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          plan = 'lib/data/plan_service.dart'
          replace_once(
              plan,
              '''      final authId = _userIdForWhere;
      if (authId == null || authId.isEmpty) return null;
      final uid = _escapeForPbFilter(authId);
      final esc = _escapeForPbFilter(key);
      final rec = await _pb
          .collection(PbCollections.plans)
          .getFirstListItem('plan_id = "$esc" && user_id = "$uid"');
''',
              '''      final ownerFilter = _pocketBaseOwnerFilterClauseForRecords();
      if (ownerFilter == null || ownerFilter.isEmpty) return null;
      final esc = _escapeForPbFilter(key);
      final rec = await _pb
          .collection(PbCollections.plans)
          .getFirstListItem('plan_id = "$esc" && $ownerFilter');
''',
              'plan id resolution',
          )
          replace_once(
              plan,
              '''    final authId = _userIdForWhere;
    if (authId == null || authId.isEmpty) return [];
    final uid = _escapeForPbFilter(authId);
    final sw = Stopwatch()..start();
''',
              '''    final ownerFilter = _pocketBaseOwnerFilterClauseForRecords();
    if (ownerFilter == null || ownerFilter.isEmpty) return [];
    final sw = Stopwatch()..start();
''',
              'all plans owner setup',
          )
          replace_once(
              plan,
              '''            expand: kPbPlanTagsExpand,
            filter: 'user_id = "$uid"',
            batch: 200,
''',
              '''            expand: kPbPlanTagsExpand,
            filter: ownerFilter,
            batch: 200,
''',
              'all plans query',
          )
          replace_once(
              plan,
              '''      final authId = _userIdForWhere;
      if (authId == null || authId.isEmpty) return [];
      final uid = _escapeForPbFilter(authId);
      final list = await _pb
          .collection(PbCollections.plans)
          .getFullList(filter: 'user_id = "$uid"', expand: kPbPlanTagsExpand);
''',
              '''      final ownerFilter = _pocketBaseOwnerFilterClauseForRecords();
      if (ownerFilter == null || ownerFilter.isEmpty) return [];
      final list = await _pb
          .collection(PbCollections.plans)
          .getFullList(filter: ownerFilter, expand: kPbPlanTagsExpand);
''',
              'fetchPlans query',
          )
          replace_once(
              plan,
              '''  String? _pocketBaseOwnerFilterClauseForPlans() {
    final uid = _userIdForWhere?.trim() ?? '';
    if (uid.isEmpty) return null;
    return 'user_id = "${_escapeForPbFilter(uid)}"';
  }
''',
              '''  String? _pocketBaseOwnerFilterClauseForPlans() {
    return _pocketBaseOwnerFilterClauseForRecords();
  }
''',
              'plans realtime filter',
          )

          notes = 'lib/data/plans/notes_brain_helpers.dart'
          replace_once(
              notes,
              '''      final authId = _userIdForWhere;
      if (authId == null || authId.isEmpty) return;
      final uid = _escapeForPbFilter(authId);
      final rows = await _pb
          .collection(PbCollections.plans)
          .getFullList(
            filter: 'user_id = "$uid"',
            fields: 'id,created,updated',
''',
              '''      final ownerFilter = _pocketBaseOwnerFilterClauseForRecords();
      if (ownerFilter == null || ownerFilter.isEmpty) return;
      final rows = await _pb
          .collection(PbCollections.plans)
          .getFullList(
            filter: ownerFilter,
            fields: 'id,created,updated',
''',
              'notes timestamp query',
          )

          tags = 'lib/data/profile/tag_catalog.dart'
          replace_once(
              tags,
              '''      final authId = _userIdForWhere;
      if (authId == null || authId.isEmpty) return [];
      final uid = _escapeForPbFilter(authId);
      final list = await _pb
          .collection(PbCollections.tags)
          .getFullList(filter: 'user_id = "$uid"');
''',
              '''      final ownerFilter = _pocketBaseOwnerFilterClauseForRecords();
      if (ownerFilter == null || ownerFilter.isEmpty) return [];
      final list = await _pb
          .collection(PbCollections.tags)
          .getFullList(filter: ownerFilter);
''',
              'tags query',
          )

          assert "getFirstListItem('plan_id = \"$esc\" && $ownerFilter')" in Path(plan).read_text(encoding='utf-8')
          assert 'getFullList(filter: ownerFilter, expand: kPbPlanTagsExpand)' in Path(plan).read_text(encoding='utf-8')
          assert 'return _pocketBaseOwnerFilterClauseForRecords();' in Path(plan).read_text(encoding='utf-8')
          assert 'filter: ownerFilter,' in Path(notes).read_text(encoding='utf-8')
          assert 'getFullList(filter: ownerFilter)' in Path(tags).read_text(encoding='utf-8')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov@gmail.com"
          git rm .github/workflows/lifeos-owner-read-hotfix.yml
          git add lib/data/plan_service.dart lib/data/plans/notes_brain_helpers.dart lib/data/profile/tag_catalog.dart
          git diff --cached --check
          git commit -m "Fix legacy owner reads for plans notes and tags"
          git push origin HEAD:main
