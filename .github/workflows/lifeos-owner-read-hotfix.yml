name: LIFE OS owner read hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lifeos-owner-read-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply owner read patch
        run: python3 scripts/hotfix_owner_reads.py

      - name: Commit hotfix
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov@gmail.com"
          git rm .github/workflows/lifeos-owner-read-hotfix.yml scripts/hotfix_owner_reads.py
          git add lib/data/plan_service.dart lib/data/plans/notes_brain_helpers.dart lib/data/profile/tag_catalog.dart
          git diff --cached --check
          git commit -m "Fix legacy owner reads for plans notes and tags"
          git push origin HEAD:main
