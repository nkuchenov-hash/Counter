name: Shell top status rebase finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'refactor/shell-top-status-bars-name-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shell-top-status-bars-name-20260818
      - name: Restore rename parity
        shell: bash
        run: |
          python scripts/manual/_finalize_shell_top_status_rebase.py
          git rm scripts/manual/_finalize_shell_top_status_rebase.py
          git diff --check
      - name: Architecture
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict
      - name: Commit parity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore shell top status rename after rebase'
          git push origin HEAD:refactor/shell-top-status-bars-name-20260818
