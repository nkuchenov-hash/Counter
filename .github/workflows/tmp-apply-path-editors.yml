name: Temporary apply Paths editors

on:
  push:
    branches:
      - feat/paths-editors-options-20260904

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paths-editors-options-20260904
      - name: Fix patch documentation fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/manual/tmp_patch_paths_editors_20260904.py')
          text = p.read_text()
          old = "    else:\n        raise SystemExit('Path stage card row not found in docs/APP_STRUCTURE.md')\n    app_structure.write_text('\\n'.join(rows) + '\\n')"
          new = "    else:\n        rows.append('| `features/paths/widgets/path_edit_sheet.dart` | Path / stage / action editor sheets, item mini-checklist + description editor, and Options-as-delayed-reorder control |')\n    app_structure.write_text('\\n'.join(rows) + '\\n')"
          if old not in text:
              raise SystemExit('documentation fallback pattern not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply patch
        run: python3 scripts/manual/tmp_patch_paths_editors_20260904.py
      - name: Format changed Dart files
        run: |
          dart format \
            lib/data/paths/path_models.dart \
            lib/data/paths/path_repository.dart \
            lib/data/paths/path_service.dart \
            lib/core/widgets/mouse_drag_scroll_behavior.dart \
            lib/features/paths/paths_page.dart \
            lib/features/paths/widgets/path_stage_card.dart \
            lib/features/paths/widgets/path_edit_sheet.dart
      - name: Regenerate detailed structure guide
        run: python3 scripts/manual/generate_app_structure_detailed.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze changed files
        run: |
          flutter analyze --no-fatal-infos \
            lib/data/paths/path_models.dart \
            lib/data/paths/path_repository.dart \
            lib/data/paths/path_service.dart \
            lib/core/widgets/mouse_drag_scroll_behavior.dart \
            lib/features/paths/paths_page.dart \
            lib/features/paths/widgets/path_stage_card.dart \
            lib/features/paths/widgets/path_edit_sheet.dart
      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
      - name: Commit applied patch and remove temporary files
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          git restore pubspec.lock || true
          rm .github/workflows/tmp-apply-path-editors.yml
          rm scripts/manual/tmp_patch_paths_editors_20260904.py
          git add -A
          git commit -m "Add Paths options and detailed editors"
          git push origin HEAD:feat/paths-editors-options-20260904
