name: Notes seamless editor fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notes-seamless-editor-fix
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/notes-seamless-editor
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Apply seamless editor transform
        run: python scripts/manual/apply_notes_seamless_fix.py

      - name: Remove temporary transform tooling
        run: |
          rm scripts/manual/apply_notes_seamless_fix.py
          rm .github/workflows/notes-seamless-fix.yml

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/notes_glm_surface.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_special_block_widgets.dart

      - name: Prepare environment
        run: |
          cp lib/core/env/env.dart.example lib/core/env/env.dart
          flutter pub get

      - name: Strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Analyze changed Notes files
        run: >-
          flutter analyze
          lib/features/notes/note_editor_page.dart
          lib/features/notes/notes_glm_surface.dart
          lib/features/notes/widgets/note_editor_block_widgets.dart
          lib/features/notes/widgets/notes_special_block_widgets.dart
          --no-fatal-infos --no-fatal-warnings

      - name: Focused Notes v2 model test
        run: flutter test test/note_document_v2_test.dart

      - name: Build production web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Notes typing flicker and restore seamless document flow"
          git push origin HEAD:fix/notes-seamless-editor
