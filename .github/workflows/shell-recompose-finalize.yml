name: Shell recompose finalize

on:
  push:
    branches:
      - refactor/shell-lifecycle-chrome-20260818
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: shell-recompose-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'push' || github.head_ref == 'refactor/shell-lifecycle-chrome-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shell-lifecycle-chrome-20260818
          fetch-depth: 0
      - name: Apply structure parity
        shell: bash
        run: |
          if [ ! -f scripts/manual/_finalize_shell_recompose.py ]; then
            echo 'Already finalized.'
            exit 0
          fi
          python scripts/manual/_finalize_shell_recompose.py
          git rm scripts/manual/_finalize_shell_recompose.py
          git diff --check
          pwsh -File scripts/audit/architecture_guard.ps1 -Strict
      - name: Commit parity update
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document shell lifecycle, chrome and task actions ownership'
          git push origin HEAD:refactor/shell-lifecycle-chrome-20260818
