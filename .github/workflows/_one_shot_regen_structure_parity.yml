name: One-shot regenerate structure parity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message == 'chore: regenerate structure parity for recurring scope test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Remove one-shot workflow from tracked tree
        run: git rm .github/workflows/_one_shot_regen_structure_parity.yml
      - name: Regenerate detailed structure encyclopedia
        run: python scripts/manual/generate_app_structure_detailed.py
      - name: Verify documentation parity
        run: python scripts/audit/documentation_parity.py
      - name: Commit generated parity update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync structure docs for recurring scope test"
          git push origin HEAD:main
