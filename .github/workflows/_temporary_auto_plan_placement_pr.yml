name: Temporary auto-plan placement PR check

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  implement-and-check:
    if: github.event.pull_request.head.ref == 'feat/auto-plan-nearest-free-slot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/auto-plan-nearest-free-slot

      - name: Apply implementation and corrections
        run: |
          python3 tool/_temporary_apply_auto_plan_placement.py
          python3 - <<'PY'
          from pathlib import Path

          cascade = Path('lib/data/plans/plan_time_cascade_helpers.dart')
          text = cascade.read_text(encoding='utf-8')
          text = text.replace(
              'currentWall ?? applyUserOffset(getPlanetaryNow());',
              'currentWall ?? applyUserOffset(DatabaseService.getPlanetaryNow());',
          )
          cascade.write_text(text, encoding='utf-8')

          settings = Path('lib/features/planning/time_view/time_view_settings_sheet.dart')
          text = settings.read_text(encoding='utf-8')
          old = '''  late PlanAutoPlacementMode _mode = widget.initialMode;

  Future<void> _select(PlanAutoPlacementMode mode) async {'''
          new = '''  late PlanAutoPlacementMode _mode;

  @override
  void initState() {
    super.initState();
    _mode = widget.initialMode;
  }

  Future<void> _select(PlanAutoPlacementMode mode) async {'''
          if old in text:
              text = text.replace(old, new, 1)
          settings.write_text(text, encoding='utf-8')
          PY

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Format implementation
        run: |
          dart format \
            lib/data/plans/plan_time_cascade_helpers.dart \
            lib/features/planning/time_view/time_view_settings_sheet.dart \
            lib/l10n/dictionary.dart \
            test/auto_plan_nearest_free_slot_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run three focused tests
        run: flutter test test/auto_plan_nearest_free_slot_test.dart

      - name: Commit implementation when changed
        run: |
          if git diff --quiet -- lib test; then
            echo 'Implementation already committed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/data/plans/plan_time_cascade_helpers.dart \
                  lib/features/planning/time_view/time_view_settings_sheet.dart \
                  lib/l10n/dictionary.dart \
                  test/auto_plan_nearest_free_slot_test.dart
          git commit -m 'Fix and verify nearest free-slot scheduling'
          git push origin HEAD:feat/auto-plan-nearest-free-slot
