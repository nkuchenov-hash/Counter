name: Temporary sleep production status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-sleep-prod-status.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Snapshot sanitized sleep state
        run: |
          set -euo pipefail
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_SERVICE='$POCKETBASE_SERVICE' POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' bash -s" > /tmp/sleep-status.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ {print $1; exit}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | head -n 1 || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          db="$app_dir/pb_data/data.db"
          python3 - "$db" <<'PY'
          import re, sqlite3, sys
          from datetime import datetime, timedelta, timezone
          con=sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True)
          con.row_factory=sqlite3.Row
          r=con.execute("""
            SELECT enabled,status,last_error,last_session_count,last_imported_count,
                   length(coalesce(refresh_token_enc,'')) AS refresh_len,
                   length(coalesce(access_token_enc,'')) AS access_len
            FROM sleep_sync_connections
            WHERE provider='google_fit'
            ORDER BY updated DESC LIMIT 1
          """).fetchone()
          if not r:
              print('connection=missing')
          else:
              err=(r['last_error'] or '').lower()
              if not err: cls='none'
              elif 'invalid_grant' in err: cls='invalid_grant'
              elif 'insufficient authentication scopes' in err or 'insufficient permission' in err: cls='scope'
              elif 'accessnotconfigured' in err or 'has not been used in project' in err or 'api has not been used' in err: cls='api_disabled'
              elif 'sleep segment request failed: http 403' in err: cls='segment_403'
              elif 'sleep request failed: http 403' in err: cls='sessions_403'
              elif 'token exchange failed' in err: cls='token_exchange'
              elif 'token refresh failed' in err: cls='token_refresh'
              elif 'google health' in err: cls='stale_google_health'
              else:
                  m=re.search(r'http\s+(\d+)', err)
                  cls='http_'+m.group(1) if m else 'other'
              print('connection=present')
              print(f'enabled={1 if r["enabled"] else 0}')
              print(f'status={r["status"] or ""}')
              print(f'refresh={1 if (r["refresh_len"] or 0)>0 else 0}')
              print(f'access={1 if (r["access_len"] or 0)>0 else 0}')
              print(f'error_class={cls}')
              print(f'last_sessions={int(r["last_session_count"] or 0)}')
              print(f'last_imported={int(r["last_imported_count"] or 0)}')
          cutoff=(datetime.now(timezone.utc)-timedelta(hours=48)).isoformat().replace('+00:00','Z')
          row=con.execute("""
            SELECT count(*) AS n FROM records
            WHERE (title='Sleep' OR title='Сон' OR external_kind='sleep') AND end_time>=?
          """,(cutoff,)).fetchone()
          print(f'sleep48={int(row["n"] or 0)}')
          PY
          REMOTE
          cp /tmp/sleep-status.txt _tmp_sleep_status.txt
      - name: Publish sanitized snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_sleep_status.txt
          git commit -m "Record sanitized sleep production status" || exit 0
          git push origin HEAD:main
