name: Temp Path Week Governance CI

on:
  push:
    branches:
      - feat/path-week-governance

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/path-week-governance
          fetch-depth: 0

      - name: Apply integration patch
        run: |
          python .github/scripts/path_week_governance_patch.py
          python .github/scripts/path_week_governance_cleanup.py

      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/shell/app_shell.dart lib/app/shell/shared/shell_more_menu.dart lib/app/shell/shared/shell_path_governance.dart docs/APP_STRUCTURE.md
          if ! git diff --cached --quiet; then
            git commit -m "Clean path governance integration"
            git push origin HEAD:feat/path-week-governance
          fi

      - name: Architecture guard
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Critical regressions
        run: |
          flutter test --platform chrome test/notes_mobile_keyboard_regression_test.dart
          flutter test test/category_catalog_resilience_contract_test.dart

      - run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
