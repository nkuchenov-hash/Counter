name: Temporary validate Paths Variant 2 build

on:
  push:
    branches:
      - fix/paths-variant2-structure-20260904

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paths-variant2-structure-20260904
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze changed Paths UI
        run: flutter analyze lib/features/paths/paths_page.dart lib/features/paths/widgets/path_stage_card.dart
      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
      - name: Remove temporary workflow
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          rm .github/workflows/tmp-validate-paths-variant2-build.yml
          git add -A
          git commit -m "Confirm Paths Variant 2 Flutter build"
          git push origin HEAD:fix/paths-variant2-structure-20260904
