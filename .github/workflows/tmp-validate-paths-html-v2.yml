name: Temporary validate literal Paths HTML port v2

on:
  push:
    branches:
      - fix/paths-literal-html-port-20260904

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paths-literal-html-port-20260904
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze literal card
        run: flutter analyze --no-fatal-infos lib/features/paths/widgets/path_stage_card.dart
      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none
      - name: Remove validation workflow cleanly
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          git restore pubspec.lock || true
          rm .github/workflows/tmp-validate-paths-html-v2.yml
          git add -A
          git commit -m "Confirm literal Paths HTML port build"
          git push origin HEAD:fix/paths-literal-html-port-20260904
