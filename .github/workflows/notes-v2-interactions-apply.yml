name: Apply Notes v2 interactions

on:
  push:
    branches:
      - feature/notes-editor-tools-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[notes-v2-interactions]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-editor-tools-v2
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: cp lib/core/env/env.dart.example lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Align patch with current production loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/manual/apply_notes_v2_interactions.py')
          s = p.read_text(encoding='utf-8')
          old = """                  onMoveDown: () => _moveBlock(b.id, 1),
                  onEditDrawing: () => _openDrawing(editBlockId: b.id),
                  onEnter: () {
"""
          new = """              onMoveDown: () => _moveBlock(_doc.blocks[i].id, 1),
              onEditDrawing: () => _openDrawing(editBlockId: _doc.blocks[i].id),
              onEnter: () {
"""
          replacement = """              onMoveDown: () => _moveBlock(_doc.blocks[i].id, 1),
              onDuplicate: () => _duplicateBlock(_doc.blocks[i].id),
              onCreatePlanFromText: _createPlanFromText,
              onAddImage: _pickImage,
              onAddDrawing: () => _openDrawing(),
              onEditDrawing: () => _openDrawing(editBlockId: _doc.blocks[i].id),
              onEnter: () {
"""
          if old not in s:
              raise SystemExit('interaction source snippet not found')
          s = s.replace(old, new, 1)
          old_replacement = """                  onMoveDown: () => _moveBlock(b.id, 1),
                  onDuplicate: () => _duplicateBlock(b.id),
                  onCreatePlanFromText: _createPlanFromText,
                  onAddImage: _pickImage,
                  onAddDrawing: () => _openDrawing(),
                  onEditDrawing: () => _openDrawing(editBlockId: b.id),
                  onEnter: () {
"""
          if old_replacement not in s:
              raise SystemExit('interaction replacement snippet not found')
          s = s.replace(old_replacement, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply interaction patch
        id: patch
        continue-on-error: true
        run: |
          set +e
          python scripts/manual/apply_notes_v2_interactions.py > interactions_patch.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -120 interactions_patch.log > notes_v2_interaction_errors.txt
            exit "$status"
          fi
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/features/notes/widgets/note_editor_block_widgets.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'selection.start.clamp(0, _textController.text.length),',
              'selection.start.clamp(0, _textController.text.length).toInt(),',
          ).replace(
              'selection.end.clamp(0, _textController.text.length),',
              'selection.end.clamp(0, _textController.text.length).toInt(),',
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch diagnostics on failure
        if: ${{ steps.patch.outcome == 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes_v2_interaction_errors.txt
          git commit -m "Capture Notes v2 interaction patch errors [notes-v2-interaction-errors]"
          git push origin HEAD:feature/notes-editor-tools-v2
          exit 1

      - name: Format changed Dart
        run: |
          dart format \
            lib/features/notes/note_editor_page.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart

      - name: Strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Focused Notes tests
        run: |
          flutter test test/note_document_test.dart
          flutter test test/note_document_v2_test.dart

      - name: Web build
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Remove one-shot tooling
        run: |
          rm scripts/manual/apply_notes_v2_interactions.py
          rm .github/workflows/notes-v2-interactions-apply.yml
          rm -f notes_v2_interaction_errors.txt

      - name: Commit verified interactions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Notes v2 undo slash commands and plan actions [notes-v2-interactions]"
          git push origin HEAD:feature/notes-editor-tools-v2
