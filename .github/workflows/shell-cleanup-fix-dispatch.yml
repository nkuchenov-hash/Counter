name: Fix and dispatch shell cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/shell-boundary-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/shell-boundary-cleanup
          fetch-depth: 0
      - name: Make finalizer whitespace-robust
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/shell-boundary-cleanup.yml')
          s = p.read_text(encoding='utf-8')
          start = s.index("          obsolete_override = \"\"\"  /// Paths is a real shell destination.")
          end_marker = "          app = app.replace(obsolete_override, '')\n"
          end = s.index(end_marker, start) + len(end_marker)
          replacement = """          override_start = app.find('  /// Paths is a real shell destination.')
          if override_start != -1:
              override_end = app.index('  /// Keep the real Paths item selected', override_start)
              app = app[:override_start] + app[override_end:]
          """
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/shell-cleanup-status.yml
          git rm .github/workflows/shell-cleanup-fix-dispatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make shell cleanup finalizer robust'
          git push origin HEAD:agent/shell-boundary-cleanup
      - name: Dispatch corrected cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run shell-boundary-cleanup.yml --repo nkuchenov-hash/Counter --ref agent/shell-boundary-cleanup
