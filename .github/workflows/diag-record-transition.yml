name: Emergency PocketBase startup timeout patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-record-transition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bound PocketBase startup waits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('lib/data/auth_bridge.dart')
          s = auth.read_text()
          old = "await pb.collection(PbCollections.profiles).authRefresh();"
          new = """await pb
            .collection(PbCollections.profiles)
            .authRefresh()
            .timeout(const Duration(seconds: 3));"""
          if old not in s:
              raise SystemExit('authRefresh target not found')
          s = s.replace(old, new, 1)
          auth.write_text(s)

          core = Path('lib/data/db_core.dart')
          s = core.read_text()
          old_health = "await _pb.health.check();"
          new_health = "await _pb.health.check().timeout(const Duration(seconds: 3));"
          if old_health not in s:
              raise SystemExit('health target not found')
          s = s.replace(old_health, new_health, 1)

          old_fg = "await _pb.collection(PbCollections.profiles).authRefresh();"
          new_fg = """await _pb
          .collection(PbCollections.profiles)
          .authRefresh()
          .timeout(const Duration(seconds: 3));"""
          if old_fg not in s:
              raise SystemExit('foreground authRefresh target not found')
          s = s.replace(old_fg, new_fg, 1)
          core.write_text(s)
          PY

      - name: Commit recovery
        run: |
          set -euo pipefail
          git config user.name 'nkuchenov-hash'
          git config user.email 'nkuchenov@gmail.com'
          git add lib/data/auth_bridge.dart lib/data/db_core.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Recovery patch already present.'
            exit 0
          fi
          git commit -m 'Bound PocketBase startup network waits'
          git push origin HEAD:main
