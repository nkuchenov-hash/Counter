name: Diagnose record transition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-record-transition.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts
      - name: Read record transition evidence
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo '--- service restarts today ---'
          journalctl -u pocketbase.service --since '2026-08-12 12:00:00 UTC' --until '2026-08-12 20:00:00 UTC' --no-pager | grep -E 'Started PocketBase|Stopping PocketBase|Stopped PocketBase|Started pocketbase|Starting PocketBase' || true
          echo '--- record writes around transition ---'
          AUX_PATH=/root/pb/pb_data/auxiliary.db python3 - <<'PY'
          import os, sqlite3, json
          con=sqlite3.connect(f"file:{os.environ['AUX_PATH']}?mode=ro", uri=True)
          rows=con.execute("select created, message, data from _logs where created >= '2026-08-12 12:00:00.000Z' and created <= '2026-08-12 20:00:00.000Z' order by created asc").fetchall()
          picked=[]
          for created,msg,raw in rows:
              m=msg or ''
              if '/api/collections/records/records' not in m: continue
              if not (m.startswith('POST ') or m.startswith('PATCH ')): continue
              try: data=json.loads(raw) if isinstance(raw,str) and raw.strip() else (raw or {})
              except Exception: data={}
              picked.append((created,m,data.get('status'),data.get('error')))
          for created,m,status,error in picked:
              if created < '2026-08-12 17:40:00.000Z' or created >= '2026-08-12 17:40:00.000Z':
                  print(created, 'status=', status, m, 'error=', (error or '')[:220])
          print('TOTAL_WRITES', len(picked))
          con.close()
          PY
          REMOTE
