name: One-off Notes reorderable key repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one_off_fix_notes_reorderable_keys.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore top-level reorderable block keys
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/features/notes/note_editor_page.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """    final content = Padding(\n      padding: const EdgeInsets.only(right: 36),\n""",
                  """    final content = Padding(\n      key: ValueKey<String>(block.id),\n      padding: const EdgeInsets.only(right: 36),\n""",
              ),
              (
                  """    return Stack(\n      clipBehavior: Clip.none,\n""",
                  """    return Stack(\n      key: ValueKey<String>(block.id),\n      clipBehavior: Clip.none,\n""",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected Notes source fragment not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/one_off_fix_notes_reorderable_keys.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/notes/note_editor_page.dart
          git diff --check
          git diff --cached -- lib/features/notes/note_editor_page.dart
          git commit -m "Fix Notes reorderable block keys"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Dispatch production deploy for repaired main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
