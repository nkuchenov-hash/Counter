name: Fix shell voice dependency

on:
  push:
    branches: [refactor/shell-lifecycle-chrome-20260818]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shell-lifecycle-chrome-20260818
      - name: Patch mixin dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/app/shell/shared/shell_voice_routing.dart')
          s = p.read_text(encoding='utf-8')
          old = 'mixin ShellVoiceRouting on ShellCoreLogic {'
          new = 'mixin ShellVoiceRouting on ShellTaskActions {'
          if old not in s and new not in s:
              raise SystemExit('ShellVoiceRouting declaration not found')
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/shell/shared/shell_voice_routing.dart
          git commit -m 'Align shell voice routing with task action dependency'
          git push origin HEAD:refactor/shell-lifecycle-chrome-20260818
