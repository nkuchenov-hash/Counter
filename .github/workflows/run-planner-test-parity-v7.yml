name: Run planner test parity cleanup v7

on:
  push:
    branches: [fix/planner-wall-utc-recurring-v7]

permissions:
  contents: write

jobs:
  cleanup-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planner-wall-utc-recurring-v7
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move regression tests into tracked planner suite
        run: python .github/scripts/move_wall_utc_tests_v7.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format test
        run: dart format test/auto_plan_nearest_free_slot_test.dart
      - name: Run planner regression suite
        run: flutter test test/auto_plan_nearest_free_slot_test.dart
      - name: Verify documentation parity
        run: python scripts/audit/documentation_parity.py
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/run-planner-test-parity-v7.yml
          rm -f .github/scripts/move_wall_utc_tests_v7.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep planner UTC regression tests in tracked suite"
          git push origin HEAD:fix/planner-wall-utc-recurring-v7
