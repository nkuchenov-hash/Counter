name: Apply Notes hygiene adjustment

on:
  push:
    branches:
      - fix/notes-uncheck-structured-copy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notes-uncheck-structured-copy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Remove nonessential line-growth only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/notes/note_editor_page.dart')
          s = p.read_text()
          old = "    final plain = selected?.plainText ?? '';\n    if (plain.isEmpty) {\n      _NotesStructuredClipboard.plainText = null;\n      _NotesStructuredClipboard.blocks = const <NoteBlock>[];\n      return;\n    }\n    final blocks = _inferStructuredSelectionBlocks(plain);\n"
          new = "    final plain = selected?.plainText ?? '';\n    if (plain.isEmpty) return;\n    final blocks = _inferStructuredSelectionBlocks(plain);\n"
          if old not in s:
              raise SystemExit('hygiene adjustment target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify Notes
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/note_document_v2_test.dart test/notes_glm_editor_parity_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          test "$(wc -l < lib/features/notes/note_editor_page.dart)" -le 1905
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/notes/note_editor_page.dart
          git commit -m 'fix(notes): keep structured copy without file growth'
          git push origin HEAD:fix/notes-uncheck-structured-copy
