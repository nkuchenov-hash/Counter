name: Notes v3 gray screen repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: notes-v3-gray-screen-repair
  cancel-in-progress: true

jobs:
  repair-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BRANCH: feature/notes-v3-design-system
      PREVIEW_DIR: notes-v3-preview-live-20260731-1945
    steps:
      - name: Checkout Notes branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0

      - name: Replace desktop media canvas with file rows
        run: |
          python - <<'PY'
          from pathlib import Path

          media_path = Path('lib/features/notes/widgets/note_editor_block_widgets.dart')
          media = media_path.read_text(encoding='utf-8')
          media = media.replace(
              "import 'package:counter/features/notes/widgets/notes_editor_screen.dart';\n",
              '',
              1,
          )

          start = media.index('  Widget _mediaContent(BuildContext context) {')
          end = media.index('  Widget _mediaPlaceholder(', start)
          replacement = '''  Widget _mediaContent(BuildContext context) {
    final raw = block.type == NoteBlockType.drawing
        ? block.drawingData
        : block.imageData;

    // Desktop Notes is a file-oriented workspace. Do not decode or paint the
    // full base64 asset in the document hot path: it caused legacy/placeholder
    // media to occupy the whole editor and added avoidable open/scroll work.
    if (MediaQuery.sizeOf(context).width >= 768) {
      return _desktopMediaFileRow(context, raw);
    }

    final bytes = _decodeImagePayload(raw);
    if (bytes == null) return _mediaPlaceholder(context);
    const previewHeight = 240.0;
    return RepaintBoundary(
      child: SizedBox(
        width: double.infinity,
        height: previewHeight,
        child: Image.memory(
          bytes,
          width: double.infinity,
          height: previewHeight,
          alignment: Alignment.topCenter,
          fit: BoxFit.contain,
          gaplessPlayback: true,
          filterQuality: FilterQuality.medium,
          errorBuilder: (_, __, ___) => _mediaPlaceholder(context),
        ),
      ),
    );
  }

  Widget _desktopMediaFileRow(BuildContext context, String? raw) {
    final scheme = Theme.of(context).colorScheme;
    final loc = currentLocale.value;
    final hasPayload = raw?.trim().isNotEmpty ?? false;
    final kindLabel = block.type == NoteBlockType.drawing
        ? t(loc, 'notes_v3_draw_badge')
        : t(loc, 'notes_v3_image_badge');
    final title = hasPayload
        ? kindLabel
        : t(loc, 'notes_v3_editor_load_failed');
    final sizeLabel = hasPayload ? _formatNotesAssetBytes(_estimatedAssetBytes(raw!)) : null;

    return SizedBox(
      key: const ValueKey('notes-desktop-media-file-row'),
      height: 72,
      child: Padding(
        padding: const EdgeInsets.symmetric(horizontal: 14),
        child: Row(
          children: [
            DecoratedBox(
              decoration: BoxDecoration(
                color: scheme.surfaceContainerLow,
                borderRadius: BorderRadius.circular(10),
              ),
              child: SizedBox.square(
                dimension: 42,
                child: Icon(
                  hasPayload
                      ? (block.type == NoteBlockType.drawing
                            ? Icons.draw_rounded
                            : Icons.image_outlined)
                      : Icons.broken_image_outlined,
                  size: 21,
                  color: scheme.onSurfaceVariant,
                ),
              ),
            ),
            const SizedBox(width: 12),
            Expanded(
              child: Column(
                mainAxisAlignment: MainAxisAlignment.center,
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(
                    title,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    style: Theme.of(context).textTheme.titleSmall?.copyWith(
                      fontWeight: FontWeight.w600,
                    ),
                  ),
                  if (sizeLabel != null) ...[
                    const SizedBox(height: 2),
                    Text(
                      sizeLabel,
                      style: Theme.of(context).textTheme.bodySmall?.copyWith(
                        color: scheme.onSurfaceVariant,
                      ),
                    ),
                  ],
                ],
              ),
            ),
            Icon(
              Icons.more_horiz_rounded,
              size: 18,
              color: scheme.onSurfaceVariant,
            ),
          ],
        ),
      ),
    );
  }

'''
          media = media[:start] + replacement + media[end:]

          helper_anchor = 'String _formatNotesAssetBytes(int bytes) {'
          helper = '''int _estimatedAssetBytes(String raw) {
  final value = raw.trim();
  final comma = value.indexOf(',');
  final encoded = value.startsWith('data:') && comma >= 0
      ? value.substring(comma + 1)
      : value;
  if (encoded.isEmpty) return 0;
  final padding = encoded.endsWith('==') ? 2 : (encoded.endsWith('=') ? 1 : 0);
  return ((encoded.length * 3) ~/ 4 - padding).clamp(0, 1 << 30);
}

'''
          if helper not in media:
              media = media.replace(helper_anchor, helper + helper_anchor, 1)
          media_path.write_text(media, encoding='utf-8')

          test_path = Path('test/notes_canonical_components_test.dart')
          test = test_path.read_text(encoding='utf-8')
          old = '''      await tester.pumpWidget(
        _host(
          NotesEmbeddedEditorScope(
            onClose: () {},
            child: Align(
              alignment: Alignment.topCenter,
              child: SizedBox(
                width: 880,
                child: NotesEditorBlockItem(
                  block: const NoteBlock(
                    id: 'broken-media',
                    type: NoteBlockType.image,
                    imageData: 'not-base64',
                  ),
                  index: 0,
                  numberedOrdinal: 1,
                  active: false,
                  onTap: () {},
                  onKeyEvent: (_) => KeyEventResult.ignored,
                ),
              ),
            ),
          ),
        ),
      );
      await tester.pump();
      expect(
        tester.getSize(find.byKey(const ValueKey('notes-media-frame'))).height,
        72,
      );
      expect(tester.takeException(), isNull);
'''
          new = '''      await tester.pumpWidget(
        _host(
          Align(
            alignment: Alignment.topCenter,
            child: SizedBox(
              width: 880,
              child: NotesEditorBlockItem(
                block: const NoteBlock(
                  id: 'desktop-media',
                  type: NoteBlockType.image,
                  imageData:
                      'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADElEQVR42mNk+M/wHwAF/gL+Xc9WAAAAAElFTkSuQmCC',
                ),
                index: 0,
                numberedOrdinal: 1,
                active: false,
                onTap: () {},
                onKeyEvent: (_) => KeyEventResult.ignored,
              ),
            ),
          ),
        ),
      );
      await tester.pump();
      expect(
        find.byKey(const ValueKey('notes-desktop-media-file-row')),
        findsOneWidget,
      );
      expect(
        tester.getSize(find.byKey(const ValueKey('notes-media-frame'))).height,
        72,
      );
      expect(tester.takeException(), isNull);
'''
          if old not in test:
              raise SystemExit('Existing media regression assertion not found')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart
        run: dart format lib/features/notes/widgets/note_editor_block_widgets.dart test/notes_canonical_components_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run exactly three focused Notes tests
        run: flutter test test/notes_canonical_components_test.dart

      - name: Build production web
        run: flutter build web --release --no-tree-shake-icons --base-href /Counter/${PREVIEW_DIR}/

      - name: Commit production repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/notes/widgets/note_editor_block_widgets.dart test/notes_canonical_components_test.dart
          git commit -m "Fix Notes desktop gray media canvas"
          git push origin HEAD:${BRANCH}
          git rev-parse HEAD > build/web/source-sha.txt

      - name: Disable service worker
        run: |
          rm -f build/web/flutter_service_worker.js
          python - <<'PY'
          from pathlib import Path
          p = Path('build/web/flutter_bootstrap.js')
          s = p.read_text(encoding='utf-8')
          marker = '_flutter.loader.load({'
          if marker in s:
              start = s.rfind(marker)
              end = s.find(');', start)
              if end < 0:
                  raise SystemExit('bootstrap load call end not found')
              s = s[:start] + '_flutter.loader.load();' + s[end + 2:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publish isolated preview
        run: |
          git fetch origin gh-pages
          rm -rf /tmp/pages
          git worktree add /tmp/pages origin/gh-pages
          rm -rf /tmp/pages/${PREVIEW_DIR}
          mkdir -p /tmp/pages/${PREVIEW_DIR}
          cp -a build/web/. /tmp/pages/${PREVIEW_DIR}/
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${PREVIEW_DIR}
          git commit -m "Deploy Notes gray-screen repair preview"
          git push origin HEAD:gh-pages

      - name: Verify public preview
        run: |
          expected="$(cat build/web/source-sha.txt)"
          url="https://nkuchenov-hash.github.io/Counter/${PREVIEW_DIR}"
          for attempt in $(seq 1 30); do
            actual="$(curl -fsSL --max-time 20 "${url}/source-sha.txt?attempt=${attempt}" 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              test "$(curl -s -o /dev/null -w '%{http_code}' "${url}/?attempt=${attempt}")" = "200"
              echo "Public preview verified at ${url}/ with ${expected}"
              exit 0
            fi
            sleep 10
          done
          echo "Public preview did not expose expected SHA ${expected}" >&2
          exit 1
