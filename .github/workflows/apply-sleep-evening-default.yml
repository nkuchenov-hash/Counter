name: Apply sleep evening default

on:
  push:
    branches:
      - agent/sleep-sync-evening-default

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sleep-sync-evening-default
          fetch-depth: 0
      - name: Apply default time
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/data/health/health_sleep_sync_service.dart')
          text = path.read_text()

          old_state = 'dailySyncMinutes = 600'
          old_default = 'defaultDailySyncMinutes = 10 * 60;'

          if text.count(old_state) != 2:
              raise SystemExit(f'Expected 2 state defaults, found {text.count(old_state)}')
          if text.count(old_default) != 1:
              raise SystemExit(f'Expected 1 service default, found {text.count(old_default)}')

          text = text.replace(old_state, 'dailySyncMinutes = 1260')
          text = text.replace(old_default, 'defaultDailySyncMinutes = 21 * 60;')
          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-sleep-evening-default.yml
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add lib/data/health/health_sleep_sync_service.dart .github/workflows/apply-sleep-evening-default.yml
          git commit -m "Default sleep sync to 21:00"
          git push origin HEAD:agent/sleep-sync-evening-default
