name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Inspect Google Fit import behavior
        shell: bash
        run: |
          set -euo pipefail
          echo diagnostic-version=20260823-fit-import-cleanup
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "SERVICE='${POCKETBASE_SERVICE:-pocketbase.service}' bash -s" <<'REMOTE'
          set -euo pipefail
          service="${SERVICE:-pocketbase.service}"
          app_dir="$(systemctl show "$service" -p WorkingDirectory --value)"
          db="$app_dir/pb_data/data.db"
          echo LOG_BEGIN
          journalctl -u "$service" --since '2026-08-23 10:30:00' --no-pager | grep -E 'google fit sleep sync (complete|failed)' | tail -n 30 || true
          echo LOG_END
          DB_PATH="$db" python3 - <<'PY'
          import os, sqlite3
          con=sqlite3.connect(f'file:{os.environ["DB_PATH"]}?mode=ro',uri=True); con.row_factory=sqlite3.Row
          queries={
            'ALL_RECORDS':"SELECT count(*) n FROM records",
            'GOOGLE_EXT_SOURCE':"SELECT count(*) n FROM records WHERE external_source='google_fit'",
            'GOOGLE_SLEEP_SOURCE':"SELECT count(*) n FROM records WHERE sleep_source='google_fit'",
            'SLEEP_EXTERNAL_KIND':"SELECT count(*) n FROM records WHERE external_kind='sleep'",
            'TITLED_SLEEP':"SELECT count(*) n FROM records WHERE lower(trim(title)) IN ('sleep','сон')",
          }
          for k,q in queries.items(): print(k+'='+str(con.execute(q).fetchone()['n']))
          rows=con.execute("""SELECT user_id,title,start_time,end_time,created,updated,external_source,sleep_source,external_kind,external_id,sleep_external_id
             FROM records WHERE external_source='google_fit' OR sleep_source='google_fit' OR external_kind='sleep'
             ORDER BY end_time DESC LIMIT 30""").fetchall()
          print('PROVIDER_ROWS_SHOWN=%d'%len(rows))
          for r in rows:
              print('PROVIDER_ROW title=%s end=%s created=%s ext_src=%s sleep_src=%s kind=%s ext_id=%s sleep_id=%s'%(
                r['title'],str(r['end_time'])[:19],str(r['created'])[:19],r['external_source'] or '',r['sleep_source'] or '',r['external_kind'] or '',
                'yes' if r['external_id'] else 'no','yes' if r['sleep_external_id'] else 'no'))
          con.close()
          PY
          REMOTE
