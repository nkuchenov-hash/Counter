name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Smoke test Xiaomi QR handshake
        shell: bash
        run: |
          set -euo pipefail
          echo diagnostic-version=20260823-xiaomi-qr-smoke
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          /opt/lifeos-xiaomi-sleep/bin/python - <<'PY'
          import asyncio
          from mi_fitness import XiaomiAuth

          async def main():
              seen={'qr':False,'login':False}
              async def on_qr(qr_image_url, login_url):
                  seen['qr']=bool(qr_image_url)
                  seen['login']=bool(login_url)
              error='none'
              try:
                  async with XiaomiAuth() as auth:
                      await auth.login_qr(qr_callback=on_qr, poll_interval=0.5, max_wait=3.0)
              except Exception as exc:
                  error=type(exc).__name__
              print('QR_CALLBACK='+('1' if seen['qr'] else '0'))
              print('LOGIN_URL_PRESENT='+('1' if seen['login'] else '0'))
              print('EXPECTED_FINAL_ERROR='+error)
          asyncio.run(main())
          PY
          REMOTE
