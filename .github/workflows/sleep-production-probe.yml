name: Sleep Wake-Day Patch

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-xiaomi-sleep-cloud
          fetch-depth: 0
      - name: Bucket sleep by wake day
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/data/models/record.dart')
          text = path.read_text(encoding='utf-8')
          old = '''  /// ISO `YYYY-MM-DD` from [startTime] in profile wall-clock calendar ([timezoneOffsetHours], not device TZ).\n  String get dateKey {\n    final st = startTime;\n    if (st == null) return '';\n    final wall = st.toUtc().add(Duration(hours: timezoneOffsetHours));\n    return '${wall.year}-${wall.month.toString().padLeft(2, '0')}-${wall.day.toString().padLeft(2, '0')}';\n  }'''
          new = '''  /// ISO `YYYY-MM-DD` from wake time for sleep, otherwise [startTime],\n  /// in profile wall-clock calendar ([timezoneOffsetHours], not device TZ).\n  String get dateKey {\n    final isSleep = title == 'Sleep' || title == 'Сон';\n    final anchor = isSleep ? (endTime ?? startTime) : startTime;\n    if (anchor == null) return '';\n    final wall = anchor.toUtc().add(Duration(hours: timezoneOffsetHours));\n    return '${wall.year}-${wall.month.toString().padLeft(2, '0')}-${wall.day.toString().padLeft(2, '0')}';\n  }'''
          if old not in text:
              if new in text:
                  print('wake-day patch already present')
              else:
                  raise SystemExit('expected TimelineRecord.dateKey block not found')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/data/models/record.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bucket sleep records by wake day'
          git push origin HEAD:fix/server-xiaomi-sleep-cloud
