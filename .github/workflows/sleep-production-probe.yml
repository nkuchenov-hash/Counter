name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Inspect Xiaomi sleep SDK contract
        shell: bash
        run: |
          set -euo pipefail
          echo diagnostic-version=20260823-xiaomi-sleep-contract
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          /opt/lifeos-xiaomi-sleep/bin/python - <<'PY'
          import inspect
          from mi_fitness import MiHealthClient
          print('GET_SLEEP_SIGNATURE='+str(inspect.signature(MiHealthClient.get_sleep)))
          print('GET_SLEEP_SOURCE_BEGIN')
          print(inspect.getsource(MiHealthClient.get_sleep))
          print('GET_SLEEP_SOURCE_END')
          fn=MiHealthClient.get_sleep
          for name,obj in sorted(fn.__globals__.items()):
              if name.lower().startswith('sleep') and inspect.isclass(obj):
                  print('MODEL_'+name+'_BEGIN')
                  try: print(inspect.getsource(obj))
                  except Exception: print(str(getattr(obj,'__annotations__',{})))
                  print('MODEL_'+name+'_END')
          PY
          REMOTE
