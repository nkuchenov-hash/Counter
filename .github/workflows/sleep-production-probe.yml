name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Inspect Xiaomi QR helper
        shell: bash
        run: |
          set -euo pipefail
          echo diagnostic-version=20260823-xiaomi-qr-helper
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          /opt/lifeos-xiaomi-sleep/bin/python - <<'PY'
          import inspect
          import mi_fitness.auth as auth
          qr = getattr(auth, '_qr', None)
          print('QR_MODULE='+str(qr))
          if qr is not None:
              for name in ('login_qr','_request_qr','request_qr','_poll_result','poll_result'):
                  obj=getattr(qr,name,None)
                  if obj:
                      print('SOURCE_'+name+'_BEGIN')
                      print(inspect.getsource(obj))
                      print('SOURCE_'+name+'_END')
              print('QR_FILE='+str(inspect.getsourcefile(qr)))
          PY
          REMOTE
