name: Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Inspect mi-fitness internals
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/lifeos-mi-fitness-probe
          python3 -m venv /tmp/lifeos-mi-fitness-probe
          /tmp/lifeos-mi-fitness-probe/bin/pip install -q 'mi-fitness==0.2.0'
          /tmp/lifeos-mi-fitness-probe/bin/python - <<'PY'
          import inspect
          import mi_fitness
          from mi_fitness import XiaomiAuth, MiHealthClient
          print('exports='+','.join(sorted(x for x in dir(mi_fitness) if 'Sleep' in x or 'Token' in x)))
          for name,obj in [('save_token',XiaomiAuth.save_token),('from_token',MiHealthClient.from_token)]:
              print(name+'_source_begin'); print(inspect.getsource(obj)); print(name+'_source_end')
          try:
              from mi_fitness.models import SleepData, AuthToken
          except Exception:
              SleepData=getattr(mi_fitness,'SleepData',None); AuthToken=getattr(mi_fitness,'AuthToken',None)
          if SleepData:
              print('SleepData_signature='+str(inspect.signature(SleepData)))
              print('SleepData_annotations='+repr(getattr(SleepData,'__annotations__',{})))
              print('SleepData_source_begin'); print(inspect.getsource(SleepData)); print('SleepData_source_end')
          if AuthToken:
              print('AuthToken_signature='+str(inspect.signature(AuthToken)))
              print('AuthToken_annotations='+repr(getattr(AuthToken,'__annotations__',{})))
              print('AuthToken_source_begin'); print(inspect.getsource(AuthToken)); print('AuthToken_source_end')
          import mi_fitness.data as data_mod
          print('data_sleep_source_begin'); print(inspect.getsource(data_mod.get_sleep)); print('data_sleep_source_end')
          PY
          rm -rf /tmp/lifeos-mi-fitness-probe
          REMOTE
