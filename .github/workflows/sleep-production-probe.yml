name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Inspect canonical sleep rows
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "SERVICE='${POCKETBASE_SERVICE:-pocketbase.service}' bash -s" <<'REMOTE'
          set -euo pipefail
          service="${SERVICE:-pocketbase.service}"
          app_dir="$(systemctl show "$service" -p WorkingDirectory --value)"
          db="$app_dir/pb_data/data.db"
          test -f "$db"
          DB_PATH="$db" python3 - <<'PY'
          import os, sqlite3
          from datetime import datetime, timezone, timedelta

          con = sqlite3.connect(f'file:{os.environ["DB_PATH"]}?mode=ro', uri=True)
          con.row_factory = sqlite3.Row

          conn_cols = {r['name'] for r in con.execute('PRAGMA table_info(sleep_sync_connections)')}
          wanted_conn = [c for c in ['provider','user_id','status','enabled','last_sync_at','last_session_count','last_imported_count','last_error'] if c in conn_cols]
          if wanted_conn:
              rows = con.execute('SELECT %s FROM sleep_sync_connections ORDER BY rowid DESC' % ','.join('"%s"'%c for c in wanted_conn)).fetchall()
              print('CONNECTIONS=%d' % len(rows))
              for r in rows:
                  parts=[]
                  for c in wanted_conn:
                      v=r[c]
                      if c=='user_id' and v:
                          v=str(v)[:4]+'...'
                      if c=='last_error' and v:
                          v='present'
                      parts.append('%s=%s'%(c,v))
                  print('CONNECTION '+' '.join(parts))

          rec_cols = {r['name'] for r in con.execute('PRAGMA table_info(records)')}
          needed = {'user_id','title','start_time','end_time'}
          if not needed.issubset(rec_cols):
              print('RECORD_SCHEMA_MISSING='+','.join(sorted(needed-rec_cols)))
              raise SystemExit(0)

          extra = [c for c in ['external_source','sleep_source','created','updated'] if c in rec_cols]
          cols = ['user_id','title','start_time','end_time'] + extra
          qcols = ','.join('"%s"'%c for c in cols)
          cutoff = (datetime.now(timezone.utc)-timedelta(days=14)).isoformat().replace('+00:00','Z')
          sleep = con.execute(f'''SELECT {qcols} FROM records
              WHERE lower(trim(title)) IN ('sleep','сон') AND end_time>=?
              ORDER BY end_time ASC''',(cutoff,)).fetchall()
          print('SLEEP_RECENT14=%d' % len(sleep))
          if not sleep:
              raise SystemExit(0)

          by_user={}
          for r in sleep:
              by_user.setdefault(str(r['user_id']), []).append(r)
          uid, rows=max(by_user.items(), key=lambda kv: len(kv[1]))
          print('TARGET_USER='+uid[:4]+'...')
          print('TARGET_SLEEP_RECENT14=%d' % len(rows))
          print('LATEST_SLEEP_DAY='+str(rows[-1]['end_time'])[:10])
          days={}
          for r in rows:
              day=str(r['end_time'])[:10]
              src='device_or_manual'
              for c in ('sleep_source','external_source'):
                  if c in rec_cols and r[c]:
                      src=str(r[c])
                      break
              days.setdefault(day,{}).setdefault(src,0)
              days[day][src]+=1
          for day in sorted(days):
              print('DAY %s %s' % (day, ' '.join('%s=%d'%(k,v) for k,v in sorted(days[day].items()))))
          PY
          REMOTE
