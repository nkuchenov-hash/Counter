name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Reset stale Xiaomi login
        shell: bash
        run: |
          set -euo pipefail
          echo diagnostic-version=20260823-reset-stale-login
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "SERVICE='${POCKETBASE_SERVICE:-pocketbase.service}' bash -s" <<'REMOTE'
          set -euo pipefail
          service="${SERVICE:-pocketbase.service}"
          app_dir="$(systemctl show "$service" -p WorkingDirectory --value)"
          db="$app_dir/pb_data/data.db"
          bridge="$app_dir/pb_hooks/xiaomi_sleep_bridge.py"
          if grep -Fq 'attempt_wait = min(240.0, remaining)' "$bridge"; then
            echo BRIDGE_SESSION_WINDOW_FIX=1
          else
            echo BRIDGE_SESSION_WINDOW_FIX=0
            exit 2
          fi
          pkill -f 'xiaomi_sleep_bridge.py login' || true
          systemctl stop "$service"
          DB_PATH="$db" APP_DIR="$app_dir" python3 - <<'PY'
          import os, sqlite3
          from pathlib import Path
          db=os.environ['DB_PATH']
          con=sqlite3.connect(db)
          cur=con.execute("UPDATE sleep_sync_connections SET status='disconnected', oauth_state='', oauth_state_expires_at='', last_error='' WHERE provider='xiaomi'")
          con.commit(); con.close()
          xdir=Path(os.environ['APP_DIR'])/'pb_data'/'xiaomi_sleep'
          removed=0
          if xdir.is_dir():
              for p in xdir.glob('*.state.json'):
                  p.unlink(missing_ok=True); removed += 1
          print('RESET_CONNECTION_ROWS=%d'%cur.rowcount)
          print('REMOVED_STATE_FILES=%d'%removed)
          PY
          systemctl start "$service"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8090/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 3 http://127.0.0.1:8090/api/health >/dev/null
          echo POCKETBASE_HEALTHY=1
          REMOTE
