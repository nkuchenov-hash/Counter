name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Trace historical sleep source
        shell: bash
        run: |
          set -euo pipefail
          echo diagnostic-version=20260823-trace-original-source
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "SERVICE='${POCKETBASE_SERVICE:-pocketbase.service}' bash -s" <<'REMOTE'
          set -euo pipefail
          service="${SERVICE:-pocketbase.service}"
          app_dir="$(systemctl show "$service" -p WorkingDirectory --value)"
          db="$app_dir/pb_data/data.db"
          DB_PATH="$db" python3 - <<'PY'
          import os, sqlite3
          con=sqlite3.connect(f'file:{os.environ["DB_PATH"]}?mode=ro',uri=True); con.row_factory=sqlite3.Row
          conns=con.execute("SELECT user_id,provider,status,enabled,last_sync_at,last_session_count,last_imported_count,last_sleep_count,last_error FROM sleep_sync_connections ORDER BY provider,rowid").fetchall()
          print('CONNECTIONS=%d'%len(conns))
          users=[]
          for r in conns:
              uid=str(r['user_id'])
              if uid not in users: users.append(uid)
              print('CONN provider=%s status=%s enabled=%s last_sync=%s sessions=%s imported=%s sleep=%s error=%s'%(
                  r['provider'],r['status'],r['enabled'],r['last_sync_at'],r['last_session_count'],r['last_imported_count'],r['last_sleep_count'],'present' if r['last_error'] else 'none'))
          for uid in users:
              rows=con.execute("""SELECT end_time,start_time,created,updated,external_source,sleep_source,external_kind,external_id,sleep_external_id
                FROM records WHERE user_id=? AND lower(trim(title)) IN ('sleep','сон') ORDER BY end_time DESC""",(uid,)).fetchall()
              print('USER_SLEEP_COUNT=%d'%len(rows))
              counts={}
              for r in rows:
                  src=str(r['sleep_source'] or r['external_source'] or 'unmarked')
                  counts[src]=counts.get(src,0)+1
              print('SOURCE_COUNTS='+','.join('%s:%d'%(k,v) for k,v in sorted(counts.items())))
              for r in rows[:20]:
                  src=str(r['sleep_source'] or r['external_source'] or 'unmarked')
                  print('SLEEP end=%s created=%s src=%s extkind=%s external=%s'%(
                      str(r['end_time'])[:19],str(r['created'])[:19],src,r['external_kind'] or '', 'yes' if (r['external_id'] or r['sleep_external_id']) else 'no'))
          con.close()
          PY
          REMOTE
