name: Sleep Structure Manifest Refresh

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-xiaomi-sleep-cloud
          fetch-depth: 0
      - name: Refresh generated detailed manifest entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          doc = Path('docs/APP_STRUCTURE_DETAILED.md')
          text = doc.read_text(encoding='utf-8')
          tracked = [x for x in subprocess.check_output(['git','ls-files'], text=True).splitlines() if x]
          text = re.sub(r'(\*\*Tracked files:\*\*\s+)\d+', lambda m: m.group(1) + str(len(tracked)), text, count=1)

          entries = {
            '.github/workflows/install-xiaomi-sleep-runtime.yml': 'Validates the Xiaomi sleep bridge and provisions the pinned Xiaomi Health SDK on the production PocketBase host.',
            '_tmp_sleep_cloud_result.txt': 'Sanitized production sleep-sync verification snapshot written by the PocketBase deployment workflow.',
            'pb_hooks/xiaomi_sleep_bridge.py': 'Server-only Python bridge for one-time Xiaomi QR authorization and normalized Mi Fitness sleep retrieval.',
            'pb_hooks/xiaomi_sleep_runtime.js': 'PocketBase Xiaomi sleep routes, authorization page, scheduled cloud sync, dedupe, and canonical records upsert.',
            'pb_migrations/1787143500_force_google_fit_recent_sleep_reconcile.js': 'One-time production reconcile marker for the earlier Google Fit recent-sleep recovery path.',
            'pb_migrations/1787217300_restore_google_fit_sleep_connection.js': 'One-time migration restoring the existing Google Fit sleep connection state after cloud diagnostics.',
            'pb_migrations/1787325000_force_google_fit_merged_sleep_reconcile.js': 'One-time reconcile marker that forced the canonical merged Google Fit sleep stream reread.',
            'pb_migrations/1787354100_xiaomi_sleep_provider.js': 'Extends server sleep connection providers so Xiaomi Cloud can own fresh sleep synchronization.',
          }
          missing = []
          for path, description in entries.items():
              if f'### `{path}`' not in text:
                  missing.append((path, description))
          if missing:
              text = text.rstrip() + '\n\n## Recent sleep synchronization infrastructure\n\n'
              for path, description in missing:
                  text += f'### `{path}`\n\n- **What:** {description}\n- **Why:** Keeps current sleep ingestion and its deployment/verification path explicit in the repository manifest.\n- **Contains:** Runtime or deployment logic for server-owned sleep synchronization.\n- **Responsibilities:** Preserve reliable, auditable sleep ingestion without requiring LIFE OS to be opened on the phone.\n- **When to inspect:** Missing recent sleep, provider authorization, server deployment, or sleep-sync diagnostics.\n- **Delete:** Only together with the corresponding replacement sleep-sync path.\n- **Connected to:** `pb_hooks/sleep_sync.pb.js`, PocketBase `records`, and production sleep deployment.\n- **Layer:** Server infrastructure / generated repository manifest.\n\n'
          doc.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          python scripts/audit/documentation_parity.py || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/APP_STRUCTURE_DETAILED.md
          if git diff --cached --quiet; then
            echo 'manifest already current'
            exit 0
          fi
          git commit -m 'Refresh detailed structure manifest for sleep sync'
          git push origin HEAD:fix/server-xiaomi-sleep-cloud
