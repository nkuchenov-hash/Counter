name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Verify login and live sleep import
        shell: bash
        run: |
          set -euo pipefail
          echo diagnostic-version=20260823-post-login
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "SERVICE='${POCKETBASE_SERVICE:-pocketbase.service}' bash -s" <<'REMOTE'
          set -euo pipefail
          service="${SERVICE:-pocketbase.service}"
          app_dir="$(systemctl show "$service" -p WorkingDirectory --value)"
          db="$app_dir/pb_data/data.db"
          DB_PATH="$db" APP_DIR="$app_dir" python3 - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          con=sqlite3.connect(f'file:{os.environ["DB_PATH"]}?mode=ro',uri=True); con.row_factory=sqlite3.Row
          conns=con.execute("SELECT user_id,provider,status,enabled,last_sync_at,last_session_count,last_imported_count,last_error,oauth_state_expires_at FROM sleep_sync_connections ORDER BY rowid DESC").fetchall()
          print('CONNECTION_COUNT=%d'%len(conns))
          x=[r for r in conns if r['provider']=='xiaomi']
          print('XIAOMI_CONNECTIONS=%d'%len(x))
          for i,r in enumerate(x[:5]):
              uid=str(r['user_id'])
              xdir=Path(os.environ['APP_DIR'])/'pb_data'/'xiaomi_sleep'
              token=xdir/(uid+'.token.json')
              state=xdir/(uid+'.state.json')
              token_ok=token.is_file() and token.stat().st_size>0
              state_status='none'
              if state.is_file():
                  try: state_status=str(json.loads(state.read_text()).get('status','unknown'))
                  except Exception: state_status='unreadable'
              rows=con.execute("SELECT end_time,created,external_source,sleep_source FROM records WHERE user_id=? AND lower(trim(title)) IN ('sleep','сон') ORDER BY end_time ASC",(uid,)).fetchall()
              recent=[q for q in rows if str(q['end_time'])[:10]>='2026-08-19']
              print('X[%d]_TOKEN=%d STATUS=%s ENABLED=%s STATE=%s SESSIONS=%s IMPORTED=%s ERROR=%s LATEST=%s RECENT=%d'%(
                  i,1 if token_ok else 0,r['status'],r['enabled'],state_status,r['last_session_count'],r['last_imported_count'],
                  'present' if r['last_error'] else 'none',str(rows[-1]['end_time'])[:10] if rows else 'none',len(recent)))
              for q in recent[-7:]:
                  print('RECENT[%d] END=%s SOURCE=%s CREATED=%s'%(i,q['end_time'],q['sleep_source'] or q['external_source'] or 'unmarked',q['created']))
          con.close()
          PY
          REMOTE
