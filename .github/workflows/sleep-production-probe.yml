name: Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Inspect sleep segment model
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/lifeos-mi-fitness-probe
          python3 -m venv /tmp/lifeos-mi-fitness-probe
          /tmp/lifeos-mi-fitness-probe/bin/pip install -q 'mi-fitness==0.2.0'
          /tmp/lifeos-mi-fitness-probe/bin/python - <<'PY'
          import inspect, pkgutil, mi_fitness
          from mi_fitness import SleepSegment, SleepData, XiaomiAuth, MiHealthClient
          print('SleepSegment_signature='+str(inspect.signature(SleepSegment)))
          print('SleepSegment_annotations='+repr(getattr(SleepSegment,'__annotations__',{})))
          print('SleepSegment_source_begin'); print(inspect.getsource(SleepSegment)); print('SleepSegment_source_end')
          print('package_modules='+','.join(sorted(m.name for m in pkgutil.iter_modules(mi_fitness.__path__))))
          print('client_init_source_begin'); print(inspect.getsource(MiHealthClient.__init__)); print('client_init_source_end')
          print('auth_from_token_source_begin'); print(inspect.getsource(XiaomiAuth.from_token)); print('auth_from_token_source_end')
          PY
          rm -rf /tmp/lifeos-mi-fitness-probe
          REMOTE
