name: Xiaomi Sleep Production Verify

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Reset stale Xiaomi authorization
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          [[ -n "$pid" ]]
          app_dir="$(readlink -f "/proc/$pid/cwd")"
          data_dir="$app_dir/pb_data/xiaomi_sleep"
          shopt -s nullglob
          token_files=("$data_dir"/*.token.json)
          if (( ${#token_files[@]} > 0 )); then
            echo 'xiaomi_authorized=true'
            echo 'stale_authorization_reset=skipped'
            exit 0
          fi

          pkill -f 'xiaomi_sleep_bridge.py login' || true
          rm -f "$data_dir"/*.state.json

          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import sqlite3, sys
          db=sys.argv[1]
          con=sqlite3.connect(db, timeout=30)
          before=con.execute("SELECT count(*) FROM sleep_sync_connections WHERE provider='xiaomi' AND status='connecting'").fetchone()[0]
          con.execute("UPDATE sleep_sync_connections SET status='disconnected', last_error='', oauth_state='', oauth_state_expires_at='' WHERE provider='xiaomi' AND status IN ('connecting','error')")
          con.commit()
          after=con.execute("SELECT count(*) FROM sleep_sync_connections WHERE provider='xiaomi' AND status='connecting'").fetchone()[0]
          con.close()
          print('xiaomi_connecting_before='+str(before))
          print('xiaomi_connecting_after='+str(after))
          if after != 0:
              raise SystemExit(2)
          PY
          echo 'stale_authorization_reset=true'
          REMOTE
