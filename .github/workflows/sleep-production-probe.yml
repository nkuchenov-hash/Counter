name: Generic Sleep Production Probe

on:
  pull_request:
    paths:
      - '.github/workflows/sleep-production-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          resolved_user="${SSH_USER:-root}"
          resolved_host="${SSH_HOST:-217.114.0.201}"
          echo "SSH_USER=$resolved_user" >> "$GITHUB_ENV"
          echo "SSH_HOST=$resolved_host" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$resolved_host" >> ~/.ssh/known_hosts

      - name: Inspect installed Xiaomi auth implementation
        shell: bash
        run: |
          set -euo pipefail
          echo diagnostic-version=20260823-xiaomi-sdk-source
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "SERVICE='${POCKETBASE_SERVICE:-pocketbase.service}' bash -s" <<'REMOTE'
          set -euo pipefail
          /opt/lifeos-xiaomi-sleep/bin/python - <<'PY'
          import inspect, importlib.metadata
          from mi_fitness import XiaomiAuth
          import mi_fitness.auth as auth_mod
          print('MI_FITNESS_VERSION='+importlib.metadata.version('mi-fitness'))
          print('LOGIN_QR_SIGNATURE='+str(inspect.signature(XiaomiAuth.login_qr)))
          print('LOGIN_QR_SOURCE_BEGIN')
          print(inspect.getsource(XiaomiAuth.login_qr))
          print('LOGIN_QR_SOURCE_END')
          for name in ('_get_qr_login','_poll_qr_login','_login_qr','get_qr_login','poll_qr_login'):
              obj=getattr(XiaomiAuth,name,None)
              if obj:
                  print('SOURCE_'+name+'_BEGIN')
                  print(inspect.getsource(obj))
                  print('SOURCE_'+name+'_END')
          print('AUTH_MODULE_FILE='+str(inspect.getsourcefile(auth_mod)))
          PY
          REMOTE
