name: Temporary exact 4px Time View repair

on:
  push:
    branches:
      - fix/time-view-exact-4px-gap-20260910

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Fix exact 4px Time View adjacency' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/time-view-exact-4px-gap-20260910
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Apply and validate exact adjacent spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp_exact_4px_gap_fix.py
          dart format \
            lib/features/planning/plan_time_view_layout.dart \
            test/plan_time_view_wall_alignment_regression_test.dart

          git rm .github/workflows/tmp-exact-4px-gap-fix.yml tools/tmp_exact_4px_gap_fix.py

          python3 - <<'PY'
          import subprocess
          allowed = {
              'CHANGELOG.md',
              'lib/features/planning/plan_time_view_layout.dart',
              'test/plan_time_view_wall_alignment_regression_test.dart',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected out-of-scope changes: {unexpected}')
          print('SCOPE_GUARD_OK:', ', '.join(sorted(changed)))
          PY

          mkdir -p lib/core/env
          if [ ! -f lib/core/env/env.dart ]; then
            printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
          fi

          flutter pub get
          flutter test test/plan_time_view_wall_alignment_regression_test.dart
          flutter analyze lib/features/planning/plan_time_view_layout.dart test/plan_time_view_wall_alignment_regression_test.dart --no-fatal-infos --no-fatal-warnings
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run
          flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons
          python scripts/audit/documentation_parity.py
          python scripts/audit/pocketbase_schema_contract.py
          python scripts/audit/deployment_contract.py
          git diff --check

          # No dependency change belongs to this repair.
          git checkout HEAD -- pubspec.lock || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix exact 4px Time View adjacency"
          git push origin HEAD:fix/time-view-exact-4px-gap-20260910
