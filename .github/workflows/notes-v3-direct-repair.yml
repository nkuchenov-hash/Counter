name: Notes V3 Direct Repair

on:
  push:
    branches:
      - feature/notes-v3-design-system
    paths:
      - .github/notes-v3-direct-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notes-v3-design-system
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply repair
        shell: bash
        run: |
          set +e
          python3 <<'PY' > /tmp/notes-direct-repair.log 2>&1
          from pathlib import Path
          import re

          source = Path('.github/workflows/notes-v3-ux-repair.yml').read_text(encoding='utf-8')
          start_token = "          python3 <<'PY'\n"
          end_token = "\n          PY\n"
          start = source.index(start_token) + len(start_token)
          end = source.index(end_token, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          function_pattern = re.compile(
              r"def replace_once\(path, old, new\):\n.*?(?=\nwrite_b64\()",
              re.S,
          )
          flexible_function = '''def replace_once(path, old, new):
    p = Path(path)
    text = p.read_text(encoding='utf-8')
    if old in text:
        p.write_text(text.replace(old, new, 1), encoding='utf-8')
        return
    parts = re.split(r'(\\s+)', old)
    pattern = ''.join(r'\\s+' if part.isspace() else re.escape(part) for part in parts if part)
    match = re.search(pattern, text, re.S)
    if match is None:
        raise SystemExit(f'flexible pattern not found in {path}: {old[:100]!r}')
    p.write_text(text[:match.start()] + new + text[match.end():], encoding='utf-8')
'''
          script, count = function_pattern.subn(flexible_function, script, count=1)
          if count != 1:
              raise SystemExit('replace_once function override failed')
          exec(compile(script, 'notes_v3_direct_repair.py', 'exec'))
          PY
          STATUS=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/notes-direct-repair.log .github/notes-v3-direct-repair-error.txt
            git add .github/notes-v3-direct-repair-error.txt
            git commit -m "Capture direct Notes repair failure"
            git push origin HEAD:feature/notes-v3-design-system
            cat /tmp/notes-direct-repair.log
            exit "$STATUS"
          fi

          dart --version >/dev/null 2>&1 || true
          rm -f .github/notes-v3-direct-repair-error.txt
          git add -A
          git commit -m "Fix Notes workspace layout and editor performance"
          git push origin HEAD:feature/notes-v3-design-system
