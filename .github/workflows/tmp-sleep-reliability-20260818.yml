name: One-time sleep reliability tuning

on:
  push:
    paths:
      - '.github/workflows/tmp-sleep-reliability-20260818.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tune recent history and wake-time synchronization
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('lib/data/health/health_sleep_sync_service.dart')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              'static const Duration _firstSyncLookback = Duration(days: 14);',
              'static const Duration _firstSyncLookback = Duration(days: 30);'
          )
          text = text.replace(
              'static const Duration _backgroundFrequency = Duration(days: 1);',
              'static const Duration _backgroundFrequency = Duration(minutes: 30);'
          )
          text = text.replace(
              '        initialDelay: _delayUntilNextDailyRun(),',
              '        initialDelay: Duration.zero,'
          )
          start = text.find('  Duration _delayUntilNextDailyRun() {')
          if start >= 0:
              end = text.find('\n  Future<void> _ensureWorkmanagerInitialized()', start)
              if end < 0:
                  raise SystemExit('Could not locate end of _delayUntilNextDailyRun')
              text = text[:start] + text[end+1:]
          app.write_text(text, encoding='utf-8')

          runtime = Path('pb_hooks/google_fit_sleep_runtime.js')
          text = runtime.read_text(encoding='utf-8')
          old = 'var __fitCatchupIntervalMs = 6 * 60 * 60 * 1000;'
          new = 'var __fitCatchupIntervalMs = 30 * 60 * 1000;'
          if old not in text:
              raise SystemExit('Google Fit catch-up constant not found')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          hook = Path('pb_hooks/sleep_sync.pb.js')
          text = hook.read_text(encoding='utf-8')
          text = text.replace(
              'Google Fit for unfinished backfill, the configured daily run, or a 6-hour catch-up.',
              'Google Fit for unfinished backfill, the configured daily run, or a 30-minute catch-up.'
          )
          hook.write_text(text, encoding='utf-8')
          PY

      - name: Validate touched code
        run: |
          node --check pb_hooks/google_fit_sleep_runtime.js
          node --check pb_hooks/sleep_sync.pb.js

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Analyze sleep sync service
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/data/health/health_sleep_sync_service.dart lib/services/health_connect/health_connect_sleep_service_io.dart

      - name: Publish tuning
        run: |
          rm .github/workflows/tmp-sleep-reliability-20260818.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make sleep sync wake-ready and recent-history complete"
          git pull --rebase origin main
          git push origin HEAD:main
