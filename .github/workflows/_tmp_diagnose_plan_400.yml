name: TEMP Diagnose plan update 400

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_diagnose_plan_400.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture sanitized recent PocketBase 400 details
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          user="${SSH_USER:-root}"; host="${SSH_HOST:-217.114.0.201}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "$host" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$user@$host" \
            "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" \
            > _tmp_plan_400_result.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"; fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          echo "service_resolved=true"
          echo "db_files=$(find "$app_dir/pb_data" -maxdepth 1 -type f -name '*.db' -printf '%f,' | sed 's/,$//')"
          python3 - "$app_dir/pb_data" <<'PY'
          import glob,json,os,sqlite3,sys
          root=sys.argv[1]
          targets=['37eubvs3js1sj2b','z2anfzq4581p71u','evvpwaqp5ycigoa','u7dpfsatxzsqgjr','hwpkkdswse2ywd4','9tpc92r6bifqv12','dgyx0agpat29n23']
          secret={'ip','remoteip','remote_ip','useragent','user_agent','referer','referrer','headers','authorization','auth','token','email','title','notes','notes_plain','body','request','password'}
          def clean(v,k=''):
              if str(k).lower() in secret:return '<redacted>'
              if isinstance(v,dict):return {a:clean(b,a) for a,b in v.items()}
              if isinstance(v,list):return [clean(x,k) for x in v]
              if isinstance(v,str):return v[:3000]
              return v
          found=0
          for db in sorted(glob.glob(root+'/*.db')):
              try: con=sqlite3.connect(f'file:{db}?mode=ro',uri=True);con.row_factory=sqlite3.Row
              except: continue
              for table, in con.execute("select name from sqlite_master where type='table'"):
                  try: cols=[r[1] for r in con.execute(f'pragma table_info("{table}")')]
                  except: continue
                  if not ({'message','data','status','level','created'} & set(cols)):continue
                  order='created desc' if 'created' in cols else 'rowid desc'
                  try: rows=con.execute(f'select * from "{table}" order by {order} limit 1000').fetchall()
                  except: continue
                  for row in rows:
                      raw={k:row[k] for k in row.keys()}; text=json.dumps(raw,ensure_ascii=False,default=str)
                      if not (any(t in text for t in targets) or ('/api/collections/plans/records/' in text and '400' in text)):continue
                      parsed={}
                      for k,v in raw.items():
                          if isinstance(v,str) and v[:1] in '[{':
                              try:parsed[k]=json.loads(v)
                              except:parsed[k]=v
                          else:parsed[k]=v
                      print('MATCH '+os.path.basename(db)+'/'+table+' '+json.dumps(clean(parsed),ensure_ascii=False,default=str,separators=(',',':')))
                      found+=1
                      if found>=40:break
                  if found>=40:break
              con.close()
              if found>=40:break
          print('matched_rows='+str(found))
          PY
          echo 'journal_begin'
          journalctl -u "$service_name" --since '45 minutes ago' --no-pager 2>/dev/null | grep -E '37eubvs3js1sj2b|z2anfzq4581p71u|evvpwaqp5ycigoa|u7dpfsatxzsqgjr|hwpkkdswse2ywd4|9tpc92r6bifqv12|dgyx0agpat29n23|Failed to update|validation' | tail -100 || true
          echo 'journal_end'
          REMOTE
          cat _tmp_plan_400_result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp_plan_400_result.txt
          git commit -m 'diag: record sanitized plan 400 details'
          git pull --rebase origin main
          git push origin HEAD:main
