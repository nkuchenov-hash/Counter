name: Validate server sleep sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate PocketBase JavaScript
        run: |
          node --check pb_hooks/sleep_sync.pb.js
          node --check pb_migrations/1785390000_server_sleep_sync.js

      - name: Format and analyze Flutter
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/data/health/cloud_sleep_sync_service.dart lib/data/pb_config.dart lib/features/settings/health/health_connect_settings_section.dart lib/l10n/dictionary.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
