name: Apply PocketBase activation patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/activate-google-fit-sleep-sync' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reuse PocketBase Google and encryption configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pb_hooks/sleep_sync.pb.js')
          text = path.read_text(encoding='utf-8')

          old = '''function __sleepSyncTokenKey() {
              var key = __sleepSyncEnv("SLEEP_SYNC_TOKEN_KEY");
              if (key.length !== 32) throw new Error("SLEEP_SYNC_TOKEN_KEY must be exactly 32 characters");
              return key;
          }'''
          new = '''function __sleepSyncTokenKey(app) {
              var key = __sleepSyncEnv("SLEEP_SYNC_TOKEN_KEY");
              if (key.length === 32) return key;
              try {
                  var encryptionEnv = String(app.encryptionEnv() || "").trim();
                  var inherited = encryptionEnv ? __sleepSyncEnv(encryptionEnv) : "";
                  if (inherited.length === 32) return inherited;
              } catch (_) {}
              throw new Error("PocketBase encryption key is not configured");
          }'''
          if old not in text:
              raise SystemExit('token key block not found')
          text = text.replace(old, new, 1)

          old = '''function __sleepSyncGoogleConfig() {
              var clientId = __sleepSyncEnv("SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID");
              var clientSecret = __sleepSyncEnv("SLEEP_SYNC_GOOGLE_FIT_CLIENT_SECRET");
              if (!clientId || !clientSecret) throw new Error("Google Fit OAuth is not configured");
              return {
                  clientId: clientId,
                  clientSecret: clientSecret,
                  redirectUri: __sleepSyncPublicBaseUrl() + "/api/sleep-sync/google-fit/callback",
              };
          }'''
          new = '''function __sleepSyncGoogleConfig(app) {
              var clientId = __sleepSyncEnv("SLEEP_SYNC_GOOGLE_FIT_CLIENT_ID");
              var clientSecret = __sleepSyncEnv("SLEEP_SYNC_GOOGLE_FIT_CLIENT_SECRET");
              if (!clientId || !clientSecret) {
                  try {
                      var profiles = app.findCollectionByNameOrId("profiles");
                      var result = profiles.oauth2.getProviderConfig("google");
                      var provider = result[0];
                      var found = result[1];
                      if (found && provider) {
                          clientId = clientId || String(provider.clientId || "").trim();
                          clientSecret = clientSecret || String(provider.clientSecret || "").trim();
                      }
                  } catch (_) {}
              }
              if (!clientId || !clientSecret) throw new Error("Google Fit OAuth is not configured");
              return {
                  clientId: clientId,
                  clientSecret: clientSecret,
                  redirectUri: __sleepSyncPublicBaseUrl() + "/api/sleep-sync/google-fit/callback",
              };
          }'''
          if old not in text:
              raise SystemExit('google config block not found')
          text = text.replace(old, new, 1)

          replacements = {
              'function __sleepSyncExchangeCode(code) {\n    var cfg = __sleepSyncGoogleConfig();':
                  'function __sleepSyncExchangeCode(app, code) {\n    var cfg = __sleepSyncGoogleConfig(app);',
              'var key = __sleepSyncTokenKey();\n    var currentEnc':
                  'var key = __sleepSyncTokenKey(app);\n    var currentEnc',
              'var cfg = __sleepSyncGoogleConfig();\n    var refreshToken':
                  'var cfg = __sleepSyncGoogleConfig(app);\n    var refreshToken',
              'var cfg = __sleepSyncGoogleConfig();\n    __sleepSyncTokenKey();\n    var connection':
                  'var cfg = __sleepSyncGoogleConfig(e.app);\n    __sleepSyncTokenKey(e.app);\n    var connection',
              'var token = __sleepSyncExchangeCode(code);\n        var key = __sleepSyncTokenKey();':
                  'var token = __sleepSyncExchangeCode(e.app, code);\n        var key = __sleepSyncTokenKey(e.app);',
          }
          for source, target in replacements.items():
              if source not in text:
                  raise SystemExit(f'replacement source not found: {source[:60]}')
              text = text.replace(source, target, 1)

          if '__sleepSyncGoogleConfig()' in text or '__sleepSyncTokenKey()' in text:
              raise SystemExit('zero-argument configuration call remains')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          node --check pb_hooks/sleep_sync.pb.js
          node --check pb_migrations/1785390000_server_sleep_sync.js
          git diff --check
          rm -f .github/workflows/apply-pocketbase-auto-deploy.yml
          rm -f .github/workflows/apply-pocketbase-auto-deploy-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pb_hooks/sleep_sync.pb.js .github/workflows/deploy-pocketbase.yml .github/workflows/apply-pocketbase-auto-deploy.yml .github/workflows/apply-pocketbase-auto-deploy-pr.yml
          git commit -m "Activate automatic PocketBase sleep sync"
          git push origin HEAD:${{ github.head_ref }}
