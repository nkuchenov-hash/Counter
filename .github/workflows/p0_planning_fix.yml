name: Apply P0 planning time and performance fix

on:
  push:
    branches:
      - fix/p0-planning-time-performance

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-planning-time-performance
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 scripts/manual/apply_p0_planning_fix.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/shared/planning_task_edit_sheet.dart \
            lib/data/plans/plan_time_cascade_helpers.dart \
            lib/app/shell/shared/shell_edit_hosts.dart \
            lib/l10n/langs/en.dart \
            lib/l10n/langs/ru.dart \
            test/plan_create_collision_and_edit_time_guard_test.dart

      - name: Run three focused regressions
        run: flutter test test/plan_create_collision_and_edit_time_guard_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Diff check
        run: git diff --check

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(planning): preserve selected time and reduce editor load"
          git push origin HEAD:fix/p0-planning-time-performance
