name: Android release APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/pocketbase_production_origin_test.dart'
      - 'test/life_semantic_palette_test.dart'
      - 'test/record_notes_ime_stability_test.dart'
      - 'test/notes_mobile_keyboard_regression_test.dart'
      - 'test/app_control_consistency_test.dart'
      - 'test/viktor_multiday_agent_test.dart'
      - 'test/viktor_priority_insertion_test.dart'
      - 'test/viktor_plan_category_test.dart'
      - 'test/viktor_existing_plan_voice_timezone_test.dart'
      - 'test/viktor_read_answer_test.dart'
      - 'test/live_sync_contract_test.dart'
      - 'test/record_write_durability_test.dart'
      - 'test/web_record_journal_test.dart'
      - 'test/planning_edit_sheet_layout_test.dart'
      - 'test/notes_canonical_components_test.dart'
      - 'test/auto_plan_nearest_free_slot_test.dart'
      - 'test/plan_time_bulk_drag_test.dart'
      - 'test/plan_recurrence_scope_test.dart'
      - 'test/planning_snapshot_cache_test.dart'
      - 'test/plan_time_timezone_projection_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk-build.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/pocketbase_production_origin_test.dart'
      - 'test/life_semantic_palette_test.dart'
      - 'test/record_notes_ime_stability_test.dart'
      - 'test/notes_mobile_keyboard_regression_test.dart'
      - 'test/app_control_consistency_test.dart'
      - 'test/live_sync_contract_test.dart'
      - 'test/record_write_durability_test.dart'
      - 'test/plan_recurrence_scope_test.dart'
      - 'test/planning_snapshot_cache_test.dart'
      - 'test/plan_time_timezone_projection_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk-build.yml'

concurrency:
  group: android-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify restored PocketBase health before publishing Android
        shell: bash
        run: |
          set -euo pipefail
          good=false
          for attempt in 1 2 3; do
            status="$(curl --silent --show-error --location --connect-timeout 6 --max-time 12 --output /tmp/lifeos-pb-health.json --write-out "%{http_code}" https://137-22-146-109.sslip.io/api/health || true)"
            if [[ "$status" == "200" ]] && python3 -c "import json; assert json.load(open('/tmp/lifeos-pb-health.json')).get('code') == 200"; then good=true; break; fi
            echo "Backend health attempt $attempt failed: HTTP $status"
            if [[ "$attempt" != "3" ]]; then sleep 5; fi
          done
          if [[ "$good" != "true" ]]; then echo "::error::PocketBase unavailable, do not publish broken login APK"; exit 1; fi
      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify shared LIFE OS semantic palette
        run: flutter test test/life_semantic_palette_test.dart

      - name: Verify persistent People/Menu shell and styling contracts
        run: flutter test test/shell_form_factor_test.dart

      - name: Verify single canonical input and painted field-button alignment
        run: flutter test test/app_control_consistency_test.dart

      - name: Verify Chrome quick-entry focus and painted text alignment
        run: flutter test --platform chrome test/app_control_consistency_test.dart

      - name: Verify Android and Web production backend parity
        run: flutter test test/pocketbase_production_origin_test.dart

      - name: Verify mobile Notes keyboard stability in record edits
        run: flutter test test/record_notes_ime_stability_test.dart test/notes_mobile_keyboard_regression_test.dart

      - name: Verify cloud-first sleep synchronization contract
        run: flutter test test/sleep_cloud_settings_contract_test.dart

      - name: Analyze runtime app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run live-sync and recurrence regression tests
        run: flutter test test/viktor_read_answer_test.dart test/viktor_date_scope_test.dart test/viktor_existing_plan_voice_timezone_test.dart test/viktor_plan_category_test.dart test/viktor_priority_insertion_test.dart test/viktor_multiday_agent_test.dart test/viktor_general_agent_contract_test.dart test/viktor_conversation_store_test.dart test/viktor_action_contract_test.dart test/viktor_historical_records_test.dart test/viktor_thread_context_test.dart test/viktor_record_tools_test.dart test/viktor_schedule_planner_test.dart test/viktor_tag_duration_reflow_test.dart test/viktor_chat_layout_test.dart test/live_sync_contract_test.dart test/plan_recurrence_scope_test.dart test/record_write_durability_test.dart test/planning_edit_sheet_layout_test.dart test/auto_plan_nearest_free_slot_test.dart test/calendar_week_grouping_test.dart test/calendar_civil_dates_navigation_test.dart test/calendar_drag_and_reschedule_test.dart test/calendar_week_timeview_drag_test.dart test/plan_time_bulk_drag_test.dart test/notes_canonical_components_test.dart test/notes_category_plus_sheet_test.dart test/notes_folder_tabs_contract_test.dart test/category_mutation_outbox_test.dart test/category_order_sync_test.dart test/profile_timezone_catalog_test.dart test/plan_time_sequential_cascade_test.dart test/plan_time_fixed_time_policy_test.dart test/planning_snapshot_cache_test.dart test/plan_time_timezone_projection_test.dart

      - name: Time View overlap-lane regression
        run: flutter test test/plan_time_view_layout_test.dart --plain-name "Time View overlap lanes preserve every card"

      - name: Browser IndexedDB persistence regression
        run: flutter test --platform chrome test/web_record_journal_test.dart


      # Single production signing identity, kept in a private encrypted draft
      # release. Missing backup must fail the release: never rotate keys again.
      - name: Restore permanent LIFE OS Android signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENCRYPTION_SECRET: ${{ secrets.LIFE_OS_SIGNING_ENCRYPTION_SECRET || secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$SIGNING_ENCRYPTION_SECRET" ]]; then
            echo "::error::Stable encryption secret is unavailable; refusing to rotate or publish."
            exit 1
          fi
          WORK_DIR="$RUNNER_TEMP/lifeos-android-signing"
          mkdir -p "$WORK_DIR"
          BACKUP_TAG="life-os-android-signing-identity-v2"
          ASSET_NAME="life-os-signing-v2.tar.enc"
          WRAP_KEY="$(printf '%s' "$SIGNING_ENCRYPTION_SECRET" | sha256sum | cut -d ' ' -f1)"
          export WRAP_KEY

          RELEASE_IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "life-os-android-signing-identity-v2" and .draft == true) | .id')"
          RELEASE_ID="$(printf '%s\n' "$RELEASE_IDS" | sed '/^$/d' | head -n1)"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::Original v2 signing backup missing. Do not generate new identity."
            exit 1
          fi
          ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "life-os-signing-v2.tar.enc") | .id')"
          if [[ -z "$ASSET_ID" ]]; then
            echo "::error::Encrypted signing-key asset missing. Refusing signing rotation."
            exit 1
          fi
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            --output "$WORK_DIR/$ASSET_NAME"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in "$WORK_DIR/$ASSET_NAME" -out "$WORK_DIR/signing.tar" \
            -pass env:WRAP_KEY
          tar -xf "$WORK_DIR/signing.tar" -C "$WORK_DIR" life-os-release.jks signing.env
          test -s "$WORK_DIR/life-os-release.jks"
          test -s "$WORK_DIR/signing.env"
          source "$WORK_DIR/signing.env"
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]
          keytool -list -keystore "$WORK_DIR/life-os-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          cp "$WORK_DIR/life-os-release.jks" android/app/life-os-release.jks
          chmod 600 android/app/life-os-release.jks
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"
          {
            printf 'LIFE_OS_KEYSTORE_PATH=%s\n' "$GITHUB_WORKSPACE/android/app/life-os-release.jks"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "One canonical signing key verified."

      - name: Verify persistent signing is configured
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$LIFE_OS_KEYSTORE_PATH" ]]
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]]
          [[ -n "$ANDROID_KEY_ALIAS" ]]
          [[ -n "$ANDROID_KEY_PASSWORD" ]]

      # Android SDK mirrors sometimes return a truncated ZIP for the Flutter
      # pinned NDK. Install it explicitly with bounded retries and clear only
      # the failed NDK directory before retrying; never change app dependencies.
      - name: Install required Android NDK with retries
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          for attempt in 1 2 3; do
            if [[ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]]; then
              echo "Verified NDK $NDK_VERSION is already installed."
              break
            fi
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            # yes may exit with SIGPIPE after sdkmanager succeeds, so
            # verify the installed payload instead of the pipeline status.
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION" || true
            if [[ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]]; then
              echo "Installed NDK $NDK_VERSION."
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::NDK download is broken after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Build one canonical ARM64 release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LIFE-OS-Android-arm64.apk

      - name: Verify canonical package ID and signing
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -n1)"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -s LIFE-OS-Android-arm64.apk
          [[ -x "$aapt" && -x "$apksigner" ]]
          actual="$("$aapt" dump badging LIFE-OS-Android-arm64.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          [[ "$actual" == "com.example.counter" ]] || {
            echo "::error::Noncanonical app package ID: $actual"
            exit 1
          }
          "$apksigner" verify --verbose LIFE-OS-Android-arm64.apk >/dev/null
          echo "Verified single canonical package: $actual."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: counter-android-arm64-release
          path: LIFE-OS-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable LIFE OS Android release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: life-os-android-${{ github.run_number }}-${{ github.sha }}
          name: LIFE OS Android — build ${{ github.run_number }}
          body: Canonical LIFE OS Android ARM64 release. Single package com.example.counter, signed with retained permanent v2 key. Uses the same live PocketBase backend as Web. Older builds signed with unrelated keys cannot be updated in place.
          artifacts: LIFE-OS-Android-arm64.apk
          immutableCreate: true
          makeLatest: true
          prerelease: false
