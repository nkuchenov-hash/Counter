name: Android release APK

# Manual artifact trigger: 2026-09-03 Notes cross-device sync release.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Prepare public APK name
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LIFE-OS-Android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: counter-android-arm64-release
          path: LIFE-OS-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable LIFE OS Android release
        uses: ncipollo/release-action@v1
        with:
          tag: life-os-1.0.0-build1-20260903-notes-sync
          name: LIFE OS 1.0.0+1 — Notes cross-device sync
          body: Android ARM64 release for 2026-09-03. Fixes Notes created on mobile remaining only in local optimistic state instead of persisting through PocketBase and appearing on web. Also reconciles optimistic note IDs after server materialization.
          artifacts: LIFE-OS-Android-arm64.apk
          immutableCreate: true
          makeLatest: true
          prerelease: false
