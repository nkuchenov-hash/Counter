name: Android release APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/life_semantic_palette_test.dart'
      - 'test/viktor_multiday_agent_test.dart'
      - 'test/viktor_priority_insertion_test.dart'
      - 'test/viktor_plan_category_test.dart'
      - 'test/viktor_existing_plan_voice_timezone_test.dart'
      - 'test/viktor_read_answer_test.dart'
      - 'test/live_sync_contract_test.dart'
      - 'test/record_write_durability_test.dart'
      - 'test/web_record_journal_test.dart'
      - 'test/planning_edit_sheet_layout_test.dart'
      - 'test/notes_canonical_components_test.dart'
      - 'test/auto_plan_nearest_free_slot_test.dart'
      - 'test/plan_time_bulk_drag_test.dart'
      - 'test/plan_recurrence_scope_test.dart'
      - 'test/planning_snapshot_cache_test.dart'
      - 'test/plan_time_timezone_projection_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk-build.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/life_semantic_palette_test.dart'
      - 'test/live_sync_contract_test.dart'
      - 'test/record_write_durability_test.dart'
      - 'test/plan_recurrence_scope_test.dart'
      - 'test/planning_snapshot_cache_test.dart'
      - 'test/plan_time_timezone_projection_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk-build.yml'

concurrency:
  group: android-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify shared LIFE OS semantic palette
        run: flutter test test/life_semantic_palette_test.dart

      - name: Analyze runtime app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run live-sync and recurrence regression tests
        run: flutter test test/viktor_read_answer_test.dart test/viktor_date_scope_test.dart test/viktor_existing_plan_voice_timezone_test.dart test/viktor_plan_category_test.dart test/viktor_priority_insertion_test.dart test/viktor_multiday_agent_test.dart test/viktor_general_agent_contract_test.dart test/viktor_conversation_store_test.dart test/viktor_action_contract_test.dart test/viktor_historical_records_test.dart test/viktor_thread_context_test.dart test/viktor_record_tools_test.dart test/viktor_schedule_planner_test.dart test/viktor_chat_layout_test.dart test/live_sync_contract_test.dart test/plan_recurrence_scope_test.dart test/record_write_durability_test.dart test/planning_edit_sheet_layout_test.dart test/auto_plan_nearest_free_slot_test.dart test/calendar_week_grouping_test.dart test/calendar_drag_and_reschedule_test.dart test/calendar_week_timeview_drag_test.dart test/plan_time_bulk_drag_test.dart test/notes_canonical_components_test.dart test/notes_category_plus_sheet_test.dart test/notes_folder_tabs_contract_test.dart test/category_mutation_outbox_test.dart test/category_order_sync_test.dart test/profile_timezone_catalog_test.dart test/plan_time_sequential_cascade_test.dart test/plan_time_fixed_time_policy_test.dart test/planning_snapshot_cache_test.dart test/plan_time_timezone_projection_test.dart

      - name: Time View overlap-lane regression
        run: flutter test test/plan_time_view_layout_test.dart --plain-name "Time View overlap lanes preserve every card"

      - name: Browser IndexedDB persistence regression
        run: flutter test --platform chrome test/web_record_journal_test.dart

      - name: Configure persistent Android release signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ -n "${SSH_PRIVATE_KEY:-}" ]]
          SSH_USER="${SSH_USER:-root}"
          SSH_HOST="${SSH_HOST:-217.114.0.201}"
          REMOTE_DIR=".lifeos/android-signing"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_android_signing
          chmod 600 ~/.ssh/lifeos_android_signing
          # Transient SSH failures must not block an otherwise healthy Android build.
          # Never create or rotate the existing production signing key on a network error.
          HOST_KEY_FOUND=false
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 8 -p "$SSH_PORT" -H "$SSH_HOST" > /tmp/lifeos-ssh-hostkey 2>/dev/null &&
               [[ -s /tmp/lifeos-ssh-hostkey ]]; then
              cat /tmp/lifeos-ssh-hostkey >> ~/.ssh/known_hosts
              HOST_KEY_FOUND=true
              break
            fi
            echo "::warning::Release signing SSH host not reachable (attempt $attempt/5)"
            sleep $((attempt * 4))
          done
          if [[ "$HOST_KEY_FOUND" != true ]]; then
            echo "::error::Cannot reach persistent Android signing-key host on SSH port $SSH_PORT. Refusing to create an incompatible APK."
            exit 1
          fi

          mkdir -p /tmp/lifeos-signing
          SIGNING_KEY_FETCHED=false
          for attempt in 1 2 3 4; do
            if scp -q -o BatchMode=yes -o ConnectTimeout=12 \
              -i ~/.ssh/lifeos_android_signing -P "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST:$REMOTE_DIR/life-os-release.jks" \
              "$SSH_USER@$SSH_HOST:$REMOTE_DIR/signing.env" \
              /tmp/lifeos-signing/; then
              SIGNING_KEY_FETCHED=true
              break
            fi
            echo "::warning::Cannot retrieve existing Android release key (attempt $attempt/4)"
            sleep $((attempt * 5))
          done
          if [[ "$SIGNING_KEY_FETCHED" != true ]]; then
            echo "::error::Existing production signing key unavailable. Do not rotate signing keys or publish debug-signed updates."
            exit 1
          fi
          test -s /tmp/lifeos-signing/life-os-release.jks
          test -s /tmp/lifeos-signing/signing.env

          cp /tmp/lifeos-signing/life-os-release.jks android/app/life-os-release.jks
          set -a
          source /tmp/lifeos-signing/signing.env
          set +a
          # keytool's default PKCS12 store uses the store password for private-key
          # entries even when a different -keypass was supplied.
          ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          {
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
          } > /tmp/lifeos-signing/signing.env
          scp -q -i ~/.ssh/lifeos_android_signing -P "$SSH_PORT" \
            /tmp/lifeos-signing/signing.env \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/signing.env"
          ssh -i ~/.ssh/lifeos_android_signing -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chmod 600 '$REMOTE_DIR/signing.env'"

          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"
          echo "LIFE_OS_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/app/life-os-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify persistent signing is configured
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$LIFE_OS_KEYSTORE_PATH" ]]
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]]
          [[ -n "$ANDROID_KEY_ALIAS" ]]
          [[ -n "$ANDROID_KEY_PASSWORD" ]]

      # Android SDK mirrors sometimes return a truncated ZIP for the Flutter
      # pinned NDK. Install it explicitly with bounded retries and clear only
      # the failed NDK directory before retrying; never change app dependencies.
      - name: Install required Android NDK with retries
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          for attempt in 1 2 3; do
            if [[ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]]; then
              echo "Verified NDK $NDK_VERSION is already installed."
              break
            fi
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            # yes may exit with SIGPIPE after sdkmanager succeeds, so
            # verify the installed payload instead of the pipeline status.
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION" || true
            if [[ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]]; then
              echo "Installed NDK $NDK_VERSION."
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::NDK download is broken after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Prepare public APK name
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LIFE-OS-Android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: counter-android-arm64-release
          path: LIFE-OS-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable LIFE OS Android release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: life-os-android-${{ github.run_number }}-${{ github.sha }}
          name: LIFE OS Android — build ${{ github.run_number }}
          body: Android ARM64 release — LIFE OS 1.1.0. Unified grouped settings menus, light/dark theme previews, and responsive menu surfaces.
          artifacts: LIFE-OS-Android-arm64.apk
          immutableCreate: true
          makeLatest: true
          prerelease: false
