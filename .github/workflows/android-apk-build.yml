name: Android release APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/live_sync_contract_test.dart'
      - 'test/realtime_gap_convergence_contract_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk-build.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk-build.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze runtime app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run live-sync regression tests
        run: flutter test test/live_sync_contract_test.dart test/realtime_gap_convergence_contract_test.dart

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Prepare public APK name
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LIFE-OS-Android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: counter-android-arm64-release
          path: LIFE-OS-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable LIFE OS Android release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: life-os-android-${{ github.run_number }}-${{ github.sha }}
          name: LIFE OS Android — build ${{ github.run_number }}
          body: Android ARM64 release built from the current shared LIFE OS runtime. Realtime reconnects reconcile authoritative PocketBase state so cross-device changes cannot remain stale after an SSE/network gap.
          artifacts: LIFE-OS-Android-arm64.apk
          immutableCreate: true
          makeLatest: true
          prerelease: false
