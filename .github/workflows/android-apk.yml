name: Build LIFE OS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-os-android-apk
  cancel-in-progress: false

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml || { echo "::error::Missing pubspec.yaml in repository root"; exit 1; }
          test -d android || { echo "::error::Missing android/ Flutter project"; exit 1; }
      - name: Generate environment placeholder
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Build ARM64 release APK
        run: |
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons \
            --dart-define=GIT_COMMIT="${GITHUB_SHA:0:7}" \
            --dart-define=BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LIFE-OS-Android-arm64.apk
          sha256sum dist/LIFE-OS-Android-arm64.apk > dist/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-OS-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish latest public Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=life-os-latest
          SHA="${GITHUB_SHA}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LIFE OS Android (latest)" --notes "Latest ARM64 Android build."
          gh release upload "$TAG" dist/LIFE-OS-Android-arm64.apk dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --title "LIFE OS Android (latest)" --notes "ARM64 Android build from commit $SHA."
