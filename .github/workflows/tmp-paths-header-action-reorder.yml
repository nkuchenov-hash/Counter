name: Temporary Paths patch

on:
  push:
    branches:
      - fix/paths-header-action-reorder-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paths-header-action-reorder-20260904
      - name: Apply patch
        run: python scripts/tmp_patch_paths_header_reorder.py
      - name: Commit result
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          rm scripts/tmp_patch_paths_header_reorder.py
          rm .github/workflows/tmp-paths-header-action-reorder.yml
          git add -A
          git commit -m "Refine Paths header and reorder stage items"
          git push origin HEAD:fix/paths-header-action-reorder-20260904
