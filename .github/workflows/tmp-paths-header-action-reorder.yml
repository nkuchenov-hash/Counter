name: Temporary Paths header and action reorder patch

on:
  push:
    branches:
      - fix/paths-header-action-reorder-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paths-header-action-reorder-20260904
      - name: Patch Paths UI and design-system docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          path = Path('lib/features/paths/paths_page.dart')
          text = path.read_text()

          old = """  void _reorderStages(
            ProjectPathSnapshot path,
            int oldIndex,
            int newIndex,
          ) {
            final current = _localPathById(path.pathId) ?? path;
            final stages = List<PathStageSnapshot>.from(current.stages);
            if (oldIndex < 0 || oldIndex >= stages.length) return;
            if (newIndex > oldIndex) newIndex -= 1;
            if (newIndex < 0 || newIndex >= stages.length || newIndex == oldIndex) return;
            final moved = stages.removeAt(oldIndex);
            stages.insert(newIndex, moved);
            unawaited(_saveOptimistic(current, current.copyWith(stages: stages)));
          }

          void _toggleAction(
"""
          new = """  void _reorderStages(
            ProjectPathSnapshot path,
            int oldIndex,
            int newIndex,
          ) {
            final current = _localPathById(path.pathId) ?? path;
            final stages = List<PathStageSnapshot>.from(current.stages);
            if (oldIndex < 0 || oldIndex >= stages.length) return;
            if (newIndex > oldIndex) newIndex -= 1;
            if (newIndex < 0 || newIndex >= stages.length || newIndex == oldIndex) return;
            final moved = stages.removeAt(oldIndex);
            stages.insert(newIndex, moved);
            unawaited(_saveOptimistic(current, current.copyWith(stages: stages)));
          }

          void _reorderActions(
            ProjectPathSnapshot path,
            int stageIndex,
            int oldIndex,
            int newIndex,
          ) {
            final current = _localPathById(path.pathId) ?? path;
            final stages = List<PathStageSnapshot>.from(current.stages);
            if (stageIndex < 0 || stageIndex >= stages.length) return;
            final stage = stages[stageIndex];
            final actions = List<PathActionSnapshot>.from(stage.actions);
            if (oldIndex < 0 || oldIndex >= actions.length) return;
            if (newIndex > oldIndex) newIndex -= 1;
            if (newIndex < 0 || newIndex >= actions.length || newIndex == oldIndex) return;
            final moved = actions.removeAt(oldIndex);
            actions.insert(newIndex, moved);
            stages[stageIndex] = stage.copyWith(actions: actions);
            unawaited(_saveOptimistic(current, current.copyWith(stages: stages)));
          }

          void _toggleAction(
"""
          text = replace_once(text, old, new, 'add action reorder')

          text = replace_once(
              text,
              """  Widget _pathDetail(ProjectPathSnapshot path) {
            final audit = _repository.audit(path);
            final currentIndex = path.stages.indexWhere((stage) => !stage.isDone);
""",
              """  Widget _pathDetail(ProjectPathSnapshot path) {
            final currentIndex = path.stages.indexWhere((stage) => !stage.isDone);
""",
              'remove audit local',
          )

          old = """          Row(children: [
            Expanded(
              child: Text(
                _categoryName(path.category),
                style: Theme.of(context)
                    .textTheme
                    .headlineSmall
                    ?.copyWith(fontWeight: FontWeight.w800),
              ),
            ),
            AppIconButton(
              icon: Icons.edit_outlined,
              tooltip: _ru ? 'Изменить цель' : 'Edit goal',
              onPressed: () => unawaited(_editGoal(path)),
            ),
            AppIconButton(
              icon: Icons.delete_outline_rounded,
              tooltip: _ru ? 'Удалить путь' : 'Delete Path',
              onPressed: () => unawaited(_deletePath(path)),
            ),
          ]),
          const SizedBox(height: 6),
          Text(path.goal, style: Theme.of(context).textTheme.bodyLarge),
          const SizedBox(height: 12),
          _auditCard(audit),
          const SizedBox(height: 14),
"""
          new = """          Row(children: [
            Expanded(
              child: Text(
                _categoryName(path.category),
                style: Theme.of(context)
                    .textTheme
                    .titleLarge
                    ?.copyWith(fontWeight: FontWeight.w800),
              ),
            ),
            AppIconButton(
              icon: Icons.edit_outlined,
              tooltip: _ru ? 'Изменить цель' : 'Edit goal',
              onPressed: () => unawaited(_editGoal(path)),
            ),
            AppIconButton(
              icon: Icons.delete_outline_rounded,
              tooltip: _ru ? 'Удалить путь' : 'Delete Path',
              onPressed: () => unawaited(_deletePath(path)),
            ),
          ]),
          const SizedBox(height: 6),
          Text.rich(
            TextSpan(
              style: Theme.of(context).textTheme.bodyLarge,
              children: [
                TextSpan(
                  text: _ru ? 'Цель: ' : 'Goal: ',
                  style: const TextStyle(fontWeight: FontWeight.w800),
                ),
                TextSpan(text: path.goal),
              ],
            ),
          ),
          const SizedBox(height: 14),
"""
          text = replace_once(text, old, new, 'compact path header')

          start = text.index('  Widget _auditCard(PathStructureAudit audit) {')
          end = text.index('  Widget _stageCard(', start)
          text = text[:start] + text[end:]

          text = replace_once(
              text,
              """            Expanded(child: Text(stage.title, style: theme.textTheme.titleLarge?.copyWith(
              color: stage.isDone ? completed : null, fontWeight: FontWeight.w800,
            ))),
""",
              """            Expanded(child: Text(stage.title, style: theme.textTheme.titleMedium?.copyWith(
              color: stage.isDone ? completed : null, fontWeight: FontWeight.w800,
            ))),
""",
              'smaller stage headings',
          )

          old = """          children: [Container(color: scheme.surface, child: Column(children: [
            const Divider(height: 1),
            for (var i = 0; i < stage.actions.length; i++) _actionRow(path, index, i),
            Padding(
              padding: const EdgeInsets.fromLTRB(20, 4, 20, 10),
              child: Align(alignment: Alignment.centerLeft, child: AppButton.ghost(
                label: _ru ? 'Добавить пункт' : 'Add item', icon: Icons.add_rounded, size: AppButtonSize.s,
                onPressed: () => unawaited(_addAction(path, index)),
              )),
            ),
          ]))],
"""
          new = """          children: [
            Container(
              color: scheme.surface,
              child: AppReorderableList(
                itemCount: stage.actions.length,
                itemKeyBuilder: (actionIndex) => ValueKey(
                  'path-action-${path.pathId}-${stage.id}-${stage.actions[actionIndex].id}',
                ),
                dragLabelBuilder: (actionIndex) => _ru
                    ? 'Перетащить пункт ${actionIndex + 1}'
                    : 'Reorder item ${actionIndex + 1}',
                onReorder: (oldIndex, newIndex) =>
                    _reorderActions(path, index, oldIndex, newIndex),
                spacing: 0,
                shrinkWrap: true,
                primary: false,
                physics: const NeverScrollableScrollPhysics(),
                header: const Divider(height: 1),
                footer: Padding(
                  padding: const EdgeInsets.fromLTRB(20, 4, 20, 10),
                  child: Align(
                    alignment: Alignment.centerLeft,
                    child: AppButton.ghost(
                      label: _ru ? 'Добавить пункт' : 'Add item',
                      icon: Icons.add_rounded,
                      size: AppButtonSize.s,
                      onPressed: () => unawaited(_addAction(path, index)),
                    ),
                  ),
                ),
                itemBuilder: (context, actionIndex, actionDragHandle) =>
                    _actionRow(path, index, actionIndex, actionDragHandle),
              ),
            ),
          ],
"""
          text = replace_once(text, old, new, 'nested action reorder list')

          text = replace_once(
              text,
              """  Widget _actionRow(ProjectPathSnapshot path, int stageIndex, int actionIndex) {
""",
              """  Widget _actionRow(
            ProjectPathSnapshot path,
            int stageIndex,
            int actionIndex,
            Widget dragHandle,
          ) {
""",
              'action row signature',
          )

          text = replace_once(
              text,
              """        const SizedBox(width: 12),
        Padding(padding: const EdgeInsets.only(top: 4), child: Text('${action.minutes} ${_ru ? 'мин' : 'min'}',
          style: theme.textTheme.bodySmall?.copyWith(color: scheme.onSurfaceVariant))),
      ]),
""",
              """        const SizedBox(width: 12),
        Padding(
          padding: const EdgeInsets.only(top: 2),
          child: Row(
            mainAxisSize: MainAxisSize.min,
            children: [
              Text(
                '${action.minutes} ${_ru ? 'мин' : 'min'}',
                style: theme.textTheme.bodySmall?.copyWith(
                  color: scheme.onSurfaceVariant,
                ),
              ),
              const SizedBox(width: 4),
              dragHandle,
            ],
          ),
        ),
      ]),
""",
              'action drag handle',
          )

          path.write_text(text)

          docs = Path('docs/DESIGN_SYSTEM.md')
          d = docs.read_text()
          old = """- Use `buildDefaultDragHandles: false`; the canonical handle owns the drag start so desktop/web/mobile behavior is consistent.
"""
          new = """- Use `buildDefaultDragHandles: false`; the canonical handle owns the drag start so desktop/web/mobile behavior is consistent.
- Nested ordered groups use the same `AppReorderableList`, not feature-local drag code. Set `shrinkWrap: true`, `primary: false`, and non-scrolling physics when the nested list lives inside another scroll/reorder surface; keep stable domain keys at both levels.
"""
          d = replace_once(d, old, new, 'document nested reorder')
          docs.write_text(d)
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov-hash@users.noreply.github.com"
          rm .github/workflows/tmp-paths-header-action-reorder.yml
          git add lib/features/paths/paths_page.dart lib/core/widgets/mouse_drag_scroll_behavior.dart docs/DESIGN_SYSTEM.md .github/workflows/tmp-paths-header-action-reorder.yml
          git commit -m "Refine Paths header and reorder stage items"
          git push origin HEAD:fix/paths-header-action-reorder-20260904
