name: Notes compact block controls

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notes-compact-block-controls
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/notes-seamless-editor
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Apply compact controls
        run: python scripts/manual/compact_notes_block_controls.py

      - name: Remove temporary tooling
        run: |
          rm scripts/manual/compact_notes_block_controls.py
          rm .github/workflows/notes-compact-controls.yml

      - name: Format and verify
        run: |
          dart format lib/features/notes/widgets/note_editor_block_widgets.dart
          cp lib/core/env/env.dart.example lib/core/env/env.dart
          flutter pub get
          flutter analyze lib/features/notes/widgets/note_editor_block_widgets.dart --no-fatal-infos --no-fatal-warnings
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Commit compact controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Compact Notes block actions into one stable menu"
          git push origin HEAD:fix/notes-seamless-editor
