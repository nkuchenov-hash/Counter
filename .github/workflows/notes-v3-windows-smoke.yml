name: Notes V3 Windows Smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/notes-v3-design-system

permissions:
  contents: read

jobs:
  build-notes-windows:
    if: github.event_name == 'push' || github.head_ref == 'feature/notes-v3-design-system'
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-tree-shake-icons

      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath notes-v3-windows-release.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: notes-v3-windows-release
          path: notes-v3-windows-release.zip
          if-no-files-found: error
          retention-days: 7
