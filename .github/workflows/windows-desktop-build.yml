name: Windows desktop build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/live_sync_contract_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'windows/**'
      - 'installer/windows/**'
      - '.github/workflows/windows-desktop-build.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'windows/**'
      - 'installer/windows/**'
      - '.github/workflows/windows-desktop-build.yml'

concurrency:
  group: windows-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-installer:
    # Pin VS 2022: windows-latest currently resolves to VS 18, which rejects
    # transitive Flutter plugins that still include <experimental/coroutine>.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Set up Flutter 3.41.6 (Dart 3.11 satisfies pubspec sdk ^3.11.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor (CI environment diagnostics)
        run: flutter doctor -v

      - name: Create env.dart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib/core/env | Out-Null
          @"
          abstract final class Env {
            static const String placeholder = '';
          }
          "@ | Set-Content -Path lib/core/env/env.dart -Encoding utf8

      - name: Install dependencies
        run: flutter pub get

      - name: Run live-sync and voice regression tests
        run: flutter test test/live_sync_contract_test.dart test/voice_command_parser_test.dart

      - name: Analyze runtime app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release (desktop voice enabled via dart-define)
        env:
          GIT_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $shortSha = git rev-parse --short HEAD
          $buildTime = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          flutter build windows --release `
            --dart-define=DESKTOP_VOICE_COMMAND=true `
            --dart-define=GIT_COMMIT="$shortSha" `
            --dart-define=BUILD_TIME="$buildTime"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile CounterSetup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          New-Item -ItemType Directory -Force -Path installer/windows/output | Out-Null
          & $iscc `
            "/DReleaseDir=$PWD\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\installer\windows\output" `
            "installer\windows\counter.iss"
          if (-not (Test-Path "installer\windows\output\CounterSetup.exe")) {
            throw "CounterSetup.exe was not produced"
          }
          Get-Item "installer\windows\output\CounterSetup.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload CounterSetup installer (primary)
        uses: actions/upload-artifact@v4
        with:
          name: CounterSetup
          path: installer/windows/output/CounterSetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to LIFE OS release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: life-os-windows-${{ github.run_number }}-${{ github.sha }}
          name: LIFE OS Windows — build ${{ github.run_number }}
          body: Windows installer built from the current shared LIFE OS runtime. Realtime reconnects reconcile authoritative PocketBase state so cross-device changes cannot remain stale after an SSE/network gap.
          artifacts: installer/windows/output/CounterSetup.exe
          allowUpdates: false
          replacesArtifacts: false
          makeLatest: true
          prerelease: false

      - name: Upload raw Release folder (debug fallback only)
        uses: actions/upload-artifact@v4
        with:
          name: counter-windows-release-debug-${{ github.run_number }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
