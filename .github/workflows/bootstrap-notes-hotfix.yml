name: Notes shared input parity hotfix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          def require(condition, label):
              if not condition:
                  raise SystemExit(label)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # One canonical library input widget. Search and quick-add must render
          # through this exact component so their outer and visual heights cannot drift.
          surface = Path('lib/features/notes/notes_glm_surface.dart')
          s = surface.read_text()
          require('class NotesGlmLibraryInput' not in s, 'shared library input already exists')
          marker = '/// GLM glass card surface for library note cards.\n'
          at = s.index(marker)
          shared = '''/// Canonical Notes library input used by both Search and quick-add.
/// The widget owns the exact outer height and decoration so the two controls
/// cannot diverge visually.
class NotesGlmLibraryInput extends StatelessWidget {
  const NotesGlmLibraryInput({
    super.key,
    required this.controller,
    required this.focusNode,
    required this.hintText,
    required this.textInputAction,
    this.textCapitalization = TextCapitalization.none,
    this.onChanged,
    this.onSubmitted,
    this.suffixIcon,
    this.showSearchIcon = true,
  });

  final TextEditingController controller;
  final FocusNode focusNode;
  final String hintText;
  final TextInputAction textInputAction;
  final TextCapitalization textCapitalization;
  final ValueChanged<String>? onChanged;
  final ValueChanged<String>? onSubmitted;
  final Widget? suffixIcon;
  final bool showSearchIcon;

  @override
  Widget build(BuildContext context) {
    final decoration = notesGlmSearchDecoration(
      context: context,
      hintText: hintText,
      suffixIcon: suffixIcon,
    );
    return SizedBox(
      height: kNotesLibraryControlHeight,
      child: TextField(
        controller: controller,
        focusNode: focusNode,
        textInputAction: textInputAction,
        textCapitalization: textCapitalization,
        onChanged: onChanged,
        onSubmitted: onSubmitted,
        style: TextStyle(
          fontSize: 14,
          color: Theme.of(context).colorScheme.onSurface,
        ),
        decoration: showSearchIcon
            ? decoration
            : decoration.copyWith(
                prefixIcon: const SizedBox.shrink(),
                prefixIconConstraints: const BoxConstraints.tightFor(
                  width: 0,
                  height: 0,
                ),
              ),
      ),
    );
  }
}

'''
          s = s[:at] + shared + s[at:]
          surface.write_text(s)

          # Search now uses the canonical widget instead of its own TextField.
          lists = Path('lib/features/lists/lists_view.dart')
          l = lists.read_text()
          old_search = '''          TextField(
            controller: searchController,
            focusNode: searchFocus,
            textInputAction: TextInputAction.search,
            textCapitalization: TextCapitalization.sentences,
            onChanged: onSearchChanged,
            style: TextStyle(fontSize: 14, color: scheme.onSurface),
            decoration: notesGlmSearchDecoration(
              context: context,
              hintText: t(locale, 'notes_v3_search_hint'),
              suffixIcon: searchQuery.trim().isNotEmpty
                  ? IconButton(
                      tooltip: t(locale, 'cancel'),
                      icon: const Icon(Icons.close_rounded, size: 18),
                      visualDensity: VisualDensity.compact,
                      splashRadius: 16,
                      onPressed: onClearSearch,
                    )
                  : null,
            ),
          ),
'''
          new_search = '''          NotesGlmLibraryInput(
            controller: searchController,
            focusNode: searchFocus,
            hintText: t(locale, 'notes_v3_search_hint'),
            textInputAction: TextInputAction.search,
            textCapitalization: TextCapitalization.sentences,
            onChanged: onSearchChanged,
            suffixIcon: searchQuery.trim().isNotEmpty
                ? IconButton(
                    tooltip: t(locale, 'cancel'),
                    icon: const Icon(Icons.close_rounded, size: 18),
                    visualDensity: VisualDensity.compact,
                    splashRadius: 16,
                    onPressed: onClearSearch,
                  )
                : null,
          ),
'''
          l = replace_once(l, old_search, new_search, 'replace search with shared input')
          lists.write_text(l)

          # Quick-add uses the same canonical widget. The action is a 48x48
          # black circle: exactly the input's outer height, no separate sizing path.
          shell = Path('lib/features/notes/widgets/notes_library_production_shell.dart')
          q = shell.read_text()
          start = q.index('class NotesGlmInlineAddRow extends StatelessWidget')
          build_start = q.index('  @override\n  Widget build(BuildContext context) {', start)
          class_end = q.index('\n}', build_start) + 2
          new_build = '''  @override
  Widget build(BuildContext context) {
    return Row(
      crossAxisAlignment: CrossAxisAlignment.center,
      children: [
        Expanded(
          child: NotesGlmLibraryInput(
            controller: controller,
            focusNode: focusNode,
            hintText: t(locale, 'input_placeholder_list'),
            textInputAction: TextInputAction.done,
            showSearchIcon: false,
            onSubmitted: (_) => onSubmit(),
          ),
        ),
        const SizedBox(width: 8),
        SizedBox.square(
          dimension: kNotesLibraryControlHeight,
          child: Tooltip(
            message: t(locale, 'add'),
            child: Material(
              color: Colors.black,
              shape: const CircleBorder(),
              clipBehavior: Clip.antiAlias,
              child: InkWell(
                onTap: onSubmit,
                customBorder: const CircleBorder(),
                child: const Center(
                  child: Icon(
                    Icons.add_rounded,
                    size: 22,
                    color: Colors.white,
                  ),
                ),
              ),
            ),
          ),
        ),
      ],
    );
  }'''
          q = q[:build_start] + new_build + q[class_end:]
          shell.write_text(q)

          final_surface = surface.read_text()
          final_lists = lists.read_text()
          final_shell = shell.read_text()
          require('class NotesGlmLibraryInput' in final_surface, 'canonical input missing')
          require(final_lists.count('NotesGlmLibraryInput(') >= 1, 'search not on canonical input')
          require(final_shell.count('NotesGlmLibraryInput(') >= 1, 'quick-add not on canonical input')
          require('dimension: kNotesLibraryControlHeight' in final_shell, 'plus height not tied to input height')
          require('color: Colors.black' in final_shell, 'plus is not black')
          require('shape: const CircleBorder()' in final_shell, 'plus is not circular')
          require('borderRadius: BorderRadius.circular(12)' not in final_shell.split('class NotesGlmInlineAddRow', 1)[1], 'legacy rounded-square plus remains')
          PY