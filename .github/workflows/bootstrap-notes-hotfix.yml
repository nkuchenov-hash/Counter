name: Notes interaction UX fix wrapper

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          previous_wrapper = '5194f5a563f13c47c37cb3c15fd05ae77647227a'
          subprocess.run(
              ['git', '-C', 'automation', 'fetch', 'origin', previous_wrapper, '--depth=1'],
              check=True,
          )
          source = subprocess.check_output(
              [
                  'git', '-C', 'automation', 'show',
                  f'{previous_wrapper}:.github/workflows/bootstrap-notes-hotfix.yml',
              ],
              text=True,
          ).splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          prior_body = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source[start:end]
          ) + '\n'
          exec(compile(prior_body, '<previous-notes-wrapper>', 'exec'))

          # Keep exactly one onOpenMenu callback in every NoteCard fixture call.
          for fixture_name in [
              'test/notes/fixtures/notes_glm_library_parity_fixture.dart',
              'test/notes/fixtures/notes_production_library_capture.dart',
          ]:
              path = Path(fixture_name)
              lines = path.read_text().splitlines()
              out = []
              in_card = False
              depth = 0
              seen_open_menu = False
              for line in lines:
                  if not in_card and 'NoteCard(' in line:
                      in_card = True
                      depth = 0
                      seen_open_menu = False
                  if in_card and 'onOpenMenu:' in line:
                      if seen_open_menu:
                          continue
                      seen_open_menu = True
                  out.append(line)
                  if in_card:
                      depth += line.count('(') - line.count(')')
                      if depth <= 0:
                          in_card = False
                          depth = 0
                          seen_open_menu = False
              path.write_text('\n'.join(out) + '\n')
          PY
