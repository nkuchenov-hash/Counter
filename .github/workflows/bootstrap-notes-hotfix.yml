name: Restore Notes checkbox layout parity

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/notes/widgets/note_card.dart')
          text = path.read_text()
          start = text.find('class _LargeDoneCheck extends StatelessWidget {')
          end = text.find('\nclass _CategoryTile extends StatelessWidget {', start)
          if start < 0 or end < 0:
              raise SystemExit('Large Notes checkbox class not found')

          replacement = '''class _LargeDoneCheck extends StatelessWidget {
  const _LargeDoneCheck({
    required this.isDone,
    required this.onToggle,
  });

  final bool isDone;
  final VoidCallback onToggle;

  @override
  Widget build(BuildContext context) {
    final scheme = Theme.of(context).colorScheme;
    return InkWell(
      onTap: onToggle,
      borderRadius: BorderRadius.circular(8),
      child: Container(
        width: kNotesLargeCheckSize,
        height: kNotesLargeCheckSize,
        decoration: BoxDecoration(
          borderRadius: BorderRadius.circular(8),
          border: Border.all(
            color: isDone
                ? scheme.primary
                : scheme.outlineVariant.withValues(alpha: 0.7),
            width: 2,
          ),
          color: isDone ? scheme.primary : Colors.transparent,
        ),
        child: isDone
            ? const Icon(Icons.check_rounded, size: 20, color: Colors.white)
            : null,
      ),
    );
  }
}
'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
