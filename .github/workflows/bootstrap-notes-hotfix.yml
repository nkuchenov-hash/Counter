name: Notes quick-add vertical alignment hotfix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          surface = Path('lib/features/notes/notes_glm_surface.dart')
          s = surface.read_text()
          if 'const double kNotesLibraryControlHeight = 40;' not in s:
              raise SystemExit('canonical 40px Notes control missing')
          if 'class NotesGlmLibraryInput extends StatefulWidget' not in s:
              raise SystemExit('canonical Notes input missing')

          # Force the InputDecorator itself to the same exact 40px box as the
          # outer control. Without this, the no-icon quick-add variant can keep
          # a taller intrinsic text layout and paint its hint above visual center.
          s = replace_once(
              s,
              '''decoration: InputDecoration(\n  hintText: widget.hintText,''',
              '''decoration: InputDecoration(\n  constraints: const BoxConstraints.tightFor(\n    height: kNotesLibraryControlHeight,\n  ),\n  hintText: widget.hintText,''',
              'tight input decoration height',
          )

          # Search already gets a 40px prefix-icon slot, which also stabilizes
          # vertical layout. Give quick-add the same 40px vertical slot but zero
          # horizontal width so its text starts at the same x-position as before.
          s = replace_once(
              s,
              '''  prefixIcon: widget.showSearchIcon\n      ? Icon(Icons.search_rounded, size: 18, color: meta)\n      : null,\n  prefixIconConstraints: widget.showSearchIcon\n      ? const BoxConstraints.tightFor(\n          width: kNotesLibraryControlHeight,\n          height: kNotesLibraryControlHeight,\n        )\n      : null,''',
              '''  prefixIcon: widget.showSearchIcon\n      ? Icon(Icons.search_rounded, size: 18, color: meta)\n      : const SizedBox.shrink(),\n  prefixIconConstraints: BoxConstraints.tightFor(\n    width: widget.showSearchIcon ? kNotesLibraryControlHeight : 0,\n    height: kNotesLibraryControlHeight,\n  ),''',
              'quick-add vertical prefix slot',
          )

          surface.write_text(s)
          final = surface.read_text()
          if 'height: kNotesLibraryControlHeight,\n  ),\n  hintText: widget.hintText' not in final:
              raise SystemExit('input decoration is not locked to 40px')
          if 'width: widget.showSearchIcon ? kNotesLibraryControlHeight : 0' not in final:
              raise SystemExit('quick-add zero-width 40px vertical slot missing')
          if 'textAlignVertical: TextAlignVertical.center' not in final:
              raise SystemExit('center text alignment missing')
          PY
