name: Notes interaction UX fix wrapper

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source_commit = '23ada4780721817b87bf72a292d80125b1cc2c85'
          subprocess.run(
              ['git', '-C', 'automation', 'fetch', 'origin', source_commit, '--depth=1'],
              check=True,
          )
          original = subprocess.check_output(
              [
                  'git', '-C', 'automation', 'show',
                  f'{source_commit}:.github/workflows/bootstrap-notes-hotfix.yml',
              ],
              text=True,
          ).splitlines()
          start = next(i for i, line in enumerate(original) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(original)) if original[i].strip() == 'PY')
          lines = [
              line[10:] if line.startswith('          ') else line
              for line in original[start:end]
          ]
          script = '\n'.join(lines) + '\n'

          replace_start = script.find("old_body_args = '''")
          replace_end = script.find(
              "text = text.replace('    required this.showExport,\\n', '', 1)",
              replace_start,
          )
          if replace_start < 0 or replace_end < 0:
              raise SystemExit('NotesLibraryBody patch-definition anchors not found')
          robust_body_patch = '''body_anchor = text.rfind('                    : NotesLibraryBody(')
          body_args_start = text.find(
              '                        checkboxesOn: _notesCheckboxesOn,',
              body_anchor,
          )
          body_args_end = text.find(
              '                        onRefresh: _reload,',
              body_args_start,
          )
          if body_anchor < 0 or body_args_start < 0 or body_args_end < 0:
              raise SystemExit('NotesLibraryBody real argument range not found')
          new_body_args = ''' + "'''" + '''                        checkboxesOn: _notesCheckboxesOn,
                        selectionMode: _listsSelectMode,
                        selectedKeys: _selectedListKeys,
                        itemKey: _listKey,
                        onToggleSelection: (task) =>
                            _toggleListKey(_listKey(task)),
                        onTap: _openNoteEditor,
                        onLongPress: (_) {},
                        onOpenMenu: (anchorCenter, task) =>
                            _showListsRadialMenuAt(
                              anchorCenter,
                              task,
                              _listKey(task),
                            ),
''' + "'''" + '''
          text = text[:body_args_start] + new_body_args + text[body_args_end:]

          '''
          script = script[:replace_start] + robust_body_patch + script[replace_end:]
          exec(compile(script, '<notes-interaction-ux>', 'exec'))
          PY
