                ),
              ],
            ),
          ),
      ],
      child: Material(
        color: NotesFigmaTokens.glassFill(context),
        elevation: 1,
        shadowColor: Colors.black.withValues(alpha: 0.08),
        shape: const CircleBorder(),
        child: SizedBox.square(
          dimension: 40,
          child: Icon(
            Icons.more_horiz_rounded,
            size: 19,
            color: NotesFigmaTokens.iconSecondary(context),
          ),
        ),
      ),
    );
  }
}

