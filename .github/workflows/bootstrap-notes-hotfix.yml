name: Urgent Notes interaction fixes

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          def require(condition, label):
              if not condition:
                  raise SystemExit(label)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          page = Path('lib/features/notes/note_editor_page.dart')
          text = page.read_text()

          if "package:flutter/gestures.dart" not in text:
              text = replace_once(
                  text,
                  "import 'package:flutter/material.dart';\n",
                  "import 'package:flutter/material.dart';\nimport 'package:flutter/gestures.dart';\n",
                  'gestures import',
              )

          if 'kSecondaryMouseButton' not in text:
              text = replace_once(
                  text,
                  '''  void _handleEditorBackgroundPointer(PointerDownEvent event) {
    if (_blockSelectionMode) return;
''',
                  '''  void _handleEditorBackgroundPointer(PointerDownEvent event) {
    if (_blockSelectionMode) return;
    if ((event.buttons & kSecondaryMouseButton) != 0) return;
''',
                  'secondary click preservation',
              )

          old_empty = '''    if (plain.isEmpty) {
      _NotesStructuredClipboard.plainText = null;
      _NotesStructuredClipboard.blocks = const <NoteBlock>[];
      return;
    }
'''
          capture_at = text.index('  void _captureStructuredSelection(SelectedContent? selected) {')
          capture_end = text.index('  List<NoteBlock> _inferStructuredSelectionBlocks', capture_at)
          capture = text[capture_at:capture_end]
          if old_empty in capture:
              capture = capture.replace(old_empty, '    if (plain.isEmpty) return;\n', 1)
              text = text[:capture_at] + capture + text[capture_end:]

          if '_deleteCurrentStructuredSelection' not in text:
              marker = '  Future<void> _pasteClipboardIntoBlock(\n'
              at = text.index(marker)
              helpers = '''  bool _deleteCurrentStructuredSelection() {
    if (_editingBlockId != null || _blockSelectionMode) return false;
    final slices = _NotesStructuredClipboard.blocks;
    if (slices.length < 2) return false;

    final firstSource = _editor.blockById(slices.first.id);
    final lastSource = _editor.blockById(slices.last.id);
    if (firstSource == null || lastSource == null) return false;

    final firstNeedle = slices.first.effectiveText;
    final lastNeedle = slices.last.effectiveText;
    var firstStart = firstSource.effectiveText.length - firstNeedle.length;
    if (firstStart < 0 ||
        !firstSource.effectiveText.endsWith(firstNeedle)) {
      firstStart = firstSource.effectiveText.indexOf(firstNeedle);
    }
    if (firstStart < 0) return false;

    var lastEnd = lastNeedle.length;
    if (!lastSource.effectiveText.startsWith(lastNeedle)) {
      final lastStart = lastSource.effectiveText.indexOf(lastNeedle);
      if (lastStart < 0) return false;
      lastEnd = lastStart + lastNeedle.length;
    }

    final prefix = firstSource.effectiveText.substring(0, firstStart);
    final suffix = lastSource.effectiveText.substring(lastEnd);
    _editor.applyTextInput(
      firstSource.id,
      '$prefix$suffix',
      TextSelection.collapsed(offset: prefix.length),
    );
    for (final slice in slices.skip(1).toList().reversed) {
      _editor.deleteBlock(slice.id);
    }

    _NotesStructuredClipboard.plainText = null;
    _NotesStructuredClipboard.blocks = const <NoteBlock>[];
    _scheduleSave();
    setState(_syncEditorsWithDocument);
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted || _editor.blockById(firstSource.id) == null) return;
      _requestFocus(
        firstSource.id,
        TextSelection.collapsed(offset: prefix.length),
      );
    });
    return true;
  }

  KeyEventResult _onSelectionAreaKeyEvent(FocusNode node, KeyEvent event) {
    if (event is! KeyDownEvent) return KeyEventResult.ignored;
    if (event.logicalKey != LogicalKeyboardKey.delete &&
        event.logicalKey != LogicalKeyboardKey.backspace) {
      return KeyEventResult.ignored;
    }
    return _deleteCurrentStructuredSelection()
        ? KeyEventResult.handled
        : KeyEventResult.ignored;
  }

'''
              text = text[:at] + helpers + text[at:]

          if 'onKeyEvent: _onSelectionAreaKeyEvent' not in text:
              start = text.index('        child: _blockSelectionMode')
              end_marker = '\n      ),\n    );\n  }\n}'
              end = text.index(end_marker, start)
              new_branch = '''        child: _blockSelectionMode
            ? _buildReorderableBlockList()
            : Focus(
                canRequestFocus: false,
                onKeyEvent: _onSelectionAreaKeyEvent,
                child: Actions(
                  actions: <Type, Action<Intent>>{
                    CopySelectionTextIntent: _NotesStructuredCopyAction(
                      onCopy: _copyCurrentStructuredSelection,
                    ),
                  },
                  child: SelectionArea(
                    contextMenuBuilder: _buildSelectionContextMenu,
                    onSelectionChanged: _captureStructuredSelection,
                    child: _buildReorderableBlockList(),
                  ),
                ),
              ),'''
              text = text[:start] + new_branch + text[end:]

          if 'final blockContent = !editable && !_blockSelectionMode' not in text:
              old_content = '''    final selectedForBulk = _selectedBlockIds.contains(block.id);
    final content = Padding(
      key: ValueKey<String>(block.id),
      padding: const EdgeInsets.only(right: 36),
      child: item,
    );
'''
              new_content = '''    final selectedForBulk = _selectedBlockIds.contains(block.id);
    final blockContent = !editable && !_blockSelectionMode
        ? Column(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            mainAxisSize: MainAxisSize.min,
            children: [
              item,
              MouseRegion(
                cursor: SystemMouseCursors.text,
                child: GestureDetector(
                  behavior: HitTestBehavior.opaque,
                  onTap: () => _focusOrInsertParagraphAfter(block.id),
                  child: const SizedBox(height: 24),
                ),
              ),
            ],
          )
        : item;
    final content = Padding(
      key: ValueKey<String>(block.id),
      padding: const EdgeInsets.only(right: 36),
      child: blockContent,
    );
'''
              text = replace_once(text, old_content, new_content, 'post-object caret target')
          page.write_text(text)

          shell = Path('lib/features/notes/widgets/notes_library_production_shell.dart')
          s = shell.read_text()
          class_at = s.index('class NotesGlmInlineAddRow')
          tail = s[class_at:]
          if 'decoration: notesGlmSearchDecoration(' not in tail:
              start = s.index('    final theme = Theme.of(context);', class_at)
              end = s.index('\n\n    return Row(', start)
              s = s[:start] + '    final scheme = Theme.of(context).colorScheme;' + s[end:]
              style_at = s.index('style: TextStyle(fontSize: 15', class_at)
              s = s[:style_at] + s[style_at:].replace(
                  'style: TextStyle(fontSize: 15',
                  'style: TextStyle(fontSize: 14',
                  1,
              )
              decoration_start = s.index('              decoration: InputDecoration(', class_at)
              submitted_at = s.index('              onSubmitted: (_) => onSubmit(),', decoration_start)
              replacement = '''              decoration: notesGlmSearchDecoration(
                context: context,
                hintText: t(locale, 'input_placeholder_list'),
              ).copyWith(
                prefixIcon: null,
                prefixIconConstraints: const BoxConstraints(
                  minWidth: 0,
                  minHeight: 0,
                ),
              ),
'''
              s = s[:decoration_start] + replacement + s[submitted_at:]
          shell.write_text(s)

          final_page = page.read_text()
          final_shell = shell.read_text()
          require('kSecondaryMouseButton' in final_page, 'right click guard missing')
          require('_deleteCurrentStructuredSelection' in final_page, 'cross-block delete missing')
          require('onKeyEvent: _onSelectionAreaKeyEvent' in final_page, 'delete key route missing')
          require('final blockContent = !editable && !_blockSelectionMode' in final_page, 'object caret target missing')
          require('child: const SizedBox(height: 24)' in final_page, 'object caret hit area missing')
          require('decoration: notesGlmSearchDecoration(' in final_shell, 'inline add/search decoration parity missing')
          require('dimension: kNotesLibraryControlHeight' in final_shell, 'inline add button height missing')
          PY