name: Notes undo selection and add-row hotfix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def require(condition, label):
              if not condition:
                  raise SystemExit(label)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          def replace_section(text, start_marker, end_marker, transform):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + transform(text[start:end]) + text[end:]

          # Exact Add/Search control parity: same 48px height, same field
          # decoration, no inherited search icon, no giant circular +.
          shell = Path('lib/features/notes/widgets/notes_library_production_shell.dart')
          s = shell.read_text()
          s, n = re.subn(r'prefixIcon:\s*null,', 'prefixIcon: const SizedBox.shrink(),', s, count=1)
          require(n == 1, f'inline add prefix icon: expected 1 match, got {n}')
          s, n = re.subn(
              r'prefixIconConstraints:\s*const BoxConstraints\(\s*minWidth:\s*0,\s*minHeight:\s*0,\s*\),',
              '''prefixIconConstraints: const BoxConstraints.tightFor(
        width: 0,
        height: 0,
      ),''',
              s,
              count=1,
          )
          require(n == 1, f'inline add prefix constraints: expected 1 match, got {n}')
          class_at = s.index('class NotesGlmInlineAddRow')
          button_start = s.index('        SizedBox.square(', class_at)
          row_end = s.index('\n      ],\n    );', button_start)
          new_button = '''        SizedBox(
          width: kNotesLibraryControlHeight,
          height: kNotesLibraryControlHeight,
          child: Tooltip(
            message: t(locale, 'add'),
            child: Material(
              color: scheme.primary,
              borderRadius: BorderRadius.circular(12),
              clipBehavior: Clip.antiAlias,
              child: InkWell(
                onTap: onSubmit,
                borderRadius: BorderRadius.circular(12),
                child: Center(
                  child: Icon(
                    Icons.add_rounded,
                    size: 22,
                    color: scheme.onPrimary,
                  ),
                ),
              ),
            ),
          ),
        ),'''
          s = s[:button_start] + new_button + s[row_end:]
          shell.write_text(s)

          # Document-level undo history.
          controller = Path('lib/features/notes/notes_editor_document_controller.dart')
          c = controller.read_text()
          c = replace_once(
              c,
              '  NoteDocument _document;\n  String? activeBlockId;\n',
              '  NoteDocument _document;\n  final List<NoteDocument> _undoStack = <NoteDocument>[];\n  String? activeBlockId;\n',
              'undo stack field',
          )
          assignment = '_document = _document.copyWith(blocks: nextBlocks);'
          count = c.count(assignment)
          require(count >= 5, f'document mutations: expected >=5, got {count}')
          c = c.replace(assignment, '_commitDocument(_document.copyWith(blocks: nextBlocks));')
          marker = '  void _replaceBlock(NoteBlock replacement) {\n'
          at = c.index(marker)
          require('NotesEditorMutation undo()' not in c, 'undo unexpectedly already present')
          helpers = '''  bool get canUndo => _undoStack.isNotEmpty;

  NotesEditorMutation undo() {
    if (_undoStack.isEmpty) return const NotesEditorMutation();
    _document = _undoStack.removeLast();
    final visible = visibleBlocks;
    if (visible.isEmpty) {
      activeBlockId = null;
      activeSelection = null;
      return const NotesEditorMutation(changed: true, requiresRebuild: true);
    }
    final previousActiveId = activeBlockId;
    final restoredId = previousActiveId != null && blockById(previousActiveId) != null
        ? previousActiveId
        : visible.last.id;
    activeBlockId = restoredId;
    final restored = blockById(restoredId);
    if (restored != null && isEditableText(restored.type)) {
      final offset = (activeSelection?.extentOffset ?? restored.effectiveText.length)
          .clamp(0, restored.effectiveText.length)
          .toInt();
      activeSelection = TextSelection.collapsed(offset: offset);
      return NotesEditorMutation(
        changed: true,
        requiresRebuild: true,
        focusBlockId: restoredId,
        selection: activeSelection,
      );
    }
    activeSelection = null;
    return const NotesEditorMutation(changed: true, requiresRebuild: true);
  }

  void _commitDocument(NoteDocument next) {
    _undoStack.add(_document);
    if (_undoStack.length > 100) _undoStack.removeAt(0);
    _document = next;
  }

'''
          c = c[:at] + helpers + c[at:]
          controller.write_text(c)

          # Header Undo button next to the three-dot menu. The callback is
          # optional for existing test/preview harnesses; production supplies it.
          screen = Path('lib/features/notes/widgets/notes_editor_screen.dart')
          r = screen.read_text()

          def patch_screen_public(sec):
              sec = replace_once(sec, '    required this.onDelete,\n    this.bulkSelectionMode', '    required this.onDelete,\n    this.onUndo,\n    this.bulkSelectionMode', 'screen ctor undo')
              sec = replace_once(sec, '  final VoidCallback onDelete;\n  final bool bulkSelectionMode;', '  final VoidCallback onDelete;\n  final VoidCallback? onUndo;\n  final bool bulkSelectionMode;', 'screen field undo')
              sec = replace_once(sec, '              onDelete: onDelete,\n              bulkSelectionMode:', '              onDelete: onDelete,\n              onUndo: onUndo,\n              bulkSelectionMode:', 'screen pass undo')
              return sec
          r = replace_section(r, 'class NotesEditorScreen extends StatelessWidget {', 'class _NotesEditorRail extends StatelessWidget {', patch_screen_public)

          def patch_rail(sec):
              sec = replace_once(sec, '    required this.onDelete,\n    required this.bulkSelectionMode,', '    required this.onDelete,\n    this.onUndo,\n    required this.bulkSelectionMode,', 'rail ctor undo')
              sec = replace_once(sec, '  final VoidCallback? onDelete;\n  final bool bulkSelectionMode;', '  final VoidCallback? onDelete;\n  final VoidCallback? onUndo;\n  final bool bulkSelectionMode;', 'rail field undo')
              nav_at = sec.index('_NotesNavigationHeader(')
              tail = sec[nav_at:]
              tail = replace_once(tail, '                  onDelete: onDelete,\n', '                  onDelete: onDelete,\n                  onUndo: onUndo,\n', 'rail pass undo')
              return sec[:nav_at] + tail
          r = replace_section(r, 'class _NotesEditorRail extends StatelessWidget {', 'class _NotesEditorSurface extends StatelessWidget {', patch_rail)

          def patch_header(sec):
              sec = replace_once(sec, '    required this.onDelete,\n    required this.bulkSelectionMode,', '    required this.onDelete,\n    this.onUndo,\n    required this.bulkSelectionMode,', 'header ctor undo')
              sec = replace_once(sec, '  final VoidCallback? onDelete;\n  final bool bulkSelectionMode;', '  final VoidCallback? onDelete;\n  final VoidCallback? onUndo;\n  final bool bulkSelectionMode;', 'header field undo')
              old = '''if (bulkSelectionMode && onExitBulkSelection != null)
  _NotesBulkDoneAction(onPressed: onExitBulkSelection!)
else
  _NotesHeaderMoreMenu(
    pinned: pinned,
    onTogglePinned: onTogglePinned,
    onDelete: onDelete,
  ),'''
              new = '''if (bulkSelectionMode && onExitBulkSelection != null)
  _NotesBulkDoneAction(onPressed: onExitBulkSelection!)
else
  Row(
    mainAxisSize: MainAxisSize.min,
    children: [
      if (onUndo != null) ...[
        _NotesHeaderAction(
          icon: Icons.undo_rounded,
          tooltip: 'Undo',
          onPressed: onUndo!,
        ),
        const SizedBox(width: 8),
      ],
      _NotesHeaderMoreMenu(
        pinned: pinned,
        onTogglePinned: onTogglePinned,
        onDelete: onDelete,
      ),
    ],
  ),'''
              return replace_once(sec, old, new, 'undo next to more')
          r = replace_section(r, 'class _NotesNavigationHeader extends StatelessWidget {', 'class _NotesBulkDoneAction extends StatelessWidget {', patch_header)
          screen.write_text(r)

          # Right-click guard: stop editable child blocks from taking focus and
          # collapsing an already established cross-block SelectionArea range.
          page = Path('lib/features/notes/note_editor_page.dart')
          p = page.read_text()
          p = replace_once(
              p,
              '  final Map<String, GlobalKey> _blockItemKeys = <String, GlobalKey>{};\n  bool _dirty = false;\n',
              '  final Map<String, GlobalKey> _blockItemKeys = <String, GlobalKey>{};\n  Timer? _secondarySelectionGuardTimer;\n  bool _secondarySelectionGuardActive = false;\n  bool _dirty = false;\n',
              'secondary guard fields',
          )
          p = replace_once(p, '  void dispose() {\n    if (_dirty && !widget.parityPreview) {', '  void dispose() {\n    _secondarySelectionGuardTimer?.cancel();\n    if (_dirty && !widget.parityPreview) {', 'secondary guard dispose')
          p = replace_once(p, "      final node = FocusNode(debugLabel: 'notes-block-${block.id}');\n", "      final node = FocusNode(debugLabel: 'notes-block-${block.id}');\n      node.canRequestFocus = !_secondarySelectionGuardActive;\n", 'focus node guard')
          p = replace_once(
              p,
              "  void _captureStructuredSelection(SelectedContent? selected) {\n    final plain = selected?.plainText ?? '';\n",
              "  void _captureStructuredSelection(SelectedContent? selected) {\n    if (_secondarySelectionGuardActive &&\n        _NotesStructuredClipboard.blocks.length >= 2) {\n      return;\n    }\n    final plain = selected?.plainText ?? '';\n",
              'preserve selection callback',
          )
          guard_at = p.index('  void _handleEditorBackgroundPointer(PointerDownEvent event) {\n')
          require('_beginSecondarySelectionGuard' not in p, 'secondary guard unexpectedly already present')
          guard = '''  void _beginSecondarySelectionGuard(PointerDownEvent event) {
    if ((event.buttons & kSecondaryMouseButton) == 0 ||
        _NotesStructuredClipboard.blocks.length < 2) {
      return;
    }
    _secondarySelectionGuardTimer?.cancel();
    _secondarySelectionGuardActive = true;
    for (final node in _focusNodes.values) {
      node.canRequestFocus = false;
    }
  }

  void _scheduleSecondarySelectionGuardRelease(PointerEvent event) {
    if (!_secondarySelectionGuardActive) return;
    _secondarySelectionGuardTimer?.cancel();
    _secondarySelectionGuardTimer = Timer(const Duration(milliseconds: 350), () {
      if (!mounted) return;
      _secondarySelectionGuardActive = false;
      for (final node in _focusNodes.values) {
        node.canRequestFocus = true;
      }
    });
  }

  void _handleEditorPointerDown(PointerDownEvent event) {
    _beginSecondarySelectionGuard(event);
    _handleEditorBackgroundPointer(event);
  }

'''
          p = p[:guard_at] + guard + p[guard_at:]

          undo_at = p.index('  void _togglePinned() {\n')
          undo_method = '''  void _undoLastEdit() {
    final mutation = _editor.undo();
    if (!mutation.changed) return;
    _NotesStructuredClipboard.plainText = null;
    _NotesStructuredClipboard.blocks = const <NoteBlock>[];
    _selectedBlockIds.clear();
    _blockSelectionMode = false;
    _editingBlockId = null;
    _applyMutation(mutation);
  }

'''
          p = p[:undo_at] + undo_method + p[undo_at:]
          p = replace_once(p, '      onDelete: _deleteCurrentNote,\n      bulkSelectionMode:', '      onDelete: _deleteCurrentNote,\n      onUndo: _undoLastEdit,\n      bulkSelectionMode:', 'wire undo')
          p = replace_once(p, '        onPointerDown: _handleEditorBackgroundPointer,\n', '        onPointerDown: _handleEditorPointerDown,\n        onPointerUp: _scheduleSecondarySelectionGuardRelease,\n        onPointerCancel: _scheduleSecondarySelectionGuardRelease,\n', 'listener secondary guard')
          page.write_text(p)

          final_shell = shell.read_text()
          final_controller = controller.read_text()
          final_screen = screen.read_text()
          final_page = page.read_text()
          require('prefixIcon: const SizedBox.shrink()' in final_shell, 'add still has search icon')
          require('width: kNotesLibraryControlHeight' in final_shell and 'height: kNotesLibraryControlHeight' in final_shell, 'add button not exact height')
          require('shape: const CircleBorder()' not in final_shell.split('class NotesGlmInlineAddRow', 1)[1], 'add button still circular')
          require('NotesEditorMutation undo()' in final_controller, 'undo history missing')
          require('icon: Icons.undo_rounded' in final_screen, 'undo button missing')
          require('onUndo: _undoLastEdit' in final_page, 'undo wiring missing')
          require('_beginSecondarySelectionGuard' in final_page, 'right-click guard missing')
          require('onPointerUp: _scheduleSecondarySelectionGuardRelease' in final_page, 'right-click release missing')
          PY