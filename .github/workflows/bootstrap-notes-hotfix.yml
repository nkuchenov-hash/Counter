name: Notes structured system clipboard fix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          def require(condition, label):
              if not condition:
                  raise SystemExit(label)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          page = Path('lib/features/notes/note_editor_page.dart')
          text = page.read_text()

          clipboard_class = '''class _NotesStructuredClipboard {
  static String? plainText;
  static List<NoteBlock> blocks = const <NoteBlock>[];
}
'''
          copy_action = '''class _NotesStructuredCopyAction extends Action<CopySelectionTextIntent> {
  _NotesStructuredCopyAction({required this.onCopy});

  final bool Function() onCopy;

  @override
  Object? invoke(CopySelectionTextIntent intent) {
    if (onCopy()) return null;
    return callingAction?.invoke(intent);
  }
}
'''
          if '_NotesStructuredCopyAction' not in text:
              text = replace_once(
                  text,
                  clipboard_class,
                  clipboard_class + '\n' + copy_action,
                  'copy action class',
              )

          paste_marker = '  Future<void> _pasteClipboardIntoBlock(\n'
          at = text.index(paste_marker)
          copy_helpers = r'''  String _structuredClipboardExportText(List<NoteBlock> blocks) {
    final lines = <String>[];
    var numberedOrdinal = 0;
    var previousWasNumbered = false;
    for (final block in blocks) {
      final value = block.effectiveText;
      if (block.type == NoteBlockType.numberedList) {
        numberedOrdinal = previousWasNumbered ? numberedOrdinal + 1 : 1;
        previousWasNumbered = true;
      } else {
        numberedOrdinal = 0;
        previousWasNumbered = false;
      }
      switch (block.type) {
        case NoteBlockType.checklist:
          lines.add('- [${block.checked ? 'x' : ' '}] $value');
        case NoteBlockType.bulletedList:
          lines.add('- $value');
        case NoteBlockType.numberedList:
          lines.add('$numberedOrdinal. $value');
        case NoteBlockType.heading:
          final level = block.level.clamp(1, 3).toInt();
          final marker = List<String>.filled(level, '#').join();
          lines.add('$marker $value');
        case NoteBlockType.quote:
          lines.add('> $value');
        default:
          lines.add(value);
      }
    }
    return lines.join('\n');
  }

  bool _copyCurrentStructuredSelection() {
    if (_editingBlockId != null || _blockSelectionMode) return false;
    final blocks = _NotesStructuredClipboard.blocks;
    if (blocks.isEmpty) return false;
    final export = _structuredClipboardExportText(blocks);
    if (export.isEmpty) return false;
    _NotesStructuredClipboard.plainText = export;
    unawaited(Clipboard.setData(ClipboardData(text: export)));
    return true;
  }

  Widget _buildSelectionContextMenu(
    BuildContext context,
    SelectableRegionState selectableRegionState,
  ) {
    final items = <ContextMenuButtonItem>[
      for (final item in selectableRegionState.contextMenuButtonItems)
        if (item.type == ContextMenuButtonType.copy)
          item.copyWith(
            onPressed: () {
              if (_copyCurrentStructuredSelection()) {
                selectableRegionState.hideToolbar();
              } else {
                item.onPressed?.call();
              }
            },
          )
        else
          item,
    ];
    return AdaptiveTextSelectionToolbar.buttonItems(
      anchors: selectableRegionState.contextMenuAnchors,
      buttonItems: items,
    );
  }

'''
          if '_structuredClipboardExportText' not in text:
              text = text[:at] + copy_helpers + text[at:]

          capture_start = text.index('  void _captureStructuredSelection(SelectedContent? selected) {')
          capture_end = text.index('  List<NoteBlock> _inferStructuredSelectionBlocks', capture_start)
          capture_replacement = '''  void _captureStructuredSelection(SelectedContent? selected) {
    final plain = selected?.plainText ?? '';
    if (plain.isEmpty) {
      _NotesStructuredClipboard.plainText = null;
      _NotesStructuredClipboard.blocks = const <NoteBlock>[];
      return;
    }
    final blocks = _inferStructuredSelectionBlocks(plain);
    if (blocks.isEmpty) {
      _NotesStructuredClipboard.plainText = null;
      _NotesStructuredClipboard.blocks = const <NoteBlock>[];
      return;
    }
    final frozen = List<NoteBlock>.unmodifiable(blocks);
    _NotesStructuredClipboard.blocks = frozen;
    _NotesStructuredClipboard.plainText =
        _structuredClipboardExportText(frozen);
  }

'''
          text = text[:capture_start] + capture_replacement + text[capture_end:]

          old_selection = '''            : SelectionArea(
                onSelectionChanged: _captureStructuredSelection,
                child: _buildReorderableBlockList(),
              ),
'''
          new_selection = '''            : Actions(
                actions: <Type, Action<Intent>>{
                  CopySelectionTextIntent: _NotesStructuredCopyAction(
                    onCopy: _copyCurrentStructuredSelection,
                  ),
                },
                child: SelectionArea(
                  contextMenuBuilder: _buildSelectionContextMenu,
                  onSelectionChanged: _captureStructuredSelection,
                  child: _buildReorderableBlockList(),
                ),
              ),
'''
          if 'contextMenuBuilder: _buildSelectionContextMenu' not in text:
              text = replace_once(
                  text,
                  old_selection,
                  new_selection,
                  'selection copy override',
              )

          page.write_text(text)

          final = page.read_text()
          require('class _NotesStructuredCopyAction extends Action<CopySelectionTextIntent>' in final, 'copy action missing')
          require("lines.add('- [${block.checked ? 'x' : ' '}] $value');" in final, 'checklist export missing')
          require("return lines.join('\\n');" in final, 'line separators missing')
          require('CopySelectionTextIntent: _NotesStructuredCopyAction(' in final, 'keyboard copy override missing')
          require('contextMenuBuilder: _buildSelectionContextMenu' in final, 'copy menu override missing')
          require('_NotesStructuredClipboard.blocks = const <NoteBlock>[];' in final, 'stale selection cleanup missing')
          PY