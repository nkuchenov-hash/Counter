name: Notes independent exact 48px controls hotfix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          def require(condition, label):
              if not condition:
                  raise SystemExit(label)

          # Remove the shared input widget entirely. Search and quick-add are
          # intentionally independent controls with explicit 48px visual frames.
          surface = Path('lib/features/notes/notes_glm_surface.dart')
          s = surface.read_text()
          shared_start = s.index('class NotesGlmLibraryInput extends StatelessWidget {')
          shared_end = s.index('/// GLM glass card surface for library note cards.', shared_start)
          s = s[:shared_start] + s[shared_end:]
          surface.write_text(s)

          # Search field: explicit 48px outer VISUAL frame.
          lists = Path('lib/features/lists/lists_view.dart')
          l = lists.read_text()
          header_start = l.index('class _NotesLibraryHeader extends StatelessWidget')
          search_start = l.index('          NotesGlmLibraryInput(', header_start)
          search_end = l.index('\n        ],\n      ),\n    );\n  }\n}\n\nclass _HeaderSegBtn', search_start)
          search_widget = '''          AnimatedBuilder(
            animation: searchFocus,
            builder: (context, _) {
              final theme = Theme.of(context);
              final scheme = theme.colorScheme;
              final dark = theme.brightness == Brightness.dark;
              final meta = notesGlmMetaColor(context);
              final fill = dark
                  ? scheme.surfaceContainerHigh.withValues(alpha: 0.82)
                  : const Color(0xFFFFFFFF).withValues(alpha: 0.75);
              final normalBorder = dark
                  ? scheme.outlineVariant.withValues(alpha: 0.78)
                  : const Color(0xFFE2E8F0).withValues(alpha: 0.95);
              final focusBorder = scheme.primary.withValues(
                alpha: dark ? 0.82 : 0.55,
              );
              return SizedBox(
                height: 48,
                child: DecoratedBox(
                  decoration: BoxDecoration(
                    color: fill,
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(
                      color: searchFocus.hasFocus ? focusBorder : normalBorder,
                      width: searchFocus.hasFocus && dark ? 1.2 : 1,
                    ),
                  ),
                  child: TextField(
                    controller: searchController,
                    focusNode: searchFocus,
                    textInputAction: TextInputAction.search,
                    textCapitalization: TextCapitalization.sentences,
                    textAlignVertical: TextAlignVertical.center,
                    onChanged: onSearchChanged,
                    style: TextStyle(fontSize: 14, color: scheme.onSurface),
                    decoration: InputDecoration(
                      hintText: t(locale, 'notes_v3_search_hint'),
                      hintStyle: TextStyle(fontSize: 14, color: meta),
                      prefixIcon: Icon(
                        Icons.search_rounded,
                        size: 18,
                        color: meta,
                      ),
                      prefixIconConstraints: const BoxConstraints.tightFor(
                        width: 48,
                        height: 48,
                      ),
                      suffixIcon: searchQuery.trim().isNotEmpty
                          ? IconButton(
                              tooltip: t(locale, 'cancel'),
                              icon: const Icon(Icons.close_rounded, size: 18),
                              visualDensity: VisualDensity.compact,
                              splashRadius: 16,
                              onPressed: onClearSearch,
                            )
                          : null,
                      suffixIconConstraints: searchQuery.trim().isNotEmpty
                          ? const BoxConstraints.tightFor(
                              width: 48,
                              height: 48,
                            )
                          : null,
                      isDense: true,
                      contentPadding: const EdgeInsets.symmetric(horizontal: 14),
                      border: InputBorder.none,
                      enabledBorder: InputBorder.none,
                      focusedBorder: InputBorder.none,
                    ),
                  ),
                ),
              );
            },
          ),'''
          l = l[:search_start] + search_widget + l[search_end:]
          lists.write_text(l)

          # Quick-add field: its own explicit 48px visual frame. The black + is
          # independently constrained to exactly 48x48 and remains circular.
          shell = Path('lib/features/notes/widgets/notes_library_production_shell.dart')
          q = shell.read_text()
          class_start = q.index('class NotesGlmInlineAddRow extends StatelessWidget')
          build_start = q.index('  @override\n  Widget build(BuildContext context) {', class_start)
          new_build = '''  @override
  Widget build(BuildContext context) {
    return Row(
      crossAxisAlignment: CrossAxisAlignment.center,
      children: [
        Expanded(
          child: AnimatedBuilder(
            animation: focusNode,
            builder: (context, _) {
              final theme = Theme.of(context);
              final scheme = theme.colorScheme;
              final dark = theme.brightness == Brightness.dark;
              final meta = notesGlmMetaColor(context);
              final fill = dark
                  ? scheme.surfaceContainerHigh.withValues(alpha: 0.82)
                  : const Color(0xFFFFFFFF).withValues(alpha: 0.75);
              final normalBorder = dark
                  ? scheme.outlineVariant.withValues(alpha: 0.78)
                  : const Color(0xFFE2E8F0).withValues(alpha: 0.95);
              final focusBorder = scheme.primary.withValues(
                alpha: dark ? 0.82 : 0.55,
              );
              return SizedBox(
                height: 48,
                child: DecoratedBox(
                  decoration: BoxDecoration(
                    color: fill,
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(
                      color: focusNode.hasFocus ? focusBorder : normalBorder,
                      width: focusNode.hasFocus && dark ? 1.2 : 1,
                    ),
                  ),
                  child: TextField(
                    controller: controller,
                    focusNode: focusNode,
                    textInputAction: TextInputAction.done,
                    textAlignVertical: TextAlignVertical.center,
                    onSubmitted: (_) => onSubmit(),
                    style: TextStyle(fontSize: 14, color: scheme.onSurface),
                    decoration: InputDecoration(
                      hintText: t(locale, 'input_placeholder_list'),
                      hintStyle: TextStyle(fontSize: 14, color: meta),
                      isDense: true,
                      contentPadding: const EdgeInsets.symmetric(horizontal: 14),
                      border: InputBorder.none,
                      enabledBorder: InputBorder.none,
                      focusedBorder: InputBorder.none,
                    ),
                  ),
                ),
              );
            },
          ),
        ),
        const SizedBox(width: 8),
        SizedBox(
          width: 48,
          height: 48,
          child: Tooltip(
            message: t(locale, 'add'),
            child: Material(
              color: Colors.black,
              shape: const CircleBorder(),
              clipBehavior: Clip.antiAlias,
              child: InkWell(
                onTap: onSubmit,
                customBorder: const CircleBorder(),
                child: const Center(
                  child: Icon(
                    Icons.add_rounded,
                    size: 22,
                    color: Colors.white,
                  ),
                ),
              ),
            ),
          ),
        ),
      ],
    );
  }
}'''
          q = q[:build_start] + new_build + '\n'
          shell.write_text(q)

          final_surface = surface.read_text()
          final_lists = lists.read_text()
          final_shell = shell.read_text()
          require('class NotesGlmLibraryInput' not in final_surface, 'shared input component still exists')
          require('NotesGlmLibraryInput(' not in final_lists, 'Search still uses shared component')
          require('NotesGlmLibraryInput(' not in final_shell, 'Quick-add still uses shared component')
          require(final_lists.count('height: 48') >= 3, 'Search does not have explicit 48px frame/icon constraints')
          require(final_shell.count('height: 48') >= 2, 'Quick-add field/button not both explicit 48px')
          require('width: 48' in final_shell, 'Quick-add button width is not explicit 48px')
          require('shape: const CircleBorder()' in final_shell, 'Quick-add button is not circular')
          PY
