name: Notes interaction UX fix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: source pattern not found')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # 1) Notes library control geometry: Search == Quick add == + button.
          # ------------------------------------------------------------------
          path = 'lib/features/notes/notes_glm_surface.dart'
          text = read(path)
          if 'const double kNotesLibraryControlHeight = 48;' not in text:
              text = replace_once(
                  text,
                  'const double kGlmPillHeight = 32;\n',
                  'const double kGlmPillHeight = 32;\n'
                  'const double kNotesLibraryControlHeight = 48;\n',
                  'library control height token',
              )
          if 'constraints: const BoxConstraints.tightFor(' not in text[text.find('InputDecoration notesGlmSearchDecoration'):]:
              text = replace_once(
                  text,
                  '  return InputDecoration(\n    hintText: hintText,',
                  '  return InputDecoration(\n'
                  '    constraints: const BoxConstraints.tightFor(\n'
                  '      height: kNotesLibraryControlHeight,\n'
                  '    ),\n'
                  '    hintText: hintText,',
                  'search exact height',
              )
          write(path, text)

          path = 'lib/features/notes/widgets/notes_library_production_shell.dart'
          text = read(path)
          text = replace_once(
              text,
              '            height: 48,\n            child: TextField(',
              '            height: kNotesLibraryControlHeight,\n            child: TextField(',
              'quick add input height',
          )
          text = replace_once(
              text,
              '        SizedBox.square(\ndimension: 48,',
              '        SizedBox.square(\n'
              'dimension: kNotesLibraryControlHeight,',
              'quick add button height',
          )
          write(path, text)

          # ------------------------------------------------------------------
          # 2) Notes selection mode keeps the exact same Notes library surface.
          #    Card menus are anchored to the actual three-dot control.
          #    Remove Notes "export as text" UI.
          # ------------------------------------------------------------------
          path = 'lib/features/lists/lists_view.dart'
          text = read(path)

          method_start = text.find('  void _showListsRadialMenu(\n')
          method_end = text.find('  Future<void> _loadPersistedFilter()', method_start)
          if method_start < 0 or method_end < 0:
              raise SystemExit('lists radial menu method not found')
          method = text[method_start:method_end]
          rest_marker = '    late OverlayEntry entry;'
          rest_at = method.find(rest_marker)
          if rest_at < 0:
              raise SystemExit('lists radial menu overlay body not found')
          rest = method[rest_at:]
          new_method = '''  void _showListsRadialMenu(
    BuildContext anchorContext,
    PlanningTask task,
    String listKey,
  ) {
    final box = anchorContext.findRenderObject() as RenderBox?;
    if (box == null || !box.hasSize) return;
    final rect = box.localToGlobal(Offset.zero) & box.size;
    _showListsRadialMenuAt(rect.center, task, listKey);
  }

  void _showListsRadialMenuAt(
    Offset anchorCenter,
    PlanningTask task,
    String listKey,
  ) {
    final overlay = Overlay.maybeOf(context);
    if (overlay == null) return;
'''
          new_method += rest
          text = text[:method_start] + new_method + text[method_end:]

          top_start = text.find('                topBar: _listsSelectMode')
          top_end = text.find('                header:', top_start)
          if top_start < 0 or top_end < 0:
              raise SystemExit('Notes selection top bar composition not found')
          text = text[:top_start] + '                topBar: null,\n' + text[top_end:]

          text = replace_once(
              text,
              '                header: _listsSelectMode\n'
              '                    ? const SizedBox.shrink()\n'
              '                    : _NotesLibraryHeader(',
              '                header: _NotesLibraryHeader(',
              'Notes selection header parity',
          )

          export_start = text.find('                        showExport: filterId != null,')
          export_end = text.find('                        notesView: _notesView,', export_start)
          if export_start < 0 or export_end < 0:
              raise SystemExit('Notes export call block not found')
          text = text[:export_start] + text[export_end:]

          select_branch_start = text.find(
              '                    : _listsSelectMode\n'
              '                    ? RefreshIndicator('
          )
          notes_body_marker = '                    : NotesLibraryBody('
          select_branch_end = text.find(notes_body_marker, select_branch_start)
          if select_branch_start < 0 or select_branch_end < 0:
              raise SystemExit('Notes generic select-mode content swap not found')
          text = (
              text[:select_branch_start]
              + '                    : NotesLibraryBody('
              + text[select_branch_end + len(notes_body_marker):]
          )

          old_body_args = '''                        checkboxesOn: _notesCheckboxesOn,
                        onTap: _openNoteEditor,
                        onLongPress: (t) => _showListsRadialMenu(
                          context,
                          t,
                          _listKey(t),
                        ),'''
          new_body_args = '''                        checkboxesOn: _notesCheckboxesOn,
                        selectionMode: _listsSelectMode,
                        selectedKeys: _selectedListKeys,
                        itemKey: _listKey,
                        onToggleSelection: (task) =>
                            _toggleListKey(_listKey(task)),
                        onTap: _openNoteEditor,
                        onLongPress: (_) {},
                        onOpenMenu: (anchorCenter, task) =>
                            _showListsRadialMenuAt(
                              anchorCenter,
                              task,
                              _listKey(task),
                            ),'''
          text = replace_once(
              text,
              old_body_args,
              new_body_args,
              'Notes library selection/card menu args',
          )

          text = text.replace('    required this.showExport,\n', '', 1)
          text = text.replace('    required this.onExport,\n', '', 1)
          text = text.replace('  final bool showExport;\n', '', 1)
          text = text.replace('  final VoidCallback onExport;\n', '', 1)

          export_ui_start = text.find('              if (showExport)\n                IconButton(')
          if export_ui_start < 0:
              raise SystemExit('Notes export icon not found')
          export_ui_end_marker = '                  onPressed: onExport,\n                ),'
          export_ui_end = text.find(export_ui_end_marker, export_ui_start)
          if export_ui_end < 0:
              raise SystemExit('Notes export icon end not found')
          export_ui_end += len(export_ui_end_marker)
          text = text[:export_ui_start] + text[export_ui_end:]
          write(path, text)

          # ------------------------------------------------------------------
          # 3) Notes cards: checkbox is an exact category-icon replacement;
          #    no pin icons; a three-dot button owns the radial menu anchor.
          # ------------------------------------------------------------------
          path = 'lib/features/notes/widgets/note_card.dart'
          text = read(path)

          if text.count('    required this.onLongPress,\n') < 3:
              raise SystemExit('NoteCard constructor anchors changed')
          text = text.replace(
