name: Restore Notes checkbox visual

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/notes/widgets/note_card.dart')
          text = path.read_text()

          old = '''            child: Center(
              child: AnimatedContainer(
                duration: const Duration(milliseconds: 120),
                width: 26,
                height: 26,
                decoration: BoxDecoration(
                  color: isDone ? scheme.primary : Colors.transparent,
                  borderRadius: BorderRadius.circular(8),
                  border: Border.all(
                    color: isDone
                        ? scheme.primary
                        : scheme.outline.withValues(alpha: 0.55),
                    width: 1.5,
                  ),
                ),
                child: isDone
                    ? Icon(
                        Icons.check_rounded,
                        size: 18,
                        color: scheme.onPrimary,
                      )
                    : null,
              ),
            ),'''

          new = '''            child: Center(
              child: Container(
                width: kNotesLargeCheckSize,
                height: kNotesLargeCheckSize,
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(8),
                  border: Border.all(
                    color: isDone
                        ? scheme.primary
                        : scheme.outlineVariant.withValues(alpha: 0.7),
                    width: 2,
                  ),
                  color: isDone ? scheme.primary : Colors.transparent,
                ),
                child: isDone
                    ? const Icon(
                        Icons.check_rounded,
                        size: 20,
                        color: Colors.white,
                      )
                    : null,
              ),
            ),'''

          if old not in text:
              raise SystemExit('current Notes large checkbox visual not found')
          text = text.replace(old, new, 1)

          # Keep the larger invisible 44x44 hit target, but restore the exact
          # original 36x36 visible checkbox and its original border/check styling.
          text = text.replace(
              '            borderRadius: BorderRadius.circular(12),',
              '            borderRadius: BorderRadius.circular(8),',
              1,
          )
          path.write_text(text)
          PY
