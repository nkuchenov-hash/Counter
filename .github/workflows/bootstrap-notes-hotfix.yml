              '    required this.onLongPress,\n'
              '    required this.onOpenMenu,\n',
              3,
          )
          if text.count('  final VoidCallback onLongPress;\n') < 3:
              raise SystemExit('NoteCard callback fields changed')
          text = text.replace(
              '  final VoidCallback onLongPress;\n',
              '  final VoidCallback onLongPress;\n'
              '  final ValueChanged<Offset> onOpenMenu;\n',
              3,
          )
          if text.count('            onLongPress: onLongPress,\n') < 2:
              raise SystemExit('NoteCard child forwarding changed')
          text = text.replace(
              '            onLongPress: onLongPress,\n',
              '            onLongPress: onLongPress,\n'
              '            onOpenMenu: onOpenMenu,\n',
              2,
          )

          grid_class = text.find('class _GridCard extends StatelessWidget {')
          grid_items_start = text.find('                  _CategoryTile(data: data),', grid_class)
          grid_items_end = text.find('                ],\n              ),', grid_items_start)
          if grid_items_start < 0 or grid_items_end < 0:
              raise SystemExit('Note grid leading/actions row not found')
          grid_items = '''                  if (checkboxesOn)
                    _LargeDoneCheck(
                      isDone: isDone,
                      onToggle: onToggleDone,
                    )
                  else
                    _CategoryTile(data: data),
                  const SizedBox(width: 10),
                  Expanded(child: _BadgesRow(data: data, loc: loc)),
                  _NoteCardMenuButton(onPressed: onOpenMenu),
'''
          text = text[:grid_items_start] + grid_items + text[grid_items_end:]

          list_class = text.find('class _ListRow extends StatelessWidget {')
          pin_start = text.find('                        if (data.pinned)', list_class)
          pin_end = text.find('                      ],', pin_start)
          if pin_start < 0 or pin_end < 0:
              raise SystemExit('Note list pin indicator not found')
          text = text[:pin_start] + text[pin_end:]

          pin_button_start = text.find('              IconButton(\n                tooltip: data.pinned', list_class)
          pin_button_end = text.find('            ],\n          ),', pin_button_start)
          if pin_button_start < 0 or pin_button_end < 0:
              raise SystemExit('Note list pin button not found')
          text = (
              text[:pin_button_start]
              + '              _NoteCardMenuButton(onPressed: onOpenMenu),\n'
              + text[pin_button_end:]
          )

          done_start = text.find('class _DoneCheck extends StatelessWidget {')
          large_start = text.find('class _LargeDoneCheck extends StatelessWidget {', done_start)
          category_start = text.find('class _CategoryTile extends StatelessWidget {', large_start)
          if done_start < 0 or large_start < 0 or category_start < 0:
              raise SystemExit('Note checkbox classes not found')

          replacement = '''class _NoteCardMenuButton extends StatefulWidget {
  const _NoteCardMenuButton({required this.onPressed});

  final ValueChanged<Offset> onPressed;

  @override
  State<_NoteCardMenuButton> createState() => _NoteCardMenuButtonState();
}

class _NoteCardMenuButtonState extends State<_NoteCardMenuButton> {
  final GlobalKey _anchorKey = GlobalKey();

  void _open() {
    final box = _anchorKey.currentContext?.findRenderObject() as RenderBox?;
    if (box == null || !box.hasSize) return;
    final rect = box.localToGlobal(Offset.zero) & box.size;
    widget.onPressed(rect.center);
  }

  @override
  Widget build(BuildContext context) {
    final scheme = Theme.of(context).colorScheme;
    return Tooltip(
      message: 'More',
      child: Material(
        color: Colors.transparent,
        child: InkWell(
          onTap: _open,
          borderRadius: BorderRadius.circular(16),
          child: SizedBox.square(
            key: _anchorKey,
            dimension: 32,
            child: Icon(
              Icons.more_horiz_rounded,
              size: 19,
              color: scheme.onSurfaceVariant,
