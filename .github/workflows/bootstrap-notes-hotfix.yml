name: Notes bulk selection exit and scroll preservation

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          page = Path('lib/features/notes/note_editor_page.dart')
          text = page.read_text()

          text = replace_once(
              text,
              '''  bool _blockSelectionMode = false;
  final Set<String> _selectedBlockIds = <String>{};
''',
              '''  bool _blockSelectionMode = false;
  final Set<String> _selectedBlockIds = <String>{};
  final ScrollController _blockScrollController = ScrollController();
''',
              'scroll controller field',
          )

          text = replace_once(
              text,
              '''    _gate.dispose();
    _audioPlayback
''',
              '''    _gate.dispose();
    _blockScrollController.dispose();
    _audioPlayback
''',
              'scroll controller dispose',
          )

          old_toggle = '''  void _toggleBlockSelection(String blockId) {
    if (_editor.blockById(blockId) == null) return;
    if (!_blockSelectionMode) {
      FocusManager.instance.primaryFocus?.unfocus();
      for (final node in _focusNodes.values) {
        if (node.hasFocus) node.unfocus();
      }
      _editor.activeSelection = null;
    }
    setState(() {
      _editingBlockId = null;
      _blockSelectionMode = true;
      if (!_selectedBlockIds.add(blockId)) {
        _selectedBlockIds.remove(blockId);
      }
      if (_selectedBlockIds.isEmpty) _blockSelectionMode = false;
    });
  }
'''
          new_toggle = '''  double? _captureBlockScrollOffset() {
    if (!_blockScrollController.hasClients) return null;
    return _blockScrollController.offset;
  }

  void _restoreBlockScrollOffset(double? offset) {
    if (offset == null) return;
    void restore() {
      if (!mounted || !_blockScrollController.hasClients) return;
      final position = _blockScrollController.position;
      _blockScrollController.jumpTo(
        offset.clamp(position.minScrollExtent, position.maxScrollExtent),
      );
    }

    WidgetsBinding.instance.addPostFrameCallback((_) {
      restore();
      WidgetsBinding.instance.addPostFrameCallback((_) => restore());
    });
  }

  void _toggleBlockSelection(String blockId) {
    if (_editor.blockById(blockId) == null) return;
    final scrollOffset = _captureBlockScrollOffset();
    if (!_blockSelectionMode) {
      FocusManager.instance.primaryFocus?.unfocus();
      for (final node in _focusNodes.values) {
        if (node.hasFocus) node.unfocus();
      }
      _editor.activeSelection = null;
    }
    setState(() {
      _editingBlockId = null;
      _blockSelectionMode = true;
      if (!_selectedBlockIds.add(blockId)) {
        _selectedBlockIds.remove(blockId);
      }
      if (_selectedBlockIds.isEmpty) _blockSelectionMode = false;
    });
    _restoreBlockScrollOffset(scrollOffset);
  }

  void _exitBlockSelectionMode() {
    if (!_blockSelectionMode && _selectedBlockIds.isEmpty) return;
    final scrollOffset = _captureBlockScrollOffset();
    FocusManager.instance.primaryFocus?.unfocus();
    for (final node in _focusNodes.values) {
      if (node.hasFocus) node.unfocus();
    }
    _editor.activeSelection = null;
    setState(() {
      _editingBlockId = null;
      _selectedBlockIds.clear();
      _blockSelectionMode = false;
    });
    _restoreBlockScrollOffset(scrollOffset);
  }
'''
          text = replace_once(text, old_toggle, new_toggle, 'bulk selection toggle')

          text = replace_once(
              text,
              '''    return ReorderableListView.builder(
      key: const ValueKey('notes-editor-content'),
      padding: EdgeInsets.zero,
''',
              '''    return ReorderableListView.builder(
      key: const ValueKey('notes-editor-content'),
      controller: _blockScrollController,
      padding: EdgeInsets.zero,
''',
              'reorderable scroll controller',
          )

          text = replace_once(
              text,
              '''      onDelete: _deleteCurrentNote,
      categoryLabel: category?.name,
''',
              '''      onDelete: _deleteCurrentNote,
      bulkSelectionMode: _blockSelectionMode,
      onExitBulkSelection: _exitBlockSelectionMode,
      categoryLabel: category?.name,
''',
              'editor screen bulk params',
          )
          page.write_text(text)

          screen = Path('lib/features/notes/widgets/notes_editor_screen.dart')
          screen_text = screen.read_text()

          screen_text = replace_once(
              screen_text,
              '''    required this.onDelete,
    required this.content,
''',
              '''    required this.onDelete,
    this.bulkSelectionMode = false,
    this.onExitBulkSelection,
    required this.content,
''',
              'screen constructor bulk params',
          )
          screen_text = replace_once(
              screen_text,
              '''  final VoidCallback onTogglePinned;
  final VoidCallback onDelete;
  final Widget content;
''',
              '''  final VoidCallback onTogglePinned;
  final VoidCallback onDelete;
  final bool bulkSelectionMode;
  final VoidCallback? onExitBulkSelection;
  final Widget content;
''',
              'screen bulk fields',
          )
          screen_text = replace_once(
              screen_text,
              '''              onDelete: onDelete,
              titleController: titleController,
''',
              '''              onDelete: onDelete,
              bulkSelectionMode: bulkSelectionMode,
              onExitBulkSelection: onExitBulkSelection,
              titleController: titleController,
''',
              'screen to rail bulk params',
          )
          screen_text = replace_once(
              screen_text,
              '''    required this.onDelete,
    required this.titleController,
''',
              '''    required this.onDelete,
    required this.bulkSelectionMode,
    required this.onExitBulkSelection,
    required this.titleController,
''',
              'rail constructor bulk params',
          )
          screen_text = replace_once(
              screen_text,
              '''  final VoidCallback onTogglePinned;
  final VoidCallback? onDelete;
  final TextEditingController titleController;
''',
              '''  final VoidCallback onTogglePinned;
  final VoidCallback? onDelete;
  final bool bulkSelectionMode;
  final VoidCallback? onExitBulkSelection;
  final TextEditingController titleController;
''',
              'rail bulk fields',
          )
          screen_text = replace_once(
              screen_text,
              '''                  onDelete: onDelete,
                ),
''',
              '''                  onDelete: onDelete,
                  bulkSelectionMode: bulkSelectionMode,
                  onExitBulkSelection: onExitBulkSelection,
                ),
''',
              'rail to header bulk params',
          )
          screen_text = replace_once(
              screen_text,
              '''    required this.onDelete,
  });

  final bool embedded;
  final VoidCallback onDone;
  final bool pinned;
  final VoidCallback onTogglePinned;
  final VoidCallback? onDelete;
''',
              '''    required this.onDelete,
    required this.bulkSelectionMode,
    required this.onExitBulkSelection,
  });

  final bool embedded;
  final VoidCallback onDone;
  final bool pinned;
  final VoidCallback onTogglePinned;
  final VoidCallback? onDelete;
  final bool bulkSelectionMode;
  final VoidCallback? onExitBulkSelection;
''',
              'header constructor and fields',
          )
          screen_text = replace_once(
              screen_text,
              '''const Spacer(),
_NotesHeaderMoreMenu(
  pinned: pinned,
  onTogglePinned: onTogglePinned,
  onDelete: onDelete,
),
''',
              '''const Spacer(),
if (bulkSelectionMode && onExitBulkSelection != null)
  _NotesBulkDoneAction(onPressed: onExitBulkSelection!)
else
  _NotesHeaderMoreMenu(
    pinned: pinned,
    onTogglePinned: onTogglePinned,
    onDelete: onDelete,
  ),
''',
              'header bulk done action',
          )

          marker = '''enum _NotesHeaderMenuAction { pin, delete }
'''
          bulk_action = '''class _NotesBulkDoneAction extends StatelessWidget {
  const _NotesBulkDoneAction({required this.onPressed});

  final VoidCallback onPressed;

  @override
  Widget build(BuildContext context) {
    return Material(
      color: NotesFigmaTokens.glassFill(context),
      elevation: 1,
      shadowColor: Colors.black.withValues(alpha: 0.08),
      borderRadius: BorderRadius.circular(20),
      clipBehavior: Clip.antiAlias,
      child: InkWell(
        onTap: onPressed,
        child: const SizedBox(
          height: 40,
          child: Padding(
            padding: EdgeInsets.symmetric(horizontal: 14),
            child: Row(
              mainAxisSize: MainAxisSize.min,
              children: [
                Icon(Icons.check_rounded, size: 18),
                SizedBox(width: 6),
                Text('Done'),
              ],
            ),
          ),
        ),
      ),
    );
  }
}

'''
          if screen_text.count(marker) != 1:
              raise SystemExit(f'bulk action insertion marker mismatch: {screen_text.count(marker)}')
          screen_text = screen_text.replace(marker, bulk_action + marker, 1)
          screen.write_text(screen_text)

          fixture_names = [
              'test/notes/fixtures/notes_glm_library_parity_fixture.dart',
              'test/notes/fixtures/notes_production_library_capture.dart',
          ]
          for fixture_name in fixture_names:
              fixture = Path(fixture_name)
              fixture_text = fixture.read_text()
              if 'onOpenMenu:' not in fixture_text:
                  fixture_text = fixture_text.replace(
                      'onLongPress: () {},\n',
                      'onLongPress: () {},\n                        onOpenMenu: (_) {},\n'
                      if fixture_name.endswith('notes_glm_library_parity_fixture.dart')
                      else 'onLongPress: () {},\n                  onOpenMenu: (_) {},\n',
                  )
              fixture.write_text(fixture_text)

          subprocess.run(['git', 'add', *fixture_names], check=True)
          PY