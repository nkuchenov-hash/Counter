name: Notes UX patch definition wrapper

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          # Apply the quick-add change directly against the real Dart source.
          path = Path('lib/features/notes/widgets/notes_library_production_shell.dart')
          text = path.read_text()
          declaration = '    final compactMobile = MediaQuery.sizeOf(context).shortestSide < 600;\n'
          if declaration not in text:
              raise SystemExit('quick-add compactMobile declaration not found')
          text = text.replace(declaration, '', 1)
          if '            height: 40,' not in text:
              raise SystemExit('quick-add input height not found')
          text = text.replace('            height: 40,', '            height: 48,', 1)
          text = text.replace(
              '              style: TextStyle(fontSize: 14, color: scheme.onSurface),',
              '              style: TextStyle(fontSize: 15, color: scheme.onSurface),',
              1,
          )
          text = text.replace('                  fontSize: 14,', '                  fontSize: 15,', 1)

          anchor = text.find('width: compactMobile ? 40 : null')
          if anchor < 0:
              raise SystemExit('quick-add button width anchor not found')
          start = text.rfind('        SizedBox(', 0, anchor)
          if start < 0:
              raise SystemExit('quick-add parent SizedBox not found')
          row_end = text.find('\n      ],\n    );', anchor)
          if row_end < 0:
              raise SystemExit('quick-add row end not found')
          end = text.rfind('        ),', anchor, row_end)
          if end < 0:
              raise SystemExit('quick-add button closing not found')
          end += len('        ),')
          new_button = '''        SizedBox.square(
          dimension: 48,
          child: Tooltip(
            message: t(locale, 'add'),
            child: Material(
              color: scheme.primary,
              shape: const CircleBorder(),
              child: InkWell(
                onTap: onSubmit,
                customBorder: const CircleBorder(),
                child: Center(
                  child: Icon(
                    Icons.add_rounded,
                    size: 24,
                    color: scheme.onPrimary,
                  ),
                ),
              ),
            ),
          ),
        ),'''
          text = text[:start] + new_button + text[end:]
          path.write_text(text)

          # Reuse the preserved original patch for all other Notes changes,
          # explicitly excluding its old quick-add subsection.
          original = Path(
              'automation/.github/notes-ux/bootstrap-notes-hotfix-original.txt'
          ).read_text().splitlines()
          script_start = next(
              i for i, line in enumerate(original) if "python3 - <<'PY'" in line
          ) + 1
          script_end = next(
              i for i in range(script_start, len(original))
              if original[i].strip() == 'PY'
          )
          body = []
          skipping_quick_add = False
          for raw in original[script_start:script_end]:
              line = raw[10:] if raw.startswith('          ') else raw
              if '# 3) Quick add:' in line:
                  skipping_quick_add = True
                  continue
              if skipping_quick_add and '# 4) Keep Notes checkbox-mode' in line:
                  skipping_quick_add = False
              if skipping_quick_add:
                  continue
              body.append(line)
          exec(compile('\n'.join(body) + '\n', '<notes-ux-batch>', 'exec'))
          PY
