name: Notes undo selection and add-row hotfix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          def require(condition, label):
              if not condition:
                  raise SystemExit(label)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # 1) Inline Add must be the exact same 48px control height as Search,
          #    with no inherited search icon and no oversized circular action.
          shell = Path('lib/features/notes/widgets/notes_library_production_shell.dart')
          s = shell.read_text()
          s = replace_once(
              s,
              '''              ).copyWith(
                prefixIcon: null,
                prefixIconConstraints: const BoxConstraints(
                  minWidth: 0,
                  minHeight: 0,
                ),
              ),
''',
              '''              ).copyWith(
                prefixIcon: const SizedBox.shrink(),
                prefixIconConstraints: const BoxConstraints.tightFor(
                  width: 0,
                  height: 0,
                ),
              ),
''',
              'remove inherited search icon from inline add',
          )
          old_button = '''        SizedBox.square(
dimension: kNotesLibraryControlHeight,
child: Tooltip(
  message: t(locale, 'add'),
  child: Material(
    color: scheme.primary,
    shape: const CircleBorder(),
    child: InkWell(
      onTap: onSubmit,
      customBorder: const CircleBorder(),
      child: Center(
        child: Icon(
          Icons.add_rounded,
          size: 24,
          color: scheme.onPrimary,
        ),
      ),
    ),
  ),
),
        ),
'''
          new_button = '''        SizedBox(
          width: kNotesLibraryControlHeight,
          height: kNotesLibraryControlHeight,
          child: Tooltip(
            message: t(locale, 'add'),
            child: Material(
              color: scheme.primary,
              borderRadius: BorderRadius.circular(12),
              clipBehavior: Clip.antiAlias,
              child: InkWell(
                onTap: onSubmit,
                borderRadius: BorderRadius.circular(12),
                child: Center(
                  child: Icon(
                    Icons.add_rounded,
                    size: 22,
                    color: scheme.onPrimary,
                  ),
                ),
              ),
            ),
          ),
        ),
'''
          s = replace_once(s, old_button, new_button, 'inline add exact-size button')
          shell.write_text(s)

          # 2) Document-level undo history.
          controller = Path('lib/features/notes/notes_editor_document_controller.dart')
          c = controller.read_text()
          c = replace_once(
              c,
              '''  NoteDocument _document;
  String? activeBlockId;
''',
              '''  NoteDocument _document;
  final List<NoteDocument> _undoStack = <NoteDocument>[];
  String? activeBlockId;
''',
              'undo stack field',
          )
          # All real document mutations flow through these assignments. The
          # constructor uses a different source.copyWith assignment and is left alone.
          mutation_assignment = '_document = _document.copyWith(blocks: nextBlocks);'
          mutation_count = c.count(mutation_assignment)
          require(mutation_count >= 5, f'expected document mutation assignments, got {mutation_count}')
          c = c.replace(
              mutation_assignment,
              '_commitDocument(_document.copyWith(blocks: nextBlocks));',
          )
          marker = '''  void _replaceBlock(NoteBlock replacement) {
'''
          at = c.index(marker)
          undo_helpers = '''  bool get canUndo => _undoStack.isNotEmpty;

  NotesEditorMutation undo() {
    if (_undoStack.isEmpty) return const NotesEditorMutation();
    _document = _undoStack.removeLast();
    final visible = visibleBlocks;
    if (visible.isEmpty) {
      activeBlockId = null;
      activeSelection = null;
      return const NotesEditorMutation(changed: true, requiresRebuild: true);
    }

    final previousActiveId = activeBlockId;
    final restoredId = previousActiveId != null && blockById(previousActiveId) != null
        ? previousActiveId
        : visible.last.id;
    activeBlockId = restoredId;
    final restored = blockById(restoredId);
    if (restored != null && isEditableText(restored.type)) {
      final offset = (activeSelection?.extentOffset ?? restored.effectiveText.length)
          .clamp(0, restored.effectiveText.length)
          .toInt();
      activeSelection = TextSelection.collapsed(offset: offset);
      return NotesEditorMutation(
        changed: true,
        requiresRebuild: true,
        focusBlockId: restoredId,
        selection: activeSelection,
      );
    }
    activeSelection = null;
    return const NotesEditorMutation(changed: true, requiresRebuild: true);
  }

  void _commitDocument(NoteDocument next) {
    _undoStack.add(_document);
    if (_undoStack.length > 100) _undoStack.removeAt(0);
    _document = next;
  }

'''
          require('NotesEditorMutation undo()' not in c, 'undo already unexpectedly exists')
          c = c[:at] + undo_helpers + c[at:]
          controller.write_text(c)

          # 3) Header Undo button immediately next to the three-dot menu.
          screen = Path('lib/features/notes/widgets/notes_editor_screen.dart')
          r = screen.read_text()
          r = replace_once(
              r,
              '''    required this.onDelete,
    this.bulkSelectionMode = false,
''',
              '''    required this.onDelete,
    required this.onUndo,
    this.bulkSelectionMode = false,
''',
              'screen constructor undo',
          )
          r = replace_once(
              r,
              '''  final VoidCallback onDelete;
  final bool bulkSelectionMode;
''',
              '''  final VoidCallback onDelete;
  final VoidCallback onUndo;
  final bool bulkSelectionMode;
''',
              'screen undo field',
          )
          r = replace_once(
              r,
              '''              onDelete: onDelete,
              bulkSelectionMode: bulkSelectionMode,
''',
              '''              onDelete: onDelete,
              onUndo: onUndo,
              bulkSelectionMode: bulkSelectionMode,
''',
              'pass undo to rail',
          )
          r = replace_once(
              r,
              '''    required this.onDelete,
    required this.bulkSelectionMode,
''',
              '''    required this.onDelete,
    required this.onUndo,
    required this.bulkSelectionMode,
''',
              'rail constructor undo',
          )
          # This exact field sequence occurs in the rail once after the first screen field was changed.
          rail_field_old = '''  final VoidCallback? onDelete;
  final bool bulkSelectionMode;
'''
          r = replace_once(
              r,
              rail_field_old,
              '''  final VoidCallback? onDelete;
  final VoidCallback onUndo;
  final bool bulkSelectionMode;
''',
              'rail undo field',
          )
          r = replace_once(
              r,
              '''                  onDelete: onDelete,
                bulkSelectionMode: bulkSelectionMode,
''',
              '''                  onDelete: onDelete,
                  onUndo: onUndo,
                bulkSelectionMode: bulkSelectionMode,
''',
              'pass undo to header',
          )
          r = replace_once(
              r,
              '''    required this.onDelete,
    required this.bulkSelectionMode,
    required this.onExitBulkSelection,
''',
              '''    required this.onDelete,
    required this.onUndo,
    required this.bulkSelectionMode,
    required this.onExitBulkSelection,
''',
              'header constructor undo',
          )
          # Header has the remaining nullable onDelete field.
          r = replace_once(
              r,
              '''  final VoidCallback? onDelete;
  final bool bulkSelectionMode;
  final VoidCallback? onExitBulkSelection;
''',
              '''  final VoidCallback? onDelete;
  final VoidCallback onUndo;
  final bool bulkSelectionMode;
  final VoidCallback? onExitBulkSelection;
''',
              'header undo field',
          )
          old_header_actions = '''else
  _NotesHeaderMoreMenu(
    pinned: pinned,
    onTogglePinned: onTogglePinned,
    onDelete: onDelete,
  ),
'''
          new_header_actions = '''else
  Row(
    mainAxisSize: MainAxisSize.min,
    children: [
      _NotesHeaderAction(
        icon: Icons.undo_rounded,
        tooltip: 'Undo',
        onPressed: onUndo,
      ),
      const SizedBox(width: 8),
      _NotesHeaderMoreMenu(
        pinned: pinned,
        onTogglePinned: onTogglePinned,
        onDelete: onDelete,
      ),
    ],
  ),
'''
          r = replace_once(r, old_header_actions, new_header_actions, 'undo next to more menu')
          screen.write_text(r)

          # 4) Page wiring + robust secondary-click guard for cross-block text selection.
          page = Path('lib/features/notes/note_editor_page.dart')
          p = page.read_text()
          p = replace_once(
              p,
              '''  final Map<String, GlobalKey> _blockItemKeys = <String, GlobalKey>{};
  bool _dirty = false;
''',
              '''  final Map<String, GlobalKey> _blockItemKeys = <String, GlobalKey>{};
  Timer? _secondarySelectionGuardTimer;
  bool _secondarySelectionGuardActive = false;
  bool _dirty = false;
''',
              'secondary selection guard fields',
          )
          p = replace_once(
              p,
              '''  void dispose() {
    if (_dirty && !widget.parityPreview) {
''',
              '''  void dispose() {
    _secondarySelectionGuardTimer?.cancel();
    if (_dirty && !widget.parityPreview) {
''',
              'secondary guard dispose',
          )
          p = replace_once(
              p,
              '''      final node = FocusNode(debugLabel: 'notes-block-${block.id}');
''',
              '''      final node = FocusNode(debugLabel: 'notes-block-${block.id}');
      node.canRequestFocus = !_secondarySelectionGuardActive;
''',
              'new focus node respects right click guard',
          )
          capture_marker = '''  void _captureStructuredSelection(SelectedContent? selected) {
    final plain = selected?.plainText ?? '';
'''
          p = replace_once(
              p,
              capture_marker,
              '''  void _captureStructuredSelection(SelectedContent? selected) {
    if (_secondarySelectionGuardActive &&
        _NotesStructuredClipboard.blocks.length >= 2) {
      return;
    }
    final plain = selected?.plainText ?? '';
''',
              'preserve structured selection during secondary click',
          )
          guard_marker = '''  void _handleEditorBackgroundPointer(PointerDownEvent event) {
'''
          guard_at = p.index(guard_marker)
          guard_helpers = '''  void _beginSecondarySelectionGuard(PointerDownEvent event) {
    if ((event.buttons & kSecondaryMouseButton) == 0 ||
        _NotesStructuredClipboard.blocks.length < 2) {
      return;
    }
    _secondarySelectionGuardTimer?.cancel();
    _secondarySelectionGuardActive = true;
    for (final node in _focusNodes.values) {
      node.canRequestFocus = false;
    }
  }

  void _scheduleSecondarySelectionGuardRelease(PointerEvent event) {
    if (!_secondarySelectionGuardActive) return;
    _secondarySelectionGuardTimer?.cancel();
    _secondarySelectionGuardTimer = Timer(const Duration(milliseconds: 350), () {
      if (!mounted) return;
      _secondarySelectionGuardActive = false;
      for (final node in _focusNodes.values) {
        node.canRequestFocus = true;
      }
    });
  }

  void _handleEditorPointerDown(PointerDownEvent event) {
    _beginSecondarySelectionGuard(event);
    _handleEditorBackgroundPointer(event);
  }

'''
          require('_beginSecondarySelectionGuard' not in p, 'secondary guard already unexpectedly exists')
          p = p[:guard_at] + guard_helpers + p[guard_at:]

          undo_method_marker = '''  void _togglePinned() {
'''
          undo_at = p.index(undo_method_marker)
          undo_method = '''  void _undoLastEdit() {
    final mutation = _editor.undo();
    if (!mutation.changed) return;
    _NotesStructuredClipboard.plainText = null;
    _NotesStructuredClipboard.blocks = const <NoteBlock>[];
    _selectedBlockIds.clear();
    _blockSelectionMode = false;
    _editingBlockId = null;
    _applyMutation(mutation);
  }

'''
          p = p[:undo_at] + undo_method + p[undo_at:]
          p = replace_once(
              p,
              '''      onDelete: _deleteCurrentNote,
      bulkSelectionMode: _blockSelectionMode,
''',
              '''      onDelete: _deleteCurrentNote,
      onUndo: _undoLastEdit,
      bulkSelectionMode: _blockSelectionMode,
''',
              'wire undo to screen',
          )
          p = replace_once(
              p,
              '''        onPointerDown: _handleEditorBackgroundPointer,
''',
              '''        onPointerDown: _handleEditorPointerDown,
        onPointerUp: _scheduleSecondarySelectionGuardRelease,
        onPointerCancel: _scheduleSecondarySelectionGuardRelease,
''',
              'secondary click listener routing',
          )
          page.write_text(p)

          # Assertions: fail before touching git if any requested behavior is absent.
          final_shell = shell.read_text()
          final_controller = controller.read_text()
          final_screen = screen.read_text()
          final_page = page.read_text()
          require('prefixIcon: const SizedBox.shrink()' in final_shell, 'add field still inherits search icon')
          require('width: kNotesLibraryControlHeight' in final_shell and 'height: kNotesLibraryControlHeight' in final_shell, 'add action not exact field height')
          require('shape: const CircleBorder()' not in final_shell.split('class NotesGlmInlineAddRow', 1)[1], 'inline add still circular')
          require('NotesEditorMutation undo()' in final_controller, 'document undo missing')
          require("icon: Icons.undo_rounded" in final_screen, 'header undo button missing')
          require('onUndo: _undoLastEdit' in final_page, 'page undo wiring missing')
          require('_beginSecondarySelectionGuard' in final_page, 'secondary selection guard missing')
          require('onPointerUp: _scheduleSecondarySelectionGuardRelease' in final_page, 'secondary guard release missing')
          require('_secondarySelectionGuardActive &&' in final_page, 'selection preservation hook missing')
          PY