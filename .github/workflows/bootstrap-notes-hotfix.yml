name: Notes bulk selection exit and scroll preservation

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return updated

          page = Path('lib/features/notes/note_editor_page.dart')
          text = page.read_text()

          text = replace_once(
              text,
              '  final Set<String> _selectedBlockIds = <String>{};\n',
              '  final Set<String> _selectedBlockIds = <String>{};\n  final ScrollController _blockScrollController = ScrollController();\n',
              'scroll controller field',
          )
          text = replace_once(
              text,
              '    _gate.dispose();\n    _audioPlayback\n',
              '    _gate.dispose();\n    _blockScrollController.dispose();\n    _audioPlayback\n',
              'scroll controller dispose',
          )

          toggle_start = text.index('  void _toggleBlockSelection(String blockId) {')
          toggle_end = text.index('  void _handleBlockTap(String blockId) {', toggle_start)
          replacement = '''  double? _captureBlockScrollOffset() {
    if (!_blockScrollController.hasClients) return null;
    return _blockScrollController.offset;
  }

  void _restoreBlockScrollOffset(double? offset) {
    if (offset == null) return;
    void restore() {
      if (!mounted || !_blockScrollController.hasClients) return;
      final position = _blockScrollController.position;
      _blockScrollController.jumpTo(
        offset.clamp(position.minScrollExtent, position.maxScrollExtent),
      );
    }

    WidgetsBinding.instance.addPostFrameCallback((_) {
      restore();
      WidgetsBinding.instance.addPostFrameCallback((_) => restore());
    });
  }

  void _toggleBlockSelection(String blockId) {
    if (_editor.blockById(blockId) == null) return;
    final scrollOffset = _captureBlockScrollOffset();
    if (!_blockSelectionMode) {
      FocusManager.instance.primaryFocus?.unfocus();
      for (final node in _focusNodes.values) {
        if (node.hasFocus) node.unfocus();
      }
      _editor.activeSelection = null;
    }
    setState(() {
      _editingBlockId = null;
      _blockSelectionMode = true;
      if (!_selectedBlockIds.add(blockId)) {
        _selectedBlockIds.remove(blockId);
      }
      if (_selectedBlockIds.isEmpty) _blockSelectionMode = false;
    });
    _restoreBlockScrollOffset(scrollOffset);
  }

  void _exitBlockSelectionMode() {
    if (!_blockSelectionMode && _selectedBlockIds.isEmpty) return;
    final scrollOffset = _captureBlockScrollOffset();
    FocusManager.instance.primaryFocus?.unfocus();
    for (final node in _focusNodes.values) {
      if (node.hasFocus) node.unfocus();
    }
    _editor.activeSelection = null;
    setState(() {
      _editingBlockId = null;
      _selectedBlockIds.clear();
      _blockSelectionMode = false;
    });
    _restoreBlockScrollOffset(scrollOffset);
  }

'''
          text = text[:toggle_start] + replacement + text[toggle_end:]

          text = sub_once(
              text,
              r'(return ReorderableListView\.builder\(\s*key: const ValueKey\(\'notes-editor-content\'\),\s*)',
              r"\1scrollController: _blockScrollController,\n      ",
              'reorderable scroll controller',
          )
          text = sub_once(
              text,
              r'(onDelete: _deleteCurrentNote,\s*)',
              r'\1bulkSelectionMode: _blockSelectionMode,\n      onExitBulkSelection: _exitBlockSelectionMode,\n      ',
              'editor screen bulk params',
          )
          page.write_text(text)

          screen = Path('lib/features/notes/widgets/notes_editor_screen.dart')
          s = screen.read_text()
          s = sub_once(
              s,
              r'(required this\.onDelete,\s*)(required this\.content,)',
              r'\1this.bulkSelectionMode = false,\n    this.onExitBulkSelection,\n    \2',
              'screen constructor bulk params',
          )
          s = sub_once(
              s,
              r'(final VoidCallback onDelete;\s*)(final Widget content;)',
              r'\1final bool bulkSelectionMode;\n  final VoidCallback? onExitBulkSelection;\n  \2',
              'screen bulk fields',
          )
          s = sub_once(
              s,
              r'(onDelete: onDelete,\s*)(titleController: titleController,)',
              r'\1bulkSelectionMode: bulkSelectionMode,\n              onExitBulkSelection: onExitBulkSelection,\n              \2',
              'screen to rail bulk params',
          )
          s = sub_once(
              s,
              r'(class _NotesEditorRail extends StatelessWidget \{.*?required this\.onDelete,\s*)(required this\.titleController,)',
              r'\1required this.bulkSelectionMode,\n    required this.onExitBulkSelection,\n    \2',
              'rail constructor bulk params',
              re.S,
          )
          s = sub_once(
              s,
              r'(class _NotesEditorRail extends StatelessWidget \{.*?final VoidCallback\? onDelete;\s*)(final TextEditingController titleController;)',
              r'\1final bool bulkSelectionMode;\n  final VoidCallback? onExitBulkSelection;\n  \2',
              'rail bulk fields',
              re.S,
          )
          s = sub_once(
              s,
              r'(onTogglePinned: onTogglePinned,\s*onDelete: onDelete,\s*)(\),)',
              r'\1bulkSelectionMode: bulkSelectionMode,\n                  onExitBulkSelection: onExitBulkSelection,\n                \2',
              'rail to header bulk params',
          )

          header_start = s.index('class _NotesNavigationHeader extends StatelessWidget {')
          header_end = s.index('enum _NotesHeaderMenuAction', header_start)
          header = s[header_start:header_end]
          header = replace_once(
              header,
              'required this.onDelete,\n  });',
              'required this.onDelete,\n    required this.bulkSelectionMode,\n    required this.onExitBulkSelection,\n  });',
              'header constructor bulk params',
          )
          header = replace_once(
              header,
              'final VoidCallback? onDelete;\n',
              'final VoidCallback? onDelete;\n  final bool bulkSelectionMode;\n  final VoidCallback? onExitBulkSelection;\n',
              'header bulk fields',
          )
          header = sub_once(
              header,
              r'const Spacer\(\),\s*_NotesHeaderMoreMenu\(\s*pinned: pinned,\s*onTogglePinned: onTogglePinned,\s*onDelete: onDelete,\s*\),',
              '''const Spacer(),
if (bulkSelectionMode && onExitBulkSelection != null)
  _NotesBulkDoneAction(onPressed: onExitBulkSelection!)
else
  _NotesHeaderMoreMenu(
    pinned: pinned,
    onTogglePinned: onTogglePinned,
    onDelete: onDelete,
  ),''',
              'header bulk done switch',
              re.S,
          )
          s = s[:header_start] + header + s[header_end:]

          marker = 'enum _NotesHeaderMenuAction { pin, delete }\n'
          bulk_action = '''class _NotesBulkDoneAction extends StatelessWidget {
  const _NotesBulkDoneAction({required this.onPressed});

  final VoidCallback onPressed;

  @override
  Widget build(BuildContext context) {
    return Material(
      color: NotesFigmaTokens.glassFill(context),
      elevation: 1,
      shadowColor: Colors.black.withValues(alpha: 0.08),
      borderRadius: BorderRadius.circular(20),
      clipBehavior: Clip.antiAlias,
      child: InkWell(
        onTap: onPressed,
        child: const SizedBox(
          height: 40,
          child: Padding(
            padding: EdgeInsets.symmetric(horizontal: 14),
            child: Row(
              mainAxisSize: MainAxisSize.min,
              children: [
                Icon(Icons.check_rounded, size: 18),
                SizedBox(width: 6),
                Text('Done'),
              ],
            ),
          ),
        ),
      ),
    );
  }
}

'''
          s = replace_once(s, marker, bulk_action + marker, 'bulk done class')
          screen.write_text(s)

          fixture_names = [
              'test/notes/fixtures/notes_glm_library_parity_fixture.dart',
              'test/notes/fixtures/notes_production_library_capture.dart',
          ]
          for fixture_name in fixture_names:
              fixture = Path(fixture_name)
              f = fixture.read_text()
              f = re.sub(
                  r'(?m)^(\s*)onLongPress: \(\) \{\},\n(?!\1onOpenMenu:)',
                  r'\1onLongPress: () {},\n\1onOpenMenu: (_) {},\n',
                  f,
              )
              fixture.write_text(f)

          subprocess.run(['git', 'add', *fixture_names], check=True)
          PY