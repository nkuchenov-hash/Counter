# One-time observable PR execution marker for the Notes production hotfix.
name: Bootstrap Notes production hotfix

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/bootstrap-notes-hotfix.yml'
  pull_request:
    branches: [gh-pages]
    paths:
      - '.github/workflows/bootstrap-notes-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: notes-production-hotfix
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'hotfix/run-notes-production-build') ||
      startsWith(github.event.head_commit.message, 'Trigger Notes production hotfix')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production hotfix source
        uses: actions/checkout@v4
        with:
          ref: 1c251d4191a6733d7950a95ba1840cb29d884842
          fetch-depth: 0

      - name: Snapshot current Pages support files
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build LIFE OS web hotfix
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none \
            --dart-define=GIT_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_TIME="$BUILD_TIME"
          printf '%s\n' "$SOURCE_SHA" > build/web/.lifeos-source-sha

      - name: Preserve published companion content and deploy trigger
        run: |
          if [ -d pages/igropoisk ]; then
            rm -rf build/web/igropoisk
            cp -R pages/igropoisk build/web/igropoisk
          fi
          mkdir -p build/web/.github/workflows
          cp pages/.github/workflows/deploy.yml build/web/.github/workflows/deploy.yml

      - name: Deploy hotfix to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          commit-message: 'Deploy Notes toolbar production hotfix from 1c251d4191a6733d7950a95ba1840cb29d884842'
