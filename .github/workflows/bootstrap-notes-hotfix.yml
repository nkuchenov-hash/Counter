name: Remove Notes checkbox hover

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/notes/widgets/note_card.dart')
          text = path.read_text()

          start = text.find('class _LargeDoneCheck extends StatelessWidget {')
          end = text.find('\nclass _CategoryTile extends StatelessWidget {', start)
          if start < 0 or end < 0:
              raise SystemExit('Large Notes checkbox class not found')

          block = text[start:end]
          old = '''        child: Material(
          color: Colors.transparent,
          child: InkWell(
            onTap: onToggle,
            borderRadius: BorderRadius.circular(8),
            child: Center(
'''
          new = '''        child: GestureDetector(
          behavior: HitTestBehavior.translucent,
          onTap: onToggle,
          child: Center(
'''
          if old not in block:
              raise SystemExit('Notes checkbox hover wrapper not found')
          block = block.replace(old, new, 1)

          # Material + InkWell had two closing wrappers after Center. GestureDetector
          # needs only one. Remove exactly one wrapper immediately before SizedBox.
          old_tail = '''            ),
          ),
        ),
      ),
    );'''
          new_tail = '''            ),
          ),
      ),
    );'''
          if old_tail not in block:
              raise SystemExit('Notes checkbox wrapper tail not found')
          block = block.replace(old_tail, new_tail, 1)

          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
