name: Notes block selection interaction fix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('lib/features/notes/note_editor_page.dart')
          text = page.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''  void _toggleBlockSelection(String blockId) {
    if (_editor.blockById(blockId) == null) return;
    setState(() {
      _blockSelectionMode = true;
      if (!_selectedBlockIds.add(blockId)) {
        _selectedBlockIds.remove(blockId);
      }
      if (_selectedBlockIds.isEmpty) _blockSelectionMode = false;
    });
  }
''',
              '''  void _toggleBlockSelection(String blockId) {
    if (_editor.blockById(blockId) == null) return;
    if (!_blockSelectionMode) {
      FocusManager.instance.primaryFocus?.unfocus();
      for (final node in _focusNodes.values) {
        if (node.hasFocus) node.unfocus();
      }
      _editor.activeSelection = null;
    }
    setState(() {
      _editingBlockId = null;
      _blockSelectionMode = true;
      if (!_selectedBlockIds.add(blockId)) {
        _selectedBlockIds.remove(blockId);
      }
      if (_selectedBlockIds.isEmpty) _blockSelectionMode = false;
    });
  }
''',
              'toggle selection',
          )

          replace_once(
              '''  void _requestFocus(String blockId, TextSelection selection) {
    final block = _editor.blockById(blockId);
''',
              '''  void _requestFocus(String blockId, TextSelection selection) {
    if (_blockSelectionMode) return;
    final block = _editor.blockById(blockId);
''',
              'request focus guard',
          )

          replace_once(
              '''        if (node.hasFocus) {
''',
              '''        if (node.hasFocus) {
          if (_blockSelectionMode) {
            node.unfocus();
            return;
          }
''',
              'focus listener guard',
          )

          replace_once(
              '''    final active = _editor.activeBlockId == block.id;
''',
              '''    final active = !_blockSelectionMode && _editor.activeBlockId == block.id;
''',
              'active block state',
          )

          replace_once(
              '''      editing: editable && _editingBlockId == block.id,
''',
              '''      editing: editable && !_blockSelectionMode && _editingBlockId == block.id,
''',
              'editing state',
          )

          replace_once(
              '''        Positioned(
top: 2,
right: 2,
child: _NotesBlockMoreButton(
''',
              '''        if (active)
Positioned(
top: 2,
right: 2,
child: _NotesBlockMoreButton(
''',
              'active-only more button',
          )

          build_marker = '''  @override
  Widget build(BuildContext context) {
    final loc = currentLocale.value;
    final activeType = _editor.activeBlock?.type;
'''
          helper = '''  Widget _buildReorderableBlockList() {
    return ReorderableListView.builder(
      key: const ValueKey('notes-editor-content'),
      padding: EdgeInsets.zero,
      buildDefaultDragHandles: false,
      proxyDecorator: (child, _, __) => child,
      itemCount: _editor.visibleBlocks.length,
      onReorder: (oldIndex, newIndex) {
        final visible = _editor.visibleBlocks;
        final draggedId = oldIndex >= 0 && oldIndex < visible.length
            ? visible[oldIndex].id
            : null;
        final mutation = draggedId != null &&
                _selectedBlockIds.contains(draggedId)
            ? _editor.reorderVisibleGroup(
                _selectedBlockIds,
                oldIndex,
                newIndex,
              )
            : _editor.reorderVisible(oldIndex, newIndex);
        _applyMutation(mutation);
      },
      itemBuilder: _buildBlock,
    );
  }

'''
          if text.count(build_marker) != 1:
              raise SystemExit(f'editor build marker mismatch: {text.count(build_marker)}')
          text = text.replace(build_marker, helper + build_marker, 1)

          start_marker = '''      content: SelectionArea(
        onSelectionChanged: _captureStructuredSelection,
        child: ReorderableListView.builder(
'''
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('selection content start not found')
          end_marker = '''        ),
      ),
    );
  }
}
'''
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('selection content end not found')
          replacement = '''      content: _blockSelectionMode
          ? _buildReorderableBlockList()
          : SelectionArea(
              onSelectionChanged: _captureStructuredSelection,
              child: _buildReorderableBlockList(),
            ),
'''
          text = text[:start] + replacement + text[end + len('''        ),
      ),
'''):]

          page.write_text(text)
          PY