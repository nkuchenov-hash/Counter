name: Notes interaction UX fix wrapper

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          source_commit = '23ada4780721817b87bf72a292d80125b1cc2c85'
          subprocess.run(
              ['git', '-C', 'automation', 'fetch', 'origin', source_commit, '--depth=1'],
              check=True,
          )
          original = subprocess.check_output(
              [
                  'git', '-C', 'automation', 'show',
                  f'{source_commit}:.github/workflows/bootstrap-notes-hotfix.yml',
              ],
              text=True,
          ).splitlines()
          start = next(i for i, line in enumerate(original) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(original)) if original[i].strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in original[start:end]
          ) + '\n'

          # Harden the NotesLibraryBody call-site mutation against formatting.
          replace_start = script.find("old_body_args = '''")
          replace_end = script.find(
              "text = text.replace('    required this.showExport,\\n', '', 1)",
              replace_start,
          )
          if replace_start < 0 or replace_end < 0:
              raise SystemExit('NotesLibraryBody patch-definition anchors not found')
          robust_body_patch = '''body_anchor = text.rfind('                    : NotesLibraryBody(')
          body_args_start = text.find(
              '                        checkboxesOn: _notesCheckboxesOn,',
              body_anchor,
          )
          body_args_end = text.find(
              '                        onRefresh: _reload,',
              body_args_start,
          )
          if body_anchor < 0 or body_args_start < 0 or body_args_end < 0:
              raise SystemExit('NotesLibraryBody real argument range not found')
          new_body_args = ''' + "'''" + '''                        checkboxesOn: _notesCheckboxesOn,
                        selectionMode: _listsSelectMode,
                        selectedKeys: _selectedListKeys,
                        itemKey: _listKey,
                        onToggleSelection: (task) =>
                            _toggleListKey(_listKey(task)),
                        onTap: _openNoteEditor,
                        onLongPress: (_) {},
                        onOpenMenu: (anchorCenter, task) =>
                            _showListsRadialMenuAt(
                              anchorCenter,
                              task,
                              _listKey(task),
                            ),
''' + "'''" + '''
          text = text[:body_args_start] + new_body_args + text[body_args_end:]

          '''
          script = script[:replace_start] + robust_body_patch + script[replace_end:]

          # Harden structural clipboard replacement.
          compare_start = script.find("old_compare = '''")
          compare_end = script.find('infer_anchor = text.find(', compare_start)
          if compare_start < 0 or compare_end < 0:
              raise SystemExit('clipboard patch-definition anchors not found')
          robust_clipboard_patch = '''compare_source_start = text.find(
              '    final candidatePlain = _NotesStructuredClipboard.plainText;',
              paste_start,
          )
          compare_source_end = text.find(
              '    if (!mutation.changed) return;',
              compare_source_start,
          )
          if compare_source_start < 0 or compare_source_end < 0:
              raise SystemExit('clipboard real semantic range not found')
          new_compare = ''' + "'''" + '''    final candidatePlain = _NotesStructuredClipboard.plainText;
    final hasMatchingStructure =
        candidatePlain != null &&
        _normalizeClipboardStructure(candidatePlain) ==
            _normalizeClipboardStructure(plain) &&
        _NotesStructuredClipboard.blocks.isNotEmpty;

    final mutation = hasMatchingStructure
        ? _editor.pasteBlocks(
            block.id,
            selection,
            _NotesStructuredClipboard.blocks,
          )
        : _editor.pastePlainText(block.id, selection, plain);
''' + "'''" + '''
          text = text[:compare_source_start] + new_compare + text[compare_source_end:]

          '''
          script = script[:compare_start] + robust_clipboard_patch + script[compare_end:]

          # Harden ReorderableListView callback replacement.
          reorder_patch_start = script.find("old_reorder = '''")
          reorder_patch_end = script.find("file_end = text.rfind('\\nbool _sameRuns(')", reorder_patch_start)
          if reorder_patch_start < 0 or reorder_patch_end < 0:
              raise SystemExit('selected-block move patch-definition anchors not found')
          robust_reorder_patch = '''reorder_list_start = text.find(
              '        child: ReorderableListView.builder(',
              text.find('SelectionArea('),
          )
          reorder_source_start = text.find(
              '          onReorder:',
              reorder_list_start,
          )
          reorder_source_end = text.find(
              '          itemBuilder:',
              reorder_source_start,
          )
          if reorder_list_start < 0 or reorder_source_start < 0 or reorder_source_end < 0:
              raise SystemExit('selected-block move real callback range not found')
          new_reorder = ''' + "'''" + '''          onReorder: (oldIndex, newIndex) {
            final visible = _editor.visibleBlocks;
            final draggedId = oldIndex >= 0 && oldIndex < visible.length
                ? visible[oldIndex].id
                : null;
            final mutation = draggedId != null &&
                    _selectedBlockIds.contains(draggedId)
                ? _editor.reorderVisibleGroup(
                    _selectedBlockIds,
                    oldIndex,
                    newIndex,
                  )
                : _editor.reorderVisible(oldIndex, newIndex);
            _applyMutation(mutation);
          },
''' + "'''" + '''
          text = text[:reorder_source_start] + new_reorder + text[reorder_source_end:]

          '''
          script = script[:reorder_patch_start] + robust_reorder_patch + script[reorder_patch_end:]

          exec(compile(script, '<notes-interaction-ux>', 'exec'))

          # Repair the generated editor helper and keyboard method with literal,
          # syntax-safe Dart. This also avoids RegExp dialect differences.
          editor_path = Path('lib/features/notes/note_editor_page.dart')
          editor = editor_path.read_text()
          helper_start = editor.find('  String _normalizeClipboardStructure(String value) {')
          paste_start = editor.find('  Future<void> _pasteClipboardIntoBlock(', helper_start)
          if helper_start < 0 or paste_start < 0:
              raise SystemExit('generated clipboard helper range not found')
          safe_helper = '''  String _normalizeClipboardStructure(String value) {
    final buffer = StringBuffer();
    var pendingSpace = false;
    for (final rune in value.runes) {
      final whitespace = rune == 9 || rune == 10 || rune == 13 || rune == 32;
      if (whitespace) {
        pendingSpace = buffer.isNotEmpty;
        continue;
      }
      if (pendingSpace) {
        buffer.write(' ');
        pendingSpace = false;
      }
      buffer.writeCharCode(rune);
    }
    return buffer.toString().trim();
  }

'''
          editor = editor[:helper_start] + safe_helper + editor[paste_start:]

          key_start = editor.find('  KeyEventResult _onBlockKeyEvent(NoteBlock block, KeyEvent event) {')
          key_end = editor.find('  /// SelectionArea exposes plain text only.', key_start)
          if key_start < 0 or key_end < 0:
              raise SystemExit('generated keyboard method range not found')
          safe_key_method = '''  KeyEventResult _onBlockKeyEvent(NoteBlock block, KeyEvent event) {
    if (event is! KeyDownEvent) return KeyEventResult.ignored;
    final controller = _textControllerFor(block);
    final selection = controller.selection;
    final keyboard = HardwareKeyboard.instance;
    if (event.logicalKey == LogicalKeyboardKey.keyC &&
        (keyboard.isControlPressed || keyboard.isMetaPressed) &&
        selection.isValid &&
        !selection.isCollapsed) {
      final slice = _editor.structuralSliceForSelection(block.id, selection);
      if (slice != null) {
        final start = selection.start.clamp(0, controller.text.length).toInt();
        final end = selection.end.clamp(0, controller.text.length).toInt();
        final plain = controller.text.substring(start, end);
        _NotesStructuredClipboard.plainText = plain;
        _NotesStructuredClipboard.blocks = <NoteBlock>[slice];
        unawaited(Clipboard.setData(ClipboardData(text: plain)));
        return KeyEventResult.handled;
      }
    }
    if (event.logicalKey == LogicalKeyboardKey.keyV &&
        (keyboard.isControlPressed || keyboard.isMetaPressed)) {
      unawaited(_pasteClipboardIntoBlock(block, selection));
      return KeyEventResult.handled;
    }
    if (event.logicalKey == LogicalKeyboardKey.enter) {
      final mutation = _editor.handleEnter(block.id, selection);
      if (!mutation.changed) return KeyEventResult.ignored;
      _applyMutation(mutation);
      return KeyEventResult.handled;
    }
    if (event.logicalKey == LogicalKeyboardKey.backspace &&
        selection.isValid &&
        selection.isCollapsed &&
        selection.extentOffset == 0) {
      final mutation = _editor.handleBackspaceAtStart(block.id);
      if (!mutation.changed) return KeyEventResult.ignored;
      _applyMutation(mutation);
      return KeyEventResult.handled;
    }
    return KeyEventResult.ignored;
  }

'''
          editor = editor[:key_start] + safe_key_method + editor[key_end:]
          editor_path.write_text(editor)

          # Dart switch cases must terminate explicitly.
          header_path = Path('lib/features/notes/widgets/notes_editor_screen.dart')
          header = header_path.read_text()
          header = header.replace(
              '''          case _NotesHeaderMenuAction.pin:
            onTogglePinned();
          case _NotesHeaderMenuAction.delete:
            onDelete?.call();''',
              '''          case _NotesHeaderMenuAction.pin:
            onTogglePinned();
            break;
          case _NotesHeaderMenuAction.delete:
            onDelete?.call();
            break;''',
              1,
          )
          header_path.write_text(header)

          # Production NoteCard gained the three-dot anchor callback; keep
          # visual capture fixtures compiling without changing their behavior.
          for fixture_name in [
              'test/notes/fixtures/notes_glm_library_parity_fixture.dart',
              'test/notes/fixtures/notes_production_library_capture.dart',
          ]:
              fixture_path = Path(fixture_name)
              fixture = fixture_path.read_text()
              fixture = fixture.replace(
                  '                        onLongPress: () {},\n',
                  '                        onLongPress: () {},\n                        onOpenMenu: (_) {},\n',
              )
              fixture = fixture.replace(
                  '                  onLongPress: () {},\n',
                  '                  onLongPress: () {},\n                  onOpenMenu: (_) {},\n',
              )
              fixture_path.write_text(fixture)
          PY
