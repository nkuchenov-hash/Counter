name: Notes exact input frame parity hotfix

on:
  workflow_dispatch:

jobs:
  definition-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          def require(condition, label):
              if not condition:
                  raise SystemExit(label)

          surface = Path('lib/features/notes/notes_glm_surface.dart')
          s = surface.read_text()
          start = s.index('class NotesGlmLibraryInput extends StatelessWidget {')
          end = s.index('/// GLM glass card surface for library note cards.', start)
          replacement = '''class NotesGlmLibraryInput extends StatelessWidget {
  const NotesGlmLibraryInput({
    super.key,
    required this.controller,
    required this.focusNode,
    required this.hintText,
    required this.textInputAction,
    this.textCapitalization = TextCapitalization.none,
    this.onChanged,
    this.onSubmitted,
    this.suffixIcon,
    this.showSearchIcon = true,
  });

  final TextEditingController controller;
  final FocusNode focusNode;
  final String hintText;
  final TextInputAction textInputAction;
  final TextCapitalization textCapitalization;
  final ValueChanged<String>? onChanged;
  final ValueChanged<String>? onSubmitted;
  final Widget? suffixIcon;
  final bool showSearchIcon;

  @override
  Widget build(BuildContext context) {
    final theme = Theme.of(context);
    final scheme = theme.colorScheme;
    final dark = theme.brightness == Brightness.dark;
    final meta = notesGlmMetaColor(context);
    final fill = dark
        ? scheme.surfaceContainerHigh.withValues(alpha: 0.82)
        : const Color(0xFFFFFFFF).withValues(alpha: 0.75);
    final normalBorder = dark
        ? scheme.outlineVariant.withValues(alpha: 0.78)
        : const Color(0xFFE2E8F0).withValues(alpha: 0.95);
    final focusedBorder = scheme.primary.withValues(alpha: dark ? 0.82 : 0.55);

    return AnimatedBuilder(
      animation: focusNode,
      builder: (context, _) {
        final focused = focusNode.hasFocus;
        return SizedBox(
          height: kNotesLibraryControlHeight,
          child: DecoratedBox(
            decoration: BoxDecoration(
              color: fill,
              borderRadius: BorderRadius.circular(12),
              border: Border.all(
                color: focused ? focusedBorder : normalBorder,
                width: focused && dark ? 1.2 : 1,
              ),
            ),
            child: TextField(
              controller: controller,
              focusNode: focusNode,
              textInputAction: textInputAction,
              textCapitalization: textCapitalization,
              textAlignVertical: TextAlignVertical.center,
              onChanged: onChanged,
              onSubmitted: onSubmitted,
              style: TextStyle(fontSize: 14, color: scheme.onSurface),
              decoration: InputDecoration(
                hintText: hintText,
                hintStyle: TextStyle(fontSize: 14, color: meta),
                prefixIcon: showSearchIcon
                    ? Icon(Icons.search_rounded, size: 18, color: meta)
                    : null,
                prefixIconConstraints: showSearchIcon
                    ? const BoxConstraints.tightFor(
                        width: kNotesLibraryControlHeight,
                        height: kNotesLibraryControlHeight,
                      )
                    : null,
                suffixIcon: suffixIcon,
                suffixIconConstraints: suffixIcon == null
                    ? null
                    : const BoxConstraints.tightFor(
                        width: kNotesLibraryControlHeight,
                        height: kNotesLibraryControlHeight,
                      ),
                isDense: true,
                contentPadding: const EdgeInsets.symmetric(horizontal: 14),
                filled: false,
                border: InputBorder.none,
                enabledBorder: InputBorder.none,
                focusedBorder: InputBorder.none,
                disabledBorder: InputBorder.none,
                errorBorder: InputBorder.none,
                focusedErrorBorder: InputBorder.none,
              ),
            ),
          ),
        );
      },
    );
  }
}

'''
          s = s[:start] + replacement + s[end:]
          surface.write_text(s)

          shell = Path('lib/features/notes/widgets/notes_library_production_shell.dart').read_text()
          lists = Path('lib/features/lists/lists_view.dart').read_text()
          final_surface = surface.read_text()

          require(final_surface.count('class NotesGlmLibraryInput extends StatelessWidget') == 1, 'canonical input class count')
          require('height: kNotesLibraryControlHeight' in final_surface, 'outer frame height missing')
          require('child: DecoratedBox(' in final_surface, 'outer visual frame missing')
          require('border: InputBorder.none' in final_surface, 'inner TextField still draws its own frame')
          require('NotesGlmLibraryInput(' in lists, 'Search is not using canonical input')
          require('NotesGlmLibraryInput(' in shell, 'Quick-add is not using canonical input')
          require('dimension: kNotesLibraryControlHeight' in shell, 'Plus size is not tied to canonical height')
          require('shape: const CircleBorder()' in shell, 'Plus is not circular')
          require('color: Colors.black' in shell, 'Plus is not black')
          PY
