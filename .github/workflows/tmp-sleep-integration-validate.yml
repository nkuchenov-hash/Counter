name: One-time sleep integration validation

on:
  push:
    paths:
      - '.github/workflows/tmp-sleep-integration-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze current source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Self-clean after successful validation
        run: |
          rm .github/workflows/tmp-sleep-integration-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-sleep-integration-validate.yml
          git commit -m "Validate sleep integration"
          git pull --rebase origin main
          git push origin HEAD:main
