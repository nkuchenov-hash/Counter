name: Temp patch Paths V3 completeness

on:
  push:
    branches:
      - fix/paths-v3-reality-kadr

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Paths V3 completeness patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paths-v3-reality-kadr
      - name: Patch completeness gaps
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/app/shell/shared/shell_more_menu.dart')
          s = p.read_text(encoding='utf-8')

          old = """      _v3Action(\n        '03-03',\n        'Проверить, есть ли сейчас механизм обновления, и записать его фактическое поведение',\n        'Описание текущего обновления или подтверждение, что его нет',\n        20,\n        'release',\n      ),\n"""
          new = old + """      _v3Action(\n        '03-03a',\n        'Если автоматического обновления нет, выбрать один механизм обновления для текущего стека КАДР',\n        'Выбранный механизм обновления и источник версии',\n        20,\n        'release',\n      ),\n      _v3Action(\n        '03-03b',\n        'Разложить подключение выбранного обновления на технические действия не длиннее 30 минут и добавить их в этот этап',\n        'Технические действия обновления находятся прямо в Path, а не в памяти',\n        30,\n        'release',\n      ),\n"""
          if old not in s: raise SystemExit('missing updater anchor')
          s = s.replace(old, new, 1)

          old = """      _v3Action(\n        '03-05',\n        'Определить следующий шаг для получения нужного сертификата подписи',\n        'Один конкретный следующий шаг: регистрация, покупка или подготовка данных',\n        15,\n        'windows_distribution',\n      ),\n"""
          new = old + """      _v3Action(\n        '03-05a',\n        'Начать оформление сертификата подписи и пройти доступную за один подход часть процедуры',\n        'Фактический статус оформления и следующий требуемый шаг',\n        30,\n        'windows_distribution',\n      ),\n      _v3Action(\n        '03-05b',\n        'После получения сертификата подписать одну готовую сборку КАДР',\n        'Одна сборка с действующей цифровой подписью',\n        20,\n        'windows_distribution',\n      ),\n      _v3Action(\n        '03-05c',\n        'Проверить подписанную сборку на чистой Windows-системе',\n        'Результат проверки подписи и предупреждений Windows',\n        15,\n        'windows_distribution',\n      ),\n"""
          if old not in s: raise SystemExit('missing signing anchor')
          s = s.replace(old, new, 1)

          old = """      _v3Action(\n        '04-03',\n        'Записать структуру сайта: главная, скачать, цены, вопросы, документы, поддержка',\n        'Карта страниц сайта',\n        20,\n        'website',\n      ),\n"""
          new = old + """      _v3Action(\n        '04-03a',\n        'Выбрать технологию и хостинг сайта КАДР, не добавляя лишнюю инфраструктуру',\n        'Один выбранный способ размещения сайта',\n        20,\n        'website',\n      ),\n      _v3Action(\n        '04-03b',\n        'Создать проект сайта и опубликовать пустую рабочую страницу на выбранном хостинге',\n        'Рабочий публичный адрес сайта, даже пока без оформления',\n        30,\n        'website',\n      ),\n      _v3Action(\n        '04-03c',\n        'Подключить выбранный домен к опубликованному сайту и проверить HTTPS',\n        'Домен открывает сайт по защищённому соединению',\n        25,\n        'website',\n      ),\n      _v3Action(\n        '04-03d',\n        'Собрать на сайте первый экран с названием, обещанием продукта и кнопкой скачивания',\n        'Рабочий первый экран сайта',\n        30,\n        'website',\n      ),\n      _v3Action(\n        '04-03e',\n        'Собрать на сайте отдельный блок бесплатной и платной версии',\n        'Рабочий блок сравнения версий на сайте',\n        30,\n        'website',\n      ),\n      _v3Action(\n        '04-03f',\n        'Собрать страницу или блок скачивания с системными требованиями и номером версии',\n        'Рабочий раздел скачивания',\n        25,\n        'website',\n      ),\n      _v3Action(\n        '04-03g',\n        'Собрать раздел вопросов и поддержки с одним понятным способом связи',\n        'Рабочий раздел вопросов и поддержки',\n        30,\n        'website',\n      ),\n"""
          if old not in s: raise SystemExit('missing website anchor')
          s = s.replace(old, new, 1)

          old = """      _v3Action(\n        '05-04',\n        'Выбрать один сервис для первой рабочей оплаты и записать причину',\n        'Выбранный способ приёма оплаты',\n        15,\n        'payments',\n      ),\n"""
          new = old + """      _v3Action(\n        '05-04a',\n        'Создать или завершить учётную запись продавца в выбранном сервисе оплаты',\n        'Рабочий кабинет продавца или точный список недостающих документов',\n        30,\n        'payments',\n      ),\n      _v3Action(\n        '05-04b',\n        'Создать в сервисе оплаты продукт КАДР и первую цену из этапа 1',\n        'Тестовый или рабочий товар КАДР с ценой',\n        20,\n        'payments',\n      ),\n      _v3Action(\n        '05-04c',\n        'Создать тестовую страницу оплаты и открыть её из сайта КАДР',\n        'Кнопка покупки на сайте ведёт на рабочую тестовую оплату',\n        20,\n        'payments',\n      ),\n      _v3Action(\n        '05-04d',\n        'Определить техническую точку, где подтверждение оплаты превращается в платный доступ',\n        'Конкретный обработчик или модуль для связи оплаты и лицензии',\n        20,\n        'licensing',\n      ),\n      _v3Action(\n        '05-04e',\n        'Разложить подключение подтверждения оплаты и выдачи лицензии на технические действия не длиннее 30 минут и добавить их в этот этап',\n        'Все технические шаги оплаты и лицензии находятся в Path',\n        30,\n        'licensing',\n      ),\n"""
          if old not in s: raise SystemExit('missing payment anchor')
          s = s.replace(old, new, 1)

          old = """      _v3Action(\n        '05-09',\n        'Подготовить структуру условий использования, лицензии, политики конфиденциальности и возвратов',\n        'Черновая структура четырёх обязательных документов',\n        30,\n        'legal',\n      ),\n"""
          new = old + """      _v3Action(\n        '05-09a',\n        'Написать первый рабочий черновик условий использования и лицензии КАДР',\n        'Полный черновик условий и лицензии для последующей проверки',\n        30,\n        'legal',\n      ),\n      _v3Action(\n        '05-09b',\n        'Написать первый рабочий черновик политики конфиденциальности по фактической карте данных',\n        'Полный черновик политики конфиденциальности',\n        30,\n        'legal',\n      ),\n      _v3Action(\n        '05-09c',\n        'Написать отдельное правило возврата и отмены покупки понятным языком',\n        'Полный черновик правил возврата',\n        20,\n        'legal',\n      ),\n      _v3Action(\n        '05-09d',\n        'После проверки документов опубликовать их на сайте КАДР и проверить все ссылки',\n        'Опубликованные документы доступны покупателю до оплаты',\n        20,\n        'legal',\n      ),\n"""
          if old not in s: raise SystemExit('missing legal anchor')
          s = s.replace(old, new, 1)

          old = """      _v3Action(\n        '06-06',\n        'Подготовить описание, иконку и требуемые изображения для карточки Microsoft Store',\n        'Комплект материалов для карточки магазина',\n        30,\n        'microsoft_store',\n      ),\n"""
          new = """      _v3Action(\n        '06-06a',\n        'Подготовить короткое и полное описание КАДР для карточки Microsoft Store',\n        'Два готовых текста для карточки магазина',\n        20,\n        'microsoft_store',\n      ),\n      _v3Action(\n        '06-06b',\n        'Подготовить иконку нужного размера для Microsoft Store',\n        'Готовый файл иконки магазина',\n        20,\n        'microsoft_store',\n      ),\n      _v3Action(\n        '06-06c',\n        'Подготовить требуемые скриншоты для карточки Microsoft Store',\n        'Комплект готовых скриншотов магазина',\n        30,\n        'microsoft_store',\n      ),\n"""
          if old not in s: raise SystemExit('missing store assets anchor')
          s = s.replace(old, new, 1)

          anchor = """  _v3Stage(\n    10,\n    'Не забыть Android и RuStore, но не придумывать несуществующее приложение',\n"""
          apple_stage = """  _v3Stage(\n    90,\n    'Выпустить выбранную Apple-версию, если она входит в стратегию',\n    'Технические действия выбранной Apple-ветки добавлены прямо в этот этап и выполнены; рабочая сборка проверена через TestFlight или на Mac, а выбранный канал App Store/Mac App Store/прямой macOS-публикации доведён до реальной доступности пользователю.',\n    [\n      _v3Action(\n        '90-01',\n        'Перенести сюда из предыдущего этапа все технические действия выбранной Apple-ветки и убедиться, что каждый шаг не длиннее 30 минут',\n        'Этот этап содержит полный исполнимый технический список до рабочей сборки',\n        30,\n        'apple',\n      ),\n      _v3Action(\n        '90-02',\n        'Создать запись приложения нужной платформы в App Store Connect',\n        'Запись КАДР существует в App Store Connect',\n        20,\n        'apple',\n      ),\n      _v3Action(\n        '90-03',\n        'Загрузить первую запускаемую Apple-сборку в App Store Connect или подготовить подписанную macOS-сборку для прямой установки',\n        'Сборка доступна для следующего этапа проверки',\n        30,\n        'apple',\n      ),\n      _v3Action(\n        '90-04',\n        'Проверить Apple-сборку на реальном устройстве по основному пользовательскому сценарию',\n        'Результат проверки на Mac, iPhone или iPad',\n        30,\n        'apple',\n      ),\n      _v3Action(\n        '90-05',\n        'Если используется App Store, включить тестирование через TestFlight и пригласить первого внешнего тестировщика',\n        'Первая внешняя Apple-проверка запущена',\n        20,\n        'apple',\n      ),\n      _v3Action(\n        '90-06',\n        'Если macOS распространяется напрямую, проверить подпись Developer ID и нотариальное заверение Apple на готовой сборке',\n        'Готовая macOS-сборка проходит проверку Gatekeeper',\n        25,\n        'apple',\n      ),\n      _v3Action(\n        '90-07',\n        'Подготовить карточку выбранного Apple-магазина: описание, иконку и скриншоты отдельными действиями при необходимости',\n        'Карточка готова к отправке на проверку',\n        30,\n        'apple',\n      ),\n      _v3Action(\n        '90-08',\n        'Отправить готовую Apple-версию на проверку или опубликовать выбранным прямым способом',\n        'Получен реальный статус публикации Apple-версии',\n        20,\n        'apple',\n      ),\n    ],\n  ),\n"""
          if anchor not in s: raise SystemExit('missing android stage anchor')
          s = s.replace(anchor, apple_stage + anchor, 1)

          support_anchor = """  _v3Stage(\n    11,\n    'Настроить поддержку и безопасный выпуск новых версий',\n"""
          android_release_stage = """  _v3Stage(\n    100,\n    'Выпустить Android-версию в RuStore, если Android выбран',\n    'Если Android входит в стратегию, технические действия добавлены прямо в этот этап, готовая APK/AAB-сборка подписана, карточка RuStore заполнена, модерация пройдена и установка опубликованной версии проверена.',\n    [\n      _v3Action(\n        '100-01',\n        'Перенести сюда технические действия Android из предыдущего этапа и проверить ограничение 30 минут для каждого',\n        'Полный исполнимый технический список Android находится в Path',\n        30,\n        'android',\n      ),\n      _v3Action(\n        '100-02',\n        'Подготовить подписанную APK или AAB-сборку выбранной Android-версии',\n        'Готовый подписанный файл для магазина',\n        30,\n        'android',\n      ),\n      _v3Action(\n        '100-03',\n        'Создать приложение КАДР в RuStore Консоли и загрузить первую сборку',\n        'Черновик версии КАДР существует в RuStore',\n        20,\n        'android',\n      ),\n      _v3Action(\n        '100-04',\n        'Заполнить описание и обязательные данные карточки RuStore',\n        'Текстовая часть карточки магазина заполнена',\n        25,\n        'android',\n      ),\n      _v3Action(\n        '100-05',\n        'Подготовить и загрузить иконку и скриншоты RuStore',\n        'Медиафайлы карточки загружены',\n        30,\n        'android',\n      ),\n      _v3Action(\n        '100-06',\n        'Отправить Android-версию на модерацию RuStore',\n        'Получен реальный статус модерации',\n        10,\n        'android',\n      ),\n      _v3Action(\n        '100-07',\n        'После публикации установить КАДР из RuStore на реальное Android-устройство',\n        'Проверена установка опубликованной версии',\n        15,\n        'android',\n      ),\n    ],\n  ),\n"""
          if support_anchor not in s: raise SystemExit('missing support stage anchor')
          s = s.replace(support_anchor, android_release_stage + support_anchor, 1)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/temp-patch-paths-v3-completeness.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "nkuchenov-hash"
          git config user.email "nkuchenov@gmail.com"
          git add lib/app/shell/shared/shell_more_menu.dart .github/workflows/temp-patch-paths-v3-completeness.yml
          git commit -m "Apply Paths V3 completeness patch"
          git push origin HEAD:fix/paths-v3-reality-kadr
