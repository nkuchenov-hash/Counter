name: Notes v2 fidelity and visual capture

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/notes-editor-tools-v2
          fetch-depth: 0

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: cp lib/core/env/env.dart.example lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Apply rich-text fidelity patch
        run: python scripts/manual/apply_notes_v2_fidelity.py

      - name: Format changed Dart
        run: |
          dart format \
            lib/data/models/note_rich_types.dart \
            lib/features/notes/widgets/note_editor_block_widgets.dart \
            lib/features/notes/widgets/notes_editor_tools.dart \
            test/note_document_v2_test.dart \
            test/notes/fixtures/notes_v2_tools_fixture.dart \
            test/notes_v2_tools_visual_test.dart

      - name: Strict architecture guard
        run: pwsh -NoProfile -NonInteractive -File ./scripts/audit/architecture_guard.ps1 -Strict

      - name: Check whitespace
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Focused Notes logic tests
        run: |
          flutter test test/note_document_test.dart
          flutter test test/note_document_v2_test.dart

      - name: Generate one Notes tools capture
        run: flutter test --update-goldens test/notes_v2_tools_visual_test.dart

      - name: Verify Notes tools capture
        run: flutter test test/notes_v2_tools_visual_test.dart

      - name: Build web
        run: flutter build web --release --base-href="/Counter/" --no-tree-shake-icons --no-wasm-dry-run --pwa-strategy=none

      - name: Remove temporary fidelity tooling
        run: |
          rm scripts/manual/apply_notes_v2_fidelity.py
          rm .github/workflows/notes-v2-fidelity.yml

      - name: Commit verified fidelity pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Notes inline marks and add visual tools capture [notes-v2-fidelity]"
          git push origin HEAD:feature/notes-editor-tools-v2
