name: LIFE OS ETNIKA data check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifeos-etnika-data-check.yml'
      - 'pb_migrations/1787571000_etnika_homepage_redesign_path_week.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PRIVATE_KEY: ${{ secrets.POCKETBASE_SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.POCKETBASE_SSH_USER || secrets.VPS_SSH_USER || secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.POCKETBASE_SSH_HOST || secrets.VPS_HOST || secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.POCKETBASE_SSH_PORT || secrets.VPS_SSH_PORT || '22' }}
      POCKETBASE_SERVICE: ${{ secrets.POCKETBASE_SERVICE }}
      POCKETBASE_DEPLOY_DIR: ${{ secrets.POCKETBASE_DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          echo "SSH_USER=${SSH_USER:-root}" >> "$GITHUB_ENV"
          echo "SSH_HOST=${SSH_HOST:-217.114.0.201}" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lifeos_pocketbase
          chmod 600 ~/.ssh/lifeos_pocketbase
          ssh-keyscan -p "$SSH_PORT" -H "${SSH_HOST:-217.114.0.201}" >> ~/.ssh/known_hosts

      - name: Verify applied ETNIKA migration state
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lifeos_pocketbase -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "POCKETBASE_DEPLOY_DIR='$POCKETBASE_DEPLOY_DIR' POCKETBASE_SERVICE='$POCKETBASE_SERVICE' bash -s" > /tmp/etnika-check.txt <<'REMOTE'
          set -euo pipefail
          service_name="${POCKETBASE_SERVICE:-}"
          if [[ -z "$service_name" ]]; then
            service_name="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk 'tolower($1) ~ /pocketbase/ && !found {print $1; found=1}')"
          fi
          pid="$(pgrep -f '[p]ocketbase.*serve' | sed -n '1p' || true)"
          app_dir="${POCKETBASE_DEPLOY_DIR:-}"
          if [[ -z "$app_dir" && -n "$service_name" ]]; then app_dir="$(systemctl show "$service_name" -p WorkingDirectory --value 2>/dev/null || true)"; fi
          if [[ -z "$app_dir" && -n "$pid" ]]; then app_dir="$(readlink -f "/proc/$pid/cwd" 2>/dev/null || true)"; fi
          [[ -n "$app_dir" && -f "$app_dir/pb_data/data.db" ]]

          migration_file="$app_dir/pb_migrations/1787571000_etnika_homepage_redesign_path_week.js"
          ready=false
          for attempt in {1..45}; do
            health="$(curl -sS -o /dev/null -w '%{http_code}' https://217-114-0-201.sslip.io/api/health || true)"
            if [[ -f "$migration_file" && "$health" == "200" ]]; then
              ready=true
              break
            fi
            sleep 2
          done
          echo "migration_file_present=$([[ -f "$migration_file" ]] && echo true || echo false)"
          echo "server_ready=$ready"

          python3 - "$app_dir/pb_data/data.db" <<'PY'
          import json, sqlite3, sys
          con = sqlite3.connect(f'file:{sys.argv[1]}?mode=ro', uri=True)
          con.row_factory = sqlite3.Row
          cats = con.execute("SELECT id,user_id,name,parent_id,is_archived FROM categories").fetchall()
          roots = [r for r in cats if (r['name'] or '').strip().casefold() == 'этника' and not bool(r['is_archived'])]
          print('etnika_active_categories=' + str(len(roots)))
          if len(roots) != 1:
              print('verified=false')
              con.close(); raise SystemExit(0)
          root = roots[0]
          root_paths = con.execute("SELECT id,path_id FROM paths WHERE user_id=? AND category_link=?", (root['user_id'], root['id'])).fetchall()
          print('root_path_rows=' + str(len(root_paths)))
          children = [r for r in cats if r['user_id'] == root['user_id'] and r['parent_id'] == root['id'] and (r['name'] or '').strip().casefold() == 'обновление основной страницы сайта' and not bool(r['is_archived'])]
          print('child_matches=' + str(len(children)))
          if len(children) != 1:
              print('verified=false')
              con.close(); raise SystemExit(0)
          child = children[0]
          child_paths = con.execute("SELECT id,path_id,active_revision_link FROM paths WHERE user_id=? AND category_link=? AND archived=0", (root['user_id'], child['id'])).fetchall()
          print('child_path_rows=' + str(len(child_paths)))
          stages_count = 0
          actions_count = 0
          if len(child_paths) == 1:
              rev = con.execute("SELECT goal,content FROM path_revisions WHERE id=? AND user_id=? AND path_id=?", (child_paths[0]['active_revision_link'], root['user_id'], child_paths[0]['path_id'])).fetchone()
              if rev:
                  raw = rev['content']
                  try:
                      data = json.loads(raw) if isinstance(raw, str) else (raw or {})
                  except Exception:
                      data = {}
                  stages = data.get('stages') or []
                  stages_count = len(stages)
                  actions_count = sum(len((s or {}).get('actions') or []) for s in stages if isinstance(s, dict))
          print('child_path_stages=' + str(stages_count))
          print('child_path_actions=' + str(actions_count))
          exact_ids = [f'etnika-homepage-redesign-2026-08-{d:02d}' for d in range(25, 32)]
          placeholders = ','.join('?' for _ in exact_ids)
          rows = con.execute(f"SELECT plan_id,start_time,end_time FROM plans WHERE user_id=? AND plan_id IN ({placeholders}) ORDER BY plan_id", (root['user_id'], *exact_ids)).fetchall()
          print('week_plans=' + str(len(rows)))
          durations_ok = True
          for row in rows:
              try:
                  seconds = (sqlite3.datetime.datetime.fromisoformat((row['end_time'] or '').replace('Z','+00:00')) - sqlite3.datetime.datetime.fromisoformat((row['start_time'] or '').replace('Z','+00:00'))).total_seconds()
                  if seconds < 3600: durations_ok = False
              except Exception:
                  durations_ok = False
          print('all_week_plans_at_least_60m=' + str(durations_ok).lower())
          verified = len(root_paths) == 0 and len(child_paths) == 1 and stages_count == 9 and actions_count == 61 and len(rows) == 7 and durations_ok
          print('verified=' + str(verified).lower())
          con.close()
          PY
          REMOTE

      - name: Publish sanitized verification
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/etnika-check.txt _tmp_etnika_data_check.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _tmp_etnika_data_check.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record sanitized ETNIKA Path verification'
          git pull --rebase origin main
          git push origin HEAD:main
