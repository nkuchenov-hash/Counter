name: Fix Google Health sleep lookback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply supported Google Health query range
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pb_hooks/sleep_sync.pb.js')
          text = path.read_text(encoding='utf-8')
          old = 'var __sleepSyncLookbackDays = 7;'
          new = 'var __sleepSyncLookbackDays = 14;'
          if old not in text and new not in text:
              raise SystemExit('sleep lookback constant not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate PocketBase JavaScript
        run: |
          node --check pb_hooks/sleep_sync.pb.js
          node --check pb_migrations/1785390000_server_sleep_sync.js
          git diff --check

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/server-sleep-sync-lookback-fix.yml
          git add pb_hooks/sleep_sync.pb.js
          git commit -m "Use supported Google Health sleep lookback"
          git push origin HEAD:${{ github.head_ref }}
