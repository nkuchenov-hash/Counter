name: Clean Google Fit PR side effects

on:
  push:
    branches:
      - agent/fix-server-sleep-google-fit

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-server-sleep-google-fit
          fetch-depth: 0
      - name: Restore unrelated generated files
        run: |
          git fetch origin main
          git checkout origin/main -- pubspec.lock macos/Flutter/GeneratedPluginRegistrant.swift
          rm .github/workflows/cleanup-google-fit-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Google Fit PR side effects"
          git push origin HEAD:agent/fix-server-sleep-google-fit
