name: Temporary restore English recurrence labels

on:
  push:
    branches:
      - fix/recurrence-dialog-alignment

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full English catalog and apply only recurrence labels
        shell: bash
        run: |
          git checkout 4b9ea05d64bc0bdaac479ec05b896779f5197eee -- lib/l10n/langs/en.dart
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/l10n/langs/en.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("'plan_recurrence_edit_future': 'This and following events'", "'plan_recurrence_edit_future': 'This and all following events'", 1)
          s = s.replace("'plan_recurrence_delete_future': 'Delete this and following events'", "'plan_recurrence_delete_future': 'Delete this and all following events'", 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/restore-en-recurrence-once.yml
          git add -A

      - name: Commit restored catalog
        shell: bash
        run: |
          git config user.name "life-os-recurrence-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Restore English catalog and recurrence labels"
          git push origin HEAD:fix/recurrence-dialog-alignment
