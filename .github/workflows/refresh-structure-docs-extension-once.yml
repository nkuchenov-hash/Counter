name: Refresh structure docs for extension fix once

on:
  push:
    branches:
      - fix/browser-extension-start-record-immediate

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/browser-extension-start-record-immediate
          fetch-depth: 0

      - name: Remove one-shot workflow before generation
        run: git rm .github/workflows/refresh-structure-docs-extension-once.yml

      - name: Regenerate exact structure manifest
        run: python scripts/manual/generate_app_structure_detailed.py

      - name: Verify documentation parity
        run: python scripts/audit/documentation_parity.py

      - name: Commit regenerated manifest and self-removal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/APP_STRUCTURE_DETAILED.md
          git diff --cached --check
          git commit -m "Regenerate detailed structure manifest"
          git push origin HEAD:fix/browser-extension-start-record-immediate
