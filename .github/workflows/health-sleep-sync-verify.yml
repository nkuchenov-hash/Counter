name: Health sleep sync verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-health-sleep-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          cat > lib/core/env/env.dart <<'DART'
          abstract final class Env {
            static const String placeholder = '';
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run two focused policy tests
        run: |
          flutter test test/data/health_sleep_policy_test.dart
          flutter test test/data/unfilled_time_gap_policy_test.dart

      - name: Build Android arm64 release APK
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          flutter build apk --release --split-per-abi --no-tree-shake-icons \
            --dart-define=GIT_COMMIT="${GITHUB_SHA::7}" \
            --dart-define=BUILD_TIME="$BUILD_TIME"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LifeOS-Health-Sleep-arm64.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-Health-Sleep-arm64
          path: LifeOS-Health-Sleep-arm64.apk
          if-no-files-found: error
          retention-days: 30
