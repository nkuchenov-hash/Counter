name: Inspect one-time sleep APK build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-monitor-sleep-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tmp-build-sleep-fix-apk.yml/runs?per_page=1")
          python3 - <<'PY' "$JSON" > android-sleep-apk-monitor.txt
          import json,sys
          data=json.loads(sys.argv[1])
          runs=data.get('workflow_runs') or []
          if not runs:
              print('found=0'); raise SystemExit
          r=runs[0]
          print('found=1')
          print('run_id='+str(r.get('id','')))
          print('status='+str(r.get('status','')))
          print('conclusion='+str(r.get('conclusion') or ''))
          print('head_sha='+str(r.get('head_sha','')))
          PY
          RUN_ID=$(awk -F= '$1=="run_id"{print $2}' android-sleep-apk-monitor.txt)
          if [[ -n "$RUN_ID" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" > /tmp/artifacts.json
            python3 - <<'PY' /tmp/artifacts.json >> android-sleep-apk-monitor.txt
          import json,sys
          data=json.load(open(sys.argv[1]))
          arts=data.get('artifacts') or []
          print('artifact_count='+str(len(arts)))
          if arts:
              a=arts[0]
              print('artifact_id='+str(a.get('id','')))
              print('artifact_name='+str(a.get('name','')))
          PY
          fi
          cat android-sleep-apk-monitor.txt
      - name: Publish monitor result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/apk-monitor
          mkdir /tmp/apk-monitor
          cp android-sleep-apk-monitor.txt /tmp/apk-monitor/
          cd /tmp/apk-monitor
          git init -q
          git checkout -q -b diag/android-sleep-apk-monitor
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m 'Record Android sleep APK build status'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin HEAD:refs/heads/diag/android-sleep-apk-monitor
