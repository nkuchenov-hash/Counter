name: Shell voice input finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'refactor/shell-voice-input-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shell-voice-input-20260818
          fetch-depth: 0
      - name: Apply split
        shell: bash
        run: |
          python scripts/manual/_finalize_shell_voice_input_split.py
          git rm scripts/manual/_finalize_shell_voice_input_split.py
          git rm .github/workflows/shell-voice-input-finalize.yml
          git diff --check
      - name: Architecture
        shell: pwsh
        run: ./scripts/audit/architecture_guard.ps1 -Strict
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Prepare
        shell: bash
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' "  static const String placeholder = '';" '}' > lib/core/env/env.dart
          flutter pub get
      - name: Analyze compile errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Hygiene
        shell: bash
        run: |
          rm -f lib/core/env/env.dart
          git diff --check
      - name: Commit verified split
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Split generic voice input from desktop routing'
          git push origin HEAD:refactor/shell-voice-input-20260818
