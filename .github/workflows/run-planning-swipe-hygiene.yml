name: Run Planning swipe architecture cleanup

on:
  push:
    branches: [fix/planning-time-swipe-jank]

permissions:
  contents: write

jobs:
  patch-test-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-time-swipe-jank
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply architecture cleanup
        run: python .github/scripts/fix_planning_swipe_hygiene.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/features/planning/planning_page.dart lib/features/planning/planning_page_shell.dart lib/features/planning/time_view/time_view_hour_grid.dart test/auto_plan_nearest_free_slot_test.dart
      - name: Enforce PlanningPage ratchet
        run: |
          lines=$(wc -l < lib/features/planning/planning_page.dart)
          echo "planning_page.dart lines=$lines"
          test "$lines" -le 1883
      - name: Run planner regression suite
        run: flutter test test/auto_plan_nearest_free_slot_test.dart
      - name: Analyze swipe owners
        run: flutter analyze lib/features/planning/planning_page.dart lib/features/planning/planning_page_shell.dart lib/features/planning/time_view/time_view_hour_grid.dart --no-fatal-infos --no-fatal-warnings
      - name: Remove one-shot files and stage cleanup
        run: |
          rm -f .github/scripts/fix_planning_swipe_hygiene.py
          rm -f .github/workflows/run-planning-swipe-hygiene.yml
          git add -A
      - name: Verify documentation parity
        run: python scripts/audit/documentation_parity.py
      - name: Verify repository hygiene
        env:
          STRUCTURE_GROWTH_BASE: origin/main
        run: python scripts/audit/repository_hygiene.py
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep Planning Time swipe fix inside architecture ratchet"
          git push origin HEAD:fix/planning-time-swipe-jank
