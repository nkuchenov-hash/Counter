name: Verify Google Health cloud sync

on:
  push:
    branches:
      - fix/google-health-cloud-sleep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate PocketBase JavaScript
        run: |
          node --check pb_hooks/sleep_sync.pb.js
          node --check pb_migrations/1786550000_google_health_history.js

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Create env.dart
        run: |
          mkdir -p lib/core/env
          printf '%s\n' 'abstract final class Env {' '  static const String placeholder = '\'''\'';' '}' > lib/core/env/env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze changed client surface
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/data/health/cloud_sleep_sync_service.dart lib/features/settings/health/health_connect_settings_section.dart

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-tree-shake-icons

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: counter-google-health-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
