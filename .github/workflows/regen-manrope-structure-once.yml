name: Refresh canonical structure after Manrope swap
on:
  push:
    branches: [fix/tecno-menu-card-hover-brand-20261105]
    paths: [.github/workflows/regen-manrope-structure-once.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Generate structure and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/regen-manrope-structure-once.yml
          python scripts/manual/generate_app_structure_detailed.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/APP_STRUCTURE_DETAILED.md
          git commit -m "docs: regenerate tracked app structure for Manrope assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
