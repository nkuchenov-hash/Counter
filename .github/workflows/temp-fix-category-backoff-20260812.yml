name: Temporary category backoff startup fix

on:
  push:
    paths:
      - '.github/workflows/temp-fix-category-backoff-20260812.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch startup catalog hydration
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/data/db_core.dart')
          s = p.read_text()

          old_wear = '''  Future<void> _loadInnerWearLiteAfterProfile() async {\n    if (_pbHttpBackoffActive) {'''
          new_wear = '''  Future<void> _loadInnerWearLiteAfterProfile() async {\n    // Category hydration is cache-safe under PocketBase backoff. Never render\n    // a partial shell with records but an empty category tree.\n    await _loadRulesFromNoco();\n    if (_pbHttpBackoffActive) {'''
          if s.count(old_wear) != 1:
              raise SystemExit(f'wear startup anchor count={s.count(old_wear)}')
          s = s.replace(old_wear, new_wear, 1)

          old_wear_online = '''    }\n    await _loadRulesFromNoco();\n    await bootstrapTimelineRecordsCacheFromPrefsAtBoot();'''
          new_wear_online = '''    }\n    await bootstrapTimelineRecordsCacheFromPrefsAtBoot();'''
          if s.count(old_wear_online) != 1:
              raise SystemExit(f'wear online anchor count={s.count(old_wear_online)}')
          s = s.replace(old_wear_online, new_wear_online, 1)

          old_main = '''  Future<void> _loadInnerAfterProfile() async {\n    if (_pbHttpBackoffActive) {'''
          new_main = '''  Future<void> _loadInnerAfterProfile() async {\n    // Always hydrate categories before the shell is marked initialized.\n    // _loadRulesFromNoco() falls back to the last-known local catalog when\n    // PocketBase is unavailable, so transient backoff cannot blank categories.\n    await _loadRulesFromNoco();\n    if (_pbHttpBackoffActive) {'''
          if s.count(old_main) != 1:
              raise SystemExit(f'main startup anchor count={s.count(old_main)}')
          s = s.replace(old_main, new_main, 1)

          old_main_online = '''      return;\n    }\n    await _loadRulesFromNoco();\n    await bootstrapTimelineRecordsCacheFromPrefsAtBoot(criticalOnly: true);'''
          new_main_online = '''      return;\n    }\n    await bootstrapTimelineRecordsCacheFromPrefsAtBoot(criticalOnly: true);'''
          if s.count(old_main_online) != 1:
              raise SystemExit(f'main online anchor count={s.count(old_main_online)}')
          s = s.replace(old_main_online, new_main_online, 1)

          p.write_text(s)
      - name: Verify surgical diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- lib/data/db_core.dart
          test "$(git diff --name-only | wc -l)" -eq 1
          grep -A6 'Future<void> _loadInnerAfterProfile' lib/data/db_core.dart | grep -q 'await _loadRulesFromNoco();'
          grep -A6 'Future<void> _loadInnerWearLiteAfterProfile' lib/data/db_core.dart | grep -q 'await _loadRulesFromNoco();'
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nkuchenov-hash'
          git config user.email 'nkuchenov@gmail.com'
          git add lib/data/db_core.dart
          git commit -m 'Hydrate categories during PocketBase backoff startup'
          git push origin HEAD:main
